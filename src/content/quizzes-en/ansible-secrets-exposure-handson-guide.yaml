questions:
  - question: "What happens if you run a Playbook with the -v option without setting no_log?"
    choices:
      - "Nothing is displayed at all"
      - "The full command line is output, displaying secrets like a password as-is"
      - "The password is automatically masked"
      - "The run itself fails with an error"
    answerIndex: 1
    explanation: "Without no_log set, running with -v displays the full command line exactly as-is, including the secret it contains."

  - question: "What does `no_log: true` suppress?"
    choices:
      - "Visibility on the target host's process list"
      - "Ansible's own log output"
      - "All network communication content"
      - "Commit history in a Git repository"
    answerIndex: 1
    explanation: "no_log only suppresses Ansible's own log output — it doesn't prevent visibility on the target host's process list."

  - question: "Which leak path does no_log fail to prevent, even when set?"
    choices:
      - "Output into Ansible's verbose log"
      - "A command's arguments being visible in the target host's process list (e.g., ps aux) while it's running"
      - "The content of a file encrypted with Ansible Vault"
      - "Password entry during an SSH connection"
    answerIndex: 1
    explanation: "Since no_log only suppresses Ansible's own log output, it doesn't prevent the path where a command's arguments are visible on the target host's process list while it's running."

  - question: "What's the risk of embedding an untrusted, externally supplied value directly into the shell module?"
    choices:
      - "It just slows down execution"
      - "There's a shell injection risk where everything after a ; in the value gets executed as a separate command"
      - "Ansible automatically rejects it as an error, so there's no real harm"
      - "It only affects logs, not actual execution"
    answerIndex: 1
    explanation: "Embedding an untrusted value directly into the shell module creates a shell injection risk, where everything after a ; in that value gets executed as a separate command."

  - question: "What's the best real countermeasure against shell injection?"
    choices:
      - "Speed up the shell module's execution"
      - "If a dedicated module (user, mysql_user, etc.) exists, consider it first and avoid embedding directly into the shell module"
      - "Encrypt every variable with Vault"
      - "Setting no_log also prevents shell injection"
    answerIndex: 1
    explanation: "Dedicated modules are designed to handle parameters safely internally, so considering a dedicated module first, rather than embedding directly into shell, is the fundamental countermeasure."
