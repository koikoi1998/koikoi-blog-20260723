questions:
  - question: "What level of privilege does an attacker need to carry out Kerberoasting?"
    choices:
      - "Domain Admins rights are required"
      - "Any authenticated ordinary domain user, with no special rights, can carry it out"
      - "Prior access rights to the target service are required"
      - "Physical access rights to a domain controller are required"
    answerIndex: 1
    explanation: "Kerberoasting can be carried out by any authenticated domain user, with no special rights, and no access rights to the target service at all."

  - question: "What's the fundamental reason Kerberoasting is considered a \"designed property\" rather than a \"vulnerability\"?"
    choices:
      - "Microsoft is deliberately leaving a vulnerability unpatched"
      - "The KDC never checks, at ticket-issuance time, whether the requester actually has permission to access that service"
      - "Kerberos doesn't use encryption at all"
      - "This is a new problem that only occurs on Windows Server 2025"
    answerIndex: 1
    explanation: "The KDC doesn't check permissions at ticket-issuance time — that check happens only when the ticket is actually presented to the service. Since this design is Kerberos working correctly, it's a designed property, not a vulnerability."

  - question: "What is the only effective countermeasure against Kerberoasting?"
    choices:
      - "Adding more DCs"
      - "Raising the service account's password strength to an effectively unbreakable level"
      - "Adding every user to Domain Admins"
      - "Blocking all Kerberos traffic at the firewall"
    answerIndex: 1
    explanation: "The only effective countermeasure is raising the strength of the key encrypting the service ticket — the service account's password itself — to an unbreakable level."

  - question: "Why does the RC4 encryption type give an attacker an edge over AES in Kerberoasting?"
    choices:
      - "RC4 is a newer encryption method than AES"
      - "A ticket encrypted with RC4 can be attacked with dramatically less computational effort than one encrypted with AES"
      - "RC4 can't be used with Kerberos at all"
      - "RC4 stores the password as plaintext without encrypting it"
    answerIndex: 1
    explanation: "A ticket encrypted with RC4 can be attacked with dramatically less computational effort than one encrypted with AES, giving the attacker an advantage."

  - question: "Why is migrating to a gMSA effective as a Kerberoasting countermeasure?"
    choices:
      - "A gMSA doesn't use Kerberos authentication at all"
      - "A gMSA's password is a long, random string generated by AD DS itself, effectively unbreakable"
      - "A gMSA refuses to have service tickets issued for it at all"
      - "A gMSA automatically adds firewall rules"
    answerIndex: 1
    explanation: "A gMSA's password is a long string generated by AD DS itself with no human involvement, giving it effectively unbreakable strength against dictionary and brute-force attacks."
