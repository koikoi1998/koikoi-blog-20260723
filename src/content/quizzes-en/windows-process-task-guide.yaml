questions:
  - question: "Which statement best matches the article's explanation of the relationship between process, thread, and task?"
    choices:
      - "All three are exactly the same concept, just called by different names"
      - "Task is a unit of work from the user's perspective, process is a unit of resource management the OS handles, and thread is the smallest unit of processing executed within a process — distinct concepts related in a hierarchy"
      - "A thread is a larger concept than a process, and a single thread contains multiple processes"
      - "Task is the name of a hardware component in the CPU"
    answerIndex: 1
    explanation: "Task refers to \"one piece of work\" from the user's perspective, process is the independent unit of memory space and resources the OS allocates to a running program, and thread is the smallest unit of processing executed within that process. These are distinct concepts related in a hierarchy."

  - question: "Which statement best matches the article's explanation of the origin and original meaning of the term \"zombie process\"?"
    choices:
      - "It originates from the process model of Unix-family OSes, referring to a state where a child process's actual work has finished, but only its management information lingers because the parent process hasn't yet retrieved its exit status"
      - "Zombie process is a technical term referring to a type of computer virus"
      - "Zombie process is a term referring to a state where the CPU's temperature has become abnormally high"
      - "The term zombie process is a trademark uniquely defined internally by Windows"
    answerIndex: 0
    explanation: "The term zombie process originates from the process model of Unix-family OSes. It refers to a state where a child process's actual work (its executable code and most of its memory) has already been released, but its process table entry lingers on until the parent process retrieves its exit status via an operation called wait()."

  - question: "Which statement best matches the article's explanation of the phenomenon where Google Drive disappears from File Explorer and killing its process in Task Manager fixes it?"
    choices:
      - "If its main display/response handling crashes or hangs for some reason, the process itself may not fully terminate right away and can linger in a half-finished state — killing it manually lets the OS correctly release its resources"
      - "Google Drive is specified to always automatically crash every 24 hours"
      - "Killing the process in Task Manager deletes the Google Drive account itself"
      - "This phenomenon can never happen, regardless of the Windows version"
    answerIndex: 0
    explanation: "A background program like a cloud storage client can, if its main display/response handling crashes or hangs for some reason, fail to fully terminate right away and linger in a half-finished state. Manually killing it in Task Manager lets the OS correctly release its resources so it can start cleanly again after a restart."

  - question: "Which caveat does the article raise about killing a process in Task Manager as a fix?"
    choices:
      - "Killing the process also automatically resolves the root cause that caused that state (a bug, a deadlock, and so on)"
      - "Killing a process is just a way to force the OS to reclaim a lingering process's resources — it doesn't resolve the root cause itself, so if it happens frequently, investigating the root cause is needed"
      - "Killing a process automatically changes that PC's hardware configuration"
      - "Killing a process is an operation that invalidates Windows license activation"
    answerIndex: 1
    explanation: "Killing a process in Task Manager is just a way to force the OS to reclaim the resources of a lingering process — it doesn't resolve the root cause that caused that state (a bug, a deadlock, and so on). If it happens frequently, investigating the root cause — updating the application, checking its logs — is needed."

  - question: "Which statement best matches the article's recommended first step when someone reports \"the application froze\"?"
    choices:
      - "Just restart the PC — there's no need to investigate the cause"
      - "Check that process's CPU/memory usage trend in Task Manager's \"Details\" tab, to isolate whether it's doing nothing at all or stuck churning away at something"
      - "Immediately force-kill the process and never investigate the cause at all"
      - "Calling the application's vendor is the only available course of action"
    answerIndex: 1
    explanation: "A top-1% engineer checks that process's CPU/memory usage trend in Task Manager's \"Details\" tab, to isolate whether it's doing nothing at all or stuck churning away at something. A lingering, zombie-like state usually shows near-zero CPU usage, while a bug like an infinite loop keeps CPU usage pinned high — that one extra step changes the direction of the investigation."
