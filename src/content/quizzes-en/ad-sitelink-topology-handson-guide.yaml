questions:
  - question: "What does a site link's -Cost parameter represent?"
    choices:
      - "The actual bandwidth of the line itself"
      - "An abstract number an administrator uses to express path preference"
      - "The upper limit of data volume that can flow over that site link"
      - "The site link's physical distance, in kilometers"
    answerIndex: 1
    explanation: "Cost isn't a direct representation of actual bandwidth — it's an abstract number an administrator uses to express path preference. The KCC picks whichever path has the lowest total cost."

  - question: "Why can replication still occur between Osaka and Nagoya even with no direct site link between them?"
    choices:
      - "It's an AD DS bug"
      - "Site link transitivity (bridging), enabled by default, lets an indirect path be calculated automatically"
      - "Every DC automatically ends up in the same site"
      - "Osaka and Nagoya happen to share the same subnet"
    answerIndex: 1
    explanation: "Because site link transitivity (bridging) is enabled by default, an indirect path through Tokyo gets automatically calculated by the KCC."

  - question: "When multiple paths exist, which one does the KCC prefer?"
    choices:
      - "Whichever path was created earliest"
      - "Whichever path has the lowest total cost"
      - "Whichever path passes through the most sites"
      - "Whichever path includes a site name that comes first alphabetically"
    answerIndex: 1
    explanation: "When multiple paths exist, the KCC automatically picks whichever one has the lowest total cost."

  - question: "Which statement about a connection object generated by the KCC is correct?"
    choices:
      - "Once generated, it's never changed again"
      - "The topology is re-evaluated every 15 minutes by default, revisiting paths as needed"
      - "A manually created connection object always takes precedence over one the KCC generated"
      - "Only one connection object can exist per forest"
    answerIndex: 1
    explanation: "The KCC re-evaluates the topology every 15 minutes by default, giving it a self-healing property that automatically revisits paths when a failure occurs."

  - question: "What's the main benefit of keeping site link transitivity (bridging) enabled?"
    choices:
      - "It automatically strengthens replication security"
      - "It removes the need to create a site link between every single pair of locations as your location count grows"
      - "It automatically increases inter-site replication frequency"
      - "It reduces load on the DNS server"
    answerIndex: 1
    explanation: "Site link transitivity automatically calculates indirect paths by combining existing site links, removing the need to create a site link for every possible pair of locations."
