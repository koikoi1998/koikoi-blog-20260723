questions:
  - question: "What is a filename, actually?"
    choices:
      - "The file's substance itself"
      - "Merely a \"label\" (a directory entry) pointing at an inode number"
      - "Configuration information for the entire filesystem"
      - "A temporary identifier generated by the kernel"
    answerIndex: 1
    explanation: "A filename isn't the file's substance itself — it's merely a \"label\" (a directory entry) pointing at an inode number."

  - question: "What's the relationship between the two names created by a hard link?"
    choices:
      - "One is the \"original name\" and the other is a subordinate \"link\""
      - "There's no distinction over which is the original — they're two perfectly equal entry points into the same file"
      - "Deleting one automatically deletes the other too"
      - "Modifying one never affects the other"
    answerIndex: 1
    explanation: "The two names created by a hard link carry no distinction over which is \"the original\" — they're two perfectly equal entry points into the same inode."

  - question: "What's a plausible cause of deleting a file (rm) without any increase in free disk space?"
    choices:
      - "The disk has a physical failure"
      - "A process is still running with that file open, and the link count hasn't reached zero"
      - "The filesystem's cache is corrupted"
      - "The filename is too long"
    answerIndex: 1
    explanation: "rm only deletes the directory entry and decrements the link count by one — as long as a process still has that file open, the link count never reaches zero, and the data blocks never get freed."

  - question: "What is a symbolic link, actually?"
    choices:
      - "Another equal name for an existing inode"
      - "An independent file with its own inode, whose content is just a path string"
      - "Just another name for a hard link"
      - "A kind of filesystem configuration file"
    answerIndex: 1
    explanation: "A symbolic link is itself a completely independent file with its own inode, whose content is a string representing the path to its target."

  - question: "What constraint does a hard link carry that a symbolic link doesn't?"
    choices:
      - "A hard link can't have its content modified"
      - "A hard link can only be created within the same filesystem, and can never point at a directory"
      - "A hard link can't be created without root privileges"
      - "A hard link can only ever be created once, for a given file"
    answerIndex: 1
    explanation: "A hard link can't be created across filesystems since inode numbers are only unique within each filesystem, and most implementations also prohibit hard links to directories to avoid cycles."
