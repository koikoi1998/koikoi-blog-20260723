questions:
  - question: "What information does an L4 load balancer use to make its routing decision?"
    choices:
      - "The HTTP request's URL path and cookies"
      - "The TCP/UDP header's source and destination IP addresses and port numbers"
      - "The content of the HTTP response body"
      - "A DNS record's TTL value"
    answerIndex: 1
    explanation: "An L4 load balancer distributes traffic using only transport-layer header information — IP addresses and port numbers."

  - question: "Why does an L7 load balancer cost more to process than an L4 load balancer?"
    choices:
      - "Because it can only ever handle encrypted traffic"
      - "Because it actually has to interpret the HTTP request's content"
      - "Because it internally relies on DNS round robin"
      - "Because it always requires more backend servers"
    answerIndex: 1
    explanation: "An L7 load balancer has to actually interpret HTTP content, like the URL path or headers, so it costs more to process than L4."

  - question: "What's the correct description of a VIP (Virtual IP)?"
    choices:
      - "The real IP address of one specific backend server"
      - "A virtual IP address published by the load balancer itself, with no real entity behind it"
      - "An IP address automatically generated by a DNS server"
      - "An IP address assigned to the client's own device"
    answerIndex: 1
    explanation: "A VIP is a virtual IP address published by the load balancer itself, while the real backend servers stay hidden from the client."

  - question: "Why isn't DNS round robin considered a \"real\" load balancer?"
    choices:
      - "Because it merely changes the order of a DNS response, with no health checks or fine-grained routing logic"
      - "Because the DNS protocol itself doesn't use TCP"
      - "Because DNS round robin only provides L7 features"
      - "Because DNS round robin only supports encrypted traffic"
    answerIndex: 0
    explanation: "DNS round robin is the simplest possible distribution method, merely changing a DNS response's order, with no health checks or flexible routing logic."

  - question: "What's the correct pairing for AWS's NLB and ALB?"
    choices:
      - "NLB is L7, and ALB is L4"
      - "NLB is L4, and ALB is L7"
      - "Both NLB and ALB are L4"
      - "Both NLB and ALB are L7"
    answerIndex: 1
    explanation: "AWS's NLB (Network Load Balancer) is L4, and its ALB (Application Load Balancer) is L7."
