questions:
  - question: "Why are mobile apps and SPAs (single-page applications) called \"public clients\"?"
    choices:
      - "It's a generic term for any app published on the internet"
      - "They have no server side at all — no place where a client secret can be safely kept"
      - "They're apps anyone can download for free"
      - "They're apps that don't use OAuth 2.0"
    answerIndex: 1
    explanation: "Mobile apps and SPAs have no server side where a client secret could be safely kept — even embedding one in the app's binary or code gets it extracted through reverse engineering — which is why they're called public clients."

  - question: "What's the correct relationship between PKCE's code_verifier and code_challenge?"
    choices:
      - "code_verifier and code_challenge are always the same fixed value"
      - "code_challenge is the SHA-256 hash of code_verifier"
      - "code_challenge is sent only during the authorization code exchange"
      - "code_verifier is a value generated by the authorization server"
    answerIndex: 1
    explanation: "The app generates a random code_verifier and sends code_challenge, its SHA-256 hash, in the initial authorization request. During the code exchange, it sends the original, unhashed code_verifier itself."

  - question: "Why does an exchange request fail even if an attacker intercepts the authorization code, with PKCE in place?"
    choices:
      - "The authorization code itself automatically becomes invalid the instant it's intercepted"
      - "The attacker doesn't have the code_verifier, which exists only inside the legitimate app's memory"
      - "PKCE encrypts the authorization code itself"
      - "Attackers are never allowed an internet connection"
    answerIndex: 1
    explanation: "code_verifier exists only inside the legitimate app's memory and never travels over the network. If the attacker sends an exchange request with only the intercepted code, the hash never matches without the correct code_verifier, and it gets rejected."

  - question: "How does OAuth 2.1 treat PKCE?"
    choices:
      - "PKCE usage is limited only to public clients"
      - "PKCE is mandatory for every client, including confidential clients that hold a client secret"
      - "PKCE was deprecated under OAuth 2.1"
      - "PKCE was downgraded to an optional recommendation under OAuth 2.1"
    answerIndex: 1
    explanation: "Under OAuth 2.1, instead of relying on a single defense (the client secret) alone, PKCE's layered defense is mandatory for every client, including confidential ones."

  - question: "What makes an authorization code interception attack possible on a mobile OS?"
    choices:
      - "Every mobile OS completely bans registering a custom URL scheme"
      - "Multiple apps can sometimes register the exact same custom URL scheme"
      - "Mobile apps can't perform any network communication at all"
      - "The authorization server always sends tokens in plaintext"
    answerIndex: 1
    explanation: "On mobile OSes, multiple apps can sometimes register the exact same custom URL scheme, and a malicious app registering the same redirect URL as the legitimate one can potentially intercept the authorization code first."
