questions:
  - question: "What is the single biggest characteristic of a gMSA (group Managed Service Account)?"
    choices:
      - "It's a more complex version of a fixed password set by an administrator"
      - "AD DS itself automatically generates the password and rotates it automatically"
      - "It's an account that has no password at all"
      - "It can only be used on servers that aren't domain-joined"
    answerIndex: 1
    explanation: "A gMSA has its password automatically generated by AD DS itself, and automatically rotated roughly every 30 days by default."

  - question: "After creating a new KDS root key in production, how long should you expect to wait before a gMSA is actually usable?"
    choices:
      - "It's usable immediately"
      - "About 10 hours (until replication to every DC completes)"
      - "About a week"
      - "About a month"
    answerIndex: 1
    explanation: "In production, you need to wait about 10 hours by default after creation, so the KDS root key can reliably replicate out to every DC, before a gMSA can actually be used."

  - question: "What happens if a server not listed in PrincipalsAllowedToRetrieveManagedPassword tries to use that gMSA?"
    choices:
      - "It works without any issue"
      - "It fails to retrieve the password and fails to use it"
      - "That server is automatically added to the allowed list"
      - "The KDS root key gets recreated automatically"
    answerIndex: 1
    explanation: "Only the servers (or groups) listed in PrincipalsAllowedToRetrieveManagedPassword can retrieve a gMSA's current password — any server not listed there fails to retrieve it."

  - question: "What's the biggest difference between a gMSA and its predecessor, the standalone MSA (sMSA)?"
    choices:
      - "sMSA is the newer mechanism"
      - "A gMSA can share the same account across multiple servers, while an sMSA can only be used on one server"
      - "A gMSA has no password, while an sMSA does"
      - "There's no technical difference between the two"
    answerIndex: 1
    explanation: "sMSA was limited to a single server, while gMSA removes that limitation and can share the same account across multiple servers."

  - question: "When setting a service's run-as account to a gMSA, what value goes in the password field?"
    choices:
      - "The KDS root key's value, directly"
      - "An empty password (since the gMSA handles authentication automatically)"
      - "A complex password chosen independently by the administrator"
      - "The domain administrator's password"
    answerIndex: 1
    explanation: "A gMSA's account name gets a trailing $, and the password is left empty. Windows recognizes this account as a gMSA and automatically retrieves the password from AD DS."
