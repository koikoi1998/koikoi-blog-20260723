questions:
  - question: "Why does the Shadow Credentials attack never require the attacker to know the target's password?"
    choices:
      - "Because the target's password is always set to a blank value"
      - "PKINIT is an authentication method using public-key cryptography, letting the attacker authenticate with only their own registered private key"
      - "Because the domain controller disables password authentication entirely"
      - "Because the attacker has already guessed every possible password in advance"
    answerIndex: 1
    explanation: "Unlike ordinary Kerberos authentication, which uses a key derived from the password, PKINIT uses public-key cryptography. The attacker can authenticate via PKINIT using only their own private key, never needing to know the target's password."

  - question: "What permission does an attacker need for the Shadow Credentials attack to succeed?"
    choices:
      - "Domain admin privilege"
      - "Write permission on the target's msDS-KeyCredentialLink attribute (like GenericWrite)"
      - "Physical entry permission to the server room"
      - "Access permission to the target's biometric data"
    answerIndex: 1
    explanation: "What this attack requires is not domain admin privilege, but write permission on the target's msDS-KeyCredentialLink attribute (GenericWrite, GenericAll, and similar)."

  - question: "What environmental prerequisite does the Shadow Credentials attack require?"
    choices:
      - "The target account must be disabled"
      - "The domain controller needs a server authentication certificate for PKINIT, which in many environments gets issued by AD CS"
      - "The network must be completely isolated from the internet"
      - "The target computer must not physically exist"
    answerIndex: 1
    explanation: "This attack requires the domain controller to have a server authentication certificate allowing Kerberos authentication via PKINIT, and in many environments this certificate is issued by AD CS."

  - question: "Why is the Shadow Credentials attack described as a \"quiet\" attack?"
    choices:
      - "Because executing it physically requires a silent keyboard"
      - "Because many organizations don't include changes to the msDS-KeyCredentialLink attribute in their monitoring scope"
      - "Because this attack can only be executed at night"
      - "Because this attack never generates any network communication at all"
    answerIndex: 1
    explanation: "Many organizations don't include changes to the msDS-KeyCredentialLink attribute in their monitoring scope at all, making it easy to overlook compared to well-known techniques like DCSync or Kerberoasting."

  - question: "What underlying premise do RBCD and the Shadow Credentials attack share?"
    choices:
      - "Both absolutely require domain admin privilege"
      - "Both abuse the same premise: write permission on the target object"
      - "Both require physical access to a server"
      - "They share no common premise at all"
    answerIndex: 1
    explanation: "RBCD and the Shadow Credentials attack use different specific steps, but both rest on the exact same underlying premise: write permission on the target object."
