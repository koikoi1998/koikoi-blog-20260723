questions:
  - question: "What does choosing \"vmbr0\" in the Network tab when creating a VM in Proxmox VE mean, according to the article?"
    choices:
      - "It completely isolates the VM from any network"
      - "It attaches the VM to a bridge connected directly to your home LAN, letting the VM get an IP address straight from your router"
      - "vmbr0 always means a NAT-mode network"
      - "vmbr0 is an item for specifying which storage a disk is saved to"
    answerIndex: 1
    explanation: "vmbr0 is commonly used as the bridge connected directly to a home LAN — a VM attached to it can get an IP address straight from the router."

  - question: "What's the correct process for using an OS installation medium (ISO) in Proxmox, according to the article?"
    choices:
      - "Assign the ISO file directly as the VM's disk"
      - "Download the ISO from the distributing site, upload it to Proxmox's \"ISO Images\" storage (or fetch it directly via \"Download from URL\"), then select it when creating the VM"
      - "The ISO is fetched automatically from the internet, so no prep is needed"
      - "The ISO file is never used again once the VM has been created"
    answerIndex: 1
    explanation: "You download the ISO from the distributing site, upload it to Proxmox's storage (or fetch it directly by URL), and select that ISO on the OS tab when creating the VM."

  - question: "Why does the article strongly recommend checking \"Install OpenSSH server\" during the Ubuntu Server installation?"
    choices:
      - "Without it, the OS installation itself fails"
      - "It lets you connect to the VM over SSH once installation finishes, and every hands-on article on this blog assumes an SSH connection from there on"
      - "Checking it dramatically speeds up the OS's boot time"
      - "Without an SSH server, network configuration itself becomes impossible"
    answerIndex: 1
    explanation: "Installing OpenSSH server lets you use an SSH connection, which is easier to copy-paste with than the Console screen. Every hands-on article on this blog assumes an SSH connection from that point on."

  - question: "What should you do right after the Ubuntu Server installation finishes, before rebooting, according to the article?"
    choices:
      - "Nothing — it's fine to just reboot"
      - "Eject the ISO image from the VM's optical drive (or change the boot order) — forgetting this means the installer boots again every time you reboot"
      - "You need to increase the VM's memory before rebooting"
      - "You need to unplug the network cable once"
    answerIndex: 1
    explanation: "Forgetting to eject the ISO image means the installer keeps booting from the optical drive on every reboot. You can unmount the ISO from the VM's \"Hardware\" tab in Proxmox."
