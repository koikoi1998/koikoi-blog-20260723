questions:
  - question: "What scope of privileged accounts does this hands-on audit?"
    choices:
      - "Every ordinary user account"
      - "Accounts belonging to the main privileged groups, like Administrators, Domain Admins, and Enterprise Admins"
      - "Computer accounts only"
      - "Disabled accounts only"
    answerIndex: 1
    explanation: "This hands-on audits accounts belonging to the main privileged groups: Administrators, Domain Admins, and Enterprise Admins."

  - question: "What does it mean when an account's `whenCreated` and `PasswordLastSet` are nearly identical?"
    choices:
      - "That account has never once been logged into"
      - "The password set at creation has never once been changed"
      - "That account will soon be automatically deleted"
      - "That account is disabled"
    answerIndex: 1
    explanation: "whenCreated and PasswordLastSet being nearly identical means the password set at creation has never once been changed."

  - question: "Why is resetting an important account's password twice, rather than just once, sometimes recommended?"
    choices:
      - "Because the first reset always fails"
      - "Because an internal AD implementation quirk can first write new key material into a staging area, promoting it to the active area only at the next change"
      - "To work around a password length limit"
      - "To conserve network bandwidth"
    answerIndex: 1
    explanation: "Due to an internal AD implementation quirk, new key material can first get written into a staging area (KerberosNew), only getting promoted to the active area the next time the password changes again."

  - question: "What should you check after resetting a password?"
    choices:
      - "Only that the password length is within policy"
      - "That this account's change has correctly replicated to every DC, including the new one"
      - "Only that the account isn't disabled"
      - "Nothing needs to be checked"
    answerIndex: 1
    explanation: "After resetting a password, you need to confirm it replicated correctly to every DC, including the new one, using something like repadmin /showrepl."

  - question: "How does this hands-on frame auditing privileged accounts?"
    choices:
      - "A one-time, special task only needed at the time of a DC replacement"
      - "A task that should be performed repeatedly, as part of regular security operations"
      - "A task too specialized for anyone but a security specialist"
      - "A task that, once performed, never needs doing again"
    answerIndex: 1
    explanation: "Since the risk tied to password age keeps accumulating continuously, this audit should be performed repeatedly, as part of regular security operations, not only tied to a DC replacement."
