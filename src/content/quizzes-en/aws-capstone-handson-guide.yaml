questions:
  - question: "What distinguishes this capstone project's format from earlier AWS hands-on labs?"
    choices:
      - "It requires executing a fixed procedure faster"
      - "It presents only requirements, requiring you to design which AWS services to combine and how"
      - "It requires learning exactly one new AWS service"
      - "It requires using only the Management Console, never the AWS CLI"
    answerIndex: 1
    explanation: "This capstone takes a format much closer to real-world work, requiring you to design from requirements rather than follow a fixed procedure."

  - question: "What's the final deliverable this capstone project actually requires?"
    choices:
      - "Only screenshots proving it worked"
      - "A portfolio-assembled deliverable including a document articulating the reasoning behind your design decisions"
      - "Only a list of AWS CLI commands"
      - "A verbal explanation alone, with no documentation needed"
    answerIndex: 1
    explanation: "The deliverable needs a document articulating why you chose that design, not just proof it worked."

  - question: "Why does this capstone adopt a \"fictional e-commerce migration\" setting?"
    choices:
      - "Because an e-commerce site is the easiest to build"
      - "Because most real-world AWS projects need to satisfy availability, cost, and security simultaneously"
      - "Because AWS is only used for e-commerce sites"
      - "Because no other scenario is technically feasible"
    answerIndex: 1
    explanation: "This setting was chosen because real-world AWS projects rarely wrap up with a single service rollout — they typically need to satisfy availability, cost, and security at once."

  - question: "What's the correct understanding of the relationship between \"following steps\" and \"designing from requirements\"?"
    choices:
      - "They're exactly the same skill, with no need to distinguish them"
      - "They look similar but are entirely different skills, and completing individual hands-on labs alone doesn't build the latter"
      - "Having the ability to follow steps automatically builds the ability to design"
      - "The ability to design is only ever assessed on certification exams"
    answerIndex: 1
    explanation: "These are similar-looking but entirely different skills, and completing every individual hands-on doesn't build design ability without experience combining them."

  - question: "What completeness bar does this hands-on suggest?"
    choices:
      - "Whether you can finish every requirement in the shortest possible time"
      - "Whether you could show your README.md to an interviewer you've never met and explain your design decisions"
      - "Whether you used the largest possible number of AWS services"
      - "Whether you completed it without ever using the console"
    answerIndex: 1
    explanation: "The suggested bar for completeness is whether you could show your README.md to an unfamiliar interviewer and explain your design decisions."
