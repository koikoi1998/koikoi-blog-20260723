questions:
  - question: "In the L2TP/IPsec server built in this article, which software handles IKE/ESP processing, L2TP tunnel/session processing, and PPP negotiation respectively?"
    choices:
      - "strongSwan handles IKE/ESP, xl2tpd handles L2TP, and pppd handles PPP negotiation"
      - "strongSwan handles everything by itself, while xl2tpd and pppd only produce supplementary log output"
      - "xl2tpd handles both IKE/ESP and L2TP, while strongSwan only handles firewall configuration"
      - "pppd handles IKE/ESP/L2TP/PPP all in one integrated process"
    answerIndex: 0
    explanation: "In this article's setup, strongSwan handles IKE/ESP processing, xl2tpd handles L2TP tunnel/session processing, and pppd (invoked internally by xl2tpd) handles PPP negotiation."

  - question: "What reason does the article give for specifying `type=transport` in ipsec.conf?"
    choices:
      - "Tunnel mode is an old specification that's now deprecated"
      - "Because L2TP already provides its own tunneling function, there's no need to stack IPsec's tunnel mode on top of it, so transport mode is sufficient"
      - "xl2tpd is specified to refuse to start unless transport mode is used"
      - "The client OS doesn't support tunnel mode"
    answerIndex: 1
    explanation: "Since L2TP already plays the role of creating a virtual tunnel, stacking IPsec's tunnel mode on top would just add a redundant, wasteful extra IP header. Transport mode is sufficient."

  - question: "When you count the actual IKEv1 message exchange from the tcpdump capture in this article, how many round trips does the theory predict, as explained in the article?"
    choices:
      - "9 round trips total: Phase 1 (Main Mode, 6 round trips) plus Phase 2 (Quick Mode, 3 round trips)"
      - "Just 1 round trip, completed entirely within Phase 1"
      - "4 round trips, the same as IKEv2"
      - "The round-trip count is completely random depending on implementation, with no theoretical value"
    answerIndex: 0
    explanation: "As explained in the vpn-protocols-comparison-guide article, IKEv1 performs 9 round trips of message exchange total — Phase 1 (Main Mode, 6 round trips) plus Phase 2 (Quick Mode, 3 round trips) — and this article has you confirm that by actually counting an captured exchange."

  - question: "After connecting a Windows client and checking the PPP adapter with `ipconfig /all`, what does the subnet mask show, and what does that mean?"
    choices:
      - "255.255.255.0, meaning it's treated the same as an ordinary LAN"
      - "255.255.255.255, which is evidence that this link is treated not as a \"network\" but as a \"1-to-1 dedicated link\""
      - "0.0.0.0, meaning no IP address has been assigned yet"
      - "255.255.0.0, meaning the link spans multiple segments"
    answerIndex: 1
    explanation: "The PPP adapter's subnet mask ends up as 255.255.255.255 (/32), which is direct evidence that broadcast and ARP don't work on this point-to-point link. That's exactly why an explicit gateway must be specified."

  - question: "What shows up in the gateway column for the PPP-adapter route you can see with `route print`?"
    choices:
      - "It always shows 0.0.0.0, indicating no gateway exists"
      - "The numeric value set as `local ip` in xl2tpd.conf, shown as-is"
      - "Not a number — \"On-link,\" because a point-to-point link has only one possible next hop. Running `tracert` confirms the actual first hop really is the server's `local ip`"
      - "The DNS server's IP address"
    answerIndex: 2
    explanation: "Because a point-to-point link like PPP has only one possible next hop, Windows shows the gateway as \"On-link\" rather than spelling out a number. That doesn't mean there's no gateway, though — running tracert shows the first hop really is the server's local ip, confirming the server genuinely functions as the gateway."

  - question: "What does the article say you'll observe in a tcpdump capture when connecting from a client to the server through an extra layer of NAT inside PVE?"
    choices:
      - "All IKE exchanges switch over to TCP"
      - "The IKE Phase 1 messages include a NAT-D payload, subsequent traffic floats from UDP port 500 to UDP port 4500, and ESP packets arrive further encapsulated inside a UDP header"
      - "The L2TP tunnel fails to establish and PPP negotiation is skipped entirely"
      - "The ESP packet's protocol number automatically changes from 50 to 51"
    answerIndex: 1
    explanation: "Under NAT, detection via the NAT-D payload in IKE Phase 1 triggers a float from UDP port 500 to UDP port 4500, and you can observe, as real packets, ESP packets arriving further encapsulated inside a UDP header."

  - question: "What weakness in the PSK configuration built in this hands-on article does the article describe?"
    choices:
      - "A PSK is automatically regenerated at random for every connection, making operational management cumbersome"
      - "The pre-shared key set in ipsec.secrets is shared by every connecting client, so IPsec-layer authentication becomes \"anyone can open a tunnel with the same key,\" and per-user authentication ends up depending entirely on the PPP layer"
      - "The PSK setup makes it possible to skip PPP-layer authentication entirely"
      - "The PSK method cannot be used together with NAT-T"
    answerIndex: 1
    explanation: "Because the PSK in ipsec.secrets is shared across all clients, IPsec-layer authentication alone can't distinguish individual users — per-user authentication ends up depending entirely on the PPP layer's username and password."

  - question: "What does the article say the performance baseline recorded with `iperf3` in this article is used for?"
    choices:
      - "It's a number required for strongSwan's license activation"
      - "As a baseline for comparing performance against OpenVPN/WireGuard in the next hands-on article"
      - "To automatically adjust PVE's resource allocation"
      - "To automatically select IKE Phase 1's cryptographic algorithm"
    answerIndex: 1
    explanation: "The L2TP/IPsec throughput and IKE negotiation time recorded in this article become the baseline used in the next hands-on article (comparing performance against OpenVPN/WireGuard) to evaluate the performance gap between user-space and kernel-space implementations."
