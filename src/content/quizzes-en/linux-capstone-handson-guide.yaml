questions:
  - question: "What distinguishes this capstone project's format from earlier Linux Infrastructure Department hands-on labs?"
    choices:
      - "It requires executing a fixed procedure faster"
      - "It presents only requirements, requiring you to design which techniques to combine and how"
      - "It requires learning exactly one new programming language"
      - "It forces you to use only Nginx"
    answerIndex: 1
    explanation: "This capstone takes a format much closer to real-world work, requiring you to design from requirements rather than follow a fixed procedure."

  - question: "What's the final deliverable this capstone project actually requires?"
    choices:
      - "Only a confirmation that the configuration worked"
      - "A portfolio-assembled deliverable including the reasoning behind your design decisions and an incident response runbook"
      - "Only a list of Linux distributions used"
      - "A verbal explanation alone, with no documentation needed"
    answerIndex: 1
    explanation: "The deliverable needs a document articulating why you chose that design and an incident response runbook, not just confirmation it worked."

  - question: "Why does this capstone adopt a \"multiple apps coexisting, with least privilege\" setting?"
    choices:
      - "Because a single purpose is harder to build"
      - "Because most real-world Linux server operation needs to satisfy isolating multiple apps, restricting traffic, minimizing privilege, and incident investigability at once"
      - "Because a Linux server is only ever used for multiple apps to coexist"
      - "Because no other scenario is technically feasible"
    answerIndex: 1
    explanation: "This setting was chosen because real-world Linux server operation rarely wraps up with a single purpose — it typically needs to satisfy multiple axes at once."

  - question: "What's the correct understanding of the relationship between \"following steps\" and \"designing from requirements\"?"
    choices:
      - "They're exactly the same skill, with no need to distinguish them"
      - "They look similar but are entirely different skills, and completing individual hands-on labs alone doesn't build the latter"
      - "Having the ability to follow steps automatically builds the ability to design"
      - "The ability to design is only ever assessed on certification exams"
    answerIndex: 1
    explanation: "These are similar-looking but entirely different skills, and completing every individual hands-on doesn't build design ability without experience combining them."

  - question: "What completeness bar does this hands-on suggest?"
    choices:
      - "Whether you can finish every requirement in the shortest possible time"
      - "Whether you could show your README.md to an interviewer you've never met and explain your design decisions"
      - "Whether you used the largest possible number of applications"
      - "Whether you completed it without ever using root privilege"
    answerIndex: 1
    explanation: "The suggested bar for completeness is whether you could show your README.md to an unfamiliar interviewer and explain your design decisions."
