questions:
  - question: "What two axes does the article say run through the FHS's design philosophy?"
    choices:
      - "File size, and whether it's compressed"
      - "Host-specific vs. shareable, and static (immutable) vs. mutable"
      - "Whether root privileges are required, and whether it's encrypted"
      - "Whether it's accessed over the network, and whether it's binary or text"
    answerIndex: 1
    explanation: "The FHS explains each directory's role along two axes: \"is this host-specific, or shareable/reusable across multiple machines?\" and \"is this static data that never changes, or mutable data rewritten during operation?\""

  - question: "Why is /etc classified as \"host-specific, mutable\"?"
    choices:
      - "Files under /etc are automatically encrypted"
      - "Config under /etc is, in most cases, content specific to that one machine, hand-edited by an administrator"
      - "/etc can only be accessed over a network"
      - "Files under /etc are auto-generated by the package management system, and humans never touch them"
    answerIndex: 1
    explanation: "Config files under /etc are content specific to that particular machine, and mutable data that an administrator hand-edits — which is exactly why /etc is the standard home for the \"host-specific, mutable\" category."

  - question: "Why is a manually edited config under /etc likely to survive a package update that replaces the program bodies under /usr with a new version?"
    choices:
      - "/usr and /etc are forcibly separated onto different disk partitions"
      - "The program body (/usr) and the config (/etc) are physically kept in separate directories, and the package management system often detects manual edits under /etc and avoids blindly overwriting them"
      - "Files under /etc are configured so only root can write to them"
      - "The package management system never references anything under /etc at all"
    answerIndex: 1
    explanation: "Because the program body (/usr, disposable) and the configuration (/etc, precious) are physically kept in separate directories, updates can safely check in on how to reconcile a manually edited config file rather than blindly overwriting it."

  - question: "What does the article say about how /etc and /var are handled in container environments?"
    choices:
      - "Container images can never include /etc or /var at all"
      - "Their \"host-specific, mutable\" nature leads to the design decision of not baking them into the image itself, but treating them as something mounted in from outside at runtime"
      - "The distinction between /etc and /usr is entirely abolished in container environments"
      - "In container environments, every directory is treated the same as /tmp"
    answerIndex: 1
    explanation: "In disposable environments like containers, /etc's and /var's \"host-specific, mutable\" nature directly informs the decision not to bake them into the image, but to inject them at runtime via a bind mount or volume."

  - question: "Per the article, why is the FHS followed by almost every Linux distribution?"
    choices:
      - "The Linux kernel itself technically refuses any file layout that violates the FHS"
      - "The major distributions' package management systems effectively assume that package developers follow the FHS"
      - "Failing to follow the FHS is against the law"
      - "The FHS is baked into an unchangeable hardware specification"
    answerIndex: 1
    explanation: "The FHS is an industry standard maintained by the Linux Foundation, and the kernel itself doesn't enforce it. It's followed almost without exception in practice because major package management systems effectively operate on the assumption that package developers follow it."
