questions:
  - question: "What did the X-Cache header show for the first and second access in this hands-on?"
    choices:
      - "Both were MISS"
      - "The first was MISS, the second was HIT"
      - "Both were HIT"
      - "The first was HIT, the second was MISS"
    answerIndex: 1
    explanation: "The first access wasn't in the cache yet and queried the origin (MISS), while the second was answered instantly from the cache (HIT)."

  - question: "What happened when accessing again, more than 10 seconds after setting max-age=10?"
    choices:
      - "It stayed HIT permanently"
      - "It returned to MISS, triggering a query to the origin server"
      - "It returned an error"
      - "The cache got deleted entirely and the server stopped"
    answerIndex: 1
    explanation: "Once the max-age expiration passes, the next access returns MISS again, triggering a query to the origin."

  - question: "What's the correct behavior when accessing with different Accept-Language headers, with Vary correctly configured?"
    choices:
      - "The same cache is always returned"
      - "Each gets treated as a separate cache, and both show MISS"
      - "The second access returns an error"
      - "The same content is always returned regardless of the language setting"
    answerIndex: 1
    explanation: "With Vary correctly configured, different Accept-Language values get treated as separate caches."

  - question: "What's the true nature of the X-Cache header?"
    choices:
      - "A standard HTTP spec header generated by the origin server"
      - "A header Squid itself attaches to the response, purely for debugging and operational investigation"
      - "A header generated by the client's browser"
      - "A header generated by a DNS server"
    answerIndex: 1
    explanation: "X-Cache was never generated by the origin server — Squid itself attaches it as debug information."

  - question: "What's the downside of specifying too many conditions in Vary?"
    choices:
      - "The cache's storage capacity grows infinitely"
      - "The cache gets split too finely, lowering the hit rate"
      - "The server always crashes"
      - "HTTPS becomes unusable"
    answerIndex: 1
    explanation: "The more conditions specified in Vary, the more finely the cache gets split, lowering the probability of a hit."
