questions:
  - question: "Which statement best matches the article's explanation of the division of labor between IIS and ASP.NET?"
    choices:
      - "IIS and ASP.NET are exactly the same software, just called by different names"
      - "IIS is the web server software itself, accepting HTTP requests, while ASP.NET is one of the application execution frameworks for .NET that runs on top of it"
      - "ASP.NET is the web server software itself, and IIS is the application execution framework that runs on top of it"
      - "IIS is exclusive to Linux, and ASP.NET is exclusive to Windows"
    answerIndex: 1
    explanation: "IIS is the web server software itself, accepting and processing HTTP requests, while ASP.NET is one of the frameworks for running dynamic web applications that runs on top of that IIS foundation. IIS is a general-purpose foundation that doesn't depend on any particular kind of application."

  - question: "Which statement best matches the article's explanation of the role of isolation via IIS application pools?"
    choices:
      - "It isolates multiple websites/applications at the process level, so that an abnormality in one application pool doesn't affect other websites running in a different application pool"
      - "An application pool is a setting for unifying a website's design (appearance)"
      - "An application pool is a database for storing users' login passwords"
      - "An application pool is a feature for managing the number of IIS licenses"
    answerIndex: 0
    explanation: "An application pool is a \"box\" for separating multiple websites/applications at the process level. If an abnormality occurs (a crash, a memory leak) in one application pool, other websites running in a different application pool aren't affected."

  - question: "Which statement best matches the article's explanation of the nature of the Default Web Site?"
    choices:
      - "The Default Web Site is a special entity essential to the system's operation and must never be deleted"
      - "The Default Web Site is simply one of the ordinary website entries provided from the start, and can freely be stopped, deleted, or modified as requirements dictate"
      - "The Default Web Site is a special, restricted site that can never run ASP.NET code at all"
      - "The Default Web Site automatically remains even after uninstalling IIS"
    answerIndex: 1
    explanation: "The Default Web Site is simply the \"first website\" slot IIS comes with from the start — it isn't a special, reserved mechanism. Some configurations use it as-is, while others stop or delete it and run only a custom website."

  - question: "Which statement best matches the article's explanation of the relationship between the \"Default Web Site\" and the \"DefaultAppPool\" application pool?"
    choices:
      - "The Default Web Site and DefaultAppPool are the same object, and deleting one automatically deletes the other"
      - "The Default Web Site (a site) and DefaultAppPool (an application pool) are two separate objects that simply come paired by default, and the assignment can be freely changed"
      - "An application pool is a subfolder contained inside the Default Web Site"
      - "An application pool named DefaultAppPool isn't automatically created when you install the IIS role"
    answerIndex: 1
    explanation: "The Default Web Site (a site with a binding configuration and a physical path) and DefaultAppPool (an application pool) are separate objects. By default, the former is simply assigned to the latter — they're easy to conflate because both carry the name \"Default,\" but the assignment can be freely changed."

  - question: "Which statement best matches the article's explanation of the relationship between a website's host name and a DC's domain name?"
    choices:
      - "There's no direct technical relationship, and when an intranet site shares the same DNS namespace as an AD domain, it's simply an operational choice to reuse the existing AD-integrated DNS infrastructure"
      - "A website's host name must always be a subdomain of AD DS's domain name in order to bind in IIS"
      - "Renaming a DC's domain automatically renames the host names of every website running in that domain"
      - "A website's host name and a DC's domain name must point to the exact same DNS record"
    answerIndex: 0
    explanation: "A binding's host name is just a value that decides which site to route a client to based on the DNS name they resolved — there's no technical requirement for it to belong to AD DS's domain name. When an intranet site shares the same namespace as the AD domain, it's simply an operational choice to reuse the existing AD-integrated DNS infrastructure."

  - question: "Which statement best matches the article's explanation of what a \"website\" actually is?"
    choices:
      - "A website's true identity is a collection of HTML/CSS files itself"
      - "A website's true identity is software (and its configuration) capable of interpreting HTTP and returning a response to a request — HTML/CSS is just one form of content returned as that response"
      - "A website must always have a database built into it"
      - "The concept of a website can't exist without using a framework like ASP.NET"
    answerIndex: 1
    explanation: "A website's true identity isn't a collection of HTML/CSS files — it's software (and its configuration) capable of interpreting HTTP and returning a response to a request. HTML/CSS is merely one form of content returned as that response."

  - question: "Which statement best matches the article's explanation of name-based virtual hosting in binding configuration?"
    choices:
      - "Requests can be routed to different websites based on the value of the Host header in an HTTP request, even with the same IP address and the same port number"
      - "Name-based virtual hosting always requires a separate IP address to run multiple sites"
      - "Name-based virtual hosting is technically impossible to use with HTTPS at all"
      - "Binding configuration is a feature for specifying a website's database connection string"
    answerIndex: 0
    explanation: "A binding is defined by the combination of IP address, port number, and host name (the Host header), so requests can be routed to different websites based on host name even with the same IP address and port number. This is the basic mechanism of name-based virtual hosting, achieved for HTTPS via the SNI extension."

  - question: "Which statement best matches the article's explanation of adding and changing HTTP response headers in IIS?"
    choices:
      - "There's no way to add or change HTTP response headers other than modifying the application's code"
      - "IIS Manager's configuration alone lets you add security-related headers or change/remove server-identifying information, per website or per application"
      - "HTTP response headers are automatically determined by Windows Server's license activation status"
      - "Changing HTTP response headers is impossible unless you downgrade the IIS version"
    answerIndex: 1
    explanation: "IIS Manager lets you add or change custom headers included in the HTTP response, per website or per application. This is achievable purely through IIS-side configuration, separate from modifying the application's code, and is used for adding security-related headers or changing/removing server-identifying information."
