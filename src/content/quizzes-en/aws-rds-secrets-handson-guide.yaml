questions:
  - question: "What's the purpose of specifying `--no-publicly-accessible` when creating an RDS instance?"
    choices:
      - "To reduce the creation cost"
      - "To avoid giving it a public IP, so it's only reachable from within the private subnet"
      - "To enable automatic backups"
      - "To automatically expand storage capacity"
    answerIndex: 1
    explanation: "Never giving RDS a public IP, so it's only reachable from within the private subnet where the legitimate app server runs, is a baseline assumption for production operation."

  - question: "Why doesn't the app's code ever need to contain the DB password?"
    choices:
      - "Because RDS no longer uses password authentication"
      - "Because it fetches the secret from Secrets Manager at runtime, and only obtains the password from there"
      - "Because the password gets automatically disabled"
      - "Because the app has a special setting that lets it connect without a password"
    answerIndex: 1
    explanation: "The app uses the EC2 IAM role's temporary credentials to access Secrets Manager, and only there does it obtain the DB password. The password itself never appears in the code or the SDK call."

  - question: "Which is the appropriate policy design for the Secrets Manager permission granted to the IAM role?"
    choices:
      - "Grant broad permission like SecretsManagerFullAccess"
      - "Grant a least-privilege policy scoped to just one specific secret's ARN"
      - "No permission setting is needed — it becomes accessible automatically"
      - "Embed an IAM user's access key"
    answerIndex: 1
    explanation: "Scoping Resource down to just one specific secret's ARN limits the blast radius, if that EC2 instance is ever compromised, to just that one secret."

  - question: "Which statement about Secrets Manager's automatic rotation feature is correct?"
    choices:
      - "The app's code must be rewritten on every rotation"
      - "A Lambda function automatically keeps the RDS-side password change and the Secrets Manager-side update in sync, with zero app code changes needed"
      - "Rotation can only be run manually"
      - "Enabling rotation requires re-creating the RDS instance"
    answerIndex: 1
    explanation: "The app side stays exactly as-is — 'fetch from Secrets Manager at runtime' — with zero changes needed, and doesn't even need to notice the password quietly rotating underneath it."

  - question: "What's the best reason RDS should be placed in a private subnet?"
    choices:
      - "A private subnet has faster network throughput"
      - "It has no legitimate reason to accept connections from anything other than the proper app server, so it can be configured so the internet can't initiate a connection into it"
      - "RDS can only be created inside a private subnet"
      - "It reduces cost"
    answerIndex: 1
    explanation: "A database has no legitimate reason to accept connections from anything other than its proper application server, so placing it in a private subnet that can't have connections initiated into it from outside is the standard design."
