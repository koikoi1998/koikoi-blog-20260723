questions:
  - question: "IISのリサイクルが存在する目的として正しいのはどれか。"
    choices:
      - "ディスクの空き容量を増やすため"
      - "長時間稼働によるメモリリークやリソースの蓄積に対する、防御的な措置とするため"
      - "ネットワーク帯域を節約するため"
      - "SSL証明書を自動更新するため"
    answerIndex: 1
    explanation: "リサイクルは、長時間稼働し続けるプロセスに蓄積するメモリリークやリソースの断片化への、経験則に基づいた防御的な設計です。"

  - question: "オーバーラップ・リサイクルの挙動として正しいのはどれか。"
    choices:
      - "古いプロセスを即座に終了させ、新しいプロセスを起動する"
      - "新しいプロセスを起動して新規リクエストを振り分け、古いプロセスは処理中のリクエストを完遂してから終了する"
      - "リサイクル中はすべてのリクエストを一時的に拒否する"
      - "リサイクルの間、新旧どちらのプロセスも起動しない"
    answerIndex: 1
    explanation: "オーバーラップ・リサイクルでは、新しいプロセスが新規リクエストを受け付け始め、古いプロセスは処理中のリクエストを完遂してから終了します。"

  - question: "メモリ使用量を基準にしたリサイクル設定についての正しい理解はどれか。"
    choices:
      - "メモリリークというバグそのものを修正する"
      - "症状を一時的に抑え込む延命措置であり、根本原因は修正されていない"
      - "アプリケーションの実行速度を向上させる"
      - "ディスク使用量を自動的に最適化する"
    answerIndex: 1
    explanation: "メモリ使用量によるリサイクルは、メモリリークの症状を一時的に抑える延命措置にすぎず、根本原因の修正にはなりません。"

  - question: "リサイクルの頻度が急に上昇した場合、どう捉えるべきか。"
    choices:
      - "特に気にする必要はない、正常な範囲の変動である"
      - "アプリケーションコード側に対処すべきメモリリークが存在する、重要な兆候として扱う"
      - "サーバーのハードウェア障害を意味する"
      - "IISのライセンスが切れかけていることを意味する"
    answerIndex: 1
    explanation: "リサイクルの頻度が急に上昇している場合、それはアプリケーションコード側のメモリリークを示す重要な兆候として扱うべきです。"

  - question: "リサイクル中に届いたリクエストが失敗しない理由として正しいのはどれか。"
    choices:
      - "リサイクル自体が発生しないよう常に抑制されているため"
      - "オーバーラップ・リサイクルが既定で有効であり、瞬断が発生しない設計になっているため"
      - "リクエストが自動的に別のサーバーへ転送されるため"
      - "リサイクルは深夜にしか発生しないため"
    answerIndex: 1
    explanation: "既定で有効なオーバーラップ・リサイクルにより、新旧プロセスが一時的に共存し、リクエストが瞬断によって失敗する事態を回避しています。"
