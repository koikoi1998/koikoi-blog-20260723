questions:
  - question: "IISとASP.NETの役割分担について、記事の説明に最も合致するものはどれか。"
    choices:
      - "IISとASP.NETは完全に同じソフトウェアであり、単に呼び方が異なるだけである"
      - "IISはHTTPリクエストを受け付けるWebサーバーソフトウェアそのものであり、ASP.NETはその上で動く.NET向けのアプリケーション実行フレームワークの1つである"
      - "ASP.NETはWebサーバーソフトウェアそのものであり、IISはその上で動くアプリケーション実行フレームワークである"
      - "IISはLinux専用、ASP.NETはWindows専用のソフトウェアである"
    answerIndex: 1
    explanation: "IISはHTTPリクエストを受け付けて処理するWebサーバーソフトウェアそのものであり、ASP.NETはそのIISという土台の上で動く、動的なWebアプリケーションを実行するためのフレームワークの1つです。IISはアプリケーションの種類自体には依存しない汎用的な土台です。"

  - question: "IISのアプリケーションプールによる分離の役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "複数のWebサイト・アプリケーションをプロセスレベルで分離し、1つのアプリケーションプールに異常が発生しても他のアプリケーションプールで動く他のWebサイトには影響しないようにする"
      - "アプリケーションプールは、Webサイトのデザイン(見た目)を統一するための設定である"
      - "アプリケーションプールは、ユーザーのログインパスワードを保管するためのデータベースである"
      - "アプリケーションプールは、IISのライセンス数を管理するための機能である"
    answerIndex: 0
    explanation: "アプリケーションプールは、複数のWebサイト・アプリケーションをプロセスレベルで分離するための「箱」です。1つのアプリケーションプールに異常(クラッシュ、メモリリークなど)が発生しても、別のアプリケーションプールで動いている他のWebサイトには影響しません。"

  - question: "Default Web Siteの性質について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Default Web Siteはシステムの動作に必須の特別な存在であり、絶対に削除してはならない"
      - "Default Web Siteは最初から用意されている通常のWebサイトエントリの1つに過ぎず、要件に応じて自由に停止・削除・変更してよい"
      - "Default Web Siteは、ASP.NETのコードを一切実行できない特殊な制限付きサイトである"
      - "Default Web Siteは、IISをアンインストールしても自動的に残り続ける"
    answerIndex: 1
    explanation: "Default Web Siteは、IISが最初から持っている「最初のWebサイト」の枠に過ぎず、特別な予約された仕組みではありません。要件に応じてそのまま使う構成もあれば、停止・削除して独自のサイトのみ運用する構成もあります。"

  - question: "「Default Web Site」と「アプリケーションプール(DefaultAppPool)」の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Default Web SiteとDefaultAppPoolは同一のオブジェクトであり、片方を削除するともう片方も自動的に消える"
      - "Default Web Site(サイト)とDefaultAppPool(アプリケーションプール)は別々のオブジェクトであり、既定でペアになっているだけで、割り当ては自由に変更できる"
      - "アプリケーションプールは、Default Web Siteの内部に含まれる下位フォルダーの1つである"
      - "DefaultAppPoolという名前のアプリケーションプールは、IISの役割をインストールしても自動的には作成されない"
    answerIndex: 1
    explanation: "Default Web Site(バインド設定+物理パスを持つサイト)とDefaultAppPool(アプリケーションプール)は別々のオブジェクトです。既定では前者が後者に割り当てられているだけで、どちらも「Default」という名前を持つために混同されがちですが、割り当ては自由に変更できます。"

  - question: "Webサイトのホスト名とDCのドメイン名の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "技術的な仕組みとして直接の関係はなく、社内サイトで両者が同じDNS名前空間を共有するのは、既存のAD統合DNSインフラを再利用しているという運用上の選択にすぎない"
      - "Webサイトのホスト名は、必ずAD DSのドメイン名のサブドメインでなければIISにバインドできない"
      - "DCのドメイン名を変更すると、そのドメインで運用されているすべてのWebサイトのホスト名も自動的に変更される"
      - "Webサイトのホスト名とDCのドメイン名は、まったく同じDNSレコードを指す必要がある"
    answerIndex: 0
    explanation: "バインドのホスト名は、そのDNS名で名前解決してアクセスしてきたクライアントをどのサイトへ振り分けるかを決める値にすぎず、AD DSのドメイン名に属している必要は技術的にありません。社内サイトで両者が同じ名前空間を共有することが多いのは、既存のAD統合DNSインフラを再利用しているだけの運用上の選択です。"

  - question: "記事における「Webサイト」の正体についての説明として、最も合致するものはどれか。"
    choices:
      - "Webサイトの正体は、HTML/CSSファイルの集まりそのものである"
      - "Webサイトの正体は、HTTPを解釈しリクエストに応じてレスポンスを返せるソフトウェア(とその設定)であり、HTML/CSSはそのレスポンスとして返されるコンテンツの一形態にすぎない"
      - "Webサイトは、必ずデータベースを内蔵していなければならない"
      - "Webサイトという概念は、ASP.NETのようなフレームワークを使わない限り成立しない"
    answerIndex: 1
    explanation: "「Webサイト」の正体は、HTML/CSSファイルの集まりのことではなく、HTTPを解釈し、リクエストに応じてレスポンスを返すことができるソフトウェア(とその設定)のことです。HTML/CSSは、そのレスポンスとして返されるコンテンツの一形態にすぎません。"

  - question: "バインド設定における名前ベースの仮想ホスティングについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "同じIPアドレス・同じポート番号であっても、HTTPリクエストのHostヘッダーの値が異なれば、異なるWebサイトへ振り分けることができる"
      - "名前ベースの仮想ホスティングでは、必ず異なるIPアドレスを用意しなければ複数サイトを運用できない"
      - "名前ベースの仮想ホスティングは、HTTPSでは技術的に一切利用できない"
      - "バインド設定は、Webサイトのデータベース接続文字列を指定するための機能である"
    answerIndex: 0
    explanation: "バインドはIPアドレス・ポート番号・ホスト名(Hostヘッダー)の組み合わせで定義され、同じIPアドレス・同じポート番号であってもホスト名が異なれば別々のWebサイトとして振り分けられます。これが名前ベースの仮想ホスティングの基本的な仕組みです。HTTPSではSNIという拡張機能によってこれが実現されています。"

  - question: "IISでのHTTP応答ヘッダーの追加・変更について、記事の説明に最も合致するものはどれか。"
    choices:
      - "HTTP応答ヘッダーは、アプリケーションのコードを変更する以外に追加・変更する方法が存在しない"
      - "IISマネージャーの設定だけで、Webサイト・アプリケーション単位でセキュリティ関連ヘッダーの追加やサーバー識別情報の変更・削除ができる"
      - "HTTP応答ヘッダーは、Windows Serverのライセンス認証状態によって自動的に決定される"
      - "HTTP応答ヘッダーの変更は、IISのバージョンをダウングレードしない限り不可能である"
    answerIndex: 1
    explanation: "IISマネージャーでは、Webサイト単位・アプリケーション単位で、HTTPレスポンスに含めるカスタムヘッダーを追加・変更できます。これはアプリケーションのコードを変更する方法とは別の、IIS側の設定だけで実現できる仕組みで、セキュリティ関連ヘッダーの追加やサーバー識別情報の変更・削除などに使われます。"
