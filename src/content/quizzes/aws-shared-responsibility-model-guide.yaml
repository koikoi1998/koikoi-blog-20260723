questions:
  - question: "「クラウドのセキュリティ(Security OF the Cloud)」に含まれるのはどれか。"
    choices:
      - "ゲストOSへのパッチ適用"
      - "物理的なデータセンターの警備やハードウェア、仮想化基盤の安全性"
      - "IAMによるアクセス権限の管理"
      - "アプリケーションの設定"
    answerIndex: 1
    explanation: "「クラウドのセキュリティ」はAWS自身が担う責任であり、物理的なデータセンターの警備、ハードウェア、ネットワークインフラ、仮想化基盤の安全性が含まれます。"

  - question: "「クラウド内のセキュリティ(Security IN the Cloud)」に含まれるのはどれか。"
    choices:
      - "データセンターの物理的な警備"
      - "IAMによるアクセス権限の設定やデータの暗号化・分類"
      - "AWSのネットワークインフラ全体の管理"
      - "ハイパーバイザーそのものの安全性"
    answerIndex: 1
    explanation: "「クラウド内のセキュリティ」は利用者自身の責任であり、ゲストOSへのパッチ適用、アプリケーション設定、IAM管理、データの暗号化・分類が含まれます。"

  - question: "EC2とRDSで、責任の境界線について正しい説明はどれか。"
    choices:
      - "両者はまったく同じ位置に境界線がある"
      - "EC2ではOSより上のレイヤーがすべて利用者の責任だが、RDSではOSやDBエンジンのパッチ適用はAWS側の責任範囲に含まれる"
      - "RDSの方がEC2よりも利用者の責任範囲が広い"
      - "境界線という概念自体が存在しない"
    answerIndex: 1
    explanation: "IaaS型のEC2ではOSより上がすべて利用者の責任ですが、マネージド型のRDSではOSやDBエンジン自体のパッチ適用がAWS側の責任範囲に含まれます。"

  - question: "クラウド関連のセキュリティ事故の主な原因として正しいのはどれか。"
    choices:
      - "AWS側のインフラが破られたことがほとんどである"
      - "利用者側の責任範囲である『クラウド内のセキュリティ』の設定ミスが原因であることが大半である"
      - "セキュリティ事故はクラウドでは発生しない"
      - "常にネットワーク回線の物理的な障害が原因である"
    answerIndex: 1
    explanation: "クラウド関連のセキュリティ事故の多くは、AWS側のインフラではなく、利用者側の『クラウド内のセキュリティ』の設定ミスが原因です。"

  - question: "マネージドサービスを選ぶことの意味として最も適切なのはどれか。"
    choices:
      - "単なる機能・コストの比較にすぎない"
      - "自社が背負う責任範囲を、意図的にAWS側へ寄せるという、セキュリティ上の設計判断でもある"
      - "セキュリティとはまったく関係のない選択である"
      - "マネージドサービスを選ぶと、利用者の責任範囲がむしろ増える"
    answerIndex: 1
    explanation: "マネージドサービスを選ぶことは、機能・コストの比較だけでなく、責任範囲を意図的にAWS側へ寄せる、セキュリティ上の設計判断でもあります。"
