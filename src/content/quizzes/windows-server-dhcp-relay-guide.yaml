questions:
  - question: "DHCP Discoverパケットの性質として正しいのはどれか。"
    choices:
      - "DHCPサーバーに対する、ユニキャストの問い合わせである"
      - "同一セグメント内の全端末に向けた、ブロードキャストパケットである"
      - "暗号化された、専用のトンネル経由の通信である"
      - "常にDNSサーバー経由で送信される"
    answerIndex: 1
    explanation: "DHCP Discoverは、宛先IPアドレスが255.255.255.255、宛先MACアドレスがff:ff:ff:ff:ff:ffという、同一セグメント内の全端末に向けたブロードキャストパケットです。"

  - question: "DHCPリレーエージェントが行う処理として正しいのはどれか。"
    choices:
      - "DHCPサーバーそのものを複製する"
      - "クライアントのブロードキャストパケットを受け取り、ユニキャストパケットに変換してDHCPサーバーへ転送する"
      - "DHCPの問い合わせを暗号化する"
      - "IPアドレスの割り当てを完全に代行し、DHCPサーバーを不要にする"
    answerIndex: 1
    explanation: "DHCPリレーエージェントは、クライアントのブロードキャストパケットを受け取ると、それをDHCPサーバー宛てのユニキャストパケットとして転送し直します。"

  - question: "giaddrフィールドが表す内容として正しいのはどれか。"
    choices:
      - "クライアント自身のIPアドレス"
      - "中継を行ったリレーエージェント自身のIPアドレス"
      - "DHCPサーバーのMACアドレス"
      - "DNSサーバーのIPアドレス"
    answerIndex: 1
    explanation: "giaddrは、クライアントのIPアドレスではなく、中継を行ったリレーエージェント自身のIPアドレスを表すフィールドです。"

  - question: "DHCPサーバーが、giaddrフィールドを利用して行っていることとして正しいのはどれか。"
    choices:
      - "クライアントのMACアドレスを暗号化する"
      - "要求元のサブネットを判断し、そのサブネットに対応する正しいスコープからアドレスを選ぶ"
      - "DNSレコードを自動的に更新する"
      - "ファイアウォールのルールを動的に変更する"
    answerIndex: 1
    explanation: "DHCPサーバーは、giaddrフィールドを見ることで要求元のサブネットを判断し、そのサブネットに対応する正しいスコープからアドレスを選んで応答を返します。"

  - question: "DHCPリレーエージェントとDHCPフェイルオーバーの関係として正しいのはどれか。"
    choices:
      - "両者はまったく同じ問題を解決している"
      - "リレーエージェントは到達性の問題を解決し、フェイルオーバーはDHCPサーバー自体の冗長性の問題を解決する、別の軸の仕組みである"
      - "リレーエージェントを設定すれば、フェイルオーバーは不要になる"
      - "フェイルオーバーを設定すれば、別サブネットへの配布が自動的に可能になる"
    answerIndex: 1
    explanation: "DHCPリレーエージェントは到達性の問題を解決するものであり、DHCPサーバー自体の冗長性の問題は、DHCPフェイルオーバーという別の軸の仕組みで対処する必要があります。"
