questions:
  - question: "RODCが既定の状態で、ユーザーのパスワードをキャッシュする範囲はどこまでか。"
    choices:
      - "フォレスト内の全ユーザーのパスワードをキャッシュする"
      - "既定ではどのユーザーのパスワードもキャッシュしない"
      - "そのRODCが所属するドメインのユーザーだけをキャッシュする"
      - "Domain Adminsグループのメンバーだけをキャッシュする"
    answerIndex: 1
    explanation: "RODCは既定でどのユーザーのパスワードもキャッシュしません。パスワード複製ポリシーで明示的に許可したユーザーだけがキャッシュの対象になります。"

  - question: "RODCが物理的に盗まれた場合、実際に危険にさらされるのはどの範囲か。"
    choices:
      - "フォレスト内の全アカウントのパスワード"
      - "そのRODCにキャッシュされていたユーザーのパスワードだけ"
      - "そのRODCが担当するDNSレコードだけ"
      - "被害範囲は特定できず、常にフォレスト全体を再構築する必要がある"
    answerIndex: 1
    explanation: "パスワード複製ポリシーによって、RODCが盗まれた場合の被害範囲は、そのRODCにキャッシュされていたユーザーのパスワードだけに限定されます。"

  - question: "RODCは、AD DSへの書き込み要求に対してどのように振る舞うか。"
    choices:
      - "あらゆる書き込み要求を完全に拒否し、エラーを返す"
      - "書き込み要求自体は受け付けるが、実際の処理は書き込み可能なDCへ転送する"
      - "書き込み要求を受け付け、ローカルのデータベースに直接反映する"
      - "書き込み要求を受け付けた後、フォレスト全体を読み取り専用に切り替える"
    answerIndex: 1
    explanation: "RODCは書き込み要求(パスワード変更など)自体は受け付けますが、実際の処理は書き込み可能なDCへ転送します。RODC自身のデータベースへの直接書き込みは行いません。"

  - question: "RODCの「管理者ロールの分離(Administrator Role Separation)」で付与される権限の範囲はどこまでか。"
    choices:
      - "フォレスト全体のDomain Admins相当の権限"
      - "そのRODC1台に限定されたローカル管理権限"
      - "AD DSのデータそのものに対する完全な権限"
      - "他のすべてのDCに対する管理権限"
    answerIndex: 1
    explanation: "管理者ロールの分離で付与される権限は、そのRODC1台のローカル管理(再起動やパッチ適用など)に限定され、AD DSのデータに対する権限は含まれません。"

  - question: "パスワード複製ポリシーの許可リストに含まれていないユーザーが、RODCが設置された拠点でログインしようとするとどうなるか。"
    choices:
      - "ログイン自体が拒否される"
      - "ログインは成功するが、そのユーザーのパスワードはRODCにキャッシュされない"
      - "ログインは成功し、パスワードも自動的にキャッシュされる"
      - "RODCがそのユーザーのアカウントを自動的に無効化する"
    answerIndex: 1
    explanation: "許可リストに含まれていないユーザーのログインは、RODCが書き込み可能なDCへ認証を転送することで成功しますが、そのユーザーのパスワードはRODCにキャッシュされません。"
