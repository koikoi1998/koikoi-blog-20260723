questions:
  - question: "RAIDとOSのディスク管理の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "RAIDを構築すれば、OS側のパーティション・ボリューム・ファイルシステムの管理は完全に不要になる"
      - "RAIDは複数の物理ディスクを1つに見せる抽象化のレイヤー、OSのディスク管理はその上でパーティション・ボリューム・ファイルシステムを管理するレイヤーであり、両者は完全に独立している"
      - "OSのディスク管理は、RAIDコントローラの設定を自動的に書き換える機能である"
      - "RAIDとOSのディスク管理は、常に同じ1つの設定画面から同時に操作する必要がある"
    answerIndex: 1
    explanation: "RAIDは複数の物理ディスクを束ねてOSに対して1つの物理ディスクであるかのように見せる抽象化のレイヤーです。OSのディスク管理は、この「1つに見えるディスク」の中身をパーティション・ボリューム・ファイルシステムという別の階層で管理するレイヤーであり、両者は完全に独立しています。"

  - question: "OSインストール後、Cドライブはすぐ使えるのにDドライブ用のRAIDボリュームが未初期化のまま残る理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "OSインストーラが、インストール先として選択したディスクについてのみパーティション作成・初期化・フォーマットを自動的に済ませるため、選択しなかった追加のRAIDボリュームは未初期化のまま残る"
      - "Dドライブは物理的に故障しているため、常に初期化が必要になる"
      - "Cドライブだけがハードウェア的に特別な種類のディスクであり、Dドライブとは異なる仕組みで動作している"
      - "OSのライセンス上、2台目以降のディスクは必ず手動での初期化が義務付けられている"
    answerIndex: 0
    explanation: "OSインストーラは、インストール先として選択したディスク(通常Cドライブになる1台目)についてのみ、インストール処理の一部としてパーティション作成・初期化・フォーマットまで自動的に済ませます。インストール先として選択しなかった追加のRAIDボリュームは、この処理の対象外であり、未初期化のまま残ります。"

  - question: "ディスクの初期化という操作が具体的に行っていることについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "ディスク上のすべてのデータを完全に消去し、二度と復元できない状態にする"
      - "そのディスクの先頭部分に、パーティションテーブル(MBRまたはGPT)を新規に書き込む"
      - "ディスクの物理的な回転速度を変更する"
      - "ディスクをネットワーク経由でクラウドサーバーへ自動的にバックアップする"
    answerIndex: 1
    explanation: "ディスクの初期化とは、そのディスクの先頭部分にパーティションテーブル(MBRまたはGPT)を新規に書き込む操作です。これによって「このディスクのどの範囲がどのパーティションとして使われているか」という管理情報の土台が作られます。"

  - question: "MBRに2TBという容量の上限がある理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "MBR形式は、パーティションの開始位置・サイズを32bitのセクタ番号で管理しており、一般的な512バイトセクタのディスクでは2^32×512バイト=2TBが上限になるため"
      - "Microsoftが、意図的にMBR形式のディスク容量を2TBに制限するライセンス条項を設けているため"
      - "2TBを超えるディスクは、物理的に製造することが技術的に不可能であるため"
      - "MBR形式は暗号化に対応していないため、セキュリティ上の理由で容量が制限されている"
    answerIndex: 0
    explanation: "MBRはパーティションの開始位置・サイズを32bitのセクタ番号で管理しています。一般的な512バイトセクタのディスクでは、2^32×512バイト=2TBが、この32bitアドレッシングで表現できる上限になります。この制約を受けないGPTが、現在では大容量ディスクの標準的な選択肢になっています。"

  - question: "パーティションとボリュームの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "パーティションとボリュームは、常に完全に同一のものを指す用語である"
      - "パーティションはディスク上に区切られた物理的な領域そのものを指し、ボリュームはOSがドライブ文字を割り当てファイルシステムを通じてアクセス可能にした論理的な単位を指す"
      - "パーティションはソフトウェアの概念、ボリュームはハードウェアの概念であり、互いに無関係である"
      - "ボリュームは常にパーティションより物理的に大きいサイズでなければならない"
    answerIndex: 1
    explanation: "パーティションはディスク上に区切られた物理的な領域そのものを指します。ボリュームは、OSがそのパーティション(あるいはダイナミックディスクの場合は複数のパーティションや物理ディスクを束ねたもの)に対してドライブ文字を割り当て、ファイルシステムを通じてアクセス可能にした論理的な単位です。基本ディスクでは1対1で対応することが多いですが、ダイナミックディスクでは異なる場合があります。"
