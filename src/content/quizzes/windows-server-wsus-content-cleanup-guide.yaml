questions:
  - question: "サーバークリーンアップウィザードを実行しても、WsusContentフォルダーの容量がほとんど解放されない理由として正しいのはどれか。"
    choices:
      - "ウィザード自体に、ソフトウェアのバグが存在するから"
      - "ウィザードは、承認済みのまま残っている置き換え済みの更新プログラムのファイルには、一切手を付けないから"
      - "WSUSは、ファイルを削除する機能自体を持っていないから"
      - "ディスク自体が、物理的に破損しているから"
    answerIndex: 1
    explanation: "サーバークリーンアップウィザードは、承認済みのまま残っている「置き換え済み」の更新プログラムのファイルには、一切手を付けないという仕様があるため、実際にはほんの数MBしか解放されないことがあります。"

  - question: "WSUSのディスク容量を本当に取り戻すための、正しい手順として正しいのはどれか。"
    choices:
      - "更新プログラムを「未承認」に戻すだけでよい"
      - "置き換え済みの更新プログラムを明示的に「拒否」に変更してから、クリーンアップウィザードを実行する"
      - "WSUSサービス自体を再起動するだけでよい"
      - "サーバー全体を再起動するだけでよい"
    answerIndex: 1
    explanation: "ディスク容量を本当に取り戻すには、承認済みのビューを「置き換え済み」でフィルターし、該当する更新プログラムを明示的に「拒否」に変更してから、クリーンアップウィザードを実行する必要があります。"

  - question: "「置き換え済み」という判定に関する記述として正しいのはどれか。"
    choices:
      - "この判定は、常に100%正確であり、疑う必要はない"
      - "この判定は、特定のシステム構成の組み合わせの下でのみ成立している場合があり、完全に信頼できるとは限らない"
      - "この判定は、Microsoftが手動で1件ずつ確認して決定している"
      - "この判定は、ユーザーが手動で設定しない限り、一切行われない"
    answerIndex: 1
    explanation: "ある更新プログラムが「置き換え済み」と判定されていても、その判定は特定のシステム構成の組み合わせの下でのみ成立している場合があり、完全に信頼できるとは限りません。"

  - question: "Express installation filesという設定の特徴として正しいのはどれか。"
    choices:
      - "ディスク容量の使用量を削減する設定である"
      - "低速なリンクで接続するクライアント向けの機能だが、必要なディスク容量を3倍から4倍に増加させる"
      - "WSUSのセキュリティを強化するためだけの設定である"
      - "この設定を有効にすると、同期速度が常に向上する"
    answerIndex: 1
    explanation: "Express installation filesは、低速なリンクで接続するクライアント向けにバイナリ差分パッチを提供する設定ですが、必要なディスク容量を通常の3倍から4倍に増加させます。"

  - question: "イベントID 10041・10042が記録されている場合、何を示しているか。"
    choices:
      - "WSUSのライセンスが期限切れになったこと"
      - "コンテンツ格納先のボリュームの空き容量が不足していること"
      - "クライアント端末のウイルス感染"
      - "ネットワークケーブルの物理的な断線"
    answerIndex: 1
    explanation: "イベントID 10041・10042は、コンテンツ格納先のボリュームの空き容量が不足しているサインであり、この状態が続くと同期自体が失敗する可能性があります。"
