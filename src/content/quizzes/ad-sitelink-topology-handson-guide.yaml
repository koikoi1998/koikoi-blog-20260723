questions:
  - question: "サイトリンクの`-Cost`パラメータが表しているものは何か。"
    choices:
      - "実際の回線の帯域幅そのもの"
      - "管理者が経路の優先度を表現するための、抽象的な数値"
      - "そのサイトリンクを流れるデータ量の上限"
      - "サイトリンクの物理的な距離(キロメートル)"
    answerIndex: 1
    explanation: "コストは、実際の帯域幅を直接表すものではなく、管理者が経路の優先度を表現するための抽象的な数値です。KCCは合計コストが最も低い経路を選びます。"

  - question: "大阪-名古屋間に直接のサイトリンクが存在しない場合でも、両拠点間でレプリケーションが成立することがあるのはなぜか。"
    choices:
      - "AD DSのバグである"
      - "サイトリンクの推移性(ブリッジ)が既定で有効になっており、間接的な経路が自動的に計算されるため"
      - "すべてのDCが自動的に同じサイトに所属することになるため"
      - "大阪と名古屋のサブネットが同一だから"
    answerIndex: 1
    explanation: "サイトリンクの推移性(ブリッジ)が既定で有効になっているため、東京を経由する間接的な経路が、KCCによって自動的に計算されます。"

  - question: "複数の経路が存在する場合、KCCはどの経路を優先するか。"
    choices:
      - "作成された順序が最も古い経路"
      - "合計コストが最も低い経路"
      - "経由するサイト数が最も多い経路"
      - "アルファベット順で最初に来るサイト名を含む経路"
    answerIndex: 1
    explanation: "KCCは、複数の経路が存在する場合、合計コストが最も低い経路を自動的に選択します。"

  - question: "KCCが生成した接続オブジェクトの性質について、正しい説明はどれか。"
    choices:
      - "一度生成されると、二度と変更されない"
      - "既定で15分ごとにトポロジが再評価され、必要に応じて経路が見直される"
      - "手動で作成した接続オブジェクトの方が、KCCが生成したものより優先される"
      - "接続オブジェクトは1つのフォレストにつき1つしか存在できない"
    answerIndex: 1
    explanation: "KCCは既定で15分ごとにトポロジを再評価しており、障害発生時などには自動的に経路を見直す、自己修復的な性質を持っています。"

  - question: "サイトリンクの推移性(ブリッジ)を有効にしておく主なメリットは何か。"
    choices:
      - "レプリケーションのセキュリティが自動的に強化される"
      - "拠点数が増えるたびに、すべての拠点間で総当たり的にサイトリンクを作成する必要がなくなる"
      - "サイト間のレプリケーション頻度が自動的に上がる"
      - "DNSサーバーの負荷が軽減される"
    answerIndex: 1
    explanation: "サイトリンクの推移性により、既存のサイトリンクを組み合わせた間接的な経路が自動的に計算されるため、総当たり的なサイトリンク作成が不要になります。"
