questions:
  - question: "ライトバックとライトスルーの違いとして正しいのはどれか。"
    choices:
      - "両者は完全に同じ動作をする、単なる別名である"
      - "ライトスルーはディスクへの実書き込み完了を待って応答し、ライトバックはキャッシュへの書き込みで即座に応答する"
      - "ライトバックは、常にディスクへの実書き込みを待つ"
      - "ライトスルーは、常にキャッシュを一切使用しない"
    answerIndex: 1
    explanation: "ライトスルーは、実際にディスクへの書き込みが完了するまで応答を返さない安全だが低速な方式、ライトバックはキャッシュへの書き込みで即座に完了と応答する高速な方式です。"

  - question: "ライトバックにおいて、電源断が発生した場合のリスクとして正しいのはどれか。"
    choices:
      - "ディスク自体が物理的に破損する"
      - "キャッシュ上のデータが消失し、しかもホスト側のアプリケーションはそのことに一切気づかない"
      - "RAIDコントローラー自体が、永久に使用不能になる"
      - "リスクは一切存在しない"
    answerIndex: 1
    explanation: "ライトバックでは、キャッシュ上のデータがまだディスクへ反映されていない間に電源が落ちると、データが失われ、しかもホストはすでに「完了した」という応答を受け取っているため、この損失に一切気づきません。"

  - question: "BBU(バッテリーバックアップユニット)の充電量に関する記述として正しいのはどれか。"
    choices:
      - "BBUの充電量は無限であり、何日電源が復旧しなくても問題ない"
      - "BBUの充電量には限界があり、一般的には24時間から48時間程度しかキャッシュを保護できない"
      - "BBUは、充電という概念自体を持たない"
      - "BBUは、電源が復旧した瞬間に自動的に完全に破損する"
    answerIndex: 1
    explanation: "BBUの充電量には限界があり、一般的には24時間から48時間程度しかキャッシュを保護できず、それを超えて電源が復旧しない場合は、結局データが失われます。"

  - question: "多くのRAIDコントローラーが、BBUの劣化を検知した際に行う動作として正しいのはどれか。"
    choices:
      - "管理者による操作なしに、自動的にライトバックからライトスルーへ切り替える"
      - "即座にすべてのデータを削除する"
      - "ディスクの電源を物理的に遮断する"
      - "何も変化せず、ライトバックのまま動作し続ける"
    answerIndex: 1
    explanation: "多くのRAIDコントローラーは、BBUの劣化や故障を検知すると、管理者による操作なしに、自動的にライトバックからライトスルーへ切り替え、データの安全性を優先します。"

  - question: "劣化したバッテリーの状態で、絶対に避けるべき対応として正しいのはどれか。"
    choices:
      - "バッテリー自体を交換する"
      - "手動でライトバックへ強制的に戻す"
      - "RAIDコントローラーの状態を確認する"
      - "管理ツールでBBUの状態を監視する"
    answerIndex: 1
    explanation: "バッテリーが劣化・故障していると表示されているにもかかわらず、管理者が手動でライトバックへ強制的に戻してしまうと、通常であれば単なる電源障害で済んだはずの出来事が、本当のデータ損失事故に変わってしまいます。"
