questions:
  - question: "SD-WANとクラウド管理の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "SD-WANとクラウド管理は完全に同一の機能であり、区別する必要はない"
      - "SD-WANは複数回線を通信品質にもとづいて動的に使い分けるトラフィック制御の技術、クラウド管理は多拠点の機器の設定・監視・運用を一元化する仕組みであり、別々の概念だが多くの製品が両方を同時に提供するため混同されやすい"
      - "クラウド管理はSD-WANの旧名称であり、現在は使われていない"
      - "SD-WANは必ずクラウド管理と併用しなければ、技術的に機能しない"
    answerIndex: 1
    explanation: "SD-WANは複数の回線をアプリケーションごとの通信品質にもとづいて動的に使い分けるトラフィック制御の技術です。クラウド管理は多数の拠点機器の設定・監視・運用を1つのダッシュボードから一括して行う運用管理の仕組みであり、SD-WANとは別の概念です。多くの製品が両方を同時に提供しているため混同されやすいだけです。"

  - question: "SD-WANが従来のMPLS専用線と比較して解決しようとしている課題について、記事の説明に最も合致するものはどれか。"
    choices:
      - "MPLSは帯域保証がなく品質が不安定であるという課題を解決する"
      - "MPLSの回線調達コストの高さとリードタイムの長さに対し、安価で手配の速いブロードバンド・モバイル回線を組み合わせて動的に使い分けることで対応する"
      - "MPLSはセキュリティが脆弱であるという課題を解決するために暗号化機能だけを追加する技術である"
      - "SD-WANはMPLSと物理的に同じ回線を使うため、課題を解決する対象がそもそも存在しない"
    answerIndex: 1
    explanation: "MPLSは信頼性が高い一方、回線調達のコストが高くリードタイムも長いという課題があります。SD-WANは、MPLSのような専用線と安価で手配の速いブロードバンド・モバイル回線を同時に集約し、通信の種類ごとに最も品質の良い回線を動的に選んで送信するアプローチでこの課題に応えます。"

  - question: "FortiGate・YAMAHA・Merakiのそれぞれの強みについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "FortiGateはセキュリティ機能(UTM)とSD-WANの両立、YAMAHAはコストパフォーマンスとシンプルな構成、Merakiはクラウド管理のしやすさがそれぞれの強みである"
      - "3製品はすべて同一のOSを採用しており、機能面での違いは一切ない"
      - "YAMAHAはクラウド管理専用の製品であり、ローカル設定は一切できない"
      - "Merakiはサブスクリプションが不要で、初期費用のみで永続的に利用できる"
    answerIndex: 0
    explanation: "FortiGateはUTM機能とSD-WAN機能を統合しセキュリティ機能の網羅性が高いこと、YAMAHAはコストパフォーマンスの高さとシンプルなVPN・ルーティング機能、Merakiはクラウド管理ダッシュボードによる多拠点の一元管理のしやすさが、それぞれの強みです。"

  - question: "クラウド管理への依存がリスクになりうる理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "クラウド管理コンソールとの通信が切断されると、その拠点の機器は即座に完全停止する仕様になっている"
      - "多くの製品は既存の設定によるトラフィック処理自体は継続できるが、クラウドとの接続が切れると新規の設定変更やリアルタイムの監視ができなくなるため、管理経路自体の可用性を考慮する必要がある"
      - "クラウド管理には法律上、24時間365日の接続が義務付けられているため"
      - "クラウド管理コンソールは、インターネット経由以外の方法では絶対に接続できない仕様になっている"
    answerIndex: 1
    explanation: "多くの製品はクラウドとの接続が切れても既存の設定に基づいたトラフィック処理自体は継続できるように設計されていますが、新規の設定変更やリアルタイムの監視はクラウド接続が復旧するまで行えません。これは帯域外管理と同じ発想で、管理経路自体の可用性を検討する必要があることを示しています。"

  - question: "SASE(Secure Access Service Edge)という用語について、記事の説明に最も合致するものはどれか。"
    choices:
      - "SASEはSD-WANの旧称であり、両者は完全に同義語である"
      - "SASEはSD-WANと、クラウド上のセキュリティ機能(セキュアWebゲートウェイやZTNAなど)を統合した、より広い概念である"
      - "SASEは、YAMAHAの製品ラインの1つを指す専用の商品名である"
      - "SASEはクラウド管理コンソールの表示言語を切り替える機能を指す用語である"
    answerIndex: 1
    explanation: "SASEは、SD-WANとクラウド上のセキュリティ機能(セキュアWebゲートウェイ、ZTNAなど)を統合した、より広い概念であり、近年よく登場する上位の用語です。"
