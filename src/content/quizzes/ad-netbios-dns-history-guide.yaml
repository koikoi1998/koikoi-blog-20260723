questions:
  - question: "NetBIOS名とDNSホスト名の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "NetBIOS名は、DNSホスト名を15文字に短縮しただけの、同じ仕組みの短縮版である"
      - "NetBIOSは、DNSより古い時代に設計された、階層を持たないフラットな命名空間を前提とする、DNSとはまったく別のプロトコルである"
      - "NetBIOS名とDNSホスト名は、常に完全に同じ文字列でなければならないという仕様上の制約がある"
      - "DNSホスト名はNetBIOS名から派生した、NetBIOSの拡張仕様の1つである"
    answerIndex: 1
    explanation: "NetBIOSは、DNSがまだ普及していなかった1980年代のLAN向けに設計された、階層を持たないフラットな命名の仕組みであり、DNSホスト名とは生まれた時代も設計思想もまったく異なります。"

  - question: "コンピューター名が15文字までしか使えない理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "DNSのホスト名ラベルの仕様が、15文字までと定められているため"
      - "NetBIOS名が仕様上常に16バイトの固定長であり、先頭15バイトが名前部分、最後の16バイト目がサービス種別を示す予約領域として使われるため"
      - "Windowsのファイルシステムが、15文字を超える名前を扱えないため"
      - "Active Directoryのスキーマが、コンピューター名の属性を15文字までに制限しているため"
    answerIndex: 1
    explanation: "NetBIOSの名前は仕様上常に16バイトの固定長で、先頭15バイトが管理者・ユーザーが指定できる名前部分、最後の16バイト目(NetBIOSサフィックス)はそのコンピューターが提供しているサービスの種類を示す予約領域として使われます。"

  - question: "WINS(Windows Internet Name Service)の役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "DNSホスト名とIPアドレスを対応づける、DNSサーバーの別名である"
      - "NetBIOS名とIPアドレスの対応表を集中管理し、ブロードキャストが届かないルーターを越えた範囲でもNetBIOS名による名前解決ができるようにする、いわば「NetBIOS版のDNS」として機能していた"
      - "Active DirectoryのFSMOロールの1つであり、フォレスト内に1台だけ存在する"
      - "Kerberos認証のチケットを発行する専用サーバーである"
    answerIndex: 1
    explanation: "WINSは、NetBIOS名とIPアドレスの対応表を1台の集中サーバーで管理し、ブロードキャストの代わりにこのサーバーへ直接問い合わせることで、ルーターを越えた範囲でもNetBIOS名による名前解決ができるようにする仕組みでした。"

  - question: "WINSの現在の状況について、記事の説明に最も合致するものはどれか。"
    choices:
      - "既にすべてのWindows Serverリリースから完全に削除されており、今は存在しない"
      - "Windows Server 2022時点で非推奨とされ、Windows Server 2025がWINSサーバーの役割を含む最後のLTSCリリースとなり、それ以降のリリースで完全に削除される予定である"
      - "今後も永続的にサポートが継続され、削除される予定はない"
      - "WINSは元々Linux専用の機能であり、Windows Serverでは使われたことがない"
    answerIndex: 1
    explanation: "WINSはWindows Server 2022時点で非推奨とされており、Windows Server 2025が、WINSサーバーの役割を含む最後のLTSC(長期サービスチャネル)リリースになります。それ以降のリリースでは、WINSサーバーの役割・管理用MMCスナップイン・関連APIが完全に削除される予定です。"

  - question: "`DOMAIN\\username`という、いわゆるダウンレベルログオン名について、記事の説明に最も合致するものはどれか。"
    choices:
      - "単なる古い書き方の慣習であり、技術的な意味は特にない"
      - "NetBIOSドメイン名を前提にした正式な認証名の形式であり、NetBIOSという古いプロトコルの命名規則が現在も認証の仕組みの中に生き続けている証拠である"
      - "DNSホスト名を前提にした、最新の認証名の形式である"
      - "Windows Server 2025以降、使用できなくなる予定の形式である"
    answerIndex: 1
    explanation: "DOMAIN\\usernameという表記(ダウンレベルログオン名)は、NetBIOSドメイン名を前提にした正式な認証名の形式です。単なる慣習ではなく、NetBIOSという古いプロトコルの命名規則が、現在も認証の仕組みの中に生き続けている証拠です。"
