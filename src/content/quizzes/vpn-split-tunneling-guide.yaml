questions:
  - question: "フルトンネル(既定の構成)の挙動として正しいのはどれか。"
    choices:
      - "一部の通信だけがVPNトンネルを経由し、残りはローカル接続を使う"
      - "VPN接続中のすべての通信が、例外なくVPNトンネルを経由する"
      - "VPN接続自体が、技術的に確立されない"
      - "DNSクエリだけがトンネルを経由し、他の通信はすべてローカルを使う"
    answerIndex: 1
    explanation: "フルトンネルは既定の構成で、VPN接続中のすべての通信が、例外なくVPNトンネルを経由します。"

  - question: "スプリットトンネリングでトンネルを通らないと設定された通信の、保護状態として正しいのはどれか。"
    choices:
      - "VPNと同程度の暗号化が、別の仕組みで自動的に適用される"
      - "VPNによる暗号化・保護を一切受けない"
      - "ローカルネットワークの管理者だけが、内容を見ることができる"
      - "通信自体が、技術的に完全にブロックされる"
    answerIndex: 1
    explanation: "スプリットトンネリングで、VPNトンネルを通らないと設定された通信は、VPNによる暗号化・保護を一切受けず、ISPや信頼できないネットワーク上の攻撃者から内容が見える状態になります。"

  - question: "企業環境において、スプリットトンネリングが引き起こし得る問題として正しいのはどれか。"
    choices:
      - "常に、企業の保護機構をより強化する効果がある"
      - "DNSフィルタリングやファイアウォールといった、企業側の保護機構を回避する経路になり得る"
      - "企業のネットワーク全体を、技術的に停止させてしまう"
      - "この設定は、企業環境では技術的に使用できない"
    answerIndex: 1
    explanation: "企業環境では、スプリットトンネリングが、DNSフィルタリングやファイアウォールといった、企業側が敷いている保護機構そのものを回避する経路になってしまうことがあります。"

  - question: "フルトンネルが抱える、別のトレードオフとして正しいのはどれか。"
    choices:
      - "フルトンネルには、トレードオフが一切存在しない"
      - "同じローカルネットワーク上のNASやプリンターといった機器へのアクセスができなくなることがある"
      - "フルトンネルは、常にスプリットトンネリングより低速である"
      - "フルトンネルは、VPNの暗号化機能そのものを無効化する"
    answerIndex: 1
    explanation: "フルトンネルは安全側に倒した既定の構成ですが、同じローカルネットワーク上にあるNASやプリンターといった機器へのアクセスが、できなくなってしまうという副作用を抱えています。"

  - question: "実務で推奨される、スプリットトンネリングの適用方針として正しいのはどれか。"
    choices:
      - "すべての通信を、常にスプリットトンネリングの対象にする"
      - "特定のユーザー・役割・宛先だけに限定して適用し、それ以外は既定でフルトンネルにしておく"
      - "スプリットトンネリングという機能自体を、完全に廃止する"
      - "設定内容を定期的に確認する必要は一切ない"
    answerIndex: 1
    explanation: "実務では、特定のユーザー・役割・宛先だけに限定してスプリットトンネリングを適用し、それ以外は既定でフルトンネルにしておく、という最小適用の方針が推奨されます。"
