questions:
  - question: "FSMO(操作マスター)が存在する理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "AD DSのすべての操作をFSMOが単一マスターで処理しており、マルチマスターレプリケーションという仕組みはそもそも存在しない"
      - "複数のDCが同時に実行すると矛盾が生じうる特定の種類の操作だけを、フォレストまたはドメインの中で単一のDCに限定して実行させるため"
      - "FSMOはDCのハードウェア性能を測定するためだけの仕組みである"
      - "FSMOはクライアントPCのライセンス認証を管理するための仕組みである"
    answerIndex: 1
    explanation: "AD DSの通常の変更はマルチマスターレプリケーションが基本ですが、複数のDCが同時に実行すると矛盾が生じうる特定の種類の操作(スキーマ変更やSIDの採番など)については、単純な方法では正しく調停できません。FSMOはこうした操作を単一のDCに限定することで矛盾を防ぐ仕組みです。"

  - question: "5つのFSMOのうち、フォレスト全体でただ1台のDCが保持する役割はどれか。"
    choices:
      - "RIDマスターとPDCエミュレータ"
      - "スキーママスターとドメイン名前付けマスター"
      - "インフラストラクチャマスターとPDCエミュレータ"
      - "5つすべてがドメインごとに1台ずつ存在する"
    answerIndex: 1
    explanation: "スキーママスターとドメイン名前付けマスターはフォレスト全体でただ1台のDCが保持します。残り3つ(RIDマスター・PDCエミュレータ・インフラストラクチャマスター)はドメインごとに1台ずつ存在します。"

  - question: "RIDマスターの役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "各DCがオブジェクトを作成するたびに、毎回RIDマスターへ問い合わせて1個ずつRIDを取得する"
      - "各DCへあらかじめ一定範囲のRIDのブロックを事前に払い出しておき、各DCはそのブロック内で他のDCと調整せず自由にRIDを採番できるようにすることで、SIDの重複を防ぐ"
      - "RIDマスターは、ドメイン内のすべてのユーザーのパスワードを一元管理している"
      - "RIDマスターは、ドメイン内のすべてのDNSレコードを一元管理している"
    answerIndex: 1
    explanation: "RIDマスターは各DCへあらかじめ一定範囲のRIDのブロック(既定500個単位)を事前に払い出しておきます。各DCは自分のブロック内で他のDCと調整せず自由にRIDを採番でき、ブロックが尽きそうになるとRIDマスターへ次のブロックを要求します。これにより通信のたびに単一マスターへ問い合わせる必要をなくしつつ、SIDの重複を防いでいます。"

  - question: "PDCエミュレータが担っている実務的な役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ドメイン内の時刻同期の基準、パスワード変更の即時転送先、グループポリシー編集の既定ターゲットという複数の役割を兼ねている"
      - "PDCエミュレータは、Windows NT4時代の名残であり現代のWindows Serverでは一切機能していない"
      - "PDCエミュレータの役割は、ドメイン内のプリンターの一覧を管理することだけである"
      - "PDCエミュレータは、フォレスト内のスキーマ変更を実行する唯一のDCである"
    answerIndex: 0
    explanation: "PDCエミュレータは、ドメイン内の時刻同期(Windows Timeサービス)の基準、パスワード変更の即時転送先、グループポリシー編集の既定ターゲットという複数の実務的な役割を兼ねる、5つのFSMOの中でも影響範囲の大きい役割です。スキーマ変更を担うのはスキーママスターです。"

  - question: "インフラストラクチャマスターの配置に関する注意点について、記事の説明に最も合致するものはどれか。"
    choices:
      - "インフラストラクチャマスターは、必ずグローバルカタログ(GC)と同じDCに配置しなければならない"
      - "インフラストラクチャマスターの役割を持つDCは、原則としてGCを兼任させてはいけない(フォレスト内のすべてのDCがGCを兼任している場合を除く)。GCは他ドメインのオブジェクトも部分的に保持しているため、古い参照(ファントムオブジェクト)を検出できなくなるため"
      - "インフラストラクチャマスターとGCの配置に関する制約は、単一ドメインのフォレストでも常に厳密に守らなければならない"
      - "インフラストラクチャマスターは、DNSサーバーの役割を持つDCにしか配置できない"
    answerIndex: 1
    explanation: "GCはフォレスト内の他ドメインのオブジェクトについても部分的な複製を保持しているため、GC自身は参照先のオブジェクトの実際の状態を常に把握できてしまい、インフラストラクチャマスターが検出すべき古い参照(ファントムオブジェクト)を見つけられなくなります。そのためインフラストラクチャマスターは、フォレスト内の全DCがGCを兼任している場合を除き、GCと同じDCに配置すべきではありません。"

  - question: "FSMOの転送(Transfer)とシージ(Seize)の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "転送とシージは全く同じ操作であり、呼び方が違うだけである"
      - "転送は旧保持者が正常に稼働している状態で行う正規の手続きであり、シージは旧保持者が完全に失われ復旧不可能な場合に使う強制手段で、シージ後は旧DCを絶対にそのまま復帰させてはいけない"
      - "シージは日常的なメンテナンス作業として、転送より頻繁に行うべき操作である"
      - "転送は必ずシージを実行した後でなければ行えない"
    answerIndex: 1
    explanation: "転送は旧保持者(旧DC)がまだ正常に稼働している状態で行う正規の手続きです。シージは旧DCが完全に失われ復旧不可能な場合の強制手段であり、シージ後に旧DCがネットワークへ復帰すると同じ役割を2台のDCが同時に持つ深刻な整合性問題が起こりうるため、旧DCは完全にクリーンな状態にしてから再利用する必要があります。"

  - question: "FSMOをすべて1台に集約すべきか分散すべきかについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "常に5つすべてを1台のDCに集約すべきであり、分散させることは技術的に不可能である"
      - "役割ごとに異なる配置上の考慮事項があるため、常に集約すべき・常に分散すべきという単純な正解はなく、ドメイン数・GCの配置・可用性要件を踏まえて設計する必要がある"
      - "常に5つすべてを別々の5台のDCに分散させなければ、AD DSは正常に動作しない"
      - "FSMOの配置は一度決めたら二度と変更できない"
    answerIndex: 1
    explanation: "単一ドメインのフォレストでは集約する構成がよく見られる一方、複数ドメインを持つフォレストや可用性重視の環境では意図的に分散させる設計も採用されます。インフラストラクチャマスターとGCの配置制約のように役割ごとに異なる考慮事項があるため、単純な正解はありません。"
