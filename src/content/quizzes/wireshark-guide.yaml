questions:
  - question: "本ブログのハンズオン記事が採用している、パケットキャプチャの解析構成として記事内で説明されているものはどれか。"
    choices:
      - "Wiresharkをリモートのサーバー上で直接起動し、GUI環境をサーバー側に構築する"
      - "サーバー側でtcpdumpによりキャプチャファイルを取得し、scpで手元のPCへ転送してからWiresharkで開く"
      - "パケットキャプチャは行わず、ログファイルの解析だけで代用する"
      - "サーバー側で取得したキャプチャは、常にメールで自分に送信する"
    answerIndex: 1
    explanation: "サーバー側にGUI環境を用意する必要がなく、ファイルとして保存しておけば後からいつでも見返せるという理由から、tcpdumpでの取得+scpでの転送+手元のPCでのWiresharkという構成を採っています。"

  - question: "scp <ユーザー名>@<サーバーのIPアドレス>:/tmp/l2tp-capture.pcap ./というコマンドの末尾にある./の意味として、記事内で説明されているものはどれか。"
    choices:
      - "リモート側のファイルを削除する"
      - "転送したファイルをカレントディレクトリに保存する"
      - "SSHの接続を暗号化しないモードにする"
      - "ファイルを圧縮してから転送する"
    answerIndex: 1
    explanation: "scpのコマンド構造はscp <転送元> <転送先>で、末尾の./は「カレントディレクトリに保存する」という転送先の指定です。"

  - question: "sudo tcpdumpで取得したキャプチャファイルをscpで転送しようとするとPermission deniedになる場合の原因として、記事内で説明されているものはどれか。"
    choices:
      - "scpコマンド自体にバグがあり、常に失敗する"
      - "root権限で取得したファイルの所有者がrootになっており、SSH接続に使っている一般ユーザーに読み取り権限がないため"
      - "ネットワーク回線が遅すぎるため"
      - "Wiresharkがインストールされていないため"
    answerIndex: 1
    explanation: "sudo tcpdumpで取得したファイルはroot所有になるため、一般ユーザーでSSH接続している場合は読み取り権限がなくscpが失敗します。chmodで権限を緩めるか、tcpdumpの-Zオプションで所有者を指定する対処が必要です。"

  - question: "Wiresharkの「表示フィルタ」と「キャプチャフィルタ」の違いとして、記事内で説明されている正しい内容はどれか。"
    choices:
      - "両者はまったく同じ機能で、名前が違うだけである"
      - "表示フィルタはすでに記録された(または記録中の)パケットの中から表示するものを絞り込み、キャプチャフィルタはそもそも記録するパケット自体をキャプチャ開始時点で絞り込む"
      - "表示フィルタはtcpdumpのBPF構文を使い、キャプチャフィルタはWireshark独自の構文を使う"
      - "表示フィルタは有料版のWiresharkでしか使えない"
    answerIndex: 1
    explanation: "表示フィルタ(isakmpのような書式)は開いた/記録中の全パケットから表示するものだけを絞り込みます。キャプチャフィルタ(tcpdumpのBPF構文、udp port 500のような書式)はキャプチャ開始時点でそもそも記録するパケット自体を絞り込みます。"
