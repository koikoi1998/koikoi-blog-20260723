questions:
  - question: "ビットロット(bit rot)の正しい説明はどれか。"
    choices:
      - "ディスクが完全に故障し、読み取りエラーを報告する現象"
      - "ディスクがエラーを報告せずに、静かに1ビットだけ異なるデータを返してしまう現象"
      - "RAIDコントローラー自体が故障する現象"
      - "ネットワーク越しのストレージ接続が切断される現象"
    answerIndex: 1
    explanation: "ビットロットは、ディスクがエラーを報告せずに、静かに(サイレントに)1ビットだけ異なるデータを返してしまう現象です。"

  - question: "従来のRAIDコントローラーが、ミラーの不一致を検出したときに抱える限界として正しいのはどれか。"
    choices:
      - "常に正しい側を自動的に判断できる"
      - "どちらが正しいデータかを判断する手段を、そもそも持っていない"
      - "不一致を検出すること自体ができない"
      - "ディスクを自動的に交換してしまう"
    answerIndex: 1
    explanation: "RAIDコントローラーは、ミラーの2台が一致しないことを検知できても、どちらが正しいデータかを判断する手段を、そもそも持っていません。"

  - question: "ZFSのようなファイルシステムが、チェックサムをどこに保存しているかとして正しいのはどれか。"
    choices:
      - "データ本体と完全に同じ場所に、まとめて保存する"
      - "データ本体とは別の場所(ZFSの場合、親のブロックポインタ)に保存する"
      - "チェックサムは一切保存せず、都度生成する"
      - "別のディスク上の、まったく独立したファイルに保存する"
    answerIndex: 1
    explanation: "ZFSのようなファイルシステムは、データブロックごとのチェックサムを、データ本体とは別の場所(ZFSの場合、親のブロックポインタ)に保存します。"

  - question: "『スクラブ(scrub)』の役割として正しいのはどれか。"
    choices:
      - "ディスクの全データを削除する"
      - "普段は読み取られないパリティブロックまで含めて、ストレージ全体を定期的に検証し、破損を発見・修復する"
      - "RAIDの構成を自動的に変更する"
      - "ネットワーク越しのバックアップを自動的に取得する"
    answerIndex: 1
    explanation: "スクラブは、普段は読み取られないパリティブロックまで含めて、ストレージ全体のデータを定期的に読み取り、チェックサムを検証する処理です。"

  - question: "チェックサムを持たない従来のRAID1で、ミラー不一致の修復時に起こりうる、直感に反する結果として正しいのはどれか。"
    choices:
      - "常に正常な側の内容で統一される"
      - "破損した側の内容で、正常だった側を上書きしてしまい、破損が拡大することがある"
      - "両方のディスクが自動的に初期化される"
      - "不一致は検出された時点で自動的に消滅する"
    answerIndex: 1
    explanation: "どちらが正しいかを判断する手段がないまま上書きが行われるため、破損した側の内容で正常だった側を上書きしてしまい、破損が拡大することがあります。"
