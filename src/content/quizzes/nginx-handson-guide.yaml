questions:
  - question: "設定ファイルを`sites-available`に置いただけで、その設定は有効になるか。"
    choices:
      - "なる。それだけで自動的に有効化される"
      - "ならない。`sites-enabled`へのシンボリックリンクを作成する必要がある"
      - "Nginxを再インストールしないと有効にならない"
      - "設定ファイルの拡張子を.confにしないと有効にならない"
    answerIndex: 1
    explanation: "sites-enabledへのシンボリックリンクを作成しない限り、Nginxはsites-available内の設定ファイルを読み込みません。"

  - question: "`nginx -t`でエラーが出た場合、次に何をすべきか。"
    choices:
      - "そのまま`nginx -s reload`を実行する"
      - "エラーメッセージのファイル名・行番号を頼りに設定ファイルを修正する"
      - "Nginxをアンインストールして再インストールする"
      - "サーバー自体を再起動する"
    answerIndex: 1
    explanation: "構文エラーがある状態でreloadを実行すべきではありません。エラーメッセージに表示されたファイル名と行番号を頼りに、設定ファイルを修正する必要があります。"

  - question: "このハンズオンで、`location /api/`に指定した`proxy_pass`が行っていることは何か。"
    choices:
      - "静的ファイルを直接返す"
      - "リクエストをそのままバックエンドアプリ(3000番ポート)へ転送し、その応答を返す"
      - "リクエストを拒否する"
      - "リクエストをキャッシュしてから破棄する"
    answerIndex: 1
    explanation: "proxy_passは、リクエストをバックエンドアプリへ転送し、そこからの応答をそのままクライアントへ返す設定です。"

  - question: "複数のlocationが同時にマッチする場合、Nginxはどのように適用するlocationを決定するか。"
    choices:
      - "設定ファイルに書かれた順番で、最初に書かれたものを適用する"
      - "より長く、より具体的にマッチするパターンを優先する"
      - "ランダムに1つを選択する"
      - "アルファベット順に最も早いものを適用する"
    answerIndex: 1
    explanation: "Nginxは、複数のlocationが同時にマッチする場合、より長く具体的にマッチするパターンを優先するという規則で適用順序を決定します。"

  - question: "バックエンドアプリを`127.0.0.1`にのみバインドし、Nginxからの転送でしか到達できないようにする設計の利点は何か。"
    choices:
      - "バックエンドアプリの処理速度が自動的に向上する"
      - "TLS終端やキャッシュなどをNginxに集約し、バックエンドはビジネスロジックに集中できる"
      - "この設計にすると、バックエンドアプリのコードを書く必要がなくなる"
      - "セキュリティ上の利点は特にない"
    answerIndex: 1
    explanation: "Nginxという1つの窓口にTLS終端・キャッシュ・レートリミットなどを集約し、バックエンドアプリケーションサーバーはビジネスロジックだけに集中できる、という役割分担が実現されます。"
