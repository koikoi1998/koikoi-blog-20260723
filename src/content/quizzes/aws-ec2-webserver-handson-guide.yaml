questions:
  - question: "このハンズオンで、セキュリティグループのSSHルールのソースを「マイIP」に絞っている理由は何か。"
    choices:
      - "AWSの仕様上、Anywhereに設定することができないため"
      - "不要な通信は許可しないという原則を、必要最小限の穴だけを開ける形で実践するため"
      - "マイIPに絞ると通信速度が向上するため"
      - "料金を安くするため"
    answerIndex: 1
    explanation: "SSH(22番ポート)を世界中に公開したままにするのは実務では避けるべき設定であり、必要最小限の穴だけを開けるという原則を実践しています。"

  - question: "ダウンロードした`.pem`ファイルで、SSH接続前に必ず実行すべきコマンドはどれか。"
    choices:
      - "chmod 777 my-key.pem"
      - "chmod 400 my-key.pem"
      - "chown root my-key.pem"
      - "特に何も実行する必要はない"
    answerIndex: 1
    explanation: "chmod 400を実行せずに接続しようとすると、パーミッションが緩すぎるという警告とともに接続を拒否されます。"

  - question: "EC2インスタンスの課金を完全に止めたい場合、StopとTerminateのどちらを実行すべきか。"
    choices:
      - "Stop(停止)であれば十分である"
      - "Terminate(終了)が必要である。Stopだけではアタッチされたストレージの課金が継続する"
      - "どちらを実行しても課金への影響は同じである"
      - "課金を止めるには、AWSサポートへの問い合わせが必要である"
    answerIndex: 1
    explanation: "Stopではアタッチされたままのストレージ(EBS)の課金が継続します。完全に課金を止めるにはTerminate(終了)が必要です。"

  - question: "Elastic IPについて、正しい説明はどれか。"
    choices:
      - "確保しておくだけであれば、常に無料である"
      - "稼働中のインスタンスにアタッチされていない場合、課金が発生する"
      - "Elastic IPは一度確保すると、二度と課金されることはない"
      - "Elastic IPは無料利用枠の対象外であり、確保した瞬間から必ず課金される"
    answerIndex: 1
    explanation: "Elastic IPは稼働中のインスタンスにアタッチされている間は無料ですが、アタッチ先を失うと課金が発生します。"

  - question: "AWSのセキュリティグループが「ステートフル」であるとは、具体的にどういう意味か。"
    choices:
      - "設定を変更すると、即座に世界中のリージョンに反映されること"
      - "インバウンドで許可した通信の戻り(応答)は、アウトバウンドを個別に許可しなくても自動的に通ること"
      - "セキュリティグループの設定履歴が永続的に保存されること"
      - "同じセキュリティグループを複数のVPCで共有できること"
    answerIndex: 1
    explanation: "セキュリティグループはステートフルなため、インバウンドで許可した通信の戻りの通信は自動的に許可され、アウトバウンドを個別に設定する必要はありません。"
