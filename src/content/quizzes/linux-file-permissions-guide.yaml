questions:
  - question: "chmod 600というコマンドの数字は、何を表しているか。"
    choices:
      - "所有者・グループ・その他の3区分それぞれについて、read=4・write=2・execute=1の合計値を1桁ずつ並べたもの"
      - "ファイルの作成日時を表すタイムスタンプ"
      - "そのファイルを読み書きできる最大ユーザー数"
      - "ファイルサイズの上限をKB単位で表したもの"
    answerIndex: 0
    explanation: "chmodの数値表記は、所有者・グループ・その他の3区分それぞれについて、read(4)・write(2)・execute(1)の合計値を1桁の数字にしたものです。600は所有者がrw(4+2)、グループ・その他が権限なし(0)を意味します。"

  - question: "ディレクトリに対する書き込み権限(w)が意味することとして正しいものはどれか。"
    choices:
      - "ディレクトリ内のファイルの中身を直接書き換えられる"
      - "ディレクトリ内にファイルを作成・削除できる(ファイル自体の権限とは無関係)"
      - "ディレクトリを別の場所にコピーできる"
      - "ディレクトリの所有者を変更できる"
    answerIndex: 1
    explanation: "ディレクトリのw権限は、そのディレクトリ内にファイルを作成・削除できるかどうかを表します。あるファイルを削除できるかどうかは、そのファイル自体の権限ではなく、親ディレクトリのw権限で決まります。"

  - question: "setuidビットを実行ファイルに設定すると何が起きるか。"
    choices:
      - "そのファイルの実行速度が向上する"
      - "実行したユーザーが誰であっても、プログラムはファイルの所有者の権限で動作する"
      - "そのファイルを削除できなくなる"
      - "そのファイルの所有者が自動的にrootに変更される"
    answerIndex: 1
    explanation: "setuidは、実行したユーザーに関わらずプログラムをファイル所有者の権限で動作させる仕組みです。/usr/bin/passwdがroot所有でsetuidを持つことで、一般ユーザーでも決まった検証ロジックを通してのみ/etc/shadowを書き換えられるようになっています。"

  - question: "カーネルはファイルのパーミッションをいつ検査しているか。"
    choices:
      - "OS起動時に1回だけ、全ファイルをまとめて検査する"
      - "ファイルが作成された瞬間だけ検査し、以降は検査しない"
      - "open()/read()/write()などのシステムコールでファイルにアクセスされるたびに、VFS層がその都度検査する"
      - "ユーザーが明示的にls -lを実行したときだけ検査する"
    answerIndex: 2
    explanation: "パーミッションは静的な設定ではなく、プロセスがシステムコールでファイルにアクセスするたびにカーネルのVFS層が動的に検査しています。chmod 600の効果が「常に」効いているのはこのためです。"

  - question: "シェルスクリプトにsetuidを設定しても多くのLinuxディストリビューションで意図通りに動かない理由として、記事内で説明されているものはどれか。"
    choices:
      - "シェルスクリプトにはinodeが存在しないため"
      - "シェバン行を経由したシェル本体への間接的な実行呼び出しになり、競合状態を悪用した権限昇格が成立しやすいため"
      - "シェルスクリプトは常にroot権限で実行される仕様になっているため"
      - "setuidはバイナリファイルにのみ存在するビットで、テキストファイルには物理的に設定できないため"
    answerIndex: 1
    explanation: "シェルスクリプトの実行はカーネルがシェバンを見てシェル本体をexecし、スクリプトが引数として渡されるという間接呼び出しになるため、この間の競合状態を悪用した権限昇格のリスクがあり、setuidは主にコンパイル済みバイナリに限定して使うのが実務上の鉄則です。"

  - question: "chown(所有者の変更)とchgrp(グループの変更)の権限要件の違いとして正しいものはどれか。"
    choices:
      - "両方とも一般ユーザーが自由に実行できる"
      - "所有者の変更にはroot権限が必要だが、グループの変更は所有者が自分の所属するグループの範囲内で行える"
      - "グループの変更にはroot権限が必要だが、所有者の変更は誰でもできる"
      - "両方ともroot権限がなければ一切実行できない"
    answerIndex: 1
    explanation: "所有者の変更(chown)は、一般ユーザーが自由に他人へファイルを譲渡できると都合が悪いためroot権限が必要です。一方グループの変更は、所有者自身が自分の所属するグループの範囲内であれば実行できます。"
