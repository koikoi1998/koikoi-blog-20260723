questions:
  - question: "ドメインにCAAレコードが一切設定されていない場合、既定の挙動として正しいのはどれか。"
    choices:
      - "どの認証局も証明書を発行できない"
      - "どの認証局でもそのドメインの証明書を発行できる"
      - "DNSSECが自動的に無効化される"
      - "HTTPSでの通信そのものができなくなる"
    answerIndex: 1
    explanation: "CAAレコードは、指定した1つのCAだけに制限するためのオプトイン方式の仕組みであり、何も宣言しなければ制限は一切かかりません。"

  - question: "CAAレコードの`issuewild`タグの役割として正しいのはどれか。"
    choices:
      - "通常の証明書とワイルドカード証明書の両方を許可する"
      - "ワイルドカード証明書だけに適用される、より限定的な許可を指定する"
      - "DNSSECの署名検証を許可する"
      - "ポリシー違反時の通知先を指定する"
    answerIndex: 1
    explanation: "issuewildタグは、ワイルドカード証明書だけに適用される、より限定的な許可であり、存在する場合、issueタグの内容はワイルドカード証明書に関して無視されます。"

  - question: "CAAチェックが、すべての公的な認証局にとって義務になった時期として正しいのはどれか。"
    choices:
      - "2010年1月"
      - "2017年9月8日以降"
      - "2020年12月"
      - "義務化されたことはない"
    answerIndex: 1
    explanation: "CA/Browser Forumが2017年3月に採択したBallot 187により、2017年9月8日以降、すべての公的な認証局が証明書発行前にCAAレコードを確認することが義務化されました。"

  - question: "DNSの問い合わせ自体が失敗した場合(SERVFAILなど)の、CAAチェックの設計として正しいのはどれか。"
    choices:
      - "安全側に倒して、証明書の発行を拒否する"
      - "問題なく証明書の発行を許可する"
      - "DNSSECへ自動的に切り替える"
      - "別のCAへ自動的に発行を委任する"
    answerIndex: 0
    explanation: "DNSの問い合わせ自体が失敗した場合も、安全側に倒して発行を拒否する、というフェイルセーフの設計になっています。"

  - question: "CAAレコードと、DNSSECの目的の違いとして正しいのはどれか。"
    choices:
      - "両者は完全に同じ目的のためのレコードである"
      - "DNSSECはDNS応答の真正性を証明し、CAAは証明書を発行できるCAを制限する"
      - "DNSSECは証明書を発行できるCAを制限し、CAAはDNS応答の真正性を証明する"
      - "どちらもメールの送信元認証のための仕組みである"
    answerIndex: 1
    explanation: "DNSSECはDNSの応答そのものの真正性を証明する仕組みであり、CAAは証明書を発行できるCAを制限する仕組みで、目的が異なります。"
