questions:
  - question: "ホストベースルーティングとパスベースルーティングの違いとして正しいのはどれか。"
    choices:
      - "両者は完全に同じ機能の、別名である"
      - "ホストベースは異なるホスト名を、パスベースは異なるURLパスのプレフィックスを見て、それぞれ異なるバックエンドへ振り分ける"
      - "ホストベースは、L4ロードバランサーだけが持つ機能である"
      - "パスベースは、TCP/UDPヘッダーだけを見て振り分ける"
    answerIndex: 1
    explanation: "ホストベースルーティングは異なるホスト名を、パスベースルーティングは異なるURLパスのプレフィックスを見て、それぞれ異なるバックエンドのプールへ振り分けます。"

  - question: "パスベースルーティングのルールが、意図しない振り分けを引き起こす典型的な原因として正しいのはどれか。"
    choices:
      - "ルールの数が多すぎること"
      - "より一般的なパスのルールが、より具体的なルールより先に配置されていること"
      - "ルールに、色の指定が含まれていないこと"
      - "バックエンドサーバーの台数が少なすぎること"
    answerIndex: 1
    explanation: "ルールは通常上から評価され、最初にマッチしたルールが適用されるため、より一般的なルールがより具体的なルールより先に配置されていると、意図しない振り分けが発生します。"

  - question: "L4ロードバランサーが、パスベースルーティングを実現できない理由として正しいのはどれか。"
    choices:
      - "L4は、あまりにも処理速度が遅いから"
      - "L4は、TCP/UDPヘッダーのIPアドレスとポート番号だけを見るため、HTTPリクエストの内容であるパスを参照できないから"
      - "L4は、暗号化された通信にしか対応していないから"
      - "L4は、1台のサーバーにしか振り分けられないから"
    answerIndex: 1
    explanation: "L4ロードバランサーは、TCP/UDPヘッダーのIPアドレスとポート番号だけを見るため、HTTPリクエストの内容であるパスやホスト名を、そもそも参照することができません。"

  - question: "1つの振り分けルールの中で組み合わせられる条件として正しいのはどれか。"
    choices:
      - "パスとホスト名だけで、他の条件は一切組み合わせられない"
      - "パス・ホスト名・HTTPメソッド・送信元IPアドレスなど、複数の条件を組み合わせることができる"
      - "条件は、常に1つのルールにつき1つだけに限定される"
      - "条件を組み合わせることは、技術的に不可能である"
    answerIndex: 1
    explanation: "パス・ホスト名に加えて、HTTPメソッドや送信元IPアドレス、クエリパラメータといった、複数の条件を、1つの振り分けルールの中で組み合わせることができます。"

  - question: "新しいルーティングルールを追加する際に、確認すべきこととして正しいのはどれか。"
    choices:
      - "ルールの文字数が、規定の上限を超えていないか"
      - "新しいルールが、既存のどのルールより先に、あるいは後に評価されるべきか"
      - "ルールの色が、既存のルールと重複していないか"
      - "ルールの作成日時が、正しく記録されているか"
    answerIndex: 1
    explanation: "新しいルールを追加するたびに、「この新しいルールは、既存のどのルールより先に、あるいは後に評価されるべきか」を問い直すことが、意図しない振り分けを防ぐために重要です。"
