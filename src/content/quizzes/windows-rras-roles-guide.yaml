questions:
  - question: "RRAS(Routing and Remote Access Service)という名前が示す構成について、記事の説明に最も合致するものはどれか。"
    choices:
      - "RRASはVPNアクセス機能のためだけに設計された、単一目的のサービスである"
      - "「ルーティング」に属する機能群(NAT・LANルーティング・デマンドダイヤルアクセス)と、「リモートアクセス」に属する機能群(VPNアクセス・ダイヤルアップアクセス)という、2つの異なる目的の機能セットが歴史的に1つのサービスへ統合されている"
      - "RRASという名前は、ルーターの製造元(Router and Remote Access Systems)の略称である"
      - "RRASはリモートアクセスの機能のみを提供し、ルーティング機能は一切持たない"
    answerIndex: 1
    explanation: "RRAS(Routing and Remote Access Service)という名前自体が示す通り、「ルーティング」に属する機能群(NAT・LANルーティング・デマンドダイヤルアクセス)と「リモートアクセス」に属する機能群(VPNアクセス・ダイヤルアップアクセス)という、2つの異なる目的の機能セットが、歴史的に1つのサービスへ統合されています。"

  - question: "VPNアクセスとダイヤルアップアクセスの本質的な違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "VPNアクセスとダイヤルアップアクセスは完全に同一の技術であり、名前が違うだけである"
      - "VPNアクセスはインターネット経由の暗号化トンネルを使うのに対し、ダイヤルアップアクセスは電話線を使った直接のPPP接続であり、インターネットという概念自体が介在しない"
      - "VPNアクセスは有線LANのみ、ダイヤルアップアクセスはWi-Fiのみをサポートする"
      - "ダイヤルアップアクセスは、VPNアクセスより新しく開発された後継技術である"
    answerIndex: 1
    explanation: "VPNアクセスとダイヤルアップアクセスはどちらもリモートのクライアント端末を社内ネットワークへ参加させるという目的は共通していますが、VPNアクセスはインターネット経由の暗号化トンネルを使うのに対し、ダイヤルアップアクセスは電話線を使った直接のPPP接続であり、インターネットという概念自体が介在しません。"

  - question: "デマンドダイヤルアクセスの最大の特徴について、記事の説明に最も合致するものはどれか。"
    choices:
      - "常時接続を維持し、通信の有無に関わらず一切切断しない"
      - "相手拠点宛の通信が実際に発生したときだけオンデマンドで接続を確立し、一定時間通信がなければ自動的に切断する"
      - "デマンドダイヤルアクセスは、クライアント端末とサーバー間の接続専用の機能である"
      - "デマンドダイヤルアクセスは、必ずVPNプロトコルを使わなければ機能しない"
    answerIndex: 1
    explanation: "デマンドダイヤルアクセスは、相手拠点宛の通信が実際に発生したときだけオンデマンドで接続を確立し、一定時間通信が発生しなければ自動的に切断するという動作が最大の特徴です。これは従量課金の回線を使っていた時代のコスト抑制のための設計思想を反映しています。"

  - question: "デマンドダイヤルアクセスとVPNプロトコルの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "デマンドダイヤルアクセスは、VPNプロトコルを使わなければ技術的に機能しない"
      - "「オンデマンドで接続を確立・切断する」という制御ロジックと「実際に何のプロトコルで接続するか」は独立した別の設計要素であり、歴史的には実際のダイヤルアップ回線でもこの仕組みが使われていた"
      - "デマンドダイヤルアクセスは、2020年以降に初めて登場した最新の機能である"
      - "デマンドダイヤルアクセスとVPNアクセスは、まったく同じ機能の別名である"
    answerIndex: 1
    explanation: "デマンドダイヤルという「オンデマンドで接続する」制御ロジック自体は、接続方式に依存しない仕組みです。歴史的には実際のアナログ電話線やISDN回線を使った直接のダイヤルアップ接続でもデマンドダイヤルの仕組みが使われていました。現在ではVPN接続をその接続方式として使う構成が主流です。"

  - question: "LANルーティングという役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "LANルーティングは、5つの役割の中で最も複雑で、VPN・NAT・デマンドダイヤルのすべての機能を内包している"
      - "LANルーティングは、VPN・ダイヤルアップ・NAT・デマンドダイヤルのいずれも行わず、サーバーに接続された複数のネットワークインターフェース間でIPパケットを単純に中継するだけの、最も単純な機能である"
      - "LANルーティングは、インターネットへの接続を暗号化するための機能である"
      - "LANルーティングは、Windows Serverではなく専用ハードウェアでしか実現できない機能である"
    answerIndex: 1
    explanation: "LANルーティングは5つの役割の中で最も単純な機能であり、VPN・ダイヤルアップ・NAT・デマンドダイヤルのいずれも行わず、サーバーに接続された複数のネットワークインターフェース(複数のLANセグメント)の間でIPパケットを単純に中継するだけの、純粋なルーター機能です。"
