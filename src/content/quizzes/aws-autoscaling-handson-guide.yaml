questions:
  - question: "ASG(Auto Scaling Group)の既定のヘルスチェックタイプとして正しいのはどれか。"
    choices:
      - "ELB"
      - "EC2"
      - "ALB"
      - "CloudWatch"
    answerIndex: 1
    explanation: "ASGの既定のヘルスチェックタイプはEC2であり、これはインスタンスがAWS側から見て正常に起動しているかどうかだけを確認します。"

  - question: "アプリケーション自体がクラッシュし、ALBのヘルスチェックが失敗し続けているのに、ASGがインスタンスを置き換えない理由として正しいのはどれか。"
    choices:
      - "ASGには、インスタンスを置き換える機能自体がない"
      - "ヘルスチェックタイプがEC2のままで、ALBのヘルスチェック結果を見ていない"
      - "ALBのヘルスチェックが、常に成功と判定されるため"
      - "インスタンスの最大キャパシティに達しているため"
    answerIndex: 1
    explanation: "ASGの既定のヘルスチェックタイプはEC2であり、ALBのヘルスチェック結果は、明示的にELBヘルスチェックタイプへ変更しない限り見られません。"

  - question: "起動テンプレートの、設計上の特徴として正しいのはどれか。"
    choices:
      - "作成後に、いつでも直接編集できる"
      - "作成後に直接編集できず、変更する場合は新しいバージョンを作成する必要がある"
      - "1つのASGにつき、起動テンプレートは不要である"
      - "起動テンプレートは、EC2インスタンスの起動後にのみ作成できる"
    answerIndex: 1
    explanation: "起動テンプレートは、作成後に直接編集できず、変更する場合は新しいバージョンを作成するという、イミュータブルな設計になっています。"

  - question: "ヘルスチェックグレースピリオドの役割として正しいのはどれか。"
    choices:
      - "インスタンスを永久に終了させないための設定"
      - "新しいインスタンスが起動してから、実際にヘルスチェックの判定対象となるまでの猶予期間"
      - "ASGの最大キャパシティを制限する設定"
      - "CPU使用率の目標値を決定する設定"
    answerIndex: 1
    explanation: "ヘルスチェックグレースピリオドは、起動直後の一時的な不健康状態を誤って異常と判定しないための、猶予期間です。"

  - question: "ASGのライフサイクルフックが、ロードバランシング学科で扱ったどの仕組みと同じ目的を持つか。"
    choices:
      - "コネクションドレイン"
      - "GSLB"
      - "PROXY protocol"
      - "コンシステントハッシュ"
    answerIndex: 0
    explanation: "ライフサイクルフックは、インスタンスを終了する前にカスタムの処理を挟み込む仕組みであり、サーバーを安全に外すコネクションドレインと、同じ目的を持っています。"
