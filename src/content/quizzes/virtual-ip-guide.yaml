questions:
  - question: "代表IP(VIP)を実現する「IPテイクオーバー方式」の実体として、記事の説明に最も合致するものはどれか。"
    choices:
      - "ロードバランサーが代表IP宛のパケットを実IPへNAT変換して転送する"
      - "代表IP自体が、その瞬間に稼働している物理サーバーのNICへ直接割り当てられているだけで、変換処理は存在しない"
      - "代表IPはDNSサーバー側で実IPに名前解決される"
      - "代表IPは常に複数のサーバーが同時に保持し、ラウンドロビンで応答する"
    answerIndex: 1
    explanation: "IPテイクオーバー方式(VRRP/クラスタリングなど)では、代表IPと実IPの間に変換処理は存在せず、代表IPというIPアドレス自体が稼働系サーバーのNICに追加で割り当てられているだけです。"

  - question: "IPテイクオーバー方式でフェイルオーバーが起きた際に、新しい稼働系サーバーが行う処理として記事が説明しているものはどれか。"
    choices:
      - "DNSサーバーに問い合わせて代表IPの新しい割り当て先を確認する"
      - "自分のNICに代表IPを追加し、Gratuitous ARPを送信してスイッチ・周辺機器のMAC情報を更新する"
      - "ロードバランサーに新しい実IPを登録する"
      - "代表IPのサブネットマスクを変更する"
    answerIndex: 1
    explanation: "新しく稼働系になったサーバーは自分のNICに代表IPを追加し、Gratuitous ARP(自発的ARP)を送信することで、スイッチのMACアドレス表や周辺機器のARPキャッシュを即座に更新し、以後の通信が自分に届くようにします。"

  - question: "ロードバランサーが行うNAT変換方式が、IPテイクオーバー方式に対して持つ特徴として、記事の説明に最も合致するものはどれか。"
    choices:
      - "複数の実サーバーに同時にトラフィックを振り分けられる(ロードバランシングができる)"
      - "変換処理が一切発生しない"
      - "Gratuitous ARPを使わずには成立しない"
      - "常に1台のサーバーしか応答できない"
    answerIndex: 0
    explanation: "NAT変換方式は宛先IPをその都度実サーバーへ書き換えられるため、複数の実サーバーへトラフィックを振り分けるロードバランシングが可能です。IPテイクオーバーは基本的に常にどちらか1台だけが代表IPを持ちます。"

  - question: "NICチーミングの仮想IPと、クラスタの代表IP(VIP)の違いとして、記事の説明に最も合致するものはどれか。"
    choices:
      - "両者はまったく同じ仕組みであり、区別する意味はない"
      - "NICチーミングは1台のサーバー内の複数物理NICを1つの論理NICに見せる技術、代表IPは複数台のサーバーを1つの論理的な宛先に見せる技術であり、抽象化する対象のレイヤーが異なる"
      - "NICチーミングは複数サーバー向け、代表IPは単一サーバー内のNIC向けの技術である"
      - "NICチーミングは必ずNAT変換を伴うが、代表IPは伴わない"
    answerIndex: 1
    explanation: "NICチーミングは1台のサーバー内の複数物理NICの抽象化、代表IPは複数台のサーバーの抽象化であり、どちらも「複数の実体を1つに見せる」発想は共通しますが、対象のレイヤーが異なります。"

  - question: "1枚の物理NICが実IPと代表IPという複数のIPアドレスを同時に持てる理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "特殊な仮想化ハードウェアがなければ実現できない"
      - "1枚のNICに複数のIPアドレスを割り当てるIPエイリアスは標準的にサポートされている機能であり、NICは自分宛のどのIPアドレス宛のフレームでも受信処理を行うから"
      - "OSが自動的にどちらか一方のIPアドレスを無効化するため、実質1つしか使われていないから"
      - "代表IPは物理的に別のNICに割り当てられているから"
    answerIndex: 1
    explanation: "1枚の物理NICに複数のIPアドレスを割り当てるIPエイリアスは標準機能であり、NICは自分宛のIPアドレスであればどれ宛のフレームでも受信します。稼働系サーバーは実IPと代表IPの両方を同じNICで同時に受け付けています。"

  - question: "フェイルオーバー直後に一部のクライアントだけ旧サーバーへの送信を続けてしまう現象の主な原因として、記事が挙げているものはどれか。"
    choices:
      - "新しい稼働系サーバーが代表IPの割り当てに失敗しているから"
      - "Gratuitous ARPが確実に全機器に届く保証はなく、一部機器のARPキャッシュが更新されずタイムアウトを待つ必要があるから"
      - "ロードバランサーがすべてのトラフィックを新サーバーに転送し忘れているから"
      - "代表IPのサブネットマスクが誤っているから"
    answerIndex: 1
    explanation: "Gratuitous ARPはスイッチや周辺機器のARPキャッシュを能動的に更新する仕組みですが、確実に全機器に届く保証はありません。一部の機器では更新が反映されず、ARPキャッシュのタイムアウトを待つまでタイムラグが生じることがあります。"

  - question: "代表IPに関する誤解として、記事が明確に否定しているものはどれか。"
    choices:
      - "代表IPは必ずNAT(アドレス変換)によって実現されている"
      - "IPテイクオーバー方式では代表IPと実IPの間に変換処理が存在しない場合がある"
      - "ロードバランサー自体も単一障害点になりうるため冗長化されることがある"
      - "フェイルオーバー直後にタイムラグが生じることがある"
    answerIndex: 0
    explanation: "Windows Serverのフェイルオーバークラスタリングやkeepalived(VRRP)のようなIPテイクオーバー方式では変換は一切行われません。NAT変換が行われるのはロードバランサーを使う方式に限られます。"

  - question: "VRRP(Virtual Router Redundancy Protocol)の基本的な動作として、記事の説明に最も合致するものはどれか。"
    choices:
      - "複数台のルーターが仮想ルーターを構成し、優先度が最も高い1台がマスターとして仮想IP・仮想MACアドレスを保持する"
      - "すべてのルーターが常に同時に仮想IPで応答する"
      - "仮想IPの切り替えにはDNSの再設定が必須である"
      - "VRRPはNICチーミングの標準規格である"
    answerIndex: 0
    explanation: "VRRPは複数台のルーターで仮想ルーターを構成し、優先度が最も高い1台がマスターとして仮想IP・仮想MACアドレスを保持します。マスターの生存通知が届かなくなると次に優先度の高いルーターが引き継ぎます。"
