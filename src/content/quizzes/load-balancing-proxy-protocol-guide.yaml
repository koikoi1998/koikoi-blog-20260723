questions:
  - question: "バックエンドサーバーのアクセスログに、クライアントではなくロードバランサー自身のIPアドレスが記録される理由として正しいのはどれか。"
    choices:
      - "ロードバランサーの設定ミスが原因である"
      - "L7ロードバランサーが、クライアント側とバックエンド側で別々のTCP接続を確立する構造上、必然的に起きる"
      - "バックエンドサーバーのログ機能が壊れているため"
      - "DNSの設定が誤っているため"
    answerIndex: 1
    explanation: "L7ロードバランサーはクライアント側とバックエンド側で別々のTCP接続を確立するため、バックエンドから見た送信元は常にロードバランサー自身になります。"

  - question: "X-Forwarded-Forヘッダーが、L4ロードバランサーでは使用できない理由として正しいのはどれか。"
    choices:
      - "L4ロードバランサーは暗号化通信にしか対応していないため"
      - "XFFはHTTPヘッダーであり、HTTPの内容を解釈しないL4ロードバランサーでは追記できないため"
      - "XFFはUDPプロトコルでしか動作しないため"
      - "L4ロードバランサーには十分な処理能力がないため"
    answerIndex: 1
    explanation: "XFFはアプリケーション層のHTTPヘッダーであり、HTTPの内容を一切解釈しないL4ロードバランサーには、それを追記する仕組みがありません。"

  - question: "複数のプロキシを経由したXFFヘッダーにおいて、最も信頼できる『本当のクライアントIP』はどこにあるか。"
    choices:
      - "リストの末尾(最後に追記されたもの)"
      - "リストの先頭(最初に追記されたもの)"
      - "リストの中央の値"
      - "XFFヘッダーには信頼できる情報は含まれない"
    answerIndex: 1
    explanation: "最初に追記された値、つまりリストの先頭が、最も元のクライアントに近い情報です。"

  - question: "PROXY protocolがL4ロードバランサーでも使用できる理由として正しいのはどれか。"
    choices:
      - "HTTPヘッダーとして情報を伝達するため"
      - "TCP接続確立直後に、プロトコルの内容より前に情報を挿入する、より低レイヤーのアプローチであるため"
      - "DNSレコードを使用して情報を伝達するため"
      - "TLS証明書の中に情報を埋め込むため"
    answerIndex: 1
    explanation: "PROXY protocolは、HTTPの内容を解釈せずに、TCP接続直後の低レイヤーで情報を挿入するため、L4ロードバランサーでも使用できます。"

  - question: "PROXY protocolを有効にする際に必要な作業として正しいのはどれか。"
    choices:
      - "ロードバランサー側だけで有効にすればよい"
      - "ロードバランサー側とバックエンドサーバー側の両方で、明示的に対応設定を有効にする必要がある"
      - "バックエンドサーバー側だけで有効にすればよい"
      - "DNSサーバー側で有効にする必要がある"
    answerIndex: 1
    explanation: "両方で対応設定を有効にしないと、ヘッダーの内容が誤って解釈され、通信エラーが発生します。"
