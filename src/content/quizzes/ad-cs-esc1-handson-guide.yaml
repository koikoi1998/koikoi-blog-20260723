questions:
  - question: "ESC1攻撃が悪用する、証明書テンプレートの設定として正しいのはどれか。"
    choices:
      - "テンプレートの名前が、デフォルトのままになっている設定"
      - "ENROLLEE_SUPPLIES_SUBJECTが有効で、申請者がサブジェクト名を自由に指定できる設定"
      - "証明書の有効期限が、1年に設定されている設定"
      - "CAがオフラインルートCAとして構成されている設定"
    answerIndex: 1
    explanation: "ESC1は、ENROLLEE_SUPPLIES_SUBJECTというフラグが有効で、証明書の申請者自身が、証明書に記載する識別情報(サブジェクト名)を自由に指定できてしまう設定ミスを悪用します。"

  - question: "ESC1が成立するために必要な4つの条件に含まれないものはどれか。"
    choices:
      - "ENROLLEE_SUPPLIES_SUBJECTが有効であること"
      - "クライアント認証などの拡張キー使用法(EKU)が設定されていること"
      - "マネージャーの承認が必須に設定されていること"
      - "低い権限のユーザーに発行権限が与えられていること"
    answerIndex: 2
    explanation: "ESC1が成立するには、マネージャーの承認が不要であることが条件の1つです。承認が必須であれば、低権限ユーザーが単独で不正な証明書を取得することはできません。"

  - question: "ESC1で発行された不正な証明書が、対象ユーザーのパスワードリセット後も有効である理由として正しいのはどれか。"
    choices:
      - "証明書は、パスワードと技術的に完全に無関係な仕組みであり、明示的に失効させない限り有効なままだから"
      - "パスワードリセットは、証明書の有効期限を自動的に延長するから"
      - "証明書は、1週間ごとに自動的に再発行されるから"
      - "この記述自体が誤りであり、実際には即座に無効化される"
    answerIndex: 0
    explanation: "証明書は、対象ユーザーのパスワードがリセットされても、証明書自体を明示的に失効(CRLへ追加)させない限り、有効なまま使い続けられます。"

  - question: "シャドウクレデンシャル攻撃とESC1の関係として正しいのはどれか。"
    choices:
      - "まったく同じ攻撃であり、呼び方が違うだけである"
      - "どちらも同じPKINIT認証を乗っ取るが、鍵の書き込みと証明書の不正発行という、まったく別の経路を使う"
      - "ESC1は、シャドウクレデンシャル攻撃を防いだ場合にのみ成立する攻撃である"
      - "この2つの攻撃は、技術的に互いを無効化する"
    answerIndex: 1
    explanation: "シャドウクレデンシャル攻撃はmsDS-KeyCredentialLinkへの鍵の書き込みでPKINIT認証を乗っ取りますが、ESC1はCAに証明書を正規に発行させることで、同じPKINIT認証を別の経路で乗っ取ります。"

  - question: "危険な証明書テンプレートを特定するための、正しいアプローチはどれか。"
    choices:
      - "テンプレートの名前だけを目視で確認する"
      - "CertifyやCertipyのようなツールで、ENROLLEE_SUPPLIES_SUBJECT・EKU・承認要否・発行権限の4条件を、テンプレートごとに棚卸しする"
      - "すべてのテンプレートを、確認せずに削除する"
      - "証明書の発行履歴を一切確認せず、CAの再起動だけを行う"
    answerIndex: 1
    explanation: "CertifyやCertipyのようなツールを使い、ENROLLEE_SUPPLIES_SUBJECT・EKU・承認要否・発行権限という4条件を、テンプレートごとに体系的に棚卸しすることが、危険なテンプレートを特定する正しいアプローチです。"
