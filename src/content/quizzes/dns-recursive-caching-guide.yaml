questions:
  - question: "フォワーダーの説明として正しいのはどれか。"
    choices:
      - "権威サーバーが、自分のゾーンデータを別のサーバーへコピーする仕組み"
      - "再帰リゾルバが、自力でルートから辿る代わりに、問い合わせを別のDNSサーバーへ丸ごと委譲する構成"
      - "クライアントが、キャッシュを一切使わずに毎回問い合わせる設定"
      - "ゾーン転送を暗号化するための仕組み"
    answerIndex: 1
    explanation: "フォワーダーは、再帰リゾルバがforwardersに指定された別のDNSサーバーへ問い合わせを丸ごと委譲する構成です。"

  - question: "forward onlyを指定した場合の挙動として正しいのはどれか。"
    choices:
      - "フォワーダーへの問い合わせが失敗しても、自力でのフル解決にフォールバックする"
      - "フォワーダーへの問い合わせが失敗した場合、自力でのフル解決にフォールバックしない"
      - "常にルートサーバーへ直接問い合わせる"
      - "ネガティブキャッシュを完全に無効化する"
    answerIndex: 1
    explanation: "forward onlyを指定すると、フォワーダーへの問い合わせが失敗しても、自力でのフル解決へのフォールバックが行われなくなります。"

  - question: "ネガティブキャッシュTTLが制御しているものとして正しいのはどれか。"
    choices:
      - "正常な応答がキャッシュされる時間"
      - "「そのようなレコードは存在しない」という否定的な応答自体がキャッシュされる時間"
      - "ゾーン転送が発生する間隔"
      - "DNSSECの署名の有効期限"
    answerIndex: 1
    explanation: "ネガティブキャッシュTTLは、SOAレコードの最後のフィールドで、否定的な応答自体がキャッシュされる時間を制御します。"

  - question: "新しく追加したはずのレコードが、しばらく名前解決できない現象の典型的な原因として正しいのはどれか。"
    choices:
      - "レコードの追加自体が失敗している"
      - "追加前の否定的な結果が、途中の再帰リゾルバにネガティブキャッシュとして残っている"
      - "DNSSECの署名が壊れている"
      - "フォワーダーの設定が誤っている"
    answerIndex: 1
    explanation: "多くの場合、レコードの追加自体は成功していますが、追加前の否定的な結果がネガティブキャッシュとして残っているために、しばらく名前解決に失敗します。"

  - question: "フォワーダー構成を採用する際に意識すべき点として正しいのはどれか。"
    choices:
      - "フォワーダーとの通信経路の安全性が、検証済みの答えを信頼する前提に影響する"
      - "フォワーダーを使えばDNSSECの検証は一切不要になる"
      - "フォワーダーは常にネガティブキャッシュを無効化する"
      - "フォワーダーを使うとゾーン転送が自動的に暗号化される"
    answerIndex: 0
    explanation: "フォワーダーとの通信経路自体が保護されていなければ、フォワーダーが返す検証済みの答えにも、なりすましのリスクが残ります。"
