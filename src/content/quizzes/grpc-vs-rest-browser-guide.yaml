questions:
  - question: "gRPCがREST/JSONより高速な通信を実現する仕組みとして正しいのはどれか。"
    choices:
      - "常に専用の光ファイバー回線を使用するから"
      - "Protocol Buffersによるバイナリシリアライズと、HTTP/2の多重化を使用するから"
      - "サーバー側のCPUを常に2倍使用するから"
      - "暗号化を一切行わないから"
    answerIndex: 1
    explanation: "gRPCは、Protocol Buffersというバイナリ形式でデータをシリアライズし、HTTP/2の多重化を使って通信することで、JSON over HTTP/1.1が主流のRESTと比べ高速な通信を実現します。"

  - question: "ブラウザからgRPCサーバーを直接呼び出せない、根本的な理由として正しいのはどれか。"
    choices:
      - "gRPCという技術自体が、セキュリティ上禁止されているから"
      - "ブラウザのJavaScriptが、gRPCの通信ステータスを伝えるHTTP/2のトレーラーを読み取れないから"
      - "ブラウザは、バイナリデータを一切処理できないから"
      - "gRPCは、HTTPをまったく使用しないプロトコルだから"
    answerIndex: 1
    explanation: "gRPCは通信の最終的なステータスをHTTP/2のトレーラーで伝えますが、ブラウザのFetch APIのresponse.trailersは、仕様に存在しながらいずれの主要ブラウザにも実装されていないため、ブラウザのJavaScriptは直接扱えません。"

  - question: "gRPC-Webの役割として正しいのはどれか。"
    choices:
      - "gRPCをさらに高速化するための、追加の最適化技術"
      - "トレーラーの情報をレスポンスボディの末尾に埋め込み直し、変換プロキシを介してブラウザから扱えるようにする別のプロトコル"
      - "gRPCをHTTP/1.0に変換するための技術"
      - "ブラウザのJavaScript自体を置き換える新しい言語"
    answerIndex: 1
    explanation: "gRPC-Webは、本来トレーラーで送られる情報をレスポンスボディの末尾に特別なフレームとして埋め込み直し、Envoyなどの変換プロキシを介して、ブラウザからでも扱えるようにした別のプロトコルです。"

  - question: "gRPC-Webの機能的な制限として正しいのはどれか。"
    choices:
      - "すべての機能が、通常のgRPCとまったく同じように使用できる"
      - "クライアントストリーミングと双方向ストリーミングがサポートされていない"
      - "サーバーストリーミングだけがサポートされていない"
      - "暗号化通信が一切サポートされていない"
    answerIndex: 1
    explanation: "gRPC-Webでは、クライアント側からのストリーミングと双方向ストリーミングはサポートされておらず、サーバー側からのストリーミングのみがサポートされています。"

  - question: "実務でのgRPCとRESTの組み合わせとして、一般的に広く採用されているパターンはどれか。"
    choices:
      - "すべてのAPIを例外なくgRPCへ置き換える"
      - "内部のサービス間通信にgRPC、外部公開APIにRESTやGraphQLを使う"
      - "すべてのAPIを例外なくRESTだけに統一する"
      - "gRPCとRESTは技術的に併用できない"
    answerIndex: 1
    explanation: "ブラウザを経由しない内部のサービス間通信にはgRPCの速さを活かし、外部公開APIにはRESTやGraphQLを使うという組み合わせが、実務では広く採用されています。"
