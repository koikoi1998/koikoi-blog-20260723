questions:
  - question: "SMTP応答コードが4xx(ソフトバウンス)だった場合のPostfixの挙動として正しいのはどれか。"
    choices:
      - "即座にメールを破棄する"
      - "メールをキューに残し、一定間隔を空けて再試行する"
      - "送信者に即座にエラーを返し、キューには残さない"
      - "受信者のメールボックスを強制的に空にする"
    answerIndex: 1
    explanation: "4xxは一時的エラーであり、Postfixはメールをキューに残したまま、一定間隔で再試行します。"

  - question: "SMTP応答コード5xx(ハードバウンス)の意味として正しいのはどれか。"
    choices:
      - "一時的な過負荷であり、しばらくすれば成功する可能性がある"
      - "宛先アドレスが存在しないなど、恒久的なエラーであり再試行しても成功しない"
      - "メールが正常に配送されたことを示す"
      - "受信サーバーが休止中であることを示す"
    answerIndex: 1
    explanation: "5xxは恒久的エラーであり、Postfixは再試行せず、送信者へバウンスメールを返します。"

  - question: "バウンスメールの送信者アドレスが空(Null Sender)に設定されている理由として正しいのはどれか。"
    choices:
      - "受信者を特定できないようにするため"
      - "バウンスメール自体の配送失敗による、バウンスの無限連鎖を防ぐため"
      - "メールサイズを削減するため"
      - "SPF検証を回避するため"
    answerIndex: 1
    explanation: "送信者アドレスを空にすることで、バウンスメール自体が配送に失敗した場合の、さらなるバウンスメールの生成を防いでいます。"

  - question: "maximal_queue_lifetimeの役割として正しいのはどれか。"
    choices:
      - "メールの最大サイズを制限する"
      - "ソフトバウンスによるリトライの上限期間を定める"
      - "IMAPセッションのタイムアウトを設定する"
      - "DNSキャッシュの有効期限を制御する"
    answerIndex: 1
    explanation: "maximal_queue_lifetime(既定5日)を過ぎても配送に成功しなければ、Postfixは配送を諦めてバウンスメールを返します。"

  - question: "ハードバウンス率が高いことが、送信元にもたらす影響として正しいのはどれか。"
    choices:
      - "特に何も起こらない"
      - "送信元の評判が悪化し、正規のメールまで迷惑メール扱いや配送拒否をされるようになる"
      - "自動的にSPFレコードが修正される"
      - "メールサーバーの処理速度が向上する"
    answerIndex: 1
    explanation: "大手メールプロバイダーはハードバウンス率を送信元の評判の指標として監視しており、高い場合は正規のメールにも悪影響が及びます。"
