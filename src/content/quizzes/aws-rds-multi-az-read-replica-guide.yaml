questions:
  - question: "Multi-AZ DBインスタンスデプロイのスタンバイに関する記述として正しいのはどれか。"
    choices:
      - "スタンバイは、読み取りトラフィックを自由に処理できる"
      - "スタンバイは、既定では読み取りトラフィックを処理できず、障害時のフェイルオーバー専用である"
      - "スタンバイは、常に書き込みトラフィックのみを処理する"
      - "スタンバイという概念自体が、RDSには存在しない"
    answerIndex: 1
    explanation: "AWS公式ドキュメントによれば、従来のMulti-AZ DBインスタンスデプロイのスタンバイは、既定では読み取りトラフィックを処理できず、障害発生時のフェイルオーバーを提供する専用の役割を持ちます。"

  - question: "リードレプリカのレプリケーション方式として正しいのはどれか。"
    choices:
      - "同期レプリケーションであり、ラグは一切発生しない"
      - "非同期レプリケーションであり、レプリケーションラグが発生し得る"
      - "レプリケーションという概念自体が存在しない"
      - "常にプライマリと完全に同時にデータが反映される"
    answerIndex: 1
    explanation: "リードレプリカは非同期レプリケーションであるため、プライマリへの書き込みがリードレプリカへ反映されるまでに、レプリケーションラグが発生することがあります。"

  - question: "プライマリに障害が発生した場合の、Multi-AZとリードレプリカの挙動の違いとして正しいのはどれか。"
    choices:
      - "両方とも、自動的にフェイルオーバーする"
      - "Multi-AZは自動的にフェイルオーバーするが、リードレプリカは手動でのプロモートが必要である"
      - "両方とも、手動でのプロモートが必要である"
      - "リードレプリカの方が、常に高速にフェイルオーバーする"
    answerIndex: 1
    explanation: "Multi-AZは障害発生時に自動的にフェイルオーバーしますが、リードレプリカは自動的にはフェイルオーバーせず、手動でのプロモートとエンドポイントの書き換えが必要です。"

  - question: "Multi-AZで読み取りスケーリングを実現したい場合、正しい選択肢はどれか。"
    choices:
      - "従来のMulti-AZ DBインスタンスデプロイのスタンバイへ読み取りを向ける"
      - "リードレプリカを別途作成するか、読み取り可能なスタンバイを持つMulti-AZ DBクラスターデプロイを使う"
      - "読み取りスケーリングという概念自体が、RDSには存在しない"
      - "プライマリへの書き込みを完全に停止する"
    answerIndex: 1
    explanation: "読み取りスケーリングには、リードレプリカを別途用意するか、読み取り可能な2つのスタンバイを持つ、新しいMulti-AZ DBクラスターデプロイを使う必要があります。"

  - question: "Multi-AZとリードレプリカの関係として正しいのはどれか。"
    choices:
      - "どちらか一方しか使用できない、競合する選択肢である"
      - "可用性と読み取りスケーリングの両方が必要な場合、組み合わせて使うのが一般的である"
      - "リードレプリカを設定すると、Multi-AZは自動的に無効化される"
      - "この2つは、技術的に同時に存在できない"
    answerIndex: 1
    explanation: "Multi-AZとリードレプリカは競合する選択肢ではなく、可用性のための自動フェイルオーバーと、読み取りスケーリングの両方が必要な場合、組み合わせて使うのが一般的です。"
