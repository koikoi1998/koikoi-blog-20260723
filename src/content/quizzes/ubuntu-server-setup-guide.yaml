questions:
  - question: "sudo apt updateコマンドが実際に行っていることとして、記事内で説明されている正しい説明はどれか。"
    choices:
      - "インストール済みのすべてのソフトウェアを最新バージョンに更新する"
      - "リポジトリから利用可能なパッケージとそのバージョンの一覧情報を取得し、ローカルのキャッシュを更新するだけで、何かをインストール・変更するわけではない"
      - "OS全体を再インストールする"
      - "不要なパッケージを自動的に削除する"
    answerIndex: 1
    explanation: "sudo apt updateは、各リポジトリに問い合わせてパッケージインデックス(利用可能なパッケージとバージョンの一覧)をローカルキャッシュとして最新化するだけのコマンドで、実際のインストールや更新は行いません。"

  - question: "sudo su(ハイフンなし)とsudo su -(ハイフンあり)の違いとして、記事内で説明されている内容はどれか。"
    choices:
      - "両者はまったく同じ動作をする"
      - "ハイフンありの場合はrootが直接ログインした場合と同じ状態に環境変数を初期化し、ホームディレクトリも/rootに移動するが、ハイフンなしの場合は元のユーザーの環境変数を引き継ぐ"
      - "ハイフンなしの場合はパスワードなしでrootになれるが、ハイフンありの場合はパスワードが必要になる"
      - "ハイフンの有無によって、切り替わるユーザーがrootか一般ユーザーかが変わる"
    answerIndex: 1
    explanation: "sudo su -は環境変数をrootが直接ログインした場合と同じ状態に初期化し、ホームディレクトリも/rootに移動します。ハイフンなしのsudo suは、rootに切り替わるものの元のユーザーの環境変数を引き継ぎます。"

  - question: "Ubuntu ServerインストールでOpenSSH serverにチェックを入れ忘れた場合の対処として、記事内で説明されている手順はどれか。"
    choices:
      - "OSを最初から再インストールするしかない"
      - "Proxmoxの「Console」タブから直接ログインし、sudo apt install -y openssh-serverでインストールしたうえで、sudo systemctl enable --now sshで起動・自動起動を有効化する"
      - "SSHサーバーは後から追加することはできない"
      - "ufwを無効化すれば自動的にSSHサーバーがインストールされる"
    answerIndex: 1
    explanation: "コンソールから直接ログインし、openssh-serverパッケージをインストールしたうえで、enable --nowで起動と自動起動を同時に有効化します。ufwを使っている場合はSSHポートの許可も必要です。"

  - question: "実務でsudo su -によるrootシェルへの居座りより、コマンドごとにsudoを付ける運用が推奨される理由として、記事内で説明されているものはどれか。"
    choices:
      - "sudoを都度付けた方がコマンドの実行速度が速くなるため"
      - "sudoを使ったコマンドは誰が・いつ・何を実行したかの記録が残りやすく、監査(追跡)がしやすいため"
      - "sudo su -は技術的にセキュリティホールがあり、常に動作しないため"
      - "rootシェルに居座ると自動的にOSがシャットダウンする仕様になっているため"
    answerIndex: 1
    explanation: "sudoを使ったコマンドは/var/log/auth.logなどに実行記録が残りやすく、誰が何をしたかの追跡(監査)がしやすいため、実務ではrootシェルに居座り続けるより、コマンドごとにsudoを付ける運用が推奨されます。"

  - question: "USキーボードレイアウトでの入力の注意点として、記事内で推奨されている最も確実な対処法はどれか。"
    choices:
      - "記号を入力するときだけ日本語入力ソフトを都度起動する"
      - "物理キーボードが日本語配列であれば、OSのキーボードレイアウト設定も「Japanese」に合わせておく"
      - "USキーボードでは記号入力自体が不可能なので、別売りの専用キーボードを購入する"
      - "キーボードの物理的な配線を自分で改造する"
    answerIndex: 1
    explanation: "物理的なキーボードの配列と、OSがそのキー入力をどの文字として解釈するかの設定(論理レイアウト)を一致させるのが最も確実な対処法です。dpkg-reconfigure keyboard-configurationコマンドでインストール後に変更できます。"
