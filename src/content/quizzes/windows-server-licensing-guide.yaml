questions:
  - question: "StandardエディションとDatacenterエディションの主な違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "両エディションに機能上の違いは一切なく、単に価格が異なるだけである"
      - "主な違いは、1つのライセンスで実行できる仮想マシンの台数(仮想化権利)とDatacenter限定機能であり、単純な機能の多寡ではない"
      - "Standardエディションは32bit専用、Datacenterエディションは64bit専用である"
      - "Datacenterエディションは物理サーバーへのインストールができず、常に仮想マシン上でのみ動作する"
    answerIndex: 1
    explanation: "StandardとDatacenterの最大の違いは、1つのライセンスで実行できる仮想マシンの台数(仮想化権利)です。Standardは最大2台までの仮想マシンを実行できるのに対し、Datacenterは無制限に実行できます。加えてStorage Spaces DirectなどDatacenter限定機能もあります。"

  - question: "Windows Server 2016以降のコアベースライセンシングについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "ライセンスはサーバーの台数ではなく、物理コア(または仮想コア)の数を基準に課金され、1台の物理サーバーにつき最低16コア分のライセンスが必要である"
      - "ライセンスは、そのサーバーが設置されている国の数を基準に課金される"
      - "ライセンスは、サーバーに接続されているモニターの台数を基準に課金される"
      - "コアベースライセンシングは、Windows Server 2025で初めて導入された、まだ試験的な仕組みである"
    answerIndex: 0
    explanation: "Windows Server 2016以降、ライセンスはサーバーの台数ではなく物理コア(または仮想マシンに割り当てられた仮想コア)の数を基準に課金されます。1台の物理サーバーにつき最低16コア分のライセンスが必要というルールがあります。"

  - question: "OEMライセンスの正体と制約について、記事の説明に最も合致するものはどれか。"
    choices:
      - "OEMライセンスは、サーバーを購入する際にそのハードウェアと一体で提供されるライセンス形態で、購入したその特定のハードウェア上でのみ有効であり、別の新しいハードウェアへそのまま移行することはできない"
      - "OEMライセンスは、無期限に無料で利用できる特別なライセンス形態である"
      - "OEMライセンスは、通常のライセンスより多くの機能を追加で使えるようになる上位版である"
      - "OEMライセンスは、クラウド環境専用に設計されたライセンス形態であり、オンプレミス環境では利用できない"
    answerIndex: 0
    explanation: "OEM(Original Equipment Manufacturer)ライセンスは、サーバーを購入する際にそのハードウェアと一体で提供されるライセンス形態です。購入したその特定のハードウェア上でのみ有効であり、同じ組織内であっても別の新しいハードウェアへライセンスをそのまま移行することはできません。"

  - question: "ボリュームライセンスがOEMライセンスより柔軟性が高いとされる理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ボリュームライセンスは、ライセンスモビリティ(ライセンスを異なるハードウェアへ移行できる権利)を含む契約が可能であり、ハードウェアの入れ替えやクラウドへの移行の際に柔軟性が高い"
      - "ボリュームライセンスは、OEMライセンスより常に価格が安い"
      - "ボリュームライセンスは、OS自体の機能がOEMライセンスより多い"
      - "ボリュームライセンスは、購入時に1本だけ購入することしかできない"
    answerIndex: 0
    explanation: "ボリュームライセンスは、多くの場合ライセンスモビリティ(ライセンスを異なるハードウェアへ移行できる権利)を含む契約が可能であり、サーバーのハードウェアを入れ替えたり、オンプレミスからクラウドへ移行したりする際の柔軟性が高くなります。これがOEMライセンスとの主な違いです。"

  - question: "StandardからDatacenterへの切り替えを検討する際の判断ポイントについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "Datacenterへの切り替えは、常にコストが安くなるため、仮想マシンの台数に関わらず即座に切り替えるべきである"
      - "Standardライセンスを仮想マシンの台数分だけ買い増していくコストと、Datacenterへアップグレードするコストを、その時点での仮想マシン台数を基準に比較検討することが実務上の判断ポイントである"
      - "StandardとDatacenterは相互に変換できない別々の製品であり、一度選んだエディションは永久に変更できない"
      - "仮想マシンの台数は、エディションの選択に一切影響しない"
    answerIndex: 1
    explanation: "仮想マシンの台数が増えていく場合、Standardライセンスを買い増していくコストとDatacenterへアップグレードするコストを、その時点での仮想マシン台数を基準に比較検討することが実務上の判断ポイントです。将来的に台数が大きく増える見込みがあれば、初期段階からDatacenterを選ぶ方が有利になることが多くあります。"
