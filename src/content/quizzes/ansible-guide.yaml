questions:
  - question: "Ansibleと、PuppetやChefのようなエージェント型の構成管理ツールとの、アーキテクチャ上の最大の違いは何か。"
    choices:
      - "Ansibleはエージェントレスであり、管理対象には常駐エージェントが不要で、制御ノードからSSH経由でpushする方式である"
      - "Ansibleは管理対象ごとに常駐エージェントを必須とする方式である"
      - "Ansibleは管理対象からの定期的なpullのみで動作し、pushは一切行わない"
      - "AnsibleはPuppetやChefと完全に同じアーキテクチャで動作する"
    answerIndex: 0
    explanation: "Ansibleはエージェントレスな構成管理ツールで、管理対象に専用の常駐エージェントをインストールする必要がありません。制御ノードから管理対象へSSHで接続し、そのつど設定を送り込む(push)方式で動作します。"

  - question: "Ansibleの管理対象(管理される側)のサーバーに、稼働のために必要なものは何か。"
    choices:
      - "SSHサーバーとPython"
      - "Ansible専用の常駐エージェントソフトウェア"
      - "管理サーバー(Master)への定期的な自発通信機能"
      - "Dockerランタイム"
    answerIndex: 0
    explanation: "Ansibleはエージェントレスであり、管理対象側に必要なのはSSHサーバーと、Ansibleの処理を実行するためのPythonだけです。専用のエージェントソフトウェアは不要です。"

  - question: "Ansibleの用語のうち、「管理対象のサーバー一覧を、グループごとに整理して記述するファイル」に対応するものはどれか。"
    choices:
      - "Inventory"
      - "Module"
      - "Role"
      - "Task"
    answerIndex: 0
    explanation: "Inventoryは、管理対象のサーバーの一覧を、IPアドレスやホスト名でグループ(役割)ごとに整理して定義するファイルです。"

  - question: "Playbookの中で`state: present`と記述することの意味について、記事の説明に最も合致するものはどれか。"
    choices:
      - "「インストールするコマンドを実行せよ」という手順の指定ではなく、「インストール済みの状態であってほしい」という状態の宣言である"
      - "対象のパッケージを強制的にアンインストールするという指定である"
      - "対象のサーバーを再起動するという指定である"
      - "Ansibleの実行ログを詳細モードで出力するという指定である"
    answerIndex: 0
    explanation: "Playbookは「手順」ではなく「最終的にどういう状態にしたいか」を宣言的に記述します。`state: present`は「インストール済みという状態であってほしい」という状態の宣言であり、手順の指定ではありません。"

  - question: "冪等性(idempotency)という設計思想について、記事の説明に最も合致するものはどれか。"
    choices:
      - "同じPlaybookを何度実行しても、最終的な結果が変わらないという性質であり、各Moduleがすでに望ましい状態かどうかを内部でチェックすることで実現されている"
      - "Playbookの実行速度を高速化するための、キャッシュの仕組みである"
      - "複数の管理対象への処理を並列実行するための機能である"
      - "Ansibleの実行結果を暗号化して保存する仕組みである"
    answerIndex: 0
    explanation: "冪等性とは、同じ処理を1回実行しても100回実行しても最終的な結果が変わらないという性質です。Ansibleの各Moduleは「すでに望ましい状態になっているか」を内部でチェックする仕組みを持っており、これによって同じPlaybookを何度実行しても安全に再実行できます。"
