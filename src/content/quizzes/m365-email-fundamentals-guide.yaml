questions:
  - question: "メールにおける「ドメイン」と、Webサイトのドメインの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "両者はまったく別々のDNSゾーンで管理されており、互いに無関係な独立したシステムである"
      - "両者は同じDNSゾーンの中に存在する同じドメイン名であり、Webサイトへのアクセスはaレコード、メールの配送はMXレコードという別々のレコードタイプによって、それぞれ別のサーバーへ振り分けられている"
      - "メールのドメインは、Webサイトのドメインより必ず長い文字数でなければならない"
      - "メールのドメインは、DNS以外の完全に別のプロトコルによって管理されている"
    answerIndex: 1
    explanation: "メールアドレスのドメイン部分は、Webサイトと同じDNSゾーンの中に存在する同じドメイン名です。Webサイトへのアクセスは(多くの場合)Aレコードによって特定のIPアドレスへ、メールの配送はMXレコードによって、そのドメイン宛のメールを受け取るサーバーへ、それぞれ別のレコードタイプで振り分けられています。"

  - question: "MXレコードにおける優先度の仕組みについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "MXレコードには優先度という概念は存在せず、常に1つのサーバーだけを指定できる"
      - "複数のメールサーバーを優先度とともに指定でき、送信元は優先度の高い(数値が小さい)サーバーへまず配送を試み、応答がなければ次の優先度のサーバーを試すことで冗長化を実現している"
      - "優先度が高い(数値が大きい)サーバーほど、最初に配送が試みられる"
      - "MXレコードの優先度は、そのメールの重要度(緊急度)を示す値である"
    answerIndex: 1
    explanation: "MXレコードは複数のメールサーバーを、優先度(数値が小さいほど優先)とともに指定できます。送信元のメールサーバーは優先度の最も高い(数値が小さい)サーバーへまず配送を試み、応答がない場合に次の優先度のサーバーを試すことで、メールサーバーの冗長化が実現されています。"

  - question: "Exchangeサーバーが担っている役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Exchangeサーバーは、メールの転送(SMTPリレー)だけを担い、メールボックスの保管機能は一切持たない"
      - "Exchangeサーバーは、メールの転送(SMTPリレー)とメールボックスの保管という2つの役割を担い、オンプレミス版はActive Directoryと密接に連携している"
      - "Exchangeサーバーは、Webサイトのホスティングを専門に行うソフトウェアである"
      - "Exchangeサーバーは、DNSサーバーの機能を完全に代替するソフトウェアである"
    answerIndex: 1
    explanation: "Exchangeサーバーの役割は、メールの転送(SMTPリレー)とメールボックスの保管(メール・予定表・連絡先の実データの保管)という2つに大きく分けられます。オンプレミスのExchange Serverは、Active Directoryと密接に連携し、ADのユーザーアカウントにメールボックスを紐づけて管理します。"

  - question: "M365(Exchange Online)への移行が具体的に何を切り替える作業なのかについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "既存メールボックスのデータ移行と、そのドメイン宛のメールを受け取るサーバーを指すMXレコードの切り替えを組み合わせた作業である"
      - "M365への移行は、DNSの設定を一切変更する必要がない作業である"
      - "M365への移行は、既存のメールアドレス自体を完全に別のものへ変更する作業である"
      - "M365への移行は、Webサイトのドメイン名を変更する作業と完全に同一である"
    answerIndex: 0
    explanation: "M365への移行は、オンプレミスのExchange Serverが担っていたメールボックスのデータをExchange Onlineへコピーする作業と、移行完了後にMXレコードをオンプレミスからExchange Online側のアドレスへ書き換える作業を組み合わせたものです。"

  - question: "ハイブリッド構成が選択される典型的な理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ハイブリッド構成は、法律上すべての組織が必ず導入しなければならない構成である"
      - "大量のメールボックスを一度に移行する際の作業時間・帯域の制約や、コンプライアンス要件により一部のメールボックスをオンプレミスに残す必要がある場合に選択される"
      - "ハイブリッド構成は、メールの送受信速度を必ず2倍に高速化するための構成である"
      - "ハイブリッド構成は、MXレコードという概念自体を完全に不要にする構成である"
    answerIndex: 1
    explanation: "すべてのメールボックスを一度に移行できない、あるいはしたくない典型的な理由には、大量のメールボックスを一度に移行する際の作業時間・帯域の制約や、特定の業務要件・コンプライアンス要件により一部のメールボックスをオンプレミスに残す必要がある、といったものがあります。ハイブリッド構成はこうした段階的な移行や恒久的な共存を実現する現実的な選択肢です。"
