questions:
  - question: "この記事で構築するL2TP/IPsecサーバーにおいて、IKE/ESPの処理・L2TPのトンネル/セッション処理・PPPのネゴシエーションを、それぞれどのソフトウェアが担当するか。"
    choices:
      - "strongSwanがIKE/ESP、xl2tpdがL2TP、pppdがPPPの処理をそれぞれ担当する"
      - "strongSwanがすべての処理を単独で担当し、xl2tpdとpppdは補助的なログ出力のみを行う"
      - "xl2tpdがIKE/ESPとL2TPの両方を担当し、strongSwanはファイアウォール設定のみを行う"
      - "pppdがIKE/ESP/L2TP/PPPのすべてを統合的に処理する"
    answerIndex: 0
    explanation: "この記事の構成では、IKE/ESPの処理をstrongSwanが、L2TPのトンネル/セッション処理をxl2tpdが、PPPのネゴシエーションをpppd(xl2tpdが内部的に呼び出す)がそれぞれ分担して担当します。"

  - question: "ipsec.confで`type=transport`を指定している理由として、記事内で説明されているものはどれか。"
    choices:
      - "トンネルモードは古い仕様であり、現在は非推奨とされているため"
      - "L2TP自身がすでにトンネル機能を持っているため、IPsec側でさらにトンネルモードを重ねる必要がなく、トランスポートモードで足りるため"
      - "トランスポートモードでなければxl2tpdが起動しない仕様になっているため"
      - "クライアントのOSがトンネルモードに対応していないため"
    answerIndex: 1
    explanation: "L2TP自身がすでに仮想的なトンネルを作る役割を果たしているため、IPsec側でさらにトンネルモードを重ねるとIPヘッダーが二重に付くだけの無駄なオーバーヘッドになります。そのためトランスポートモードで足ります。"

  - question: "この記事でtcpdumpのキャプチャからIKEv1の実際のメッセージ交換を数えたとき、記事内で説明されている理論通りの往復数はどれか。"
    choices:
      - "フェーズ1(Main Mode、6往復)+フェーズ2(Quick Mode、3往復)の合計9往復"
      - "フェーズ1のみで完結する1往復"
      - "IKEv2と同じ4往復"
      - "往復数は実装によって完全にランダムであり、理論値は存在しない"
    answerIndex: 0
    explanation: "vpn-protocols-comparison-guideで説明された通り、IKEv1はフェーズ1(Main Mode、6往復)とフェーズ2(Quick Mode、3往復)を合わせて9往復のメッセージ交換を行い、この記事ではそれを実際のキャプチャで数えて確認します。"

  - question: "Windowsクライアント接続後に`ipconfig /all`でPPPアダプターを確認すると、サブネットマスクがどのような値になっているか、またそれが何を意味するか。"
    choices:
      - "255.255.255.0であり、通常のLANと同じ扱いを受けていることを意味する"
      - "255.255.255.255であり、このリンクが「ネットワーク」ではなく「1対1の専用リンク」として扱われていることの証拠になる"
      - "0.0.0.0であり、IPアドレスが未払い出しであることを意味する"
      - "255.255.0.0であり、複数のセグメントにまたがるリンクであることを意味する"
    answerIndex: 1
    explanation: "PPPアダプターのサブネットマスクは255.255.255.255(/32)になり、これがブロードキャスト・ARPの成立しない点対点リンクであることの直接的な証拠です。この性質ゆえに明示的なゲートウェイ指定が必要になります。"

  - question: "`route print`で確認できるPPPアダプター経由のルートのゲートウェイ欄には、何が表示されるか。"
    choices:
      - "常に0.0.0.0が表示され、ゲートウェイは存在しないことを示す"
      - "`xl2tpd.conf`の`local ip`に設定した値が数値としてそのまま表示される"
      - "数値ではなく「リンク上」(on-link)と表示される。次のホップになり得る相手が1つしかない点対点リンクだからで、`tracert`で確認すると実際の最初のホップはサーバーの`local ip`になっている"
      - "DNSサーバーのIPアドレスが表示される"
    answerIndex: 2
    explanation: "PPPのような点対点リンクは次のホップの候補が1つしかないため、Windowsはゲートウェイを数値で明示せず「リンク上」と表示します。ただしこれはゲートウェイが存在しないという意味ではなく、`tracert`を実行すると最初のホップが実際にサーバーの`local ip`になっていることから、サーバーが確かにゲートウェイとして機能していることが確認できます。"

  - question: "PVE内部にもう1段NATを挟む構成でクライアントからサーバーに接続すると、tcpdumpのキャプチャで観測できる現象として記事内で説明されているものはどれか。"
    choices:
      - "IKEのやり取りがすべてTCPに切り替わる"
      - "IKEフェーズ1のメッセージにNAT-Dペイロードが含まれ、その後の通信がUDPポート500からUDPポート4500へフロートし、ESPパケットがUDPヘッダーでさらにカプセル化される"
      - "L2TPのトンネルが確立されなくなり、PPPネゴシエーションが完全に省略される"
      - "ESPパケットのプロトコル番号が50から51に自動的に変更される"
    answerIndex: 1
    explanation: "NAT環境下では、IKEフェーズ1のNAT-Dペイロードによる検出の結果、UDPポート500からUDPポート4500へのフロートが起き、ESPパケットがさらにUDPヘッダーでカプセル化される様子を実際のパケットとして観測できます。"

  - question: "この記事のハンズオンで構築するPSK構成の弱点として説明されているものはどれか。"
    choices:
      - "PSKは1接続ごとに自動的にランダム生成されるため、運用上の管理が煩雑になる"
      - "ipsec.secretsに設定した事前共有鍵は接続するすべてのクライアントが同じ値を共有するため、IPsec層の認証は「誰でも同じ鍵でトンネルを開ける」状態になり、実質的な個人認証はPPP層に依存する"
      - "PSK方式ではPPP層の認証を完全に省略できてしまう仕様になっている"
      - "PSK方式はNAT-Tと同時に使用することができない"
    answerIndex: 1
    explanation: "ipsec.secretsのPSKはすべてのクライアントで共有されるため、IPsec層の認証だけでは個々のユーザーを区別できず、実質的な個人認証はPPP層のユーザー名・パスワードにすべて依存する構成になります。"

  - question: "この記事で`iperf3`を使って記録する性能ベースラインは、何のために使うと説明されているか。"
    choices:
      - "strongSwanのライセンス認証に必要な数値だから"
      - "次のハンズオン記事でOpenVPN/WireGuardと性能を比較する際の基準値として使うため"
      - "PVEのリソース割り当てを自動調整するために使うため"
      - "IKEフェーズ1の暗号アルゴリズムを自動選択するために使うため"
    answerIndex: 1
    explanation: "この記事で記録したL2TP/IPsecのスループットやIKEネゴシエーション時間は、次のハンズオン(OpenVPN/WireGuardとの性能比較)で、ユーザー空間実装とカーネル空間実装の性能差を評価する際の基準値として使います。"
