questions:
  - question: "FC・SAS・LANの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "3つは単なるケーブルの種類の違いであり、内部の通信方式は完全に同一である"
      - "3つはそれぞれ想定する接続範囲と目的が異なる、別々の設計思想を持つ技術である"
      - "FCとSASは同一の規格であり、LANだけが別の技術である"
      - "3つはすべて同じIPアドレスの仕組みを使って通信している"
    answerIndex: 1
    explanation: "FC・SAS・LANは単なるケーブルの種類の違いではなく、SASはサーバー筐体内やごく近距離の直結、FCはデータセンター内での複数サーバー・複数ストレージを結ぶSAN、LANは汎用的なネットワークという、それぞれ異なる接続範囲と目的を想定した、別々の設計思想を持つ技術です。"

  - question: "FCがIPアドレスを使わずに通信相手を認識する仕組みについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "FCは通信相手を一切識別せず、接続されているすべての機器に無差別にデータを送信する"
      - "FC上のすべての機器には、WWN(World Wide Name)という世界で一意な識別子が割り当てられており、これを基準に通信相手を識別する"
      - "FCは、IPアドレスと完全に同じ形式の番号を、名前を変えて使用しているだけである"
      - "FCは、機器のシリアル番号ではなく、購入した日付を基準に通信相手を識別する"
    answerIndex: 1
    explanation: "FCはIPアドレスという概念自体を使いません。その代わりに、FC上のすべての機器(サーバー側のFC HBA、ストレージ装置のポートなど)には、WWN(World Wide Name)という世界で一意な識別子が製造時に割り当てられており、これがイーサネットのMACアドレスに相当する概念として、通信相手の識別に使われます。"

  - question: "「セグメントを気にしなくてよい」という説明が意味することについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "FCには一切のアクセス制御の仕組みが存在せず、誰でも自由にどの機器にもアクセスできる"
      - "IPネットワークのようにサブネット・セグメントという概念でアクセス範囲を区切るのではなく、FCではWWN単位でどの機器同士が通信を許可されるかを直接指定する、ゾーニングという仕組みでアクセス制御が行われる"
      - "FCではセグメントという概念が存在するが、設定作業自体が完全に自動化されているため気にする必要がない"
      - "FCは、IPアドレスのサブネットマスクを自動的に「255.255.255.255」に固定する仕様になっている"
    answerIndex: 1
    explanation: "FCではIPネットワークのようなサブネット・セグメントという概念自体が存在せず、WWN単位でどの機器とどの機器が通信を許可されるかを直接指定するゾーニングという仕組みでアクセス制御が行われます。これが「セグメントを気にしなくてよい」という説明の正体です。"

  - question: "SASの基本的な発想について、記事の説明に最も合致するものはどれか。"
    choices:
      - "SASは、FCと同様にファブリック・ゾーニングといったネットワーク的な仕組みを持つ、複数の相手と自由に通信できる規格である"
      - "SASの基本的な発想は1対1(あるいはエクスパンダーを介した1対多)の直結であり、FCのようなファブリックやゾーニングといったネットワーク的な仕組みは持たない"
      - "SASは、無線通信専用の規格であり、物理的なケーブルを一切使用しない"
      - "SASは、インターネット経由でのみ利用できる、クラウド専用のストレージ接続規格である"
    answerIndex: 1
    explanation: "SASの基本的な発想は、あくまで1対1(あるいはエクスパンダーという中継装置を介した1対多)の直結であり、FCのような「ファブリック」やゾーニングといったネットワーク的な仕組みそのものを持ちません。サーバー内蔵のHDD/SSDや直結の外部ディスクエンクロージャの接続に使われます。"

  - question: "FCが今でも大規模エンタープライズ環境で選ばれ続けている理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "FCは追加の専用機器が一切不要で、既存のLAN機器をそのまま再利用できるため"
      - "IPネットワークから完全に独立した専用の通信方式であることによる、帯域保証・低レイテンシ・輻輳制御の成熟度が理由である"
      - "FCは、SASやLANより物理的なケーブルの価格が常に安いため"
      - "FCは、Windows Serverのライセンスに標準で無料で付属しているため"
    answerIndex: 1
    explanation: "FCが今でもエンタープライズ環境で選ばれ続けている理由は、IPネットワークから完全に独立した専用の通信方式であることによる、帯域保証・低レイテンシ・輻輳制御の成熟度にあります。一方でLANベースのiSCSIは既存インフラの再利用によるコスト面の利点があります。"
