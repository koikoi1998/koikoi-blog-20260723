questions:
  - question: "dsa.msc・dssite.msc・adsiedit.msc・dnsmgmt.mscという4つのコンソールの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "4つは互いにまったく無関係な、別々のデータベース製品である"
      - "同じAD DSという1つのデータベースに対する異なる窓口であり、dsa.msc・dssite.msc・dnsmgmt.mscはそれぞれ特定のパーティション専用、adsiedit.mscはどのパーティションへも直接アクセスできる汎用エディターである"
      - "4つのコンソールはすべて同じ内容を、異なる言語(日本語・英語など)で表示しているだけである"
      - "adsiedit.mscは、他の3つのコンソールが完全に廃止された後継ツールである"
    answerIndex: 1
    explanation: "dsa.msc・dssite.msc・dnsmgmt.mscは、同じAD DSという1つのデータベースの中の、それぞれ異なる特定のパーティション(ドメイン・設定・DNSゾーン)を管理する専用コンソールです。adsiedit.mscだけは特定のパーティション専用ではなく、AD DS内のどのパーティションへも直接アクセスできる汎用的なLDAPエディターです。"

  - question: "PCをドメインから脱退させても、dsa.mscのComputersコンテナーに情報が残り続ける理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "PC側でドメインから脱退する操作と、AD DS側でコンピューターアカウントを削除する操作はまったく別々の操作であり、AD DS側のアカウントは管理者が明示的に削除しない限り残り続ける"
      - "Windowsのバグであり、次回のWindows Updateで自動的に修正される予定である"
      - "ドメインから脱退した情報は、法律上7年間の保存が義務付けられているため"
      - "dsa.mscの表示が単にキャッシュされているだけで、実際にはAD DS上からは既に削除されている"
    answerIndex: 0
    explanation: "PC側の「ドメインから脱退する」操作は、そのPC自身がドメインの認証情報を使うのをやめるだけのローカルな設定変更であり、AD DS側に対してコンピューターアカウントの削除を自動的に要求するわけではありません。AD DS側のコンピューターアカウントは、管理者が明示的に削除しない限り残り続けます。"

  - question: "dssite.mscがAD移行のクリーンアップ確認において重要である理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "dssite.mscは、ドメイン内のすべてのユーザーのパスワードを一覧表示できる唯一のツールだから"
      - "正しく降格処理が完了したDCはサーバーオブジェクトとNTDS Settingsオブジェクトも自動的に削除されるため、旧DCのサーバーオブジェクトが残っている場合は降格処理が完全ではないことを意味するから"
      - "dssite.mscは、DNSレコードを唯一直接編集できるコンソールだから"
      - "dssite.mscは、Windows Serverのライセンス認証状態を確認するための専用コンソールだから"
    answerIndex: 1
    explanation: "正しく降格処理が完了したDCは、dssite.msc内のサーバーオブジェクトとNTDS Settingsオブジェクトも自動的に削除されます。旧DCのサーバーオブジェクトがdssite.mscにまだ残っている場合、それは降格処理が完全ではなく、レプリケーション構成に関する情報が古いまま残っていることを意味します。"

  - question: "dsa.mscとdssite.mscの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "dsa.mscは「ドメインに何が存在するか」を管理する窓口、dssite.mscは「DCが物理的・ネットワーク的にどこにあり、互いにどうレプリケーションしているか」を管理する窓口である"
      - "dsa.mscとdssite.mscは完全に同じ内容を表示する、単なる別名である"
      - "dsa.mscはLinuxサーバー専用、dssite.mscはWindows Server専用のツールである"
      - "dssite.mscは、ユーザーアカウントのパスワードリセットにのみ使われる専用ツールである"
    answerIndex: 0
    explanation: "dsa.mscは「ドメインに何が存在するか(誰が、どのグループに、どのOUに属しているか)」を管理する窓口であり、dssite.mscは「DCが物理的・ネットワーク的にどこにあり、互いにどうレプリケーションしているか」を管理する窓口です。日常的なユーザー・グループ管理ではdsa.mscで完結しますが、DCの追加・撤去やレプリケーショントポロジの確認ではdssite.mscが主戦場になります。"

  - question: "adsiedit.mscの位置づけについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "adsiedit.mscは、他のGUIツールと同じ安全装置(確認ダイアログや依存関係チェック)を備えた、日常的な運用にも適したツールである"
      - "adsiedit.mscは多くの安全装置を経由せず直接AD DSのデータを書き換えられる強力なツールであり、他のGUIツールでは対処できない限定的な状況でのみ使う最終手段として位置づけるべきである"
      - "adsiedit.mscは読み取り専用のツールであり、データの変更や削除は一切できない"
      - "adsiedit.mscは、AD DSではなくDNSサーバーの設定のみを扱うツールである"
    answerIndex: 1
    explanation: "adsiedit.mscは、dsa.mscのような操作の途中で表示される確認や依存関係チェックといった安全装置の多くを経由せず、直接AD DSのデータを書き換えられます。誤った操作は深刻な影響を及ぼしかねないため、日常的な運用ツールではなく、他のツールでは対処できない限定的な状況でのみ使う最終手段として位置づけるべきです。"

  - question: "4つのコンソールすべてを手動で確認する作業が特に重要になる場面について、記事の説明に最も合致するものはどれか。"
    choices:
      - "毎週月曜日の朝に、理由を問わず必ず全コンソールを確認する必要がある"
      - "旧DCが既に故障・消失しておりntdsutilによる強制的なメタデータクリーンアップを行った場合、および正規の降格処理後に自動クリーンアップが本当に完全だったかを検証する場面"
      - "新しいユーザーアカウントを1つ作成するたびに、必ず全コンソールを確認する必要がある"
      - "Windows Serverの言語設定を変更した直後にのみ、全コンソールの確認が必要になる"
    answerIndex: 1
    explanation: "正常なグレースフルな降格処理では多くのクリーンアップが自動的に行われます。4つのコンソールを1つずつ手作業で確認することが本当に重要になるのは、旧DCが故障・消失しntdsutilによる強制的なメタデータクリーンアップを行った場合、そして正規の降格処理後でも自動クリーンアップが本当に完全だったかを検証する場面です。"
