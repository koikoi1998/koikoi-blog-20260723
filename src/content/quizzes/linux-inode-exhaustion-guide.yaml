questions:
  - question: "inodeの総数に関する記述として正しいのはどれか。"
    choices:
      - "inodeの総数は、ファイルシステムの使用中に、必要に応じて自動的に増加する"
      - "inodeの総数は、ファイルシステムを作成した時点で固定され、後から増やすことができない"
      - "inodeの総数は、ファイルのサイズの合計に応じて決まる"
      - "inodeという概念は、Linuxには存在しない"
    answerIndex: 1
    explanation: "ファイルシステムが持てるinodeの総数は、ファイルシステムを作成した時点(mkfsを実行した時点)で固定されてしまい、後から増やすことができません。"

  - question: "inodeの枯渇を診断するための正しいコマンドとして正しいのはどれか。"
    choices:
      - "df -h だけで十分であり、他のコマンドは不要である"
      - "df -i を実行し、IUse%が100%に近づいていないかを確認する"
      - "ps aux を実行し、プロセス一覧を確認する"
      - "ping コマンドで、ネットワークの到達性を確認する"
    answerIndex: 1
    explanation: "inodeの枯渇を診断するには、df -iを実行し、IUse%という列が100%に近づいていないかを確認します。df -hはデータ領域の使用率しか表示しません。"

  - question: "inodeの枯渇を引き起こす、典型的な原因として正しいのはどれか。"
    choices:
      - "1つの非常に大きなファイルが存在すること"
      - "PHPのセッションファイルやメールキューのような、サイズは小さいが数が非常に多いファイル群"
      - "ディスクが物理的に故障していること"
      - "ネットワーク接続が切断されていること"
    answerIndex: 1
    explanation: "inodeの枯渇を引き起こす典型的な原因は、PHPのセッションファイル、メールキューのスプールファイル、ローテーションされていないログファイルなど、サイズは小さいが数が非常に多いファイル群です。"

  - question: "df -hとdf -iの両方に問題がないのに、「No space left on device」が発生する場合の原因として正しいのはどれか。"
    choices:
      - "この現象は、技術的に発生し得ない"
      - "削除されたファイルを、あるプロセスがまだ開いたファイルディスクリプタとして持ち続けている可能性がある"
      - "ネットワークケーブルが断線している"
      - "CPUの使用率が高すぎる"
    answerIndex: 1
    explanation: "あるプロセスが、すでに削除されたファイルを、開いたファイルディスクリプタとして持ち続けている限り、そのinodeとデータ領域は解放されず、容量不足が発生することがあります。"

  - question: "inode不足を解消するための、正しい対応として正しいのはどれか。"
    choices:
      - "既存のファイルシステムに、コマンド一つでinodeを追加する"
      - "不要な小さなファイルを削除する、またはファイルシステムを再作成する"
      - "ディスクの電源を一度切って、再度入れる"
      - "ファイルのサイズを、1つだけ大きくする"
    answerIndex: 1
    explanation: "inodeの総数は後から追加できないため、対応するには不要な小さなファイルを削除するか、より多くのinodeを持つファイルシステムを再作成する必要があります。"
