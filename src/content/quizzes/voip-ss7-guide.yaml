questions:
  - question: "SS7(共通線信号方式)が電話網の中で担っている役割として、記事の説明に最も合致するものはどれか。"
    choices:
      - "実際の音声そのものをTDMのタイムスロットとして伝送する役割"
      - "呼の確立・応答・切断、番号ポータビリティの問い合わせ、課金情報の伝達といった呼制御(シグナリング)を担う役割"
      - "加入者宅と最寄りの交換局を結ぶアクセス回線そのものの役割"
      - "音声をデジタル化するコーデックとしての役割"
    answerIndex: 1
    explanation: "SS7は、呼の確立・応答・切断、番号ポータビリティの問い合わせ、課金情報の伝達といった呼制御(シグナリング)を専門に担うプロトコル群です。実際の音声伝送(ベアラ)は別のチャネルで行われます。"

  - question: "SS7が実際の音声を運ぶチャネル(ベアラチャネル)とは別の、シグナリング専用のリンクを使って動作する(アウトオブバンドシグナリング)ことの利点として、記事の説明に最も合致するものはどれか。"
    choices:
      - "音声用の回線がまだ確立していない段階から、交換機同士がメッセージ形式で呼制御情報をやり取りできる"
      - "音声の圧縮率を高めて帯域を節約できる"
      - "電話番号を暗号化してプライバシーを保護できる"
      - "交換機の設置台数を減らすことができる"
    answerIndex: 0
    explanation: "シグナリング専用のリンクを使うことで、まだ音声用の回線が確立していない段階から交換機同士がメッセージ形式で呼制御情報をやり取りできます。かつてのイン・バンドシグナリング(音声帯域内でのトーン送出)は非効率かつ脆弱性(フリーキング)を抱えていました。"

  - question: "「SS7自体は回線交換方式そのものである」という理解について、記事の説明に照らして最も適切な評価はどれか。"
    choices:
      - "正しい。SS7はTDMによって固定の伝送路を流れるプロトコルである"
      - "誤り。SS7自体はあらかじめ確保された固定の伝送路ではなく、メッセージ単位で交換機から交換機へリレーされていくメッセージ交換型のプロトコルスタックである"
      - "正しい。SS7は音声そのものを回線交換方式で伝送するプロトコルである"
      - "誤り。SS7は電話網とは無関係のIPネットワーク専用プロトコルである"
    answerIndex: 1
    explanation: "電話網の「音声を運ぶ部分(ベアラ)」はTDMによる回線交換方式ですが、「呼制御を行う部分」であるSS7自体は、固定の伝送路ではなくメッセージ単位で交換機間をリレーされる、メッセージ交換型のプロトコルスタックです。"

  - question: "「VoIP」という言葉が指す意味について、記事の説明に最も合致するものはどれか。"
    choices:
      - "SkypeやLINE通話のような、特定のインターネット電話サービスの名称"
      - "音声をデジタル化・パケット化してIPネットワーク上で伝送する技術全般を指す言葉であり、通信キャリアの基幹網内部の伝送にも使われている"
      - "電話回線(メタル線)を光ファイバーに置き換える技術の名称"
      - "SS7に代わって番号ポータビリティを管理する新しいデータベースの名称"
    answerIndex: 1
    explanation: "VoIPは特定のサービス名ではなく、音声をデジタル化・パケット化してIPネットワーク上で伝送する技術全般を指す言葉です。通信キャリアの基幹網(コア網)内部の伝送がIP化されているのも、この意味でのVoIPです。"

  - question: "RTP(Real-time Transport Protocol)がUDPの上で動作し、パケットごとにシーケンス番号とタイムスタンプを付与している理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "TCPより暗号強度が高いから"
      - "低遅延を優先しつつ、受信側がパケットの喪失・順序の乱れ・ジッタを検出・補正できるようにするため"
      - "電話番号の桁数を増やすため"
      - "SS7とのメッセージ形式を統一するため"
    answerIndex: 1
    explanation: "RTPは低遅延を優先するためUDPの上で動作し、パケットごとにシーケンス番号とタイムスタンプを付与することで、受信側がパケットの喪失や順序の乱れ、再生タイミングのズレ(ジッタ)を検出・補正できるようにしています。"

  - question: "SIPとRTPの関係、およびSS7とTDMの関係に共通する設計思想として、記事が説明しているものはどれか。"
    choices:
      - "制御(シグナリング)と実際に運ばれるデータ(メディア)を別チャネルに分離するという設計思想"
      - "すべての通信を1本のチャネルに統合するという設計思想"
      - "音声とテキストデータを同じフォーマットで扱うという設計思想"
      - "認証を一切行わず誰でも接続できるようにするという設計思想"
    answerIndex: 0
    explanation: "SIPはセッションの制御(シグナリング)だけを担い、実際の音声データはSIPのやり取りとは別に確立されたRTPのストリームとして流れます。これは電話網における「SS7(シグナリング)とTDMのベアラチャネル(データ)の分離」と同じ、制御とデータを別チャネルに分離する設計思想です。"

  - question: "自宅PCでYouTube動画を見る際の通信経路について、記事の説明に最も合致するものはどれか。"
    choices:
      - "SS7によるシグナリングで交換機を1台ずつリレーしながら専用経路が確立される"
      - "DNSによる名前解決、BGPによる動的な経路広告、CDNによる地理的な最適化が組み合わさり、宛先ごと・パケットごとに経路が動的に決まる"
      - "電話番号と同じ採番規則に基づいてIPアドレスが割り当てられる"
      - "常に1本の固定された物理回線だけを経由する"
    answerIndex: 1
    explanation: "インターネットの経路は、DNSによる階層的な名前解決、BGPによる無数のネットワーク間の動的な経路広告、CDNによる地理的な最適化という複数の独立した仕組みが組み合わさって、宛先ごと・パケットごとに動的に決まります。電話網のような「1つの通話に対する専用経路」という概念自体がありません。"

  - question: "SS7の脆弱性(いわゆるSS7ハック)が問題となる背景として、記事が説明しているものはどれか。"
    choices:
      - "SS7が最初から暗号化とMFA認証を標準搭載していたため、逆に攻撃者に悪用されやすくなった"
      - "SS7が「信頼できる限られた事業者だけが接続する閉域網」を前提に設計されていたが、国際的な相互接続の拡大により、当初想定されていなかった第三者がSS7網にアクセスできるケースが生じた"
      - "SS7は元々パケット交換方式のIPネットワーク専用に設計されたため、電話網との親和性が低い"
      - "SS7は課金情報を一切扱わないため、悪用されても実害がない"
    answerIndex: 1
    explanation: "SS7は1970年代、信頼できる限られた事業者だけが接続する閉域網であることを前提に設計されており、メッセージの送信元を強く認証する仕組みや暗号化の仕組みが標準では組み込まれていません。国際的な相互接続の拡大により、当初想定されていなかった第三者がSS7網にアクセスできてしまうケースが報告されています。"

  - question: "企業内でVoIP(IP電話)を導入する際にQoS(Quality of Service)の設定がしばしば必要になる理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "RTPはUDPの上で動作しTCPのような輻輳制御・再送を行わないため、他のバルクなトラフィックと帯域を共有すると音声パケットが後回しにされ、ジッタ・遅延・パケットロスが悪化しやすいから"
      - "QoSを設定しないとSIPのINVITEメッセージが送信できないから"
      - "QoSを設定しないと音声がデジタル化されずアナログのまま送信されてしまうから"
      - "QoSを設定しないとSS7網への接続が拒否されるから"
    answerIndex: 0
    explanation: "RTPはUDPの上で動作し、TCPのような輻輳制御・再送を行わないため、他のバルクなトラフィックとIPネットワークを共有していると音声パケットが後回しにされ、ジッタ・遅延・パケットロスが悪化しやすくなります。QoSはこれを避けるために音声トラフィックを優先的に扱う仕組みです。"

  - question: "「インターネットの通信経路は、電話のように決まった1本道である」という理解について、記事の説明に照らして最も適切な評価はどれか。"
    choices:
      - "正しい。インターネットも電話網と同様、SS7のようなシグナリングで専用経路を確立する"
      - "誤り。インターネットの経路はDNS・BGP・CDNという複数の独立した仕組みの組み合わせによって宛先ごと・パケットごとに動的に決まり、電話網のような専用経路という概念自体が存在しない"
      - "正しい。インターネットの経路は契約時に固定的に割り当てられ、以後変化しない"
      - "誤り。インターネットの経路はDNSサーバーが1台だけで完全に決定している"
    answerIndex: 1
    explanation: "インターネットの経路は、DNSによる名前解決、BGPによる動的な経路広告、CDNによる地理的な最適化という複数の独立した仕組みの組み合わせによって、宛先ごと・パケットごとに動的に決まります。電話網のような「1つの通信に対する専用経路」という概念自体がありません。"
