questions:
  - question: "モバイルアプリやSPA(シングルページアプリケーション)が「パブリッククライアント」と呼ばれる理由として正しいのはどれか。"
    choices:
      - "インターネットに公開されているすべてのアプリを指す一般的な呼び方だから"
      - "クライアントシークレットを安全に保持できる、サーバー側という場所自体が存在しないから"
      - "誰でも無料でダウンロードできるアプリだから"
      - "OAuth 2.0を使わないアプリのことだから"
    answerIndex: 1
    explanation: "モバイルアプリやSPAには、クライアントシークレットを安全に保管できるサーバー側という場所自体が存在せず、アプリのバイナリやコードに埋め込んでもリバースエンジニアリングで取り出されてしまうため、パブリッククライアントと呼ばれます。"

  - question: "PKCEのcode_verifierとcode_challengeの関係として正しいのはどれか。"
    choices:
      - "code_verifierとcode_challengeは、常に同じ固定値である"
      - "code_challengeは、code_verifierをSHA-256でハッシュ化した値である"
      - "code_challengeは、認可コードの交換時にのみ送信される"
      - "code_verifierは、認可サーバー側が生成する値である"
    answerIndex: 1
    explanation: "アプリはランダムなcode_verifierを生成し、そのSHA-256ハッシュ値であるcode_challengeを最初の認可リクエストで送信します。認可コードの交換時には、ハッシュ化前のcode_verifier自体を送信します。"

  - question: "攻撃者が認可コードを横取りしても、PKCEがあれば交換要求が失敗する理由として正しいのはどれか。"
    choices:
      - "認可コード自体が、横取りされた時点で自動的に無効化されるから"
      - "正規のアプリのメモリの中だけに存在するcode_verifierを、攻撃者は持っていないから"
      - "PKCEは、認可コードそのものを暗号化しているから"
      - "攻撃者には、インターネット接続が許可されていないから"
    answerIndex: 1
    explanation: "code_verifierは、正規のアプリのメモリの中だけに存在し、ネットワーク上を一度も流れていません。攻撃者が認可コードだけで交換要求を送っても、正しいcode_verifierを持っていないため、ハッシュ値が一致せず拒否されます。"

  - question: "OAuth 2.1におけるPKCEの扱いとして正しいのはどれか。"
    choices:
      - "パブリッククライアントだけに、PKCEの利用が限定される"
      - "クライアントシークレットを持つコンフィデンシャルクライアントも含めて、すべてのクライアントにPKCEの利用が必須とされる"
      - "PKCEは、OAuth 2.1では廃止された"
      - "PKCEは、OAuth 2.1ではオプションの推奨事項に格下げされた"
    answerIndex: 1
    explanation: "OAuth 2.1では、クライアントシークレットという1つの防御だけに頼らず、PKCEによる多層防御を、コンフィデンシャルクライアントも含めてすべてのクライアントに適用することが必須とされています。"

  - question: "モバイルOS上での認可コード横取り攻撃が成立する背景として正しいのはどれか。"
    choices:
      - "すべてのモバイルOSが、カスタムURLスキームの登録を一切禁止しているから"
      - "複数のアプリが、同じカスタムURLスキームを登録できてしまうことがあるから"
      - "モバイルアプリは、ネットワーク通信を一切行えないから"
      - "認可サーバーが、常に平文でトークンを送信するから"
    answerIndex: 1
    explanation: "モバイルOSでは、複数のアプリが同じカスタムURLスキームを登録できてしまうことがあり、悪意のあるアプリが正規のアプリと同じリダイレクトURLを登録していれば、認可コードを先に横取りできる可能性があります。"
