questions:
  - question: "複数の物理パスを用意したSAN環境で、何も対処しない場合に起きることとして正しいのはどれか。"
    choices:
      - "OSは自動的に1本のLUNとして正しく認識する"
      - "OSは、各経路をそれぞれ別々のディスクとして認識してしまう"
      - "ストレージ装置が自動的にエラーを返す"
      - "すべての経路が無効化される"
    answerIndex: 1
    explanation: "何も対処しない場合、OSは各物理パスをそれぞれ別々のディスクとして認識してしまい、本来1本のはずのLUNが複数見えてしまいます。"

  - question: "WWIDの正体として正しいのはどれか。"
    choices:
      - "サーバーのMACアドレス"
      - "ストレージ装置が個々のLUNに割り振る、一意で永続的な識別子"
      - "SANスイッチのIPアドレス"
      - "ファイルシステムのラベル名"
    answerIndex: 1
    explanation: "WWIDは、ストレージ装置が個々のLUNに対して割り振る、一意で永続的な識別子であり、どの経路を経由してもLUNごとに同じ値が返されます。"

  - question: "マルチパスI/Oソフトウェアが行う、具体的な処理として正しいのはどれか。"
    choices:
      - "複数の物理的に別々のディスクを、RAIDのように1つにまとめる"
      - "同じWWIDを持つ複数のデバイスを調べ、1つの論理的なマルチパスデバイスへ統合する"
      - "ネットワークの帯域幅を自動的に拡張する"
      - "ストレージ装置のファームウェアを更新する"
    answerIndex: 1
    explanation: "マルチパスI/Oソフトウェアは、OSが認識しているすべてのブロックデバイスのWWIDを調べ、同じWWIDを持つ複数のデバイスを1つの論理的なマルチパスデバイスへまとめ直します。"

  - question: "RAIDとマルチパスI/Oの違いとして正しいのはどれか。"
    choices:
      - "両者はまったく同じものを統合している"
      - "RAIDは複数の物理的に別々のディスクを統合するが、マルチパスI/Oは1つの同じLUNへの複数の経路を統合する"
      - "マルチパスI/Oは、RAIDよりも常に高速である"
      - "RAIDは経路を統合し、マルチパスI/Oはディスクを統合する"
    answerIndex: 1
    explanation: "RAIDは複数の、物理的に別々のディスクを1つの論理ディスクへまとめる仕組みですが、マルチパスI/Oが統合しているのは、1つの同じLUNへ到達するための複数の経路です。"

  - question: "新しく接続したSANのLUNが、同じ容量のディスクとして複数表示される場合、まず確認すべきこととして正しいのはどれか。"
    choices:
      - "ストレージ装置のファームウェアバージョン"
      - "サーバー側でマルチパスI/Oソフトウェアが正しく設定・動作しているか"
      - "ネットワークケーブルの長さ"
      - "電源ユニットの冗長化状況"
    answerIndex: 1
    explanation: "多くの場合、原因はストレージ側ではなく、サーバー側でマルチパスI/Oソフトウェアが未設定、または正しく動作していないことにあります。"
