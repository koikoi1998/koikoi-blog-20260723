questions:
  - question: "IIS(Internet Information Services)という名前が表している設計思想について、記事の説明に最も合致するものはどれか。"
    choices:
      - "IISはHTTP専用のサーバーソフトウェアであり、名前に「Internet」とあるのは単なる商品名の一部に過ぎない"
      - "IISという名前自体が、複数の「インターネットサービス」を統合的に提供する基盤という設計思想を表しており、FTPサーバー機能も役割サービスとして追加できる"
      - "IISはFTP専用のサーバーソフトウェアであり、HTTP機能は後から追加された拡張機能である"
      - "IISという名前は、Internet Information Servicesではなく、Internal Information Systemの略称である"
    answerIndex: 1
    explanation: "IIS(Internet Information Services)という名前自体が、複数の「インターネットサービス」を統合的に提供する基盤という設計思想を表しています。サーバーマネージャーでWebサーバー(IIS)の役割を追加する際、Web(HTTP)機能とは別にFTPサーバーという役割サービスを個別に選択してインストールできます。"

  - question: "FTPのアクティブモードとパッシブモードの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "アクティブモードはサーバー側がクライアントへ新規にデータチャネルの接続を張り、パッシブモードはクライアント側がサーバーへデータチャネルの接続を張るという違いがあり、NATが広く普及した現在ではパッシブモードが実務上の標準になっている"
      - "アクティブモードとパッシブモードは、暗号化の有無だけが異なる"
      - "アクティブモードは制御チャネルのみ、パッシブモードはデータチャネルのみを使用する"
      - "アクティブモードとパッシブモードは、単に転送速度の設定名が異なるだけである"
    answerIndex: 0
    explanation: "アクティブモードはサーバー側がクライアントへ向けて新規にデータチャネルの接続を張るのに対し、パッシブモードはクライアント側がサーバーへ向けて接続を張ります。NATが広く普及した環境ではサーバーからの新規接続がNAT機器を正しく通過できないことが多いため、実務ではほぼ常にパッシブモードが使われます。"

  - question: "IISのFTP機能とHTTP機能の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "IISのFTP機能は、HTTP機能(HTTP.sysやアプリケーションプールの仕組み)とは内部的に完全に独立したコンポーネントとして実装されている"
      - "IISのFTP機能は、ASP.NETのコードをそのまま流用してファイル転送を実現している"
      - "IISのFTP機能を有効化すると、HTTP機能は自動的に無効化される"
      - "IISのFTP機能とHTTP機能は、同じアプリケーションプールを必ず共有しなければならない"
    answerIndex: 0
    explanation: "IISのFTPサーバー機能は、HTTP機能(HTTP.sysやアプリケーションプールの仕組み)とは内部的に完全に独立したコンポーネントとして実装されています。FTPサービス専用のリスナー・処理系が別途動作しており、ASP.NETやアプリケーションプールの仕組みはFTP機能には一切関与しません。"

  - question: "FTPSとSFTPの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "FTPSとSFTPは名前が似ているだけでなく、実装も完全に同一のプロトコルである"
      - "FTPSはFTPプロトコルにSSL/TLSによる暗号化を追加したものであり、SFTPはSSHのサブシステムとして実装された、FTPとは別系統のプロトコルである"
      - "FTPSはSSHのサブシステム、SFTPはFTPプロトコルの暗号化拡張である(記事の説明と逆)"
      - "FTPSとSFTPは、どちらもIISでは一切サポートされていない"
    answerIndex: 1
    explanation: "FTPS(FTP over SSL/TLS)は、従来のFTPプロトコルにSSL/TLSによる暗号化を追加したものです。SFTP(SSH File Transfer Protocol)は、名前に「FTP」を含みますが実際にはFTPとは別系統の、SSHのサブシステムとして実装されたファイル転送プロトコルです。IISのFTP機能はFTPSには対応していますが、SFTPには対応していません。"

  - question: "パッシブモードでファイアウォールの設定を見落とした場合に発生しうる症状について、記事の説明に最も合致するものはどれか。"
    choices:
      - "制御チャネルの接続(ログインなど)は成功するのに、実際のファイル一覧取得やアップロード・ダウンロードだけが失敗するという分かりにくい症状が発生する"
      - "FTPサーバー自体が完全に起動しなくなる"
      - "IISのWebサーバー機能(HTTP)がすべて停止する"
      - "Windows Serverのライセンス認証が無効になる"
    answerIndex: 0
    explanation: "パッシブモード用のポート範囲がファイアウォールで正しく許可されていない場合、制御チャネルの接続(ログインなど)は成功するのに、実際のファイル一覧取得やアップロード・ダウンロード(データチャネルを使う操作)だけが失敗する、という分かりにくい症状が発生します。"
