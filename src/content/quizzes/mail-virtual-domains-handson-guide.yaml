questions:
  - question: "virtual_alias_domainsの説明として正しいのはどれか。"
    choices:
      - "実在するUnixユーザーのメールボックス容量を拡張する設定"
      - "実在するUnixユーザーやメールボックスを持たない、宛先の付け替え専用のドメインを登録する設定"
      - "SPFレコードを自動的に生成する設定"
      - "TLS証明書を自動更新する設定"
    answerIndex: 1
    explanation: "virtual_alias_domainsは、実在するUnixユーザーを持たないドメインを、宛先の付け替え専用として登録する設定です。"

  - question: "virtual_alias_domainsに追加したドメインを、mydestinationにも追加した場合の挙動として正しいのはどれか。"
    choices:
      - "問題なく両方に登録され、正常に動作する"
      - "Postfixが起動時にエラーを出す"
      - "自動的にどちらか一方が無視される"
      - "メールの配送速度が2倍になる"
    answerIndex: 1
    explanation: "同じドメインをmydestinationとvirtual_alias_domainsの両方に登録すると、Postfixは起動時にエラーを出します。"

  - question: "バーチャルエイリアスとバーチャルメールボックスの違いとして正しいのはどれか。"
    choices:
      - "両者はまったく同じ機能の別名にすぎない"
      - "バーチャルエイリアスは既存のメールボックスへの付け替え、バーチャルメールボックスは独立したメールボックスの新規作成"
      - "バーチャルエイリアスはLinux専用、バーチャルメールボックスはWindows専用の機能である"
      - "バーチャルメールボックスは暗号化された通信のみをサポートする"
    answerIndex: 1
    explanation: "バーチャルエイリアスは既存ユーザーへの付け替え、バーチャルメールボックスはUnixアカウントを作らずに独立したメールボックスを作る、目的の異なる仕組みです。"

  - question: "このハンズオンで、sales@mailtest2.local宛のメールを送信した結果として正しいのはどれか。"
    choices:
      - "新規に作成したsalesというUnixユーザーのメールボックスに配送された"
      - "virtual_alias_mapsの対応表に従い、既存のUnixユーザー(alice)のメールボックスに配送された"
      - "メールは配送されずエラーになった"
      - "自動的に別のドメインへ転送された"
    answerIndex: 1
    explanation: "virtual_alias_mapsの対応表に従い、sales@mailtest2.local宛のメールは、既存のUnixユーザーaliceのメールボックスへ配送されました。"

  - question: "数千人規模のメールホスティングを行う場合に、実務で定石とされる選択として正しいのはどれか。"
    choices:
      - "バーチャルエイリアスドメインを使い続ける"
      - "バーチャルメールボックスの採用を検討する"
      - "ドメインごとに専用のサーバーを1台ずつ用意する"
      - "すべてのユーザーにroot権限を付与する"
    answerIndex: 1
    explanation: "数千人規模の宛先を扱う場合は、独立したメールボックスを大量に作成できるバーチャルメールボックスの採用が定石です。"
