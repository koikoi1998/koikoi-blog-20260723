questions:
  - question: "ゴールデンチケットが、krbtgtの秘密鍵を使って実現することとして正しいのはどれか。"
    choices:
      - "ドメインコントローラーへのネットワーク接続を一切不要にする"
      - "本物のDCに一切問い合わせることなく、任意のユーザー名・任意の権限・任意の有効期限を持つ、偽造TGTを作る"
      - "すべてのユーザーのパスワードを、自動的に同じ値に変更する"
      - "ドメインコントローラーそのものを、物理的に無効化する"
    answerIndex: 1
    explanation: "krbtgtの秘密鍵さえ手に入れば、攻撃者は本物のDCに問い合わせることなく、自分のPC内だけで、任意のユーザー名・任意の権限・任意の有効期限を持つ偽造TGT(ゴールデンチケット)を自由に作ることができます。"

  - question: "krbtgtのパスワードを1回変更しただけでは、ゴールデンチケットを無効化できない理由として正しいのはどれか。"
    choices:
      - "krbtgtのパスワードは、技術的に変更すること自体ができないから"
      - "AD DSが、krbtgtの現在のパスワードと1つ前のパスワードの両方を同時に保持しているから"
      - "ゴールデンチケットは、パスワードとは無関係に、永久に有効だから"
      - "ドメインコントローラーが、パスワードの変更を検知できないから"
    answerIndex: 1
    explanation: "AD DSはkrbtgtアカウントについて、現在のパスワードと1つ前のパスワードを両方同時に保持しているため、1回の変更では、1つ前のパスワードで署名されたゴールデンチケットが、まだ有効なまま残ってしまいます。"

  - question: "krbtgtのパスワードを本当に無効化するために必要な手順として正しいのはどれか。"
    choices:
      - "パスワードを1回だけ変更すれば十分である"
      - "既定のKerberosチケットの有効期間が経過してから、パスワードを2回連続で変更する"
      - "ドメインコントローラーをすべて再起動するだけでよい"
      - "krbtgtアカウント自体を削除する"
    answerIndex: 1
    explanation: "本当に無効化するには、パスワードを2回連続で変更する必要があり、しかも2回目の変更は、既定のKerberosチケットの有効期間(10時間)が経過してから行うべきとされています。"

  - question: "ゴールデンチケットの検知が難しい理由として正しいのはどれか。"
    choices:
      - "ゴールデンチケットは、暗号学的に不正なチケットとして、常にDCに拒否されるから"
      - "本物のkrbtgtの鍵で正しく署名されているため、DC側は暗号学的に正当なチケットとして受け入れてしまうから"
      - "ゴールデンチケットは、ネットワーク上を一切流れないから"
      - "検知のためのログが、そもそも一切記録されないから"
    answerIndex: 1
    explanation: "ゴールデンチケットは、本物のkrbtgtの鍵で正しく署名されているため、ドメインコントローラー側は、それを暗号学的に正当なチケットとして受け入れてしまい、検知が難しくなります。"

  - question: "ゴールデンチケットの検知で着目すべき、代表的な異常の手がかりとして正しいのはどれか。"
    choices:
      - "チケットの発行元のIPアドレスが、常に同じであること"
      - "ありえないほど長いチケットの有効期間、存在しないユーザー名でのアクセス、古い暗号化方式の使用"
      - "ユーザーのログイン時刻が、常に営業時間内であること"
      - "パスワードの長さが、8文字未満であること"
    answerIndex: 1
    explanation: "検知のために着目すべきなのは、チケットの内容そのものではなく、使われ方の異常です。ありえないほど長い有効期間、存在しないユーザー名でのアクセス、古い暗号化方式の使用という3つの手がかりが代表的です。"
