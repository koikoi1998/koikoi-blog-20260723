questions:
  - question: "サブネットが「パブリック」か「プライベート」かは、何によって決まるか。"
    choices:
      - "サブネット作成時にAWSコンソールで指定する属性"
      - "そのサブネットに紐づくルートテーブルの内容"
      - "サブネットのCIDRブロックの値そのもの"
      - "サブネット名に「public」という文字列を含めるかどうか"
    answerIndex: 1
    explanation: "「パブリック/プライベート」はAWS側の属性ではなく、そのサブネットに紐づくルートテーブルの内容によって結果的に決まる区分です。"

  - question: "IGWをVPCにアタッチしただけで起きることは何か。"
    choices:
      - "VPC内のすべてのサブネットが自動的にインターネットと通信できるようになる"
      - "それだけではどのサブネットもまだインターネットと通信できない"
      - "既存のすべてのルートテーブルが自動的に更新される"
      - "NATゲートウェイが自動的に作成される"
    answerIndex: 1
    explanation: "IGWのアタッチだけでは通信できるようにならず、サブネットごとのルートテーブルに明示的にルートを追加する必要があります。"

  - question: "NATゲートウェイが可能にする通信の方向はどれか。"
    choices:
      - "インターネット側からプライベートサブネットへの、双方向の通信"
      - "プライベートサブネット側から外向きに通信を開始する、一方向の通信のみ"
      - "同一VPC内のサブネット同士の通信のみ"
      - "オンプレミス環境との専用線通信のみ"
    answerIndex: 1
    explanation: "NATゲートウェイが可能にするのはプライベート側から外向きに通信を開始する一方向のみで、外部から接続を開始することはできません。"

  - question: "NATゲートウェイの課金について正しい説明はどれか。"
    choices:
      - "起動時間に対する課金のみで、データ量には課金されない"
      - "起動時間への課金と、通過するデータ量への課金の両方が発生する"
      - "完全に無料で利用できる"
      - "作成時の一度きりの課金のみ"
    answerIndex: 1
    explanation: "NATゲートウェイは、起動している時間に対する課金に加えて、通過するデータ量に対しても課金が発生します。"

  - question: "プライベートサブネットのEC2への到達性を正しく設定するために必要なことは何か。"
    choices:
      - "ルートテーブルによる到達性の設定だけで十分"
      - "セキュリティグループによる許可だけで十分"
      - "ルートテーブルによる到達性と、セキュリティグループによる許可の両方を正しく設定する必要がある"
      - "何も設定しなくても既定でアクセス可能"
    answerIndex: 2
    explanation: "ルートテーブルによる到達性とセキュリティグループによる許可は別々のレイヤーであり、両方を正しく設定する必要があります。"
