questions:
  - question: "ゾンビプロセス(<defunct>)とは何か。"
    choices:
      - "まだ起動が完了していない、初期化中のプロセス"
      - "終了した子プロセスの終了状態が、親プロセスのwait()呼び出しを待っている間、プロセステーブルに残り続けている状態"
      - "メモリ使用量が異常に多い、暴走中のプロセス"
      - "ネットワーク接続が切断された、通信エラー状態のプロセス"
    answerIndex: 1
    explanation: "子プロセスが終了すると、その終了状態は、親プロセスがwait()を呼び出して回収するまでプロセステーブルに残り続けます。この回収を待っている状態のプロセスが、ゾンビプロセスです。"

  - question: "ゾンビプロセスに対してkill -9を実行した結果として正しいのはどれか。"
    choices:
      - "即座にプロセスが消え、プロセステーブルから削除される"
      - "エラーは出ないが、プロセスは消えない。ゾンビはすでに実行を終えており、シグナルを処理するコードが存在しないため"
      - "システム全体が再起動する"
      - "親プロセスが自動的に再起動する"
    answerIndex: 1
    explanation: "ゾンビプロセスは、すでに実行を終えたプロセスであり、シグナルを受け取って処理するコードそのものが存在しないため、kill -9では消えません。唯一の解決策は、親プロセスによる回収です。"

  - question: "PID 1が、他の通常のプロセスと異なる、特別な扱いを受ける点として正しいのはどれか。"
    choices:
      - "PID 1は、常に最も高いCPU優先度を与えられる"
      - "カーネルは、PID 1にシグナルのデフォルト処理を適用しないため、明示的なハンドラーがない限りSIGTERMを無視し続ける"
      - "PID 1は、メモリを無制限に使用できる"
      - "PID 1は、ネットワーク通信が一切できない"
    answerIndex: 1
    explanation: "通常のプロセスはSIGTERMを受け取るとカーネルの既定の動作(終了)が適用されますが、PID 1だけは例外で、明示的にハンドラーを登録していない限り、SIGTERMを黙って無視し続けます。"

  - question: "コンテナでdocker stopを実行してもコンテナが終了しない、という症状の直接の原因として正しいのはどれか。"
    choices:
      - "Dockerデーモン自体がクラッシュしているから"
      - "アプリケーション自身がPID 1として動いており、SIGTERMへの明示的な応答を実装していないから"
      - "コンテナのディスク容量が不足しているから"
      - "コンテナのネットワーク設定が間違っているから"
    answerIndex: 1
    explanation: "docker stopは内部的にSIGTERMを送信しますが、PID 1は明示的なハンドラーがない限りSIGTERMを無視するため、アプリケーション自身がPID 1として動いている場合、応答せず、既定のタイムアウト後の強制SIGKILLを待つことになります。"

  - question: "tiniやdumb-initという、軽量なinitラッパーが解決する問題として正しいのはどれか。"
    choices:
      - "アプリケーションのメモリリークを自動的に修正する"
      - "コンテナのPID 1として動作し、ゾンビプロセスの回収とシグナルの正しい転送を代行する"
      - "アプリケーションのソースコードを自動的に最適化する"
      - "コンテナのネットワーク速度を向上させる"
    answerIndex: 1
    explanation: "tiniやdumb-initは、コンテナのPID 1として動作し、ゾンビプロセスの回収と、シグナルの正しい転送という、通常のinitプロセスが担う2つの責務を代行する、軽量なラッパーです。"
