questions:
  - question: "このハンズオンで、同じボディのPOSTリクエストを2回送信した結果として正しいのはどれか。"
    choices:
      - "1つのリソースだけが作成され、2回目は無視された"
      - "idが異なる2つの別々のリソースが作成された"
      - "サーバーがエラーを返し、どちらも作成されなかった"
      - "1つのリソースが2回更新された"
    answerIndex: 1
    explanation: "POSTは非冪等な設計のため、同じ内容のリクエストを2回送ると、id 1とid 2という、別々の2つのリソースが作成されました。"

  - question: "PUTが冪等であることが確認できた、このハンズオンの結果として正しいのはどれか。"
    choices:
      - "同じIDに同じ内容のPUTを2回送っても、サーバー側の状態は同じ1つの結果に収束した"
      - "PUTを送るたびに新しいリソースが作成された"
      - "PUTは1回しか送信できない仕様になっていた"
      - "PUTを送るとサーバーが停止した"
    answerIndex: 0
    explanation: "同じIDに同じ内容のPUTリクエストを何度送っても、サーバー側の状態は「そのIDがこの内容になっている」という同じ結果に収束します。"

  - question: "冪等性についての正しい理解はどれか。"
    choices:
      - "HTTPの仕様が、メソッドごとに冪等性を自動的に保証している"
      - "冪等性は、サーバー側の実装によって実現される、設計上の約束事である"
      - "冪等性は、クライアント側の設定だけで決まる"
      - "冪等性は、JSON形式のリクエストにのみ適用される概念である"
    answerIndex: 1
    explanation: "冪等性は、HTTPの仕様が自動的に保証するものではなく、サーバー側が「このメソッドならこう動く」と意図的に実装することで実現されます。"

  - question: "このハンズオンのページネーションのレスポンスで確認された構造として正しいのはどれか。"
    choices:
      - "全件数(total)と、そのページ分のデータ(items)が、別々のフィールドとして返ってきた"
      - "常に全件のデータが1回のレスポンスで返ってきた"
      - "ページ番号を指定しても、常に同じデータが返ってきた"
      - "ページネーションには、HTTPヘッダーだけが使われた"
    answerIndex: 0
    explanation: "レスポンスには、全件数を示すtotalフィールドと、そのページ分だけのitemsフィールドが、別々に含まれていました。"

  - question: "クライアント側でリトライ処理を実装する際の、このハンズオンから得られる教訓として正しいのはどれか。"
    choices:
      - "すべてのHTTPメソッドを、無条件に再送してよい"
      - "冪等なメソッド(PUTなど)と、再送すべきでないメソッド(POSTなど)を区別する必要がある"
      - "リトライ処理は、サーバー側だけで実装すればよい"
      - "リトライはGETリクエストでのみ発生しうる"
    answerIndex: 1
    explanation: "POSTのような非冪等なメソッドを無条件に再送すると、意図しない重複リソースが作られるリスクがあるため、メソッドごとに再送してよいかを区別する必要があります。"
