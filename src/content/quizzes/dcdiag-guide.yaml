questions:
  - question: "dcdiagというツールの性質について、記事の説明に最も合致するものはどれか。"
    choices:
      - "DCが正常に機能するために必要な多数の独立したテストを一括で実行し、それぞれをPASS/FAILとして報告するツールであり、万能の単一チェックではない"
      - "AD DSのスキーマを変更するための唯一の公式ツールである"
      - "dcdiagは常にネットワーク全体を再起動する副作用を持つため、業務時間外にしか実行できない"
      - "dcdiagは1つのテストだけを実行し、それがPASSすればAD環境全体が完全に正常であることを保証する"
    answerIndex: 0
    explanation: "dcdiagは、DCが正常に機能するために必要な多数の独立したテスト項目を一括で実行し、それぞれをPASS/FAIL/警告として報告するツールです。各テストは異なる観点をチェックしており、万能の単一チェックとして位置づけるべきではありません。"

  - question: "/vオプションを付けてdcdiagを実行すると追加される情報について、記事の説明に最も合致するものはどれか。"
    choices:
      - "/vを付けると、テストの実行速度が大幅に高速化される"
      - "PASSしたテストについても、その判定の根拠となった詳細情報まで出力されるようになり、際どい状態を見逃しにくくなる"
      - "/vを付けると、FAILしたテストの結果だけが非表示になる"
      - "/vはAD DSのバージョンを最新版へ自動的にアップグレードするオプションである"
    answerIndex: 1
    explanation: "/v(verbose)オプションを付けると、PASSしたテストについても、その判定の根拠となった詳細情報(確認したレコードの内容や応答時間など)まで出力されるようになり、「何を根拠にPASSと判定したのか」まで確認できるため、際どい状態を見逃しにくくなります。"

  - question: "NetLogons、Replications、Services、KnowsOfRoleHoldersのいずれかがFAILした場合について、記事の説明に最も合致するものはどれか。"
    choices:
      - "これらは軽微なテストであり、無視して次の作業に進んで問題ない"
      - "これらはDCとしての根幹機能(レプリケーション、認証、FSMO情報の把握)に関わるテストであり、原因を特定し解消するまでAD移行作業を先に進めるべきではない"
      - "これらがFAILした場合は、必ずOSを再インストールしなければならない"
      - "これらのテストは、Windows Server 2025以降では廃止されている"
    answerIndex: 1
    explanation: "NetLogons・Replications・Services・KnowsOfRoleHoldersは、DCとしての根幹機能そのものに関わるテストです。これらがFAILしている場合は、原因を特定し解消するまで、FSMO転送やDCの降格といったAD移行作業を先に進めるべきではありません。"

  - question: "dcdiag /vの警告・エラーを無視してよいかどうかを判断する基本方針について、記事の説明に最も合致するものはどれか。"
    choices:
      - "警告の数が5個以下であれば、内容を問わず無視してよい"
      - "その警告・エラーが一時的・想定内の事象に起因するか、そしてこれから実行しようとしている作業に直接影響する根幹的なテストかどうかを軸に個別に判断する"
      - "すべての警告は、発生した曜日によって無視してよいかどうかが自動的に決まる"
      - "警告は色(赤・黄・緑)で重要度が明確に区別されて表示されるため、色だけを見れば判断できる"
    answerIndex: 1
    explanation: "警告の件数ではなく、その警告・エラーが一時的・想定内の事象に起因するものかどうか、そしてこれから実行しようとしている作業(FSMO転送やDCの降格など)に直接影響する根幹的なテストに属するかどうかを軸に、個別に判断することが重要です。"

  - question: "dcdiag /vをAD移行の複数の段階で繰り返し実行することの目的について、記事の説明に最も合致するものはどれか。"
    choices:
      - "同じコマンドを繰り返し実行することで、AD DSのパフォーマンスが向上するため"
      - "各段階の結果を比較することで、「移行前から存在していた警告」と「移行作業によって新たに発生した警告」を区別できるようにするため"
      - "dcdiagは1回の実行では正しい結果を返さない仕様になっているため、必ず複数回実行する必要がある"
      - "複数回実行しないと、dcdiagのライセンスが無効になるため"
    answerIndex: 1
    explanation: "移行作業の各段階(移行前・新DC追加後・FSMO転送後・旧DC撤去後)で結果を保存し比較することで、「元から存在していた問題」と「作業によって新たに発生した問題」を切り分けられます。1回きりの実行では、この比較ができません。"
