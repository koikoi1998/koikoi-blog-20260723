questions:
  - question: "KVMとQEMUの役割分担として、記事内で説明されている正しい説明はどれか。"
    choices:
      - "KVMとQEMUはまったく同じ機能を持つ、単なる別名同士のソフトウェアである"
      - "KVMはCPU/メモリの仮想化を担うカーネルモジュール、QEMUはそれ以外のハードウェア全般をソフトウェアで再現するユーザー空間のプログラムである"
      - "KVMはネットワーク機能のみ、QEMUはディスク機能のみを担当している"
      - "QEMUがすべてを担当し、KVMはQEMUのログ出力機能に過ぎない"
    answerIndex: 1
    explanation: "KVMはCPU/メモリの仮想化(命令の実行そのもの)を担うカーネルモジュール、QEMUはディスクコントローラ・NIC・BIOSなどそれ以外のハードウェア全般をソフトウェアで再現するユーザー空間のプログラムです。"

  - question: "Proxmox VEがType 1(ベアメタル型)ハイパーバイザーに分類される理由として、記事内で説明されているものはどれか。"
    choices:
      - "Proxmox VEがハードウェアメーカーによって出荷時にプリインストールされているため"
      - "Linuxカーネル自体がKVMによってハイパーバイザーの役割を兼ねており、ホストOSの上にさらに別の仮想化専用ソフトを重ねる構成ではないため"
      - "Proxmox VEはVMを1台しか同時に起動できない制限があるため"
      - "Proxmox VEにはWeb管理画面が存在しないため"
    answerIndex: 1
    explanation: "KVMを使うことでLinuxカーネル自体がハイパーバイザーとして機能するため、ホストOSの上でさらにVM実行専用ソフトを動かすType 2型とは異なり、ハードウェアを直接制御するType 1型に分類されます。"

  - question: "Proxmox VEでVMが物理LANと同じセグメントに参加できる仕組みとして、記事内で説明されているものはどれか。"
    choices:
      - "VMの仮想NICがTAPデバイスとして現れ、Linuxブリッジ(vmbr)を介して物理NICと同じスイッチに接続されるため"
      - "VMは常にインターネット経由でのみ通信し、LAN内の機器とは通信できない"
      - "Proxmox VEが独自のクラウド専用ネットワークプロトコルを使っているため"
      - "VMのMACアドレスが物理NICと自動的に同一になるため"
    answerIndex: 0
    explanation: "VMの仮想NICはTAPデバイスとしてホスト側に現れ、これがvmbr0のようなLinuxブリッジ(仮想スイッチ)に接続されます。物理NICも同じブリッジに接続されているため、VMは物理LANに直結しているのと同様に通信できます。"

  - question: "コピーオンライト方式のスナップショットが高速に取得できる理由として、記事内で説明されているものはどれか。"
    choices:
      - "スナップショット取得時にディスクの全内容をまるごと圧縮するため"
      - "スナップショット以降に変更されたブロックだけを新しい場所に書き込み、元のブロックは変更されるまでそのまま参照し続けるため"
      - "スナップショットは実際にはディスクの内容を一切保存していないため"
      - "スナップショット取得時にVMを完全にシャットダウンしてからコピーするため"
    answerIndex: 1
    explanation: "コピーオンライトは、スナップショット取得時点でディスク全体を複製するのではなく、以降に変更されたブロックだけを新しい場所に書き込む仕組みです。これにより数百GBのディスクでも数秒でスナップショットを取得できます。"

  - question: "VMとLXCコンテナのトレードオフとして、記事内で説明されている内容はどれか。"
    choices:
      - "VMはハードウェアレベルの完全な分離を提供する分オーバーヘッドが大きく、LXCコンテナはカーネルを共有する分軽量だが分離の強度はVMに劣る"
      - "VMとLXCコンテナは技術的にまったく同じものであり、名前が違うだけである"
      - "LXCコンテナの方が常にVMよりも分離の強度が高い"
      - "VMはネットワーク機能を持てないが、LXCコンテナは持てる"
    answerIndex: 0
    explanation: "VMはゲストごとに独立したカーネルを持つため分離が強い一方でオーバーヘッドが大きく、LXCコンテナはホストのカーネルを共有するため軽量ですが、分離の強度はVMに劣ります。"
