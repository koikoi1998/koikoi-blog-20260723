questions:
  - question: "クライアントが直前まで存在したリソースにGETリクエストを送ったところ、実は数秒前に別のクライアントがそのリソースをDELETEしており、404 Not Foundが返ってきた。この404の分類に関する説明として、最も適切なものはどれか。"
    choices:
      - "サーバー側の処理が異常終了した結果であるため、本来は5xx系に分類されるべきものが便宜上4xxとして扱われている"
      - "クライアント側に実装ミスや不正操作が必ず存在することを意味する4xxである"
      - "サーバー側の処理自体は正常に完了しており、単にリクエストされたリソースが今のサーバーの状態には存在しないという事象であるため、クライアントの実装ミスとは限らなくても一貫して4xx(クライアント起因)に分類される"
      - "他クライアントによる削除が原因であるため、この場合に限りステータスコードは409 Conflictを返すのが仕様上正しい"
    answerIndex: 2
    explanation: "記事では、404は「クライアントが持っていた情報がサーバー側の状態変化によって古くなった」ケースでも返ることがあり、それはバグや不正操作を意味するわけではないが、サーバー側の処理は正常に完了しているという点で一貫して4xxに分類される、と説明されています。"

  - question: "TLSハンドシェイクにおける公開鍵暗号方式の役割に関する記述のうち、最も正確なものはどれか。"
    choices:
      - "証明書に含まれる公開鍵は、以降の実際のHTTPリクエスト・レスポンス全体を暗号化するために継続して使われる"
      - "公開鍵暗号方式は、以降の通信を暗号化するための共通鍵を安全に共有する鍵交換にのみ使われ、実際のデータのやり取りはAES等の共通鍵(対称鍵)暗号で行われる"
      - "公開鍵暗号方式は共通鍵暗号より計算コストが低いため、実データの暗号化にも標準的に使われる"
      - "サーバー証明書の検証が失敗しても、公開鍵暗号方式による鍵交換さえ成立すれば通信は安全に継続される"
    answerIndex: 1
    explanation: "記事では、公開鍵暗号方式は計算コストが高いため実データのやり取りには使わず、あくまで共通鍵を安全に受け渡すためだけに使われ、以降の実通信はAESなどの対称鍵暗号(公開鍵暗号より高速)で行われると説明されています。"

  - question: "送金APIに`POST /transfers`で送金リクエストを送ったが、レスポンスが返ってくる前にタイムアウトが発生した。この状況での安全なリトライ設計に関する記述として、最も適切なものはどれか。"
    choices:
      - "POSTはべき等なメソッドとして定義されているため、同じリクエストをそのまま再送しても安全である"
      - "タイムアウトが発生した時点でサーバー側の処理は必ず失敗していると判断できるため、そのまま再送してよい"
      - "クライアントは、リクエストが届く前に切れたのか処理完了後のレスポンスが届く前に切れたのかを判別できないため、単純な再送は送金の二重実行を招く危険がある。冪等性キーをリクエストに含め、サーバー側で同じキーなら前回と同じ結果を返す設計にすることで安全にリトライできる"
      - "冪等性キーはGETリクエストの結果をキャッシュして高速化するための仕組みであり、POSTの重複実行防止とは無関係である"
    answerIndex: 2
    explanation: "記事では、POSTは非べき等なため単純リトライは危険であり、クライアント側はリクエストがサーバーに届く前後どちらで切れたか判別できないと説明されています。この問題への対処として、冪等性キー(Idempotency-Key)を使い、サーバー側で重複リクエストを検知して同じ結果を返す設計が紹介されています。"

  - question: "RESTの「ステートレス」原則に関する次の記述のうち、誤っているものはどれか。"
    choices:
      - "ステートレスとは、サーバーがデータベース上のリソースの状態そのものを一切保存しないという意味である"
      - "ステートレスの原則により、サーバーはクライアントとの対話の文脈(セッション状態)を保持しないため、認証情報は毎回のリクエストに含める必要がある"
      - "ページネーションにおいて「まだ送っていない残りのページ」はサーバーが自発的に送ってくるものではなく、クライアントが次ページを明示的にリクエストして初めて返ってくるのは、サーバーがクライアントごとの取得状況を覚えていないというステートレスな性質に起因する"
      - "ステートレスとは、あくまでクライアントとの対話の文脈(ログイン中かどうかなど)をサーバーが保持しないことを指す概念である"
    answerIndex: 0
    explanation: "記事の「よくある誤解」で、ステートレスは対話の文脈(セッション状態)を保持しないという意味であり、データベース上のリソースの状態を保存しないという意味ではないと明記されています。両者を混同しないことが重要だと説明されています。"

  - question: "世の中で「RESTful API」と呼ばれているものの実態についての記述として、最も適切なものはどれか。"
    choices:
      - "Fieldingの原論文が定義する原則(特にHATEOAS)を厳密に満たしているものが大半である"
      - "JSON形式でデータをやり取りしてさえいれば、URL設計に関わらずRESTfulと呼べる条件を満たしている"
      - "多くはリソースをURLで表現し、HTTPメソッドを使い分け、JSONでやり取りするという部分のみを実践した緩やかな「RESTライク」な実装であり、HATEOASなどの原則までは厳密に満たしていないことが多いが、実務上はそれ自体問題視されることは少ない"
      - "HATEOASを満たさないAPIをRESTfulと呼ぶことは技術的な誤りであり、実務上も厳しく問題視されている"
    answerIndex: 2
    explanation: "記事では、実務上「RESTful API」と呼ばれるものの多くはHATEOASなどFieldingの原則を厳密には満たさない「RESTライク」な実装であり、それ自体は実務上問題視されることは少ないと説明されています。"

  - question: "OAuth 2.0の認可コードフローに関する記述のうち、最も適切なものはどれか。"
    choices:
      - "クライアント(第三者アプリ)は認可サーバーからユーザーのパスワードを直接受け取り、それを使ってリソースサーバーにアクセスする"
      - "クライアントが最終的に受け取るアクセストークンは有効期限が長く設定されるのが一般的であり、リフレッシュトークンを併用する必要はない"
      - "クライアントはユーザーのパスワードを一度も受け取らず、認可コードと引き換えにアクセストークンを取得する。アクセストークンは有効期限が短く設定されるのが一般的で、再ログインなしで更新できるよう有効期限の長いリフレッシュトークンと組み合わせて使うのが一般的である"
      - "リソースオーナーはクライアントの画面上で直接ログイン情報を入力し、クライアントがその情報を認可サーバーに転送することで認可コードが発行される"
    answerIndex: 2
    explanation: "記事では、OAuth 2.0のポイントはクライアントがユーザーのパスワードを一度も受け取らないことであり、ユーザーは認可サーバーの画面上で直接ログイン・同意を行うと説明されています。またアクセストークンは短命で、リフレッシュトークンと組み合わせるのが一般的な設計とされています。"

  - question: "数百台規模のiDRAC群を一覧取得するRedfish APIのように、サーバーの追加・撤去が日常的に発生する環境でのページネーション実装に関する記述として、最も適切なものはどれか。"
    choices:
      - "オフセット方式(`?page=2&limit=50`)は、取得中にデータの追加・削除があってもページの境目がずれないため、この環境に最適である"
      - "カーソル方式(`?after=<直前の最後の項目のID>`)は、データの追加・削除があってもズレが生じにくいため、このような大規模かつ変化の多い環境で実務上好まれる傾向がある"
      - "RESTはステートレスな仕組みであるため、サーバーは各クライアントが取得済みのページを記憶しており、続きのページは自動的にプッシュ配信される"
      - "カーソル方式は特定のページ番号に直接ジャンプできる点が、オフセット方式に対する明確な優位点である"
    answerIndex: 1
    explanation: "記事では、オフセット方式は取得中のデータ追加・削除でページの境目がずれ重複・欠落が起きうる一方、カーソル方式はズレが生じにくく大量データに安定して動作するため、サーバーの増減が日常的な大規模環境ではカーソル方式が実務上好まれると説明されています。逆に特定ページへの直接ジャンプはカーソル方式が不得意とする点です。"

  - question: "あるAPIクライアントへのリクエストで401や403が返るようになった場合の切り分けに関する記述のうち、最も適切なものはどれか。"
    choices:
      - "401は「認証情報がない/無効」、403は「認証はOKだが権限不足」を意味し、いずれの場合もまずは認証トークンの有効期限切れ・権限不足・ヘッダー名のタイポなどを疑うのが定石である"
      - "401と403はいずれもサーバー側の処理が重く応答が遅延していることを示すステータスであり、リクエスト頻度を下げて待つことが初手になる"
      - "401はクライアント起因、403はサーバー起因のステータスコードに分類されるため、403が返った場合はサーバーの再起動を試みるべきである"
      - "403は認証情報自体が存在しないことを示し、401は認証済みだが権限が不足していることを示す"
    answerIndex: 0
    explanation: "記事のステータスコード表では401は「認証情報がない/無効」、403は「認証はOKだが権限不足」と定義されており、トラブルシューティングの節では401/403が返る場合は認証トークンの有効期限切れ、権限不足、ヘッダー名のタイポなどを疑うと説明されています。両者とも4xx(クライアント側の問題)に分類される点にも注意が必要です。"

  - question: "「プロトコル」と「API」の関係性についての説明として、最も適切なものはどれか。"
    choices:
      - "プロトコルはサービスごとに内容が異なる個別の窓口を指し、APIは機器・ソフトウェア間で共通に使われる汎用的な通信の作法を指す"
      - "APIはプロトコルの上に成り立っており、HTTPのような特定のソフトウェアに依存しない汎用的な手順・形式(プロトコル)に則りつつ、個々のサービスが独自に公開する窓口・取り決めがAPIである"
      - "プロトコルとAPIは同じ階層の概念を指す別名であり、実務上両者を区別する意味はない"
      - "RESTful APIは、HTTPというプロトコルを置き換える目的で新たに提唱された、より上位のプロトコルの一種である"
    answerIndex: 1
    explanation: "記事では、プロトコルはどんなクライアント・サーバーの組み合わせでも共通して使える通信の作法そのものであり、APIはその上でサービスごとに個別に公開される窓口・約束事であると説明されています。RESTful APIはHTTPというプロトコルの作法に則って個々のサービスがAPIを公開する組み合わせで成立していると整理されています。"

  - question: "「HTTPSにしておけばAPIは安全だ」という主張に対する最も適切な指摘はどれか。"
    choices:
      - "正しい。HTTPSは通信の暗号化に加えて認証・認可の機能も内包しているため、これだけで十分である"
      - "誤り。HTTPSは通信経路の盗聴・改ざん防止(暗号化)を保証するものであり、誰がアクセスしているか(認証)やその人が何をしてよいか(認可)は別レイヤーの話であるため、認証情報が漏洩すれば誰でもなりすませてしまう"
      - "誤り。HTTPSはTLSハンドシェイクを経ないため、実際には通信内容が暗号化されていないから安全とは言えない"
      - "正しい。ただしBasic認証を利用している場合に限り、別途の対策が必要になる"
    answerIndex: 1
    explanation: "記事の「よくある誤解」で、HTTPSは通信経路の暗号化を保証するが、認証・認可は別レイヤーの話であり、HTTPSでも認証情報が漏洩すれば誰でもなりすませると明記されています。TLSハンドシェイク自体はHTTPS通信で必ず行われる仕組みです。"
