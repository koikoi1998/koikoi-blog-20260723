questions:
  - question: "Anycastが、拠点振り分けの判断を行っているレイヤーとして正しいのはどれか。"
    choices:
      - "DNSの名前解決の層"
      - "インターネットのルーティングを担うBGPの層"
      - "アプリケーション層のHTTPヘッダー"
      - "物理層のケーブル配線"
    answerIndex: 1
    explanation: "Anycastは、DNSの名前解決という層ではなく、インターネットのルーティングそのものを担うBGPの層で、拠点振り分けの判断を実現しています。"

  - question: "GSLBとAnycastの、障害発生時の切り替え速度の違いとして正しいのはどれか。"
    choices:
      - "両者はまったく同じ速度で切り替わる"
      - "GSLBはDNSキャッシュのTTLに依存するため遅れが生じうるが、Anycastはルーティングの再収束により一般的に高速に切り替わる"
      - "Anycastの方が、常にGSLBより切り替えが遅い"
      - "GSLBは障害発生時、自動的には切り替わらない"
    answerIndex: 1
    explanation: "GSLBの切り替えはDNSキャッシュのTTLが切れるまで反映されないことがありますが、Anycastはルーティングの再収束によって、一般的に高速に切り替わります。"

  - question: "Anycastが考慮していないものとして正しいのはどれか。"
    choices:
      - "BGPのASパスの長さ"
      - "拠点の現在の負荷状況"
      - "広告しているIPアドレス"
      - "ルーターの設定"
    answerIndex: 1
    explanation: "Anycastが決めているのは経路的な『近さ』だけであり、その拠点が現在どれだけ混雑しているかという『負荷』の状況は、まったく考慮されません。"

  - question: "Anycastが、個々の接続に対して持つ弱点として正しいのはどれか。"
    choices:
      - "暗号化に対応していない"
      - "接続(セッション)の状態を維持する仕組みを持たず、ルーティングの変化で同一接続が別拠点へ届く可能性がある"
      - "IPv6に対応していない"
      - "UDPにしか対応していない"
    answerIndex: 1
    explanation: "Anycastは個々の接続の状態を維持する仕組みを持たないため、ルーティングが変化すると、同一の継続中の接続が、途中から別の拠点へ届いてしまう可能性があります。"

  - question: "実務におけるGSLBとAnycastの関係として正しいのはどれか。"
    choices:
      - "どちらか一方だけを選ぶべき、競合する選択肢である"
      - "両方を組み合わせて使われることが多く、それぞれ異なる抽象度の問題を解決している"
      - "Anycastを使えば、GSLBは完全に不要になる"
      - "GSLBを使えば、Anycastは完全に不要になる"
    answerIndex: 1
    explanation: "GSLBとAnycastは競合する選択肢ではなく、実務では両方を組み合わせて使われることが一般的で、それぞれ異なる抽象度の問題を解決しています。"
