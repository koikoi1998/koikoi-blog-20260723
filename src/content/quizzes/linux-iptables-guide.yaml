questions:
  - question: "iptablesコマンドとnetfilterの関係として正しい説明はどれか。"
    choices:
      - "iptablesコマンド自身が、実行中も常駐してパケットを1つずつ検査している"
      - "iptablesコマンドはルールをカーネルのnetfilterに登録するだけの設定ツールで、実際のパケット検査はカーネル自身が行う"
      - "netfilterはiptablesコマンドが生成する一時ファイルの名前である"
      - "iptablesとnetfilterはまったく無関係な独立した機能である"
    answerIndex: 1
    explanation: "iptablesコマンドは、カーネルのnetfilterフレームワークにルールを登録するための設定ツールに過ぎません。実際にパケットを1つ1つ検査してACCEPT/DROPを判断しているのはカーネル自身です。"

  - question: "L2TP/IPsecハンズオンで、クライアントの仮想IPアドレス帯(10.10.10.0/24)の通信を許可するために使うべきチェーンはどれか。"
    choices:
      - "INPUT(このサーバー自身宛てのパケットのみを扱うため不適切)"
      - "FORWARD(このサーバーを経由して転送されるパケットを扱うため適切)"
      - "OUTPUT(ローカルで生成された応答のみを扱うため不適切)"
      - "PREROUTING(ルーティング判断前の全パケットを無条件に扱うため不適切)"
    answerIndex: 1
    explanation: "INPUTはこのホスト自身宛てのパケットにしか適用されません。サーバーを経由して他へ転送されるクライアントの通信にはFORWARDチェーンのルールが必要です。"

  - question: "iptablesのルールがチェーン内でどのように評価されるか、正しい説明はどれか。"
    choices:
      - "すべてのルールが並列に評価され、最も厳しい判定が採用される"
      - "ランダムな順序で評価される"
      - "上から順に評価され、最初に一致したルールのターゲットでそのパケットの処理が確定する"
      - "下から順に評価され、最後に一致したルールが優先される"
    answerIndex: 2
    explanation: "iptablesのルールは登録順(通常は上から)に評価され、最初に一致したルールのターゲット(ACCEPT/DROPなど)でそのパケットの処理が確定します。この性質上、広いルールを先に書くと後の狭い例外ルールが評価されずに終わることがあります。"

  - question: "connection tracking(conntrack)のESTABLISHED状態が意味するものはどれか。"
    choices:
      - "この通信の最初のパケットで、新規のコネクションであることを示す"
      - "双方向の通信がすでに成立している既存のコネクションに属するパケットであることを示す"
      - "どのコネクションにも該当しない不正なパケットであることを示す"
      - "ファイアウォールによって強制的に切断されたコネクションであることを示す"
    answerIndex: 1
    explanation: "ESTABLISHEDは、すでに双方向の通信が成立している既存のコネクションに属するパケットを示す状態です。これを使うことで「すでに確立された通信の応答だけを許可する」というステートフルな判定が可能になります。"

  - question: "MASQUERADEとSNATの違いとして、記事内で説明されている内容はどれか。"
    choices:
      - "MASQUERADEはIPv6専用、SNATはIPv4専用の機能である"
      - "SNATは変換後の送信元IPを固定値で明示指定するのに対し、MASQUERADEは送出インターフェースの現在のIPを毎回動的に問い合わせる"
      - "MASQUERADEはTCPのみ、SNATはUDPのみに対応している"
      - "両者は完全に同じ処理で、コマンドの綴りが違うだけである"
    answerIndex: 1
    explanation: "SNATは変換後の送信元IPアドレスを固定値で明示指定するのに対し、MASQUERADEは送出インターフェースに現在割り当てられているIPアドレスをパケットごとに動的に問い合わせて使用します。WAN側IPが変動しうる環境ではMASQUERADEが有利です。"

  - question: "現代の多くのディストリビューションにおけるiptablesコマンドの実態について、記事内で説明されている内容はどれか。"
    choices:
      - "常に独自の専用エンジンでパケットを処理しており、nftablesとは無関係である"
      - "iptables-nftという互換レイヤーを通じて、実際には内部でnftablesのルールセットに変換されて登録されていることが多い"
      - "iptablesは廃止され、現在のLinuxカーネルには存在しない"
      - "iptablesはユーザー空間ではなくカーネル空間で直接実行されるプログラムである"
    answerIndex: 1
    explanation: "Debian 10以降やUbuntu 20.04以降など多くの現代的なディストリビューションでは、iptablesコマンドはiptables-nftという互換レイヤーを通じて、内部的にnftablesのルールセットへ変換されて登録されています。"
