questions:
  - question: "ディスクを1台故障扱いにした後、アレイの状態として正しいのはどれか。"
    choices:
      - "アレイ全体が即座に利用不可になる"
      - "「縮退(degraded)」状態になり、冗長性を失いながらもサービスは継続する"
      - "自動的に新しいディスクが追加され、元の状態に戻る"
      - "すべてのデータが即座に消失する"
    answerIndex: 1
    explanation: "ディスクが1台故障すると、アレイは縮退状態になりますが、残ったディスクでサービスは継続できます。"

  - question: "縮退状態が危険とされる理由として正しいのはどれか。"
    choices:
      - "縮退状態では読み書きが一切できなくなるため"
      - "もう1台のディスクが同時に故障すれば、すべてのデータが失われるため"
      - "縮退状態になると、ファイルシステムが自動的に削除されるため"
      - "縮退状態では、ネットワーク接続が切断されるため"
    answerIndex: 1
    explanation: "縮退状態は、残り1台のディスクに依存している状態であり、そのディスクも故障すればすべてのデータが失われます。"

  - question: "新しいディスクを追加した後に実行される「リビルド」の内容として正しいのはどれか。"
    choices:
      - "差分データだけを新しいディスクへコピーする処理"
      - "残っている正常なディスクの全内容を、新しいディスクへ頭から最後までコピーする処理"
      - "アレイの設定ファイルだけを再作成する処理"
      - "故障したディスクのデータを復元する処理"
    answerIndex: 1
    explanation: "リビルドは差分コピーではなく、正常なディスクの全内容を新しいディスクへすべてコピーする処理です。"

  - question: "このハンズオンから得られる、最も重要な教訓として正しいのはどれか。"
    choices:
      - "RAIDを構築すれば、バックアップは一切不要になる"
      - "RAIDを構築したら、縮退状態を検知する監視・アラートの仕組みをあわせて構築する必要がある"
      - "RAID1は、RAID5よりも常に優れている"
      - "リビルド中は、システムを完全に停止させる必要がある"
    answerIndex: 1
    explanation: "監視・アラートの仕組みがなければ、縮退状態が長期間気づかれずに放置されるリスクがあります。"

  - question: "RAIDとバックアップの関係についての正しい理解はどれか。"
    choices:
      - "RAIDがあれば、バックアップの代わりになる"
      - "RAIDはハードウェア障害への対策であり、誤削除やランサムウェアには対応できない、別々の目的を持つ対策である"
      - "バックアップがあれば、RAIDは不要である"
      - "RAIDとバックアップは、まったく同じ仕組みの別名である"
    answerIndex: 1
    explanation: "RAIDはハードウェア障害対策、バックアップは誤削除やランサムウェアなど論理的な問題への対策であり、それぞれ別の目的を持ちます。"
