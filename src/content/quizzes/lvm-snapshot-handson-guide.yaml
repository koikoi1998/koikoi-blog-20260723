questions:
  - question: "LVMスナップショットを作成した直後の状態として正しいのはどれか。"
    choices:
      - "元のボリュームの、全データが複製されている"
      - "ほぼ何もデータを保持しておらず、割り当てサイズに対するData%はごくわずかである"
      - "元のボリュームが読み取り専用になる"
      - "元のボリュームと物理的に完全に分離される"
    answerIndex: 1
    explanation: "スナップショット作成直後は、ほぼ何もデータを保持していません。これは、見かけの容量と実際の消費量を分離する発想と同じです。"

  - question: "コピーオンライトという名前が表している動作のタイミングとして正しいのはどれか。"
    choices:
      - "スナップショットを作成した瞬間に、全データをコピーする"
      - "書き込み(Write)が発生する際に、変更される直前のブロックの内容を、初めてコピーする"
      - "読み取り(Read)が発生する際に、データをコピーする"
      - "一定時間おきに、定期的にデータをコピーする"
    answerIndex: 1
    explanation: "コピーオンライトは、「書き込み(Write)の際に、初めてコピー(Copy-on)が行われる」という、動作のタイミングを表す名前です。"

  - question: "元のボリュームにデータを書き込んだ際、スナップショット側で実際に起きていることとして正しいのはどれか。"
    choices:
      - "元のボリューム全体が、スナップショット側へ複製される"
      - "上書きされる直前の、変更対象のブロックだけが、スナップショット側へ退避される"
      - "何も起きず、スナップショットのサイズは常に一定である"
      - "スナップショットが自動的に削除される"
    answerIndex: 1
    explanation: "元のボリュームへの書き込みが発生するたびに、変更される直前のブロックだけが、コピーオンライトによってスナップショット側へ退避されます。"

  - question: "スナップショットが、バックアップの代わりにならない理由として正しいのはどれか。"
    choices:
      - "スナップショットは、容量を一切消費しないため"
      - "スナップショットは元のボリュームと依存関係があり、元のボリュームが物理的に故障すると、一緒に失われるため"
      - "スナップショットは、作成に非常に時間がかかるため"
      - "スナップショットは、復元が一切できないため"
    answerIndex: 1
    explanation: "スナップショットは元のボリュームとの依存関係があるため、物理障害に対する保護にはならず、本来のバックアップの代わりにはなりません。"

  - question: "スナップショットからの復元(lvconvert --merge)が、効率的な処理である理由として正しいのはどれか。"
    choices:
      - "ボリューム全体を、常にゼロから再構築するため"
      - "スナップショットが保持している、変更前のブロックだけを、元のボリュームへ書き戻すため"
      - "復元処理には、ネットワーク通信が一切発生しないため"
      - "復元処理は、常に瞬時に完了するよう保証されているため"
    answerIndex: 1
    explanation: "スナップショットは変更前のブロックだけを持っているため、復元処理は、変更された部分だけを書き戻す、効率的な処理として成立します。"
