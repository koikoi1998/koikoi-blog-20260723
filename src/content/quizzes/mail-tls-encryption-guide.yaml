questions:
  - question: "STARTTLSの設計として正しいのはどれか。"
    choices:
      - "HTTPSと同様、最初から専用のポートで暗号化接続を開始する"
      - "まず平文でSMTP接続を確立した後、同じ接続を暗号化接続へ昇格させる"
      - "暗号化されたメールのみを送受信できるようにする、独立したプロトコルである"
      - "DNSレコードによって暗号化の要否を判定する仕組みである"
    answerIndex: 1
    explanation: "STARTTLSは、既存の平文のSMTP接続を確立した後、STARTTLSコマンドによって同じ接続を暗号化接続へ昇格させる設計です。"

  - question: "日和見暗号化(Opportunistic TLS)の弱点として正しいのはどれか。"
    choices:
      - "暗号化の処理速度が極端に遅い"
      - "相手がSTARTTLSに対応していなければ、平文のまま送信を続行してしまう"
      - "証明書の有効期限を確認できない"
      - "IPv6環境では動作しない"
    answerIndex: 1
    explanation: "日和見暗号化の既定の挙動は、相手が対応していない場合に暗号化を諦め、平文のまま送信を続行するというものです。"

  - question: "MTA-STSが組み合わせている2つの要素として正しいのはどれか。"
    choices:
      - "SPFレコードとDKIMレコード"
      - "DNSのTXTレコードと、HTTPS経由のポリシーファイル"
      - "IMAPとPOP3"
      - "ソフトバウンスとハードバウンス"
    answerIndex: 1
    explanation: "MTA-STSは、DNSのTXTレコードと、HTTPS経由で配布されるポリシーファイルを組み合わせることで、ポリシーの信頼性を高めています。"

  - question: "smtp_tls_security_level = encryptの説明として正しいのはどれか。"
    choices:
      - "証明書の検証まで含めて厳格に行う"
      - "暗号化は行うが、証明書の検証は省略されるため、なりすまし自体は防げない"
      - "暗号化を一切行わない"
      - "IMAPの認証方式を変更する設定である"
    answerIndex: 1
    explanation: "encryptは通信内容の盗聴は防ぎますが、証明書の検証を伴わないため、中間者によるなりすましそのものは防げません。"

  - question: "STRIPTLS攻撃の説明として正しいのはどれか。"
    choices:
      - "受信者のパスワードを直接盗み出す攻撃"
      - "通信経路の途中でSTARTTLS応答を消し去り、平文での通信を続行させる攻撃"
      - "DNSのSPFレコードを書き換える攻撃"
      - "メールキューを溢れさせるDDoS攻撃"
    answerIndex: 1
    explanation: "STRIPTLS攻撃は、STARTTLS応答を経路の途中で消し去ることで、送信側に「相手が対応していない」と誤認させ、平文通信を続行させる攻撃です。"
