questions:
  - question: "Netlogonサービスが提供する「セキュアチャネル」とは何か。記事の説明に最も合致するものを選べ。"
    choices:
      - "インターネット向けの通信を暗号化するVPNトンネル"
      - "コンピューターアカウントのパスワードを鍵として使う、メンバーコンピューター(またはDC)とDCとの間の認証済み暗号化通信路"
      - "ユーザーがパスワードを入力する画面そのもの"
      - "DNSサーバーとの間の通信を保護するための仕組み"
    answerIndex: 1
    explanation: "セキュアチャネルは、NRPC(Netlogon Remote Protocol)の上に確立される、コンピューターアカウントのパスワードを鍵として使う認証済みの暗号化通信路です。双方が同じパスワードを知っている間だけ健全に機能します。"

  - question: "コンピューターアカウントのパスワードは、既定でどのくらいの頻度で自動更新されるか。"
    choices:
      - "1時間ごと"
      - "1日ごと"
      - "約30日ごと"
      - "1年ごと"
    answerIndex: 2
    explanation: "コンピューターアカウントのパスワードは、既定でおよそ30日ごとに、そのコンピューター自身が主体となって自動的に新しい値へ更新されます。"

  - question: "VMのスナップショットを古い状態に戻すと「信頼関係の障害」エラーが起きることがある理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "スナップショット機能自体がActive Directoryと互換性がないため"
      - "スナップショット取得後にコンピューターアカウントのパスワードが自動更新され、AD DS側の記録が新しい値に進んでいるのに、巻き戻したVM側だけが古いパスワードの記憶に戻ってしまい、両者が食い違うため"
      - "VMのMACアドレスがスナップショットごとに変わってしまうため"
      - "スナップショットを戻すとDNSサーバーの設定がリセットされるため"
    answerIndex: 1
    explanation: "スナップショット取得後もAD DS側は稼働を続けていた実体に基づいてパスワードを更新していきますが、スナップショットを古い状態に戻すとVM側のローカルなパスワードの記憶だけが過去に巻き戻り、両者が食い違ってセキュアチャネルの確立に失敗します。"

  - question: "`Test-ComputerSecureChannel -Repair`について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ドメインへの再参加なしに、セキュアチャネルだけを明示的に立て直す(ローカル・AD DS双方のパスワードを再同期する)ことができ、メンバーコンピューターで有効だがDCには使えない"
      - "ドメインコントローラー専用のコマンドであり、メンバーコンピューターでは使用できない"
      - "実行すると、そのコンピューターが強制的にドメインから脱退させられる"
      - "AD DS全体のレプリケーションを強制的にやり直すコマンドである"
    answerIndex: 0
    explanation: "-Repairは、ドメインへの再参加という大掛かりな手順を取らなくても、セキュアチャネルだけを明示的に立て直してくれる操作です。メンバーコンピューターでのみ有効で、DCには使えません。"

  - question: "Zerologon(CVE-2020-1472)脆弱性が示していたことについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "Netlogonは単なる「ログオンを手伝う裏方のサービス」に過ぎず、AD DS全体への影響は軽微だった"
      - "認証情報を一切持たない攻撃者が、ネットワーク経由でDC自身のコンピューターアカウントのパスワードを空文字列にリセットできてしまい、AD環境全体の完全な乗っ取りにつながりうる深刻な脆弱性であり、NetlogonがAD DS全体の信頼の土台を支えていることを象徴する出来事だった"
      - "この脆弱性はクライアントPC側にのみ影響し、DCには一切影響しなかった"
      - "この脆弱性はまだ修正されておらず、現在も対策方法が存在しない"
    answerIndex: 1
    explanation: "Zerologonは、認証情報を一切持たない攻撃者がネットワーク経由でDC自身のコンピューターアカウントのパスワードを空文字列にリセットできてしまう、極めて深刻な脆弱性でした。DCのコンピューターアカウントのパスワードを奪われることはドメイン全体の管理者権限を奪われることに等しく、Netlogonが単なる裏方ではなくAD DS全体の信頼の土台を支えていることを象徴する出来事でした。2020年8月の更新プログラムで修正されています。"
