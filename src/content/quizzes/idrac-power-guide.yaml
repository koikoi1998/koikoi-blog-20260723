questions:
  - question: "VRMがCPUへの給電において、電流ではなく電圧をフィードバック制御の対象にしている理由として、最も適切なものはどれか。"
    choices:
      - "CPUは処理負荷に応じて必要な電流量をデジタル信号でVRMに通知しており、VRMはその要求値ぴったりに出力を合わせているから"
      - "CPU・メモリなどの半導体は一定電圧での動作を前提に設計されており電圧変動は誤動作や破損に直結する一方、電流(消費電力)は処理内容に応じて変動するのが正常であるため、VRMは出力電圧を基準値に保つことだけをフィードバック制御し、電流はその結果として自動的に増減するから"
      - "電力＝電圧×電流の関係上、電圧さえ固定すればシステム全体の消費電力も自動的に一定になるため、電力管理が容易になるから"
      - "VRM内部のスイッチング素子は構造上、電流を直接制御することができないため、やむを得ず電圧制御を採用しているから"
    answerIndex: 1
    explanation: "CPU・メモリはVRMに電力を明示的に要求するプロトコルを持っていません。VRMは出力電圧を基準値に保つフィードバック制御だけを行い、電流(消費電力)はCPU側のインピーダンス変化に応じて結果的に増減する、という副産物的な仕組みです。選択肢1のような要求プロトコルは本文で明確に否定されています。"

  - question: "変圧器を用いた電圧変換が、DC送電網では原理的に成立しない理由として、最も適切なものはどれか。"
    choices:
      - "DCは電流の向きが常に一定であるため、電線の周りにそもそも磁界が発生しないから"
      - "DCは流れる電流の大きさが一定であるため、それが作る磁界も一定のまま変化せず、磁界の変化を必要とする電磁誘導が継続的には起こらないから"
      - "DCは電圧が構造的に低いため、鉄心を通じて二次コイルまで磁力線が届かないから"
      - "DCを流すと変圧器のコイルの巻き数比に関係なく、常に一次側と同じ電圧しか出力されない特性があるから"
    answerIndex: 1
    explanation: "電磁誘導の発生条件は「電流が流れているかどうか」ではなく「磁界が変化し続けているかどうか」です。DCは一定の電流を流し続けるため、作られる磁界も一定のままで変化せず、電源投入・遮断の瞬間を除き二次コイルへの誘導は起こりません(ただし電流自体は流れるため磁界そのものは発生しており、選択肢1は誤りです)。"

  - question: "ある送電区間で、電圧を4倍に上げ、電流を1/4に抑えて同じ電力を送電した場合、送電損失(発熱によるロス)はどう変化するか。本文中の損失の式に基づき最も適切なものを選べ。"
    choices:
      - "送電損失は電流に比例するため、1/4になる"
      - "送電損失は電流の2乗に比例するため、1/16になる"
      - "電圧・電流を変えても送電する電力自体は変わらないため、送電損失も変化しない"
      - "送電損失は電圧の2乗に比例するため、16倍になる"
    answerIndex: 1
    explanation: "本文では「損失＝電流²×抵抗」であるとされ、電流の2乗に比例します。電流を1/4にすれば損失は(1/4)²=1/16になります。本文の「電圧10倍・電流1/10で損失1/100」という例と同じ考え方を、別の倍率に当てはめたものです。"

  - question: "オンライン(二重変換)方式のUPSが、スタンバイ方式と異なり停電時にも原理的に瞬断が発生しない理由として、最も適切なものはどれか。"
    choices:
      - "出力側のインバータは常に同一のDCバスから電力を受け取っており、停電時はそのDCバスへの電力供給元が商用電源からバッテリーに変わるだけで、経路そのものを切り替えるスイッチング動作が発生しないから"
      - "バッテリーが商用電源と並列に接続されており、停電時には商用電源からバッテリーへ回路を切り替える高速なリレーを搭載することで、切り替え時間を人間が体感できないレベルまで短縮しているから"
      - "オンライン方式はAC→DC→ACの二重変換を行わず、常時ACのまま出力し続けているため、そもそも切り替えという概念自体が存在しないから"
      - "オンライン方式は瞬断の検知回路が高速なだけで、スタンバイ方式と同様に数ms〜数十ms程度の瞬断は実際には発生している"
    answerIndex: 0
    explanation: "オンライン方式は常に同じDCバスからインバータが電力を受け取り続けており、停電時はDCバスへの電力の出どころが商用電源からバッテリーに変わるだけです。経路を物理的に切り替えるスイッチング動作自体が存在しないため、原理的に瞬断が発生しません。これは二重変換ロスというトレードオフを払って得ている特性です。"

  - question: "ACケーブルは接続されているが、ホストの電源はオフになっているサーバーの状態として、本文の説明に最も合致するものはどれか。"
    choices:
      - "電源ボタンを押すかiDRAC経由でコマンドを送るまでは、BMC/iDRACを含むすべての回路が完全に無給電の状態にある"
      - "PSUはBMC/iDRAC専用のスタンバイレールに常時数W〜十数W程度の電力を供給し続けており、メインの+12V系統の出力はPS_ON信号の切り替えが行われるまで開始されない"
      - "PSUはホストのメイン電源レールも含めた全レールを常時フル出力しており、電源ボタンはVRMへの給電開始タイミングのみを制御している"
      - "スタンバイレールとメインレールは同一の制御信号で同時にON/OFFされるため、ホストの電源がオフの間はBMCも動作を停止している"
    answerIndex: 1
    explanation: "ACが刺さっている間、PSUはBMC/iDRAC専用のスタンバイレールに常時電力を供給し続けます。メインの電源レールは、物理ボタンやiDRAC経由のコマンドによってPS_ON信号がLow/Highに切り替わって初めて出力が開始されます。ホストの電源オフ中もBMCは起動済みのままです。"

  - question: "あるサーバーに4台のPSUを搭載し、`System.Power.RedundancyPolicy`を`PSU Redundant`に設定した。この構成の説明として最も適切なものはどれか。"
    choices:
      - "2台のPSUをそれぞれ異なる給電グリッド(A/B)に接続することで、片方のグリッド全体が失われても稼働継続できる設定であり、PSUの台数には依存しない"
      - "4台という構成上、2+1相当の冗長性を持ち、PSU1台単体の故障に耐えられる設定である。ただしこの設定自体が入力系統(グリッド)の冗長化まで保証するものではない"
      - "Not Redundantポリシーと実質的に同じ動作をするが、唯一の違いはホットスワップによる無停止交換が可能になる点である"
      - "PSU Redundantは2台構成でも選択可能であり、AC Redundantより優先して使うべき設定である"
    answerIndex: 1
    explanation: "本文の表では、PSU Redundant(DC Redundant)は「PSUを4台搭載する構成(2+1相当)でのみ選択可能」で「1台のPSU単体故障に耐える構成」とされています。これはPSU単体の故障への耐性であり、入力系統(グリッド)そのものの冗長化を保証するAC Redundantとは別の観点です。選択肢1の説明はAC Redundantの内容に近く、PSU Redundantの説明としては不適切です。"

  - question: "複数のサーバーが同時にホットスペア機能を有効化し、Primary PSU設定を意図的に分散させていない場合に生じうるリスクと、その一次的な安全対策の組み合わせとして、本文の説明に最も合致するものはどれか。"
    choices:
      - "リスク: 特定グリッドへ負荷が偏り続ける可能性がある。安全対策: データセンターの配電設計自体が、各グリッド単独で全負荷を賄える(N+N)容量で設計されていることが前提になっているため、即座の過負荷には至らない"
      - "リスク: PSUの冗長性が完全に失われ、片方のPSUが故障すると即座にサーバーが停止する。安全対策: 有効化しているサーバーの台数が奇数の場合、ホットスペアが自動的に無効化される"
      - "リスク: PSUの変換効率が低下し続け、電力コストが増大する。安全対策: iDRACが負荷率を監視し、40〜60%を超えるとホットスペアを自動的に無効化する"
      - "リスク: スリープ状態のPSUが実際に電力供給能力を喪失する。安全対策: PDU側のスイッチド機能で定期的に電源サイクルさせることで防止する"
    answerIndex: 0
    explanation: "本文は「片系のグリッドに負荷が集中するのでは」という懸念に対し、(1)データセンターの配電設計自体が各グリッド単独で全負荷を賄えるN+N設計になっていること、(2)`Hotspare.PrimaryPSU`をラック・サーバー単位で意図的に分散させること、の2段構えで対応するとしています。選択肢2〜4のような自動無効化機構や効率低下・能力喪失は本文に記載がありません。"

  - question: "「サーバーにPSUを2台搭載してさえいれば、電源の冗長化は達成できている」という考え方について、本文の説明に基づき最も適切な指摘はどれか。"
    choices:
      - "正しい。PSUが2台あれば片方が故障してももう片方が自動的に肩代わりするため、それ以上の設計は不要である"
      - "誤り。2台のPSUが同じ配電盤・同じブレーカーに接続されている場合、その配電盤自体の故障時には両方とも電力を失うため、給電経路(配電系統)そのものの二重化までセットで行う必要がある"
      - "誤り。PSUは3台以上搭載しない限りホットスワップに対応しないため、2台構成では常に計画停止による交換が必要になる"
      - "誤り。2台のPSUを搭載すると`System.Power.RedundancyPolicy`が自動的にNot Redundantに設定されてしまうため、手動での再設定が必須になる"
    answerIndex: 1
    explanation: "本文の誤解1として明示されている通り、PSUの二重化だけでなく、給電経路(配電系統)そのものの二重化までセットで行って初めて真の意味での電源冗長になります。同じ配電盤・ブレーカーに2台とも接続していては、その配電盤の故障時に両方とも電力を失います。"

  - question: "PSUに関するアラートがiDRACから上がった際の切り分け手順として、本文の説明に最も合致するものはどれか。"
    choices:
      - "まずPSU本体を交換し、交換後にイベントログで原因を確認する"
      - "まずイベントログでイベント種別(Redundancy lost/PSU failure/PSU entered sleep state)を確認して原因の性質を切り分け、その後`racadm getsensorinfo`でAC入力の有無を確認し、AC入力があるのにエラーが続く場合にPSU本体の交換を検討する"
      - "スリープ状態への遷移は必ずPSU故障の前兆であるため、検知した時点で即座に交換手配を行う"
      - "`racadm getsensorinfo`はAC入力電圧を測定できないため、配電盤側の問題切り分けには使用できず、必ず現地でテスターを使う必要がある"
    answerIndex: 1
    explanation: "本文のトラブルシューティング手順では、まずイベントログで種別を確認し(スリープ遷移と故障を取り違えないことが重要)、次に`racadm getsensorinfo`で入力電圧・出力状態を確認してAC入力側の問題かPSU本体の問題かを切り分け、AC入力が正常なのにエラーが続く場合に交換を検討する、という順序が示されています。"

  - question: "iDRACの電力上限ポリシー(Power Cap)とPSUの冗長化設計の関係について、本文の説明に最も合致するものはどれか。"
    choices:
      - "電力上限ポリシーは、PSU冗長化が達成されていないサーバーに対してのみ有効化できる代替の安全機能である"
      - "PSU冗長化は「何が起きても電力を絶やさない」ための設計であり、電力上限ポリシーは「そもそも使用する電力の総量を管理し、ラック単位・データセンター単位の容量計画に活用する」ための設計であって、両者は大規模環境の電源設計における別々の目的を担う"
      - "電力上限ポリシーを有効にすると、PSUの冗長ポリシーは自動的にAC Redundantに切り替わる"
      - "電力上限ポリシーはPSUのホットスワップ機能を無効化する副作用があるため、運用中は基本的に使用すべきではない"
    answerIndex: 1
    explanation: "本文は「PSUの冗長設計(何が起きても電力が絶えないようにする話)と、電力上限ポリシー(そもそも使う電力の総量を管理する話)は、どちらも大規模環境の電源設計における車の両輪」と述べています。両者は排他的でも従属的でもなく、目的の異なる別々の仕組みです。"
