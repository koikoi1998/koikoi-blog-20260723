questions:
  - question: "ゲートウェイ型VPCエンドポイントが対応しているサービスはどれか。"
    choices:
      - "EC2とLambdaのみ"
      - "S3とDynamoDBのみ"
      - "AWSのすべてのサービス"
      - "Secrets ManagerとSSMのみ"
    answerIndex: 1
    explanation: "ゲートウェイ型のVPCエンドポイントに対応しているのは、S3とDynamoDBの2つのサービスだけです。"

  - question: "ゲートウェイ型VPCエンドポイントを作成すると、ルートテーブルはどうなるか。"
    choices:
      - "手動でルートを追加しない限り何も変わらない"
      - "指定したルートテーブルに、対象サービスのIPアドレス範囲を宛先とするルートが自動的に追加される"
      - "既存のルートがすべて削除される"
      - "ルートテーブル自体が新しく作り直される"
    answerIndex: 1
    explanation: "ゲートウェイ型のVPCエンドポイントを作成すると、指定したルートテーブルへ、対象サービスのプレフィックスリストを宛先とするルートが自動的に追加されます。"

  - question: "インターフェイス型VPCエンドポイントの課金について正しい説明はどれか。"
    choices:
      - "ゲートウェイ型と同様に完全に無料である"
      - "ENI経由の通信となり、時間課金とデータ処理課金の両方が発生する"
      - "作成時の一度きりの課金のみ発生する"
      - "S3への通信にだけ課金される"
    answerIndex: 1
    explanation: "インターフェイス型はENI経由でトラフィックを転送する仕組みで、時間課金とデータ処理課金の両方が発生する、有料のコンポーネントです。"

  - question: "「VPCエンドポイントを使えば必ず無料になる」という考え方について正しい説明はどれか。"
    choices:
      - "正しい。すべてのVPCエンドポイントは無料である"
      - "誤り。無料なのはS3・DynamoDB向けのゲートウェイ型だけで、それ以外のインターフェイス型は有料である"
      - "正しいが、S3だけは例外的に有料である"
      - "誤り。すべてのVPCエンドポイントは有料である"
    answerIndex: 1
    explanation: "対象サービスによって課金体系がまったく異なり、無料なのはゲートウェイ型(S3・DynamoDB)だけです。"

  - question: "コスト最適化の実務における正しい考え方はどれか。"
    choices:
      - "とにかくすべての通信をVPCエンドポイント化する"
      - "通信量とサービスの種類を見て、費用対効果を判断する"
      - "NATゲートウェイを一切使わないようにする"
      - "VPCエンドポイントは使わずNATゲートウェイだけに統一する"
    answerIndex: 1
    explanation: "コスト最適化は、通信量とサービスの種類を見て費用対効果を判断する仕事であり、無条件にすべてをエンドポイント化することではありません。"
