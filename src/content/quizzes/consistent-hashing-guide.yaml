questions:
  - question: "`hash(キー) % サーバー台数`という単純な方式の、致命的な弱点として正しいのはどれか。"
    choices:
      - "計算処理が重すぎて、実用にならない"
      - "サーバーが1台増減するだけで、ほとんどすべてのキーの割り当て先が変わってしまう"
      - "同じサーバーには、常に同じキーしか割り当てられない"
      - "暗号化されていないため、盗聴されるリスクがある"
    answerIndex: 1
    explanation: "単純な剰余演算によるハッシュ方式では、サーバーの台数が1台増減するだけで、ほとんどすべてのキーの割り当て先サーバーが変わってしまいます。"

  - question: "コンシステントハッシュが、キーの割り当て先を決める規則として正しいのはどれか。"
    choices:
      - "キーの値を、サーバー台数で割った余り"
      - "そのキーの位置から、リングを時計回りに進んで、最初に出会うサーバー"
      - "常にリング上で最も負荷の低いサーバー"
      - "ランダムに選ばれたサーバー"
    answerIndex: 1
    explanation: "コンシステントハッシュでは、あるキーがどのサーバーに割り当てられるかは、そのキーの位置からリングを時計回りに進んで最初に出会うサーバーという規則で決まります。"

  - question: "サーバーが1台追加されたとき、コンシステントハッシュで移動するキーの範囲として正しいのはどれか。"
    choices:
      - "すべてのキーが、必ず移動する"
      - "新しいサーバーの前後に位置していたキーだけが、隣のサーバーへ移動する"
      - "1つのキーも移動しない"
      - "ランダムに選ばれた半数のキーが移動する"
    answerIndex: 1
    explanation: "サーバーが追加・削除されると、そのサーバーの前後に位置していたキーだけが隣のサーバーへ移動し、リング上の他の位置にあるキーは影響を受けません。"

  - question: "仮想ノードの役割として正しいのはどれか。"
    choices:
      - "暗号化の強度を高める"
      - "物理サーバーが少ないときに生じる、リング上の配置の偏りを解消する"
      - "サーバー間の通信を暗号化する"
      - "ヘルスチェックの頻度を増やす"
    answerIndex: 1
    explanation: "仮想ノードは、1台の物理サーバーをリング上の複数の位置に繰り返し配置することで、物理サーバーが少ないときに生じる負荷の偏りを解消します。"

  - question: "コンシステントハッシュが広く採用されているシステムとして正しいのはどれか。"
    choices:
      - "Memcached・Amazon DynamoDB・Apache Cassandra・Redis Cluster"
      - "DNSサーバーのみ"
      - "Webブラウザのキャッシュ機能のみ"
      - "印刷スプーラーのみ"
    answerIndex: 0
    explanation: "コンシステントハッシュは、Memcachedのクライアントライブラリ、Amazon DynamoDB、Apache Cassandra、Redis Clusterといった、分散キャッシュや分散データベースで広く採用されています。"
