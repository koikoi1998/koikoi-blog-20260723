questions:
  - question: "BINDの設定が分かれている2つのファイルについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "named.confとゾーンファイルという2つに分かれており、named.confはサーバー全体の動作設定、ゾーンファイルは個々のドメインの実際のレコードを記述する"
      - "BINDの設定はすべて1つの巨大なファイルにまとめて記述する仕様になっている"
      - "named.confはゾーンファイルの内容を暗号化するための鍵ファイルである"
      - "ゾーンファイルは、named.confとは無関係に独立して動作するため、named.confへの登録は不要である"
    answerIndex: 0
    explanation: "BINDの設定は、サーバー全体の動作(どのゾーンを管理するか等)を定義するnamed.confと、個々のドメインごとの実際のレコードを記述するゾーンファイルという、2つのファイルに分かれています。"

  - question: "SOAレコードのシリアル番号を上げ忘れた場合に起きることについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "シリアル番号を上げ忘れても、ゾーン転送には一切影響しない"
      - "スレーブサーバーが「シリアル番号が変わっていない=更新はない」と判断し、実際にレコードを変更していてもゾーン転送が発生しない"
      - "シリアル番号を上げ忘れると、BINDのサービス自体が自動的に停止する"
      - "シリアル番号は、ゾーンファイルを保存した瞬間に自動的にインクリメントされる"
    answerIndex: 1
    explanation: "シリアル番号はゾーンファイルを編集しただけでは自動的には増えず、管理者が手動で増やす必要があります。上げ忘れると、スレーブサーバーは「更新はない」と判断し、ゾーン転送が発生しません。"

  - question: "マスター/スレーブ構成におけるゾーン転送の判定方法について、記事の説明に最も合致するものはどれか。"
    choices:
      - "スレーブは、マスターのシリアル番号が自分の持つ値より大きければゾーン転送を要求し、そうでなければ何もしない"
      - "スレーブは、常に一定時間ごとに無条件でゾーン全体を再取得する"
      - "ゾーン転送は、管理者が手動でコマンドを実行しない限り絶対に発生しない"
      - "マスターとスレーブは、互いのシリアル番号を比較する仕組みを持たない"
    answerIndex: 0
    explanation: "スレーブサーバーはリフレッシュ間隔ごとにマスターへ現在のシリアル番号を問い合わせ、マスター側のシリアル番号が自分の持つ値より大きければゾーン転送を要求します。この設計は、GPOのバージョン番号を基準にした複製判定と発想が同じです。"

  - question: "権威サーバーとキャッシュサーバー(再帰リゾルバ)を分離すべき理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "分離する技術的な理由は特になく、単なる慣習にすぎない"
      - "再帰機能を誰でも自由に使えるオープンリゾルバのまま公開すると、DNS増幅攻撃の踏み台として悪用されるリスクがあるため"
      - "権威サーバーと再帰リゾルバは、同じサーバー上で動作させることが技術的に不可能であるため"
      - "分離することで、DNSの名前解決速度が常に2倍以上速くなるため"
    answerIndex: 1
    explanation: "再帰(キャッシュ)機能をオープンリゾルバのまま公開すると、DNS増幅攻撃という、第三者へのDDoS攻撃の踏み台として悪用されるリスクがあります。権威サーバーは公開せざるを得ませんが、再帰機能は信頼できる内部クライアントだけに限定するのが定石です。"

  - question: "BINDとWindows DNSサーバーの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "BINDとWindows DNSサーバーは、同じDNSプロトコル仕様を別々のソフトウェアとして実装したものであり、標準化されたゾーン転送を介して異なる実装同士でも連携できる"
      - "BINDとWindows DNSサーバーは、まったく異なるプロトコルを使用しており、相互に連携することは技術的に不可能である"
      - "Windows DNSサーバーは、BINDのソースコードをそのまま流用して作られている"
      - "BINDはWindows専用のソフトウェアであり、Linux上では動作しない"
    answerIndex: 0
    explanation: "BINDとWindows DNSサーバーは、同じDNSプロトコル仕様を別々のソフトウェアとして実装したものにすぎません。そのため、標準化されたプロトコルに従っている限り、異なる実装同士でのゾーン転送も技術的に成立します。"
