questions:
  - question: "プロセス・スレッド・タスクの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "3つはすべて完全に同一の概念であり、単に呼び方が異なるだけである"
      - "タスクはユーザー視点での仕事の単位、プロセスはOSが管理するリソースの単位、スレッドはプロセス内で実行される処理の最小単位という、階層関係にある異なる概念である"
      - "スレッドはプロセスより大きな概念であり、1つのスレッドが複数のプロセスを含む"
      - "タスクはCPUのハードウェア部品の名称である"
    answerIndex: 1
    explanation: "タスクはユーザーから見た「1つの仕事・作業」を指す概念、プロセスはOSが実行中のプログラムに割り当てる独立したメモリ空間とリソースの管理単位、スレッドはそのプロセスの中で実行される処理の最小単位です。これらは階層関係にある異なる概念です。"

  - question: "ゾンビプロセスという用語の由来と、その本来の意味について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Unix系OSのプロセスモデルに由来し、子プロセスの実際の処理は既に終了しているが、親プロセスがその終了ステータスをまだ受け取っていないために管理情報だけが残り続けている状態を指す"
      - "ゾンビプロセスは、コンピューターウイルスの一種を指す専門用語である"
      - "ゾンビプロセスは、CPUの温度が異常に高くなった状態を指す用語である"
      - "ゾンビプロセスという用語は、Windows社内で独自に定義された商標である"
    answerIndex: 0
    explanation: "ゾンビプロセスという用語は、Unix系OSのプロセスモデルに由来する概念です。子プロセスの実際の処理(実行コード・メモリの大部分)は既に解放されているものの、親プロセスがwait()という操作でその終了ステータスを受け取るまで、プロセステーブルのエントリだけが残り続ける状態を指します。"

  - question: "GoogleDriveがエクスプローラー上に表示されなくなり、タスクマネージャでプロセスを終了させると直る現象について、記事の説明に最も合致するものはどれか。"
    choices:
      - "何らかの理由でメインの表示・応答処理が異常終了・ハングしても、プロセス自体がすぐには完全に終了せず中途半端な状態のまま居座ってしまうことがあり、手動で終了させることでOSがリソースを正しく解放できる"
      - "GoogleDriveは、24時間ごとに必ず自動的にクラッシュする仕様になっている"
      - "タスクマネージャでプロセスを終了させると、GoogleDriveのアカウント自体が削除される"
      - "この現象は、Windowsのバージョンに関わらず絶対に発生しない"
    answerIndex: 0
    explanation: "クラウドストレージクライアントのようにバックグラウンドで動作するプログラムは、何らかの理由でメインの表示・応答処理が異常終了・ハングしても、プロセス自体がすぐには完全に終了せず中途半端な状態のまま居座ってしまうことがあります。タスクマネージャから手動で終了させることで、OSがリソースを正しく解放し、再起動後に正常な状態で立ち上がり直せます。"

  - question: "タスクマネージャでプロセスを終了させる対処について、記事が指摘する注意点として最も合致するものはどれか。"
    choices:
      - "プロセスを終了させれば、その状態を引き起こした根本原因(バグやデッドロックなど)自体も自動的に解決される"
      - "プロセスの終了は居座り続けているプロセスのリソースを強制的に回収させる対処であり、その状態を引き起こした根本原因自体は解決していないため、頻発する場合は根本原因の調査が必要である"
      - "プロセスを終了させると、そのPCのハードウェア構成が自動的に変更される"
      - "プロセスの終了は、Windowsのライセンス認証を無効化する操作である"
    answerIndex: 1
    explanation: "タスクマネージャでの終了は、あくまで居座り続けているプロセスのリソースをOSに強制的に回収させる対処であり、その状態を引き起こした根本原因(バグやデッドロックなど)自体は解決していません。頻発する場合は、アプリケーションの更新やログの確認など、根本原因の調査が必要です。"

  - question: "モニターの配置設定がケーブルを挿すだけで復元される仕組みについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "モニターがEDID(固有の識別情報)を接続時にPC側へ伝え、Windowsがその情報(特にシリアル番号や型番)をもとに以前接続したモニターを識別し、レジストリに保存された設定を復元している"
      - "すべてのモニターは工場出荷時から同一の設定を共有しているため、設定を復元する必要が元々ない"
      - "モニターの配置設定は、HDMIケーブル自体に物理的に記憶されている"
      - "モニターの配置設定は、インターネット経由でMicrosoftのサーバーに毎回問い合わせて取得している"
    answerIndex: 0
    explanation: "モニターはEDID(Extended Display Identification Data)という固有の識別情報(製造元、型番、シリアル番号など)を接続時にPC側へ伝えます。Windowsはこの情報をもとに以前接続したことのあるモニターを識別し、レジストリに保存された配置・解像度・向きなどの設定を復元します。"
