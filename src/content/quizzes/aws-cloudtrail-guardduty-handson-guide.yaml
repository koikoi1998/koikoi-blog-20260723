questions:
  - question: "CloudTrailの役割として正しい説明はどれか。"
    choices:
      - "異常を分析して通知する検知サービスである"
      - "あらゆるAPI呼び出しを、判断を加えずにひたすら記録するログサービスである"
      - "不正アクセスを自動的にブロックするファイアウォールである"
      - "IAMポリシーを自動生成するサービスである"
    answerIndex: 1
    explanation: "CloudTrailは判断を加えず、あらゆるAPI呼び出しをひたすら記録し続けるログサービスです。"

  - question: "GuardDutyの役割として正しい説明はどれか。"
    choices:
      - "ログを記録するだけのサービスである"
      - "CloudTrailなどのログを分析し、異常を判断したうえで通知するサービスである"
      - "IAMユーザーのパスワードを自動的に強化するサービスである"
      - "S3バケットのバックアップを自動的に取得するサービスである"
    answerIndex: 1
    explanation: "GuardDutyは、CloudTrailのログなどを機械学習や脅威インテリジェンスと突き合わせて分析し、異常を判断したうえで通知するサービスです。"

  - question: "GuardDutyの検知結果とCloudTrailログを組み合わせる理由は何か。"
    choices:
      - "GuardDutyだけでは検知結果の重要度が分からないため"
      - "GuardDutyが『何かがおかしい』ことを教える一方、詳細な調査にはCloudTrailログの送信元IPやリクエストパラメータが必要なため"
      - "CloudTrailを有効化しないとGuardDutyが起動しないため"
      - "コストを削減するため"
    answerIndex: 1
    explanation: "GuardDutyは異常の検知を担い、CloudTrailログはその後の詳細な事後調査に必要な生のエビデンスを提供します。両方が揃って初めて実務で機能します。"

  - question: "CloudTrailログの長期保存が重要である理由は何か。"
    choices:
      - "ログを長期保存するとGuardDutyの検知精度が上がるため"
      - "検知時点で既に時間が経過していることが多く、ログが削除・上書きされていると事後調査が不可能になるため"
      - "AWSの規約でログの保存が義務付けられているため"
      - "長期保存するとストレージコストが必ず下がるため"
    answerIndex: 1
    explanation: "GuardDutyが検知した時点で既にインシデントから時間が経過していることが多く、調査に必要なログが失われていると事後調査ができなくなります。"

  - question: "GuardDutyを有効化した直後の検知精度について正しい説明はどれか。"
    choices:
      - "有効化した瞬間から完璧な精度で検知できる"
      - "通常の利用パターンを学習する期間が必要なため、有効化直後は検知精度が低いことがある"
      - "有効化直後は一切検知を行わない"
      - "検知精度は時間が経つにつれて低下していく"
    answerIndex: 1
    explanation: "GuardDutyはベースラインとなる通常の利用パターンを学習する必要があるため、有効化直後は検知精度が低いことがあります。"
