questions:
  - question: "独立した2つのフォレスト間の信頼関係と、同一フォレスト内のドメイン間の信頼関係の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "同一フォレスト内のドメイン間の信頼関係は自動的に発生するが、独立した2つのフォレスト間の信頼関係(フォレストトラスト)は、管理者が`netdom trust`のようなコマンドで明示的に構築しない限り絶対に発生しない"
      - "どちらの信頼関係も、管理者が何もしなくても自動的に発生する"
      - "独立したフォレスト間の信頼関係の方が、同一フォレスト内の信頼関係よりも自動的に発生しやすい"
      - "フォレストが異なる場合、技術的に信頼関係を構築すること自体が不可能である"
    answerIndex: 0
    explanation: "同一フォレスト内のドメイン同士(親子・ツリールート間)は自動的に信頼関係が結ばれますが、独立したフォレスト同士のフォレストトラストは、netdom trustのようなコマンドで管理者が明示的に構築しない限り、絶対に自動発生しません。"

  - question: "フォレストトラストを構築する前に確立しておく必要がある前提について、記事の説明に最も合致するものはどれか。"
    choices:
      - "双方のDCが、条件付きフォワーダーなどを使って互いのドメイン名を名前解決できる状態にしておく必要がある"
      - "両方のフォレストのタイムゾーンを完全に一致させておく必要がある"
      - "両方のフォレストのAD DSのスキーマを事前に完全に同一にしておく必要がある"
      - "特に前提条件はなく、いきなりnetdom trustコマンドを実行すればよい"
    answerIndex: 0
    explanation: "フォレストトラストを構築する前に、双方のDCが条件付きフォワーダーなどを使って互いのドメイン名を名前解決できる状態にしておく必要があります。名前解決に失敗していると、トラストの構築自体が失敗します。"

  - question: "フォレストトラストが解決する問題と、解決しない問題について、記事の説明に最も合致するものはどれか。"
    choices:
      - "フォレストトラストを構築すれば、ユーザーアカウントの重複や最終的なフォレスト統合まで含めて、すべて自動的に解決する"
      - "フォレストトラストが解決するのは認証・アクセス許可の連携までであり、ユーザーアカウントの重複解消や最終的な片方のフォレストの廃止には別の作業が必要である"
      - "フォレストトラストは、認証の連携すら実現できない、名目上の仕組みにすぎない"
      - "フォレストトラストを構築すると、両方のフォレストのユーザーアカウントが自動的に1つに統合される"
    answerIndex: 1
    explanation: "フォレストトラストが解決するのは認証・アクセス許可の連携だけです。ユーザーアカウントの重複解消や、最終的な片方のフォレストの廃止には、まったく別の作業(場合によっては専用の移行ツール)が必要です。"

  - question: "ADMT(Active Directory Migration Tool)の現在地について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ADMTは現在も活発に開発が続けられており、最新のWindows Serverバージョンで問題なく動作することが公式に検証されている"
      - "ADMTの開発は既に停止しており、公式サポートポリシー上もWindows Server 2012 R2までが動作確認の対象で、最新バージョンでの動作は検証されていない"
      - "ADMTは、SQL Serverなど追加のソフトウェアを一切必要とせず、単体で完結するツールである"
      - "ADMTは、フォレストトラストの構築そのものを行うためのツールである"
    answerIndex: 1
    explanation: "ADMTの開発は既に停止しており、Microsoft公式のサポートポリシーでもWindows Server 2012 R2までが動作確認の対象です。最新のWindows Server 2025のような環境での動作は検証されておらず、記事ではこの環境で実際にADMTを動かすことは推奨していません。"

  - question: "SIDフィルタリングについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "フォレストトラストに既定で有効になっている保護機能で、信頼された側のフォレストが強力な権限を持つSIDを偽装して主張しても、信頼する側がそれを無条件に信じないようにする仕組みである"
      - "SIDフィルタリングは、DNSの名前解決を高速化するための機能である"
      - "SIDフィルタリングは、既定で無効になっており、手動で有効化しない限り一切機能しない"
      - "SIDフィルタリングは、ユーザーのパスワードを暗号化するための機能である"
    answerIndex: 0
    explanation: "SIDフィルタリングは、フォレストトラストに既定で有効になっているセキュリティ機能で、信頼された側のフォレストが悪意を持ってSIDを偽装して主張してきても、信頼する側のフォレストがそれを無条件に信じてしまわないようにする仕組みです。"
