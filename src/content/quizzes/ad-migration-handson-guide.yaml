questions:
  - question: "安全なAD移行の大原則について、記事の説明に最も合致するものはどれか。"
    choices:
      - "旧DCを先に落としてから、新DCへFSMOをシージ(強制委譲)するのが標準的な手順である"
      - "現在の役割保持者(旧DC)がまだ正常に稼働している状態で、FSMOを転送(シージではなく)することが安全な移行の大原則である"
      - "FSMO転送は、レプリケーションの健全性を確認せずに、なるべく早く実施すべきである"
      - "新DCを追加したら、すぐに旧DCを降格させ、FSMO転送は降格後に行うべきである"
    answerIndex: 1
    explanation: "安全なAD移行の大原則は、現在の役割保持者(旧DC)がまだ正常に稼働している状態でFSMOを転送(Transfer)することです。旧DCを先に落としてしまうと、シージという緊急手段に頼らざるを得なくなります。"

  - question: "FSMO転送を実施する前に確認すべきこととして、記事の説明に最も合致するものはどれか。"
    choices:
      - "特に何も確認する必要はなく、新DCを構築したらすぐにFSMO転送してよい"
      - "repadmin /showreplで、新旧DC間のレプリケーションが正常に成立しているかを必ず確認する"
      - "新DCのディスク容量が旧DCより大きいことだけを確認すればよい"
      - "新DCのOSバージョンが旧DCと完全に一致していることを確認する"
    answerIndex: 1
    explanation: "FSMO転送を進める前に、repadmin /showreplで新旧DC間のレプリケーションが正常に成立しているかを必ず確認する必要があります。このレプリケーションが健全であることを確認するまで、次のFSMO転送には進むべきではありません。"

  - question: "Uninstall-ADDSDomainControllerに-DemoteOperationMasterRoleオプションを付ける理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "降格処理を高速化するためのオプションであり、それ以外の意味はない"
      - "万が一そのDCがまだFSMOロールを保持していた場合に、自動的に他のDCへ転送してから降格するという安全策を働かせるため"
      - "このオプションを付けないと、降格処理自体が実行できない"
      - "DNSサーバーの役割を同時に削除するためのオプションである"
    answerIndex: 1
    explanation: "-DemoteOperationMasterRoleを付けておくと、万が一そのDCがまだFSMOを保持していた場合に、自動的に他のDCへ転送してから降格するという安全策が働きます。今回のハンズオンではStep 3で既に転送済みのため、通常は何も転送されません。"

  - question: "降格後のクリーンアップ確認について、記事の説明に最も合致するものはどれか。"
    choices:
      - "グレースフルな降格であっても、4つのコンソール(dsa.msc・dssite.msc・adsiedit.msc・dnsmgmt.msc)すべてを毎回手動で確認しなければ、絶対に情報は消えない"
      - "正常な(グレースフルな)降格であれば、これらの多くは自動的にクリーンアップされるが、最終確認としてdsa.msc・dssite.msc・dnsmgmt.msc・repadmin /replsummaryでの確認を省略すべきではない"
      - "降格処理はクリーンアップを一切行わないため、常に手動ですべて削除する必要がある"
      - "adsiedit.mscでの手動削除が、降格後クリーンアップの標準的な最初の手段である"
    answerIndex: 1
    explanation: "正常な(グレースフルな)降格であれば、多くのクリーンアップは自動的に行われます。ただし、最終確認としてdsa.msc・dssite.msc・dnsmgmt.msc・repadmin /replsummaryでの確認は省略すべきではなく、adsiedit.mscでの手動削除は、それでも異常が見つかった場合の最終手段です。"

  - question: "dcdiag /vであえてDNSレコードを削除する演習の目的について、記事の説明に最も合致するものはどれか。"
    choices:
      - "dcdiagコマンド自体の実行速度を測定するため"
      - "エラーが出たという事実だけでなく、出力された具体的な情報からどの仕組みが壊れているのかを逆算できるようになるため"
      - "DNSサーバーの役割を完全に削除する練習をするため"
      - "この演習は本番環境でも安全に実施できることを確認するため"
    answerIndex: 1
    explanation: "この演習のポイントは、「エラーが出た」という事実だけでなく、出力された具体的な情報からどの仕組みが壊れているのかを逆算できるようになることです。これは実務で本物の障害に遭遇したときに、根拠を持って対処できるかどうかを分ける重要なスキルです。なお、この演習は検証用の使い捨て環境でのみ実施すべきです。"
