questions:
  - question: "このハンズオンで、各バックエンドサーバーが自分自身の名前を含むレスポンスを返すようにしている理由として正しいのはどれか。"
    choices:
      - "HAProxyの起動に必須の設定であるため"
      - "どちらのバックエンドが応答したかを、レスポンスの内容だけで一目で判別できるようにするため"
      - "ヘルスチェックの判定基準として使われるため"
      - "TLS証明書の検証に必要なため"
    answerIndex: 1
    explanation: "レスポンスに自分自身の名前を含めることで、どちらのバックエンドが応答したかを一目で判別できるようにしています。"

  - question: "HAProxyの設定で`option httpchk`が担っている役割として正しいのはどれか。"
    choices:
      - "ラウンドロビンアルゴリズムを有効にする"
      - "アクティブヘルスチェックを設定し、各サーバーへHTTPリクエストを送って応答を確認する"
      - "SSLターミネーションを有効にする"
      - "バックエンドサーバーの台数を自動的に増減させる"
    answerIndex: 1
    explanation: "option httpchkは、各サーバーへHTTP GETリクエストを送り、ステータスコードを確認するアクティブヘルスチェックの設定です。"

  - question: "balanceディレクティブを省略した場合のHAProxyの挙動として正しいのはどれか。"
    choices:
      - "振り分けが一切行われなくなる"
      - "デフォルトでラウンドロビンが使われる"
      - "デフォルトで最小接続数が使われる"
      - "HAProxyの起動自体が失敗する"
    answerIndex: 1
    explanation: "balanceディレクティブを省略すると、HAProxyはデフォルトでラウンドロビンを使用します。"

  - question: "バックエンド1台を停止した後、クライアントからのリクエストに何が起きたか。"
    choices:
      - "すべてのリクエストがエラーになった"
      - "エラーにはならず、正常なバックエンドへすべてのリクエストが振り分けられた"
      - "HAProxy自体が停止した"
      - "ラウンドロビンから最小接続数へ自動的に切り替わった"
    answerIndex: 1
    explanation: "ヘルスチェックが異常なバックエンドを自動的に切り離すため、クライアントにはエラーが見えず、正常なバックエンドへすべて振り分けられました。"

  - question: "このハンズオンが示す、ヘルスチェックの本質的な価値として正しいのはどれか。"
    choices:
      - "ロードバランサー自体の処理速度を向上させること"
      - "障害が起きてもサービスが継続するという結果の裏側で、異常なサーバーを自動的に検知・除外していること"
      - "TLS証明書の更新を自動化すること"
      - "DNSラウンドロビンを置き換えること"
    answerIndex: 1
    explanation: "ヘルスチェックが機能していない構成では、停止したバックエンドへそのままリクエストが送られ、クライアントにエラーが返ってしまいます。"
