questions:
  - question: "制約なし委任が許可されたサーバーへ、ユーザーがアクセスした際に、裏側で起きていることとして正しいのはどれか。"
    choices:
      - "何も特別なことは起きず、通常のサービスチケットだけが提示される"
      - "KDCが、クライアントの完全なTGTそのものを、サービスチケットに同梱してサーバーへ送り届ける"
      - "ユーザーのパスワードが、平文でサーバーへ送信される"
      - "サーバー側が、ユーザーのパスワードを再設定する"
    answerIndex: 1
    explanation: "制約なし委任が許可されたサーバーへアクセスすると、KDCはクライアントの完全なTGTをサービスチケットに同梱してサーバーへ送り届けます。"

  - question: "制約なし委任と制約付き委任の、本質的な違いとして正しいのはどれか。"
    choices:
      - "委任できる範囲の広さが違うだけで、仕組みそのものは同じである"
      - "制約なし委任は、クライアントの完全なTGTそのものをサーバーへ送るという、構造的にまったく異なる、より危険な仕組みである"
      - "制約付き委任の方が、より新しく危険な仕組みである"
      - "両者に違いはなく、呼び方だけが異なる"
    answerIndex: 1
    explanation: "制約なし委任は、クライアントの完全なTGTそのものをサーバーへ送るという、構造的にまったく異なる、より危険な仕組みです。"

  - question: "`AccountNotDelegated`フラグが、実際に防いでいることとして正しいのはどれか。"
    choices:
      - "そのアカウントが、一切のKerberos認証を行えなくなる"
      - "そのアカウントのTGTが、委任先のサーバーへ渡されることを、KDCが拒否する"
      - "そのアカウントのパスワードが、自動的に変更される"
      - "そのアカウントが、ドメインからログオフされる"
    answerIndex: 1
    explanation: "AccountNotDelegatedフラグは、そのアカウントのTGTが委任先のサーバーへ渡されることを、KDCが拒否するようにする設定です。"

  - question: "制約なし委任が許可された、一見普通のサーバー1台が持つ、実務上のリスクとして正しいのはどれか。"
    choices:
      - "そのサーバーのディスク容量が、通常より多く必要になる"
      - "そのサーバーが侵害された場合、メモリ上に残ったTGTを使って、Domain Adminsとしてドメイン内のあらゆるリソースへアクセスされる可能性がある"
      - "そのサーバーのネットワーク速度が、常に低下する"
      - "そのサーバーは、Kerberos認証を一切使用できなくなる"
    answerIndex: 1
    explanation: "制約なし委任が許可されたサーバーが侵害されると、メモリ上に残ったTGTを使って、Domain Adminsとしてドメイン内のあらゆるリソースへアクセスされる危険性があります。"

  - question: "ドメイン内のコンピューターオブジェクトを棚卸しする際、上位1%のエンジニアが最優先の調査対象として扱うものはどれか。"
    choices:
      - "最もディスク容量が大きいサーバー"
      - "`TrustedForDelegation`が`True`になっているサーバー"
      - "最も古いOSバージョンが動いているサーバー"
      - "最もコンピューター名が長いサーバー"
    answerIndex: 1
    explanation: "制約なし委任が許可された(TrustedForDelegationがTrueの)サーバーは、Domain Admins昇格への踏み台になり得るため、最優先の調査対象として扱われます。"
