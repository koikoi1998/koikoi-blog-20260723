questions:
  - question: "DSR(Direct Server Return)の核心的な仕組みとして正しいのはどれか。"
    choices:
      - "ロードバランサーが、宛先IPアドレスとポート番号の両方を書き換えて転送する"
      - "ロードバランサーが、宛先IPアドレスは変えず、宛先MACアドレスだけを書き換えて転送する"
      - "ロードバランサーが、応答パケットをキャッシュして再送する"
      - "ロードバランサーが、TLSの復号を行ってから転送する"
    answerIndex: 1
    explanation: "DSRは、宛先IPアドレス(VIP)を一切書き換えず、宛先MACアドレスだけを書き換えて転送することで成立します。"

  - question: "DSRが、異なるサブネットにあるバックエンドサーバーでは使用できない理由として正しいのはどれか。"
    choices:
      - "異なるサブネットでは暗号化通信ができないため"
      - "MACアドレスの書き換えだけで転送するため、同一L2ネットワーク内に限られるため"
      - "異なるサブネットではヘルスチェックが機能しないため"
      - "DNSの設定が複雑になるため"
    answerIndex: 1
    explanation: "DSRは宛先MACアドレスの書き換えだけで転送するため、ロードバランサーとバックエンドサーバーが同一L2ネットワーク内にある場合に限られます。"

  - question: "バックエンドサーバー側で`arp_ignore`を設定しない場合に起きる問題として正しいのはどれか。"
    choices:
      - "バックエンドサーバーがVIP宛のパケットを一切受信できなくなる"
      - "バックエンドサーバー自身がVIPのARPに応答してしまい、クライアントからのリクエストがロードバランサーを経由せず直接届いてしまう"
      - "ロードバランサーが起動しなくなる"
      - "応答パケットの送信元IPアドレスが変化してしまう"
    answerIndex: 1
    explanation: "arp_ignoreを設定しないと、バックエンドサーバー自身もVIPのARPに応答してしまい、ロードバランシングが機能しなくなります。"

  - question: "DSR構成において、応答パケットの送信元IPアドレスとして正しいのはどれか。"
    choices:
      - "バックエンドサーバーの実際のIPアドレス"
      - "VIP(ロードバランサーが公開する仮想IPアドレス)"
      - "ロードバランサーのIPアドレス"
      - "クライアントのIPアドレス"
    answerIndex: 1
    explanation: "DSRでは、応答の送信元IPアドレスはVIPのまま保たれるため、クライアント側には通常のロードバランサーと同じに見えます。"

  - question: "DSRが、動画配信のような応答データ量が大きいサービスで好まれる理由として正しいのはどれか。"
    choices:
      - "リクエストの処理速度が常に向上するため"
      - "応答の帯域をロードバランサーから完全に切り離し、ロードバランサー自体の帯域ボトルネックを解消できるため"
      - "TLS証明書の管理が不要になるため"
      - "DNSのTTLに依存しないフェイルオーバーができるため"
    answerIndex: 1
    explanation: "DSRは応答の帯域をロードバランサーから切り離すため、応答データ量がリクエストよりはるかに大きいサービスで、帯域の非対称性への構造的に正しい対処になります。"
