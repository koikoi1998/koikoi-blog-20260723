questions:
  - question: "SSLターミネーションの説明として正しいのはどれか。"
    choices:
      - "ロードバランサーがTLSの内容を一切復号せず、暗号化されたまま中継する"
      - "ロードバランサーがクライアントとのTLS接続を終端(復号)し、バックエンドへは平文のHTTPで中継する"
      - "バックエンドサーバー自身がTLSの復号を行い、ロードバランサーは中身を見ない"
      - "クライアントとバックエンドサーバーが直接TLS接続を確立する"
    answerIndex: 1
    explanation: "SSLターミネーションは、ロードバランサーでTLSを終端・復号し、バックエンドとの間は平文のHTTPで中継する方式です。"

  - question: "SSLパススルーのデメリットとして正しいのはどれか。"
    choices:
      - "証明書をロードバランサー1台にだけ配置すればよくなる"
      - "ロードバランサーがHTTPの内容を読めないため、URLパスに応じたL7振り分けが使えない"
      - "バックエンドまでの経路の暗号化が維持できなくなる"
      - "クライアントとの通信が暗号化されなくなる"
    answerIndex: 1
    explanation: "SSLパススルーでは、ロードバランサーがTLSの内容を復号しないため、HTTPの内容に基づくL7振り分けが使えません。"

  - question: "SSLパススルーでも、ホスト名による振り分けができる理由として正しいのはどれか。"
    choices:
      - "ロードバランサーがTLSの内容をすべて復号しているため"
      - "ClientHelloに含まれるSNI情報が、暗号化前の平文のまま見えるため"
      - "バックエンドサーバーが振り分け結果をロードバランサーへ通知するため"
      - "DNSサーバーがホスト名ごとに異なるロードバランサーを割り当てているため"
    answerIndex: 1
    explanation: "SNI情報はTLSハンドシェイクの最初のメッセージに平文で含まれているため、復号せずにホスト名ベースの振り分けが可能です。"

  - question: "SSLブリッジングの特徴として正しいのはどれか。"
    choices:
      - "ロードバランサーとバックエンドサーバーの両方に証明書管理が必要で、構成が最も複雑になる"
      - "証明書管理が不要になる、最も簡単な方式である"
      - "ロードバランサーがHTTPの内容を一切読めない"
      - "バックエンドまでの経路が必ず平文になる"
    answerIndex: 0
    explanation: "SSLブリッジングは、ロードバランサーとバックエンドの両方に証明書が必要で、3方式の中で最も構成が複雑になります。"

  - question: "SSLターミネーションが実務で最も多く採用される理由として正しいのはどれか。"
    choices:
      - "唯一、暗号化に対応した方式であるため"
      - "証明書管理の手間を1か所に集約できるメリットが、多くの環境でエンドツーエンド暗号化の要件を上回るため"
      - "SSLパススルーより常に安全であるため"
      - "L4ロードバランサーでしか使用できないため"
    answerIndex: 1
    explanation: "多数のバックエンドサーバーそれぞれに証明書を配置・更新する運用は現実的でないため、証明書管理を1か所に集約できるメリットが重視されます。"
