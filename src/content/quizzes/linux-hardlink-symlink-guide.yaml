questions:
  - question: "ファイル名の正体として正しいのはどれか。"
    choices:
      - "ファイルの実体そのものである"
      - "inode番号を指す、単なる『ラベル』(ディレクトリエントリ)である"
      - "ファイルシステム全体の設定情報である"
      - "カーネルが生成する一時的な識別子である"
    answerIndex: 1
    explanation: "ファイル名は、ファイルの実体そのものではなく、inode番号を指す単なる「ラベル」(ディレクトリエントリ)に過ぎません。"

  - question: "ハードリンクを作成した場合の、2つの名前の関係として正しいのはどれか。"
    choices:
      - "一方が『元の名前』で、もう一方が従属的な『リンク』である"
      - "どちらが元かという区別が存在せず、完全に等価な、同じファイルへの2つの入口である"
      - "片方を削除すると、もう片方も自動的に削除される"
      - "片方を変更すると、もう片方には反映されない"
    answerIndex: 1
    explanation: "ハードリンクによって作成された2つの名前は、どちらが「元」かという区別が存在せず、完全に等価な、同じinodeへの2つの入口です。"

  - question: "ファイルを削除(rm)したのにディスクの空き容量が増えない現象の、正しい原因として考えられるのはどれか。"
    choices:
      - "ディスクが物理的に故障している"
      - "そのファイルを開いたまま動作しているプロセスが存在し、リンクカウントが0になっていない"
      - "ファイルシステムのキャッシュが壊れている"
      - "ファイル名の文字数が長すぎる"
    answerIndex: 1
    explanation: "rmはディレクトリエントリを削除してリンクカウントを1減らすだけであり、そのファイルを開いたままのプロセスが存在する限り、リンクカウントは0にならず、データブロックは解放されません。"

  - question: "シンボリックリンクの正体として正しいのはどれか。"
    choices:
      - "既存のinodeに対する、もう1つの等価な名前"
      - "パス文字列だけを内容として持つ、独自のinodeを持つ独立したファイル"
      - "ハードリンクの別名に過ぎない"
      - "ファイルシステムの設定ファイルの一種"
    answerIndex: 1
    explanation: "シンボリックリンクは、それ自身が独自のinodeを持つ、完全に独立した1つのファイルであり、内容はリンク先のパスを表す文字列です。"

  - question: "ハードリンクに存在する、シンボリックリンクにはない制約として正しいのはどれか。"
    choices:
      - "ハードリンクは、ファイルの内容を変更できない"
      - "ハードリンクは、同じファイルシステム内でしか作成できず、ディレクトリを指すこともできない"
      - "ハードリンクは、root権限がなければ作成できない"
      - "ハードリンクは、1つのファイルに対して1つしか作成できない"
    answerIndex: 1
    explanation: "ハードリンクは、inode番号が個々のファイルシステム内でのみ一意であるため、別のファイルシステムをまたいで作成できず、循環参照を避けるため多くの実装でディレクトリへのハードリンクも禁止されています。"
