questions:
  - question: "明示的プロキシと透過型プロキシの、最も本質的な違いとして正しいのはどれか。"
    choices:
      - "透過型プロキシは、キャッシュ機能を一切持たない"
      - "明示的プロキシはクライアント側でプロキシのアドレスを設定するが、透過型プロキシはクライアントに何も設定させず、通信を途中で横取りする"
      - "明示的プロキシは、HTTPSにしか対応していない"
      - "両者に技術的な違いはなく、呼び方だけが異なる"
    answerIndex: 1
    explanation: "明示的プロキシはクライアント側の設定が前提ですが、透過型プロキシはクライアントに気づかれずに通信を横取りします。"

  - question: "iptablesのREDIRECTターゲットが、実際に行っていることとして正しいのはどれか。"
    choices:
      - "パケットのペイロード(実際のデータ)を書き換える"
      - "パケットの宛先IPアドレスとポート番号だけを書き換える"
      - "パケットを暗号化する"
      - "パケットを複製して、2つの宛先へ送信する"
    answerIndex: 1
    explanation: "REDIRECTは、パケットの宛先IPアドレスとポート番号だけを書き換え、ペイロードは変更しません。"

  - question: "Squidのintercept modeが必要になる理由として正しいのはどれか。"
    choices:
      - "キャッシュ容量を増やすため"
      - "宛先を偽装された(実際にはWebサーバー宛だった)リクエストを、正しく中継できるようにするため"
      - "通信速度を高速化するため"
      - "ログの出力形式を変更するため"
    answerIndex: 1
    explanation: "intercept modeは、横取りされ宛先が偽装されたリクエストを、Squidが正しく処理できるようにするための設定です。"

  - question: "透過型プロキシが、HTTPS通信に対して原理的に抱える制約として正しいのはどれか。"
    choices:
      - "HTTPSは、そもそもTCP通信ではないため、扱えない"
      - "クライアントが宛先の証明書を検証するため、宛先を黙って書き換えると、証明書の検証に失敗する"
      - "HTTPSは、iptablesによるフィルタリングの対象外である"
      - "HTTPSは、常にUDPで通信されるため、REDIRECTが機能しない"
    answerIndex: 1
    explanation: "HTTPSでは、クライアントが接続先の証明書を検証するため、宛先を黙って書き換えると証明書検証が失敗し、通信が成立しません。"

  - question: "透過型プロキシの設計が、便利さと引き換えに抱えているトレードオフとして正しいのはどれか。"
    choices:
      - "導入コストが、常に明示的プロキシより高くなる"
      - "クライアントが、通信が横取りされていることを検証する手段を持たない"
      - "必ず専用のハードウェアが必要になる"
      - "キャッシュ機能が、常に無効化される"
    answerIndex: 1
    explanation: "「クライアントに気づかれない」という利点は、「クライアントが検証する手段を持たない」という信頼性のトレードオフと隣り合っています。"
