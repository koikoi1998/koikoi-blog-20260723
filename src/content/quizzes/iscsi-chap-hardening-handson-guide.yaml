questions:
  - question: "何も設定していないiSCSIターゲットに対して、イニシエーター側から認証情報なしでログインを試みた結果として正しいのはどれか。"
    choices:
      - "常にログインが拒否される"
      - "IQNさえ知っていれば、ログインに成功してしまう"
      - "サーバー側が自動的にパスワードを生成し、要求してくる"
      - "通信自体が暗号化されていないため、接続すらできない"
    answerIndex: 1
    explanation: "認証設定がない状態では、IQNを知っているだけで、誰でもログインに成功してしまいます。"

  - question: "IQNが、本人確認の手段として不十分である理由として正しいのはどれか。"
    choices:
      - "IQNは、定期的に自動で変更されるため"
      - "IQNは、ネットワークの通信内容を覗き見れば誰でも知ることができる、識別のための名前であり、秘密の認証情報ではないため"
      - "IQNは、暗号化された値であり、復号できないため"
      - "IQNは、iSCSIのバージョンによって意味が変わるため"
    answerIndex: 1
    explanation: "IQNは通信相手を識別するための名前であり、パスワードのような秘密の認証情報ではありません。"

  - question: "CHAP認証を設定した後、イニシエーター側で必要になる操作として正しいのはどれか。"
    choices:
      - "何も操作する必要はなく、自動的にログインできる"
      - "正しいユーザー名とパスワードを、イニシエーター側の設定に反映させる必要がある"
      - "イニシエーター側のIQNを変更する必要がある"
      - "ネットワークケーブルを再接続する必要がある"
    answerIndex: 1
    explanation: "CHAP認証が設定されたターゲットへログインするには、イニシエーター側に正しいユーザー名とパスワードを設定する必要があります。"

  - question: "CHAP認証が実現していることとして正しいのはどれか。"
    choices:
      - "ログイン後の、実際のデータ通信そのものを暗号化する"
      - "接続時に、正しいユーザー名とパスワードを提示した相手だけを、正当な接続として受け入れる"
      - "ネットワーク上のすべての通信を、自動的に暗号化する"
      - "IQNを、自動的に生成する"
    answerIndex: 1
    explanation: "CHAP認証は、接続時の本人確認の仕組みであり、ログイン後の実際のデータ通信そのものを暗号化するものではありません。"

  - question: "このハンズオンから得られる、機器導入における重要な視点として正しいのはどれか。"
    choices:
      - "機器のデフォルト設定は、常に安全性を最優先に設計されている"
      - "多くの機器のデフォルト設定は、まず動作させることを優先しており、安全に動作させるための設定は、利用者が追加する前提になっていることがある"
      - "認証設定は、一度行えば、その後は確認不要である"
      - "iSCSIは、デフォルトで暗号化通信を行う"
    answerIndex: 1
    explanation: "多くの機器のデフォルト設定は、まず動作させることを優先しており、利用者が明示的に防御を追加する必要があることが珍しくありません。"
