questions:
  - question: ".NET FrameworkとPowerShellの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - ".NET FrameworkとPowerShellは、同じものの別名であり、実質的に同一の技術である"
      - ".NET FrameworkはWindows上でアプリケーションを動かすための汎用的な実行基盤であり、PowerShellはその機能を利用して作られたシェル・スクリプト言語の1つである"
      - "PowerShellは.NET Frameworkより古い技術であり、.NET FrameworkはPowerShellの後継として開発された"
      - ".NET Frameworkは、PowerShellの実行専用に開発された、他の用途を持たない技術である"
    answerIndex: 1
    explanation: ".NET Frameworkは、Windows上でアプリケーションを動かすための実行エンジン(ランタイム)とクラスライブラリのセットであり、ASP.NETなど幅広い用途で使われています。PowerShellは、その機能を土台にして作られたシェル・スクリプト言語の1つにすぎません。"

  - question: "PowerShellのパイプラインが、bashのようなテキストベースのシェルと根本的に異なる点について、記事の説明に最も合致するものはどれか。"
    choices:
      - "PowerShellのパイプも、bashと同様に単なる文字列(テキスト)をコマンド間で受け渡す"
      - "PowerShellのパイプは、文字列に整形される前の、属性を持った.NETオブジェクトそのものをコマンド(cmdlet)間で受け渡す"
      - "PowerShellにはパイプという概念自体が存在しない"
      - "PowerShellのパイプは、ネットワーク経由でのみデータを受け渡す仕組みである"
    answerIndex: 1
    explanation: "bashのパイプは文字列を受け渡し、受け取る側が正規表現などで解析する必要があります。PowerShellのパイプは、文字列に整形される前の、属性を持った.NETオブジェクトそのものを受け渡すという、根本的に異なる設計を採用しています。"

  - question: "Windows PowerShell 5.1とPowerShell 7の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "両者はまったく同じ製品であり、名前が違うだけである"
      - "Windows PowerShell 5.1は従来の.NET Frameworkの上に構築され開発終了のフェーズにあるが、PowerShell 7は後継の.NETの上に構築されクロスプラットフォームな、現在の開発の主軸である"
      - "PowerShell 7をインストールすると、Windows PowerShell 5.1は自動的に削除され置き換わる"
      - "Windows PowerShell 5.1の方がPowerShell 7よりも新しく開発された、後継バージョンである"
    answerIndex: 1
    explanation: "Windows PowerShell 5.1は従来の.NET Frameworkの上に構築され、Windowsに標準搭載されていますが、開発は終了(現状維持)フェーズにあります。PowerShell 7は後継の.NET(旧.NET Core)の上に構築され、Windows・Linux・macOSで動くクロスプラットフォームな後継で、現在の開発の主軸です。"

  - question: "AD DSの役割追加時に.NET Framework 4.8の機能が一緒に有効化される理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "単なる偶然であり、技術的な関連性は特にない"
      - "AD DS関連の管理ツール・PowerShellモジュールの多くが、.NET Frameworkのクラスライブラリを動作基盤として利用しているため"
      - ".NET Framework 4.8は、AD DSの役割そのものの一部として開発された専用機能である"
      - "AD DSの役割を追加すると、自動的にPowerShell 7がインストールされるため"
    answerIndex: 1
    explanation: "AD DS関連の管理ツールやPowerShellモジュールの多くが、.NET Frameworkのクラスライブラリ(WCFサービスなど)を動作基盤として利用しているため、AD DSの役割を追加すると.NET Framework 4.8の機能が一緒に有効化されます。"

  - question: "PowerShellのトラブルシューティングで、上位1%のエンジニアが最初に確認することについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "ネットワークケーブルが正しく接続されているかを最初に確認する"
      - "`$PSVersionTable`を実行し、問題が発生している環境がWindows PowerShell 5.1系かPowerShell 7系かを確認する"
      - "まずディスクの空き容量を確認する"
      - "そのサーバーのドメイン参加状況を確認する"
    answerIndex: 1
    explanation: "同じスクリプトでも、動作しているのがWindows PowerShell 5.1(.NET Framework)かPowerShell 7(.NET)かによって挙動が微妙に異なることがあるため、`$PSVersionTable`でどちらの系統かを最初に確認することが、無関係な箇所を疑う無駄な調査を避けることにつながります。"
