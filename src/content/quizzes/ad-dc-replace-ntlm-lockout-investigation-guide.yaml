questions:
  - question: "RDP接続のポップアップで認証エラーが出なかったにもかかわらず、デスクトップ画面でログインが拒否された理由として正しいのはどれか。"
    choices:
      - "RDPのポップアップ認証と、Windows自身のログオン処理(Kerberos認証)は、別々のやり取りだから"
      - "RDPのポップアップは、常にすべての認証処理を完了させているから"
      - "ネットワークケーブルが抜けていたから"
      - "ディスク容量が不足していたから"
    answerIndex: 0
    explanation: "RDPのポップアップは接続開始のための認証であり、デスクトップへ遷移するためのWindows自身のログオン処理は、別の、より厳密な認証のやり取りです。"

  - question: "イベントID 4771・失敗コード`KDC_ERR_ETYPE_NOTSUPP`が示している内容として正しいのはどれか。"
    choices:
      - "ネットワーク接続そのものが失敗している"
      - "KDCが、クライアントから提示された暗号方式に対応する鍵を、このアカウントに対して持っていない"
      - "パスワードの文字数が多すぎる"
      - "DNSの名前解決が失敗している"
    answerIndex: 1
    explanation: "KDC_ERR_ETYPE_NOTSUPPは、KDCがクライアント提示の暗号方式(etype)に対応する鍵を、そのアカウントに対して持っていないことを示します。"

  - question: "AES・RC4のキーが、実際に計算されるタイミングとして正しいのはどれか。"
    choices:
      - "KDCサービスが起動した瞬間"
      - "パスワードが実際に設定・変更された、まさにそのタイミング"
      - "DCが再起動するたびに、自動的に再計算される"
      - "毎日深夜0時に、自動的に再計算される"
    answerIndex: 1
    explanation: "AES・RC4のキーは、パスワードが実際に設定された、まさにそのタイミングで計算されて保存されます。KDCサービスの起動状態とは直接の関係がありません。"

  - question: "最初の仮説(KDCサービスがまだ起動していなかったため、AESキーが作られなかった)について、この記事の調査が示した結論として正しいのはどれか。"
    choices:
      - "その仮説は、完全に正しいことが確認された"
      - "AES・RC4のキー計算は、パスワード変更処理のパイプラインによって行われ、KDCサービスの起動状態とは直接の関係がないことが分かった"
      - "KDCサービスは、Windowsには存在しないことが分かった"
      - "AESキーは、そもそも計算する必要がないことが分かった"
    answerIndex: 1
    explanation: "調査の結果、AES・RC4のキー計算はパスワード変更処理のパイプラインによって行われ、KDCサービスの起動状態とは直接関係がないことが分かりました。"

  - question: "まったく新しいフォレストを、WindowsServer 2025で新規構築する場合について、正しい理解はどれか。"
    choices:
      - "この場合も、必ず今回と同じ事象が発生する"
      - "Administratorのパスワードはフォレスト作成時にそのWindowsServer 2025上で設定されるため、通常この事象は発生しない"
      - "新規構築の場合は、Kerberos認証自体が使えない"
      - "新規構築の場合は、NTLMしか使用できない"
    answerIndex: 1
    explanation: "新規フォレストでは、Administratorのパスワードがフォレスト作成ウィザードの実行時にそのWindowsServer 2025上で設定されるため、AES・RC4両方のキーが計算され、通常この事象は発生しません。"
