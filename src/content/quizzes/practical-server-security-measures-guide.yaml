questions:
  - question: "「作業後にLANケーブルを抜く」対策が実際に防いでいるものについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "この対策には一切の効果がなく、完全に無意味である"
      - "切断されている時間帯については、C2通信や外部からの新規の攻撃の到達を、原理的に完全にゼロにするという明確な効果がある"
      - "この対策を行えば、接続している作業時間帯の脆弱性もすべて解消される"
      - "この対策は、USBメモリ経由の脅威も含めてすべての攻撃経路を防ぐ"
    answerIndex: 1
    explanation: "ネットワークケーブルを物理的に抜けば、その端末は外部から到達不可能になります。切断されている時間帯については、C2通信や外部からの新規の攻撃の到達を原理的に完全にゼロにするという、明確な効果があります。"

  - question: "「作業後にLANケーブルを抜く」対策が防いでいないものについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "この対策は、あらゆる脅威を100%防ぐため、防いでいないものは存在しない"
      - "接続している作業時間帯そのものの脆弱性や、USBメモリなどネットワーク以外の経路からの脅威までは防げない"
      - "この対策は、パッチ適用の必要性そのものを完全になくす"
      - "この対策を行うと、EDRや振る舞い検知が不要になる"
    answerIndex: 1
    explanation: "接続している作業時間帯そのものの脆弱性は、この対策では防げません。また、USBメモリ経由などネットワーク以外の初期アクセス経路で既に足がかりを築かれていた場合、その脅威をケーブルを抜く運用自体が除去するわけではありません。"

  - question: "エアギャップされた環境の限界について、記事が挙げるStuxnetの例から最も合致するものはどれか。"
    choices:
      - "エアギャップされた環境は、いかなる場合も完全に安全であることが証明されている"
      - "Stuxnetは、USBメモリを媒介にしてエアギャップされた産業制御システムへ到達し、ネットワーク経由の攻撃対象領域をゼロにしても物理メディアの持ち込みという別経路が残っている限りリスクはゼロにならないことを示した"
      - "Stuxnetは、ネットワーク経由でのみ感染が広がるマルウェアであり、エアギャップとは無関係である"
      - "エアギャップされた環境は、Stuxnetの登場以降、技術的に構築不可能になった"
    answerIndex: 1
    explanation: "Stuxnetは、USBメモリを媒介にしてエアギャップされた産業制御システムへ到達し、大きな被害をもたらしました。ネットワーク経由の攻撃対象領域をゼロにしても、物理メディアの持ち込みという別の経路が残っている限り、リスクはゼロにはなりません。"

  - question: "手動でのLANケーブル抜き差し運用の課題と、代替策について、記事の説明に最も合致するものはどれか。"
    choices:
      - "手動運用には課題がないため、代替策を検討する必要はない"
      - "人的ミス(抜き忘れ・挿し忘れ)のリスクとスケールしない課題があり、ファイアウォールのアウトバウンドルールを必要な宛先だけに限定するといった自動化された代替策と比較検討する価値がある"
      - "手動運用の唯一の代替策は、サーバーの台数を減らすことである"
      - "手動運用は、サーバー台数が増えてもコストが一切増加しない"
    answerIndex: 1
    explanation: "毎日手動でケーブルを抜き差しする運用には、抜き忘れ・挿し忘れといった人的ミスのリスクと、サーバー台数が増えるほどコストが線形に増加しスケールしないという課題があります。ファイアウォールのアウトバウンドルールを限定するといった自動化された代替策と比較検討する価値があります。"

  - question: "記事が提示する、費用対効果を踏まえたセキュリティ対策の優先順位について、最も合致するものはどれか。"
    choices:
      - "LANケーブルを抜くなどの物理的対策が、あらゆる対策の中で最優先とされている"
      - "パッチ適用の速さ・最小権限の徹底・ネットワークセグメンテーション・EDR導入・アウトバウンド通信の制限が優先され、物理的対策はそれらを補完する位置づけとされている"
      - "セキュリティ対策には優先順位という概念自体が存在せず、すべて同じ重要度である"
      - "パッチ適用は、他のどの対策よりも優先度が低いとされている"
    answerIndex: 1
    explanation: "記事では、パッチ適用の速さ・最小権限の徹底・ネットワークセグメンテーション・EDR/振る舞い検知の導入・アウトバウンド通信の制限という順で優先度の高い対策を挙げ、LANケーブルを抜くといった物理的な対策はそれらを補完する追加の防御層として位置づけています。"
