questions:
  - question: "ハブ(すべてのポートが同じ配線を共有する装置)環境で、自分宛ではないフレームがあるホストのNICに届いた場合の処理として、記事の内容に照らして最も適切なものはどれか。"
    choices:
      - "IPヘッダーの宛先IPアドレスをNICがハードウェアで解析し、自分宛でなければ破棄する"
      - "宛先MACアドレスが自分宛(またはbroadcast/multicast)でないことをNICチップ自身がハードウェアレベルで照合し、CPUへ一切通知せず破棄する"
      - "一旦CPUへ割り込みを発生させたうえで、Top halfの割り込みハンドラがIPアドレスを見て破棄を判断する"
      - "スイッチのMACアドレステーブルと同様の仕組みをNIC自身が持ち、宛先ポートを決定してから該当ホストにのみ転送する"
    answerIndex: 1
    explanation: "NICハードウェアは受信した全フレームについて律儀にCPUへ割り込みを送るのではなく、宛先MACアドレスによる一次フィルタリングをハードウェアレベルで行い、無関係なフレームはCPUに通知せず破棄します。判定基準はIPアドレスではなくMACアドレスであり(選択肢1は判定材料を取り違えている)、この判定は割り込み発生前に完結するためTop halfの出番はありません(選択肢3)。また、これは単一NICの自己判定であり、スイッチが行う宛先ポートの選択とは別の仕組みです(選択肢4)。"

  - question: "あるサーバーへの着信トラフィックが急増した際に、Linuxカーネルが割り込み処理について行う挙動として、最も適切なものはどれか。"
    choices:
      - "Top half(ハードウェア割り込みハンドラ)が処理時間を延長し、届いたフレームをその場でネットワークスタックまで渡し切るようになる"
      - "トラフィック量に応じて、フレームごとに割り込みを発生させる方式から、NAPIが一定間隔でリングバッファを能動的に確認するポーリング方式へ動的に切り替わり、割り込みストームを回避する"
      - "RSSによる複数CPUコアへの分散が自動的に停止し、単一のコアが全フレームを順番に処理するようになる"
      - "DMAが自動的に無効化され、CPUがNICのレジスタから1バイトずつデータを読み出す方式に切り替わる"
    answerIndex: 1
    explanation: "NAPIは、トラフィックが多くなると割り込みを止めてポーリングモードに切り替えることで、1パケットごとの割り込みオーバーヘッド(割り込みストーム)を回避します。Top halfは常に必要最小限の処理で即座に終える設計であり高負荷時に延長されるわけではなく(選択肢1)、RSSは高負荷時こそ複数コアへの分散が重要になる仕組みです(選択肢3)。DMAが高負荷で無効化されるという記述も本文にはありません(選択肢4)。"

  - question: "NICがフレームを受信してからCPUに割り込みが通知されるまでの間に起きていることとして、記事の内容に最も合致するものはどれか。"
    choices:
      - "NICはフレームをNIC内部のバッファに一時保持するのみで、CPUが割り込みハンドラ内でメインメモリへ書き込む"
      - "フレームのデータはDMAによってすでにメインメモリ上のリングバッファへ直接書き込まれており、CPUはこの書き込み処理には一切関与していない"
      - "フレームのデータはCPUのレジスタを経由して1バイトずつメインメモリへ転送される"
      - "フレームのデータはまずカーネル空間からユーザー空間へコピーされたのち、DMAによってメインメモリへ書き込まれる"
    answerIndex: 1
    explanation: "DMAにより、CPUに割り込みが送られる前の段階で、フレームはすでにメインメモリ上のリングバッファへNICが直接書き込み済みです。CPUが呼び出されるのはこの書き込みが終わった後であり、書き込み作業自体には一切関与しません。1バイトずつCPUが読み出す方式は、記事中でDMAが無い場合の非効率な想定として説明されているものです(選択肢3)。"

  - question: "仮想スイッチやロードバランサーなど、パケットの中身を書き換えるソフトウェア的な中継機構が経路上に存在する環境で、チェックサムオフロードが原因と考えられる断続的な通信断が起きた。この現象の技術的な原因として最も適切な説明はどれか。"
    choices:
      - "チェックサムオフロードは送信側がチェックサム計算を行わずNICに渡す前提で成り立っているため、その前提を知らない中間機構が未計算(またはダミー値)のチェックサムのまま転送してしまい、受信側が検証失敗として黙って破棄する"
      - "チェックサムオフロードは受信側NICのみで完結する機能であり、送信側の設定や経路上の中間機構からは一切影響を受けない"
      - "チェックサムオフロードが有効な環境ではTCPのシーケンス番号の計算自体がNIC側で誤って行われるため、パケットの順序が入れ替わる"
      - "チェックサムオフロードはVLANタグの有無に応じて自動的に無効化される機能であり、この症状はTSO/GROのみに起因する"
    answerIndex: 0
    explanation: "チェックサムオフロードは「送出直前にNICが計算する」という前提の上に成り立っており、その前提を知らない中間機構が未計算のチェックサムのまま転送すると、受信側が検証失敗と判断して黙って破棄します。シーケンス番号の計算(選択肢2)は本文に記載がなく、VLANタグとの自動連動(選択肢3)やTSO/GRO限定の話にすり替える説明(選択肢3の一部)は誤りです。"

  - question: "社内でVXLANによるトンネリングを新たに使い始めたところ、特定サイズのパケットだけがハングするという原因不明の不具合が発生した。この不具合の技術的背景として、記事の内容に最も合致する説明はどれか。"
    choices:
      - "VXLANによるカプセル化でヘッダーの位置・長さが通常と変わり、TSO/GSO/GROがハードウェアやドライバ内で前提としているヘッダー構造とずれるため、分割・結合の計算を誤ることがある"
      - "VXLANはIPアドレスを使用しないプロトコルであるため、NICのMACアドレスによる一次フィルタリングと衝突し、フレームが破棄される"
      - "VXLANトンネリングはDMAと互換性がないため、リングバッファへの書き込みそのものが行われなくなる"
      - "VXLANを使うとNAPIが強制的にポーリングモードに固定され、割り込み駆動へ戻れなくなる"
    answerIndex: 0
    explanation: "TSO・GSO・GROはイーサネットフレームのヘッダー構造(位置・長さ)を前提にした処理であり、VXLANなどのトンネリングによるカプセル化でこの前提がずれると、分割・結合の計算を誤り、特定サイズのパケットの破損やハングにつながることがあります。VXLANはIPを使わないプロトコルではなく(選択肢2)、DMAやNAPIの動作モードとVXLANの間に本文で述べられている関係もありません(選択肢3・4)。"

  - question: "ある一般的なWebサービスの負荷分散サーバーに、DPDKによるカーネルバイパスを導入する提案が出た。この提案に対する、記事の内容に基づいた最も妥当な評価はどれか。"
    choices:
      - "カーネルバイパスは常にネットワーク処理を高速化するため、あらゆる用途で積極的に導入すべきである"
      - "DPDKはビジーポーリングのためCPUコアを常時1つ以上専有し、iptablesなどカーネルが提供していた汎用機能も失われるため、マイクロ秒未満のレイテンシが問題にならない一般的な用途では、運用の複雑化というデメリットの方が大きくなりがちである"
      - "DPDKはNAPIのポーリングモードを内部的に呼び出しているだけであり、通常のNICドライバの動作と本質的な違いはない"
      - "DPDKを導入すると、IRQアフィニティやNUMA配置を意識したチューニングが完全に不要になるため、運用は必ず簡素化される"
    answerIndex: 1
    explanation: "カーネルバイパスはCPUコアの常時専有と汎用機能の喪失というコストを伴うため、マイクロ秒単位のレイテンシが問題になる特殊な用途以外では運用の複雑化というデメリットの方が大きくなりがちだと本文は明言しています。DPDKはNICをカーネル管理下から外しユーザー空間で直接操作する仕組みであり、NAPIとは別物です(選択肢3)。"

  - question: "2ソケット構成のサーバーで、あるNICが物理的にソケット0に近いPCIeスロットに挿さっている。このNICの割り込み処理(IRQアフィニティ)を、あえてソケット1に属するCPUコアにピン留めした場合に起きることとして、最も適切なものはどれか。"
    choices:
      - "ソケットをまたいだメモリアクセスが発生しやすくなり、NUMAの特性上、余分なレイテンシが積み重なる"
      - "RSSが自動的にソケット0のコアへ処理を再割り当てするため、性能への影響は生じない"
      - "DMAによるリングバッファへの書き込み自体がソケットをまたいで行えなくなり、パケットロスが発生する"
      - "irqbalanceが稼働している限り、NUMA配置による性能差は理論上生じない"
    answerIndex: 0
    explanation: "NICから遠いソケットのコアに割り込み処理を割り当てると、パケットデータの処理時にソケットをまたいだメモリアクセスが発生しやすくなり、NUMAの特性上、余分なレイテンシが積み重なります。本文は、irqbalanceのような自動分散ツールはNUMA構成までは意識しないことが多いと述べており、自動的に是正される保証はありません(選択肢2・4)。"

  - question: "`mpstat -P ALL 1`を実行したところ、特定の1コアだけ`%soft`が突出して高いことが分かった。この状況に対する調査・対処のアプローチとして、記事の内容に照らして最も適切なものはどれか。"
    choices:
      - "`/proc/interrupts`で該当NICの割り込みがどのコアに偏っているかを確認し、RSSのキュー数がCPUコア数に見合っているか、irqbalanceが稼働しているかを確認する"
      - "`%soft`はディスクI/O待ちを示す指標であるため、まずストレージのボトルネックを疑うべきである"
      - "`ethtool -K`ですべてのオフロード機能を無効化することが、この状況に対する唯一の対処法である"
      - "`%soft`の偏りは常にDMAの不具合が原因であるため、リングバッファのサイズを増やせば必ず解消する"
    answerIndex: 0
    explanation: "特定コアの`%soft`(ソフト割り込み処理)が高い場合は、割り込みがそのコアに偏っている可能性があり、`/proc/interrupts`での確認とRSSのキュー数・irqbalanceの稼働状況のチェックが本文で挙げられている調査手順です。オフロード無効化(選択肢3)は別の症状(通信不具合)に対する切り分け手順であり、この状況の唯一の対処法ではありません。"
