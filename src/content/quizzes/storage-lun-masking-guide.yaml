questions:
  - question: "ゾーニングが制御している内容として正しいのはどれか。"
    choices:
      - "ストレージ装置が、どのLUNをどのサーバーに見せるか"
      - "ファブリック層で、どのイニシエーターがどのターゲットと通信できるか"
      - "サーバー内部のファイルシステムのアクセス権限"
      - "ネットワーク全体の帯域幅の割り当て"
    answerIndex: 1
    explanation: "ゾーニングは、FCスイッチ(ファブリック)のレベルで動作し、どのイニシエーター(サーバー)がどのターゲット(ストレージ装置のポート)と通信できるかを制限します。"

  - question: "LUNマスキングが制御している内容として正しいのはどれか。"
    choices:
      - "ファブリック層での、サーバー同士の通信可否"
      - "通信が許可された相手の中から、さらにどのLUNを見せるか"
      - "FCスイッチの物理的なポート数"
      - "ストレージ装置の電源管理"
    answerIndex: 1
    explanation: "LUNマスキングは、ストレージ装置自身(あるいはホスト側のアダプター)で動作し、通信が許可された相手の中から、さらにどのLUNを見せるかを制限します。"

  - question: "ゾーニングとLUNマスキングの関係として正しいのはどれか。"
    choices:
      - "どちらか一方だけを設定すれば、アクセス制御は完全に完結する"
      - "ゾーニングを通過しても、LUNマスキングによってさらにLUNの可視性が絞られる、別々の関所である"
      - "LUNマスキングは、ゾーニングを完全に無効化する機能である"
      - "この2つは、技術的に同時に設定できない"
    answerIndex: 1
    explanation: "ゾーニングとLUNマスキングは別々の関所であり、ゾーニングによって通信が許可されても、LUNマスキングによって、さらに見えるLUNが制限されます。実務では両方を組み合わせて使うのが基本です。"

  - question: "LUNマスキングが実装される場所として正しいのはどれか。"
    choices:
      - "常にストレージコントローラー側でのみ実装され、他の場所では実装されない"
      - "一般的にはストレージコントローラー側(またはホストアダプター側)だが、一部のFCスイッチでもLUN単位のゾーニングとして実装できる"
      - "常にクライアントのWebブラウザ側で実装される"
      - "LUNマスキングという機能自体が、現在は廃止されている"
    answerIndex: 1
    explanation: "LUNマスキングは一般的にはストレージコントローラー側(あるいはホストのアダプター側)で実装されますが、一部のFCスイッチは、LUN単位でのゾーニングを可能にする機能を持っており、スイッチ側で相当する制御を行うこともできます。"

  - question: "WWNベースのゾーニングとLUNマスキングの、なりすましに対する限界として正しいのはどれか。"
    choices:
      - "どちらも、なりすましへの完璧な防御策である"
      - "どちらも最終的にはWWNやイニシエーターIDを基準に判断するため、WWN偽装への根本的な防御にはならない"
      - "なりすましという概念自体が、SAN環境には存在しない"
      - "LUNマスキングだけが、なりすましを完全に防止できる"
    answerIndex: 1
    explanation: "ゾーニングもLUNマスキングも、最終的にはWWNやイニシエーターIDを基準に判断するため、この種の偽装(スプーフィング)に対する根本的な防御にはならず、別の対策と組み合わせる必要があります。"
