questions:
  - question: "すべての端末のローカル管理者アカウントに、同じパスワードを設定する運用の、最大のリスクとして正しいのはどれか。"
    choices:
      - "パスワードの文字数が長くなりすぎる"
      - "1台のパスワード漏洩が、パス・ザ・ハッシュによる他の端末への横展開につながる"
      - "GPOの数が増えすぎる"
      - "DNSの名前解決が遅くなる"
    answerIndex: 1
    explanation: "1台の端末のローカル管理者パスワードが漏洩した瞬間、そのパスワードのハッシュを使って、組織内の他のすべての端末へ横展開できてしまいます。"

  - question: "Windows LAPSが、各端末のローカル管理者パスワードを保存する方法として正しいのはどれか。"
    choices:
      - "平文のまま、ADの属性に保存する"
      - "DPAPI-NGで暗号化した状態で、ADの属性に保存する"
      - "各端末のローカルディスクにのみ保存する"
      - "メールで管理者へ送信する"
    answerIndex: 1
    explanation: "Windows LAPSは、DPAPI-NGを使ってパスワードを暗号化した状態でADへ保存し、復号できるのは明示的に許可されたプリンシパルだけです。"

  - question: "旧Microsoft LAPSと、Windows LAPSの決定的な違いとして正しいのはどれか。"
    choices:
      - "旧LAPSは暗号化して保存していたが、Windows LAPSは平文で保存する"
      - "旧LAPSは平文で保存していたが、Windows LAPSはDPAPI-NGで暗号化して保存する"
      - "両者は、保存するパスワードの安全性において差がない"
      - "旧LAPSの方が新しい技術である"
    answerIndex: 1
    explanation: "旧Microsoft LAPSはパスワードを平文でADに保存していましたが、Windows LAPSはDPAPI-NGで暗号化して保存します。"

  - question: "ヘルプデスクの担当者に、LAPSのパスワード読み取り権限を渡す、推奨される方法として正しいのはどれか。"
    choices:
      - "ヘルプデスク全員をDomain Adminsに追加する"
      - "対象OU上で、`Set-LapsADReadPasswordPermission`を使い、ヘルプデスクグループだけに読み取り権限を委任する"
      - "パスワードをメールで個別に共有する"
      - "すべての端末のBIOSパスワードを無効化する"
    answerIndex: 1
    explanation: "OUへの権限移譲と同じ要領で、`Set-LapsADReadPasswordPermission`を使い、対象OU上でヘルプデスクグループだけに読み取り権限を委任します。"

  - question: "gMSAとWindows LAPSに共通する、設計思想として正しいのはどれか。"
    choices:
      - "どちらも、パスワードを永久に固定する仕組みである"
      - "人間が手動で管理するパスワードを、できるだけゼロに近づけるという設計思想"
      - "どちらも、ネットワーク層の暗号化を提供する仕組みである"
      - "どちらも、DNSレコードを自動生成する仕組みである"
    answerIndex: 1
    explanation: "gMSAはサービスアカウント、LAPSはローカル管理者アカウントという異なる適用先ですが、どちらも人間が手動で管理するパスワードをできるだけゼロに近づける、という同じ設計思想に基づいています。"
