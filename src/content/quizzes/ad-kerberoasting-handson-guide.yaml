questions:
  - question: "Kerberoastingを実行するために、攻撃者に必要な権限はどの程度か。"
    choices:
      - "Domain Adminsの権限が必須である"
      - "特別な権限を持たない、認証済みの一般ドメインユーザーであれば実行できる"
      - "対象サービスへのアクセス権限が事前に必要である"
      - "物理的にドメインコントローラーへアクセスできる権限が必要である"
    answerIndex: 1
    explanation: "Kerberoastingは、認証済みのドメインユーザーであれば、特別な権限なしに実行できます。対象サービスへのアクセス権限は一切不要です。"

  - question: "Kerberoastingが『脆弱性』ではなく『設計上の性質』とされる根本的な理由は何か。"
    choices:
      - "Microsoftが意図的に脆弱性を放置しているため"
      - "KDCがチケット発行時点では、要求者がそのサービスへのアクセス権限を持つかを検証しないため"
      - "Kerberosがそもそも暗号化を使用していないため"
      - "この攻撃はWindows Server 2025でのみ発生する新しい問題であるため"
    answerIndex: 1
    explanation: "KDCはチケット発行時に権限を検証せず、実際にサービスへ提示された時点で検証が行われます。この設計自体はKerberosとして正しく機能しているため、脆弱性ではなく設計上の性質です。"

  - question: "Kerberoastingへの唯一の実効的な対策は何か。"
    choices:
      - "DCの台数を増やすこと"
      - "サービスアカウントのパスワード強度を、実質的に解読不可能なレベルまで引き上げること"
      - "すべてのユーザーをDomain Adminsに追加すること"
      - "ファイアウォールですべてのKerberos通信を遮断すること"
    answerIndex: 1
    explanation: "唯一の実効的な対策は、サービスチケットを暗号化している鍵、つまりサービスアカウントのパスワードそのものを、解読不可能な強度まで引き上げることです。"

  - question: "RC4暗号化方式が、AESと比べてKerberoastingにおいて攻撃者を有利にする理由は何か。"
    choices:
      - "RC4はAESよりも新しい暗号化方式であるため"
      - "RC4で暗号化されたチケットは、AESで暗号化されたチケットよりも大幅に少ない計算量で解読を試みられるため"
      - "RC4はKerberosでは使用できないため"
      - "RC4はパスワードを暗号化せずそのまま保存するため"
    answerIndex: 1
    explanation: "RC4で暗号化されたチケットは、AESで暗号化されたチケットよりも大幅に少ない計算量で解読を試みることができるため、攻撃者にとって有利になります。"

  - question: "gMSAへの移行がKerberoasting対策として有効な理由は何か。"
    choices:
      - "gMSAはKerberos認証自体を使用しないため"
      - "gMSAのパスワードはAD DS自身が生成する長大でランダムな文字列であり、事実上解読不可能であるため"
      - "gMSAはサービスチケットの発行自体を拒否するため"
      - "gMSAは自動的にファイアウォールルールを追加するため"
    answerIndex: 1
    explanation: "gMSAのパスワードは、人間が関与せずAD DS自身が生成する長大な文字列であり、辞書攻撃やブルートフォース攻撃に対して事実上解読不可能な強度を持っています。"
