questions:
  - question: "プロトコルを構成する3つの要素について、記事の説明に最も合致するものはどれか。"
    choices:
      - "構文(データの表現形式)・意味論(各フィールドの意味)・タイミング(やり取りの順序・状態遷移)の3つである"
      - "IPアドレス・ポート番号・MACアドレスの3つである"
      - "送信者・受信者・中継者という通信に関わる人物の3つである"
      - "ハードウェア・ソフトウェア・ファームウェアの3つである"
    answerIndex: 0
    explanation: "プロトコルという約束事項は、構文(データをどんなバイト列・フォーマットで表現するか)・意味論(各フィールド・メッセージが何を意味するか)・タイミング(どの順序でメッセージをやり取りするか)という3つの要素に分解できます。"

  - question: "テキストベースのプロトコルとバイナリのプロトコルの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "テキストベースは人間にとって扱いやすく拡張も容易だが、バイナリは少ないバイト数で表現でき解析処理も高速に行えるという、異なる利点を持つ"
      - "テキストベースのプロトコルは、現在では技術的に一切使用されていない"
      - "バイナリのプロトコルは、常にテキストベースのプロトコルより通信速度が遅い"
      - "テキストベースとバイナリのプロトコルは、機能面でまったく違いがない"
    answerIndex: 0
    explanation: "テキストベースのプロトコルは人間が目視で確認・デバッグしやすく拡張も容易である一方、バイナリのプロトコルは同じ情報をより少ないバイト数で表現でき、パース処理も高速に行えるという、異なる利点を持ちます。どちらを優先するかは、そのプロトコルの用途によって決まる設計判断です。"

  - question: "プロトコルの階層構造(カプセル化)の性質について、記事の説明に最も合致するものはどれか。"
    choices:
      - "階層構造は物理法則のような絶対的な必然であり、例外なくすべてのプロトコルがこれに従う"
      - "階層構造は複雑さを分割統治するための設計上の選択であり、ICMP・ESP・AHのように階層に綺麗に収まらないプロトコルも存在する"
      - "階層構造は、1990年代に廃止された古い概念であり、現在のプロトコルには一切適用されない"
      - "階層構造は、テキストベースのプロトコルにのみ適用され、バイナリのプロトコルには適用されない"
    answerIndex: 1
    explanation: "階層構造(カプセル化)は物理法則のような絶対的な必然ではなく、複雑さを分割統治するための設計上の選択です。ICMP・ESP・AH・GREのように、トランスポート層を経由せずIPの直下で動作する、階層に綺麗に収まらないプロトコルも数多く存在します。"

  - question: "独自のプロトコルを自作できる理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "IETFなどの標準化団体による公式な承認を得なければ、いかなる通信も技術的に成立しないため、独自プロトコルは常に承認を得てから使われている"
      - "プロトコルは構文・意味論・タイミングという3要素が通信する両者の間で一致してさえいれば成立する約束事項であり、公式な標準化はそのための必須条件ではないため"
      - "独自のプロトコルは、必ず既存の標準プロトコル(HTTPなど)を一部改変したものでなければならないという法律上の制約があるため"
      - "独自プロトコルは、技術的には一切機能せず、実際には使われていない"
    answerIndex: 1
    explanation: "プロトコルは、構文・意味論・タイミングという3要素が通信する両者の間で一致してさえいれば成立する約束事項です。公式な標準化は世界中との相互運用性を確保するための手段の1つに過ぎず、必須条件ではないため、非公開の独自プロトコルも技術的に正当に機能します。"

  - question: "暗号化されていない独自プロトコルの安全性について、記事の説明に最も合致するものはどれか。"
    choices:
      - "独自プロトコルであれば、構文・意味論が非公開であるため、暗号化していなくても内容を読み取られる心配は一切ない"
      - "独自プロトコルの構文・意味論が非公開であることと、通信内容が暗号化されていることはまったく別の話であり、暗号化されていなければリバースエンジニアリングによって内容が解析されるリスクがある"
      - "独自プロトコルは、法律上いかなる状況でも解析することが禁止されている"
      - "独自プロトコルは、暗号化アルゴリズムを内蔵していない限り、そもそもネットワーク上を流れることができない"
    answerIndex: 1
    explanation: "独自プロトコルの構文・意味論が非公開であることと、通信内容が暗号化されていることはまったく別の話です。暗号化されていなければ、既知の操作の前後での差分観察や繰り返しパターンの分析といった手法でリバースエンジニアリングされるリスクがあります。"
