questions:
  - question: "前方参照ゾーンと後方参照ゾーンの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "前方参照ゾーンにAレコードを追加すると、対応する後方参照ゾーンのPTRレコードも常に自動的に作成される"
      - "前方参照ゾーンと後方参照ゾーンは互いに独立して管理・登録されるデータであり、後方参照ゾーン自体が作成・設定されていなければ対応するPTRレコードは存在しない"
      - "後方参照ゾーンは前方参照ゾーンの単なるバックアップコピーである"
      - "前方参照ゾーンと後方参照ゾーンは、常に同じサーバー上に同時に作成しなければ機能しない"
    answerIndex: 1
    explanation: "前方参照ゾーンと後方参照ゾーンは互いに独立して管理・登録される別々のデータです。動的更新が両方で有効であれば通常両方登録されますが、後方参照ゾーン自体が作成されていなければ対応するPTRレコードは存在せず、この非対称性がトラブルの原因になることがあります。"

  - question: "_msdcsゾーンが、多くの環境で独立した前方参照ゾーンとして作成され、通常のドメインゾーンより広い範囲でレプリケーションされる理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "_msdcsは単なる管理者の好みで独立させているだけで、技術的な理由は特にない"
      - "_msdcsのレコードはフォレスト内のどのドメインのクライアントからも参照される必要があるため、ForestDnsZonesというフォレスト全体でレプリケーションされるパーティションに保存される"
      - "_msdcsは容量が非常に大きいため、通常のドメインゾーンとは別のディスクに保存する必要がある"
      - "_msdcsは暗号化されたデータであり、通常のドメインゾーンとは異なる特別なセキュリティ機構が必要なため"
    answerIndex: 1
    explanation: "_msdcsのレコードは、フォレスト内の別ドメインのクライアントがDCやグローバルカタログを検索する際にも参照される必要があるため、ドメインパーティションよりも広い範囲(フォレスト内の全DC間)でレプリケーションされるForestDnsZonesパーティションに保存されます。"

  - question: "_msdcsゾーンの直下にあるGUID名のCNAMEレコードの役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "そのDCのIPアドレスが変更された場合にのみ機能し、ホスト名の変更には一切対応していない"
      - "レプリケーションパートナーの参照などがホスト名ではなくGUIDで恒久的にDCを識別できるようにし、DCのホスト名が変更されても参照が新しいAレコードへ正しくたどり着けるようにする"
      - "そのDCのパスワードハッシュを暗号化して保存するためのレコードである"
      - "ドメイン内のすべてのユーザーアカウントの一覧を保持するためのレコードである"
    answerIndex: 1
    explanation: "GUIDは一度発行されると変わらないため、GUIDベースのCNAMEレコードを経由する参照であれば、そのDCのホスト名が後から変更されても、参照は自動的に新しいホスト名を指すAレコードへ正しくたどり着きます。"

  - question: "SRVレコードの役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "SRVレコードはAレコードの別名にすぎず、機能的な違いはない"
      - "SRVレコードは特定のサービスを提供しているサーバーを名前ではなく役割から検索するためのレコードで、優先度と重みによって複数サーバー間の選択・負荷分散を制御する"
      - "SRVレコードはAD環境専用のレコード種別であり、他の用途では一切使われない"
      - "SRVレコードは、ドメイン内のすべてのサブネット情報を一括で保持するレコードである"
    answerIndex: 1
    explanation: "SRVレコードは「特定のサービスを提供しているサーバーはどれか」を役割から検索するためのレコードです。優先度(priority)と重み(weight)というフィールドにより、同じ役割を持つ複数サーバーの間での選択順序と負荷分散の比率を表現します。SIPやXMPPなど、AD以外の用途でも広く使われる汎用的なレコード種別です。"

  - question: "ADサイトを考慮した(_sites付きの)SRVレコードが存在する理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "クライアントが、地理的・ネットワーク的に近い(同じADサイトに属する)DCを優先的に見つけられるようにし、遠く離れたDCへの毎回の問い合わせによる遅延を防ぐため"
      - "ADサイトごとに異なるドメイン名を割り当てる必要があるため"
      - "_sites付きのSRVレコードは、フォレスト機能レベルを引き上げるためだけに使われる特殊なレコードである"
      - "ADサイトの概念はSRVレコードとは無関係であり、たまたま名前に含まれているだけである"
    answerIndex: 0
    explanation: "_sites付きのSRVレコードは、クライアントに地理的・ネットワーク的に近い(同じADサイトに属する)DCを優先的に見つけさせるための仕組みです。これがないと、遠隔地のクライアントが毎回遠く離れたDCへ問い合わせることになり、認証やポリシー適用のたびに大きな遅延が発生します。"

  - question: "dnslint /adというツールの用途について、記事の説明に最も合致するものはどれか。"
    choices:
      - "DNSサーバーのゾーンデータを完全に初期化するためのツールである"
      - "指定したDCに対して、_msdcs配下の主要なSRVレコードが期待通りに登録・解決できるかを一括でチェックし、レポートを出力するツールである"
      - "AD DSのスキーマを変更するための管理者専用ツールである"
      - "Windows Serverのライセンス認証状態を確認するためのツールである"
    answerIndex: 1
    explanation: "dnslint /adは、指定したDCに対して_msdcs配下の主要なSRVレコードが期待通りに登録・解決できるかを一括でチェックし、レポートをHTML形式で出力するツールです。DNSマネージャーの画面を目視で1つずつ確認する代わりに、大規模環境での検証に使われます。"
