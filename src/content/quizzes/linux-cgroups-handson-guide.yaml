questions:
  - question: "namespaceとcgroupsの、決定的な役割の違いとして正しいのはどれか。"
    choices:
      - "両者はまったく同じ機能であり、違いはない"
      - "namespaceは見える情報の範囲を制限し、cgroupsは消費できるリソースの量そのものを制限する"
      - "namespaceはCPUを制限し、cgroupsはメモリを制限する"
      - "cgroupsは、namespaceよりも古く、すでに廃止された仕組みである"
    answerIndex: 1
    explanation: "namespaceは見える情報の範囲(視点)を制限する仕組みであり、cgroupsは消費できるリソースの量そのものを制限する、独立した仕組みです。"

  - question: "cgroupの`memory.max`に`100M`と設定した場合に、実際に起きることとして正しいのはどれか。"
    choices:
      - "そのcgroupに所属するプロセスが、自動的にメモリ使用量の少ない動作へ切り替わる"
      - "そのcgroupに所属するプロセス全体が消費できるメモリの合計量に、100MBという上限が設定される"
      - "ホスト全体のメモリ容量が、100MBに制限される"
      - "何も起こらず、設定は無視される"
    answerIndex: 1
    explanation: "memory.maxへの設定は、そのcgroupに所属するプロセス全体が消費できるメモリの合計量に、上限を設定するものです。"

  - question: "cgroupのメモリ上限を超えた際に、強制終了が発生する条件として正しいのはどれか。"
    choices:
      - "ホスト全体のメモリが不足している場合のみ"
      - "ホスト全体に十分な空きメモリがあっても、そのcgroup自身に割り当てられた上限を超えた場合"
      - "CPU使用率が100%に達した場合のみ"
      - "強制終了は、いかなる場合も発生しない"
    answerIndex: 1
    explanation: "cgroupのメモリ上限を超えると、ホスト全体に十分な空きメモリがあっても、そのcgroup自身に割り当てられた上限を超えたという理由だけで、強制終了が発生します。"

  - question: "コンテナ技術が、実際にはどのような仕組みの組み合わせであるか、正しいのはどれか。"
    choices:
      - "専用の軽量な仮想マシンという、単一の技術"
      - "namespace(何が見えるか)とcgroups(どれだけ使えるか)という、2つの独立した仕組みの組み合わせ"
      - "cgroupsだけで完結する、単一の仕組み"
      - "namespaceだけで完結する、単一の仕組み"
    answerIndex: 1
    explanation: "コンテナ技術は、namespace(何が見えるか)とcgroups(どれだけ使えるか)という、2つの独立した仕組みの組み合わせを、1つの概念として自動化したものです。"

  - question: "cgroupsの設定方法として正しいのはどれか。"
    choices:
      - "専用のGUIアプリケーションからのみ設定できる"
      - "`/sys/fs/cgroup`以下のファイルへの読み書きとして設定する"
      - "カーネルの再コンパイルが必要である"
      - "ネットワーク経由のAPIを通じてのみ設定できる"
    answerIndex: 1
    explanation: "cgroupsの設定は、procfsと同様の発想で、/sys/fs/cgroup以下のファイルへの通常の読み書きとして行われます。"
