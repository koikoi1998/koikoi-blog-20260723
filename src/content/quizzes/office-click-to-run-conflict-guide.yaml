questions:
  - question: "現在のOfficeが採用している配布・実行方式について、記事の説明に最も合致するものはどれか。"
    choices:
      - "現在のOfficeも、伝統的なMSIインストーラのみで配布されている"
      - "現在のOfficeはClick-to-Run(C2R)という方式を採用しており、専用のバックグラウンドサービスがOffice全体の状態管理・自動更新を担っている"
      - "現在のOfficeは、インターネット経由でのみ実行され、ローカルには一切ファイルを保存しない"
      - "現在のOfficeは、Windows自体のカーネルの一部として組み込まれている"
    answerIndex: 1
    explanation: "現在のOfficeは、App-Vに似たアプリケーション仮想化技術をベースに、必要なコンポーネントをストリーミングしながら展開し、専用のバックグラウンドサービス(Office Click-to-Runサービス)がOffice全体の状態管理・自動更新を担う、Click-to-Run(C2R)という方式を採用しています。"

  - question: "異なるエディションのOfficeが同一PC上で競合する理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "異なるエディションのOfficeは、内部的に完全に独立しており、競合すること自体がそもそもあり得ない"
      - "異なるエディション・異なるビット数のOfficeは、ある程度共通のコンポーネントを共有する設計になっているため、重ねてインストールすると共有コンポーネントの管理状態に矛盾が生じることがある"
      - "異なるエディションのOfficeは、常に自動的に1つに統合される"
      - "異なるエディションのOfficeは、インストールした瞬間に片方が自動的に削除される"
    answerIndex: 1
    explanation: "C2Rで配布されるOfficeの複数のエディションは、内部的にある程度共通のコンポーネントを共有する設計になっているため、異なるエディション・異なるビット数のOfficeを同一PC上に重ねてインストールしようとすると、共有コンポーネントの管理状態に矛盾が生じることがあります。"

  - question: "32bit版と64bit版のOfficeの共存について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Microsoftは、同一PC上での32bit版と64bit版Officeの共存を公式にサポートしている"
      - "Microsoftは、同一PC上での32bit版と64bit版Officeの共存を公式にサポートしておらず、一方をインストールする前にもう一方を完全に削除する必要がある"
      - "32bit版と64bit版のOfficeは、常にWoW64によって自動的に共存できる"
      - "Officeには、ビット数という概念自体が存在しない"
    answerIndex: 1
    explanation: "Microsoft自身が公式に、同一PC上に32bit版のOfficeと64bit版のOfficeを共存させることをサポートしていません。どちらか一方をインストールした状態で、もう一方をインストールしようとすると、先にインストールされている方を完全に削除してからでないと、正常にインストールできない仕様になっています。"

  - question: "通常のアンインストールでは解決できないOfficeの競合状態を解消するためのツールについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "Windowsのディスクの管理(diskmgmt.msc)を使えば解決できる"
      - "Microsoft Support and Recovery Assistant(SaRA)、特にコマンドライン版のSaRAcmd.exeを使い、OfficeScrubScenarioというシナリオを指定して実行することで、通常のアンインストーラでは削除しきれない状態を強制的に完全削除できる"
      - "タスクスケジューラの設定を変更するだけで解決できる"
      - "この種の競合状態を解消する専用ツールは存在しない"
    answerIndex: 1
    explanation: "MicrosoftはSaRA(Support and Recovery Assistant)という専用の診断・修復ツールを提供しており、コマンドライン版のSaRAcmd.exeでOfficeScrubScenarioというシナリオを指定して実行することで、通常のアンインストーラでは削除しきれないClick-to-Run関連の共有コンポーネントなどを含めて強制的に完全削除できます。"

  - question: "Intuneで配信管理している環境でOfficeの競合が起きる典型的な状況について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Intuneで管理している環境では、利用者が別のエディションのOfficeを手動でインストールすることは技術的に完全に不可能である"
      - "利用者が(あるいは誤操作によって)Intuneの管理対象とは異なるエディションのOfficeを手動でインストールしてしまうと、Intune側が期待する構成と実際の構成が食い違い、どちらのアンインストール処理も中途半端にしか完了しない状況に陥ることがある"
      - "Intuneで配信管理する場合、Officeのエディションという概念自体が存在しなくなる"
      - "Intuneは、Officeの配信管理には一切対応していない"
    answerIndex: 1
    explanation: "Intuneの管理下にある端末に対して、利用者が管理対象とは異なるエディションのOfficeを手動でインストールしてしまうと、Intune側が期待する構成と実際の構成が食い違った状態になり、Intune側が再適用や更新を試みた際に、手動でインストールされた版と競合してどちらのアンインストール処理も中途半端にしか完了しない状況に陥ることがあります。"
