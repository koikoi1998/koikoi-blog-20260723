questions:
  - question: "「ダブルホップ問題」とは、具体的にどのような現象か。"
    choices:
      - "クライアントがWebサーバーに1回目の接続をするだけで即座に失敗する現象"
      - "クライアントからWebサーバーへの1回目のホップは成功するが、Webサーバーから裏側のサーバーへの2回目のホップで認証情報が転送されず失敗する現象"
      - "Kerberosのチケットの有効期限が2倍になってしまう現象"
      - "同じユーザーが2つのデバイスから同時にログインできなくなる現象"
    answerIndex: 1
    explanation: "ダブルホップ問題は、1回目のホップ(クライアント→Webサーバー)は成功するが、2回目のホップ(Webサーバー→裏側のサーバー)で認証情報が転送されないために発生します。"

  - question: "ダブルホップ問題が発生することは、Kerberosの設計上どのように位置づけられるか。"
    choices:
      - "明確なバグであり、修正パッチの適用が必要である"
      - "意図した安全な設計であり、委任を明示的に許可しない限り拒否されるのが正しい挙動である"
      - "Windows Server 2025から新たに発生するようになった問題である"
      - "ネットワーク遅延によって偶発的に発生する問題である"
    answerIndex: 1
    explanation: "これはKerberosの意図した安全な設計であり、バグではありません。委任を明示的に許可しない限り拒否される、というのが正しい挙動です。"

  - question: "Kerberos制約付き委任で、`msDS-AllowedToDelegateTo`属性の役割は何か。"
    choices:
      - "委任元のパスワードを暗号化して保存する"
      - "委任してよい先のサービス(SPN)を明示的に列挙する"
      - "委任の有効期限を設定する"
      - "委任を行うユーザーのグループメンバーシップを記録する"
    answerIndex: 1
    explanation: "msDS-AllowedToDelegateTo属性には、委任してよい先のSPNが明示的に列挙されます。これにより、任意のサービスへ自由に委任できるわけではない、という制約が実現されています。"

  - question: "Kerberos制約付き委任が、CredSSPと比べて優れているとされる点は何か。"
    choices:
      - "CredSSPよりも設定手順が常に少ない"
      - "パスワードなどの機微情報を中継サーバー上に保持せず、チケットの受け渡しだけで完結する"
      - "CredSSPよりも古いOSバージョンに対応している"
      - "Kerberos制約付き委任は、暗号化を一切使わないため処理が高速である"
    answerIndex: 1
    explanation: "Kerberos制約付き委任は、パスワードという生の機微情報を一切中継せず、KDCが発行するチケットの受け渡しだけで完結する点で、CredSSPより安全とされています。"

  - question: "NTLM認証について、正しい説明はどれか。"
    choices:
      - "NTLM認証でも、正しく設定すれば委任が可能である"
      - "NTLM認証は、そもそも委任という概念自体をサポートしていない"
      - "NTLM認証は、Kerberosよりも委任機能が豊富である"
      - "NTLM認証は制約付き委任の別名である"
    answerIndex: 1
    explanation: "NTLM認証は委任の概念自体をサポートしていません。委任が必要な構成では、Kerberos認証が実際に使われているかを確認する必要があります。"
