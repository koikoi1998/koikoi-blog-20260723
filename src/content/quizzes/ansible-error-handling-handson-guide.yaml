questions:
  - question: "`block`とは何か。"
    choices:
      - "1つのタスクにコメントを付けるための構文"
      - "複数のタスクを1つのまとまりとして扱う仕組みで、中のいずれかが失敗すると全体の実行が止まる"
      - "変数の値を暗号化するための仕組み"
      - "インベントリのグループを定義するための構文"
    answerIndex: 1
    explanation: "blockは複数のタスクを1つのまとまりとして扱う仕組みで、中のどこかが失敗すると、その時点でblock全体の実行が止まりrescueへ処理が移ります。"

  - question: "`rescue`セクションが実行される条件は何か。"
    choices:
      - "Playbookの実行が完全に成功した場合にのみ実行される"
      - "対応するblock内でタスクが失敗した場合にのみ実行される"
      - "常に無条件で実行される"
      - "手動でトリガーした場合にのみ実行される"
    answerIndex: 1
    explanation: "rescueセクションは、対応するblock内で失敗が発生した場合にのみ実行されます。"

  - question: "`ignore_errors: true`とblock/rescueの違いとして正しい説明はどれか。"
    choices:
      - "両者はまったく同じ動作をする"
      - "ignore_errorsは失敗を無視して続行するだけだが、block/rescueは失敗時に特定の復旧処理を実行できる"
      - "ignore_errorsの方がより高度な例外処理を提供する"
      - "block/rescueは失敗を無視するための構文である"
    answerIndex: 1
    explanation: "ignore_errorsは失敗を無視して処理を続行するだけの単純な仕組みですが、block/rescueは失敗を検知し、特定の復旧処理を実行できる構造化された例外処理です。"

  - question: "`always`セクションの実行条件について正しい説明はどれか。"
    choices:
      - "blockが失敗した場合にのみ実行される"
      - "blockが成功した場合にのみ実行される"
      - "blockの成功・失敗にかかわらず、必ず実行される"
      - "rescueが実行されなかった場合にのみ実行される"
    answerIndex: 2
    explanation: "alwaysセクションは、blockの成功・失敗にかかわらず、両方のケースで必ず実行されます。"

  - question: "rescueセクションの最後に`fail`モジュールで明示的に失敗を報告することの意義は何か。"
    choices:
      - "Ansibleの仕様上、必ず記述しなければならない義務的な項目であるため"
      - "ロールバックだけして正常終了すると、実際には設定投入が失敗していた事実に運用担当者が気づけなくなるため"
      - "failモジュールを使わないとロールバック自体が実行されないため"
      - "コストを削減するため"
    answerIndex: 1
    explanation: "ロールバックだけして正常終了すると、Playbookの実行結果を見ただけでは『成功した』と誤解され、実際には失敗して復旧が必要だったという事実が伝わりません。"
