questions:
  - question: "FHSの設計思想を貫く2つの軸として、記事内で説明されているものはどれか。"
    choices:
      - "ファイルサイズの大小と、圧縮の有無"
      - "ホスト固有か共有可能か、そして静的(不変)か可変か"
      - "root権限が必要かどうかと、暗号化されているかどうか"
      - "ネットワーク経由でアクセスされるかどうかと、バイナリかテキストか"
    answerIndex: 1
    explanation: "FHSは「ホスト固有か、複数マシンで共有・使い回せるか」「静的で変わらないデータか、運用中に書き換わる可変データか」という2つの軸で各ディレクトリの役割を説明できます。"

  - question: "/etcが「ホスト固有・可変」というカテゴリに分類される理由として正しいものはどれか。"
    choices:
      - "/etc以下のファイルは自動的に暗号化されるため"
      - "/etc以下の設定は多くの場合、そのマシン専用の内容であり、管理者が手作業で書き換えるものだから"
      - "/etcはネットワーク越しにしかアクセスできないため"
      - "/etc以下のファイルはパッケージ管理システムが自動生成し、人間は触らないため"
    answerIndex: 1
    explanation: "/etc以下の設定ファイルは、そのマシン固有の内容であり、かつ管理者が人手で編集する可変データであるため、「ホスト固有・可変」というカテゴリの定位置になっています。"

  - question: "パッケージ管理システムのアップデートが/usr以下を新しいバージョンに差し替えても、/etc以下の手動編集した設定が保護されやすいのはなぜか。"
    choices:
      - "/usrと/etcが別々のディスクパーティションに強制的に分離されているため"
      - "プログラム本体(/usr)と設定(/etc)が物理的に別ディレクトリに分けられており、パッケージ管理システムが/etcの手動編集を検知して上書きを避ける挙動を取ることが多いため"
      - "/etc以下のファイルはroot以外書き込めない設定になっているため"
      - "パッケージ管理システムは/etc以下を一切参照しない仕様になっているため"
    answerIndex: 1
    explanation: "プログラム本体(/usr、使い捨てて良い)と設定(/etc、大事に保持すべき)が物理的に別ディレクトリに分けられているため、アップデート時に手動編集された設定ファイルの扱いを個別に確認する安全な更新フローが成立します。"

  - question: "コンテナ環境における/etc・/varの扱いについて、記事内で説明されている内容はどれか。"
    choices:
      - "コンテナイメージには/etcや/varを一切含めることができない"
      - "「ホスト固有・可変」という性質から、イメージそのものには焼き込まず、実行時に外部からマウントする対象として扱う設計判断につながっている"
      - "コンテナ環境では/etcと/usrの区別が完全に廃止されている"
      - "コンテナ環境ではすべてのディレクトリが/tmpと同じ扱いになる"
    answerIndex: 1
    explanation: "コンテナのような使い捨て前提の環境では、/etc・/varの「ホスト固有・可変」という性質が、イメージには焼き込まずbind mountやvolumeで外部から注入する対象として扱う設計判断に直結しています。"

  - question: "FHSがLinuxのほぼすべてのディストリビューションで守られている理由として、記事内で説明されているものはどれか。"
    choices:
      - "Linuxカーネル自体がFHSに反するファイル配置を技術的に拒否するため"
      - "主要ディストリビューションのパッケージ管理システムが、パッケージ開発者に対してFHSに従うことを事実上の前提として運用されているため"
      - "FHSに従わないと法律で罰せられるため"
      - "FHSは変更不可能なハードウェア仕様の一部として組み込まれているため"
    answerIndex: 1
    explanation: "FHSはLinux Foundationが管理する業界標準であり、カーネル自体が強制しているわけではありません。主要なパッケージ管理システムがFHSに従うことを事実上の前提として運用されているために、実務上ほぼ例外なく守られています。"
