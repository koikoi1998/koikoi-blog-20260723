questions:
  - question: "NO_PROPOSAL_CHOSENエラーが発生する原因として正しいのはどれか。"
    choices:
      - "双方のトラフィックセレクタ(サブネット宣言)が一致していない"
      - "双方が提示する暗号スイート(アルゴリズム・鍵長・DHグループ)の中に、完全に一致する組み合わせが存在しない"
      - "PSKの文字列が一致していない"
      - "UDPポート500がファイアウォールで塞がれている"
    answerIndex: 1
    explanation: "NO_PROPOSAL_CHOSENは、IKEフェーズで双方が提示した暗号スイートの候補の中に、完全に一致する組み合わせが1つも存在しない場合に発生します。"

  - question: "TS_UNACCEPTABLEエラーが発生する原因として正しいのはどれか。"
    choices:
      - "暗号アルゴリズムの鍵長が異なっている"
      - "トラフィックセレクタ(どのローカル/リモートサブネットの組み合わせを通すか)が一致していない"
      - "PSKの有効期限が切れている"
      - "DHグループのバージョンが古い"
    answerIndex: 1
    explanation: "TS_UNACCEPTABLEは、Phase2で交渉されるトラフィックセレクタ(サブネットの組み合わせ)が、双方で一致(または包含関係が成立)していない場合に発生します。"

  - question: "同一ベンダー同士の接続で暗号スイートの不一致が表面化しにくい理由として適切なのはどれか。"
    choices:
      - "同一ベンダーはIPsecを使わないため"
      - "管理画面のウィザードが、双方に同じデフォルトの暗号スイートを提案することが多いため"
      - "同一ベンダーではPhase2の交渉自体が行われないため"
      - "同一ベンダーは常に手動で暗号スイートを一致させる必要があるため"
    answerIndex: 1
    explanation: "同一ベンダー同士では、管理画面のウィザードが同じデフォルト値を提案しやすいため、暗号スイートの不一致が表面化しにくくなっています。"

  - question: "トラフィックセレクタの「ナローイング」によって起きうる障害として正しいのはどれか。"
    choices:
      - "接続自体が完全に確立できなくなる"
      - "設定上は/24同士を指定しているはずなのに、一部のホストとしか通信できない"
      - "PSKが自動的に無効化される"
      - "暗号アルゴリズムが自動的に弱いものに変更される"
    answerIndex: 1
    explanation: "一部のベンダーは、双方が宣言したサブネットの共通部分だけにSAの範囲を自動的に狭める(ナローイングする)挙動を持ち、これが原因分かりにくい部分的な通信障害につながります。"

  - question: "ナローイングが起きていないかを確認する際に見るべき出力として正しいのはどれか。"
    choices:
      - "ipsec statusallの出力に表示される、実際に確立されたトラフィックセレクタの範囲"
      - "journalctlのカーネルログのみ"
      - "wg showの出力"
      - "DNSのAレコード"
    answerIndex: 0
    explanation: "ipsec statusallの出力には、実際に確立されたSAのトラフィックセレクタ範囲が表示され、設定ファイルの値と突き合わせることでナローイングの有無を確認できます。"
