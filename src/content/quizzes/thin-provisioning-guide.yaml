questions:
  - question: "シンプロビジョニングが、シックプロビジョニングと異なる点として正しいのはどれか。"
    choices:
      - "ボリューム作成時に、実際の物理容量を丸ごと予約・確保する"
      - "ボリューム作成時には容量を予約せず、実際にデータが書き込まれた分だけ、後から物理領域を割り当てる"
      - "サーバー側に見せる容量を、常に実際の物理容量より小さく表示する"
      - "RAIDを使用できない"
    answerIndex: 1
    explanation: "シンプロビジョニングは、実際に書き込まれたデータの分だけ、物理領域を後から割り当てる方式です。"

  - question: "シンプロビジョニングが成立する鍵となる仕組みとして正しいのはどれか。"
    choices:
      - "すべてのデータを圧縮して保存する"
      - "論理容量(サーバーが認識する容量)と、物理容量(実際に消費されている容量)を、ストレージ装置内部で別々に管理する"
      - "複数のストレージ装置を、常に同期させる"
      - "ファイルシステムを使用しない"
    answerIndex: 1
    explanation: "論理容量と物理容量という、2つの別々の数字を個別に管理することで、シンプロビジョニングが成立します。"

  - question: "「オーバーコミット」という状態の説明として正しいのはどれか。"
    choices:
      - "ストレージ装置が過熱している状態"
      - "複数のボリュームの見かけの容量の合計が、実際の総容量を超えてしまっている状態"
      - "すべてのデータが暗号化されている状態"
      - "ネットワーク帯域が不足している状態"
    answerIndex: 1
    explanation: "オーバーコミットは、見かけの容量の合計が、実際のストレージ装置の総容量を超えている状態を指します。"

  - question: "オーバーコミットが進行した環境で起きる、深刻な障害として正しいのはどれか。"
    choices:
      - "サーバー側の論理容量の表示が、自動的に修正される"
      - "サーバー側では空き容量があるように見えても、実際の物理容量が枯渇し、書き込みが失敗する"
      - "すべてのボリュームが自動的に削除される"
      - "ネットワーク接続が切断される"
    answerIndex: 1
    explanation: "論理容量の表示だけでは予測できない、実際の物理容量枯渇による書き込み失敗という、深刻な障害が発生します。"

  - question: "シンプロビジョニングを安全に運用するための、最も重要な前提として正しいのはどれか。"
    choices:
      - "一度設定すれば、監視は不要になる"
      - "見かけの数字(論理容量)だけを見て安心せず、実際の物理容量の消費状況を継続的に監視する"
      - "常に最大容量のボリュームを作成する"
      - "RAID1だけを使用する"
    answerIndex: 1
    explanation: "シンプロビジョニングは、効率化と引き換えに、実際の物理容量の継続的な監視という責任を伴います。"
