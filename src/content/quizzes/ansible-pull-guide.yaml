questions:
  - question: "Ansibleの基本モデル(push型)が要求する前提として正しいのはどれか。"
    choices:
      - "対象ノード側が、制御ノードのIPアドレスを事前に知っていること"
      - "制御ノードが、すべての対象ノードのIPアドレスを事前に知っていて、対象ノード側にインバウンドSSHが開いていること"
      - "対象ノードが、インターネットに一切接続していないこと"
      - "制御ノードと対象ノードが、同じOSを使っていること"
    answerIndex: 1
    explanation: "Ansibleのpush型モデルは、制御ノードがすべての対象ノードのIPアドレスを事前に知っていて、対象ノード側にインバウンドのSSHポートが開いていることを要求します。"

  - question: "ansible-pullが、対象ノード自身の上で行う処理として正しいのはどれか。"
    choices:
      - "制御ノードへSSHで接続し、設定を取得する"
      - "gitリポジトリからPlaybookを取得し、localhost宛にローカル実行する"
      - "対象ノード自身を再起動する"
      - "制御ノードのIPアドレスを自動的に検出する"
    answerIndex: 1
    explanation: "ansible-pullは、対象ノード自身が指定されたgitリポジトリからPlaybookを取得し、接続先をlocalhostに固定したローカル実行として適用します。"

  - question: "ansible-pullを使う場合に、対象ノードが必要とするものとして正しいのはどれか。"
    choices:
      - "制御ノードからのインバウンドSSH接続"
      - "gitリポジトリへのアウトバウンドの到達性だけ"
      - "専用のVPN接続"
      - "制御ノードと同じサブネットに存在すること"
    answerIndex: 1
    explanation: "ansible-pullを使う場合、対象ノードが必要とするのは、gitリポジトリへのアウトバウンドの到達性だけであり、インバウンドのSSH接続は一切発生しません。"

  - question: "pull型が、オートスケーリング環境で特に有効な理由として正しいのはどれか。"
    choices:
      - "pull型の方が、push型より常に高速だから"
      - "新しいインスタンス自身が起動時にansible-pullを実行するだけで、制御ノード側の介入なしに構成が完了するから"
      - "pull型は、無料で使えるから"
      - "pull型は、Windowsサーバーにしか対応していないから"
    answerIndex: 1
    explanation: "pull型では、新しいインスタンス自身が起動時のユーザーデータからansible-pullを実行するだけで、制御ノード側の介入を一切必要とせずに構成が完了します。"

  - question: "pull型が、push型と比べて抱えるトレードオフとして正しいのはどれか。"
    choices:
      - "pull型は、Playbookの書き方自体が異なる"
      - "個々の対象ノードでの実行結果を、制御ノード側がリアルタイムに一元把握する手段が、既定では存在しない"
      - "pull型は、SSH自体を一切使えない"
      - "pull型は、Ansible Vaultを一切使えない"
    answerIndex: 1
    explanation: "pull型では、各ノードが自律的に実行するため、制御ノード側が個々の実行結果をリアルタイムに一元把握する仕組みが、既定では存在しません。"
