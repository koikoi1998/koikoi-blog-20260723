questions:
  - question: "クラウド環境で、静的な`inventory.ini`にIPアドレスを手書きする方法が問題になる理由は何か。"
    choices:
      - "Ansible自体がクラウド環境では動作しないため"
      - "EC2インスタンスは再起動のたびにパブリックIPアドレスが変わることが一般的なため"
      - "inventory.iniというファイル名がAWSで予約されているため"
      - "静的なファイルはセキュリティ上、常に危険であるため"
    answerIndex: 1
    explanation: "EC2インスタンスは、Elastic IPを使わない限り、再起動のたびにパブリックIPアドレスが変わることが一般的であり、手作業でのインベントリ更新が現実的でなくなります。"

  - question: "`amazon.aws.aws_ec2`という動的インベントリプラグインが実際に行っていることは何か。"
    choices:
      - "IPアドレスを完全にランダムに生成する"
      - "実行のたびにAWS APIへ問い合わせ、最新のインスタンス一覧を取得する"
      - "AWSのアカウント自体を新規作成する"
      - "EC2インスタンスを自動的に停止する"
    answerIndex: 1
    explanation: "amazon.aws.aws_ec2プラグインは、Ansible実行のたびにAWS APIへ問い合わせを行い、その時点の最新のインスタンス一覧を動的に取得します。"

  - question: "`keyed_groups`の設定は、何を実現するためのものか。"
    choices:
      - "SSH鍵を自動生成すること"
      - "AWS側のタグの値に応じて、Ansibleのグループを自動的に生成すること"
      - "Playbookの実行速度を計測すること"
      - "EC2インスタンスの課金額を計算すること"
    answerIndex: 1
    explanation: "keyed_groupsを設定すると、EC2インスタンスに付けたタグの値に応じて、Ansibleのグループが自動的に生成されます。"

  - question: "`control`ノード自体がEC2インスタンスである場合、動的インベントリのAWS API問い合わせにアクセスキーの設定は必須か。"
    choices:
      - "必須である。アクセスキーなしでは絶対に動作しない"
      - "必須ではない。IAMロールがアタッチされていれば、アクセスキーなしで認証できる"
      - "動的インベントリはAPIへの問い合わせを一切行わないため、認証自体が不要"
      - "アクセスキーの代わりに必ずパスワード認証が必要"
    answerIndex: 1
    explanation: "control ノードにIAMロールがアタッチされていれば、AWSのSDKが自動的にそのロールの一時的な認証情報を使うため、アクセスキーの設定は不要です。"

  - question: "動的インベントリの実務上の本当の価値は何か。"
    choices:
      - "静的ファイルよりもファイルサイズが小さくなること"
      - "オートスケーリングなどで台数が変動する環境でも、実行時点で実際に稼働しているインスタンスだけを自動的に対象にできること"
      - "Ansibleの実行速度が常に高速化されること"
      - "SSH接続自体が不要になること"
    answerIndex: 1
    explanation: "オートスケーリンググループなどでインスタンス数が変動する環境では、人間が正確な一覧を把握し続けることが非現実的であり、動的インベントリはその時点で実際に稼働しているインスタンスだけを自動的に対象にします。"
