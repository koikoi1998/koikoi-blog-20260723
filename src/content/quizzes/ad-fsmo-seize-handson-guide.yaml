questions:
  - question: "FSMOのシージ(Seize)を実行すべき状況として、最も適切なものはどれか。"
    choices:
      - "旧DCとの通信が一時的に不安定なだけの場合"
      - "旧DCが完全に失われ、二度と復旧しないと言い切れる場合"
      - "単に転送よりもシージの方が手順が速いと感じた場合"
      - "旧DCのメンテナンスウィンドウが取れない場合"
    answerIndex: 1
    explanation: "シージは、旧DCが完全に失われ、二度と復旧しない場合の最終手段です。復旧の可能性が少しでも残っているなら、正規の転送を優先すべきです。"

  - question: "シージを実行した後、絶対に行ってはいけないことは何か。"
    choices:
      - "メタデータクリーンアップを実施すること"
      - "シージした旧DCをネットワークに再接続すること"
      - "新DCでFSMOロールの保持者を確認すること"
      - "レプリケーションの健全性を確認すること"
    answerIndex: 1
    explanation: "シージ後、旧DCがまだ自分がFSMOロールを保持していると思い込んだまま復活すると、深刻な不整合が生じるため、旧DCを二度とネットワークに接続してはいけません。"

  - question: "メタデータクリーンアップの目的は何か。"
    choices:
      - "新DCのパフォーマンスを向上させるため"
      - "AD DS上に残っている、もう戻らないはずの旧DCの情報を完全に削除するため"
      - "FSMOロールを自動的に転送するため"
      - "レプリケーションのスケジュールを最適化するため"
    answerIndex: 1
    explanation: "メタデータクリーンアップは、AD DS上に残っている旧DCの情報を完全に削除し、旧DCが復活した場合の深刻な不整合を未然に防ぐために実施します。"

  - question: "5つのFSMOロールの中でも、シージ後に特に注意が必要とされるのはどれか。"
    choices:
      - "スキーママスター"
      - "RIDマスター"
      - "ドメイン名前付けマスター"
      - "PDCエミュレータ"
    answerIndex: 1
    explanation: "RIDマスターをシージした後、万が一旧DCが復活すると、新旧両方のDCが同じRIDプールから重複したRIDを配布してしまう可能性があるため、特に注意が必要です。"

  - question: "シージした旧DCを再びネットワークに参加させたい場合、どうする必要があるか。"
    choices:
      - "そのままの状態で再接続すればよい"
      - "OSを再インストールし、まったく新しいDCとして再構築する必要がある"
      - "FSMOロールを手動で書き戻せば、そのまま再接続できる"
      - "再接続すること自体が技術的に不可能である"
    answerIndex: 1
    explanation: "シージした旧DCをそのまま再接続することは絶対に避けるべきです。再利用する場合は、OSを再インストールし、まったく新しいDCとして再構築する必要があります。"
