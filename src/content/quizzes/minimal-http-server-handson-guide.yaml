questions:
  - question: "このハンズオンで作成するミニHTTPサーバーが使っている仕組みについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "Pythonの`http.server`モジュールとWebフレームワークの両方を使っている"
      - "Webフレームワークはおろか、標準搭載の`http.server`モジュールすら使わず、生のTCPソケットだけを使っている"
      - "IISの内部モジュールをPythonから呼び出すことで実現している"
      - "ブラウザの拡張機能として動作するため、サーバー側には何もインストールする必要がない"
    answerIndex: 1
    explanation: "このハンズオンのポイントは、Webフレームワークはおろか、Pythonに標準搭載されている`http.server`モジュールすら使わず、生のTCPソケットだけでHTTPサーバーを自作する点です。"

  - question: "ハンズオン内の`if path == \"/hello\":`という条件分岐について、記事の説明に最も合致するものはどれか。"
    choices:
      - "この条件分岐は、ASP.NETなどのフレームワークが持つ「ルーティング」機能とはまったく無関係である"
      - "ASP.NETやExpressのようなフレームワークが「ルーティング」と呼んでいる機能の、最も原始的な姿であり、フレームワークはこれをURLパターンのマッチングとして便利に扱えるようにしているだけである"
      - "この条件分岐は、HTTPSを使う場合にのみ必要になる特殊な処理である"
      - "この条件分岐がなければ、そもそもHTTPサーバーとして動作しない"
    answerIndex: 1
    explanation: "path文字列による分岐処理は、フレームワークが「ルーティング」と呼んでいる機能の最も原始的な姿です。フレームワークはこれをURLパターンのマッチングや設定ファイルとして便利に扱えるようにしているだけで、やっていること自体の本質は変わりません。"

  - question: "このミニサーバーに欠けている要素について、記事の説明に最も合致するものはどれか。"
    choices:
      - "同時接続の処理、HTTP仕様への正確な準拠、セキュリティ対策(入力値検証・TLS対応など)が欠けている"
      - "このミニサーバーは、IISやNginxよりもすべての面で優れている"
      - "このミニサーバーには、欠けている要素は一切ない"
      - "このミニサーバーは、HTMLを一切返すことができない"
    answerIndex: 0
    explanation: "このミニサーバーには、同時接続の処理、チャンク転送エンコーディングなどHTTP仕様への正確な準拠、入力値検証やTLS対応といったセキュリティ対策が欠けており、実務でそのまま使うのは危険です。"

  - question: "「自分でHTTPサーバーを作れること」と「実務でIIS・Nginxを使うべきであること」の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "自分で作れるのであれば、実務でも自作したものを使うべきである"
      - "この2つはまったく矛盾せず、原理を理解した上で実績のある実装を使うという判断ができることこそが上位1%の理解である"
      - "自分でHTTPサーバーを作れることと、実務での実装選定は完全に無関係な話である"
      - "IISやNginxは、個人が自作したサーバーよりも常に遅い"
    answerIndex: 1
    explanation: "「自分でも作れる」ということと「実務では自作せず実績のある実装を使うべきである」ということはまったく矛盾しません。原理を理解した上で「餅は餅屋」の判断ができることこそが、上位1%の理解です。"
