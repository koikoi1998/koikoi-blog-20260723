questions:
  - question: "GPO(グループポリシーオブジェクト)の実体について、記事の説明に最も合致するものはどれか。"
    choices:
      - "AD DS上に1つのオブジェクトとしてまるごと保存されている"
      - "AD DS上のGPC(設定の骨組み)と、SYSVOL上のGPT(設定の実体ファイル)という、2つの独立した部分の組み合わせでできている"
      - "SYSVOL上にのみ保存されており、AD DSとは一切関係がない"
      - "すべてのDCのローカルディスク上に、それぞれ独立して個別に作成される"
    answerIndex: 1
    explanation: "GPOは、AD DS上のGPC(グループポリシーコンテナー、設定の骨組みとバージョン番号)と、SYSVOL上のGPT(グループポリシーテンプレート、設定の実体ファイル)という、2つの独立した部分の組み合わせでできています。"

  - question: "GPCとGPTが、それぞれ別のレプリケーションの仕組みで複製される理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "GPCは通常のAD DSオブジェクトなのでAD DSレプリケーションで、GPTはファイルなのでSYSVOLの一部としてDFSRで複製されるため"
      - "単なる歴史的な偶然であり、技術的な理由は特にない"
      - "GPCとGPTは実際には同じレプリケーションの仕組みを使っている"
      - "GPTの方がGPCより優先的に複製されるよう、意図的に設計されている"
    answerIndex: 0
    explanation: "GPCは通常のAD DSオブジェクトの一種なので、ドメインパーティションの一部として通常のAD DSレプリケーションで複製されます。一方GPTはファイルであるため、SYSVOLというファイル共有の一部として、DFSRという専用のファイルレプリケーション機構によって複製されます。"

  - question: "DFSRとFRSの決定的な違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "FRSはファイルの変更があったブロックだけを複製するが、DFSRはファイル全体をまるごと複製する"
      - "FRSはファイルのどこか1バイトでも変更されるとファイル全体をまるごと複製するが、DFSRはRDCという技術でブロック単位の差分だけを複製する"
      - "DFSRとFRSは、実装が違うだけでファイル転送の仕組み自体はまったく同じである"
      - "FRSの方がDFSRより新しい技術であり、DFSRの後継として開発された"
    answerIndex: 1
    explanation: "FRSはファイルのどこか1バイトでも変更されると、そのファイル全体をまるごと複製先へ転送していました。一方DFSRはRDC(Remote Differential Compression)という技術を使い、実際に変更があったブロックだけを転送します。"

  - question: "GPOのバージョン不一致(GPCとGPTのバージョン番号のずれ)が起こりうる理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "GPCとGPTは常に完全に同期しており、バージョン不一致は理論上発生し得ない"
      - "AD DSレプリケーション(GPC側)とDFSRレプリケーション(GPT側)が、それぞれ独立した経路・タイミングで複製されるため、一方が先に完了しもう一方が追いついていない状態が一時的に発生しうる"
      - "GPCとGPTは手動で同期させない限り、常にバージョンがずれたままになる"
      - "バージョン不一致は、DFSRを使っているドメインでは絶対に起こらない"
    answerIndex: 1
    explanation: "GPCはAD DSレプリケーションで、GPTはDFSRレプリケーションで、それぞれ独立した経路・タイミングで複製されるため、一方が先に完了してもう一方がまだ追いついていない状態が一時的に発生することがあります。これがGPOバージョン不一致の正体です。"

  - question: "`dfsrdiag`コマンドの役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "AD DSデータそのものの複製状況を確認するコマンドであり、repadminと同じ役割を持つ"
      - "SYSVOLというファイルの複製状況(DFSR)を確認するための、AD DSデータとは別のレイヤーを見る専用コマンドである"
      - "グループポリシーの設定内容を編集するためのコマンドである"
      - "ドメインコントローラーを昇格・降格させるためのコマンドである"
    answerIndex: 1
    explanation: "repadminがAD DSデータそのものの複製状況を見るコマンドだったのに対し、dfsrdiagはSYSVOLというファイルの複製状況(DFSR)を見る専用コマンドです。GPO関連のトラブルシューティングでは、この2つを両方確認することで、GPCとGPTのどちらの複製が遅れているのかを正確に切り分けられます。"
