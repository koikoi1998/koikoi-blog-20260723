questions:
  - question: "拠点間VPN(Site-to-Site VPN)とリモートアクセスVPN(L2TP/IPsecなど)の最も本質的な違いとして、記事内で説明されているものはどれか。"
    choices:
      - "拠点間VPNは常にTCPを使い、リモートアクセスVPNは常にUDPを使うという違い"
      - "接続主体が「拠点のVPNゲートウェイ同士」か「個々のクライアント端末とVPNサーバー」かという接続形態そのものの違い"
      - "拠点間VPNには暗号化機能が一切なく、リモートアクセスVPNだけが暗号化されるという違い"
      - "拠点間VPNはIPv6専用であり、リモートアクセスVPNはIPv4専用であるという違い"
    answerIndex: 1
    explanation: "記事では、拠点間VPNとリモートアクセスVPNの最大の違いは「誰と誰をつなぐか」という接続形態そのものだと説明しています。拠点間VPNはゲートウェイ同士、リモートアクセスVPNはクライアント端末とVPNサーバーを1対1でつなぎます。"

  - question: "拠点間VPNがIPsecのトンネルモードを使う理由として、記事内で説明されているものはどれか。"
    choices:
      - "トンネルモードの方が暗号化アルゴリズムの強度が高いため"
      - "拠点間VPNにはL2TPのようなトンネル生成専用の仕組みが存在せず、IPsec自身がトンネルを作る役目を1人で担う必要があるため"
      - "トランスポートモードはIPv6でしか使えないため"
      - "トンネルモードの方が実効MTUが大きくなり、フラグメンテーションが起きにくいため"
    answerIndex: 1
    explanation: "L2TP/IPsecではL2TPがすでにトンネルを作っているためトランスポートモードで済みますが、拠点間VPNにはそのような仕組みがないため、IPsec自身が元のIPパケット全体を新しい外側IPヘッダーで包むトンネルモードを使う必要があります。"

  - question: "拠点間VPNにおける「トラフィックセレクタ(プロキシID)」について、記事内の説明として正しいものはどれか。"
    choices:
      - "接続してきたユーザーのユーザー名とパスワードを識別するための情報である"
      - "IKEフェーズ2で交換される、どのローカルサブネットとどのリモートサブネットの組み合わせをトンネルに通すかを宣言する情報である"
      - "VPNゲートウェイのMACアドレスを識別するための情報である"
      - "IKEフェーズ1で使われる事前共有鍵(PSK)そのものを指す用語である"
    answerIndex: 1
    explanation: "拠点間VPNには個人認証の概念がなく、代わりにIKEフェーズ2でトラフィックセレクタ(プロキシID)を交換し、「どのローカルサブネットとどのリモートサブネットの間の通信をこのトンネルに通すか」を両ゲートウェイで一致させる必要があります。"

  - question: "拠点間VPNの認証モデルについて、記事内の説明として最も適切なものはどれか。"
    choices:
      - "リモートアクセスVPNと同様に、PPP層でユーザー名・パスワードによる個人認証が行われる"
      - "ゲートウェイ単位のPSKまたは証明書による認証のみが行われ、個人単位の認証という概念自体が存在しない"
      - "拠点間VPNには認証の仕組みが一切なく、誰でも自由にトンネルへ接続できる"
      - "拠点間VPNはIPアドレスだけで無条件に信頼し、鍵や証明書による認証を行わない"
    answerIndex: 1
    explanation: "拠点間VPNのIKEフェーズ1では機器/ゲートウェイ単位のPSKまたは証明書による認証のみが行われ、個々の利用者を識別する仕組みは存在しません。個人単位のアクセス制御はトンネルの先にある別の仕組みに委ねられます。"

  - question: "ポリシーベースVPNとルートベースVPNの違いについて、記事内の説明として正しいものはどれか。"
    choices:
      - "ポリシーベースVPNはルーティングテーブルで暗号化対象を決め、ルートベースVPNはACLで暗号化対象を決める"
      - "ポリシーベースVPNはローカル/リモートサブネットの組み合わせごとに独立したSAを作るため、サブネット数が増えるとSA数が組み合わせ的に増大しやすいが、ルートベースVPNはルーティングテーブルで通す通信を決めるためスケーラビリティに優れる"
      - "ルートベースVPNは動的ルーティングプロトコルを一切使用できない"
      - "ポリシーベースVPNとルートベースVPNの間に実務上の違いは存在しない"
    answerIndex: 1
    explanation: "ポリシーベースVPNはトラフィックセレクタの組み合わせごとに独立したIPsec SAが作られるため、サブネット数の増加でSA数が組み合わせ的に増大します。ルートベースVPNはトンネルインターフェースへのルーティングで通す通信を決めるため、多拠点・多サブネット環境でのスケーラビリティに優れます。"

  - question: "CiscoとWatchGuardという異なるベンダー間で拠点間VPNを組む際に、記事内で最も頻出するクロスベンダーの障害原因として説明されているものはどれか。"
    choices:
      - "両ベンダーがまったく異なるTCP/IPスタックを実装しているため、根本的に通信できない"
      - "フェーズ1/フェーズ2の暗号化アルゴリズムやトラフィックセレクタの粒度が双方で一致しておらず、特にトラフィックセレクタの不一致がネゴシエーション失敗の主な原因になりやすい"
      - "WatchGuard製品はIPsecに対応しておらず、そもそも接続自体ができない"
      - "Cisco製品は事前共有鍵(PSK)による認証をサポートしていない"
    answerIndex: 1
    explanation: "記事では、異なるベンダー間で拠点間VPNを組む際、フェーズ1/フェーズ2のパラメータを1対1で完全に一致させる必要があり、特にトラフィックセレクタの粒度の不一致が最も頻出するトラブルの原因になると説明しています。"

  - question: "拠点間VPNにおけるトンネルモードの実効MTUへの影響について、記事内の説明として正しいものはどれか。"
    choices:
      - "トンネルモードは元のIPヘッダーを維持するため、トランスポートモードよりオーバーヘッドが小さい"
      - "トンネルモードは新しい外側IPヘッダーをまるごと追加するため、トランスポートモードより単純にオーバーヘッドが大きくなりやすい"
      - "トンネルモードとトランスポートモードでオーバーヘッドの差は一切生じない"
      - "実効MTUの縮小は拠点間VPN特有の現象であり、リモートアクセスVPNでは発生しない"
    answerIndex: 1
    explanation: "拠点間VPNのトンネルモードは元のIPパケットに新しい外側のIPヘッダーをまるごと追加するため、トランスポートモードより単純にオーバーヘッドが大きくなり、条件によっては50〜70バイト程度のオーバーヘッドになると説明されています。"

  - question: "「トンネルモードを使えば、トランスポートモードより暗号強度が上がる」という考え方について、記事内での位置づけとして最も適切なものはどれか。"
    choices:
      - "正しい。トンネルモードはより長い鍵長を強制するため暗号強度が上がる"
      - "誤解である。モードの違いはパケットのどの範囲を新しい外側ヘッダーで包み直すかという適用範囲の違いであり、暗号化アルゴリズム自体の強度や鍵長には関係しない"
      - "正しい。トンネルモードは二重に暗号化を行うため暗号強度が上がる"
      - "この主張は記事では扱われていない"
    answerIndex: 1
    explanation: "記事では、トンネルモードとトランスポートモードの違いは適用範囲の違いであり、暗号化アルゴリズムの強度や鍵長には一切関係しないとして、この考え方を誤解の1つに挙げています。"
