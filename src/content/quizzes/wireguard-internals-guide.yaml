questions:
  - question: "WireGuardのCryptokey Routingが、経路制御をどのように実現していると記事内で説明されているか。"
    choices:
      - "IPsecのSPDと同様の、公開鍵とは別の専用ルールセットを使う"
      - "公開鍵とAllowedIPs(許可するIPアドレス範囲)を1対1で結びつけたpeer設定そのものが、認証と経路制御を同時に担う"
      - "ルーティングプロトコル(BGPなど)をWireGuardの内部に実装している"
      - "接続のたびにDNSに問い合わせて経路を決定する"
    answerIndex: 1
    explanation: "WireGuardには専用の照合ルールが別途存在せず、公開鍵とAllowedIPsを1対1で結びつけたpeer設定自体が認証と経路制御を同時に担うと説明されています。"

  - question: "WireGuardのハンドシェイクが基づいている`Noise_IK`パターンの「IK」が意味することとして、記事内の説明はどれか。"
    choices:
      - "InitiatorもResponderも、互いの静的鍵を一切知らない状態から始まる"
      - "Initiatorの静的鍵は事前に知られておらず、Responderの静的鍵はすでに知られている(Known)"
      - "InternetとKernelの略で、カーネル空間で処理されることを示す"
      - "IKEv2と互換性のあるモードであることを示す"
    answerIndex: 1
    explanation: "「I」はInitiatorの静的鍵が事前に知られていないこと、「K」はResponderの静的鍵がすでに知られている(Known)ことを表すNoiseフレームワークの命名規則だと説明されています。"

  - question: "WireGuardのハンドシェイクがDoS攻撃への耐性を持つ仕組みとして、記事内で説明されているものはどれか。"
    choices:
      - "短時間に大量のハンドシェイク要求を受け取ったResponderが、軽量なCookieを要求し、正しいCookieを再送してきた相手にだけ本格的なDH演算を行う"
      - "ハンドシェイク要求を送れるIPアドレスをあらかじめ固定リストに限定する"
      - "すべてのハンドシェイク要求を一定時間バッファリングしてからまとめて処理する"
      - "DH演算自体を一切行わず、事前共有鍵だけで認証する"
    answerIndex: 0
    explanation: "計算コストの低いCookieによる足切りを先に行うことで、なりすまし送信元からの負荷攻撃に対して軽いコストで対処できると説明されています。"

  - question: "WireGuardがIPアドレスの変化(モバイル回線への切り替えなど)に強い理由として、記事内の説明はどれか。"
    choices:
      - "IKEv2のMOBIKEと同じ専用拡張プロトコルを実装しているため"
      - "Responderが、正しい鍵で復号できた最新パケットの送信元を自動的にそのpeerの現在のエンドポイントとして学習するため"
      - "WireGuardはそもそもIPアドレスを使わずMACアドレスだけで通信するため"
      - "クライアントのIPアドレスが変化するたびに新しい鍵ペアを生成し直すため"
    answerIndex: 1
    explanation: "専用の拡張機能ではなく、正しい鍵で復号できた送信元を動的にエンドポイントとして学習する認証の仕組み自体の副産物としてローミング耐性が生まれると説明されています。"

  - question: "素のWireGuardが大規模組織への導入で実務上の課題を抱えるとされる理由として、記事内の説明はどれか。"
    choices:
      - "暗号化アルゴリズムが弱く、大量の通信を処理できないため"
      - "公開鍵の事前配布・失効を自動化する仕組みが標準では存在せず、規模が大きくなるほど鍵配布の運用コストが増すため"
      - "WireGuardはUDPしか使えず、TCPでの通信が一切できないため"
      - "1つのサーバーにつき1つのpeerしか登録できない制限があるため"
    answerIndex: 1
    explanation: "CAが鍵の発行・失効を一元管理するPKIと異なり、素のWireGuardには鍵配布・失効の自動化機構が標準では存在せず、大規模組織ではこれが実務上の課題になると説明されています。"
