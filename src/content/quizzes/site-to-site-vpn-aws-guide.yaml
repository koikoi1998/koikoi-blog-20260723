questions:
  - question: "AWSのCGW(Customer Gateway)の正体について、記事の説明に最も合致するものはどれか。"
    choices:
      - "CGWは、AWS上に新設される物理的なVPN終端機器である"
      - "CGWは物理的な機器ではなく、オンプレミス側のVPN機器の公開IPアドレスとBGP ASNをAWSに登録しておくための設定情報(リソース)である"
      - "CGWは、オンプレミス側のユーザーがAWSにログインするための認証用ゲートウェイである"
      - "CGWは、AWSのグローバルバックボーンネットワークそのものを指す用語である"
    answerIndex: 1
    explanation: "CGWの実体は単なる設定情報(リソース)であり、実際にVPN終端の処理を行う物理的な実機はオンプレミス側にあります。CGWは、AWS側が相手のオンプレミス機器のIPアドレスとASNを認識するための登録台帳のようなものです。"

  - question: "IGWとVGWの役割の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "IGWとVGWはまったく同じ役割を持つ、単なる別名である"
      - "IGWはVPCの直接インターネット接続用のゲートウェイでVPNとは無関係、VGWはVPN接続を終端するAWS側のゲートウェイである"
      - "IGWはVPN接続専用のゲートウェイで、VGWはインターネット接続専用のゲートウェイである"
      - "IGWとVGWはどちらもオンプレミス側に設置する物理機器である"
    answerIndex: 1
    explanation: "IGW(Internet Gateway)はVPC内のリソースが一般的なインターネットと直接通信するためのゲートウェイで、VPNとは無関係です。VGW(Virtual Private Gateway)はオンプレミスからのIPsec VPN接続をAWS側で受け止める窓口です。"

  - question: "拠点間VPNの通信経路について、記事の説明に最も合致するものはどれか。"
    choices:
      - "標準的なSite-to-Site VPNの通信は、オンプレミス機器とAWSのVGW/TGWの間では一般的なインターネットを経由するが、AWSはDirect Connectという専用線サービスも別途提供している"
      - "AWSとのVPN通信は、常に一切インターネットを経由せずAWS専用の物理線だけを流れる"
      - "Site-to-Site VPNを構築すると、自動的にDirect Connectと同じ専用線が新たに敷設される"
      - "AWSのリージョン間通信は、常に一般的なインターネットを経由している"
    answerIndex: 0
    explanation: "標準的なAWS Site-to-Site VPNでは、オンプレミス側の機器とAWS側のVGW/TGWの間の通信は暗号化されたIPsecパケットとして一般的なインターネットを経由します。AWSはDirect Connectという、インターネットを経由しない専用の物理的な接続を提供する別サービスも用意しています。"

  - question: "VGWとTGWの使い分けについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "VGWは1つのVPCに1対1で紐づくシンプルな構成であり、複数のVPCやアカウントをまとめて接続したい場合はTGWが集約点として使われる"
      - "VGWとTGWは完全に同一の機能を持ち、名前が違うだけである"
      - "TGWは1つのVPCにしか接続できず、VGWは複数のVPCに接続できる"
      - "VGWは有料、TGWは無料で利用できるゲートウェイである"
    answerIndex: 0
    explanation: "VGWは1つのVPCに対して1対1で紐づく、シンプルな構成です。複数のVPCやAWSアカウントをまとめて接続したい場合、VPCごとに個別のVGWを用意すると管理対象が増えるため、複数のVPC・VPN接続・Direct Connectを1つのハブに集約するTGWが使われます。"

  - question: "2本のトンネルの冗長化について、記事が指摘する実務上の注意点として最も合致するものはどれか。"
    choices:
      - "AWS側で2本のトンネルが構成されれば、オンプレミス側の設定を確認しなくても自動的に両方が確立・維持される"
      - "AWS側では冗長化のため2本のトンネルが構成されるが、オンプレミス側の機器の設定によっては実際には1本しか確立されていない状態に陥ることがあり、構築後に両方のステータスが「UP」であることを確認する必要がある"
      - "2本のトンネルのうち1本は常に無効化しておくべきである"
      - "トンネルの本数は、オンプレミス側の機器のメーカーによって自動的に1本か2本かが決まる"
    answerIndex: 1
    explanation: "AWSのSite-to-Site VPN接続は冗長化のため既定で2本のトンネルが構成されますが、オンプレミス側の機器の設定によっては実際には1本しか確立されていない状態に陥ることが実務では珍しくありません。構築後は必ず両方のトンネルのステータスが「UP」になっていることを確認する習慣が重要です。"
