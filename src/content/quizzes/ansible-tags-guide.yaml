questions:
  - question: "Ansibleの`tags`キーワードの役割として正しいのはどれか。"
    choices:
      - "タスクを自動的に選択・除外する"
      - "タスクにラベルを付けるだけで、実際の選択・除外は実行時のオプションが行う"
      - "タスクの実行順序を決定する"
      - "変数の優先順位を決定する"
    answerIndex: 1
    explanation: "tagsキーワードは、タスクにラベルを付けるだけの機能であり、実際に選択・除外するのは、実行時の--tags/--skip-tagsオプションです。"

  - question: "`include_tasks`に付けたタグの挙動として正しいのはどれか。"
    choices:
      - "ファイル内の個々のタスクまで、自動的に伝播する"
      - "includeタスク自体にしか適用されず、ファイル内の個々のタスクには伝播しない"
      - "タグを付けることができない"
      - "常にすべてのタスクをスキップする"
    answerIndex: 1
    explanation: "include_tasksに付けたタグは、includeタスクそのものにしか適用されず、ファイルの中に書かれている個々のタスクには伝播しません。"

  - question: "`import_tasks`に付けたタグの挙動として正しいのはどれか。"
    choices:
      - "includeタスク自体にしか適用されない"
      - "インポートされた個々のタスクまで、正しく伝わる"
      - "タグ自体が無視される"
      - "常にエラーになる"
    answerIndex: 1
    explanation: "import_tasksは、Playbookの解析時に静的にファイルの内容を展開するため、タグが個々のタスクまで正しく伝わります。"

  - question: "`always`タグが付いたタスクの挙動として正しいのはどれか。"
    choices:
      - "`--tags`でどのタグを指定していても、常に実行される(明示的に--skip-tags alwaysで除外しない限り)"
      - "明示的に指定しない限り、常にスキップされる"
      - "常にエラーで終了する"
      - "一度しか実行できない"
    answerIndex: 0
    explanation: "alwaysタグが付いたタスクは、--tagsでどのタグを指定していても常に実行されます。ただし--skip-tags alwaysで明示的に除外した場合は除きます。"

  - question: "『タグを指定したのに期待したタスクが実行されない』という問題に遭遇したとき、まず確認すべきこととして正しいのはどれか。"
    choices:
      - "ネットワーク接続が正常かどうか"
      - "対象のタスクが、include_tasks経由で読み込まれていないか"
      - "Ansibleのバージョンが最新かどうか"
      - "SSH鍵のパーミッションが正しいかどうか"
    answerIndex: 1
    explanation: "実務で『タグが効かない』という問題に遭遇したとき、多くの場合、原因は対象のタスクがinclude_tasks経由で読み込まれている、というケースです。"
