questions:
  - question: ".pemと.ppkの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "両者は同じ秘密鍵情報を格納する異なるファイル形式であり、鍵自体の暗号アルゴリズムや安全性に違いはない"
      - ".pemは暗号強度が高く、.ppkは暗号強度が低い、明確に異なる種類の鍵である"
      - ".pemはLinux専用、.ppkはmacOS専用の、互換性のない鍵形式である"
      - ".pemは公開鍵、.ppkは秘密鍵を指す、まったく別の概念である"
    answerIndex: 0
    explanation: ".pemと.ppkは、同じ秘密鍵の情報を異なるファイル形式で表現したものです。鍵自体が使っている暗号アルゴリズムや、鍵としての安全性そのものに違いはなく、PuTTYgenでの変換は同じ鍵情報を異なる形式へ再エンコードしているだけの操作です。"

  - question: "AWSからダウンロードできるキーペアの既定の形式と、PuTTYで接続する際に必要な作業について、記事の説明に最も合致するものはどれか。"
    choices:
      - "AWSは既定で.ppk形式のみを提供しており、OpenSSHで接続する場合に変換が必要になる"
      - "AWSがEC2のキーペア作成時にダウンロードできるのは既定で.pem形式であり、PuTTYで接続したい場合はPuTTYgenで.ppk形式へ変換する必要がある"
      - "AWSは.pemと.ppkの両方を同時に、変換作業なしでそのままダウンロードできる"
      - "PuTTYは.pem形式のファイルを直接読み込めるため、変換作業は一切不要である"
    answerIndex: 1
    explanation: "AWSがEC2のキーペア作成時にダウンロードできるのは既定では.pem形式です。PuTTYはこの独自形式(.ppk)以外のファイルを直接読み込めないため、PuTTYで接続したい場合は、PuTTYgenで.pem形式のファイルを.ppk形式へ変換する必要があります。"

  - question: "AWSのサブネットで予約されているIPアドレスの総数と、その内訳について、記事の説明に最も合致するものはどれか。"
    choices:
      - "先頭4つ(ネットワークアドレス、ルーター、DNSサーバー、将来の予約)と末尾1つ(ブロードキャストアドレス)の合計5つが予約されている"
      - "先頭1つと末尾1つの合計2つだけが予約されている"
      - "サブネット内のすべてのIPアドレスが予約されており、実際に割り当てられるIPアドレスは存在しない"
      - "予約されているIPアドレスの数は、サブネットのサイズによって毎回ランダムに変化する"
    answerIndex: 0
    explanation: "AWSのサブネットでは、先頭4つ(ネットワークアドレス、VPCルーター用、Amazon DNSサーバー用、将来の用途のための予約)と末尾1つ(ネットワークブロードキャストアドレス)の合計5つのIPアドレスが予約され、割り当てに使用できません。"

  - question: "サブネット内の10.0.0.2というIPアドレスの用途について、記事の説明に最も合致するものはどれか。"
    choices:
      - "そのサブネットの管理者用のログインパスワードを保存するために予約されている"
      - "VPC内のインスタンスが名前解決を行う際に問い合わせる、Amazon提供のDNSサーバー(Route 53 Resolver)のアドレスとして機能する"
      - "そのサブネットに接続できる最大インスタンス数を示す設定値である"
      - "10.0.0.2は、AWSのサブネットでは一切予約されておらず、自由に割り当て可能である"
    answerIndex: 1
    explanation: "10.0.0.2は、VPC内のインスタンスが名前解決を行う際に問い合わせる、Amazon提供のDNSサーバー(Route 53 Resolver)のアドレスとして機能するために予約されています。"

  - question: "サブネットサイズを設計する際に注意すべき点について、記事の説明に最も合致するものはどれか。"
    choices:
      - "CIDR範囲のホスト数が、そのままインスタンスへ割り当てられる台数になるため、予約IPアドレスを考慮する必要はない"
      - "実際に割り当て可能なIPアドレス数は、CIDR範囲のホスト数から予約された5つを差し引いた数になるため、小さすぎるサブネットではこの影響が相対的に大きくなる"
      - "サブネットのサイズは、常に/24に固定しなければならず、変更することはできない"
      - "予約IPアドレスの数は、リージョンによって異なるため、事前に確認する必要がない"
    answerIndex: 1
    explanation: "実際に割り当て可能なIPアドレス数は、CIDR範囲のホスト数から予約された5つを差し引いた数になります。小さすぎるサブネット(/28など)を多数作成する構成では、この5つの予約IPアドレスの影響が相対的に大きくなり、想定より早くIPアドレスが枯渇する事態につながりえます。"
