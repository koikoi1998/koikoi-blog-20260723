questions:
  - question: "この卒業制作の形式が、これまでのAnsibleハンズオンと異なる点として正しいのはどれか。"
    choices:
      - "決められた手順を、より速く実行することが求められる"
      - "要件だけが提示され、どの技術をどう組み合わせるかを自分で設計することが求められる"
      - "新しいAnsibleモジュールを1つだけ新たに学ぶことが求められる"
      - "YAMLではなくJSONだけでPlaybookを書くことが求められる"
    answerIndex: 1
    explanation: "この卒業制作は、手順をなぞる形式ではなく、要件から自分で設計することを求める、実務に近い形式です。"

  - question: "この卒業制作で最終的に求められる成果物として正しいのはどれか。"
    choices:
      - "Playbookの実行結果のログだけ"
      - "設計判断の理由を言語化した文書を含む、ポートフォリオとしてまとめた成果物"
      - "使用したモジュールの一覧だけ"
      - "口頭での説明のみで、文書化は不要"
    answerIndex: 1
    explanation: "成果物には、実行結果だけでなく、なぜその設計を選んだかという判断理由を言語化した文書が必要です。"

  - question: "この卒業制作が「複数環境の構成管理」という設定を採用している理由として正しいのはどれか。"
    choices:
      - "単一環境の方が構築が難しいため"
      - "実務のAnsible導入の多くが、複数の環境を継続的に、安全に使い分け続ける必要があるため"
      - "Ansibleは複数環境でしか動作しないため"
      - "他のシナリオでは技術的に実現できないため"
    answerIndex: 1
    explanation: "実務のAnsible導入は、単一環境への1回限りの投入では完結せず、複数環境を継続的に安全に運用する必要があることが多いため、この設定が採用されています。"

  - question: "「手順をなぞる力」と「要件から設計する力」の関係についての正しい理解はどれか。"
    choices:
      - "両者はまったく同じスキルであり、区別する必要はない"
      - "似ているようで、まったく別のスキルであり、個々のハンズオンの完了だけでは後者は身につかない"
      - "手順をなぞる力さえあれば、設計する力は自動的に身につく"
      - "設計する力は、資格試験でのみ評価される"
    answerIndex: 1
    explanation: "この2つは似ているようでまったく別のスキルであり、個々のハンズオンをすべて完了していても、組み合わせて設計した経験がなければ身につきません。"

  - question: "このハンズオンで、完成度の目安として提案されている基準はどれか。"
    choices:
      - "すべての要件を最短時間で終わらせられるかどうか"
      - "初対面の面接官にREADME.mdを見せて、設計判断を説明できるかどうか"
      - "使用したroleの数が最も多いかどうか"
      - "Ansible Galaxyを一切使わずに完了できたかどうか"
    answerIndex: 1
    explanation: "初対面の面接官にREADME.mdを見せて、設計判断を説明できるかどうかが、完成度の目安として提案されています。"
