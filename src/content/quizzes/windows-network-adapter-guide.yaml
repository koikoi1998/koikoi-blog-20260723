questions:
  - question: "Wi-Fiを有効にしたまま有線LANケーブルを接続すると、有線LAN側の機器へ到達できなくなることがある理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Wi-Fiと有線LANは物理的に同時使用できない仕様になっているため"
      - "各アダプタに割り当てられたインターフェースメトリックの値により、Wi-Fiアダプタのメトリックが有線LANより小さい(優先度が高い)場合、意図した有線LAN側の経路ではなくWi-Fi側のデフォルトゲートウェイへ向けて送信されてしまうため"
      - "有線LANケーブルは、Wi-Fiが有効な間は物理的に通電しない仕様になっているため"
      - "Windowsは常に最後に接続したアダプタを自動的に無効化する仕様になっているため"
    answerIndex: 1
    explanation: "各ネットワークアダプタにはインターフェースメトリックという優先順位の数値があり、値が小さいほど優先度が高くなります。Wi-Fiアダプタのメトリックが有線LANより小さい状態になっていると、有線LAN側への通信であってもWi-Fi側のデフォルトゲートウェイへ向けて送信されてしまい、意図した経路が使われないことがあります。"

  - question: "Windowsの自動メトリック計算について、記事の説明に最も合致するものはどれか。"
    choices:
      - "自動メトリックは、そのアダプタのリンク速度をもとに機械的に計算されるものであり、そのアダプタが実際に到達したいネットワークへの経路として適切かどうかとは無関係である"
      - "自動メトリックは、ユーザーが過去にそのネットワークを利用した頻度をもとに計算される"
      - "自動メトリックは、常にすべてのアダプタに同じ値を割り当てる"
      - "自動メトリックは、Windowsの起動時刻(何時に起動したか)をもとに計算される"
    answerIndex: 0
    explanation: "Windowsの既定設定(自動メトリック)では、インターフェースメトリックはそのアダプタのリンク速度をもとに機械的に計算されます。これは実際にそのアダプタが到達したいネットワークへの経路として適切かどうかとは無関係であり、意図と異なる優先順位になる場合は手動で指定する必要があります。"

  - question: "ネットワークプロファイル(ドメイン/プライベート/パブリック)の判定について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ネットワークプロファイルはPC全体で1つに決まり、すべてのアダプタに同じプロファイルが適用される"
      - "ネットワークプロファイルはNLAというサービスによってアダプタごとに個別に判定され、Windowsファイアウォールのプロファイルもアダプタ単位で適用される"
      - "ネットワークプロファイルは、ユーザーがログインするたびにランダムに変わる"
      - "ネットワークプロファイルは、CPUの使用率に応じて自動的に決定される"
    answerIndex: 1
    explanation: "ネットワークプロファイルはNLA(Network Location Awareness)というサービスによってアダプタごとに個別に判定されます。同じPC上の複数のアダプタが、それぞれ異なるプロファイル(ドメイン/プライベート/パブリック)を持つことは普通にあり、Windowsファイアウォールもアダプタ単位でプロファイルを適用します。"

  - question: "NICチーミング+複数論理NIC環境の事例で、ゲートウェイを持つ論理NICだけが個別に「イーサネット4」として認識された理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "その論理NICだけが物理的に別のケーブルに接続されていたため"
      - "ゲートウェイが設定されているアダプタは実際の到達性確認が明確に成立しやすく、NLAが「これは他とは区別できる固有のネットワークだ」と判定しやすくなるため"
      - "イーサネット4という名前は、4番目に作成された論理NICに自動的に固定で割り当てられる名前であるため"
      - "その論理NICだけが管理者権限でログインした状態で作成されたため"
    answerIndex: 1
    explanation: "NLAは、そのアダプタから実際に外部への到達性を検証することでネットワークの同一性を識別しています。ゲートウェイが設定されているアダプタはこの到達性確認が明確に成立しやすいため、NLAが「これは他とは区別できる固有のネットワークだ」と判定しやすくなります。"

  - question: "サーバー再起動後にすべての論理NICが「識別されていないネットワーク」に戻ってしまった理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "サーバーの再起動は、常にすべてのネットワーク設定を工場出荷時の状態にリセットする仕様であるため"
      - "起動時に複数の論理NICやチーミング自体の初期化と、実際の到達性確認が行えるようになるタイミングとの間に微妙なズレが生じ、NLAが本来の判定を確定できないまま暫定的な状態で確定してしまうことがあるため"
      - "Windowsのライセンス認証が再起動のたびに失効し、ネットワーク機能が制限されるため"
      - "論理NICの数が4つを超えると、Windowsが自動的にすべてを未識別として扱う仕様になっているため"
    answerIndex: 1
    explanation: "サーバー起動時、複数の論理NICやチーミング自体の初期化が完了し、実際に到達性確認が行えるようになるまでにはある程度の時間差が生じえます。この初期化・到達性確認のタイミングの微妙なズレにより、NLAが本来の判定を確定できないまま「識別されていないネットワーク」という暫定的な状態で確定してしまうことがあります。"

  - question: "NLAサービスの再起動がエラーになった後、論理NIC自体の再起動(無効化→有効化)で問題が解決した理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "論理NICを無効化→有効化すると、そのアダプタに対する新規の接続イベントが発生し、NLAがこれをきっかけに改めてネットワークの識別処理を再実行するため"
      - "論理NICを無効化→有効化すると、そのアダプタのMACアドレスが自動的に変更されるため"
      - "論理NICを無効化→有効化すると、チーミングの構成自体が完全に再構築されるため"
      - "論理NICを無効化→有効化しても実際には何も変わらず、単に偶然タイミングが合っただけである"
    answerIndex: 0
    explanation: "NLAサービス自体は依存関係の制約から単純に再起動できない場合が多くあります。一方、論理NICを無効化→有効化すると、そのアダプタに対する新規の接続イベントが発生し、NLAはこの新規の接続イベントをきっかけに、そのアダプタについて改めてネットワークの識別処理を再実行します。"
