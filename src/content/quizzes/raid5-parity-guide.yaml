questions:
  - question: "RAID5がRAID1と比べて、ディスク容量の効率が高い理由として正しいのはどれか。"
    choices:
      - "データそのものを複製する代わりに、より小さなパリティ値を別のディスクに保存するため"
      - "すべてのデータを圧縮してから保存するため"
      - "RAID5は、冗長性を一切持たないため"
      - "RAID5は、常に1台のディスクだけで構成されるため"
    answerIndex: 0
    explanation: "RAID5は、データそのものの複製ではなく、XORで計算したパリティという、より小さな値を保存することで、容量効率を高めています。"

  - question: "XOR演算の、RAID5における最も重要な性質として正しいのはどれか。"
    choices:
      - "常に0を返す"
      - "パリティとどちらか一方のデータが分かれば、残りのデータを逆算できる"
      - "データを暗号化する"
      - "データのサイズを常に半分にする"
    answerIndex: 1
    explanation: "XORの性質上、パリティと片方のデータが分かれば、もう片方のデータを正確に計算で導き出せます。これが復元の数学的な正体です。"

  - question: "実務のRAID5で、パリティが1台の専用ディスクに固定されない理由として正しいのはどれか。"
    choices:
      - "パリティは、そもそも保存する必要がないため"
      - "固定すると、書き込みのたびにそのディスクへ負荷が集中し、ボトルネックになるため"
      - "パリティは、毎回異なる計算方法を使う必要があるため"
      - "専用ディスクという概念が、RAID5には存在しないため"
    answerIndex: 1
    explanation: "パリティを1台に固定すると、書き込み負荷がそのディスクに集中してボトルネックになるため、ストライプごとに分散配置されます。"

  - question: "RAID6が、RAID5と比べて耐えられる同時故障台数として正しいのはどれか。"
    choices:
      - "RAID5と同じ1台"
      - "RAID5より1台多い、2台"
      - "RAID5より少ない、0台"
      - "無制限"
    answerIndex: 1
    explanation: "RAID6は、2種類の独立したパリティを持つことで、RAID5の1台に対し、2台の同時故障に耐えられます。"

  - question: "パリティという仕組みの本質についての正しい理解はどれか。"
    choices:
      - "元のデータの完全なコピーを、別の場所に保存する仕組みである"
      - "元のデータを復元するのに必要十分な、より小さい情報だけを保持する、効率化の発想である"
      - "データを圧縮して保存先の容量を節約する仕組みである"
      - "元のデータを暗号化して保護する仕組みである"
    answerIndex: 1
    explanation: "パリティは、完全な複製を持つのではなく、復元に必要十分な、より小さい情報を持つという、効率化の発想に基づいています。"
