questions:
  - question: "Delegation of Control Wizardで「パスワードのリセット」だけを委任した場合、委任先のグループはロックされたアカウントの解除もできるようになるか。"
    choices:
      - "できるようになる。パスワードリセットにはロック解除も含まれる"
      - "できない。パスワードリセットとロック解除は別々の権限であり、両方必要なら両方を委任する必要がある"
      - "ドメイン機能レベルによって異なる"
      - "委任した翌日から自動的にできるようになる"
    answerIndex: 1
    explanation: "パスワードのリセットとロックされたアカウントの解除は別々の権限です。両方が必要な場合は、ウィザードで両方にチェックを入れて委任する必要があります。"

  - question: "Delegation of Control Wizardで委任した権限を取り消したい場合、どうすればよいか。"
    choices:
      - "同じウィザードをもう一度実行し、「取り消し」を選択する"
      - "ウィザードに取り消し機能はないため、セキュリティタブから手作業でACEを削除する"
      - "対象のOUを削除して再作成する以外に方法はない"
      - "ドメインコントローラーを再起動すれば自動的に取り消される"
    answerIndex: 1
    explanation: "Delegation of Control Wizardには取り消し機能がないため、OUのセキュリティタブ(拡張機能を有効にした状態)から、該当するアクセス制御エントリ(ACE)を手作業で削除する必要があります。"

  - question: "Delegation of Control Wizardが実際に行っている操作の実態は何か。"
    choices:
      - "対象のOUを暗号化する"
      - "対象のOUのACL(アクセス制御リスト)に、特定の権限を許可する1つのACEを追加する"
      - "対象のグループをDomain Adminsに自動的に追加する"
      - "対象のユーザーのパスワードを直接変更する"
    answerIndex: 1
    explanation: "Delegation of Control Wizardは、対象のOUのACLに、指定したグループに対する特定の拡張権限を許可する1つのACE(アクセス制御エントリ)を追加しているだけです。"

  - question: "OUに権限を委任した場合、その権限が及ぶ範囲は既定でどこまでか。"
    choices:
      - "フォレスト全体に及ぶ"
      - "委任したそのOUと、その配下のオブジェクトだけに限定される"
      - "ドメイン全体に及ぶ"
      - "委任した本人のセッションが続いている間だけ有効"
    answerIndex: 1
    explanation: "委任した権限は、既定ではそのOUと配下のオブジェクトだけに限定されます。ドメイン全体やフォレスト全体に自動的に及ぶことはありません。"

  - question: "実務でヘルプデスク担当者にDomain Adminsを渡すのではなく、権限移譲を行うべき理由は何か。"
    choices:
      - "Domain Adminsは技術的にヘルプデスク担当者へ付与できないため"
      - "最小権限の原則に基づき、そのアカウントが乗っ取られた場合の被害範囲を限定するため"
      - "権限移譲の方がDomain Adminsより設定の手間が少ないため"
      - "Domain Adminsを渡すと、パスワードリセット機能自体が使えなくなるため"
    answerIndex: 1
    explanation: "ヘルプデスク担当者が本当に必要とする操作だけに権限を絞り込むことで、そのアカウントが乗っ取られた場合でもフォレスト全体が危険にさらされることを防げます。"
