questions:
  - question: "CORSエラーが発生する正確な理由として正しいのはどれか。"
    choices:
      - "サーバーがリクエストを拒否しているため"
      - "サーバーは応答を正常に返しているが、ブラウザがその応答をJavaScriptに読み取らせることを拒否しているため"
      - "ネットワーク自体が不通になっているため"
      - "DNSの名前解決に失敗しているため"
    answerIndex: 1
    explanation: "多くの場合サーバーはリクエストを正常に処理し応答を返していますが、CORSエラーはブラウザがその応答をJavaScriptに読み取らせることを拒否していることによって発生します。"

  - question: "curlやPostmanでは成功するのに、ブラウザのJavaScriptからだけ失敗する理由として正しいのはどれか。"
    choices:
      - "curlやPostmanの方が通信速度が速いため"
      - "同一オリジンポリシーはブラウザというソフトウェア自身が持つ制約であり、curlやPostmanはブラウザではないためこの制約を持たない"
      - "サーバーがcurlからのリクエストだけを特別に許可しているため"
      - "ブラウザだけがHTTPSを強制するため"
    answerIndex: 1
    explanation: "同一オリジンポリシーはブラウザ自身が持つ制約であり、ブラウザではないcurlやPostmanにはこの制約が適用されません。"

  - question: "CORS(同一オリジンポリシー)が本来守っている対象として正しいのはどれか。"
    choices:
      - "サーバー自身を不正アクセスから守っている"
      - "ブラウザを操作しているユーザー自身を、悪意のあるサイトによるクッキーの悪用から守っている"
      - "ネットワーク機器を過負荷から守っている"
      - "DNSサーバーを守っている"
    answerIndex: 1
    explanation: "CORSが守っているのはサーバーではなく、ブラウザを操作しているユーザー自身であり、悪意のあるサイトがユーザーのクッキーを使って別サイトの情報を読み取ることを防いでいます。"

  - question: "Content-Type: application/jsonを使った場合に起きることとして正しいのはどれか。"
    choices:
      - "常にシンプルなリクエストとして扱われ、プリフライトは発生しない"
      - "シンプルなリクエストの条件に含まれていないため、ほとんどの場合プリフライトが発生する"
      - "CORSの制約自体が完全に無効化される"
      - "サーバー側で自動的にJSONがXMLへ変換される"
    answerIndex: 1
    explanation: "Content-Type: application/jsonはシンプルなリクエストの条件に含まれていないため、JSONを送信するほとんどのAPI呼び出しでプリフライトが発生します。"

  - question: "認証情報を含むリクエストを許可する場合の、Access-Control-Allow-Originの正しい設定として正しいのはどれか。"
    choices:
      - "ワイルドカード(*)を指定する"
      - "ワイルドカードは使えず、リクエスト元の具体的なオリジンを明示的に指定する必要がある"
      - "何も設定しなくても自動的に許可される"
      - "Access-Control-Allow-Credentialsとは無関係に、自由に設定できる"
    answerIndex: 1
    explanation: "Access-Control-Allow-Credentials: trueを使う場合、Access-Control-Allow-Originにワイルドカードを指定することはできず、具体的なオリジンを明示的に指定する必要があります。"
