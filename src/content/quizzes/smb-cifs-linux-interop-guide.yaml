questions:
  - question: "SMBとCIFSの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "SMBとCIFSはまったく無関係の別々のプロトコルである"
      - "SMBはプロトコルファミリー全体を指す総称であり、CIFSはその中の初期バージョン(SMB1.0)にMicrosoftが付けた別名である"
      - "CIFSのほうがSMBより新しく、将来的にSMBを完全に置き換える予定である"
      - "SMBはLinux専用、CIFSはWindows専用のプロトコル名である"
    answerIndex: 1
    explanation: "SMBはWindowsのファイル共有プロトコルの名称そのものであり、CIFSはその中の特定のバージョン(1990年代にMicrosoftが公開したSMB1.0)にMicrosoftが独自に付けた別名です。"

  - question: "SMB1.0(CIFS)が現在のWindowsで既定で無効化されている理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "SMB1.0は単に古いという理由だけで、セキュリティ上の問題は一切なかった"
      - "2017年に世界的な被害をもたらしたランサムウェア「WannaCry」が悪用した脆弱性(EternalBlue)が、まさにSMB1.0の実装に存在していたため"
      - "SMB1.0は、Windows以外のOSでは技術的に一切動作しないため"
      - "SMB1.0は、ライセンス費用が他のバージョンより高額だったため"
    answerIndex: 1
    explanation: "SMB1.0(CIFS)は暗号化非対応・低パフォーマンスといった弱点に加え、2017年のランサムウェア「WannaCry」が悪用した脆弱性(EternalBlue)がまさにこの実装に存在していたことから、セキュリティリスクが広く知られ、既定で無効化されるようになりました。"

  - question: "異なるOS(WindowsとLinux)の間でファイル共有が成立する理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Microsoftが両方のOSに秘密のソフトウェアを個別にインストールしているため"
      - "SMBが「特定の実装」ではなく「文書化された通信の約束事(プロトコル仕様)」であり、その仕様を満たす実装であればどのOS上でも通信が成立するため"
      - "WindowsとLinuxは、実際には内部的にまったく同じカーネルを使用しているため"
      - "ファイル共有は、すべて自動的にクラウド経由で行われているため、OSの違いは関係ない"
    answerIndex: 1
    explanation: "SMBは特定の実装ではなく、Microsoftが`MS-SMB2`として公開している文書化されたプロトコル仕様です。この仕様通りにバイト列を組み立て・解釈できるソフトウェアであれば、どのOS上に実装されていても原理的に通信が成立します。"

  - question: "Sambaというプロジェクトについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "SambaはSMBプロトコルの仕様をLinux(および他のUnix系OS)上に実装したオープンソースプロジェクトであり、Linuxをサーバー・クライアントいずれとしても動作させられる"
      - "Sambaは、Windows専用のクラウドストレージサービスの名称である"
      - "SambaはSMB1.0(CIFS)にしか対応しておらず、SMB2・SMB3には一切対応していない"
      - "Sambaは、WindowsとLinuxのファイルを自動的に変換するソフトウェアである"
    answerIndex: 0
    explanation: "Samba は1992年から続くオープンソースプロジェクトで、SMBプロトコルをLinux上に実装しています。smbd/nmbdによりLinuxをSMBサーバーとして、cifs-utilsによりLinuxをSMBクライアントとして動作させられます。"

  - question: "`cifs-utils`という名前と、実際にサポートしているSMBのバージョンの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "名前の通り、CIFS(SMB1.0)にしか対応していない"
      - "名前には歴史的な名残が残っているだけで、`vers=`オプションによりSMB2・SMB3も指定できる"
      - "`cifs-utils`は、SMBとはまったく無関係の別のプロトコルを扱うツールである"
      - "`cifs-utils`を使うには、必ずSMB1.0を有効化しなければならない"
    answerIndex: 1
    explanation: "`cifs-utils`という名前にはSMB1.0(CIFS)が主流だった時代の名残が残っていますが、現在のバージョンは`mount`コマンドの`vers=`オプションでSMB2・SMB3も指定でき、CIFS(SMB1.0)に限定されたツールではありません。"
