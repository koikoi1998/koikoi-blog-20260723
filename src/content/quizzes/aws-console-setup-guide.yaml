questions:
  - question: "ルートユーザーの扱いとして推奨されるのはどれか。"
    choices:
      - "日常的な操作にそのまま使い続ける"
      - "最初にIAMユーザーを作成し、以降の日常操作はそちらで行う"
      - "ルートユーザーは検証環境でのみ使い、実務では絶対に作成しない"
      - "ルートユーザーは請求情報の変更ができないため、別途契約者情報を用意する"
    answerIndex: 1
    explanation: "ルートユーザーは最も強い権限を持つため、日常操作には使わず、最初にIAMユーザーを作成して以降はそちらを使うことが推奨されます。"

  - question: "「作成したはずのリソースが見当たらない」という初心者が最も陥りやすい原因はどれか。"
    choices:
      - "AWSのサーバー障害"
      - "リージョンの選択が、作成時と確認時で異なっている"
      - "インターネット接続の不具合"
      - "ブラウザのキャッシュの問題"
    answerIndex: 1
    explanation: "多くのAWSサービスはリージョンごとに独立したリソースとして存在するため、リージョンの選び間違いが最も多い原因です。"

  - question: "初めてAWSに触れる段階で、独自のVPCを一から構築する必要はあるか。"
    choices:
      - "必須であり、デフォルトVPCは使用できない"
      - "デフォルトVPCをそのまま使えば、独自VPCの構築を意識せずにEC2をインターネットに公開できる"
      - "VPCという概念はAWSには存在しない"
      - "デフォルトVPCは有料オプションである"
    answerIndex: 1
    explanation: "デフォルトVPCには、インターネットゲートウェイがすでにアタッチされているため、初めての段階ではそのまま使うことでAWSの基本操作に集中できます。"

  - question: "IAMユーザーとIAMロールの違いとして正しい説明はどれか。"
    choices:
      - "両者はまったく同じ機能で、名前が違うだけである"
      - "IAMユーザーは人間がコンソールへログインするためのアカウント、IAMロールはAWSリソース自身に持たせる一時的な権限である"
      - "IAMロールはIAMユーザーの上位互換であり、常にロールを使うべきである"
      - "IAMユーザーは無料だが、IAMロールは有料サービスである"
    answerIndex: 1
    explanation: "IAMユーザーは人間用のログインアカウント、IAMロールはEC2などのAWSリソース自身に一時的に持たせる権限であり、用途がまったく異なります。"

  - question: "セキュリティグループのアウトバウンドルールについて正しい説明はどれか。"
    choices:
      - "インバウンドと同様に、すべて個別に許可設定をしないと通信できない"
      - "既定ですべて許可されているため、多くのハンズオンでは変更する必要がない"
      - "アウトバウンドルールという概念はセキュリティグループには存在しない"
      - "アウトバウンドは常に全面的にブロックされている"
    answerIndex: 1
    explanation: "アウトバウンドルールは既定ですべて許可されているため、特別な制限をしたい場合を除き、変更は不要です。"
