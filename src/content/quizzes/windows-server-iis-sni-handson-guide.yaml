questions:
  - question: "SNI(Server Name Indication)が解決している問題として正しいのはどれか。"
    choices:
      - "TLSの暗号化速度を向上させる問題"
      - "1つのIPアドレスで、複数のドメインにそれぞれ異なる証明書を提示するという問題"
      - "DNSの名前解決を高速化する問題"
      - "HTTPのバージョンを自動判定する問題"
    answerIndex: 1
    explanation: "SNIは、1つのIPアドレス・ポートの組み合わせで、ホスト名ごとに異なるTLS証明書を提示できるようにする仕組みです。"

  - question: "SNIの情報がTLSハンドシェイクのどの段階で送られるかとして正しいのはどれか。"
    choices:
      - "HTTPのレスポンスが返ってきた後"
      - "ClientHelloメッセージの中に、暗号化前の平文として含まれる"
      - "TCPの3ウェイハンドシェイクが完了する前"
      - "証明書の検証が完了した後"
    answerIndex: 1
    explanation: "SNIは、TLSハンドシェイクの最初のメッセージであるClientHelloの中に、暗号化される前の平文として含まれます。"

  - question: "netsh http add sslcertのhostnameport形式が実現していることとして正しいのはどれか。"
    choices:
      - "1つのIPアドレス・ポートに対して、ホスト名ごとに異なる証明書を紐づける"
      - "複数のIPアドレスを1つの証明書にまとめる"
      - "証明書の有効期限を自動延長する"
      - "HTTPをHTTPSへ自動リダイレクトする"
    answerIndex: 1
    explanation: "hostnameport形式のバインドは、同じIPアドレス・ポートに対して、ホスト名ごとに異なる証明書を紐づけることができます。"

  - question: "SNIに対応していない極めて古いクライアントが接続した場合の挙動として正しいのはどれか。"
    choices:
      - "接続が即座に拒否される"
      - "そのIPアドレス・ポートに設定された既定の証明書が返される"
      - "自動的にSNI対応クライアントへアップグレードされる"
      - "HTTPへ自動的にダウングレードされる"
    answerIndex: 1
    explanation: "SNI非対応のクライアントには、サーバーがSNI情報を受け取れないため、既定の証明書が返され、証明書名の不一致が発生する可能性があります。"

  - question: "SNIが登場する以前にTLSが抱えていた構造的な矛盾として正しいのはどれか。"
    choices:
      - "暗号化アルゴリズムの選択肢が少なすぎるという矛盾"
      - "どのサイト宛かを知るにはHTTPの中身が必要だが、TLS開始時点ではまだそれが分からないという矛盾"
      - "証明書の発行機関が1つしか存在しないという矛盾"
      - "TCPとUDPのどちらを使うべきかが決まらないという矛盾"
    answerIndex: 1
    explanation: "HTTPのHostヘッダーは暗号化後にしか読めないが、証明書の選択はTLSハンドシェイク開始時点で必要という、循環した問題がありました。"
