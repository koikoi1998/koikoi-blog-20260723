questions:
  - question: "このハンズオンでFileServer1を停止させた後も、利用者が同じパスへアクセスし続けられた理由として正しいのはどれか。"
    choices:
      - "DFSレプリケーションが自動的に接続先を切り替えたため"
      - "DFS名前空間が、到達可能なフォルダターゲットへ自動的に接続先を切り替えたため"
      - "クライアント側が手動でパスを書き換えたため"
      - "FileServer1が瞬時に自動復旧したため"
    answerIndex: 1
    explanation: "自動フェイルオーバーはDFS名前空間の機能であり、到達可能なフォルダターゲットへ自動的に接続先を切り替えます。"

  - question: "DFSレプリケーションを構築せず、DFS名前空間だけを構築した場合のリスクとして正しいのはどれか。"
    choices:
      - "フェイルオーバー自体が発生しなくなる"
      - "フェイルオーバーは発生するが、切り替わった先に最新のデータが存在しない可能性がある"
      - "名前空間自体が機能しなくなる"
      - "クライアントが名前空間にアクセスできなくなる"
    answerIndex: 1
    explanation: "レプリケーションを構築していない場合、フェイルオーバー自体は名前空間の機能で発生しますが、切り替え先のデータが最新である保証がありません。"

  - question: "DFSレプリケーションの遅延が、フェイルオーバー時に引き起こしうる問題として正しいのはどれか。"
    choices:
      - "フェイルオーバー自体が完全に無効化される"
      - "直前の変更がまだ複製されておらず、フェイルオーバー後に古いデータしか見えないことがある"
      - "名前空間のパスが自動的に変更される"
      - "両方のサーバーが同時に停止する"
    answerIndex: 1
    explanation: "DFSレプリケーションには一定の遅延があるため、タイミングによってはフェイルオーバー直後に古いデータしか見えない状況が起こり得ます。"

  - question: "Get-DfsrBacklogコマンドの用途として正しいのはどれか。"
    choices:
      - "名前空間のフォルダターゲットを新規追加する"
      - "レプリケーションの複製が完了していないバックログを確認する"
      - "DFS名前空間を完全に削除する"
      - "プリンタードライバーを隔離する"
    answerIndex: 1
    explanation: "Get-DfsrBacklogは、DFSレプリケーションでまだ複製が完了していないファイルのバックログを確認するコマンドです。"

  - question: "自動フェイルオーバーを実用的にするために必要な組み合わせとして正しいのはどれか。"
    choices:
      - "DFS名前空間のみで十分である"
      - "DFS名前空間とDFSレプリケーションの両方を組み合わせる必要がある"
      - "DFSレプリケーションのみで十分である"
      - "Print Spoolerサービスとの連携が必須である"
    answerIndex: 1
    explanation: "名前空間だけではフェイルオーバー先のデータの最新性が保証されないため、レプリケーションと組み合わせて初めて実用的になります。"
