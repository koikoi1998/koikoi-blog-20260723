questions:
  - question: "DNSリークとキルスイッチが対処する漏洩の違いとして正しいのはどれか。"
    choices:
      - "両者は完全に同じ種類の問題である"
      - "キルスイッチは接続切断時のリークに対処し、DNSリークは接続が正常に機能している最中に発生する"
      - "DNSリークは、キルスイッチよりも常に深刻な問題である"
      - "両者とも、接続が完全に切断された後にのみ発生する"
    answerIndex: 1
    explanation: "キルスイッチが対処する「接続が切断された際のリーク」とは異なり、DNSリークは、接続が正常に機能している、まさにその最中に発生する、異なる種類の漏洩です。"

  - question: "WindowsのSmart Multi-Homed Name Resolutionが、DNSリークを引き起こす仕組みとして正しいのはどれか。"
    choices:
      - "DNSクエリを、常に意図的に拒否する"
      - "利用可能なすべてのネットワークインターフェースへDNSクエリを同時に送信し、最も速く返ってきた応答を採用する"
      - "DNSクエリを、暗号化せずにそのまま破棄する"
      - "DNSサーバーへの接続自体を、完全に禁止する"
    answerIndex: 1
    explanation: "Smart Multi-Homed Name Resolutionは、利用可能なすべてのネットワークインターフェースへ、DNSクエリを同時に送信し、最も速く返ってきた応答を採用する、という設計になっています。"

  - question: "ISPのDNSサーバーが、VPNトンネル経由のDNSサーバーより「速く」応答してしまう理由として正しいのはどれか。"
    choices:
      - "ISPのDNSサーバーは、常に故障している"
      - "ISPのDNSサーバーは物理的に近く、暗号化やトンネリングのオーバーヘッドが発生しないため"
      - "VPNトンネル自体が、技術的に機能していない"
      - "ISPのDNSサーバーは、常に無応答である"
    answerIndex: 1
    explanation: "ISPのDNSサーバーは、物理的に近い場所にあり、暗号化やトンネリングのオーバーヘッドも一切発生しないため、VPNトンネル経由のDNSサーバーよりも応答が速くなりがちです。"

  - question: "DNSリークの原因として、より正確な記述はどれか。"
    choices:
      - "常にVPNソフトウェア自体の欠陥が原因である"
      - "多くの場合、VPNソフトウェア自体の欠陥ではなく、OSが持つパフォーマンス最適化のための既存の設計判断が原因である"
      - "DNSリークという現象自体は、技術的に発生し得ない"
      - "常にネットワークケーブルの物理的な不良が原因である"
    answerIndex: 1
    explanation: "DNSリークの原因は、多くの場合、VPNソフトウェア自体の欠陥ではなく、OSが持つ、パフォーマンス最適化のための、既存の設計判断です。"

  - question: "DNSリークへの対策として正しいのはどれか。"
    choices:
      - "VPN自体の利用を完全に中止する"
      - "Smart Multi-Homed Name Resolutionを無効化する、またはすべてのインターフェースに同じDNSサーバーを設定する"
      - "インターネット接続自体を完全に切断する"
      - "対策は一切存在しない"
    answerIndex: 1
    explanation: "対策には、Smart Multi-Homed Name Resolutionという機能自体の無効化と、すべてのネットワークインターフェースに対して明示的に同じDNSサーバーを設定するという、2つの方法があります。"
