questions:
  - question: "「オーバーフェッチ」の説明として正しいのはどれか。"
    choices:
      - "1つの画面のために複数回のAPI呼び出しが必要になること"
      - "必要以上のデータを含んだレスポンスを受け取ってしまうこと"
      - "APIの呼び出し回数が制限されること"
      - "レスポンスがキャッシュされないこと"
    answerIndex: 1
    explanation: "オーバーフェッチとは、画面には使わない項目まで含んだ、必要以上のデータを受け取ってしまう問題です。"

  - question: "GraphQLが、オーバーフェッチをどう解消しているか、正しい説明はどれか。"
    choices:
      - "サーバー側が、常に全項目を返すことをやめるよう強制する"
      - "クライアント側が、クエリで欲しい項目だけを指定し、その項目だけを含むレスポンスを受け取る"
      - "レスポンスを自動的に圧縮することで解消する"
      - "キャッシュを無効化することで解消する"
    answerIndex: 1
    explanation: "GraphQLでは、クライアントがクエリで指定した項目だけを含むレスポンスが返されるため、オーバーフェッチが解消されます。"

  - question: "GraphQLで、クライアントから見ると1回のリクエストに見える処理の、サーバー側の実態として正しいのはどれか。"
    choices:
      - "サーバー側でも、常に1回の処理だけで完結する"
      - "クエリの構造に応じて、複数のリゾルバ(場合によっては複数のデータベースクエリ)が実行される"
      - "サーバー側では何も処理が行われない"
      - "サーバー側は、クエリの内容を一切解析しない"
    answerIndex: 1
    explanation: "クライアントから見ると1回のリクエストですが、サーバー内部ではクエリの各項目に対応する複数のリゾルバが呼び出されています。"

  - question: "GraphQLが、RESTのようなURLベースの単純なキャッシュが効きにくい理由として正しいのはどれか。"
    choices:
      - "GraphQLはHTTPを使用していないため"
      - "エンドポイントが常に同じで、クエリの内容によってレスポンスが変わるため"
      - "GraphQLは暗号化に対応していないため"
      - "GraphQLはJSON形式のレスポンスを返せないため"
    answerIndex: 1
    explanation: "GraphQLはエンドポイントが固定(/graphql)で、クエリ内容に応じてレスポンスが変わるため、URLをキーにした単純なキャッシュが効きにくくなります。"

  - question: "RESTとGraphQLの本質的な違いについての正しい理解はどれか。"
    choices:
      - "GraphQLは常にRESTより優れた、後継の規格である"
      - "レスポンスの形を、サーバー側とクライアント側のどちらが決めるかという、設計思想の違いである"
      - "両者はまったく同じ仕組みであり、名前が違うだけである"
      - "GraphQLは、HTTPを使わない独自のプロトコルである"
    answerIndex: 1
    explanation: "RESTはサーバー側がレスポンスの形を事前に決め、GraphQLはクライアント側がリクエストごとに決める、という設計思想の違いがあります。"
