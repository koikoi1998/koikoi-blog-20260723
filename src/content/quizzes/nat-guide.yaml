questions:
  - question: "NATの3方式(Static NAT・Dynamic NAT・NAPT)の違いとして、記事の内容に最も合致するものはどれか。"
    choices:
      - "Static NATとDynamic NATはプライベートIP1つに対しグローバルIP1つの1対1関係を保つが、NAPTはポート番号も使うことで多対1の共有を実現する"
      - "NAPTだけがプライベートIPとグローバルIPを変換し、Static NAT・Dynamic NATはポート番号だけを変換する"
      - "Static NATは動的にグローバルIPを割り当て、Dynamic NATは常に固定のグローバルIPを割り当てる"
      - "3方式のいずれも、同時に使えるグローバルIPは常に1つに固定されている"
    answerIndex: 0
    explanation: "Static NAT・Dynamic NATはIPアドレス同士の1対1変換にとどまりますが、NAPTはポート番号という新しい識別軸を加えることで、1つのグローバルIPを多数の端末が同時共有できます。選択肢3はStaticとDynamicの説明が逆です。"

  - question: "NAPTの変換テーブルが通信セッションを識別するために使う「5-タプル」に含まれないものはどれか。"
    choices:
      - "プロトコル種別"
      - "送信元IPアドレスと送信元ポート番号"
      - "宛先IPアドレスと宛先ポート番号"
      - "送信元MACアドレス"
    answerIndex: 3
    explanation: "5-タプルは「プロトコル種別+送信元IP:ポート+宛先IP:ポート」の組み合わせです。MACアドレスはL2の情報であり、NAPTの変換テーブルのキーには使われません。"

  - question: "NAT機器が、戻ってきたパケットをどの内部端末に転送すべきか判断する仕組みとして、記事の説明に最も合致するものはどれか。"
    choices:
      - "戻りパケットの宛先ポート番号(外部ポート)をキーに、変換テーブルを逆引きして判断する"
      - "戻りパケットの送信元IPアドレスだけを見て、常に最後に通信した端末に転送する"
      - "内部端末のMACアドレスをパケットに埋め込んで判断する"
      - "戻りパケットのTTL値から内部端末を逆算して判断する"
    answerIndex: 0
    explanation: "NAT機器は戻りパケットの宛先ポート番号(NAT機器が割り当てた外部ポート)をキーに変換テーブルを逆引きし、対応する内部IP:ポートへ転送します。外部ポート番号こそが複数端末を区別する実質的な識別子です。"

  - question: "ESP(IPsec)のようなプロトコルがNAPT環境で問題を起こす根本的な理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "ESPは常に暗号化されているため、NAT機器がパケットの中身を読めないから"
      - "ESPにはポート番号という概念がなく、NAPTの変換テーブルのキーに使えないから"
      - "ESPはTCPの上でしか動作せず、UDPベースのNAT機器と互換性がないから"
      - "ESPは常にIPv6専用のプロトコルであり、IPv4のNATと構造的に非互換だから"
    answerIndex: 1
    explanation: "NAPTの変換テーブルはポート番号を前提に設計されていますが、ESPにはポート番号の概念がありません。これに加え、IPプロトコル番号50のパススルー自体に対応していないNAT機器も多く、二重の問題を引き起こします。"

  - question: "NAT-Tによって、NATが検出された場合に何が起きるか。記事の説明として最も適切なものはどれか。"
    choices:
      - "ESPパケットの暗号化が解除され、平文でやり取りされるようになる"
      - "以後のやり取りがUDPポート4500にフロートし、ESPパケットがUDPヘッダーでさらに包まれる"
      - "NAT機器がIPプロトコル番号50を自動的にホワイトリスト登録し、以後は素のESPで通信する"
      - "鍵交換プロトコルが完全に停止し、事前共有鍵なしで通信が継続される"
    answerIndex: 1
    explanation: "NATが検出されると、鍵交換とESPのやり取りはUDPポート4500にフロートし、ESPパケットはUDPヘッダーでさらに包まれます(RFC 3948)。これによりNAT機器は通常のUDPパケットとしてポートベースの変換ができるようになります。暗号化自体は解除されません。"

  - question: "NAT-Tにおける「Non-ESPマーカー」の役割として、記事の説明に最も合致するものはどれか。"
    choices:
      - "ESPパケットの暗号鍵を格納するためのフィールド"
      - "UDPポート4500上を流れる、鍵交換メッセージとカプセル化されたESPパケットを受信側が区別するための目印"
      - "NAT機器がESPパケットを破棄すべきかどうかを判断するためのフラグ"
      - "ESPの認証方式(PSKか証明書か)を示すための識別子"
    answerIndex: 1
    explanation: "同じUDPポート4500の上を鍵交換メッセージとカプセル化されたESPパケットの両方が流れるため、鍵交換メッセージの先頭に4バイトの0x00000000(Non-ESPマーカー)を付与することで、受信側が両者を瞬時に判別できるようにしています。"

  - question: "NAT-Tのキープアライブが必要になる理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "ESPの暗号鍵は一定時間ごとに自動更新する必要があるから"
      - "NAPTの変換テーブルのエントリが、無通信状態が続くと自動的に削除されてしまうから"
      - "鍵交換プロトコル自体が、定期的な再送を必須の仕様として要求しているから"
      - "モデムハンドシェイクを維持するために必要だから"
    answerIndex: 1
    explanation: "NAPTの変換テーブルのエントリは、一定時間通信がないと自動的に削除されます。ESP/鍵交換のやり取りが常時発生するとは限らないため、定期的なキープアライブでエントリの失効を防いでいます。"

  - question: "Cone系NAT(Full/Restricted/Port-Restricted)とSymmetric NATの違いとして、記事の説明に最も合致するものはどれか。"
    choices:
      - "Cone系NATは宛先が変わっても同じ外部ポートを使い続けるが、Symmetric NATは宛先ごとに異なる外部ポートを割り当てる"
      - "Cone系NATはUDPのみに対応し、Symmetric NATはTCPのみに対応する"
      - "Symmetric NATの方がCone系NATよりも常に多くの端末を収容できる"
      - "Cone系NATは暗号化された通信のみを許可し、Symmetric NATは平文通信のみを許可する"
    answerIndex: 0
    explanation: "Cone系NATは内部の送信元IP:ポートごとに常に同じ外部ポートを割り当てるのに対し、Symmetric NATは宛先が変わるたびに異なる外部ポートを新規に割り当てます。この違いがNATホールパンチングの成立しやすさを左右します。"

  - question: "NATに関する誤解として、記事が明確に否定しているものはどれか。"
    choices:
      - "NATの本来の目的はIPアドレスの共有・節約である"
      - "NATはそれ自体が暗号化やアクセス制御を行うセキュリティ機能である"
      - "NAPTで使える外部ポート番号には現実的な上限がある"
      - "NATとファイアウォールは目的の異なる別の機能である"
    answerIndex: 1
    explanation: "NATの目的はIPアドレスの共有・節約であり、暗号化やアクセス制御を行うものではありません。「内部から出た通信の戻りしか自動的には通さない」という設計の副産物としてファイアウォールのような効果が生まれることはありますが、明示的なアクセス制御ルールの代わりにはなりません。"
