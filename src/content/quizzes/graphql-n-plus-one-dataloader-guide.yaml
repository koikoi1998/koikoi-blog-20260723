questions:
  - question: "GraphQLのN+1問題が発生する直接の原因として正しいのはどれか。"
    choices:
      - "GraphQLサーバー自体が、頻繁にクラッシュするから"
      - "リゾルバーがフィールドごとに独立して動作するため、リストの各要素に対して追加のクエリが件数分発行されてしまうから"
      - "GraphQLが、暗号化通信に対応していないから"
      - "クライアント側が、常に同じクエリを繰り返し送信するから"
    answerIndex: 1
    explanation: "GraphQLのリゾルバーはフィールドごとに独立して動作するため、リストを取得する1回のクエリの後、個々の要素に対する追加のクエリが、件数分だけ発行されてしまい、これがN+1問題と呼ばれます。"

  - question: "DataLoaderが、N+1問題を解決するために組み合わせている2つの仕組みとして正しいのはどれか。"
    choices:
      - "暗号化と圧縮"
      - "バッチ処理(個々の要求を1回のまとめた問い合わせへ変換)と、重複排除のキャッシュ"
      - "ログ記録とアラート通知"
      - "認証と認可"
    answerIndex: 1
    explanation: "DataLoaderは、個々のリゾルバーからの要求を1回のまとめた問い合わせへ変換するバッチ処理と、同じキーが複数回要求された場合に最初の1回だけ取得する、重複排除のキャッシュを組み合わせています。"

  - question: "DataLoaderのインスタンスを、リクエストをまたいでグローバルに共有することの危険性として正しいのはどれか。"
    choices:
      - "サーバーのメモリ使用量が、常に減少する"
      - "認可のスコープが異なる別の利用者に対して、キャッシュされた結果がそのまま返ってしまう、情報漏洩のリスクがある"
      - "クエリの実行速度が、常に向上する"
      - "特に危険性はなく、むしろ推奨される実装方法である"
    answerIndex: 1
    explanation: "DataLoaderのインスタンスをリクエストをまたいでグローバルに共有すると、認可のスコープが異なる別の利用者に対して、キャッシュされた結果がそのまま返ってしまう、情報漏洩のリスクが生まれます。"

  - question: "一部のリゾルバーだけにDataLoaderを導入した場合の結果として正しいのはどれか。"
    choices:
      - "必ず、すべてのN+1問題が完全に解決される"
      - "バッチがうまく集約されず、性能上の効果が限定的になる"
      - "GraphQLサーバー自体が起動できなくなる"
      - "クエリの構文エラーが発生する"
    answerIndex: 1
    explanation: "N+1問題が発生する可能性のあるすべてのリゾルバーが一貫してDataLoaderを使用していなければ、バッチがうまく集約されず、性能上の効果が限定的になってしまいます。"

  - question: "GraphQLのリゾルバーの柔軟性に関する、この記事の指摘として正しいのはどれか。"
    choices:
      - "この柔軟性は、オーバーフェッチ/アンダーフェッチの解決だけに有益であり、他の問題は一切引き起こさない"
      - "オーバーフェッチ/アンダーフェッチを解決した、まさにその同じ柔軟性が、N+1問題という別の性能問題の原因にもなっている"
      - "この柔軟性は、GraphQLの仕様から完全に廃止されるべきだ"
      - "この柔軟性は、RESTful APIにも元から存在していた"
    answerIndex: 1
    explanation: "GraphQLのリゾルバーが独立して動作する柔軟性は、オーバーフェッチ/アンダーフェッチを解決した、まさにその同じ仕組みでありながら、N+1問題という、まったく新しい性能問題の原因にもなっています。"
