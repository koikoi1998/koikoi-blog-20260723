questions:
  - question: "gMSA(グループ管理サービスアカウント)の最大の特徴は何か。"
    choices:
      - "管理者が設定した固定のパスワードを、より複雑にしたものである"
      - "AD DS自身がパスワードを自動生成し、自動的にローテーションしてくれる"
      - "パスワードそのものが存在しないアカウントである"
      - "ドメインに参加していないサーバーでのみ使用できる"
    answerIndex: 1
    explanation: "gMSAは、AD DS自身がパスワードを自動生成し、既定では約30日ごとに自動的にローテーションしてくれる仕組みです。"

  - question: "本番環境で新規にKDSルートキーを作成した場合、gMSAが実際に使えるようになるまでにどの程度の時間を見込む必要があるか。"
    choices:
      - "即座に使える"
      - "約10時間(すべてのDCへの複製が完了するまで)"
      - "約1週間"
      - "約1か月"
    answerIndex: 1
    explanation: "本番環境では、KDSルートキーがすべてのDCへ確実に複製されるのを待つため、既定では作成から約10時間、gMSAを実際には利用できません。"

  - question: "`PrincipalsAllowedToRetrieveManagedPassword`で指定されていないサーバーが、そのgMSAを利用しようとするとどうなるか。"
    choices:
      - "問題なく利用できる"
      - "パスワードを取得できず、利用に失敗する"
      - "自動的にそのサーバーが指定リストに追加される"
      - "KDSルートキーが再作成される"
    answerIndex: 1
    explanation: "PrincipalsAllowedToRetrieveManagedPasswordで指定されたサーバー(またはグループ)だけが、gMSAの現在のパスワードを取得できます。指定されていないサーバーは取得に失敗します。"

  - question: "gMSAと、前身であるsMSA(スタンドアロン管理サービスアカウント)の最大の違いは何か。"
    choices:
      - "sMSAの方が新しい仕組みである"
      - "gMSAは複数のサーバーで同じアカウントを共有できるが、sMSAは1台のサーバーでしか使えない"
      - "gMSAにはパスワードが存在しないが、sMSAには存在する"
      - "両者に技術的な違いは一切ない"
    answerIndex: 1
    explanation: "sMSAは1台のサーバー上でしか使えないという制約がありましたが、gMSAはこの制約を取り払い、複数のサーバーで同じアカウントを共有できるようになりました。"

  - question: "サービスの実行アカウントをgMSAに設定する際、パスワード欄にはどのような値を指定するか。"
    choices:
      - "KDSルートキーの値をそのまま指定する"
      - "空のパスワードを指定する(gMSAが自動的に認証を処理するため)"
      - "管理者が独自に決めた複雑なパスワードを指定する"
      - "ドメイン管理者のパスワードを指定する"
    answerIndex: 1
    explanation: "gMSAのアカウント名には末尾に$を付け、パスワードは空のまま指定します。Windowsはこのアカウントがgmsaであることを認識し、AD DSから自動的にパスワードを取得します。"
