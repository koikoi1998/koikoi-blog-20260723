questions:
  - question: "ネットワーク越しにファイル共有へアクセスする場合の、実効権限の決まり方として正しいのはどれか。"
    choices:
      - "NTFS権限だけが適用され、共有権限は一切無視される"
      - "共有権限とNTFS権限の両方がチェックされ、より厳しい方が実効権限として採用される"
      - "共有権限だけが適用され、NTFS権限は一切無視される"
      - "常に、より緩い方の権限が自動的に採用される"
    answerIndex: 1
    explanation: "ネットワーク越しにアクセスする場合、共有権限とNTFS権限の両方がチェックされ、より厳しい(制限の強い)方が、実効権限として採用されます。"

  - question: "ローカルログオンでサーバーへ直接アクセスした場合の、権限の適用として正しいのはどれか。"
    choices:
      - "共有権限とNTFS権限の両方が、常に同じようにチェックされる"
      - "共有権限は一切関与せず、NTFS権限のみが適用される"
      - "NTFS権限は一切関与せず、共有権限のみが適用される"
      - "ローカルログオンでは、権限チェックという概念自体が存在しない"
    answerIndex: 1
    explanation: "ローカルログオンでサーバーへ直接アクセスする場合、共有権限は一切関与せず、NTFS権限のみがそのまま適用されます。"

  - question: "同じ権限システム内で、ユーザー自身とそのユーザーが所属するグループの権限が異なる場合の原則として正しいのはどれか。"
    choices:
      - "常にユーザー自身の権限だけが有効になる"
      - "権限は加算され、より緩い方が実効権限になる"
      - "常にグループの権限だけが有効になる"
      - "権限は常に無効化され、アクセスが拒否される"
    answerIndex: 1
    explanation: "同じ権限システム内では、ユーザー自身の権限と、所属するグループの権限は加算され、より緩い方が実効権限になります。"

  - question: "明示的な拒否(Deny)の優先順位として正しいのはどれか。"
    choices:
      - "許可(Allow)が1つでも存在すれば、拒否は常に無効になる"
      - "明示的な拒否は、同じ権限システム内のどの許可よりも常に優先される"
      - "拒否と許可は、常に五分五分でランダムに決定される"
      - "拒否という設定は、Windowsには技術的に存在しない"
    answerIndex: 1
    explanation: "明示的な拒否は、どれだけ多くの許可が積み重なっていても、同じ権限システム内では常に優先されます。"

  - question: "NTFSの『実効アクセス』タブに関する正しい記述はどれか。"
    choices:
      - "共有権限も含めた、完全な実効権限を確認できる"
      - "NTFS権限単体での実効権限は確認できるが、共有権限は考慮されないため、ネットワーク越しの実効権限を完全には確認できない"
      - "このタブは、権限をリアルタイムで変更する機能である"
      - "このタブは、Windows Serverには存在しない機能である"
    answerIndex: 1
    explanation: "『実効アクセス』タブは、NTFS権限単体での実効権限を確認できますが、共有権限は考慮しないため、ネットワーク越しの実効権限を完全に確認するには、共有権限も別途確認する必要があります。"
