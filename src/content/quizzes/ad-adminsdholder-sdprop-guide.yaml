questions:
  - question: "AdminSDHolderの正体として正しいのはどれか。"
    choices:
      - "すべてのユーザーアカウントのバックアップを保持するオブジェクト"
      - "保護対象アカウントすべてに適用されるべき、正しいアクセス許可のテンプレートとして機能する、特殊なオブジェクト"
      - "DCの正常性を監視するサービス"
      - "パスワードポリシーを定義するグループオブジェクト"
    answerIndex: 1
    explanation: "AdminSDHolderは、AD DS内に存在する特殊なオブジェクトで、保護対象アカウントすべてに適用されるべき、正しいアクセス許可のテンプレートとして機能します。"

  - question: "SDProp(Security Descriptor Propagator)が、既定で行う処理として正しいのはどれか。"
    choices:
      - "1日1回、すべてのDCのバックアップを取得する"
      - "60分ごとに、AdminSDHolderのACLを、すべての保護対象アカウントへ強制的に再コピーする"
      - "ユーザーのパスワードを自動的にリセットする"
      - "グローバルカタログのレプリケーションを実行する"
    answerIndex: 1
    explanation: "SDPropは既定で60分ごとに実行され、AdminSDHolderのACLを、すべての保護対象アカウント・グループへ強制的に再コピーします。"

  - question: "特権グループのメンバーに設定したカスタムのアクセス許可が、時間差で元に戻る理由として正しいのはどれか。"
    choices:
      - "何らかのバグが発生しているため"
      - "SDPropが、AdminSDHolderのACLを強制的に再コピーするという、意図的な設計であるため"
      - "ネットワークの遅延が原因であるため"
      - "DCのディスク容量が不足しているため"
    answerIndex: 1
    explanation: "これはバグではなく、SDPropがAdminSDHolderのACLを60分ごとに強制的に再コピーする、意図的な設計によるものです。"

  - question: "ユーザーを特権グループから外した場合の、adminCount属性の挙動として正しいのはどれか。"
    choices:
      - "自動的に0へリセットされる"
      - "自動的にはリセットされず、1のまま残り続ける"
      - "属性自体が削除される"
      - "ランダムな値に変更される"
    answerIndex: 1
    explanation: "ユーザーを特権グループから外しても、adminCount属性は自動的にはリセットされず、1のまま残り続けます。これは意図的な仕様です。"

  - question: "adminCount=1が設定されているアカウントについて、正しい理解はどれか。"
    choices:
      - "現在も確実に特権グループのメンバーであることを保証する"
      - "過去に保護対象になった履歴を示すだけであり、現在のグループメンバーシップの実態を保証するものではない"
      - "そのアカウントが無効化されていることを示す"
      - "そのアカウントのパスワードが漏洩したことを示す"
    answerIndex: 1
    explanation: "adminCount=1は、過去に一度でも保護対象になったことがあるという履歴を示すだけであり、現在のグループメンバーシップの実態を正確に反映しているとは限りません。"
