questions:
  - question: "マスターのゾーン設定における`allow-transfer`の役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ゾーン転送を許可する相手のIPアドレスを明示的に指定するための設定であり、これを指定しないと既定では広く許可されゾーンデータが誰でも取得できる状態になりかねない"
      - "`allow-transfer`は、クライアントからの通常のDNSクエリを許可するかどうかを制御する設定である"
      - "`allow-transfer`を設定しなくても、ゾーン転送は既定で特定の1台にしか許可されない"
      - "`allow-transfer`は、ゾーンファイルの構文エラーを自動的に修正する機能である"
    answerIndex: 0
    explanation: "allow-transferは、ゾーン転送を許可する相手を明示的に指定するための設定です。これを指定しないと、既定では原則すべての相手からのゾーン転送要求を許可してしまう可能性があります。"

  - question: "スレーブサーバー側のゾーン設定について、記事の説明に最も合致するものはどれか。"
    choices:
      - "スレーブは、マスターと同じ内容のゾーンファイルを自分でも手動で作成する必要がある"
      - "スレーブは自分でゾーンファイルの中身を書く必要はなく、`file`にはマスターから転送されたデータの保存先を指定するだけでよい"
      - "スレーブには`masters`の指定は不要で、自動的にマスターを検出する"
      - "スレーブサーバーという概念は、BINDには存在しない"
    answerIndex: 1
    explanation: "スレーブ側の設定では、自分でゾーンファイルの中身を書くのではなく、マスターから転送されたデータを保存する場所(file)と転送元(masters)を指定するだけです。"

  - question: "Step3でシリアル番号を上げずにレコードを変更した場合に起きることについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "マスター・スレーブの両方に、変更後の新しい値がすぐに反映される"
      - "マスターへの問い合わせでは新しい値が返るが、スレーブへの問い合わせでは古い値のままである"
      - "マスター・スレーブの両方で、変更前の古い値のまま変わらない"
      - "シリアル番号を上げなくても、BINDが自動的にシリアル番号を補正してくれる"
    answerIndex: 1
    explanation: "マスター自身への問い合わせでは新しい値がすぐに反映されますが、スレーブはシリアル番号が変わっていないため「更新はない」と判断し、ゾーン転送を要求しないため、古い値のままになります。"

  - question: "Step4で、更新をスレーブへ反映させるために行った操作について、記事の説明に最も合致するものはどれか。"
    choices:
      - "スレーブサーバーを完全に再インストールする"
      - "マスターのゾーンファイルでシリアル番号を1つ増やし、必要であれば`rndc retransfer`でゾーン転送を即座に強制する"
      - "マスターとスレーブの役割を入れ替える"
      - "`allow-transfer`の設定を削除する"
    answerIndex: 1
    explanation: "マスターのゾーンファイルでシリアル番号を正しく増やすことで、スレーブがマスターの更新を検知できるようになります。すぐに反映させたい場合は、スレーブ側でrndc retransferを実行してゾーン転送を即座に強制できます。"

  - question: "このハンズオンの価値について、記事の説明に最も合致するものはどれか。"
    choices:
      - "digコマンドの使い方を覚えることだけが、このハンズオンの目的である"
      - "「シリアル番号を上げ忘れると反映されない」という知識を、実際に自分の手で再現し、digの結果が食い違う瞬間を目で見ることで、実務でとっさに疑えるレベルの理解に変えることに価値がある"
      - "このハンズオンは、実務でのトラブルシューティングには一切役立たない、学習専用の内容である"
      - "BINDの操作は、実際に手を動かさなくても文章を読むだけで十分に習得できる"
    answerIndex: 1
    explanation: "記事で学んだ知識を、実際に自分の手で再現し、digの結果が食い違う瞬間を目で見ることで、「実務でとっさに疑える」レベルの理解に変わる、という点にこのハンズオンの価値があります。"
