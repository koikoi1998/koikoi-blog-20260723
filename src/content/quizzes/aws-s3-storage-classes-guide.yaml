questions:
  - question: "S3のストレージクラスが複数存在する理由として正しいのはどれか。"
    choices:
      - "単に見た目のバリエーションを増やすため"
      - "保存容量の単価と取り出し料金のバランスを、データのアクセス頻度に応じて変えているため"
      - "リージョンごとに異なるクラスを使い分ける必要があるため"
      - "AWSのマーケティング上の理由だけである"
    answerIndex: 1
    explanation: "ストレージクラスは、保存容量の単価と取り出し料金という2つの要素のバランスを、アクセス頻度に応じて変えたものです。"

  - question: "S3 Glacierの特徴として正しいのはどれか。"
    choices:
      - "保存単価が最も高いが、即座に取り出せる"
      - "保存単価は極めて安いが、取り出しには数分から数時間かかる"
      - "保存も取り出しも、他のクラスと完全に同じ料金である"
      - "Glacierには取り出しという概念が存在しない"
    answerIndex: 1
    explanation: "Glacierは保存単価が極めて安い代わりに、データの取り出しには数分から数時間の時間がかかります。"

  - question: "ライフサイクルポリシーの機能として正しいのはどれか。"
    choices:
      - "削除だけを自動化する機能である"
      - "時間経過に応じたストレージクラスの自動移行や、古いバージョンの自動削除を実現できる"
      - "S3バケット自体を自動的に削除する機能である"
      - "アクセス権限を自動的に変更する機能である"
    answerIndex: 1
    explanation: "ライフサイクルポリシーは、削除だけでなく、時間経過に応じたストレージクラスへの自動移行も実現できます。"

  - question: "ストレージクラスを選ぶ際に、コスト以外に考慮すべき重要な観点は何か。"
    choices:
      - "考慮すべき点はコストだけである"
      - "実際にそのデータを取り出す必要が生じたときの、時間的な制約"
      - "ストレージクラスの名前の分かりやすさ"
      - "AWSのブランドイメージ"
    answerIndex: 1
    explanation: "障害調査などで緊急にデータを取り出す必要が生じた場合の時間的制約も、ストレージクラス選定の重要な観点です。"

  - question: "バージョニングとライフサイクルポリシーの関係として正しいのはどれか。"
    choices:
      - "両者はまったく無関係な機能である"
      - "ライフサイクルポリシーは、バージョニングで蓄積された過去のバージョンに対しても、削除や移行を設定できる"
      - "バージョニングを有効化すると、ライフサイクルポリシーは自動的に無効化される"
      - "ライフサイクルポリシーはバージョニングを有効化しないと使用できない"
    answerIndex: 1
    explanation: "ライフサイクルポリシーは、バージョニングによって蓄積された過去のバージョンに対しても、一定期間経過後の削除や移行を設定できます。"
