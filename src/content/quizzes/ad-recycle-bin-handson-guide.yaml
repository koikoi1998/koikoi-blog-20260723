questions:
  - question: "AD ごみ箱(AD Recycle Bin)は、Windows Serverにおいてどのような状態がデフォルトか。"
    choices:
      - "既定で有効になっている"
      - "既定で無効になっており、管理者が明示的に有効化する必要がある"
      - "ドメインコントローラーを昇格した時点で自動的に有効化される"
      - "フォレスト機能レベルを上げると自動的に有効化される"
    answerIndex: 1
    explanation: "AD ごみ箱は既定で無効です。`Enable-ADOptionalFeature`コマンドで管理者が明示的に有効化する必要があります。"

  - question: "AD ごみ箱を一度有効化した後、無効化することはできるか。"
    choices:
      - "いつでも無効化できる"
      - "フォレスト機能レベルを下げれば無効化できる"
      - "一度有効化すると、二度と無効化できない"
      - "全DCを再起動すれば無効化できる"
    answerIndex: 2
    explanation: "AD ごみ箱の有効化は不可逆な操作であり、一度有効化すると二度と無効化できません。"

  - question: "AD ごみ箱を使ってユーザーオブジェクトを復元した場合、そのユーザーが元々所属していたグループのメンバーシップはどうなるか。"
    choices:
      - "手動で再設定する必要がある"
      - "グループメンバーシップを含む、削除時点の属性がそのまま復元される"
      - "グループメンバーシップは失われ、二度と復元できない"
      - "グループそのものも同時に削除される"
    answerIndex: 1
    explanation: "AD ごみ箱による復元では、グループメンバーシップのような関連属性(linked attribute)を含む、削除時点のほぼすべての属性がそのまま復元されます。"

  - question: "AD ごみ箱が登場する前、削除されたオブジェクトはどのような状態で残されていたか。"
    choices:
      - "完全に消去され、一切復元できなかった"
      - "tombstoneと呼ばれる、属性の大半が失われた状態で残されていた"
      - "別のドメインに自動的に移動されていた"
      - "暗号化されたバックアップファイルとして保存されていた"
    answerIndex: 1
    explanation: "AD ごみ箱以前は、削除されたオブジェクトはtombstone(墓石)として、属性の大半が失われた状態でしか残されていませんでした。"

  - question: "`Restore-ADObject`で復元したオブジェクトが元の場所に戻らない場合、まず何を確認すべきか。"
    choices:
      - "DNSサーバーの設定"
      - "元の親コンテナー(OUなど)自体が先に復元されているか"
      - "フォレスト機能レベル"
      - "ライセンス認証の状態"
    answerIndex: 1
    explanation: "親コンテナーが復元されていないと、子オブジェクトは`LostAndFound`のような既定のコンテナーに復元されることがあります。親から順に復元する必要があります。"
