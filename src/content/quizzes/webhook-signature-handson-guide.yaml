questions:
  - question: "このハンズオンで、Webhookの受信側が署名を検証する方法として正しいのはどれか。"
    choices:
      - "送信元のIPアドレスだけを確認する"
      - "受け取ったペイロードから、自分でも共有シークレットを使って署名を計算し、送られてきた署名と一致するかを確認する"
      - "TLS証明書の有効期限だけを確認する"
      - "リクエストのヘッダーの数だけを確認する"
    answerIndex: 1
    explanation: "受信側は、受け取ったペイロードから自分で署名を再計算し、送られてきた署名と一致するかを確認します。"

  - question: "ペイロードの内容が署名計算後に改ざんされた場合に、このハンズオンで確認された挙動として正しいのはどれか。"
    choices:
      - "改ざんに気づかず、そのまま処理された"
      - "受信側が計算した署名と送られてきた署名が一致せず、401エラーで拒否された"
      - "サーバーがクラッシュした"
      - "自動的に正しい内容に修復された"
    answerIndex: 1
    explanation: "ペイロードが改ざんされると、受信側が再計算した署名と、送られてきた署名が一致しなくなり、401エラーで拒否されます。"

  - question: "`hmac.compare_digest`のような専用の比較関数が、単純な文字列比較(==)より好まれる理由として正しいのはどれか。"
    choices:
      - "処理速度が常に速いため"
      - "文字列の長さに関わらず常に一定時間で比較するため、タイミング攻撃のリスクを防げるため"
      - "メモリ使用量が少ないため"
      - "JSON形式のデータにしか使えないため"
    answerIndex: 1
    explanation: "通常の文字列比較は不一致が見つかった時点で終了するため、比較にかかる時間差から情報が漏れるタイミング攻撃のリスクがあります。"

  - question: "同じevent_idでWebhookが2回送信された場合に、このハンズオンの受信側で確認された挙動として正しいのはどれか。"
    choices:
      - "2回とも同じ処理が実行された"
      - "1回目は処理され、2回目は「already processed」として実際の処理がスキップされた"
      - "2回目はエラーで拒否された"
      - "1回目のデータが削除された"
    answerIndex: 1
    explanation: "event_idによる重複排除の仕組みにより、2回目は実際の処理がスキップされ、二重処理を防いでいます。"

  - question: "署名検証と重複排除(イベントID管理)の関係についての正しい理解はどれか。"
    choices:
      - "署名検証さえあれば、重複排除は不要である"
      - "署名検証は改ざんの有無を確認するものであり、重複排除は別の問題であるため、両方を別々に実装する必要がある"
      - "重複排除さえあれば、署名検証は不要である"
      - "署名検証と重複排除は、まったく同じ処理である"
    answerIndex: 1
    explanation: "署名検証は改ざんされていないことの確認、重複排除は同じイベントが2回処理されないことの保証であり、それぞれ別の目的を持つ対策です。"
