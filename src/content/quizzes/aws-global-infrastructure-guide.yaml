questions:
  - question: "AZ(アベイラビリティーゾーン)の説明として正しいのはどれか。"
    choices:
      - "世界中の主要都市に配置された、CDNキャッシュ用の拠点である"
      - "独立した電源・空調・ネットワーク回線を持つ、リージョン内の物理的に離れたデータセンター群である"
      - "リージョンよりも上位の、地理的な最上位区画である"
      - "EC2インスタンスを起動できない、軽量処理専用の拠点である"
    answerIndex: 1
    explanation: "AZは、独立した電源・空調・ネットワーク回線を持つ、リージョン内の物理的に離れた1つ以上のデータセンターの集まりです。"

  - question: "多くのAWSリソースについて正しい説明はどれか。"
    choices:
      - "作成したリソースは、どのリージョンからでも同じように表示される"
      - "選択したリージョンの中だけに存在し、別のリージョンには表示されない"
      - "リージョンという概念自体が存在しない"
      - "エッジロケーションでのみ作成できる"
    answerIndex: 1
    explanation: "多くのAWSリソースは、選択したリージョンの中だけに存在するリソースとして作成されます。"

  - question: "リージョン間のデータ複製について正しい説明はどれか。"
    choices:
      - "既定で自動的に複製される"
      - "既定では複製されず、必要な場合はクロスリージョンレプリケーションなどを明示的に有効化する必要がある"
      - "複製という概念自体が存在しない"
      - "エッジロケーションが自動的に複製を行う"
    answerIndex: 1
    explanation: "多くのAWSサービスは既定ではリージョンをまたいだデータの複製を行わず、必要な場合は明示的に機能を有効化する必要があります。"

  - question: "エッジロケーションの役割として正しいのはどれか。"
    choices:
      - "EC2インスタンスを起動するための、リージョンの下位区画である"
      - "CDNのキャッシュなど、ユーザーに最も近い場所での軽量な処理を担う拠点である"
      - "すべてのAWSリソースの中心となる、唯一の拠点である"
      - "リージョンよりも数が少ない、特別な拠点である"
    answerIndex: 1
    explanation: "エッジロケーションは、CloudFrontのようなCDNのキャッシュなど、ユーザーに最も近い場所での軽量な処理のための拠点であり、リージョンよりも多数配置されています。"

  - question: "マルチAZ設計とマルチリージョン設計の違いとして正しい説明はどれか。"
    choices:
      - "両者はまったく同じ難易度で実現できる"
      - "マルチAZは比較的容易に実現できるが、マルチリージョンはデータ整合性・レイテンシ・コストの面ではるかに難易度が高い"
      - "マルチリージョンの方が常に簡単である"
      - "マルチAZは実現不可能な設計である"
    answerIndex: 1
    explanation: "マルチAZはAWSのマネージドサービスを使えば比較的容易に実現できますが、マルチリージョンはデータ整合性・レイテンシ・コストの面で、はるかに難易度の高い設計判断が必要です。"
