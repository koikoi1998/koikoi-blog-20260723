questions:
  - question: "SPFが検証している内容として正しいのはどれか。"
    choices:
      - "メール本文が途中で改ざんされていないか"
      - "送信元IPアドレスが、そのドメインの正規の送信元として宣言されているか"
      - "受信者のメールアドレスが実在するか"
      - "メールの件名が適切かどうか"
    answerIndex: 1
    explanation: "SPFは、DNSのTXTレコードに宣言された正規の送信元IPアドレスと、実際の送信元IPアドレスが一致するかを検証します。"

  - question: "DKIMが検証している内容として正しいのはどれか。"
    choices:
      - "送信元IPアドレスが正規のものか"
      - "メール本文と一部のヘッダーが、電子署名によって途中で改ざんされていないか"
      - "受信サーバーのポート番号が正しいか"
      - "メールの送信時刻が正確か"
    answerIndex: 1
    explanation: "DKIMは、送信側が秘密鍵で作成した署名を、受信側が公開鍵で検証することで、本文・ヘッダーの改ざんの有無を確認します。"

  - question: "DMARCの役割として正しいのはどれか。"
    choices:
      - "メールを暗号化する"
      - "SPF/DKIMの検証結果とアライメントを組み合わせ、失敗時の扱い方を宣言する"
      - "メールサーバーの負荷分散を行う"
      - "IMAPとPOP3の違いを吸収する"
    answerIndex: 1
    explanation: "DMARCは、SPF/DKIMの結果とアライメント(Fromヘッダーとの一致)を踏まえ、失敗したメールをどう扱ってほしいかを送信ドメイン所有者が宣言する仕組みです。"

  - question: "「アライメント」の説明として正しいのはどれか。"
    choices:
      - "SPFとDKIMの検証速度を比較する仕組み"
      - "Fromヘッダーのドメインと、SPF/DKIMが実際に検証したドメインが一致しているかどうかの検証軸"
      - "メールサーバー間の時刻同期の仕組み"
      - "DNSサーバー同士の冗長化構成"
    answerIndex: 1
    explanation: "アライメントは、SPF/DKIM自体が合格していても、Fromヘッダーのドメインと一致していなければDMARCとしては不合格と判定される、もう1つの検証軸です。"

  - question: "DMARC導入時の実務上の定石として正しいのはどれか。"
    choices:
      - "最初からp=rejectで導入し、問題が起きたら調整する"
      - "p=noneでレポートを収集し、正規の送信元を把握してから段階的にquarantine、rejectへ引き上げる"
      - "DMARCはSPFやDKIMと同時に導入してはいけない"
      - "DMARCのレポート機能は使わない方がよい"
    answerIndex: 1
    explanation: "いきなりrejectにすると、把握していなかった正規の送信元まで拒否してしまうリスクがあるため、p=noneからの段階的な引き上げが定石です。"
