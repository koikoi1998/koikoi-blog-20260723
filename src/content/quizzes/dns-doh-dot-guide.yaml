questions:
  - question: "DNSSECとDoH/DoTの、守っている対象の違いとして正しいのはどれか。"
    choices:
      - "両者はまったく同じものを守っており、違いはない"
      - "DNSSECはデータの正当性(改ざん・なりすましの検知)を守り、DoH/DoTは通信経路の機密性(盗聴の防止)を守る"
      - "DNSSECは通信経路を暗号化し、DoH/DoTはデータの正当性を検証する"
      - "DNSSECとDoH/DoTは、どちらも通信速度の向上を目的としている"
    answerIndex: 1
    explanation: "DNSSECはデータそのものの正当性を保証する仕組みであり、DoH/DoTは通信経路の機密性(盗聴の防止)を保証する、まったく異なる対象を守る仕組みです。"

  - question: "「DNSSECを有効にしているから、DNSの通信は安全だ」という主張についての、正しい評価はどれか。"
    choices:
      - "完全に正確な主張である"
      - "不正確である。DNSSECは改ざん・なりすましを検知できるが、通信内容が経路上で盗み見られることを防ぐものではない"
      - "DNSSECは、暗号化と検証の両方を行うため、常に正確である"
      - "DNSSECは、通信速度に関する主張であり、安全性とは無関係である"
    answerIndex: 1
    explanation: "DNSSECは改ざん・なりすましを検知できますが、通信内容が経路上で盗み見られることを防ぐものではなく、この主張は不正確です。"

  - question: "DoH/DoTが暗号化によって保護している範囲として正しいのはどれか。"
    choices:
      - "クライアントから権威DNSサーバーまでの、すべての経路"
      - "クライアントと、利用している1つのリゾルバーとの間だけ"
      - "インターネット全体のすべてのDNS通信"
      - "暗号化による保護範囲は存在しない"
    answerIndex: 1
    explanation: "DoH/DoTが暗号化しているのは、クライアントが自分の使っているリゾルバーへ問い合わせを送る、最初の1区間だけです。"

  - question: "ブラウザが既定でDoHを使用することが、企業のDNS設計にもたらす実務上の課題として正しいのはどれか。"
    choices:
      - "ブラウザの表示速度が、常に低下する"
      - "社内DNSサーバーをバイパスし、スプリットホライズンDNSのような社内向けの名前解決の仕組みが、意図せず機能しなくなる可能性がある"
      - "社内DNSサーバーが、自動的に停止してしまう"
      - "DNSSECの検証が、自動的に無効化される"
    answerIndex: 1
    explanation: "ブラウザが既定でDoHを使用すると、社内DNSサーバーをバイパスし、スプリットホライズンDNSのような社内向けの名前解決の仕組みが機能しなくなる可能性があります。"

  - question: "Firefoxのカナリアドメイン(use-application-dns.net)の仕組みとして正しいのはどれか。"
    choices:
      - "このドメインへの問い合わせに正常な応答があると、DoHが自動的に有効化される"
      - "社内DNSサーバーがこのドメインへNXDOMAINを返すように設定すると、Firefoxはこれを検知し、既定のDoH自動有効化を無効化する"
      - "このドメインは、DNSSECの検証専用に使われる"
      - "このドメインを設定すると、すべてのDNS通信が自動的に暗号化される"
    answerIndex: 1
    explanation: "社内DNSサーバーがuse-application-dns.netへNXDOMAINを返すように設定すると、Firefoxはこれを企業によるDNS管理の信号として検知し、既定のDoH自動有効化を無効化します。"
