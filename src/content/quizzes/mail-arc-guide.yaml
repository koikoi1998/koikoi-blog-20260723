questions:
  - question: "メーリングリストを経由すると、SPFが失敗してしまう理由として正しいのはどれか。"
    choices:
      - "メーリングリストが、パスワードを変更してしまうため"
      - "最終的な受信サーバーから見える送信元IPが、元の送信者のIPではなく、メーリングリストサーバー自身のIPに変わるため"
      - "メーリングリストが、DNSレコードを自動的に削除するため"
      - "SPFは、そもそもメーリングリストには対応していない仕様であるため"
    answerIndex: 1
    explanation: "メーリングリストを経由すると、送信元IPがリストサーバー自身のIPに変わり、これは元の送信者のドメインのSPFレコードに含まれていないため、SPFが失敗します。"

  - question: "メーリングリストを経由すると、DKIMが失敗してしまう理由として正しいのはどれか。"
    choices:
      - "メーリングリストが、フッターの追加やSubjectへのタグ付与など、メールの内容そのものを変更するため"
      - "メーリングリストが、暗号化通信に対応していないため"
      - "DKIMは、そもそも本文を検証する仕組みではないため"
      - "メーリングリストが、送信者のパスワードを変更するため"
    answerIndex: 1
    explanation: "メーリングリストがフッター追加やタグ付与でメールの内容を変更すると、元のDKIM署名が対象としていた内容と一致しなくなり、DKIM検証が失敗します。"

  - question: "ARC(Authenticated Received Chain)が、この問題に対処する発想として正しいのはどれか。"
    choices:
      - "SPFとDKIMの検証そのものを、完全に無効化する"
      - "中継した側が、受け取った時点での認証結果を記録し、署名して次の宛先へ引き継ぐ"
      - "すべてのメーリングリストの使用を禁止する"
      - "メールの内容を、暗号化して送信する"
    answerIndex: 1
    explanation: "ARCは、中継した側が、受け取った時点での元のSPF/DKIM/DMARCの検証結果を記録し、署名して次の宛先へ引き継ぐことで、この問題に対処します。"

  - question: "ARCを設定した場合の、正しい理解はどれか。"
    choices:
      - "ARCを設定すれば、すべての転送メールが自動的に救済される"
      - "ARCの記録を実際に信頼するかどうかは、最終的な受信側のメールサーバーの方針次第である"
      - "ARCを設定すると、SPF・DKIM・DMARCの検証が不要になる"
      - "ARCは、受信側の設定に関わらず、常に有効である"
    answerIndex: 1
    explanation: "ARCは記録を検証可能な形で運ぶだけであり、その記録を実際に信頼するかどうかは、最終的な受信側のメールサーバーの方針次第です。"

  - question: "ARCの、仕様としての位置づけと実務上の状況についての、正しい理解はどれか。"
    choices:
      - "ARCは、正式な標準として確定しており、すべてのメールサーバーが対応を義務付けられている"
      - "ARCは『Experimental』(実験的)という位置づけだが、Gmailなどの大手メールサービスは既に対応しており、実務上の効果はすでに存在する"
      - "ARCは、まだ誰も採用していない、理論上の仕組みに過ぎない"
      - "ARCは、SPF・DKIM・DMARCより古い、廃止された仕組みである"
    answerIndex: 1
    explanation: "ARCを定義するRFC 8617は実験的な位置づけですが、Gmail・Microsoft 365・Yahooのような大手メールサービスは既に対応しており、実務上の効果は確実に存在します。"
