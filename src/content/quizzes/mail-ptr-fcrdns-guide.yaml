questions:
  - question: "PTRレコードの正体として正しいのはどれか。"
    choices:
      - "ホスト名からIPアドレスを導く、Aレコードと同じ方向のレコード"
      - "IPアドレスからホスト名を導く、Aレコードとは逆方向の逆引きレコード"
      - "メールの暗号化方式を指定するレコード"
      - "SPFの代わりに使われるレコード"
    answerIndex: 1
    explanation: "PTRレコードは、Aレコード(ホスト名→IPアドレス)とは逆方向に、IPアドレスからホスト名を導く、逆引きのためのDNSレコードです。"

  - question: "送信元IPアドレスにPTRレコードが存在しない場合に起きうることとして正しいのはどれか。"
    choices:
      - "常に問題なくメールが配送される"
      - "スパム送信の典型的な特徴とみなされ、接続拒否や迷惑メール判定の大きな要因になる"
      - "SPF・DKIM・DMARCの設定が自動的に無効化される"
      - "メールの文字コードが自動的に変換される"
    answerIndex: 1
    explanation: "PTRレコードがまったく存在しない送信元IPアドレスは、スパム送信の典型的な特徴とみなされ、接続拒否や迷惑メール判定の大きな加点要素になります。"

  - question: "FCrDNS(正引き一致検証)が行う、具体的な2段階の検証として正しいのはどれか。"
    choices:
      - "送信者のパスワードを2回確認する"
      - "PTRレコードでホスト名を取得し、そのホスト名をAレコードで正引きして、元のIPアドレスと一致するかを確認する"
      - "送信元ドメインを2つのDNSサーバーに問い合わせる"
      - "メールの件名を2回検査する"
    answerIndex: 1
    explanation: "FCrDNSは、PTRレコードの逆引きでホスト名を取得し、そのホスト名を今度はAレコードで正引きして、得られたIPアドレスが元の接続元IPアドレスと一致するかを検証する、2段階の検証です。"

  - question: "PTR/FCrDNSとSPF/DKIM/DMARCの違いとして正しいのはどれか。"
    choices:
      - "両者はまったく同じことを検証している"
      - "PTR/FCrDNSはIPアドレス自身の身元確認であり、SPF/DKIM/DMARCはドメインの身元確認である、独立した別の階層の検証である"
      - "SPF/DKIM/DMARCが正しければ、PTR/FCrDNSの検証は不要になる"
      - "PTR/FCrDNSは、SPFの別名に過ぎない"
    answerIndex: 1
    explanation: "PTR/FCrDNSはIPアドレス自身の身元確認であり、SPF/DKIM/DMARCはドメインの身元確認であるという、独立した別の階層の検証です。"

  - question: "AWS EC2環境でPTRレコードを設定する際の、正しい手順・制約として正しいのはどれか。"
    choices:
      - "自分のDNSサーバーで直接設定できる"
      - "AWSのサポートセンター経由でリクエストする必要があり、事前に対応する正引きのAレコードを設定しておく必要がある"
      - "PTRレコードはEC2では一切設定できない"
      - "Elastic IPアドレスを使わなければPTRレコードは設定できない"
    answerIndex: 1
    explanation: "AWS EC2では、PTRレコードの設定をAWSのサポートセンター経由でリクエストする必要があり、さらに対応する正引きのAレコードが先に設定済みであることが要求されます。"
