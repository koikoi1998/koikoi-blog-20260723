questions:
  - question: "notifyによって呼び出されたハンドラーが、既定で実行されるタイミングとして正しいのはどれか。"
    choices:
      - "notifyが呼び出された、その瞬間に即座に実行される"
      - "pre_tasks・roles/tasks・post_tasksという、各セクションが終わった直後に、まとめて1回だけ実行される"
      - "プレイブック全体が完全に終了した、翌日に実行される"
      - "ハンドラーという概念自体が、Ansibleには存在しない"
    answerIndex: 1
    explanation: "Ansibleの既定の動作では、notifyされたハンドラーは、pre_tasks・roles/tasks・post_tasksという、プレイ内の各セクションが終わった直後に、まとめて1回だけ実行されます。"

  - question: "同じハンドラーが、1つのセクションの中で3回notifyされた場合の実行回数として正しいのはどれか。"
    choices:
      - "3回実行される"
      - "1回だけ実行される"
      - "0回、まったく実行されない"
      - "notifyした回数によって、実行順序が変わるだけである"
    answerIndex: 1
    explanation: "同じハンドラーが何度notifyされても、該当セクションの終わりには1回だけしか実行されません。これは効率化のための設計です。"

  - question: "セクションの終わりを待たず、プレイの途中でハンドラーを即座に実行したい場合、正しい方法はどれか。"
    choices:
      - "meta: flush_handlersというタスクを挿入する"
      - "ハンドラーという仕組み自体を使わず、すべて通常タスクで書き直す"
      - "notifyを2回呼び出す"
      - "この操作は、技術的に不可能である"
    answerIndex: 1
    explanation: "meta: flush_handlersというタスクを挿入すると、その時点までに通知されているハンドラーを、セクションの終わりを待たずその場で実行させることができます。"

  - question: "タスクが途中で失敗した場合の、通知済みハンドラーの挙動として正しいのはどれか。"
    choices:
      - "失敗していても、通知済みのハンドラーは常に自動的に実行される"
      - "プレイが停止し、通知済みのハンドラーも実行されない。force_handlersを有効にしない限り後始末は行われない"
      - "ハンドラーの実行とタスクの失敗は、完全に無関係である"
      - "失敗した場合、むしろハンドラーの実行回数が増える"
    answerIndex: 1
    explanation: "タスクが失敗するとプレイ全体が停止し、それまでに通知されていたハンドラーも実行されないままになります。force_handlersを有効にすることで、失敗時でも通知済みのハンドラーを強制的に実行させることができます。"

  - question: "ハンドラー名に変数を使う際の注意点として正しいのはどれか。"
    choices:
      - "ハンドラー名には、変数を使うことが一切許可されていない"
      - "ハンドラー名は非常に早い段階でテンプレート展開されるため、その時点で変数の値が利用可能でないと、プレイ全体が失敗する"
      - "ハンドラー名の変数は、プレイの最後に評価されるため、常に安全である"
      - "ハンドラー名に変数を使うと、自動的にすべてのハンドラーがスキップされる"
    answerIndex: 1
    explanation: "ハンドラー名は、プレイの非常に早い段階でテンプレート展開されるため、ハンドラー名の中で使っている変数の値が、その時点でまだ利用可能になっていない場合、プレイ全体が失敗することがあります。"
