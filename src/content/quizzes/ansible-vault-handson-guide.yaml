questions:
  - question: "変数ファイルに機密情報をプレーンテキストのまま書き、Gitへコミットした場合の問題点は何か。"
    choices:
      - "Ansibleの実行速度が低下する"
      - "その行を後から削除しても、Gitのコミット履歴を遡れば機密情報を読み取れてしまう"
      - "Playbookが正常に実行できなくなる"
      - "特に問題はない"
    answerIndex: 1
    explanation: "一度Gitの履歴にコミットされた機密情報は、後から該当行を削除しても、過去のコミット履歴を遡れば読み取れてしまいます。"

  - question: "`ansible-vault encrypt`で暗号化したファイルの中身を`cat`コマンドで見ると、どのようになっているか。"
    choices:
      - "元のプレーンテキストがそのまま表示される"
      - "`$ANSIBLE_VAULT`から始まる、意味の読み取れない暗号文になっている"
      - "ファイルが空になっている"
      - "エラーメッセージが表示される"
    answerIndex: 1
    explanation: "暗号化されたファイルの中身は、$ANSIBLE_VAULTから始まる、意味の読み取れない暗号文になります。"

  - question: "暗号化された変数ファイルの内容を後から変更したい場合、最も簡単な方法はどれか。"
    choices:
      - "一度手動で復号し、編集後に手動で再暗号化する"
      - "`ansible-vault edit`コマンドを使い、復号・編集・再暗号化を1つの手順で行う"
      - "ファイルを削除して最初から作り直す"
      - "暗号化されたファイルは二度と編集できない"
    answerIndex: 1
    explanation: "ansible-vault editコマンドを使えば、復号・編集・再暗号化を1つのコマンドで完結できます。"

  - question: "`vault-id`という仕組みの主な用途は何か。"
    choices:
      - "Ansibleのバージョンを管理すること"
      - "開発環境用・本番環境用など、環境ごとに異なる暗号化パスワードを使い分けること"
      - "サーバーのIPアドレスを暗号化すること"
      - "Playbookの実行速度を計測すること"
    answerIndex: 1
    explanation: "vault-idは、開発環境用と本番環境用など、異なる暗号化パスワードを同じリポジトリ内で使い分けられるようにする仕組みです。"

  - question: "実務でよく使われる、機密情報の管理方法として適切なものはどれか。"
    choices:
      - "Playbook全体を丸ごと暗号化する"
      - "機密情報を含む変数だけを専用の暗号化ファイルに切り出し、それ以外のコードは暗号化しない"
      - "機密情報はすべて環境変数にハードコードする"
      - "機密情報は暗号化せず、アクセス権限だけで保護する"
    answerIndex: 1
    explanation: "機密情報を含む変数だけを専用の暗号化ファイルに切り出し、それ以外の通常のコードは暗号化せずにバージョン管理する、という設計が実務では一般的です。"
