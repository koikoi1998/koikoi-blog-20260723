questions:
  - question: "なぜL2TPとIPsecを組み合わせる必要があるのか、最も正確な理由はどれか。"
    choices:
      - "L2TP単体には暗号化機能がなく、IKEv1ベースのIPsec単体にはリモートアクセスVPNに必要なユーザー単位認証・仮想IPアドレスの自動払い出しの標準的な仕組みがなかったため"
      - "L2TPだけではインターネット上でトンネルを作れず、IPsecがトンネリング機能そのものを提供しているため"
      - "IPsecだけでは暗号鍵の交換ができず、L2TPが鍵交換を代替しているため"
      - "L2TPはTCPベースのプロトコルであり、UDPで送るためにIPsecでカプセル化する必要があるため"
    answerIndex: 0
    explanation: "トンネルを掘る技術(L2TP)と、鍵をかける技術(IPsec)がそれぞれ別の理由で開発され、組み合わさって今の形になりました。L2TP自体には暗号化機能がなく、IKEv1ベースのIPsecにはユーザー単位認証・仮想IP払い出しの標準機能がなかったことが組み合わせの理由です。"

  - question: "IPsecのESP(トランスポートモード)による暗号化の範囲についての記述のうち、正しいものはどれか。"
    choices:
      - "外側のIPヘッダーとUDPヘッダー(ポート1701)を含めてすべて暗号化される"
      - "UDPヘッダー(ポート1701)を含む、L2TP/PPP/データ部分が暗号化されるが、元の(外側の)IPヘッダーはそのまま残る"
      - "L2TPヘッダーとデータ部分のみが暗号化され、UDPヘッダーはそのまま経路上で見える"
      - "IKEのネゴシエーション内容のみが暗号化され、実データ部分は平文のまま送られる"
    answerIndex: 1
    explanation: "トランスポートモードは元のIPヘッダーをそのまま残し、その中身(UDP/L2TP/PPP/データ)だけを暗号化します。これによりUDPポート1701という情報自体が経路上から見えなくなります。"

  - question: "「ファイアウォールでUDP1701を開けないとL2TP/IPsec通信は成立しない」という主張への最も適切な反論はどれか。"
    choices:
      - "正しい。UDP1701はL2TPの制御メッセージ専用ポートであり、経路上のすべての機器で許可が必要である"
      - "誤り。UDP1701はESPによって暗号化された中身の一部になっているため、経路上のファイアウォールから見えるのはUDP500・UDP4500・IPプロトコル番号50(ESP)だけであり、UDP1701を中間機器で個別に許可する必要は通常ない"
      - "誤り。L2TP/IPsecはそもそもUDPを使わずTCPポート1701を使用するため、この主張自体が根本的に誤りである"
      - "正しい。ただしNAT-Tを使わない場合に限り、UDP1701を明示的に許可する必要がある"
    answerIndex: 1
    explanation: "ESPがUDPヘッダーごと暗号化するため、経路上のファイアウォール・ルーターから見えるのはUDP500(IKE)・UDP4500(NAT-T)・IPプロトコル番号50(ESP)だけです。UDP1701はエンドポイント以外の中間機器で個別に許可する必要は通常ありません。"

  - question: "L2TP/IPsecがIPsecのトンネルモードではなくトランスポートモードで足りる理由として最も適切なものはどれか。"
    choices:
      - "トンネルモードよりトランスポートモードの方が暗号強度が高いため"
      - "「仮想的なトンネルを作る」という役割はすでにL2TP側で果たされているため、ここでさらにトンネルモードを重ねるとIPヘッダーが二重に付くだけの無駄なオーバーヘッドになるから"
      - "トランスポートモードでなければNAT-Tの仕組みが機能しないため"
      - "PPPの認証にはトランスポートモードの使用がRFCで必須と定められているため"
    answerIndex: 1
    explanation: "トンネルモードは元のIPパケット全体を新しい外側IPヘッダーで包む方式です。L2TP自身がすでにトンネル機能を持つため、L2TP/IPsecではトランスポートモードで十分であり、トンネルモードを重ねるのは冗長です。"

  - question: "NAT-Tにおける「Non-ESPマーカー」の役割として正しいものはどれか。"
    choices:
      - "NATを経由しているかどうかを検出するために、送信元IPアドレスとポート番号のハッシュ値を計算するペイロード"
      - "UDPポート4500上を流れるIKEメッセージと、カプセル化されたESPパケットとを、受信側が区別するためにペイロード先頭に付与される4バイトの識別子"
      - "ESPパケットの改ざんを検知するための認証タグ(ICV)"
      - "事前共有鍵(PSK)を安全に配送するための暗号化されたペイロード"
    answerIndex: 1
    explanation: "IKEメッセージにはUDPペイロード先頭に4バイトの0x00000000(Non-ESPマーカー)が付き、ESPパケットにはこのマーカーが付きません。受信側は先頭4バイトを見るだけで、同じUDPポート4500上の2種類のメッセージを瞬時に判別できます。"

  - question: "IKEフェーズ1のMain ModeとAggressive Modeのトレードオフに関する記述のうち、最も正確なものはどれか。"
    choices:
      - "Aggressive Modeは6往復、Main Modeは3往復のメッセージのやり取りで完了する"
      - "Main Modeは身元情報を暗号化した後に交換するため盗聴されても保護されるが、Aggressive Modeは身元情報や認証ハッシュを暗号化前に交換するため、事前共有鍵に対するオフライン総当たり攻撃のリスクがある"
      - "Aggressive ModeはIKEv2専用のモードであり、IKEv1では選択できない"
      - "Main ModeとAggressive Modeは使用する暗号化アルゴリズムが異なるだけで、認証の安全性そのものに差はない"
    answerIndex: 1
    explanation: "Main Modeは6往復かけて身元情報を暗号化後に交換するため保護されますが、Aggressive Modeは3往復に短縮する代わりに認証ハッシュを暗号化前に交換するため、PSK認証との組み合わせでオフライン総当たり攻撃のリスクが生じます。"

  - question: "L2TP/IPsecにおいて、PPP認証成功後に払い出される「仮想IPアドレス」が必要な理由として、最も適切なものはどれか。"
    choices:
      - "クライアントはVPNサーバーの公開IPアドレスにまだ到達できていないため、内部通信用に別のIPアドレスが必要になるから"
      - "多くの内部サーバーが送信元IPアドレスが社内アドレス帯かどうかでアクセス制御を行っており、クライアントの送信元IPを「社内からの正当なアクセス」に見せる必要があるから"
      - "IPsecのESPが仮想IPアドレス宛のパケットしか暗号化できない仕様になっているから"
      - "L2TPのTunnel IDが仮想IPアドレスと同じ値でなければセッションを識別できない仕様になっているから"
    answerIndex: 1
    explanation: "クライアントはVPNサーバーという入口までは到達できていますが、その先の内部サーバーは送信元IPアドレスが社内アドレス帯かどうかでアクセス制御を行っていることが多く、仮想IPアドレスの払い出しによってこの制御を正当に通過できるようになります。"

  - question: "L2TP/IPsecの二層の認証モデル(IPsec層の認証とPPP層の認証)に関する実務上の弱点として、記事内で指摘されているものはどれか。"
    choices:
      - "IPsec層の事前共有鍵(PSK)を組織内の全ユーザーで使い回す構成が多く見られ、この場合実質的な個人認証はPPP層のユーザー名・パスワードのみに依存することになる"
      - "PPP層の認証はESPによる暗号化の前に行われるため、常に平文でネットワーク上を流れてしまう"
      - "IPsec層の認証には証明書しか使用できず、事前共有鍵(PSK)は仕様上サポートされていない"
      - "二層の認証モデルでは、接続のたびに毎回異なる鍵ペアを新規生成する必要があり運用負荷が極めて高い"
    answerIndex: 0
    explanation: "IPsec層のPSKを全ユーザーで使い回す構成はよく見られ、この場合IPsec層は「誰でも同じ鍵でトンネルを開ける」状態になり、実質的な個人認証はPPP層のユーザー名・パスワードにすべて依存することになります。"

  - question: "MS-CHAPv2の既知の暗号強度の弱点について、L2TP/IPsecの文脈における最も正確な説明はどれか。"
    choices:
      - "MS-CHAPv2はL2TP/IPsecでは仕様上使用できないプロトコルであるため、この弱点は無関係である"
      - "MS-CHAPv2内部のDES暗号の解析コストが単一のDES鍵相当にまで還元できることが指摘されているが、L2TP/IPsecではこの認証ハンドシェイクがESPで暗号化済みの経路の中で行われるため、経路上の第三者が平文のハンドシェイクを直接観測することはできない"
      - "この弱点はIKEフェーズ1の事前共有鍵にのみ影響し、PPP認証には一切影響しない"
      - "この弱点はL2TPv3にのみ存在し、リモートアクセスVPNで使われるL2TPv2には存在しない"
    answerIndex: 1
    explanation: "MS-CHAPv2の解析コスト低減は主にPPTP(L2TPを介さない構成)で致命的とされた弱点です。L2TP/IPsecではPPP認証のやり取りがすでにESPで暗号化された経路内で行われるため、通信経路上の第三者が直接観測することはできません。"

  - question: "L2TPv3と、リモートアクセスVPNで使われるL2TPv2の違いに関する記述として正しいものはどれか。"
    choices:
      - "L2TPv3はPPPを前提とせず、イーサネットフレームなどのL2フレームそのものをIPネットワーク上でトンネリングする疑似回線(pseudowire)技術であり、リモートアクセスVPNのL2TP/IPsecとは用途が異なる"
      - "L2TPv3はL2TPv2の暗号化機能を強化したバージョンであり、IPsecを組み合わせなくても暗号化できる"
      - "L2TPv3はUDPではなくTCPを使用する点がL2TPv2と異なる"
      - "L2TPv3はNAT-Tに対応していないため、企業向けリモートアクセスVPNでは使用されない"
    answerIndex: 0
    explanation: "L2TPv3(RFC 3931)はPPPを前提とせず、L2フレームそのものをトンネリングする疑似回線技術で、データセンター間のL2セグメント延伸などに使われます。リモートアクセスVPNの文脈で語られるL2TP/IPsec(L2TPv2)とは別物です。"

  - question: "IKEフェーズ1の証明書認証において、nonce(毎回変わる乱数)を署名対象に含めることの目的として最も適切なものはどれか。"
    choices:
      - "DH鍵交換の計算量を減らし、ハンドシェイクを高速化するため"
      - "過去のハンドシェイクの署名を盗聴者がそのまま再送してなりすます「リプレイ攻撃」を防ぐため"
      - "証明書の有効期限を自動的に延長するため"
      - "NAT越えの際に相手のポート番号を識別するため"
    answerIndex: 1
    explanation: "毎回異なるnonceを署名対象に含めることで「今、このセッションのために」署名したことを保証し、過去の署名を使い回すリプレイ攻撃を防いでいます。"
