questions:
  - question: "Webキャッシュ欺瞞が成立する、根本的な原因として正しいのはどれか。"
    choices:
      - "オリジンサーバーが、すべてのリクエストを拒否するから"
      - "キャッシュ層とオリジンサーバーが、同じURLを異なる方法で解釈してしまうから"
      - "利用者が、常に同じパスワードを使い続けているから"
      - "ネットワーク機器が、物理的に故障しているから"
    answerIndex: 1
    explanation: "Webキャッシュ欺瞞は、キャッシュ層とオリジンサーバーが、同じURLを異なる方法で解釈してしまうことを悪用します。オリジンは末尾の余分なパスを無視しますが、キャッシュ層は拡張子だけを見て静的だと誤判定します。"

  - question: "Webキャッシュポイズニングが悪用する、入力の特徴として正しいのはどれか。"
    choices:
      - "常にキャッシュキーに含まれている入力"
      - "レスポンスの内容に実際には影響を与えているにもかかわらず、キャッシュキーに含まれていない入力"
      - "暗号化されていない通信経路を通る入力"
      - "ユーザー名とパスワードだけを含む入力"
    answerIndex: 1
    explanation: "Webキャッシュポイズニングは、X-Forwarded-Hostのようなヘッダーなど、レスポンスの内容に実際には影響を与えているにもかかわらず、キャッシュキーに含まれていない入力を悪用します。"

  - question: "Webキャッシュ欺瞞とWebキャッシュポイズニングの関係として正しいのはどれか。"
    choices:
      - "両者は完全に同じ攻撃の、単なる別名である"
      - "異なる仕組みを持つ、別の攻撃である(解釈の不一致 vs キーに含まれていない入力)"
      - "Webキャッシュ欺瞞は、Webキャッシュポイズニングの後継バージョンである"
      - "両者とも、キャッシュをまったく使わないWebサイトにのみ発生する"
    answerIndex: 1
    explanation: "Webキャッシュ欺瞞は、キャッシュ層とオリジンの解釈の不一致を悪用する攻撃、Webキャッシュポイズニングは、キャッシュキーに含まれていない入力を悪用する攻撃という、異なる仕組みを持つ攻撃です。"

  - question: "多くのキャッシュ層が、レスポンスをキャッシュするかどうかを判断する方法として正しいのはどれか。"
    choices:
      - "常にオリジンサーバーに個別に問い合わせて判断する"
      - "URLの拡張子だけを見て、独自に判断することがある"
      - "レスポンスの内容を、すべて人間が目視確認してから判断する"
      - "判断は一切行われず、すべてのレスポンスが無条件にキャッシュされる"
    answerIndex: 1
    explanation: "多くのキャッシュ層は、URLの拡張子だけを見て、そのレスポンスをキャッシュすべきかどうかを独自に判断することがあり、これがWebキャッシュ欺瞞の成立条件になります。"

  - question: "2024年の研究が明らかにした内容として正しいのはどれか。"
    choices:
      - "すべてのHTTPサーバーとプロキシが、URLを完全に同じ方法で解釈することが証明された"
      - "さまざまなHTTPサーバーやプロキシが、巧妙に作成されたURLをそれぞれ異なる方法で解釈してしまう問題が、多数のWebサイトとCDNプロバイダーで悪用可能であることが明らかにされた"
      - "キャッシュという仕組み自体が、技術的に不可能であることが証明された"
      - "すべてのCDNプロバイダーが、この問題への対策を完全に実装済みであることが確認された"
    answerIndex: 1
    explanation: "2024年に公開された研究では、さまざまなHTTPサーバーやプロキシが、巧妙に作成されたURLをそれぞれ異なる方法で解釈してしまう問題が、多数のWebサイトとCDNプロバイダーに対する攻撃手法として、体系的に明らかにされました。"
