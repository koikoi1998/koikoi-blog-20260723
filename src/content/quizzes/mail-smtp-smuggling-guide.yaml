questions:
  - question: "SMTPスマグリングが悪用する、送信側と受信側のMTAの間の不一致として正しいのはどれか。"
    choices:
      - "使用するポート番号の違い"
      - "メールの終端シーケンス(<CR><LF>.<CR><LF>)を、どこだと解釈するかという違い"
      - "対応している文字エンコーディングの違い"
      - "TLS証明書の発行元の違い"
    answerIndex: 1
    explanation: "SMTPスマグリングは、送信側のMTAと受信側のMTAが、メールの終端シーケンスの、わずかな表記の違いを、それぞれ異なる基準で解釈してしまうことを悪用します。"

  - question: "SMTPスマグリング攻撃において、外側の封筒がSPF/DKIM/DMARCすべてに合格する理由として正しいのはどれか。"
    choices:
      - "SPF/DKIM/DMARCという仕組み自体が、技術的に機能していないから"
      - "外側の封筒自体は、本当に正規の送信元から、正規の認証情報とともに送られてきているから"
      - "受信側のMTAが、検証を常にスキップしているから"
      - "攻撃者が、認証サーバーへ不正アクセスしているから"
    answerIndex: 1
    explanation: "外側の封筒自体は、本当に正規の送信元から、正規の認証情報とともに送られてきているため、SPF/DKIM/DMARCのすべての検証に、正しく合格します。"

  - question: "2023年に、SMTPスマグリングが実際に成立することが確認された、主要なMTAソフトウェアとして正しいのはどれか。"
    choices:
      - "Apache HTTPdとnginxだけ"
      - "Postfix・Sendmail・Exim"
      - "Windowsのメモ帳だけ"
      - "すべてのWebブラウザ"
    answerIndex: 1
    explanation: "この攻撃手法は、2023年、Postfix(CVE-2023-51764)・Sendmail(CVE-2023-51765)・Exim(CVE-2023-51766)という、複数の主要なMTAソフトウェアに対して、実際に成立することが確認されました。"

  - question: "Postfixにおける、SMTPスマグリングへの対策として正しいのはどれか。"
    choices:
      - "smtpd_forbid_bare_newline=yesを設定し、ベアLFを終端シーケンスの構成要素として認めないようにする"
      - "SPF/DKIM/DMARCのすべての検証を無効化する"
      - "Postfixのサービス自体を完全に停止する"
      - "ポート25番を永久に閉鎖する"
    answerIndex: 1
    explanation: "Postfixでは、smtpd_forbid_bare_newline=yesという設定を有効にすることで、CRを伴わないベアLFを、終端シーケンスの構成要素として認めないようにし、この解釈の不一致そのものを塞ぐ対策が提供されています。"

  - question: "SMTPスマグリングと、HTTPリクエストスマグリングの関係として正しいのはどれか。"
    choices:
      - "両者は、まったく無関係な、別の種類の問題である"
      - "両者とも、メッセージの境界線の解釈について、複数の実装が異なる基準を持つことを悪用する、同じ種類のバグである"
      - "SMTPスマグリングは、HTTPリクエストスマグリングの前身であり、現在は使われていない"
      - "両者は、同じソフトウェアでしか発生しない"
    answerIndex: 1
    explanation: "SMTPスマグリングは、ロードバランシング学科で扱ったHTTPリクエストスマグリングと、まったく同じ構造の問題であり、どちらも、メッセージの境界線について複数の実装が異なる解釈を持つことを悪用します。"
