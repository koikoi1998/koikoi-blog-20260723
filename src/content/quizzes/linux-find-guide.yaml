questions:
  - question: "findコマンドで、ファイルだけ(ディレクトリを除く)に絞り込むオプションはどれか。"
    choices:
      - "-name"
      - "-type f"
      - "-mmin"
      - "-exec"
    answerIndex: 1
    explanation: "-type fはファイルだけ、-type dはディレクトリだけに絞り込むオプションです。"

  - question: "`find /etc/bind -mmin -30`が意味する条件はどれか。"
    choices:
      - "30日以内に更新されたファイル"
      - "30分以内に更新されたファイル"
      - "30個以内のファイル"
      - "30MB以下のファイル"
    answerIndex: 1
    explanation: "-mmin -30は「30分以内に更新されたファイル」という条件です。"

  - question: "`-exec`オプションの役割として正しいのはどれか。"
    choices:
      - "検索結果をファイルに保存する"
      - "見つかったファイルそれぞれに対して、指定したコマンドを実行する"
      - "検索速度を高速化する"
      - "権限エラーを自動的に無視する"
    answerIndex: 1
    explanation: "-execを使うと、見つかったファイルに対して指定したコマンドをその場で実行できます。{}が見つかったファイルのパスのプレースホルダーです。"

  - question: "findとlocateの違いとして正しい説明はどれか。"
    choices:
      - "findの方が常に高速である"
      - "locateは事前に作成された索引を検索するため高速だが、直近数分のファイルは見つからないことがある"
      - "locateはWindowsでのみ使用できる"
      - "findとlocateはまったく同じ結果を返す"
    answerIndex: 1
    explanation: "locateは索引(データベース)を検索するため高速ですが、索引が定期的にしか更新されないため、作成直後のファイルは見つからないことがあります。"

  - question: "ディレクトリの命名慣習(FHS)を理解していることの実務上の意義は何か。"
    choices:
      - "findコマンドの実行速度が上がる"
      - "findで検索する前に、そこに何がありそうかという当たりを付けられるようになる"
      - "Permission deniedのエラーが出なくなる"
      - "locateの索引が自動更新されるようになる"
    answerIndex: 1
    explanation: "FHSの命名慣習を理解していると、findで検索する前の段階で『おそらくこのあたりにあるはずだ』という当たりを付けられます。"
