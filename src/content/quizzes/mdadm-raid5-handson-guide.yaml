questions:
  - question: "3台構成のRAID5アレイで、Array Size(実使用可能容量)が1台あたりの容量の約2台分になる理由として正しいのはどれか。"
    choices:
      - "ディスクが故障しているため"
      - "3台のうち、容量としては1台分がパリティのために使われているため"
      - "ファイルシステムのオーバーヘッドのため"
      - "mdadmの設定ミスのため"
    answerIndex: 1
    explanation: "3台構成のRAID5では、1台分の容量がパリティ用に使われるため、実使用可能容量は2台分になります。"

  - question: "RAID5の縮退状態で、データの読み取りがどう行われているかについて正しいのはどれか。"
    choices:
      - "単純に、もう1台の完全な複製を読み取っている"
      - "残った台数分のデータと、パリティの関係式から、失われたデータをその都度計算で復元している"
      - "データの読み取りが完全に不可能になる"
      - "キャッシュに保存されていた古いデータを返している"
    answerIndex: 1
    explanation: "RAID5の縮退状態では、残りのデータとパリティから、失われたデータをその都度計算で復元しながら読み取りが行われます。"

  - question: "RAID1の縮退状態と、RAID5の縮退状態の違いについて正しい理解はどれか。"
    choices:
      - "両者は内部的にまったく同じ処理である"
      - "RAID1は単純に複製を読むだけだが、RAID5はパリティから都度計算で復元する、より複雑な処理である"
      - "RAID5の方が、常に処理が単純である"
      - "RAID1には、縮退状態という概念が存在しない"
    answerIndex: 1
    explanation: "RAID1の縮退状態は単純な複製読み取りですが、RAID5の縮退状態は、パリティからの計算による復元という、より複雑な処理です。"

  - question: "RAID5のリビルド処理の内容として正しいのはどれか。"
    choices:
      - "もう1台の内容を、そのままコピーする"
      - "残っているディスクのデータから、パリティの計算式を使って、失われたデータを新しいディスクへ再構築する"
      - "すべてのデータを削除してから、空の状態で開始する"
      - "リビルドという処理自体が、RAID5には存在しない"
    answerIndex: 1
    explanation: "RAID5のリビルドは、残りのデータとパリティの計算式を使って、失われたデータを新しいディスクへ再構築する処理です。"

  - question: "このハンズオンから得られる、設計評価における重要な視点として正しいのはどれか。"
    choices:
      - "同じ機能要件を満たす実装は、常に同じ内部処理を行っている"
      - "同じ機能要件を満たす異なる実装が存在する場合、それぞれが払っている代償(計算コストなど)を具体的に見極める必要がある"
      - "RAID5は、RAID1より常に優れている"
      - "RAIDの内部処理を理解する必要は、実務上ない"
    answerIndex: 1
    explanation: "RAID1とRAID5は同じ「1台故障への耐性」を実現していますが、その代償(計算コスト)はまったく異なり、これを見極めることが設計評価に重要です。"
