questions:
  - question: "Ansibleの既定の実行戦略であるlinearの説明として正しいのはどれか。"
    choices:
      - "各ホストが独立して、自分のペースですべてのTaskを進める"
      - "あるTaskを全対象ホストで実行し終えるまで、次のTaskに進まない"
      - "常に1台のホストにのみ処理を送る"
      - "実行順序はホストごとにランダムに決まる"
    answerIndex: 1
    explanation: "linear戦略は、あるTaskについて全ホストの完了を待ってから、次のTaskへ進みます。"

  - question: "forksの説明として正しいのはどれか。"
    choices:
      - "Playbook内のTaskの総数を制限する設定"
      - "1つのTaskを同時に何台のホストへ実行するかという並列度の設定"
      - "SSH接続のタイムアウト秒数を制御する設定"
      - "変数の優先順位を制御する設定"
    answerIndex: 1
    explanation: "forksは、1つのTaskを同時に何台のホストへ向けて実行するかを制御する、並列度の設定です。既定値は5です。"

  - question: "linear戦略の構造的な弱点として正しいのはどれか。"
    choices:
      - "並列実行が一切できない"
      - "あるTaskについて、最も遅い1台のホストの完了を、他のすべてのホストが待たされる"
      - "変数の優先順位が壊れる"
      - "Check Modeが使えなくなる"
    answerIndex: 1
    explanation: "linear戦略では、1台でも極端に遅いホストがあると、そのTaskの完了までの待ち時間が全体に波及します。"

  - question: "free戦略を使う際に注意すべき点として正しいのはどれか。"
    choices:
      - "常にlinearより低速になる"
      - "ホスト間の同期が必要な処理を含むPlaybookでは、意図しない実行順序になる可能性がある"
      - "forksの設定が完全に無効になる"
      - "Check Modeとの併用が一切できなくなる"
    answerIndex: 1
    explanation: "free戦略では各ホストが独立して進むため、全ホストの完了を前提とした処理を含むPlaybookでは、意図しないタイミングで実行される危険があります。"

  - question: "台数増加でPlaybookの実行時間が想定以上に伸びた場合、確認すべきこととして適切なのはどれか。"
    choices:
      - "Playbookのファイル名を変更する"
      - "forksの値が対象ホスト数に対して低すぎないか、特定ホストのボトルネックがないかを確認する"
      - "インベントリファイルをすべて削除する"
      - "確認する方法は存在しない"
    answerIndex: 1
    explanation: "forksの値と、特定ホストの極端に遅いTaskの有無を、-vオプションなどで確認するのが実務での定石です。"
