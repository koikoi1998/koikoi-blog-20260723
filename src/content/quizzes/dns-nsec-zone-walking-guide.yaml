questions:
  - question: "NSECレコードの役割として正しいのはどれか。"
    choices:
      - "DNS応答そのものを暗号化する"
      - "あるレコードが存在しないことを、次に実在する名前を示すことで証明する"
      - "ゾーン転送の認証を行う"
      - "DNSキャッシュの有効期限を決定する"
    answerIndex: 1
    explanation: "NSECは、問い合わせた名前は存在しないが、ゾーン内をソート順に辿ると次に実在する名前はこれだ、という形式で、存在しないことを証明します。"

  - question: "『ゾーンウォーキング』と呼ばれる手法の正しい説明はどれか。"
    choices:
      - "ゾーン転送を暗号化する手法"
      - "NSECの『次の名前』を繰り返し辿ることで、ゾーン内のすべての名前を列挙する手法"
      - "DNSキャッシュをクリアする手法"
      - "複数のDNSサーバー間で負荷分散する手法"
    answerIndex: 1
    explanation: "存在しない名前への問い合わせを繰り返しながら、NSECが示す『次の名前』を辿っていくことで、ゾーン内のすべての名前を順番に列挙できてしまう手法です。"

  - question: "NSEC3が、NSECと異なる点として正しいのはどれか。"
    choices:
      - "暗号化を一切行わない"
      - "実際の名前の代わりに、その名前をハッシュ化した値を連結する"
      - "ゾーン転送を完全に無効化する"
      - "DNSSECの署名を不要にする"
    answerIndex: 1
    explanation: "NSEC3は、NSECと同じ『次の名前』の仕組みを維持しながら、実際の名前の代わりに、ハッシュ化した値を連結します。"

  - question: "NSEC3が完全な防御ではない理由として正しいのはどれか。"
    choices:
      - "NSEC3は、そもそも実装されていないことが多いため"
      - "ハッシュが不可逆ではなく、予測しやすい名前は辞書攻撃によって特定される可能性があるため"
      - "NSEC3は、DNSSECとは無関係な別の規格だから"
      - "NSEC3は、ゾーン転送そのものを不可能にするため"
    answerIndex: 1
    explanation: "NSEC3のハッシュは不可逆ではなく、攻撃者がありそうな名前を事前にハッシュ化して比較することで、元の名前を特定できる可能性があります。"

  - question: "RFC 9276における、NSEC3のsaltとイテレーション回数の現在の推奨として正しいのはどれか。"
    choices:
      - "saltを長くし、イテレーション回数を増やす"
      - "saltを空にし、イテレーション回数をゼロにする"
      - "saltとイテレーション回数を、ランダムに毎回変更する"
      - "NSEC3自体を使用せず、常にNSECを使う"
    answerIndex: 1
    explanation: "RFC 9276の現在の推奨は、saltを空にし、イテレーション回数をゼロにすることです。増加させても、鍵のロールオーバーを複雑にするだけで、実質的な安全性の向上にはつながりません。"
