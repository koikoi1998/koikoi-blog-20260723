questions:
  - question: "STARTTLSが完璧に機能している場合でも、メールを中継するサーバーの運用者にできることとして正しいのはどれか。"
    choices:
      - "復号された本文を、そのまま読むことができる"
      - "本文を一切見ることができない"
      - "送信者の秘密鍵を自動的に入手できる"
      - "受信者の公開鍵を自動的に無効化できる"
    answerIndex: 0
    explanation: "STARTTLSは通信経路の暗号化だけを目的としているため、中継するサーバーの運用者は、復号された本文をそのまま読むことができます。"

  - question: "S/MIMEが使う証明書として正しいのはどれか。"
    choices:
      - "通信先のサーバーの正体を証明する、サーバー証明書"
      - "特定のメールアドレスに紐づく、メール証明書"
      - "DNSのゾーンを証明する、ゾーン証明書"
      - "Wi-Fiルーターの正体を証明する、デバイス証明書"
    answerIndex: 1
    explanation: "S/MIMEは、特定のメールアドレスに紐づく、メール証明書(個人向けの電子証明書)を使います。"

  - question: "STARTTLSとS/MIMEが、それぞれ暗号化の対象としているものの違いとして正しいのはどれか。"
    choices:
      - "STARTTLSは本文を、S/MIMEは通信経路を暗号化する"
      - "STARTTLSは通信経路を、S/MIMEは本文そのものを暗号化する"
      - "両者はまったく同じものを暗号化する"
      - "どちらも暗号化の対象を持たない"
    answerIndex: 1
    explanation: "STARTTLSはメールサーバー間の通信経路を、S/MIMEはメールの本文そのものを暗号化する、まったく異なるレイヤーの仕組みです。"

  - question: "S/MIMEで暗号化されたメールでも、暗号化の対象外のまま平文で送られる情報として正しいのはどれか。"
    choices:
      - "メールの本文全体"
      - "件名(Subject)などの一部のヘッダー情報"
      - "送信者の秘密鍵そのもの"
      - "受信者の公開鍵そのもの"
    answerIndex: 1
    explanation: "件名(Subject)などの一部のヘッダー情報は、S/MIMEの暗号化の対象外のまま、平文で送られます。"

  - question: "STARTTLSとS/MIMEの関係として正しいのはどれか。"
    choices:
      - "どちらか1つを選べば、もう一方は不要になる"
      - "守っている対象が異なるため、組み合わせて使うことで補い合う関係にある"
      - "S/MIMEは、STARTTLSの後継として開発された、上位互換の仕組みである"
      - "両者は競合する、互換性のない規格である"
    answerIndex: 1
    explanation: "2つは守っている対象(本文か、通信経路全体か)が異なるため、組み合わせて使うことで、それぞれが守れない範囲を補い合う関係にあります。"
