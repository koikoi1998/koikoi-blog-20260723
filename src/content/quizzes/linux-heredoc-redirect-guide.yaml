questions:
  - question: "`>`と`>>`の違いとして正しい説明はどれか。"
    choices:
      - "両者は完全に同じ意味で、書きやすい方を使えばよい"
      - "`>`は既存の内容を上書きし、`>>`は末尾に追記する"
      - "`>`は追記、`>>`は上書きする"
      - "`>>`はディレクトリの作成にのみ使用できる"
    answerIndex: 1
    explanation: "`>`は既存の内容を上書きし、`>>`は既存の内容を残したまま末尾に追記します。"

  - question: "`cat > file << 'EOF'`という構文について正しい説明はどれか。"
    choices:
      - "ファイルの中身を画面に表示するだけのコマンドである"
      - "ヒアドキュメントで渡された複数行のテキストを、リダイレクトによってファイルへ書き込む構文である"
      - "ファイルを削除するための構文である"
      - "常にエラーになる誤った構文である"
    answerIndex: 1
    explanation: "<<によるヒアドキュメントで複数行のテキストをcatへの入力として渡し、>によるリダイレクトでその出力をファイルへ書き込んでいます。"

  - question: "ヒアドキュメントの終端の目印について正しい説明はどれか。"
    choices:
      - "必ず`EOF`という文字列を使わなければならない"
      - "`EOF`は慣習にすぎず、本文中に登場しない任意の文字列を使える"
      - "終端の目印は省略できる"
      - "終端の目印は数字でなければならない"
    answerIndex: 1
    explanation: "EOFという文字列自体に特別な意味はなく、慣習的に使われているだけです。本文中に登場しない一意な文字列であれば、任意の文字列を使えます。"

  - question: "`<< 'EOF'`のようにシングルクォートで囲んだ場合の効果はどれか。"
    choices:
      - "変数展開が通常通り行われる"
      - "変数展開が一切行われず、`$name`のような記述がそのまま出力される"
      - "コマンドの実行速度が上がる"
      - "ファイルの権限が自動的に変更される"
    answerIndex: 1
    explanation: "終端の目印をシングルクォートで囲むと、ヒアドキュメント内の変数展開が無効化され、`$`を含む文字列をそのまま出力できます。"

  - question: "ハンズオン記事でnanoではなくヒアドキュメントが使われる理由として最も適切なのはどれか。"
    choices:
      - "ヒアドキュメントの方が見た目がシンプルだから"
      - "ファイルの内容がコマンド自体に埋め込まれているため、実行するだけで誰でも同じ内容を再現・自動化できるから"
      - "nanoはLinuxにインストールされていないことが多いから"
      - "ヒアドキュメントの方が高速に実行できるから"
    answerIndex: 1
    explanation: "ヒアドキュメントはファイルの内容がコマンドの中に文字列として埋め込まれているため、実行するだけで誰でも寸分違わず同じ内容を再現でき、自動化にも向いています。"
