questions:
  - question: "「電話回線」という言葉が持つ2つの意味について、記事の説明に最も合致するものはどれか。"
    choices:
      - "回線交換方式の音声網そのものと、加入者宅まで来ているメタル線という物理的な配線の2つを指す"
      - "ADSL回線と光回線という2つの新しい配線方式を指す"
      - "IPネットワークとイーサネットという2つの論理的な仕組みを指す"
      - "国内向けと国際向けという2つの交換機の種類を指す"
    answerIndex: 0
    explanation: "「電話回線」は、交換機がTDMで1対1の経路を組み立てる回線交換方式の音声網そのものと、加入者宅から最寄りの電話局まで実際に張られているメタル線という物理的な配線の、2つの異なる意味で使われます。"

  - question: "ADSLが既存の電話回線をどのように流用しているかについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "電話回線とは別に、新しいメタル線を敷設している"
      - "電話回線として既に敷設されているメタル線に対し、音声が使っていない高い周波数帯を使ってデータを重ねている"
      - "電話回線の交換機自体を改造してパケット交換に対応させている"
      - "電話回線の音声帯域をそのまま使い、時間帯によって音声とデータを切り替えている"
    answerIndex: 1
    explanation: "ADSLは新たな配線ではなく、既存の電話用メタル線の上で、音声が使っていない高い周波数帯にDMT変調でデータを重ねて伝送する技術です。スプリッタによって周波数で音声とデータをふるい分けます。"

  - question: "ADSLで、収容局（電話局）からの距離が伸びると速度が低下しやすい理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "距離が伸びるほど電話交換機の数が増えるから"
      - "周波数が高い信号ほどメタル線を伝わる間に急激に減衰し、距離が伸びるほど利用できる高い周波数帯(データ帯域)が狭まるから"
      - "距離が伸びるほどIPアドレスの割り当てに時間がかかるから"
      - "距離が伸びるほどスプリッタの数が自動的に増えるから"
    answerIndex: 1
    explanation: "周波数が高い信号ほどメタル線上で急激に減衰する性質があるため、収容局からの距離が伸びるほど利用できる高い周波数帯(データ帯域)が狭まり、結果として速度が低下します。"

  - question: "光回線(FTTH)で使われるPON方式の特徴として、記事の説明に最も合致するものはどれか。"
    choices:
      - "OLTから出た1本の光ファイバーを、電力を必要としない光スプリッタで分岐し、複数の加入者宅のONUで共有する"
      - "各加入者宅ごとに専用の交換機を設置し、電力で信号を増幅しながら中継する"
      - "音声帯域とデータ帯域を周波数分割することで、電話とネットを同時に利用可能にする"
      - "加入者ごとに異なる電話番号を割り当てることで回線を識別する"
    answerIndex: 0
    explanation: "PON(Passive Optical Network)は、OLTから出た1本の光ファイバーを、電力を必要としない受動部品である光スプリッタで分岐し、複数の加入者宅のONUへ届ける方式です。周波数分割による音声・データの共存はADSL特有の話です(選択肢3)。"

  - question: "PONの上り方向(各ONU→OLT)で、複数の家庭からの光信号の衝突を防ぐ仕組みとして、記事が説明しているものはどれか。"
    choices:
      - "OLTが各ONUに送信してよい時間帯を個別に割り当てるTDMAという仕組み"
      - "各ONUが自発的にランダムな時間を選んで送信し、衝突したら再送する仕組み"
      - "各ONUに固定のIPアドレスを割り当てることで衝突を回避する仕組み"
      - "光スプリッタが電力を使って信号を増幅し、衝突を吸収する仕組み"
    answerIndex: 0
    explanation: "PONの上り方向では、OLTが各ONUに対して「この時間帯に送信してよい」という送信タイミングを個別に割り当てるTDMA(Time Division Multiple Access)によって衝突を防いでいます。"

  - question: "「イーサネット」と「IPネットワーク」の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "イーサネットとIPネットワークはまったく同じものを指す別名である"
      - "イーサネットはデータリンク層(L2)の規格であり、IPネットワークはその上に乗るネットワーク層(L3)以上の論理的な仕組みで、IPパケットはイーサネットフレームの中に運ばれる"
      - "IPネットワークがデータリンク層であり、イーサネットはその上に乗るネットワーク層である"
      - "イーサネットはIPアドレスを使って通信するための規格である"
    answerIndex: 1
    explanation: "イーサネットはMACアドレスを使うデータリンク層(L2)の規格であり、IPネットワークはその上に乗るネットワーク層(L3)以上の論理的な仕組みです。IPパケットはイーサネットフレームのペイロードとして運ばれるという階層関係にあり、両者はイコールではありません。"

  - question: "光回線(FTTH)における電話サービス(いわゆる「ひかり電話」)について、記事の説明に最も合致するものはどれか。"
    choices:
      - "従来の電話回線と同じく、独立した音声帯域をアナログのまま重ねて伝送している"
      - "音声をデジタルパケット化し、イーサネット上をIPパケットとして流すVoIPという形で提供されている"
      - "光回線では電話サービス自体が提供されなくなった"
      - "電話サービスのためだけに別の専用光ファイバーが敷設されている"
    answerIndex: 1
    explanation: "光回線での電話サービスは、ADSLのような音声帯域の重畳ではなく、音声そのものをデジタルパケット化してイーサネット上をIPパケットとして流す、VoIP(Voice over IP)という形で提供されています。"

  - question: "「回線がADSLから光回線へ高速化されれば、契約者認証やIPアドレスの動的割り当ての仕組みは不要になる」という理解について、記事の説明に照らして最も適切な評価はどれか。"
    choices:
      - "正しい。回線が高速化すれば認証やIP割り当ての仕組みは自動的に不要になる"
      - "誤り。回線の伝送方式(L1/L2の高速化)と、その上でのユーザー認証・アドレス管理の仕組みはまったく別レイヤの話であり、電話回線・ダイヤルアップ時代からの商習慣はそのまま引き継がれている"
      - "正しい。光回線ではIPアドレスがすべて固定で払い出されるため動的割り当てが不要になる"
      - "誤り。むしろ回線が高速化するほど認証の頻度が増える"
    answerIndex: 1
    explanation: "アクセス回線の高速化はあくまでL1/L2の伝送方式の話であり、契約者ごとの認証・動的IPアドレス割り当てという電話回線・ダイヤルアップ時代からの商習慣はそのまま引き継がれています。そのためPPPoEなどPPPを流用した接続方式が使われ続けています。"

  - question: "近年の光回線でPPPoEからIPoE方式への移行が進んでいる背景として、記事が挙げているものはどれか。"
    choices:
      - "PPPoEでは収容局側の網終端装置が各利用者のPPPセッションを集約する必要があり、利用者数の増加に伴ってこの集約ポイントがボトルネックとなり、混雑時間帯に速度が低下しやすいから"
      - "PPPoEはセキュリティ上の脆弱性が発見され、使用が禁止されたから"
      - "IPoEの方がPPPoEより電気料金が安く済むから"
      - "PPPoEは光回線のONUと物理的に互換性がないから"
    answerIndex: 0
    explanation: "PPPoEは利用者ごとのPPPセッションを収容局側の網終端装置が集約して処理する必要があり、利用者数の増加に伴ってこの集約ポイントがボトルネックとなり、夜間などの混雑時間帯に速度が低下しやすいという構造的な限界があります。IPoEはこのボトルネックを回避する接続方式です。"

  - question: "PPPoEにおいて、契約者の家庭用ルーターに払い出されるIPアドレスについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "収容局側の集約拠点で複数契約者のトラフィックをまとめてNAT変換した後のIPであり、ルーター自体はグローバルIPを持たない"
      - "IPCPによって家庭用ルーターそのものに直接割り当てられるグローバルIPアドレスであり、1契約=1グローバルIPが届く"
      - "常にIPv6アドレスのみが払い出され、IPv4は使われない"
      - "BASが毎回ランダムに選んだプライベートIPアドレスが払い出される"
    answerIndex: 1
    explanation: "PPPoEでは契約者側の機器が直接PPPoEクライアントとなり、IPCPで払い出されるIPアドレスは家庭用ルーターそのものに割り当てられるグローバルIPアドレスです。集約拠点でのNAT変換は行われません。"

  - question: "DS-Lite・MAP-EなどCGNATを伴うIPoE構成について、記事の説明に最も合致するものはどれか。"
    choices:
      - "家庭用ルーターに払い出されるIPv4アドレスは多数の契約者で共有されるプライベートIPであり、キャリア側のAFTR等で実際のグローバルIPへの変換が行われる"
      - "家庭用ルーターに払い出されるIPv4アドレスは常にグローバルIPであり、PPPoEと完全に同じ扱いになる"
      - "CGNATはIPv6アドレスの枯渇を解決するためだけに使われる技術である"
      - "CGNATを使うとルーターのNAPT機能が不要になる"
    answerIndex: 0
    explanation: "IPv4アドレス枯渇に伴い、DS-Lite等のIPoE構成の多くでは、利用者に払い出されるIPv4アドレスは多数の契約者で共有されるプライベートIPであり、実際のグローバルIPへの変換はキャリア側のAFTRという集約拠点で行われます(CGNAT)。"

  - question: "契約者に払い出されたグローバルIPに、インターネット上のどこからでもパケットを送って届く仕組みとして、記事が説明しているものはどれか。"
    choices:
      - "各ISPがBGP(Border Gateway Protocol)で自身の管理するIPアドレス範囲を隣接ASへ広告し、それが伝播することで経路情報がインターネット全体に行き渡るから"
      - "すべてのグローバルIPアドレスが1つの中央データベースにキャッシュされているから"
      - "ONUが自動的に世界中のルーターへ経路をブロードキャストしているから"
      - "PPPoEのセッションが確立している間だけ、一時的に世界中からアクセス可能になるから"
    answerIndex: 0
    explanation: "インターネットは多数のAS(自律システム)の集合体であり、各ISPが管理するIPアドレス範囲をBGPで隣接ASへ広告し、それが伝播していくことで「このIPアドレス範囲へはこのASを経由すれば届く」という経路情報がインターネット全体に行き渡ります。"

  - question: "ADSLの速度・安定性に関するトラブルシューティングとして、記事が挙げている確認項目はどれか。"
    choices:
      - "モデムの管理画面でシンクロ率(同期速度)とノイズマージンを確認する"
      - "ONUの光受信レベル(dBm)を確認する"
      - "光ファイバーケーブルの許容曲げ半径を確認する"
      - "OLTの設置場所を確認する"
    answerIndex: 0
    explanation: "ADSLの速度が出ない・不安定な場合は、モデムの管理画面からシンクロ率(同期速度)とノイズマージンを確認します。光受信レベルや曲げ半径の確認は光回線(ONU)側のトラブルシューティングです。"
