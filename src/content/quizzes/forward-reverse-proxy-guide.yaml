questions:
  - question: "このシリーズでこれまで構築してきたプロキシが、すべて属していた種類として正しいのはどれか。"
    choices:
      - "リバースプロキシ"
      - "フォワードプロキシ"
      - "DNSプロキシ"
      - "メールプロキシ"
    answerIndex: 1
    explanation: "Squidによる明示的プロキシも透過型プロキシも、クライアント側に立ち、クライアントの代理として振る舞う、フォワードプロキシでした。"

  - question: "フォワードプロキシとリバースプロキシを分けている、根本的な軸として正しいのはどれか。"
    choices:
      - "暗号化に対応しているかどうか"
      - "プロキシが、どちら側の正体を、もう一方から隠しているのかという、代理の方向"
      - "キャッシュ機能を持っているかどうか"
      - "オープンソースか商用製品かという違い"
    answerIndex: 1
    explanation: "2つを分けている軸は、プロキシがどちら側(クライアント側かサーバー側か)の正体を隠しているのかという、代理の方向そのものです。"

  - question: "リバースプロキシの役割として正しいのはどれか。"
    choices:
      - "クライアントの近くに配置され、クライアントの代理として振る舞う"
      - "サーバーの近くに配置され、不特定多数のクライアントからのアクセスを、サーバーの代理として受け止める"
      - "DNSの名前解決だけを代理する"
      - "メールの送受信だけを代理する"
    answerIndex: 1
    explanation: "リバースプロキシは、サーバーの近くに配置され、そのサーバーへアクセスしようとする不特定多数のクライアントを、サーバーの代理人として受け止めます。"

  - question: "ロードバランシング基礎シリーズで扱ったHAProxyやnginxの正体として正しいのはどれか。"
    choices:
      - "フォワードプロキシの一種である"
      - "リバースプロキシの代表例であり、複数のバックエンドサーバーへの振り分けは、その応用的な使い方である"
      - "DNSサーバーの一種である"
      - "ファイアウォールの一種である"
    answerIndex: 1
    explanation: "HAProxyやnginxは、リバースプロキシの代表例であり、複数台の背後のサーバーへトラフィックを振り分ける機能は、リバースプロキシという役割の応用的な使い方の1つです。"

  - question: "CDN(Content Delivery Network)の、構造的な正体として正しいのはどれか。"
    choices:
      - "フォワードプロキシを、大規模に分散配置したネットワーク"
      - "リバースプロキシを、大規模に分散配置したネットワーク"
      - "プロキシとはまったく無関係の、独立した技術"
      - "DNSサーバーの一種に過ぎない"
    answerIndex: 1
    explanation: "CDNは、構造的にはリバースプロキシを、世界中の多数の拠点へ分散配置した、拡張版として理解できます。"
