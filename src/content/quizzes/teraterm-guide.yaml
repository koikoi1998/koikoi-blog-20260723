questions:
  - question: "Teratermで新規SSH接続を作成する際、SSH versionとしてSSH2を選ぶべき理由として記事内で説明されているものはどれか。"
    choices:
      - "SSH2の方が単純に通信速度が速いから"
      - "SSH1は古く脆弱性があるため使わないほうがよいから"
      - "SSH1はWindowsでは技術的に使用できないから"
      - "SSH2を選ばないとTCPポート番号を指定できないから"
    answerIndex: 1
    explanation: "SSH1は古いプロトコルで既知の脆弱性があるため使用せず、SSH2を選ぶのが基本です。"

  - question: "初回接続時に表示される「SECURITY WARNING」ダイアログが意味する内容として、記事内で説明されているものはどれか。"
    choices:
      - "パスワードが間違っている警告である"
      - "接続先サーバーのホスト鍵(公開鍵)をまだ信頼済みとして記録していないため表示される確認である"
      - "ネットワーク回線が不安定であることを示す警告である"
      - "TeratermのライセンスがWindowsで無効になっていることを示す警告である"
    answerIndex: 1
    explanation: "SECURITY WARNINGは、接続先サーバーのホスト鍵をまだ信頼済みとして記録していないために表示される確認ダイアログです。指紋(フィンガープリント)が正しいことを確認してから信頼します。"

  - question: "Linuxサーバーの出力で日本語が文字化けする場合、記事内で案内されている対処法はどれか。"
    choices:
      - "Teratermを再インストールする"
      - "「Setup」→「Terminal...」でReceive/Transmitの文字コードをUTF-8に揃える"
      - "サーバー側のOSを日本語版に入れ替える"
      - "文字化けは対処不可能な既知のバグである"
    answerIndex: 1
    explanation: "多くのLinuxディストリビューションはデフォルトでUTF-8を使っているため、Teraterm側のReceive/Transmitの文字コードもUTF-8に合わせることで文字化けが解消します。"

  - question: "「Setup」→「Save setup...」で行える操作として、記事内で説明されているものはどれか。"
    choices:
      - "接続先サーバーのパスワードを強制的にリセットする"
      - "現在の接続・文字コード・フォントなどの設定を.iniファイルとして保存し、次回以降の接続をスムーズにする"
      - "サーバー側のSSHサーバーを再起動する"
      - "接続ログを自動的にメールで送信する"
    answerIndex: 1
    explanation: "Save setupは現在の設定を.iniファイルとして保存する機能で、ショートカットの引数に指定しておけば、次回以降その設定のまま起動できます。"
