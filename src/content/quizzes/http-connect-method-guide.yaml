questions:
  - question: "CONNECTメソッドが、プロキシに対して依頼していることとして正しいのはどれか。"
    choices:
      - "指定したURLのコンテンツを取得してくること"
      - "指定したホスト名とポートへ、TCP接続を中継すること"
      - "通信内容を復号して検査すること"
      - "DNSによる名前解決を代わりに行うこと"
    answerIndex: 1
    explanation: "CONNECTメソッドは、「このホスト名とポートへ、TCP接続を中継してほしい」という依頼であり、HTTPリクエストの転送を依頼するものではありません。"

  - question: "CONNECTトンネルが確立した後、プロキシが知ることができる情報として正しいのはどれか。"
    choices:
      - "クライアントが送信する、すべてのHTTPリクエストのURLパス"
      - "CONNECTリクエストの時点で渡された、宛先のホスト名とポート番号だけ"
      - "サーバーから返されるレスポンスの本文すべて"
      - "暗号化通信に使われている秘密鍵"
    answerIndex: 1
    explanation: "CONNECTトンネルが確立した後、プロキシは暗号化された通信の中身を一切見ることができず、CONNECTリクエストの時点で渡された宛先のホスト名とポート番号しか知りません。"

  - question: "HTTPSサイトに対して、既定では「ホスト名単位」までしかアクセス制御ができない理由として正しいのはどれか。"
    choices:
      - "HTTPSはそもそもアクセス制御に対応していないため"
      - "CONNECTトンネル確立後、プロキシは実際のHTTPリクエスト(URLパス)を知る手段がないため"
      - "ホスト名単位の制御の方が、パス単位の制御より高性能だから"
      - "SSLインスペクションが常に自動的に有効化されているため"
    answerIndex: 1
    explanation: "CONNECTトンネルが確立すると、プロキシは暗号化された通信の中身を見ることができず、クライアントが送る実際のHTTPリクエスト(パスを含むURL)を知る手段がありません。"

  - question: "CONNECTリクエストに対するプロキシ認証の挙動として正しいのはどれか。"
    choices:
      - "CONNECTリクエストには、プロキシ認証は一切適用されない"
      - "通常のHTTPリクエストと同様に、407ステータスコードが返され、認証の対象になる"
      - "CONNECTリクエストは常に無条件で許可される"
      - "CONNECTリクエストには、401ステータスコードが使われる"
    answerIndex: 1
    explanation: "CONNECTリクエストに対しても、通常のHTTPリクエストと同様に407ステータスコードが返され、プロキシ認証の対象になります。"

  - question: "CONNECTトンネルとSSLインスペクションの関係として正しいのはどれか。"
    choices:
      - "両者はまったく同じ動作モードであり、常に同時に発生する"
      - "CONNECTトンネルがプロキシの既定の動作であり、SSLインスペクションは別途有効化が必要な、まったく別の動作モードである"
      - "SSLインスペクションを使わなければ、プロキシは何も中継できない"
      - "CONNECTトンネルは、SSLインスペクションが有効な場合にのみ発生する"
    answerIndex: 1
    explanation: "CONNECTメソッドによる素通しのトンネルがプロキシの既定の動作であり、SSLインスペクションは、クライアント側での証明書信頼設定を前提とした、別途有効化が必要なまったく別の動作モードです。"
