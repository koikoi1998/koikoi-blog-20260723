questions:
  - question: "TLSの通信において、公開鍵暗号の「暗号化(秘匿)」と「デジタル署名」の使い分けに関する記述のうち、最も正確なものはどれか。"
    choices:
      - "通信相手の秘密鍵を使って自分が送るデータを暗号化することで、盗聴を防ぐ"
      - "送信者は自分の秘密鍵でメッセージそのものを暗号化し、受信者はその送信者の公開鍵で復号することで、通信内容の秘匿を実現する"
      - "秘匿を目的とする場合は受信者の公開鍵で暗号化し受信者本人の秘密鍵で復号するが、署名を目的とする場合は送信者が自分の秘密鍵で署名し誰でも送信者の公開鍵で検証する、というように鍵が使われる向きは目的によって逆になる"
      - "公開鍵暗号は秘匿・署名のどちらの用途でも「公開鍵で作成し秘密鍵で検証する」という共通の向きで動作する"
    answerIndex: 2
    explanation: "記事の表の通り、秘匿目的では「受信者の公開鍵で暗号化→受信者本人の秘密鍵で復号」、署名目的では「送信者が秘密鍵で署名→誰でも送信者の公開鍵で検証」と、鍵の使われる向きが用途によって逆になります。「秘密鍵で暗号化して公開鍵で復号する」という理解は記事内で明確に誤りとされています。"

  - question: "デジタル署名において、メッセージ全体ではなくメッセージのハッシュ値に対して署名処理(秘密鍵による暗号化)を行う理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "ハッシュ値にすることで、元のメッセージ自体を第三者から秘匿できるようになるため"
      - "公開鍵暗号は計算コストが高く、データ全体を暗号化するのは非効率なため、固定長のハッシュ値だけに署名することで元データのサイズによらず署名処理自体は一定のコストで済ませられるから"
      - "ハッシュ関数を経由しない限り、秘密鍵と公開鍵の数学的な対応関係(鍵ペア)がそもそも成立しないため"
      - "ハッシュ値に署名することで、受信者側でのメッセージの改ざん自体を物理的に防止できるため"
    answerIndex: 1
    explanation: "記事は「公開鍵暗号の計算コストが高く、データ全体を暗号化するのは非効率なため」と明記しており、固定長のハッシュ値にのみ署名することで元データの大きさによらず署名処理のコストを一定に抑えられる点が理由です。ハッシュ署名は改ざんを事後的に「検知」できるだけで、改ざん自体を防止するわけではありません。"

  - question: "Diffie-Hellman(DH)鍵交換について、経路上の通信をすべて観測できる盗聴者の視点から見た記述として最も適切なものはどれか。"
    choices:
      - "盗聴者はp、g、A、Bのすべてを観測できるが、そこから共有秘密値を求めるにはAからaを逆算する(離散対数問題を解く)必要があり、pとgが十分大きければ現実的な時間では解けない"
      - "盗聴者はAとBさえ観測できれば、掛け算のみで共有秘密値g^(ab) mod pを直接計算できてしまう"
      - "DH鍵交換ではp、gそのものも秘密として扱われるため、盗聴者はAやBを計算する材料自体を得られない"
      - "盗聴者はaとbの値を知らなくても、ハッシュ関数の一方向性を利用して共有秘密値を逆算できる"
    answerIndex: 0
    explanation: "記事では「盗聴者はp、g、A、Bのすべてを見ることができる」が「そこから共有秘密値を計算するにはAからaを逆算する必要があり、これは離散対数問題と呼ばれ、pとgが十分大きければ現実的な時間では解けない」と説明されています。p、gは盗聴されても問題ない公開情報であり、秘密ではありません。またDHは掛け算・べき乗の方向は簡単でも指数を逆算する方向は非常に重いという非対称性が安全性の根拠であり、ハッシュ関数の一方向性とは無関係です。"

  - question: "あるVPN製品でIKEフェーズ2のPFS(Perfect Forward Secrecy)を有効化し、ECDHEによる鍵交換を行っている構成に関する記述のうち、最も適切なものはどれか。"
    choices:
      - "ECDHEによる鍵交換だけで通信相手の身元確認まで完了するため、別途デジタル署名や事前共有鍵による認証は不要になる"
      - "長期間使う署名用の秘密鍵とは別に、その場限りの秘密の数を使ってDH鍵交換を行うため、将来その長期鍵が漏洩しても過去に記録・盗聴された通信をあとから復号することはできない"
      - "PFSを有効化すると、DH鍵交換で使うpとgの値そのものが毎回変更されるため、離散対数問題がより困難になる"
      - "ECDHEは楕円曲線暗号を使うため、通常のDHEよりも鍵交換のたびに通信相手の身元認証の強度が向上する"
    answerIndex: 1
    explanation: "記事は、DH(ECDHE含む)の秘密の数を毎回使い捨てにする運用(Ephemeral DH)により、長期の署名用秘密鍵が将来漏洩しても過去の通信を復号できなくなる性質をPFSと呼ぶと説明しています。一方で「DHには暗号化する・署名するという概念自体が存在せず、相手が本当に名乗っている本人かは一切保証しない」とも明記されており、実際のプロトコルではDHによる鍵交換とデジタル署名(または事前共有鍵)による身元確認を組み合わせて初めて安全な通信が成立します。ECDHEを使っても身元確認の仕組みが不要になるわけではありません。"

  - question: "CAが受け取ったCSRの署名を、CSRに含まれる公開鍵で検証する目的として、最も適切なものはどれか。"
    choices:
      - "CSRの内容が通信経路上で改ざんされていないことのみを確認するためであり、公開鍵の所持証明とは無関係である"
      - "申請者が本当にその公開鍵に対応する秘密鍵を保有していることを確認する(Proof of Possession)ためであり、この検証がなければ他人の公開鍵を勝手に使ったCSRが提出できてしまう"
      - "CAが発行する証明書の鍵長を、CSRに記載された鍵長に合わせて自動調整するための処理である"
      - "この署名検証によって申請者の身元確認(ドメイン所有権の確認など)が完了するため、CAは追加の身元確認を行う必要がなくなる"
    answerIndex: 1
    explanation: "記事は「CAは受け取ったCSRの署名を、CSRに含まれる公開鍵で検証することで、申請者が確かにこの公開鍵に対応する秘密鍵を保有していることを確認できる(Proof of Possession)」とし、この検証がなければ他人の公開鍵を勝手に使ったCSRが提出できてしまうと説明しています。CAはこの署名検証に加えて、別途、申請者の身元確認(ドメインの所有権確認など)も行うと明記されており、署名検証だけで身元確認が完了するわけではありません。"

  - question: "ルートCAの秘密鍵を通常オフラインで厳重に保管し、日常の証明書発行業務を中間CAに任せる理由として、最も適切なものはどれか。"
    choices:
      - "ルートCAの秘密鍵は中間CAの秘密鍵より鍵長が短く、オンラインに置くと総当たり攻撃で解読されやすいため"
      - "ルートCAの秘密鍵が漏洩すると、そのルートを信頼するすべての証明書の信頼性が崩壊してしまう一方、中間CAの鍵が漏洩した場合はその中間CAだけを失効させればルートCA自体への被害を避けられるため"
      - "ルートCAはCSRの署名検証(Proof of Possession)を行う権限を持たず、中間CAのみがこの検証を実施できる仕組みになっているため"
      - "オフライン運用にすることで、ルートCA証明書の有効期限が自動的に延長される仕組みになっているため"
    answerIndex: 1
    explanation: "記事は「ルートCAの秘密鍵は、漏洩すればそのルートを信頼するすべての証明書の信頼性が崩壊する、極めて重要な鍵」であるためオフラインで厳重保管し、「万が一中間CAの鍵が漏洩しても、その中間CAだけを失効させればよく、ルートCA自体への被害を避けられる」と説明しています。鍵長やCSR署名検証権限の話ではありません。"

  - question: "あるクライアントが受け取った証明書について、署名チェーンの検証・有効期限の確認・ホスト名(CN/SAN)の一致確認のすべてに成功したにもかかわらず、証明書エラーで通信が確立できなかった。記事の検証手順に照らして、原因として最も可能性が高いものはどれか。"
    choices:
      - "署名チェーンの検証と有効期限・ホスト名の確認がすべて成功していれば、記事が挙げる検証項目はすべて満たされているはずであり、この状況は起こり得ない"
      - "たどり着いたルートCA証明書が、そのクライアントの信頼ストア(OSやブラウザに組み込まれた信頼するルートCA証明書の集合)に含まれていなかった"
      - "デジタル署名は本人性のみを証明し完全性は証明しないため、改ざん検知に失敗した可能性が高い"
      - "証明書に記載された識別情報が、CSR提出時に申請者が指定した識別情報と異なっていた"
    answerIndex: 1
    explanation: "記事の検証手順は、署名チェーンの検証・有効期限・失効確認・ホスト名一致に加えて、「最終的にたどり着いたルートCA証明書が、検証者自身の信頼ストアに含まれているか」という独立したステップを含み、「このどれか1つでも失敗すると検証はエラーになる」としています。署名チェーンが正しくたどれることと、そのルートが信頼ストアに登録されていることは別の確認事項であるため、他の項目が成功していても信頼ストア未登録だけでエラーになり得ます。"

  - question: "TLSが「通信の最初は公開鍵暗号、以降の実データのやり取りは共通鍵暗号」というハイブリッド方式を採用している理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "共通鍵暗号は鍵配送そのものに安全上の問題があるため、本来は通信全体を公開鍵暗号だけで暗号化すべきだが、実装上の都合でやむを得ずハイブリッドにしている"
      - "公開鍵暗号は共通鍵暗号よりも計算コストがかなり高いため、安全な共通鍵の合意にのみ公開鍵暗号を使い、以降の大量データのやり取りは計算コストの低い共通鍵暗号に切り替えることで、安全性と速度の両方の利点を活かしている"
      - "公開鍵暗号だけでは本人性を証明できないため、共通鍵暗号による署名処理を追加で行う必要があるから"
      - "TLSでは共通鍵暗号は鍵交換にのみ使われ、実データの暗号化は必ず公開鍵暗号(RSAなど)によって行われる"
    answerIndex: 1
    explanation: "記事は「公開鍵暗号は計算コストが共通鍵暗号よりかなり高いため実際の大量データの暗号化には向かない」とし、最初の鍵合意にのみ公開鍵暗号を使い、以降は共通鍵暗号(AESなど)に切り替える設計を「公開鍵暗号の安全性と共通鍵暗号の速度、両方の利点を活かすための定石」と説明しています。本人性の証明はデジタル署名(公開鍵暗号)の役割であり、共通鍵暗号による署名という仕組みは記事に登場しません。"

  - question: "「自己署名証明書は暗号強度が低い」という主張に対する記事の立場として、最も適切なものはどれか。"
    choices:
      - "正しい。自己署名証明書はCAの署名を受けていない分、鍵長を短くせざるを得ないため暗号強度が下がる"
      - "誤り。暗号アルゴリズム自体の強度(鍵長や暗号方式)はCAの署名の有無とは無関係であり、自己署名証明書の本質的な問題は第三者が身元を保証していないという信頼の観点の話である"
      - "正しい。自己署名証明書はRSAしか選択できず、ECDSAのようなより強い方式を使えないため暗号強度が下がる"
      - "誤り。自己署名証明書は発行時に自動的に信頼ストアへ登録されるため、そもそも信頼性の問題自体が発生しない"
    answerIndex: 1
    explanation: "記事は誤解2として、「暗号アルゴリズム自体の強度は、CAの署名の有無とは無関係」であり、「自己署名証明書の本質的な問題は、第三者が身元を保証していない証明書であるという信頼の観点の話であり、暗号強度の問題ではない」と明記しています。また社内CAの証明書も、クライアント側の信頼ストアに追加していなければ信頼されない証明書として扱われるとも述べており、自動的に信頼されるわけではありません。"

  - question: "あるモバイルアプリからAPIサーバーにHTTPS接続すると証明書チェーンのエラーになるが、同じサーバーに同僚がPCのブラウザでアクセスすると問題なく接続できた。記事のトラブルシューティングの視点に照らして、最も可能性が高い原因はどれか。"
    choices:
      - "サーバー側が中間証明書を提示し忘れており、ブラウザはOS側にキャッシュされた中間証明書で補完できた一方、多くのモバイルアプリ・APIクライアントは補完せずエラーになったため"
      - "モバイル端末とPCとで信頼ストアに登録されているルートCA証明書の集合が根本的に異なる仕様になっているため"
      - "モバイルアプリはCRL/OCSPによる失効確認を必ず行うのに対し、ブラウザは失効確認を一切行わない仕様になっているため"
      - "モバイル端末の時刻がNTPで同期されておらず、証明書の有効期限より未来の時刻になっているため、有効な証明書が期限切れと誤判定された"
    answerIndex: 0
    explanation: "記事はトラブルシューティングの項で、「サーバー側が中間証明書を提示し忘れている場合、ブラウザなど一部のクライアントはOS側にキャッシュされた中間証明書で補完できることがあるが、多くのクライアント(特にAPIクライアントやモバイルアプリ)は補完せずエラーになる」と明記しており、同一サーバーへの接続結果がクライアント種別によって異なる典型例として説明されています。時刻ズレ(選択肢4)も記事に登場する原因の一つですが、その場合は通常「ブラウザだけ成功しモバイルアプリだけ失敗する」という差は生まれず、端末側の時計がずれていること自体が問題であって設問の状況とは合致しません。"
