questions:
  - question: "VPCピアリングが「推移的ではない」とは、どういうことか。"
    choices:
      - "ピアリング接続自体が、技術的に存在しないという意味"
      - "VPC AとピアリングしたVPC Bが、さらにVPC Cとピアリングしていても、AからCへはBを経由して到達できないという意味"
      - "ピアリング接続が、常に無料で利用できるという意味"
      - "ピアリング接続は、同じリージョン内でしか使えないという意味"
    answerIndex: 1
    explanation: "VPCピアリングは、VPC AとピアリングしたVPC Bが、さらにVPC Cとピアリングしていても、AからCへは、Bを経由して到達することができない、という「推移的ではない」制約を持っています。"

  - question: "N個のVPCをフルメッシュで接続するために必要なピアリング接続数として正しいのはどれか。"
    choices:
      - "常に1個だけで済む"
      - "N×(N-1)/2個"
      - "N個の2倍"
      - "VPCの数とは無関係に、常に10個"
    answerIndex: 1
    explanation: "N個のVPCを、すべて互いに直接通信できるようにする(フルメッシュ)には、N×(N-1)/2個のピアリング接続が必要になり、VPCの数が増えるほど急激に増加します。"

  - question: "Transit Gatewayが、VPCピアリングの制約をどのように解決しているか、正しいのはどれか。"
    choices:
      - "すべてのVPCを、1つの巨大なVPCへ統合することで解決している"
      - "中央のハブとなるゲートウェイに各VPCが1回だけアタッチメントを作成し、ハブ自身のルートテーブルで通信を制御する、ハブ&スポーク型の構成で解決している"
      - "ピアリング接続の数を、さらに増やすことで解決している"
      - "VPCという概念自体を廃止することで解決している"
    answerIndex: 1
    explanation: "Transit Gatewayは、中央のハブとなるゲートウェイに、各VPCが1回だけアタッチメントを作成し、Transit Gateway自身のルートテーブルが通信を制御する、ハブ&スポーク型の構成により、推移的な接続を実現しています。"

  - question: "VPCピアリングで、セキュリティアプライアンスを通信経路に挟めない理由として正しいのはどれか。"
    choices:
      - "セキュリティアプライアンスという製品自体が、存在しないから"
      - "通信がピア同士で直接流れるため、アプライアンスを挟む場所がそもそも存在しないから"
      - "AWSが、セキュリティアプライアンスの使用を禁止しているから"
      - "ピアリング接続は、常に暗号化されているため、検査が不要だから"
    answerIndex: 1
    explanation: "VPCピアリングでは、通信がピア同士で直接流れるため、ファイアウォールのようなセキュリティアプライアンスを、通信経路の途中に挟む場所がそもそも存在しません。"

  - question: "VPCピアリングとTransit Gatewayの使い分けの判断基準として正しいのはどれか。"
    choices:
      - "常にTransit Gatewayを使うべきであり、VPCピアリングは一切使うべきではない"
      - "将来的にVPCの数が増える可能性や、推移的な接続・一箇所での検査が必要かを踏まえて判断する"
      - "VPCピアリングの方が、常にすべての面で優れている"
      - "この2つの選択は、技術的に完全に同一であり、違いはない"
    answerIndex: 1
    explanation: "複数のVPCを接続する際は、将来的にVPCの数が増える可能性、推移的な接続が必要かどうか、一箇所での検査・制御が必要かどうかを踏まえて、ピアリングとTransit Gatewayのどちらが適切かを検討する必要があります。"
