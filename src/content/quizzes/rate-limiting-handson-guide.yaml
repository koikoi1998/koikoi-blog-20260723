questions:
  - question: "固定ウィンドウ方式が抱える「境界バースト」という欠陥の説明として正しいのはどれか。"
    choices:
      - "ウィンドウが切り替わるタイミングで、リクエストが一切処理されなくなる"
      - "ウィンドウの終わり際と、切り替わった直後にリクエストを送ると、実質的な制限値の約2倍のリクエストが通ってしまう"
      - "ウィンドウの長さが、常に固定されず変動してしまう"
      - "リクエストのカウンターが、二重に増加してしまう"
    answerIndex: 1
    explanation: "ウィンドウの終わり際と切り替わった直後にリクエストを集中させると、カウンターのリセットを悪用して、約2倍のリクエストが通ってしまいます。"

  - question: "トークンバケット方式において、`elapsed * REFILL_RATE`という計算が担っている役割として正しいのはどれか。"
    choices:
      - "リクエストの送信元IPアドレスを計算する"
      - "前回のリクエストからの経過時間に応じて、連続的にトークンを補充する量を計算する"
      - "HTTPステータスコードを決定する"
      - "ウィンドウの長さを動的に変更する"
    answerIndex: 1
    explanation: "トークンバケット方式は、固定の間隔でリセットするのではなく、経過時間に応じて連続的にトークンを補充します。"

  - question: "このハンズオンで、固定ウィンドウ方式とトークンバケット方式を同じ条件でテストした結果として正しいのはどれか。"
    choices:
      - "両方とも、すべてのリクエストが拒否された"
      - "固定ウィンドウ方式では20リクエストすべてが通ったが、トークンバケット方式では一部が429エラーで拒否された"
      - "両方とも、すべてのリクエストが正常に通った"
      - "トークンバケット方式の方が、より多くのリクエストを通した"
    answerIndex: 1
    explanation: "固定ウィンドウ方式は境界バーストにより20リクエストすべてを通しましたが、トークンバケット方式は補充された分のトークンしか消費できず、一部が拒否されました。"

  - question: "固定ウィンドウ方式が「常に劣っている」とは言えない理由として正しいのはどれか。"
    choices:
      - "固定ウィンドウ方式の方が、常に処理速度が速いため"
      - "実装の単純さそのものに価値がある場面(大まかな制限で十分な用途など)では、固定ウィンドウ方式でも十分な場合があるため"
      - "固定ウィンドウ方式は、境界バーストが発生しないよう改良されているため"
      - "固定ウィンドウ方式は、トークンバケット方式より新しい技術であるため"
    answerIndex: 1
    explanation: "実装の単純さが重要な場面では、境界バーストのリスクを受け入れてでも、固定ウィンドウ方式を選ぶ合理性があります。"

  - question: "複数のサーバーでレートリミットを分散処理する際に注意すべき点として正しいのはどれか。"
    choices:
      - "各サーバーが個別にカウンターを管理すれば、最も安全である"
      - "各サーバーが個別にカウンターやトークン数を管理すると、サーバーの台数倍まで制限が緩んでしまうため、共有ストアで一元管理する必要がある"
      - "分散処理する場合、レートリミット自体を無効化すべきである"
      - "分散処理では、固定ウィンドウ方式を使う必要がある"
    answerIndex: 1
    explanation: "各サーバーが個別に管理すると、実質的な制限がサーバー台数倍まで緩んでしまうため、Redisなどの共有ストアで一元管理する必要があります。"
