questions:
  - question: "DMARCのアライメントが確認している内容として正しいのはどれか。"
    choices:
      - "メールの本文が、スパムかどうかを判定する"
      - "SPF・DKIMが認証したドメインと、表示用Fromヘッダーのドメインが一致しているかを確認する"
      - "送信元サーバーのIPアドレスの地理的な位置を確認する"
      - "メールの文字エンコーディングが正しいかを確認する"
    answerIndex: 1
    explanation: "DMARCのアライメントとは、SPF・DKIMが認証したドメインと、受信者が実際に目にする、表示用Fromヘッダーのドメインが一致しているかどうかを確認する仕組みです。"

  - question: "DMARCの合否判定の条件として正しいのはどれか。"
    choices:
      - "SPFとDKIMの両方がアライメントされている必要がある(AND条件)"
      - "SPFとDKIMのどちらか一方でもアライメントされていれば合格する(OR条件)"
      - "SPFだけがアライメントされていれば、DKIMの結果は一切無視される"
      - "DKIMだけがアライメントされていれば、SPFの結果は一切無視される"
    answerIndex: 1
    explanation: "DMARCは、SPFとDKIMのどちらか一方でもアライメントされていれば合格とする、OR条件で判定されます。"

  - question: "リラックスモードとストリクトモードの違いとして正しいのはどれか。"
    choices:
      - "両者に実質的な違いは一切ない"
      - "リラックスモードは組織ドメインの一致で合格し、ストリクトモードは完全一致を要求する"
      - "リラックスモードは暗号化を行わず、ストリクトモードは暗号化を行う"
      - "リラックスモードはSPFのみ、ストリクトモードはDKIMのみに適用される"
    answerIndex: 1
    explanation: "リラックスモード(既定値)は組織ドメインが一致していれば合格と判定されますが、ストリクトモードは完全一致を要求するため、サブドメイン経由の送信で結果が変わります。"

  - question: "SPFが「合格」と表示されても、DMARCが失敗する場合として正しいのはどれか。"
    choices:
      - "このような状況は、技術的に発生し得ない"
      - "SPFが認証したエンベロープFromのドメインが、Fromヘッダーのドメインとアライメントの基準で一致していない場合"
      - "DKIMの署名が、常に自動的にSPFの結果を上書きするため"
      - "メールサーバーが、古いバージョンのSMTPを使用しているため"
    answerIndex: 1
    explanation: "SPFが認証したエンベロープFromのドメインが、画面に表示されるFromヘッダーのドメインとアライメントの基準で一致していなければ、SPF単体の合格は、DMARCの合格としてカウントされません。"

  - question: "メール転送が、DMARCのアライメントを崩しやすい理由として正しいのはどれか。"
    choices:
      - "転送は、常にメールを完全に削除してしまうから"
      - "転送によって送信元IPアドレスが変わりSPFが失敗し、本文・ヘッダーの変更でDKIM署名も無効化され得るから"
      - "転送は、DMARCの検証対象から常に除外されるから"
      - "転送は、アライメントの判定基準に、技術的に一切影響を与えないから"
    answerIndex: 1
    explanation: "メールが第三者によって転送される際、送信元IPアドレスが変わることでSPFがほぼ必ず失敗し、本文やヘッダーが変更されるとDKIMの署名自体も無効になり得るため、転送されたメールはDMARCとして不合格になりやすい構造的な弱点を抱えています。"
