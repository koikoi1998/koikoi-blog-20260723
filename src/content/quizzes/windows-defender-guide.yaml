questions:
  - question: "Microsoft Defenderの全体構成について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Defenderはクイックスキャンとフルスキャンという2つの機能のみで構成されている"
      - "リアルタイム保護・オンデマンドスキャン・クラウド保護・振る舞い監視という複数の防御層が組み合わさった仕組みであり、クイックスキャン/フルスキャンはそのうちオンデマンドスキャンという1つの構成要素に過ぎない"
      - "Defenderは、有料版を購入しない限り一切の防御機能を持たない"
      - "Defenderはクラウド上でのみ動作し、ローカルPC上では一切動作しない"
    answerIndex: 1
    explanation: "Microsoft Defenderは、リアルタイム保護・オンデマンドスキャン・クラウド保護・振る舞い監視という複数の防御層が組み合わさった仕組みです。クイックスキャン・フルスキャンは、そのうちオンデマンドスキャンという1つの構成要素に過ぎず、日常的な保護の主力はリアルタイム保護です。"

  - question: "クイックスキャンの対象範囲が限定されている理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "クイックスキャンは、ランダムに選んだファイルだけを検査する仕様になっているため"
      - "マルウェアの大半が、OS起動時に自動実行される設定や現在動作中のプロセスのメモリ上に痕跡を残すため、そうした既知の場所に絞ることで高速な検査を実現している"
      - "クイックスキャンは、ユーザーが指定した1つのフォルダーだけを検査する機能である"
      - "クイックスキャンは、インターネットに接続されていないファイルだけを検査する"
    answerIndex: 1
    explanation: "マルウェアの大半は、OS起動時に自動実行される設定(スタートアップ項目、レジストリの自動実行キーなど)や、現在動作中のプロセスのメモリ上に何らかの形で痕跡を残します。クイックスキャンはこうした既知の場所に絞ることで、高速な検査を実現しています。"

  - question: "本番環境接続前のフルスキャン合格が保証していることについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "そのPCが将来にわたって永久にマルウェアに感染しないことを保証する"
      - "スキャンを実施した時点でDefenderの検知能力に基づき判定した結果、既知の脅威パターンに一致するファイルが見つからなかったという事実だけを保証する"
      - "そのPCにインストールされているすべてのソフトウェアが最新版であることを保証する"
      - "そのPCのハードウェアに物理的な故障がないことを保証する"
    answerIndex: 1
    explanation: "フルスキャン合格が保証しているのは、スキャンを実施した時点でDefenderが持つ検知能力(シグネチャ、ヒューリスティック、クラウド照会)に基づいて判定した結果、既知の脅威パターンに一致するファイルが見つからなかったという事実だけです。ゼロデイ脅威や検知回避技術、スキャン対象外の領域までは保証していません。"

  - question: "Defenderが標準搭載されているにもかかわらず、組織が別のセキュリティソフトを併用する理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Defenderには検知機能自体が全く存在しないため"
      - "EDR・集中管理機能、組織のセキュリティポリシー・コンプライアンス要件、異なるOSを含む混在環境の統一管理といった理由がある"
      - "Defenderは特定の曜日にしか動作しない仕様になっているため"
      - "Windowsの利用規約上、Defender単体での運用が法律で禁止されているため"
    answerIndex: 1
    explanation: "Defenderは独立系評価機関のテストで高い検知率を記録することも多く、無料であることと性能の高低は直接結びつきません。それでも別製品を併用する理由には、EDR・集中管理機能、組織のセキュリティポリシー・コンプライアンス要件、混在OS環境の統一管理といったものがあります。"

  - question: "BoxDriveやGoogleDriveと連携したフォルダー内のファイルが、Defenderのスキャン対象になるかについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "エクスプローラー上に表示されているファイルはすべて、実体の有無に関わらず常にフルスキャンの対象になる"
      - "実体がクラウド上にのみ存在するプレースホルダー状態のファイルは、実際にダウンロードされるまでスキャンの対象にならず、フルスキャンを実行しても中身までは通常スキャンされない"
      - "クラウドドライブと連携したファイルは、Defenderのスキャン対象から永久に除外される設定になっている"
      - "クラウドドライブのファイルは、アップロードされた瞬間に自動的にローカルディスクへ完全にダウンロードされる仕様になっている"
    answerIndex: 1
    explanation: "Defenderのリアルタイム保護はローカルファイルシステム上のI/Oをフックして動作するため、まだダウンロードされていないプレースホルダー状態のファイルの中身は、実際にダウンロードされるまで検査対象になりません。フルスキャンを実行しても、クラウド上にのみ存在しダウンロードされていないファイルの中身までは通常スキャンされません。"
