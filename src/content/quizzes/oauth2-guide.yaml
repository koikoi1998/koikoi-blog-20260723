questions:
  - question: "OAuth 2.0が本質的に提供する機能として正しいのはどれか。"
    choices:
      - "ユーザーが誰であるかを確認する認証の機能"
      - "ユーザーが何を許可するかを決める認可の機能"
      - "パスワードを暗号化して保存する機能"
      - "APIのレスポンスをキャッシュする機能"
    answerIndex: 1
    explanation: "OAuth 2.0は認証ではなく、「何を許可するか」を決める認可のための仕組みです。"

  - question: "認可コードフローが、アクセストークンを直接ブラウザ経由で渡さず、認可コードを経由させている理由として正しいのはどれか。"
    choices:
      - "認可コードの方が、アクセストークンより長い文字列だから"
      - "ブラウザのリダイレクト経路は、URLや履歴に情報が残る、比較的ガードの低い経路であるため"
      - "認可コードは、暗号化なしで送信する必要があるため"
      - "アクセストークンは、HTTPSでしか送信できない仕様になっているため"
    answerIndex: 1
    explanation: "強い権限を持つアクセストークンを、ガードの低いブラウザのリダイレクト経路に直接通さないよう、使い捨ての認可コードを経由させています。"

  - question: "クライアントシークレットが、認可コードの交換時に必要になる理由として正しいのはどれか。"
    choices:
      - "ユーザーのパスワードを暗号化するため"
      - "認可コードを使おうとしているのが、本当に正規のアプリ自身であることを証明するため"
      - "APIの呼び出し回数を制限するため"
      - "トークンの有効期限を延長するため"
    answerIndex: 1
    explanation: "クライアントシークレットは、認可コードを盗んだ第三者による不正利用を防ぐための、合言葉です。"

  - question: "アクセストークンとリフレッシュトークンの役割の違いとして正しいのはどれか。"
    choices:
      - "両方とも同じ有効期限で、同じ用途に使われる"
      - "アクセストークンは短命でAPI呼び出しに使い、リフレッシュトークンは長命で新しいアクセストークンの再発行専用である"
      - "リフレッシュトークンの方が、常に短い有効期限を持つ"
      - "アクセストークンは、ユーザーが手動で発行する必要がある"
    answerIndex: 1
    explanation: "アクセストークンは短命でAPI呼び出しに使われ、リフレッシュトークンは長命で、新しいアクセストークンの再発行専用です。"

  - question: "OAuth 2.0だけでは、厳密には「ログイン」が実現できない理由として正しいのはどれか。"
    choices:
      - "OAuth 2.0はHTTPSに対応していないため"
      - "OAuth 2.0は認可の仕組みであり、認証機能はOpenID Connect(OIDC)という別の規格によって実現されるため"
      - "OAuth 2.0は、1つのアプリでしか使用できないため"
      - "OAuth 2.0には、アクセストークンという概念が存在しないため"
    answerIndex: 1
    explanation: "ユーザー認証(ログイン)を実現するには、OAuth 2.0に加えて、OpenID Connect(OIDC)という別の規格が必要です。"
