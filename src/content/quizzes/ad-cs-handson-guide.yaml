questions:
  - question: "AD CSにおいて、証明書の自動登録(自動発行)が可能なのはどちらのCAか。"
    choices:
      - "スタンドアロンCAのみ"
      - "エンタープライズCAのみ"
      - "どちらのCAでも同じように可能"
      - "どちらのCAでも不可能"
    answerIndex: 1
    explanation: "自動登録は、証明書テンプレートがAD DSの設定パーティションに保存される、AD DSと統合されたエンタープライズCAでのみ可能です。"

  - question: "証明書テンプレートの「登録(Enroll)」権限だけを付与した場合、どうなるか。"
    choices:
      - "自動登録の対象にも自動的になる"
      - "ユーザーが手動で証明書を要求できるようになるだけで、自動登録の対象にはならない"
      - "証明書テンプレート自体が無効になる"
      - "GPOの設定が不要になる"
    answerIndex: 1
    explanation: "「登録」はユーザーが手動で証明書を要求する権限であり、GPOによる自動登録の対象にするには、別途「自動登録」権限を付与する必要があります。"

  - question: "自動登録の設定は、どこで行うか。"
    choices:
      - "証明書テンプレートの管理コンソールのみで完結する"
      - "証明書テンプレートへの権限付与と、GPOでの明示的な設定の両方が必要"
      - "レジストリを直接編集するだけでよい"
      - "DNSサーバーの設定のみで完結する"
    answerIndex: 1
    explanation: "自動登録には、証明書テンプレートへの「自動登録」権限の付与と、GPOでの「証明書サービス クライアント - 自動登録」設定の両方が必要です。"

  - question: "スタンドアロンCAが選ばれる典型的な場面はどれか。"
    choices:
      - "社内のドメイン参加済み端末への自動配布を優先したい場合"
      - "社外向け・高セキュリティ用途など、AD DSとの統合をあえて避けたい場合"
      - "GPOによる自動登録を必ず使いたい場合"
      - "証明書テンプレートを多用したい場合"
    answerIndex: 1
    explanation: "スタンドアロンCAはAD DSに依存しない代わりに、証明書発行を個別に承認する運用が前提になっており、AD DSとの統合をあえて避けたい場面で選ばれます。"

  - question: "AD CSのエンタープライズCAで自動登録が実現できる技術的な理由は何か。"
    choices:
      - "証明書テンプレートが、AD DSの設定パーティション(フォレスト全体で共有)に保存されているため"
      - "エンタープライズCAは常にインターネットに接続されているため"
      - "証明書のサイズがスタンドアロンCAより小さいため"
      - "エンタープライズCAはDNSサーバーを兼任しているため"
    answerIndex: 1
    explanation: "証明書テンプレートという情報自体がAD DSの設定パーティションに保存されているため、AD DSと連携するGPOを使った自動登録が成立します。"
