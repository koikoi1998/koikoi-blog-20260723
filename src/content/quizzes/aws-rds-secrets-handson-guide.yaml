questions:
  - question: "RDSインスタンス作成時に`--no-publicly-accessible`を指定する目的は何か。"
    choices:
      - "作成コストを下げるため"
      - "パブリックIPを持たせず、プライベートサブネット内からしか到達できないようにするため"
      - "自動バックアップを有効化するため"
      - "ストレージ容量を自動で拡張するため"
    answerIndex: 1
    explanation: "RDSにパブリックIPを持たせず、正規のアプリサーバーが動くプライベートサブネット内からしか到達できないようにすることが、本番運用の大前提です。"

  - question: "アプリのコードにDBパスワードを一切書かずに済む理由は何か。"
    choices:
      - "RDSがパスワード認証を使わなくなったため"
      - "実行時にSecrets Managerからシークレットを取得し、そこから初めてパスワードを得ているため"
      - "パスワードが自動的に無効化されるため"
      - "アプリがパスワードなしで接続できる特別な設定があるため"
    answerIndex: 1
    explanation: "アプリはEC2のIAMロールの一時的な認証情報を使ってSecrets Managerへアクセスし、そこで初めてDBパスワードを取得します。コードやSDK呼び出しの中にパスワードそのものは登場しません。"

  - question: "IAMロールに付与するSecrets Managerの権限のポリシー設計として適切なのはどれか。"
    choices:
      - "SecretsManagerFullAccessのような広い権限を付与する"
      - "特定のシークレットのARNだけに絞り込んだ、最小権限のポリシーを付与する"
      - "権限を一切設定しなくても自動的にアクセスできる"
      - "IAMユーザーのアクセスキーを埋め込む"
    answerIndex: 1
    explanation: "Resourceを特定のシークレットのARNだけに絞り込むことで、そのEC2が乗っ取られた場合の被害を、そのシークレットだけに限定できます。"

  - question: "Secrets Managerの自動ローテーション機能について正しい説明はどれか。"
    choices:
      - "ローテーションのたびにアプリのコードを書き換える必要がある"
      - "RDS側のパスワード変更とSecrets Manager側の更新をLambda関数が自動的に同期し、アプリのコードは変更不要"
      - "ローテーションは手動でしか実行できない"
      - "ローテーションを有効化するとRDSインスタンスを再作成する必要がある"
    answerIndex: 1
    explanation: "アプリ側は『実行時にSecrets Managerから取得する』という処理のままで変更不要であり、パスワードが裏側で定期的に入れ替わっていることに気づく必要すらありません。"

  - question: "RDSがプライベートサブネットに置かれるべき理由として最も適切なのはどれか。"
    choices:
      - "プライベートサブネットの方が通信速度が速いため"
      - "正規のアプリサーバー以外から接続を受け付ける必要が本来一切なく、外部から接続を開始できない構成にできるため"
      - "プライベートサブネットでないとRDSを作成できないため"
      - "コストが安くなるため"
    answerIndex: 1
    explanation: "データベースは正規のアプリサーバー以外から接続を受け付ける必要が本来なく、外部から接続を開始できないプライベートサブネットに置くことが標準的な設計です。"
