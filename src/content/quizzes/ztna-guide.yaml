questions:
  - question: "VPNとZTNAの信頼モデルの違いとして、記事内で説明されている最も本質的な違いはどれか。"
    choices:
      - "VPNは暗号化を使わないが、ZTNAは暗号化を使う"
      - "VPNは一度認証すればネットワークセグメント全体を信頼するのに対し、ZTNAはネットワークへの参加という概念自体を持たず、リクエストのたびにユーザー・デバイスの状態を検証する"
      - "VPNはクラウド上でしか動作しないが、ZTNAはオンプレミスでしか動作しない"
      - "VPNはUDPしか使えないが、ZTNAはTCPしか使えない"
    answerIndex: 1
    explanation: "VPNが認証成功後にネットワークレベルで信頼するモデルであるのに対し、ZTNAはリクエストごとに検証するという、信頼の単位そのものが異なるモデルだと説明されています。"

  - question: "VPNの構造がラテラルムーブメントのリスクを生む理由として、記事内の説明はどれか。"
    choices:
      - "VPNの暗号化アルゴリズムが弱いため、通信内容が盗聴されやすいから"
      - "認証を突破されると、攻撃者はそのVPNセグメント内の他のホストにもネットワーク層で到達できてしまうため"
      - "VPNサーバーは常にインターネットから直接アクセス可能な状態になっているため"
      - "VPNは接続のたびに新しい暗号鍵を生成しないため"
    answerIndex: 1
    explanation: "VPN接続は仮想IPアドレスとルーティングテーブルによりセグメント全体への到達性を与えるため、認証が突破されるとその到達性自体が攻撃者に渡ってしまうと説明されています。"

  - question: "SDP(Software-Defined Perimeter)モデルにおいて、SPA(Single Packet Authorization)が実現する性質として、記事内の説明はどれか。"
    choices:
      - "認証済みのユーザーの通信速度を優先的に高速化する"
      - "認証されるまでゲートウェイが該当ポートへの通信に一切応答しないため、外部からはポートの状態すら判別できない"
      - "1つのパケットだけですべてのアプリケーションへの認可を完了させる"
      - "ゲートウェイが受け取ったすべてのパケットを暗号化せずログに記録する"
    answerIndex: 1
    explanation: "SPAにより、認証されていないクライアントからのポートスキャンに対してゲートウェイが一切応答しなくなるため、ネットワークの存在自体が外部から見えなくなると説明されています。"

  - question: "ZTNAのエージェント型・クライアントレス型の実装に共通する特徴として、記事内の説明はどれか。"
    choices:
      - "どちらも社内ファイアウォールにインバウンドポートを開ける必要がある"
      - "コネクタが社内ネットワークからクラウド側へアウトバウンドで接続を開始するため、インバウンド接続を許可する必要がない"
      - "どちらもWebブラウザからのアクセスにしか対応していない"
      - "どちらも専用クライアントソフトウェアのインストールが必須である"
    answerIndex: 1
    explanation: "エージェント型・クライアントレス型のいずれも、コネクタが社内からクラウド側へアウトバウンド接続を開始するため、社内ファイアウォールでインバウンド接続を許可する必要がないと説明されています。"

  - question: "ZTNAとゼロトラストの関係について、記事内の説明として正しいものはどれか。"
    choices:
      - "ZTNAとゼロトラストは完全に同じ意味の言葉であり、置き換え可能である"
      - "ZTNAは、ゼロトラストという広い原則をリモートアクセスという具体的な場面に適用した実装形態の1つに過ぎない"
      - "ゼロトラストはZTNA製品を販売する特定ベンダーの登録商標である"
      - "ゼロトラストはZTNAより古い概念で、現在は使われなくなった用語である"
    answerIndex: 1
    explanation: "ゼロトラストはNIST SP 800-207などで定義される広い原則であり、ZTNAはその原則をリモートアクセスに適用した実装の1つに過ぎないと説明されています。"
