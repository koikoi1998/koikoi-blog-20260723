questions:
  - question: "スプリットホライズンDNSの説明として正しいのはどれか。"
    choices:
      - "ゾーン転送を高速化する仕組み"
      - "同じドメイン名に対して、問い合わせ元によって異なる応答を返す設計"
      - "複数のTLDを1つのサーバーで管理する仕組み"
      - "DNSSECの検証を高速化する仕組み"
    answerIndex: 1
    explanation: "スプリットホライズンDNSは、同じドメイン名に対して、社内・社外など問い合わせ元によって異なる応答を返す設計です。"

  - question: "BINDのviewsが、問い合わせ元を判定する基準として正しいのはどれか。"
    choices:
      - "問い合わせに使われたDNSレコードのタイプ"
      - "match-clientsで指定された、送信元IPアドレスの範囲"
      - "問い合わせに使われたポート番号"
      - "クライアントのMACアドレス"
    answerIndex: 1
    explanation: "viewsは、match-clientsに指定された送信元IPアドレスの範囲によって、どのビューを使うかを判定します。"

  - question: "named.confに複数のview定義がある場合の評価順序として正しいのはどれか。"
    choices:
      - "アルファベット順に評価される"
      - "上から順に評価され、最初にマッチしたビューが採用される"
      - "ランダムな順序で評価される"
      - "常にすべてのビューが同時に適用される"
    answerIndex: 1
    explanation: "viewsは上から順に評価され、match-clientsに最初にマッチしたビューが採用されるため、限定的な条件を先に書く必要があります。"

  - question: "viewsを使う際の実務上の注意点として正しいのはどれか。"
    choices:
      - "internal/externalの両方のゾーンファイルを、別々に管理し続ける運用コストが発生する"
      - "viewsを使うとDNSSECが自動的に無効化される"
      - "viewsを使うとゾーン転送が一切不要になる"
      - "viewsは1つのゾーンファイルしか必要としない"
    answerIndex: 0
    explanation: "スプリットホライズンDNSでは、同じドメイン名について内部用・外部用の2つのゾーンファイルを別々に管理し続ける必要があり、共通レコードの食い違いに注意が必要です。"

  - question: "VPN接続時に、社内向けのビューの結果が返ってくる理由として正しいのはどれか。"
    choices:
      - "VPN接続がDNSSECを自動的に有効化するため"
      - "VPN接続によってクライアントの送信元IPアドレスが社内アドレスとして扱われるため"
      - "VPN接続時はゾーン転送が発生するため"
      - "VPN接続はDNSのポート番号を変更するため"
    answerIndex: 1
    explanation: "match-clientsは送信元IPアドレスのみで判定するため、VPN接続によって送信元IPアドレスが社内アドレスになれば、internalビューの結果を受け取ります。"
