questions:
  - question: "シナリオ1で、xl2tpdがparse_configエラーで起動に失敗した直接の原因は何か。"
    choices:
      - "サーバーのIPアドレスが間違っていたため"
      - "[lac L2TPLab]の行頭に;(コメント記号)が残ったままだったため、セクション全体が無効な行として読み飛ばされたため"
      - "xl2tpdのバージョンが古すぎたため"
      - "ppp debug = yesの設定値が不正だったため"
    answerIndex: 1
    explanation: "行頭に;が残っていると、そのセクションはコメントアウトされた無効な行として扱われ、xl2tpdの設定パーサーはこのセクションの存在自体に気づけません。"

  - question: "シナリオ2で、options.xl2tpdにlockを含めると、明確なエラーメッセージが出ないままpppdが起動に失敗するのはなぜか。"
    choices:
      - "lockはpppdに存在しないオプションだから、必ず起動時にエラーになる"
      - "lockはシリアルデバイスに対するロックファイル作成を行うオプションだが、pppol2tp経由の接続にはロック対象の実デバイスが存在しないため"
      - "lockオプションは暗号化通信専用で、平文通信では使えないため"
      - "lockオプションを使うと、pppdは常に5分間起動を待機する仕様になっているため"
    answerIndex: 1
    explanation: "lockはシリアルデバイス向けのロックファイル作成オプションで、pppol2tpプラグイン経由の接続にはロック対象の実体あるデバイスがないため、不整合を起こしてpppdが正しく起動できません。"

  - question: "シナリオ4で、ike=の値からスペースを削除してクライアント側だけ再起動しても直らないことがあるのはなぜか。"
    choices:
      - "スペースの削除では根本原因が直らないため、常にサーバーの再インストールが必要になる"
      - "設定ファイルの編集は稼働中のcharonデーモンに即座に反映されるとは限らず、失敗したネゴシエーションの状態が残っている場合があるため、サーバー側も含めて再起動する必要がある"
      - "IKEはクライアント側の設定を一切参照しない仕組みだから"
      - "ike=の値はサーバー側でのみ有効で、クライアント側の値は常に無視されるため"
    answerIndex: 1
    explanation: "編集した設定は稼働中のデーモンに即座に反映されるとは限らず、失敗したネゴシエーションの状態が残っていることがあります。クライアント・サーバー双方を再起動して初めて、クリーンな状態から鍵交換をやり直せます。"

  - question: "シナリオ5で、Windowsクライアントだけ接続に失敗した根本原因は何か。"
    choices:
      - "Windowsのファイアウォールが常にL2TP/IPsecの通信をすべてブロックするため"
      - "chap-secretsのサーバー名フィールドを固定値にしていたため、Windows RRASクライアントが名乗る値と一致せず、認証情報の検索に失敗したため"
      - "WindowsはCHAP認証に対応していないため"
      - "サーバーのIPアドレスがLinuxクライアントとWindowsクライアントで異なっていたため"
    answerIndex: 1
    explanation: "chap-secretsの2番目のフィールド(サーバー名)が固定値だと、クライアントの種類によって名乗り方が異なる場合に認証情報の検索が失敗することがあります。ワイルドカード(*)にすることで解消します。"

  - question: "この記事全体を通じて紹介されている、障害調査の基本的な型として正しいものはどれか。"
    choices:
      - "まず設定ファイルをすべて削除し、最初から作り直す"
      - "症状を正確に言葉にし、正常なら通過するはずの各段階をログで1つずつ裏取りし、エラーが出ない場合は疑わしい設定を1つずつ外して比較する"
      - "エラーが起きたら即座にOSを再インストールする"
      - "ログは一切確認せず、設定ファイルを何度も書き直して試行錯誤するだけでよい"
    answerIndex: 1
    explanation: "症状の正確な言語化、各段階の順序立てたログでの裏取り、エラーが出ない場合の実験的な切り分けという3つが、この記事で一貫して紹介されている調査の型です。"
