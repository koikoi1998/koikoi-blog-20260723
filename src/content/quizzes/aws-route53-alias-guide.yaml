questions:
  - question: "Route 53のエイリアスレコードが、ゾーンの頂点に置けるのはなぜか。"
    choices:
      - "AWSがDNSの標準仕様を特別に書き換えているため"
      - "プロトコルレベルでは実際にAレコードとして応答するため、SOA・NSとの共存制約に抵触しないから"
      - "ゾーンの頂点という概念自体がAWSには存在しないため"
      - "エイリアスレコードには、そもそもレコードの共存制約が適用されないため"
    answerIndex: 1
    explanation: "エイリアスレコードは、DNSプロトコルのレベルでは実際にAレコードとして応答するため、ゾーンの頂点に置いても、SOA・NSレコードとの共存制約に抵触しません。"

  - question: "エイリアスレコードが指し示せる対象として正しいのはどれか。"
    choices:
      - "インターネット上のどんなドメインでも自由に指し示せる"
      - "ALB・CloudFront・S3静的Webサイトなど、AWSが明示的にサポートしているリソースに限定される"
      - "オンプレミスのサーバーのみ"
      - "他社クラウドのリソースのみ"
    answerIndex: 1
    explanation: "エイリアスレコードが指し示せる対象は、ALBやCloudFrontなど、AWSが明示的にサポートしているリソースに限定されています。"

  - question: "エイリアスレコードが、通常のCNAMEより名前解決の往復が1回少ない理由として正しいのはどれか。"
    choices:
      - "エイリアスレコードはキャッシュされないため"
      - "Route 53自身が、内部的にターゲットのIPアドレスをすでに把握しており、最初の問い合わせに直接IPアドレスを返せるため"
      - "エイリアスレコードはUDPではなくTCPを使うため"
      - "エイリアスレコードはIPv6専用だから"
    answerIndex: 1
    explanation: "エイリアスレコードでは、Route 53自身がターゲットのIPアドレスをすでに把握しているため、最初の問い合わせに対して直接IPアドレスを返すことができ、CNAMEの2段階の問い合わせより1回少なくなります。"

  - question: "AWSリソースを対象としたエイリアスレコードへの問い合わせの課金として正しいのはどれか。"
    choices:
      - "通常のレコードより高額に課金される"
      - "Route 53のクエリ課金の対象外(無料)である"
      - "AWSサポートへの問い合わせが必要になる"
      - "エイリアスレコード自体の作成に、毎月の固定費がかかる"
    answerIndex: 1
    explanation: "AWSのリソースを対象としたエイリアスレコードへの問い合わせは、Route 53のクエリ課金の対象外であり、無料です。"

  - question: "エイリアスレコードの正体として正しいのはどれか。"
    choices:
      - "CNAMEレコードの単なる別名、あるいは上位互換に過ぎない"
      - "標準のDNSプロトコルには存在しない、Route 53独自の仕組みであり、ALIAS/ANAMEという概念のAWSにおける実装"
      - "DNSSECの検証にのみ使われる、特殊なレコード"
      - "AWSのセキュリティグループと同じ仕組みを使ったレコード"
    answerIndex: 1
    explanation: "エイリアスレコードは、標準のDNSプロトコルには存在しない、Route 53が提供する独自の抽象化であり、ALIAS/ANAMEという概念のAWSにおける具体的な実装です。"
