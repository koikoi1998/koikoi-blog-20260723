questions:
  - question: "C$・IPC$・ADMIN$という管理共有について、記事の説明に最も合致するものはどれか。"
    choices:
      - "これらはAD DSやDC固有の共有であり、通常のWindows Serverには存在しない"
      - "これらはAD DSやDCに固有のものではなく、Windows Server全般で既定で自動的に作成される管理共有である"
      - "これらは管理者が手動で作成しない限り、絶対に存在しない共有である"
      - "IPC$は、実際のファイルを保存するための特別な共有フォルダーである"
    answerIndex: 1
    explanation: "C$・IPC$・ADMIN$は、AD DSやDCに固有のものではなく、通常のWindows Serverであれば既定で必ず自動的に作成される管理共有です。IPC$は実体のあるフォルダーではなく、プロセス間通信用の名前付きパイプです。"

  - question: "WindowsのSMBクライアントの接続キャッシュが管理される基準について、記事の説明に最も合致するものはどれか。"
    choices:
      - "接続先を指定した際に使った文字列(IPアドレスかホスト名か)ごとに、別々の接続としてキャッシュ・管理される"
      - "接続キャッシュは、そのサーバーの物理的なMACアドレスだけを基準に管理される"
      - "接続キャッシュは、常に1台のサーバーにつき1つのエントリだけが存在するように設計されている"
      - "接続キャッシュは、Windowsのバージョンによってキャッシュされる項目が完全にランダムに決まる"
    answerIndex: 0
    explanation: "Windowsのファイル共有クライアント(SMBリダイレクタ)は、接続先を指定する際に使った文字列(IPアドレスの文字列か、ホスト名の文字列か)を基準に、接続を別々にキャッシュ・管理します。同じ物理サーバーを指していても、IPアドレスとホスト名は別々の接続として扱われます。"

  - question: "記事で診断された事例において、\\\\IPアドレス\\特定フォルダへのアクセスだけが失敗した理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "サーバー側でCドライブの共有(C$)を停止したこと自体が、直接的にそのフォルダへのアクセス権限を削除したため"
      - "以前\\\\IPアドレス\\c$へアクセスした際に確立・キャッシュされた、そのIPアドレスをキーとした古い接続状態が、新たな\\\\IPアドレス\\特定フォルダへの接続と干渉したため"
      - "特定フォルダのNTFSアクセス許可が、IPアドレスでのアクセスだけを技術的に禁止する設定になっていたため"
      - "IPアドレスでのアクセスは、Windows Serverの仕様上ホスト名でのアクセスより常に低速になるため"
    answerIndex: 1
    explanation: "最初に\\\\IPアドレス\\c$へアクセスした時点で、IPアドレスという文字列をキーにしたSMB接続がクライアント側にキャッシュされます。その後C$共有を停止しても、クライアント側の古い接続キャッシュは残り続けるため、新たな\\\\IPアドレス\\特定フォルダへの接続がこの古い状態と干渉して失敗します。"

  - question: "\\\\ホスト名\\特定フォルダへのアクセスが問題なく成功した理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ホスト名は、IPアドレスとは異なる文字列をキーとした、まったく新規の接続として扱われるため、古いキャッシュの影響を受けずにクリーンに接続が成立する"
      - "ホスト名でのアクセスは、常に管理者権限で自動的に認証されるため"
      - "ホスト名でのアクセスは、共有アクセス許可のチェック自体をスキップする仕様になっているため"
      - "ホスト名でのアクセスは、NTFSアクセス許可の影響を一切受けない"
    answerIndex: 0
    explanation: "ホスト名を使ったアクセスは、IPアドレスとは異なる文字列をキーとした、まったく新規の接続として扱われます。そのため、IPアドレス宛に残っていた古い接続キャッシュの影響を受けずに、クリーンに接続が成立します。"

  - question: "接続キャッシュが文字列単位で管理されている、より本質的な理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "単なる実装上の都合であり、それ以上の技術的な理由は存在しない"
      - "KerberosのサービスチケットはSPN(ホスト名に基づく識別子)に対して発行され、IPアドレス宛のSPNは通常存在しないため、ホスト名接続はKerberosを使えてもIPアドレス接続はNTLMにフォールバックするという、認証プロトコル自体の違いに根ざしている"
      - "IPアドレスでの接続は、技術的に一切の認証を必要としないため"
      - "ホスト名接続とIPアドレス接続は、常にまったく同じ認証プロトコルを使用する"
    answerIndex: 1
    explanation: "IPアドレス宛のSPNは通常存在しないため、\\\\SRV01への接続はKerberosのSPNマッチングが成立しうる一方、\\\\10.0.20.5への接続はマッチするSPNがなくNTLM認証にフォールバックします。接続キャッシュが文字列単位で管理されているのは、この認証コンテキストを接続先ごとに独立して保持する必要があるためです。"

  - question: "この種の「IPアドレスでは失敗するがホスト名では成功する」現象への実務的な対処法について、記事の説明に最も合致するものはどれか。"
    choices:
      - "対処法は存在せず、サーバーを完全に再構築する以外に解決手段はない"
      - "net useコマンドで現在の接続一覧を確認し、該当する接続先をnet use /deleteで明示的に切断してから再度アクセスを試みる"
      - "Windows Serverのライセンスを再購入することで解決する"
      - "サーバーのIPアドレス自体を毎回ランダムに変更することで回避する"
    answerIndex: 1
    explanation: "net useコマンドでクライアント側に残っているキャッシュされた接続を確認し、該当する接続先をnet use /deleteで明示的に切断してから再度アクセスし直すことで、多くの場合この種の現象は解消します。"
