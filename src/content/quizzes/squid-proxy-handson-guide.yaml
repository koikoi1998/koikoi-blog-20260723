questions:
  - question: "このハンズオンでクライアントがSquidを使う方式は、明示的プロキシと透過型プロキシのどちらか。"
    choices:
      - "透過型プロキシ。クライアントはプロキシの存在を意識していない"
      - "明示的プロキシ。クライアントが環境変数でプロキシのアドレスを明示的に指定している"
      - "どちらでもない、第三の方式である"
      - "設定次第でどちらにもなる"
    answerIndex: 1
    explanation: "http_proxy/https_proxy環境変数でプロキシのアドレスを明示的に指定しているため、これは明示的プロキシです。"

  - question: "`http_access`のルールが評価される順序として正しいのはどれか。"
    choices:
      - "すべてのルールが評価され、最も厳しい判定が適用される"
      - "上から順に評価され、最初にマッチしたルールが適用される。それ以降は評価されない"
      - "ランダムな順序で評価される"
      - "下から順に評価される"
    answerIndex: 1
    explanation: "http_accessのルールは上から順に評価され、最初にマッチしたルールで即座に確定します。それ以降のルールは一切評価されません。"

  - question: "許可ルール(allow all)を拒否ルール(deny)より先に書いてしまうと何が起きるか。"
    choices:
      - "拒否ルールが優先され、正しく機能する"
      - "拒否ルールが永久に評価されなくなり、意図しない全許可の状態になる"
      - "Squidが起動エラーになる"
      - "特に問題は起きない"
    answerIndex: 1
    explanation: "http_accessは最初にマッチしたルールで確定するため、広い許可ルールを先に書くと、それ以降のdenyルールは永久に評価されません。"

  - question: "`dstdomain`によるACLが、ファイアウォールのIPアドレス単位の制御と根本的に異なる点は何か。"
    choices:
      - "dstdomainの方が処理速度が常に速い"
      - "同じIPアドレスを持つサーバーであっても、リクエスト内のホスト名(ドメイン名)単位で許可・拒否を判断できる"
      - "dstdomainはHTTPSにのみ対応している"
      - "特に違いはない"
    answerIndex: 1
    explanation: "プロキシはHTTPリクエストの中身(ホスト名など)を実際に理解できるため、同じIPアドレスのサーバーでも、ドメイン名単位で許可・拒否を判断できます。"

  - question: "ACLで拒否したドメインへのアクセスについて正しい説明はどれか。"
    choices:
      - "ネットワークレベルで完全に到達不能になる"
      - "Squidが返すのはHTTPレベルの拒否応答であり、プロキシを経由しない別経路からは到達できる可能性がある"
      - "ACLを設定すると、そのドメインのDNSレコードが削除される"
      - "ACLは物理的にケーブルを切断するのと同じ効果を持つ"
    answerIndex: 1
    explanation: "Squidが返しているのはHTTPレベルの拒否応答(403など)であり、プロキシを経由しない別の経路からは依然として到達できる可能性があります。"
