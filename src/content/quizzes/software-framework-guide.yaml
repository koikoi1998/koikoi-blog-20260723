questions:
  - question: "ライブラリとフレームワークの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "機能の数が多いものがフレームワーク、少ないものがライブラリと呼ばれる"
      - "制御の主導権がどちらにあるか(制御の反転)という構造的な違いであり、ライブラリはあなたのコードが呼び出し、フレームワークはあなたのコードを呼び出す"
      - "ライブラリとフレームワークは完全に同じものを指す、単なる呼び方の違いにすぎない"
      - "有料で提供されるものがフレームワーク、無料で提供されるものがライブラリである"
    answerIndex: 1
    explanation: "ライブラリとフレームワークの違いは規模ではなく、制御の反転(Inversion of Control)という構造的な違いです。ライブラリはあなたのコードが能動的に呼び出しますが、フレームワークはあなたのコードを部品として組み込み、フレームワーク側が決めたタイミングで呼び出します。"

  - question: "ランタイムについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "ランタイムとは、フレームワークの別名にすぎない"
      - "ランタイムとは、コンパイル(または中間言語への変換)されたコードを実際に実行するために必要な環境そのものであり、フレームワークはその上に建てられる"
      - "ランタイムとは、ソースコードを人間が読みやすい形式に変換するツールである"
      - "ランタイムは、SDKに含まれることは決してない独立した製品である"
    answerIndex: 1
    explanation: "ランタイムは、コンパイル(または中間言語への変換)されたコードを実際に実行するために必要な環境そのものです。.NETのCLRが代表例で、ASP.NETのようなフレームワークも、内部的にはこのランタイムの上で動いています。"

  - question: "SDKについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "SDKとは、フレームワークやライブラリと同じ、実行時に呼び出される仕組みの一種である"
      - "SDKとは、特定のプラットフォーム向けにソフトウェアを開発するために必要な、ランタイム・ライブラリ・コンパイラなどの道具一式をまとめたパッケージであり、フレームワークやライブラリとは次元が異なる概念である"
      - "SDKは、APIのより古い呼び方にすぎない"
      - "SDKをインストールすると、自動的にすべてのライブラリの依存関係が解決され、二度とバージョン管理が不要になる"
    answerIndex: 1
    explanation: "SDKは、特定の実行モデルを指す言葉ではなく、開発に必要な道具一式(ランタイム・ライブラリ・コンパイラ等)をまとめたパッケージを指します。フレームワークやライブラリを内包する「包含関係」にあり、次元が異なる概念です。"

  - question: "APIについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "APIとは、Web APIのことだけを指す専門用語である"
      - "APIとは、ソフトウェアの実体ではなく、「このように呼び出せば、このように応答する」という約束事(契約)そのものであり、ライブラリやフレームワークが外部に見せている窓口の仕様である"
      - "APIとは、ランタイムの内部で自動的に生成される、隠されたコードのことである"
      - "APIとフレームワークは、まったく同じ実体を指す別名である"
    answerIndex: 1
    explanation: "APIはソフトウェアの実体ではなく、呼び出し方の約束事(インターフェースの仕様)そのものです。Web APIはその一種にすぎず、ローカルで呼び出すライブラリの関数シグネチャも同じくAPIと呼ばれます。"

  - question: "ライブラリとフレームワークの乗り換えコストの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "ライブラリもフレームワークも、乗り換えコストにはまったく違いがない"
      - "ライブラリは制御の主導権があなたのコード側にあるため比較的乗り換えやすいが、フレームワークはコード自体がその実行の枠組みに合わせて書かれているため、乗り換えには構造自体の大きな書き直しが必要になりやすい"
      - "フレームワークのほうが常にライブラリより乗り換えが簡単である"
      - "乗り換えコストは、そのソフトウェアの価格によってのみ決まる"
    answerIndex: 1
    explanation: "ライブラリは制御の主導権があなたのコード側にあるため、同じAPIを持つ別のライブラリへの差し替えは比較的小さな変更で済みます。一方フレームワークは、あなたのコード自体がその実行の枠組みに合わせて書かれているため、乗り換えには構造自体の大きな書き直しが必要になることがほとんどです。"
