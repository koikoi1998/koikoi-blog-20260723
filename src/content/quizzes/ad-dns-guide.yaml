questions:
  - question: "ADサーバーがDNSサーバーの役割を兼任することが多い理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Windows Serverのライセンス上、DNSサーバーは必ずDCと同じ機器にインストールしなければならないため"
      - "DCロケーター機能がDNSのSRVレコードに依存しており、AD統合ゾーンによってレコードの複製をAD DS自体のレプリケーションに相乗りできるため"
      - "DNSサーバーはAD DSより処理が軽く、DC以外のハードウェアでは動作しないため"
      - "DNSサーバーを別サーバーに分離すると、Windows Serverのライセンス費用が2倍になるため"
    answerIndex: 1
    explanation: "クライアントがDCを見つけるDCロケーター機能はDNSのSRVレコードへの問い合わせに依存しています。またDNSサーバーの役割をDC自身に持たせてAD統合ゾーンにすると、レコードの複製をAD DS自体のマルチマスターレプリケーションに相乗りさせられ、別途ゾーン転送を管理する必要がなくなります。"

  - question: "「ping 8.8.8.8は通るのに検索できない」という症状の原因について、記事の説明に最も合致するものはどれか。"
    choices:
      - "pingコマンド自体がインターネット接続を一時的に切断してしまうため"
      - "pingはIPアドレス直指定でDNSを一切経由しないため疎通確認にしかならず、実際にはDNSサーバーのフォワーダー設定の不備で社外の名前解決だけが失敗している可能性が高い"
      - "8.8.8.8というIPアドレスが、ブラウザからのアクセスをブロックする設定になっているため"
      - "DNSサーバー自体が完全に停止しており、あらゆる名前解決が失敗しているため"
    answerIndex: 1
    explanation: "ping 8.8.8.8はIPアドレスを直接指定するためDNSを一切経由せず、ルーティングの疎通確認にしかなりません。ブラウザでの検索には必ずDNSが必要なため、DNSサーバーのフォワーダー設定に不備があると社外の名前解決だけが失敗し、この症状が発生します。社内ドメインの名前解決は権威サーバーとして直接答えられるため正常に機能し続けます。"

  - question: "プライマリDNSサーバーで名前解決に失敗した場合の、Windowsのデフォルトの挙動について、記事の説明に最も合致するものはどれか。"
    choices:
      - "応答がタイムアウトした場合と、応答はあったが望んだ結果でなかった場合の両方で、自動的にセカンダリDNSサーバーへ問い合わせる"
      - "応答自体が返ってこない(タイムアウトする)場合のみセカンダリへ問い合わせ、応答が返ってきた場合(内容が誤っていても)はそれを最終結果として受け取る"
      - "常にプライマリとセカンダリの両方に同時に問い合わせ、早く返ってきた方を採用する"
      - "セカンダリDNSサーバーは、プライマリが完全に削除されない限り一切使われない"
    answerIndex: 1
    explanation: "DNSクライアントは、応答自体が返ってこない(タイムアウトする)場合にのみセカンダリDNSサーバーへ問い合わせます。応答が返ってきた場合は、その内容が誤っていてもクライアント側には正誤を判断する手段がないため、そのまま最終結果として受け取り、セカンダリへは切り替わりません。"

  - question: "「メインDNSで名前解決できないときにサブDNSへ自動で聞きに行くべきではないか」という発想について、記事がそうしない方が都合がよいとする理由は何か。"
    choices:
      - "サブDNSサーバーは処理速度が遅く、常に使うとネットワーク全体が重くなるため"
      - "クライアントが応答内容の気に入らなさで別のDNSサーバーへ渡り歩けてしまうと、同じ名前に対する信頼すべき回答が状況によって変わり、名前解決結果が予測不可能になるため"
      - "サブDNSサーバーは法律上、緊急時以外の利用が禁止されているため"
      - "サブDNSサーバーには常に古いキャッシュしか保存されていないため"
    answerIndex: 1
    explanation: "クライアントが応答内容が気に入らないという理由で別のDNSサーバーへ自由に問い合わせを渡り歩けるようになると、同じ名前に対してどのDNSサーバーの回答を信頼するかが状況によって変わってしまい、名前解決の結果が予測不可能になります。またNXDOMAINのような正しい回答まで「失敗」とみなして探し続けてしまう問題も生じます。"

  - question: "ADサーバー自身のDNS設定に127.0.0.1を指定すべきと言われる理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "127.0.0.1は世界中のどのネットワークからでも到達できる特別なグローバルIPアドレスだから"
      - "起動時のネットワークスタックの初期化状況に依存せず自分自身のDNSサービスを確実に参照でき、複数DC間で実IPを相互参照し合う構成による循環依存も避けられるため"
      - "127.0.0.1を指定すると、DNSサーバーの処理速度が理論上無限大になるため"
      - "Windows Serverのライセンス認証に127.0.0.1の指定が必須だから"
    answerIndex: 1
    explanation: "127.0.0.1(ループバック)を指定すると、ネットワークスタック全体の初期化状況に関わらず自分自身のDNSサービスを確実に参照しやすくなり、また複数DC間で互いの実IPを参照し合う構成による起動時の循環依存も回避できます。"

  - question: "127.0.0.1をDNSに指定する構成の副作用について、記事の説明に最も合致するものはどれか。"
    choices:
      - "副作用は一切なく、あらゆる環境で無条件に推奨される"
      - "自分自身のDNSサービスが部分的に不調(完全なダウンではない状態)に陥っても、常に自分自身に問い合わせるため、その不調を検知して他の健全なDCへ自動的にフェイルオーバーする機会が失われる"
      - "127.0.0.1を指定すると、そのDC自身がドメインコントローラーとして機能しなくなる"
      - "127.0.0.1を指定すると、他のDCとのレプリケーションが完全に停止する"
    answerIndex: 1
    explanation: "DNSサーバー設定が常に自分自身(ループバック)を向いていると、自分自身のDNSサービスが部分的に不調になっても、プライマリが応答さえすればセカンダリへは切り替わらないという挙動のため、その不調を検知して他の健全なDCへフェイルオーバーする機会が失われます。セカンダリには必ず別の健全なDCを指定することが実務上の折衷案です。"

  - question: "ipconfig /registerdnsが行っていることについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "DNSサーバーのゾーンデータを完全に初期化し、すべてのレコードを削除する"
      - "既定でおよそ24時間ごとに行われる自動的なDNSレコードの再登録・更新を、待たずに今すぐ実行する"
      - "そのPCのDNSサーバーの設定(IPアドレス)自体を自動的に最適なものへ変更する"
      - "ドメインコントローラーへの昇格処理そのものを実行する"
    answerIndex: 1
    explanation: "クライアント(あるいはDC自身)は既定でおよそ24時間ごとに自分のホスト名とIPアドレスのレコードを自動的に再登録・更新しています。ipconfig /registerdnsは、この自動更新を待たずに今すぐ動的DNS更新をやり直すためのコマンドです。"
