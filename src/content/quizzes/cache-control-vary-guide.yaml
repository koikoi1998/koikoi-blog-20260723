questions:
  - question: "「no-cache」ディレクティブが実際に指示している内容として正しいのはどれか。"
    choices:
      - "キャッシュに一切保存しないこと"
      - "キャッシュには保存するが、使う前に必ずサーバーへ再検証を行うこと"
      - "キャッシュの保存期間を無制限にすること"
      - "共有キャッシュへの保存だけを禁止すること"
    answerIndex: 1
    explanation: "no-cacheは、キャッシュへの保存自体は許可しつつ、使う前に必ずサーバーへ再検証を行うことを強制する指示です。"

  - question: "「一切キャッシュに保存しない」ことを意図する場合に、正しく使うべきディレクティブはどれか。"
    choices:
      - "no-cache"
      - "no-store"
      - "max-age=0"
      - "public"
    answerIndex: 1
    explanation: "一切保存しないことを意図する場合は、no-storeを使う必要があります。no-cacheは保存自体を許可します。"

  - question: "Ageヘッダーが伝える情報として正しいのはどれか。"
    choices:
      - "レスポンスの言語設定"
      - "キャッシュサーバーが持つレスポンスが、オリジンから取得されてから何秒経過したか"
      - "クライアントのブラウザのバージョン"
      - "レスポンスの暗号化方式"
    answerIndex: 1
    explanation: "Ageヘッダーは、キャッシュサーバーが、自分のキャッシュの鮮度(何秒経過したか)をクライアントへ伝えるためのヘッダーです。"

  - question: "Varyヘッダーが扱う問題として正しいのはどれか。"
    choices:
      - "キャッシュの保存期間を指定する"
      - "同じURLでも、指定したリクエストヘッダーの値が異なれば、別々のキャッシュとして管理させる"
      - "キャッシュの保存場所をCDNかブラウザかで切り替える"
      - "レスポンスの圧縮方式を指定する"
    answerIndex: 1
    explanation: "Varyヘッダーは、同じURLへのリクエストでも、指定した条件が異なれば別々のキャッシュとして扱わせる仕組みです。"

  - question: "Varyヘッダーの指定を忘れた場合に起きる、実務上よくある障害として正しいのはどれか。"
    choices:
      - "キャッシュが完全に無効化される"
      - "最初にアクセスしたユーザーの言語設定に基づくレスポンスが、異なる言語設定を持つ別のユーザーにまで誤って配信される"
      - "サーバーがクラッシュする"
      - "すべてのリクエストが404エラーになる"
    answerIndex: 1
    explanation: "Varyの指定漏れにより、最初のユーザー向けのレスポンスがキャッシュされ、異なる条件を持つ別のユーザーにも誤って配信されてしまいます。"
