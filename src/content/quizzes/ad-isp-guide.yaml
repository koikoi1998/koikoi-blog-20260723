questions:
  - question: "ISP(インターネットサービスプロバイダー)が提供しているサービスについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "アクセス回線を貸すだけで、それ以外のサービスは一切提供していない"
      - "アクセス回線の提供に加えて、グローバルIPアドレスの割り当てやDNSの再帰リゾルバといった付随サービスも一体で提供していることが多い"
      - "DNSサーバーの提供のみを専門に行っており、回線そのものは別の会社が提供している"
      - "ISPはテレビ放送のみを専門に扱う事業者であり、インターネット接続とは無関係である"
    answerIndex: 1
    explanation: "ISPは、契約者のアクセス回線をインターネットへ接続する事業者であり、単に回線を貸すだけでなく、グローバルIPアドレスの割り当てや、DNSの再帰リゾルバといった付随サービスも回線契約に付随する形で一体的に提供していることが多いです。"

  - question: "Tier1・Tier2・Tier3というISPの階層構造について、記事の説明に最も合致するものはどれか。"
    choices:
      - "単に事業者の売上規模を3段階に分類したものであり、接続方式とは無関係である"
      - "Tier1はピアリングのみで全世界に到達できるが、Tier2はピアリングに加え一部トランジットを購入し、Tier3はトランジットの購入のみでインターネットに接続している"
      - "Tier1が最も下位の階層であり、Tier3が最上位のバックボーン事業者を指す"
      - "この階層構造は、日本国内のISPにのみ適用される独自の分類である"
    answerIndex: 1
    explanation: "Tier1事業者はピアリング(無償の相互接続)だけで世界中のあらゆる経路に到達できます。Tier2事業者はピアリングも行いますが不足分をトランジット(有償)で購入し、Tier3事業者はほぼトランジットの購入のみでインターネットに接続しています。"

  - question: "日本でケーブルテレビ局がISPを兼業していることが多い理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "法律により、ケーブルテレビ局は必ずインターネット接続サービスも提供しなければならないと定められているため"
      - "もともとテレビ放送用にエリア内のほぼすべての建物まで同軸ケーブルなどの伝送路を既に敷設していたため、その資産を転用して比較的低コストでインターネット接続事業に参入できたため"
      - "ケーブルテレビ局は、インターネット専用の新しい光ファイバー網をゼロから構築したため"
      - "テレビ放送とインターネット接続は技術的にまったく別の周波数帯を使わないため、自然に同じサービスとして提供されている"
    answerIndex: 1
    explanation: "ケーブルテレビ局は、テレビ放送用にエリア内のほぼすべての建物まで伝送路を既に敷設していました。新規敷設のコスト(ラストワンマイル問題)が大きい中、この既存資産を転用してテレビ放送が使っていない周波数帯にデータ信号を載せることで、比較的低コストでインターネット接続事業に参入できました。"

  - question: "社内DNSのフォワーダー先にISPのDNSサーバーが指定されがちな理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "技術的に、フォワーダーにはISPのDNSサーバー以外を指定することができない仕様になっているため"
      - "回線契約時にルーターの設定(PPPoEやDHCP)を通じて渡される既定値が、意図的に変更されない限りそのまま使われ続けているという、運用上の経緯によるもの"
      - "ISPのDNSサーバーは、パブリックDNSよりも常に高性能であることが保証されているため"
      - "AD DSの仕様上、フォワーダーにはISPのDNSサーバーを指定することが必須とされているため"
    answerIndex: 1
    explanation: "企業が新規にインターネット回線を契約すると、ルーターの設定を通じてISPのDNSサーバーのIPアドレスが既定値として渡されます。多くの現場ではこの既定値を意図的に変更しない限り、そのままフォワーダー先として使われ続けます。これは技術的な必然ではなく、運用上の経緯によるものです。"

  - question: "フォワーダー先としてISPのDNSサーバーとパブリックDNSのどちらを使うべきかについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "ISPのDNSサーバーは常に劣っているため、パブリックDNSのみを使うべきである"
      - "それぞれの特性(ISPのDNSサーバーは地理的に近く応答が速い傾向、パブリックDNSは分散配置で可用性が高い)を理解した上で、複数の提供元を組み合わせ、単一のISPへの依存を避けるべきである"
      - "パブリックDNSは日本国内からは利用できないため、ISPのDNSサーバーのみを使うべきである"
      - "どちらを使っても結果に一切違いは生じないため、どちらか一方だけを設定すればよい"
    answerIndex: 1
    explanation: "ISPのDNSサーバーは地理的・ネットワーク的に利用者に近く応答が速い傾向があり、パブリックDNSは世界中に分散配置されたエニーキャストインフラで高い可用性と特定ISPからの独立性を持ちます。上位1%のエンジニアは、この両者の特性を理解した上で複数の提供元を組み合わせ、単一のISPへの依存を避けます。"
