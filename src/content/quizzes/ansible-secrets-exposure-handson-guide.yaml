questions:
  - question: "`no_log`を設定せずに`-v`オプションでPlaybookを実行した場合に起こることは何か。"
    choices:
      - "何も表示されない"
      - "コマンドライン全体が出力され、パスワードなどの機密情報がそのまま表示されてしまう"
      - "自動的にパスワードが伏字になる"
      - "実行自体がエラーになる"
    answerIndex: 1
    explanation: "no_logを設定していない場合、-vオプションでの実行結果に、コマンドライン全体が機密情報を含んだままそのまま表示されてしまいます。"

  - question: "`no_log: true`が抑制するのは何か。"
    choices:
      - "対象ホストのプロセス一覧への表示"
      - "Ansible自身のログ出力"
      - "ネットワーク上の通信内容すべて"
      - "Gitリポジトリへのコミット履歴"
    answerIndex: 1
    explanation: "no_logはAnsible自身のログ出力だけを抑制するものであり、対象ホストのプロセス一覧への表示までは防げません。"

  - question: "no_logを設定していても防げない漏洩経路として正しいのはどれか。"
    choices:
      - "Ansibleのverboseログへの出力"
      - "コマンド実行中に、対象ホストのプロセス一覧(ps auxなど)でコマンドライン引数が見えてしまうこと"
      - "Ansible Vaultで暗号化されたファイルの内容"
      - "SSH接続時のパスワード入力"
    answerIndex: 1
    explanation: "no_logはAnsibleのログ出力だけを抑制するため、コマンド実行中に対象ホストのプロセス一覧に引数が表示される経路までは防げません。"

  - question: "外部から渡された信頼できない値を`shell`モジュールに直接埋め込んだ場合のリスクは何か。"
    choices:
      - "実行速度が遅くなるだけである"
      - "値に含まれる`;`以降が、別のコマンドとして実行されてしまうシェルインジェクションのリスクがある"
      - "Ansibleが自動的にエラーとして拒否するため、実害はない"
      - "ログにのみ影響し、実際の実行には影響しない"
    answerIndex: 1
    explanation: "信頼できない値をshellモジュールに直接埋め込むと、その値に含まれる;以降が別のコマンドとして実行されてしまう、シェルインジェクションのリスクが生まれます。"

  - question: "シェルインジェクション対策の本質的なアプローチとして最も適切なのはどれか。"
    choices:
      - "shellモジュールの実行速度を上げる"
      - "専用モジュール(user・mysql_userなど)が存在するなら、まずそちらの利用を検討し、shellモジュールへの直接埋め込みを避ける"
      - "すべての変数をVaultで暗号化する"
      - "no_logを設定すればシェルインジェクションも防げる"
    answerIndex: 1
    explanation: "専用モジュールは内部でパラメータを安全に扱うよう設計されているため、shellモジュールに直接埋め込むのではなく、専用モジュールの利用をまず検討することが根本的な対策です。"
