questions:
  - question: "AH(Authentication Header)が提供する機能について、記事の説明に最も合致するものはどれか。"
    choices:
      - "AHは完全性(改ざん検知)と機密性(暗号化)の両方を提供する"
      - "AHは完全性(改ざん検知)だけを提供し、機密性(暗号化)の機能は一切持たない"
      - "AHは機密性(暗号化)だけを提供し、完全性の機能は一切持たない"
      - "AHはIPアドレスの割り当てを管理するためのプロトコルである"
    answerIndex: 1
    explanation: "AHはIPパケットに完全性(改ざんされていないことの証明)だけを付与するプロトコルであり、ESPと異なり機密性(暗号化)の機能を一切持ちません。"

  - question: "AHとESPの構造的な違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "AHはペイロードだけを完全性検証の対象とし、ESPはIPヘッダー全体を暗号化の対象とする"
      - "AHはIPヘッダーの大部分(送信元・宛先IPアドレスを含む)まで完全性検証の対象に含めるのに対し、ESPはこの範囲を対象に含めない"
      - "AHとESPは完全に同一の仕組みであり、名前が違うだけである"
      - "AHはUDPのみをサポートし、ESPはTCPのみをサポートする"
    answerIndex: 1
    explanation: "AHは、ペイロードだけでなくIPヘッダーの大部分(送信元・宛先IPアドレスを含む、可変フィールドを除く)までを完全性検証の対象に含めます。これがESPとの構造的な違いであり、後述するNATとの相性の悪さの直接的な原因になります。"

  - question: "AHが暗号化機能を持たない設計になっている歴史的な理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "1990年代当時、強力な暗号技術が輸出管理の対象(デュアルユース技術)とされており、機密性を持たないAHはこうした規制の対象になりにくかったため"
      - "暗号化機能を実装すると、AHのヘッダーサイズが物理的に大きくなりすぎるため"
      - "AHを開発した組織が、暗号化技術に関する特許を保有していなかったため"
      - "AHは元々、暗号化が不要な公開情報だけを扱うことを目的として設計されたため"
    answerIndex: 0
    explanation: "1990年代当時、強力な暗号技術は軍事技術と同様にデュアルユース技術として輸出管理の対象とされていました。機密性(暗号化)の機能を持たないAHは、通信内容そのものを秘匿しないため、こうした暗号輸出規制の対象になりにくいという特性があり、規制の厳しい国や組織でも完全性の保護だけは実現できる手段として一定の存在意義がありました。"

  - question: "AHが現在の実務でほとんど使われない、最も直接的で決定的な理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "AHは処理速度がESPより極端に遅く、実用に耐えないため"
      - "AHがIPヘッダー自体(送信元・宛先IPアドレスを含む)を完全性検証の対象に含める設計が、NATによるIPヘッダーの書き換えと構造的に相容れないため"
      - "AHは特定のOSでしか動作しないため"
      - "AHはIPv6環境でのみ動作し、IPv4環境では一切利用できないため"
    answerIndex: 1
    explanation: "AHはIPヘッダー自体を完全性検証の対象に含めるため、NAT機器がIPヘッダーの送信元・宛先IPアドレスを書き換えると、受信側で計算する完全性検証用のハッシュ値が一致しなくなり、パケットが改ざんと判定されて破棄されます。この構造的な相性の悪さが、NATが広く普及した現在においてAHがほとんど使われない決定的な理由です。"

  - question: "ESPだけでAHが提供していた完全性のみの要件を満たせるかについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "ESPには完全性検証の機能自体が存在しないため、AHの代替にはならない"
      - "ESPの暗号化アルゴリズムをNULL(暗号化なし)に設定し、完全性検証の機能だけを有効にする(ESP-NULL)ことで、機密性は不要だが完全性だけは欲しいという要件にも対応できる"
      - "ESPは常にIPヘッダー全体を暗号化するため、AHより厳格な完全性保護しか提供できない"
      - "ESPとAHは併用が禁止されており、どちらか一方しか選択できない"
    answerIndex: 1
    explanation: "ESPは暗号化アルゴリズムをNULLに設定した上で完全性検証の機能だけを有効にする構成(ESP-NULL)が可能です。ESPの完全性検証はAHと異なり外側のIPヘッダー全体を対象に含めないため、NAT環境でも問題にならず、AHが提供していた機能的な価値を代替できます。"
