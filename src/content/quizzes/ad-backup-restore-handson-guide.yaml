questions:
  - question: "非権威的復元だけを実行した場合、削除したオブジェクトはどうなるか。"
    choices:
      - "即座に完全に復元され、二度と消えない"
      - "バックアップ時点の状態に戻るが、その後のレプリケーションで結局は最新の状態(削除済み)に追いつく"
      - "復元処理自体が必ず失敗する"
      - "他のDCがすべて自動的にシャットダウンする"
    answerIndex: 1
    explanation: "非権威的復元は、バックアップ時点の状態に戻すだけで、その後のレプリケーションによって、他のDCが持つ最新の状態(削除済みなど)に結局追いついてしまいます。"

  - question: "権威的復元(Authoritative Restore)が実際に行っている操作は何か。"
    choices:
      - "対象のオブジェクトを暗号化する"
      - "対象オブジェクトのUSN(更新シーケンス番号)を、他のどのDCよりも新しい値に意図的に書き換える"
      - "対象のDC自体を新しく作り直す"
      - "対象オブジェクトのパスワードをリセットする"
    answerIndex: 1
    explanation: "権威的復元は、ntdsutilを使って対象オブジェクトのUSNを、他のDCが持つ値よりも大きな値に書き換えることで、そのオブジェクトを「正しい最新の状態」として他のDCに認識させます。"

  - question: "`restore subtree`コマンドについて、正しい説明はどれか。"
    choices:
      - "フォレスト全体を対象にした権威的復元しか実行できない"
      - "特定のOU配下だけを対象にした、部分的な権威的復元を実行できる"
      - "ドメインコントローラーそのものを復元するコマンドである"
      - "AD ごみ箱の機能を有効化するコマンドである"
    answerIndex: 1
    explanation: "restore subtreeコマンドを使うと、特定のOU配下だけを対象にした部分的な権威的復元が可能です。フォレスト全体を対象にする必要はありません。"

  - question: "AD ごみ箱とSystem Stateバックアップの関係について、正しい説明はどれか。"
    choices:
      - "AD ごみ箱があれば、System Stateバックアップはもう不要である"
      - "両者は対応できる障害の深刻度が異なる、補完関係にある備えである"
      - "System Stateバックアップは、AD ごみ箱の機能を完全に置き換えるものである"
      - "AD ごみ箱とSystem Stateバックアップは、まったく同じ仕組みの別名である"
    answerIndex: 1
    explanation: "AD ごみ箱はtombstoneLifetime以内かつAD DS自体が正常な場合の復旧手段であり、それを超える深刻な障害にはSystem Stateバックアップからの復元が必要です。両者は補完関係にあります。"

  - question: "USNベースのレプリケーションの仕組みが、セキュリティの観点でどのような効果を持つか。"
    choices:
      - "パスワードの強度を自動的に強化する効果がある"
      - "古いバックアップから意図的に古い状態へ巻き戻す攻撃に対して、他の健全なDCとのレプリケーションが正しい状態へ引き戻す防御として機能する"
      - "ファイアウォールの設定を自動的に最適化する効果がある"
      - "USNベースの仕組みには、セキュリティ上の効果は一切ない"
    answerIndex: 1
    explanation: "古いバックアップから意図的に古い状態へ巻き戻そうとしても、通常の(権威的でない)復元では、他の健全なDCとのレプリケーションによって正しい最新の状態へ引き戻されるため、巻き戻し攻撃への防御として機能します。"
