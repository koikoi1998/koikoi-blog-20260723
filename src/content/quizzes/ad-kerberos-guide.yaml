questions:
  - question: "Kerberos認証がパスワードそのものをネットワークへ送信せずに本人確認できる仕組みについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "パスワードを毎回、より強力なアルゴリズムで再ハッシュ化してから送信している"
      - "クライアントとKDCが、それぞれ独立にユーザーのパスワードから同じ鍵を導出できることを利用し、その鍵で暗号化したタイムスタンプを送ることで、パスワードそのものではなく「その鍵を持っている証拠」だけをやり取りしている"
      - "パスワードを一度だけ暗号化して送信し、それ以降は送信しない"
      - "KDCがパスワードを保存しておらず、常にユーザーへパスワードを尋ねる"
    answerIndex: 1
    explanation: "クライアントはパスワードから導出した鍵で現在時刻のタイムスタンプを暗号化して送信し、KDCは自分が保持するパスワードハッシュから独立に同じ鍵を導出して復号を試みます。正しく復号できること自体が本人確認の証明になり、パスワードのハッシュ値そのものはネットワーク上を一切流れません。"

  - question: "TGT(チケット保証チケット)について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ユーザーのパスワードそのものが平文で格納されている"
      - "KDC自身の鍵(krbtgtアカウントのパスワードから導出)で暗号化されているため、クライアント自身はその中身を復号して読むことができない"
      - "クライアントが自分自身の鍵で暗号化して作成する、自己署名の証明書である"
      - "サービスへアクセスするたびに、KDCへ都度送り返す必要がある使い捨てのデータである"
    answerIndex: 1
    explanation: "TGTはKDC自身の鍵(krbtgtという特殊なアカウントのパスワードから導出される鍵)で暗号化されているため、クライアント自身はその中身を復号して読むことができません。クライアントにとっては、次にサービスチケットを要求する際にKDCへ提示することで本人確認済みであることを証明するための、封をされた証拠書類のようなものです。"

  - question: "PAC(特権属性証明書)とSIDの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "PACにはユーザーのパスワードハッシュだけが含まれており、SIDとは無関係である"
      - "PACには、ユーザー自身のSIDと、そのユーザーが所属するすべてのグループのSIDの一覧が含まれており、サービス側はこれを見るだけでAD DSへ都度問い合わせることなく認可情報を検証できる"
      - "PACはSIDを一切含まず、単にユーザー名の文字列だけを含んでいる"
      - "PACはKerberos認証とは無関係の、別のプロトコルで使われるデータ構造である"
    answerIndex: 1
    explanation: "PACには、ユーザー自身のSIDと、そのユーザーが所属するすべてのグループのSIDの一覧が含まれています。サービス側はチケットからPACを取り出すだけで、AD DSへ都度問い合わせることなく「このユーザーは誰で、どのグループに属しているか」を判断できます。これがWindowsの権限管理がSIDを基準に行われる仕組みの実体です。"

  - question: "Kerberos認証とNTLM認証の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "NTLMの方が常に高速で、委任(二重ホップ認証)にも対応している"
      - "Kerberosはチケットベースでサービス側がDCへ都度問い合わせる必要がなく、相互認証や委任にも対応しているが、NTLMはチャレンジレスポンス方式で認証のたびにDCへの確認が必要で、委任も基本的にできない"
      - "KerberosとNTLMは実質的にまったく同じ仕組みで、呼び方が違うだけである"
      - "NTLMはKerberosより新しいプロトコルであり、将来的にKerberosを置き換える予定である"
    answerIndex: 1
    explanation: "Kerberosはチケットベースの認証方式で、サービス側は自分の鍵でチケットを検証するだけで完結し、DCへ都度問い合わせる必要がありません。また相互認証や委任にも対応しています。一方NTLMはチャレンジレスポンス方式で、認証のたびにサーバーがDCへ確認する必要があり、委任も基本的にできません。"

  - question: "「トークン肥大化(Token Bloat)」問題について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ユーザーが非常に多くのグループに所属していると、PACに含まれるSIDのリストが膨らみ続け、MaxTokenSizeという上限を超えると一部のグループ情報がトークンに含まれなくなり、アクセスできるはずのリソースにアクセスできなくなったり認証が不安定になったりする"
      - "ユーザーのパスワードが長すぎることで発生する問題である"
      - "DCのディスク容量が不足することで発生する、AD DSデータベース自体の肥大化問題である"
      - "この問題は理論上のみ存在し、実務で遭遇することはない"
    answerIndex: 0
    explanation: "PACにはユーザーの全所属グループのSIDが含まれるため、非常に多くのグループに所属するユーザーではPACのサイズが膨らみ続けます。MaxTokenSize(既定でおよそ48KB)という上限を超えると、一部のグループ情報がトークンに含まれなくなり、アクセス不可や認証不安定という症状につながります。"
