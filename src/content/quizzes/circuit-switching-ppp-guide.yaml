questions:
  - question: "回線交換方式(電話網)とパケット交換方式(IPネットワーク)の本質的な違いとして、記事の内容に最も合致するものはどれか。"
    choices:
      - "回線交換は経由する交換機の台数が1台に限られるのに対し、パケット交換は複数の中継機器を経由できる"
      - "回線交換は通信のたびに専用の経路を組み立てて通信中は専有し続けるのに対し、パケット交換は1本の回線を多数の通信が共有し、パケットごとに宛先へ振り分ける"
      - "回線交換はデータをパケット単位に分割するのに対し、パケット交換はデータを分割せずそのまま送る"
      - "回線交換は宛先IPアドレスを使って経路を決めるのに対し、パケット交換は電話番号で経路を決める"
    answerIndex: 1
    explanation: "回線交換は通話ごとに1対1の専用経路を組み立て、通信中はそれを専有し続けます。パケット交換は1本の回線を多数の通信が統計的に共有し、パケットごとに宛先IPアドレスを見て転送先を判断します。経由する交換機の台数の違い(選択肢1)や、宛先情報の主体の取り違え(選択肢4)は本文の説明と異なります。"

  - question: "固定電話網で、発信元の交換局から着信先まで複数の交換機を経由する場合でも「専用線」的な性質を持つと言える理由として、記事が説明しているものはどれか。"
    choices:
      - "経由する交換機の台数が常に1台に制限されているから"
      - "TDM(時分割多重)によって割り当てられた経路(タイムスロット)が、通話の間ずっと固定され、他の通信に横取りされないから"
      - "すべての交換機がIPアドレスによって経路を管理しているから"
      - "モデムハンドシェイクによって経路の専有が保証されるから"
    answerIndex: 1
    explanation: "ポイントは経由する交換機の数ではなく、TDMによって割り当てられた経路(タイムスロット)が呼(通話)の間ずっと固定され、他の通信に横取りされないという性質です。IPアドレスによる経路管理はIPネットワーク側の話であり、電話網の回線交換の説明ではありません(選択肢3)。"

  - question: "PPPが「宛先アドレスを持たず、届いたフレームをただ順番に処理する」というシンプルな設計で成立している理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "PPPは元々パケット交換方式のIPネットワーク専用に設計されたプロトコルだから"
      - "電話回線が1対1で専有され、送った順番通りに届くことが前提にできる回線交換方式だったから"
      - "モデムがすべてのエラー訂正を行うため、PPP側では何も考慮する必要がないから"
      - "IPCPが常にすべてのパケットの宛先を自動的に補完してくれるから"
    answerIndex: 1
    explanation: "電話回線は通信中1本の物理回線を占有し続け、データも1本の経路をそのまま流れるため順序が保たれることが前提にできます。この「1対1で専有され、順序も保たれる回線」という前提があるからこそ、PPPは宛先アドレスを持たないシンプルな設計で成立しています。PPPはパケット交換専用に設計されたわけではありません(選択肢1)。"

  - question: "ダイヤルアップ接続の手順(発信〜回線接続、モデムハンドシェイク、PPPのLCP、PPP認証フェーズ、IPCP)について、記事の内容に最も合致するものはどれか。"
    choices:
      - "電話番号をダイヤルした時点で、クライアントにはすでにIPアドレスが割り当てられている"
      - "モデムハンドシェイクの段階で、すでにPPPのLCPネゴシエーションが完了している"
      - "IPCPによって認証成功後にIPアドレスが払い出されるまで、クライアント側には一切IPアドレスがない"
      - "PPP認証フェーズでは、人間のオペレーターがユーザー名とパスワードを口頭で聞き取っている"
    answerIndex: 2
    explanation: "IPCPで認証成功後にIPアドレスが1つ払い出されるまで、クライアント側には一切IPアドレスがありません。電話番号のダイヤルはL1レベルの回線確保に過ぎず(選択肢1)、モデムハンドシェイクの時点ではPPPもIPもまだ登場しません(選択肢2)。着信はデータ着信として扱われ、人間のオペレーターが応対することはありません(選択肢4)。"

  - question: "PPP認証フェーズでモデム間をやり取りされるユーザー名・パスワードの伝達方式について、記事の説明として最も適切なものはどれか。"
    choices:
      - "モデムが音声認識を行い、ユーザーが口頭で話した内容をユーザー名・パスワードとして送信する"
      - "モデムハンドシェイクによってデータ通信用途に切り替わった回線上を流れる、連続的なデジタルデータとして自動的にやり取りされる"
      - "電話交換局のオペレーターが代理で認証情報を入力する"
      - "IPCP完了後にのみユーザー名・パスワードのやり取りが可能になる"
    answerIndex: 1
    explanation: "モデムハンドシェイクによって回線がデータ通信用途に切り替わった後、モデムが変調した連続的なデジタルデータとしてLCP→認証→IPCPが自動的にやり取りされます。この時間帯を人間が耳で聞いてもノイズにしか聞こえず、音声認識や人間の聞き取りは介在しません(選択肢1・3)。認証はIPCPより前のフェーズです(選択肢4)。"

  - question: "CHAP以降の認証方式が、PAPと比べて安全とされる理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "パスワードそのものを一度もネットワーク上に送らず、チャレンジレスポンス方式でハッシュ値だけをやり取りするから"
      - "CHAP以降は認証自体を行わず、常に接続を許可するから"
      - "CHAP以降はパスワードを毎回自動生成し、ユーザーが入力する必要がないから"
      - "CHAP以降は電話回線ではなく専用線でしか使えないため、盗聴の可能性がないから"
    answerIndex: 0
    explanation: "PAPはユーザー名・パスワードを平文のまま送るのに対し、CHAP以降はチャレンジレスポンス方式によりパスワードそのものを一度もネットワーク上に送りません。盗聴者が入手できるのは毎回変わるチャレンジと1回限りのレスポンスだけで、元のパスワードを直接読み取ることはできません。"

  - question: "MS-CHAPv2が、CHAPと比べて追加で実現している特徴として、記事の説明に最も合致するものはどれか。"
    choices:
      - "パスワードを平文で送ることで処理を高速化している"
      - "クライアント→サーバーだけでなく、サーバー→クライアント方向の検証も行う双方向の相互認証に対応している"
      - "チャレンジレスポンス方式をやめ、固定の共有鍵だけで認証する"
      - "IPアドレスの払い出しをMS-CHAPv2自体が行う"
    answerIndex: 1
    explanation: "MS-CHAPv2はCHAPと同じくチャレンジレスポンス方式を使いますが、サーバー側がAuthenticator Responseを計算してクライアントに返すことで、「クライアントが正しいサーバーに繋がっているか」まで確認できる双方向の相互認証に対応しています。"

  - question: "MS-CHAPv2のNTレスポンスの解析コストが、理論上の128ビット(16バイトのNTハッシュ)ではなく単一のDES鍵(2^56通り)にまで還元されてしまう理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "NTハッシュの計算にMD4ではなくCRC32が使われているから"
      - "16バイトのNTハッシュを7・7・2バイトの3つに分割し、同じ1つのチャレンジハッシュをそれぞれ独立したDES鍵で暗号化するため、3つの鍵を個別に総当たりできてしまうから"
      - "サーバーが常にチャレンジ値を固定して送るから"
      - "MS-CHAPv2はそもそも暗号化を行わず、ハッシュ値をそのまま送っているから"
    answerIndex: 1
    explanation: "24バイトのNTレスポンスは、同じ8バイトのチャレンジハッシュを3つの独立したDES鍵でそれぞれ暗号化した結果を連結しただけです。3つの鍵を同時に総当たりする必要がなく、それぞれ単独のDES鍵として個別に突破できてしまうため、実質的な解読コストが単一の56ビットDES鍵にまで落ちます。"

  - question: "MS-CHAPv2のステップ2で、サーバーのチャレンジだけでなくクライアント自身のPeer Challengeも組み合わせてチャレンジハッシュを計算する理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "計算量を減らし、処理を高速化するため"
      - "レスポンスがサーバー側のチャレンジだけに依存しないようにし、サーバーが同じチャレンジを使い回すリプレイ攻撃を試みても毎回異なるレスポンスになるようにするため"
      - "IPアドレスの払い出し範囲を決定するため"
      - "パディングのバイト数を揃えるため"
    answerIndex: 1
    explanation: "クライアント側の乱数(Peer Challenge)を混ぜ込むことで、レスポンスがサーバー側のチャレンジだけに依存しなくなり、サーバーが同じチャレンジを使い回すリプレイ攻撃を試みても、クライアント側の乱数が毎回変わるため同じレスポンスにはなりません。"

  - question: "「PPPは電話回線専用の規格である」という理解について、記事の説明に照らして最も適切な評価はどれか。"
    choices:
      - "正しい。PPPはダイヤルアップ接続のために発明された規格である"
      - "誤り。PPPは2点間を直接つなぐシリアルリンク全般向けの汎用プロトコルであり、電話回線はその実現手段の1つに過ぎない"
      - "正しい。PPPoEやL2TPはPPPとは無関係の別規格である"
      - "誤り。PPPはもともとイーサネット専用に設計された規格である"
    answerIndex: 1
    explanation: "PPPは電話回線によるダイヤルアップに限らず、専用線など2点間を直接つなぐシリアルリンク全般の上で、リンクの確立・認証・IPアドレス設定を行うための汎用プロトコルとして設計されています。電話回線は当時安価だった実現手段の1つに過ぎません。PPPoE・L2TPはこの汎用性を利用してPPPを流用した技術です(選択肢3は誤り)。"

  - question: "ブロードバンド普及後のPPPoEや、リモートアクセスVPNのL2TPが、いずれもPPPを流用し続けている理由として、記事が挙げているものはどれか。"
    choices:
      - "PPPが提供する「1対1のリンクの上でユーザー単位の認証を行い、IPアドレスを動的に払い出す」という機能セットに、電話回線に限らない広い需要があったから"
      - "PPPoEとL2TPは、どちらもPPPとは無関係に独自開発された結果、たまたま同じ名前がついただけだから"
      - "PPPが唯一IPv6に対応したプロトコルだったから"
      - "電話回線の交換機がPPPoEやL2TPの通信を直接中継しているから"
    answerIndex: 0
    explanation: "PPPoEはPPPフレームをイーサネットフレームの中に、L2TPはPPPフレームをIPネットワーク上の仮想トンネルの中にそれぞれカプセル化することで、媒体が変わってもPPPが前提とする「1対1のリンク」と、その上でのユーザー認証・IPアドレス払い出しという機能セットを再現しています。これは電話回線に限らない普遍的な需要があったためです。"

  - question: "PPP系の接続(PPPoEやWAN専用線など)で障害が発生した際の切り分けの基本として、記事が説明しているものはどれか。"
    choices:
      - "常にモデムのハードウェア故障を最初に疑うべきである"
      - "LCP(リンク確立)→認証→IPCP(IPアドレス払い出し)のどの段階で止まっているかを切り分ける"
      - "IPCPが失敗した場合は、必ず認証情報の誤りが原因であると断定してよい"
      - "PPP系の障害は電話回線を使っていないため、切り分けの手順は現代のIPネットワークとは無関係である"
    answerIndex: 1
    explanation: "PPPは古い技術に見えても現在も遭遇する場面があり、切り分けの基本は電話回線時代と同じ「LCP→認証→IPCPのどの段階で止まっているか」です。IPCPで止まる原因は契約者情報の不一致やIPアドレスプールの枯渇など複数あり、認証情報の誤りだけとは限りません(選択肢3)。"
