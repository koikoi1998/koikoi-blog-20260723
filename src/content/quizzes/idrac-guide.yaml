questions:
  - question: "「BMC」と「iDRAC」の関係についての説明として、最も適切なものはどれか。"
    choices:
      - "BMCとiDRACは完全に同一の概念であり、呼び方が違うだけで実装上の差異は一切ない"
      - "BMCはサーバーのマザーボードに組み込まれ、リモート監視・管理を可能にするハードウェアコンポーネントの業界共通の概念であり、iDRACはDellによるBMCの実装で、仮想コンソールやファームウェアアップデートなどの追加機能を備える"
      - "iDRACはBMCの上位互換となる新しい通信プロトコルであり、IPMIやRedfishを置き換える規格である"
      - "BMCはソフトウェアの名称、iDRACはハードウェアチップそのものの名称という違いがある"
    answerIndex: 1
    explanation: "記事の通り、BMCは業界共通の概念(一般名詞)であり、iDRACはDellがその概念を実装した製品名(固有名詞)です。両者はプロトコルの違いではなく、包含関係(BMCという概念の中にiDRACという実装がある)にあります。"

  - question: "OSが完全にフリーズし、OS内部のネットワークスタックが応答しなくなったサーバーでも、管理者はiDRACの管理画面にアクセスできた。この現象を最も正確に説明しているものはどれか。"
    choices:
      - "iDRACはOSのネットワークスタックの最上位層に位置しており、OS全体がフリーズしてもその層だけは生き残るよう設計されているから"
      - "iDRACはOSのネットワークスタックを一切経由しない独立した通信経路を持ち、専用のプロセッサ・専用のメモリを備えた別のコンピュータとして帯域外で動作しているから"
      - "OSがフリーズしてもNICのドライバ部分だけは自動的に独立プロセスとして継続動作するよう冗長化されているから"
      - "iDRACはOSのメモリ空間内に確保された保護領域(セーフモード)で動作しているため、OS本体がフリーズしても影響を受けないから"
    answerIndex: 1
    explanation: "iDRACの本質は帯域外(Out-of-Band)管理であり、OSのネットワークスタックそのものを経由しない別経路・別コンピュータとして動作します。OSのスタックの一部という理解(選択肢1・3)や保護領域という理解(選択肢4)は誤りです。"

  - question: "「ホストのメイン電源をスタンバイ電源のまま動かし続ければ、iDRACという別のコンピュータをわざわざ用意しなくても同じことができるのではないか」という疑問に対する、記事の説明として最も適切なものはどれか。"
    choices:
      - "スタンバイ電源はPFC(力率補正)により変換効率が非常に高いため、理論上はホスト全体を賄える電力を供給できるが、Dellがコスト削減のためにあえて別チップを搭載している"
      - "スタンバイ電源が供給できるのはせいぜい数W〜十数W程度のごくわずかな電力であり、数十コアのCPUや大量のDIMMを含むホスト全体を動かすには全く足りないため、専用の小型コンピュータを別途用意する必要がある"
      - "スタンバイ電源はCPUには供給できてもメモリには供給できないという物理的制約があるため、ホスト全体を動作させることは原理的に不可能である"
      - "OSは電源投入時に必ずPOSTを経由する仕様であり、スタンバイ電源のみでPOSTを完了させることは規格上禁止されているため"
    answerIndex: 1
    explanation: "記事では電力の「桁」の違いを根拠として挙げています。スタンバイ電源はiDRAC専用の小さな組み込みチップを動かすには十分でも、ホスト全体を動かすには全く足りません。加えてホストとiDRACを分離しておくことで、OSのクラッシュ等が管理機能を道連れにしないという利点もあります。"

  - question: "iDRACが不安定になったため、ACケーブルを抜いて数分間放置する「フリードレイン(flea drain)」を実施したが、症状が改善しなかった。次に疑うべき原因として最も適切なものはどれか。"
    choices:
      - "コンデンサの残留電荷や揮発性メモリ上の中途半端な状態が原因だったが、放電時間が不足していただけなので、さらに長時間放置すれば改善する可能性が高い"
      - "フラッシュメモリに書き込まれたファームウェアそのものが破損している(不揮発性領域のデータ破損)可能性があり、この場合は放電では解決せず、ファームウェアの再書き込みやハードウェア交換が必要になる"
      - "フリードレインはホストOSの起動プロセスの初期化には効果があるが、iDRAC自体の不具合に対しては本来まったく効果がない操作である"
      - "フリードレインを実施すると必ずiDRACの設定がすべて工場出荷時状態に戻るため、単に再設定を忘れていたことが原因である"
    answerIndex: 1
    explanation: "記事は「放電で直る不具合(揮発性の状態異常)」と「放電で直らない不具合(不揮発性領域のデータ破損)」を明確に区別しています。放電で改善しない場合は後者を疑い、ファームウェアの再書き込みやハードウェア交換を検討すべきです。"

  - question: "iDRACのネットワークアクセス経路に関する記述のうち、誤っているものはどれか。"
    choices:
      - "Dedicated NIC構成では、iDRACへの管理トラフィックを業務トラフィックとは別の物理ネットワークにルーティングでき、セキュリティ的に最も推奨される構成である"
      - "Shared LOM構成でもVLANを有効にすることで運用は可能だが、その場合iDRACの管理トラフィックは本番ネットワークと同じ配線を流れることになる"
      - "Dellは、専用NIC・共有LOMいずれの構成であっても、iDRACをそのままインターネットに直接公開して運用することを推奨している"
      - "Shared LOM構成は追加配線が不要な一方、業務トラフィックと帯域を共有するため帯域競合・セキュリティリスクが増す"
    answerIndex: 2
    explanation: "Dellはインターネットからの直接利用・直接接続はそもそも設計・意図されていないと明言しており、明確に非推奨としています。実務では「専用NIC＋管理専用VLAN／サブネット」が推奨構成です。選択肢1・2・4はいずれも記事の記述と一致する正しい内容です。"

  - question: "Windows Serverでアプリケーションがクラッシュしイベントログに記録されたサーバーで、iDRAC Service Module(iSM)がインストールされ、Lifecycle Logのイベントレプリケーションが有効になっている。この状況の説明として最も適切なものはどれか。"
    choices:
      - "iSMのログレプリケーション機能により、iDRAC側のイベントログからもWindowsのアプリケーションクラッシュの詳細を参照できるようになる"
      - "iSMはiDRAC側のハードウェアイベントをOS側のイベントログに複製する機能であり、OS側のアプリケーションクラッシュのような情報がiDRAC側に伝わるわけではない。iDRACはハードウェア・ファームウェア層の事象のみを観測しており、アプリケーションクラッシュ自体は検知できない"
      - "iSMが有効な場合、iDRACとOSのイベントログは完全に統合され、双方向にすべてのイベントが同期される"
      - "iSMはOS障害発生時にiDRAC側で自動的に根本原因を解析し、ハードウェア由来かアプリケーション由来かを判定してレポートする機能を持つ"
    answerIndex: 1
    explanation: "iSMのログレプリケーションは「iDRAC側のログをOS側にコピーする」一方向の機能であり、OS側のログの守備範囲をiDRAC側に広げるものではありません。iDRACはあくまでハードウェア・ファームウェア層のみを監視しており、アプリケーションクラッシュは検知対象外です。"

  - question: "iSM(iDRAC Service Module)による通信経路と、iDRACによるホスト電源制御の経路の関係についての記述のうち、最も正確なものはどれか。"
    choices:
      - "iSMは双方向の通信経路であり、OSからiDRACへの命令伝達と、iDRACからホストの電源を制御する処理の両方がこの経路を通る"
      - "iSMは「ホストOS側からiDRACへ命令を伝える」ための一方向の経路(USB NIC/KCS)である。一方でiDRACがホストの電源をON/OFFする際は、マザーボード上の電源制御回路にBMCが直接アクセスする別の経路を使うため、iSMが未インストール、あるいはOS自体が入っていないサーバーでもiDRACからの電源操作は機能する"
      - "iSMがインストールされていない場合、iDRACはホストの電源を一切制御できない"
      - "iDRACがホストの電源を制御する際も必ずiSMの内部経路(USB NIC/KCS)を経由するため、OSが完全にクラッシュしている場合は電源操作もできなくなる"
    answerIndex: 1
    explanation: "記事では「OS→iDRAC」への経路はiSM(USB NIC/KCS経由)、「iDRAC→ホストの電源制御」への経路はBMCが持つ電源回路への直接アクセス、という向きの異なる2つの独立した経路が存在すると説明されています。電源制御はOS上のソフトウェアを一切経由しないため、OSやiSMの有無に関わらず機能します。"

  - question: "あるエンジニアが「iDRACが搭載されているサーバーなのだから、当然リモートで仮想コンソール(KVM)が使えるはずだ」と考えて検証を進めたところ、実際には仮想コンソールが利用できなかった。記事の内容から見て、最も可能性が高い原因はどれか。"
    choices:
      - "Dedicated NICではなくShared LOM構成だったため、仮想コンソール機能自体がハードウェア的に無効化されていた"
      - "搭載されていたライセンスがExpressであり、Expressには仮想コンソール機能が含まれていないため"
      - "iDRACのファームウェアバージョンが古く、仮想コンソール機能が実装される以前のバージョンだったため"
      - "iDRAC Basicライセンスでも仮想コンソールは本来使えるはずだが、ネットワーク上でポートがブロックされていたため"
    answerIndex: 1
    explanation: "記事はまさにこのケースを「実務でありがちな落とし穴」として挙げています。ライセンス階層表の通り、Expressは組み込みツールや簡易リモートアクセスを提供する一方、仮想コンソール機能は含まれておらず、Enterprise以上が必要です。"

  - question: "ホットスペア機能が有効なサーバーで、iDRACのハードウェアログ上に片方のPSUの電流値が非常に低いという状態が記録されている。この状況の解釈として最も適切なものはどれか。"
    choices:
      - "これは明確な異常であり、電流値が低いPSUは故障している可能性が高いため直ちに交換すべきである"
      - "ホットスペア機能により、負荷が低い状況では一方のPSUが「スリープ状態」となり最小限の電流供給に留めることでシステム全体の電力効率を高めている可能性がある。PSUがスリープ状態に遷移したイベントと実際に故障したイベントは別のログとして記録されるため、イベントの種類を確認して切り分けるべきである"
      - "A/Bグリッド冗長構成が正しく機能していないことを示す典型的な兆候であり、両方のPSUを同じ配電盤に接続し直す必要がある"
      - "PFC(力率補正)回路の故障を示す典型的な兆候であり、PSUユニットごと交換が必要である"
    answerIndex: 1
    explanation: "ホットスペア構成では意図的に片方のPSUの負荷を下げてアクティブ/スリープに分けるため、電流値が低いこと自体は正常動作でありえます。記事も、スリープ遷移イベントと故障イベントは別ログである点を確認する重要性を強調しています。"

  - question: "「iDRACのIPアドレスとOSのIPアドレスは同じものである」という誤解と、実際のネットワーク設計に関する記述として、最も適切なものはどれか。"
    choices:
      - "Dedicated NIC構成では別々のIPアドレス・サブネットを持つが、Shared LOM構成では物理NICを共有するため必ず同一のIPアドレスになる"
      - "Dedicated NIC・Shared LOMのいずれの構成でも、iDRAC用とOS用には別々のIPアドレスが払い出されるのが一般的であり、意図的にセグメントを分離することで、iDRACという最強権限の管理インターフェースへの攻撃対象領域(アタックサーフェス)を業務ネットワークから切り離す狙いがある"
      - "iDRACとOSのIPアドレスが分離されているのは技術的な制約によるものであり、セキュリティ上の意図は特にない"
      - "iDRACはIPアドレスを持たず、OSのIPアドレスにポート番号を変えてアクセスする方式を採っている"
    answerIndex: 1
    explanation: "記事は、Shared LOM構成でもiDRAC用とOS用は別にIPが払い出されると明記しています。またIPセグメントを分ける理由として、業務側が侵害されてもiDRACへの侵入経路を境界で遮断できるという、攻撃対象領域の分離という明確なセキュリティ上の意図を挙げています。"

  - question: "SSHでiDRACに接続できるが、ホストのOSは正常に稼働しており、iDRACのブラウザ画面にはアクセスできなくなった。この状況で最初に取るべき対処として最も適切なものはどれか。"
    choices:
      - "すぐにACケーブルを抜いてフリードレインを実施する"
      - "`racadm racresetcfg -rc`を実行し、ユーザーをroot/calvinの初期状態に戻す"
      - "`racadm get idrac.webserver`でEnable属性の値を確認する。Disabledになっていれば`racadm set idrac.webserver.enable enabled`で有効化する。ネットワークセキュリティ強化の作業中に誤って無効化してしまうケースが典型例である"
      - "システム識別ボタン(IDボタン)を長押しして物理リセットする以外に有効な手段はない"
    answerIndex: 2
    explanation: "SSHは通るがWebだけ繋がらないというのは、Webサーバー機能自体が設定上無効化されている典型例として記事が挙げているケースです。フリードレインや工場出荷時リセットのような破壊的操作は不要で、まずはWebサーバー設定の確認・有効化を試すべきです。"

  - question: "iDRACのRACADMコマンドがエラーを返し、SSH・ブラウザいずれでも接続できずタイムアウトする。ホストのOSは正常に稼働している。この状況における最も安全かつ適切な最初の対処はどれか。"
    choices:
      - "すぐにACケーブルを抜き、待機電力を完全放電(フリードレイン)する"
      - "`racadm racresetcfg -rc`を実行し、ユーザー・ネットワーク設定を含めて工場出荷時状態に戻す"
      - "iDRAC Service Module(iSM) 2.3以降がインストールされていれば、OS側からiSM経由でiDRACをリモートリセットする。iSMはホストOSとiDRACを繋ぐ内部専用経路(USB NIC/KCS)を使うため、通常の管理ネットワーク経由でiDRACに到達できない状況でも、OSさえ生きていればこの経路でリセットを試みられ、OSが生きている場合はこの方法が最も安全な選択肢とされている"
      - "システム識別ボタン(IDボタン)による物理リセット以外に選択肢はない"
    answerIndex: 2
    explanation: "記事のトラブルシューティング手順では、OSが生きている場合はiSM経由のリモートリセットが最も安全な選択肢として位置づけられています。構成を破壊するracresetcfg -rcや、いきなりの物理放電は、より軽微な手段を試した後の後段の選択肢です。"
