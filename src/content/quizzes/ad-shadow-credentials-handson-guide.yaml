questions:
  - question: "シャドウクレデンシャル攻撃において、攻撃者が対象のパスワードを一度も知る必要がない理由として正しいのはどれか。"
    choices:
      - "対象のパスワードが、常に空欄に設定されているから"
      - "PKINITは公開鍵暗号を使った認証方式であり、攻撃者が登録した自分の秘密鍵だけで認証を成立させられるから"
      - "ドメインコントローラーが、パスワード認証自体を無効化しているから"
      - "攻撃者が、事前にパスワードをすべて推測できているから"
    answerIndex: 1
    explanation: "PKINITは、パスワードから導出した鍵を使う通常のKerberos認証とは異なり、公開鍵暗号を使った認証方式です。攻撃者は、自分の秘密鍵だけでPKINITによる認証を成立させられるため、対象のパスワードを知る必要がありません。"

  - question: "シャドウクレデンシャル攻撃が成立するために、攻撃者が必要とする権限として正しいのはどれか。"
    choices:
      - "ドメイン管理者の特権"
      - "対象のmsDS-KeyCredentialLink属性への書き込み権限(GenericWriteなど)"
      - "物理的なサーバールームへの入室権限"
      - "対象の生体認証データへのアクセス権限"
    answerIndex: 1
    explanation: "この攻撃が成立するために必要なのは、ドメイン管理者の特権ではなく、対象のmsDS-KeyCredentialLink属性への書き込み権限(GenericWrite・GenericAllなど)です。"

  - question: "シャドウクレデンシャル攻撃が成立するための、環境面での前提条件として正しいのはどれか。"
    choices:
      - "対象のアカウントが、無効化されている必要がある"
      - "ドメインコントローラーが、PKINIT用のサーバー認証証明書を持っている必要があり、多くの環境ではAD CSがこれを発行している"
      - "ネットワークが、インターネットから完全に遮断されている必要がある"
      - "対象のコンピューターが、物理的に存在しない必要がある"
    answerIndex: 1
    explanation: "この攻撃が成立するには、ドメインコントローラーがPKINITによるKerberos認証を許可するためのサーバー認証証明書を持っている必要があり、多くの環境ではこの証明書はAD CSによって発行されています。"

  - question: "シャドウクレデンシャル攻撃が「静かな」攻撃だと言われる理由として正しいのはどれか。"
    choices:
      - "攻撃の実行に、物理的に無音のキーボードが必要だから"
      - "多くの組織では、msDS-KeyCredentialLink属性への変更が監視対象に含まれていないから"
      - "この攻撃は、夜間にしか実行できないから"
      - "この攻撃は、ネットワーク通信を一切発生させないから"
    answerIndex: 1
    explanation: "多くの組織では、msDS-KeyCredentialLink属性への変更をそもそも監視対象に含めていないため、DCSyncやKerberoastingのような、よく知られた攻撃手法と比べて、見過ごされやすい特徴があります。"

  - question: "RBCDとシャドウクレデンシャル攻撃が、根底で共有している前提条件として正しいのはどれか。"
    choices:
      - "両者とも、ドメイン管理者の特権が絶対に必要である"
      - "対象オブジェクトへの書き込み権限という、同じ前提条件を悪用している"
      - "両者とも、物理的なサーバーへのアクセスが必要である"
      - "両者には、共通する前提条件は一切存在しない"
    answerIndex: 1
    explanation: "RBCDとシャドウクレデンシャル攻撃は、具体的な手順は異なりますが、根底にある「対象オブジェクトへの書き込み権限」という、同じ1つの前提条件を悪用しています。"
