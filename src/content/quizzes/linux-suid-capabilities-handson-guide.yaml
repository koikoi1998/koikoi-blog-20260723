questions:
  - question: "SUIDビットが立ったバイナリが、実行時にどの権限で動作するかについて正しいのはどれか。"
    choices:
      - "実行したユーザー自身の権限で動作する"
      - "そのファイルの所有者(多くの場合root)の権限で動作する"
      - "常に、最も権限が低いユーザーの権限で動作する"
      - "ネットワーク上の別のサーバーの権限で動作する"
    answerIndex: 1
    explanation: "SUIDビットが立ったバイナリは、実行したユーザーの権限ではなく、ファイルの所有者の権限で動作します。"

  - question: "このハンズオンで、findコマンドにSUIDビットを立てた結果として正しいのはどれか。"
    choices:
      - "findコマンドの検索速度が向上した"
      - "一般ユーザーが、findの-execオプション経由で、root権限のシェルを取得できた"
      - "findコマンドが使用できなくなった"
      - "ディスクの空き容量が増加した"
    answerIndex: 1
    explanation: "findの-execオプションで任意のコマンドを実行できる機能を悪用し、一般ユーザーがroot権限のシェルを取得できました。"

  - question: "SUIDビットが、一般的な権限設定よりも危険視される理由として正しいのはどれか。"
    choices:
      - "SUIDビットは、常にファイルサイズを増加させるため"
      - "バイナリがシェルや任意のコマンドを実行できる機能を持っていると、その機能経由でもroot権限が使えてしまうため"
      - "SUIDビットは、ネットワーク通信を暗号化しないため"
      - "SUIDビットは、ファイルの読み取りを常に禁止するため"
    answerIndex: 1
    explanation: "SUIDは、バイナリ全体にroot権限を与えるため、意図しない機能(シェルの起動など)経由でも権限を奪取されてしまいます。"

  - question: "Linux Capabilitiesが実現していることとして正しいのはどれか。"
    choices:
      - "root権限全体を、そのまま一般ユーザーに付与する"
      - "root権限を意味のある単位に分割し、本当に必要な権限だけを個別に付与する"
      - "すべてのバイナリから、実行権限を取り除く"
      - "ネットワーク通信を、自動的に暗号化する"
    answerIndex: 1
    explanation: "Capabilitiesは、cap_net_bind_serviceのような具体的な単位で、必要最小限の権限だけを付与する仕組みです。"

  - question: "このハンズオンから得られる、権限設計における重要な視点として正しいのはどれか。"
    choices:
      - "root権限が必要な処理には、常にSUIDを使うべきである"
      - "「root権限が必要」という理由だけでSUIDを選ぶのではなく、本当に必要な権限を具体的に見極めるべきである"
      - "権限設計は、セキュリティ専門家だけが考慮すべき事項である"
      - "Capabilitiesは、SUIDよりも常に設定が複雑であるため避けるべきである"
    answerIndex: 1
    explanation: "「全か無かの権限ではなく、必要な分だけを切り出して渡す」という考え方が、権限設計全般に通底する重要な視点です。"
