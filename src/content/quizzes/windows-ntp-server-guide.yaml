questions:
  - question: "NTPのStratum(階層)とAD DSの時刻同期構造の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Stratumという概念はAD DSには一切存在しない、無関係な用語である"
      - "Stratumという番号は時刻源としての信頼度・階層構造を表し、AD DSにおけるPDCエミュレータを頂点とする時刻同期の階層構造と対応している"
      - "Stratumは、そのサーバーが接続されているネットワークの速度を表す数値である"
      - "Stratumの値は、DCの物理的な設置場所(国・地域)によって自動的に決定される"
    answerIndex: 1
    explanation: "Stratum(階層)は時刻源としての信頼度・階層構造を番号で表す仕組みで、Stratum 0(基準時刻源そのもの)からStratum 1、2と続きます。ADドメイン内では、この階層がPDCエミュレータを頂点とする時刻同期の階層構造と対応しています。"

  - question: "フォレストルートのPDCエミュレータだけが外部の時刻源への明示的な同期設定を必要とする理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "フォレストルートのPDCエミュレータは、ドメインの階層をどこまで遡っても、これ以上頼れる上位のDCが存在しないため"
      - "フォレストルートのPDCエミュレータは、他のDCよりCPU性能が低いため外部同期が必須になっているため"
      - "フォレストルートのPDCエミュレータは、法律上必ず外部の時刻源に同期しなければならないと規定されているため"
      - "フォレストルートのPDCエミュレータ以外のDCは、時刻同期機能自体を持たないため"
    answerIndex: 0
    explanation: "フォレストルートドメイン以外のすべてのマシンは既定のNT5DS方式(AD DSの階層構造に従って上位DCを自動的に頼る)で機能しますが、フォレストルートのPDCエミュレータ自身は、ドメインの階層をどこまで遡っても頼れる上位のDCが存在しないため、外部の権威ある時刻源への明示的な同期設定が必要になります。"

  - question: "AnnounceFlagsの既定値(0x0A)が制御している動作について、記事の説明に最も合致するものはどれか。"
    choices:
      - "そのマシンが常に無条件で時刻サーバー・信頼できる時刻源として振る舞う"
      - "そのマシンがフォレストルートのPDCエミュレータであれば自動的に時刻サーバー・信頼できる時刻源として振る舞い、そうでなければ振る舞わないという条件付きの動作であり、FSMO転送後も新しいPDCエミュレータが自動的にこの役割を引き継ぐ"
      - "そのマシンが常にどのような場合でも時刻サーバーとしての機能を一切持たない"
      - "AnnounceFlagsの既定値は、Windows Serverのライセンス認証状態によって動的に変化する"
    answerIndex: 1
    explanation: "既定値0x0A(0x02+0x08)は、そのマシンがフォレストルートのPDCエミュレータであれば自動的に時刻サーバー・信頼できる時刻源として振る舞い、そうでなければ振る舞わないという条件付きの動作です。この既定値のおかげで、FSMO転送によってPDCエミュレータの役割が移動しても、新しいPDCエミュレータが自動的にこの役割を引き継ぎます。"

  - question: "AnnounceFlagsを0に設定した場合の影響について、記事の説明に最も合致するものはどれか。"
    choices:
      - "そのマシンのセキュリティが向上し、外部からの攻撃を一切受けなくなる"
      - "そのマシンはクライアントに対して自分が時刻源として利用可能であるという広告を一切行わなくなり、時刻同期の階層構造そのものを機能不全にする"
      - "そのマシンの時刻同期の精度が、かえって向上する"
      - "AnnounceFlagsを0に設定しても、実際には何の変化も起きない"
    answerIndex: 1
    explanation: "AnnounceFlagsを0に設定すると、そのマシンはクライアントに対して「自分は時刻源として利用可能である」という広告を一切行わなくなります。これは時刻同期の階層構造そのものを機能不全にする設定変更であり、通常は行うべきではありません。"

  - question: "時刻同期の精度がKerberos認証に与える影響について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Kerberos認証は時刻の精度と一切関係がなく、時刻がどれだけずれても認証には影響しない"
      - "Kerberos認証は、クライアントとDCの時刻のずれが既定の許容範囲(既定5分)を超えると認証自体が失敗するため、時刻同期の精度はドメイン全体の認証の安定性に直結する"
      - "Kerberos認証は、時刻が正確であるほど逆に認証が失敗しやすくなる"
      - "時刻同期の精度は、Kerberos認証ではなくNTLM認証にのみ影響する"
    answerIndex: 1
    explanation: "Kerberos認証は、クライアントとDCの時刻のずれが既定の許容範囲(既定5分)を超えると認証自体が失敗するという、時刻精度に極めて厳しい性質を持っています。時刻同期の階層構造の頂点にあるPDCエミュレータの精度が損なわれると、その影響はドメイン全体に波及します。"
