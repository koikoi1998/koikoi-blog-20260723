questions:
  - question: "EDNS0の本来の役割として正しいのはどれか。"
    choices:
      - "DNSの問い合わせを暗号化する"
      - "UDPでの応答サイズの上限(約512バイト)を、クライアントの宣言によって実質的に引き上げる"
      - "DNSサーバーのIPアドレスを隠す"
      - "ゾーン転送の速度を向上させる"
    answerIndex: 1
    explanation: "EDNS0は、クライアント側が「自分はもっと大きな応答を受け取れる」ということをサーバーへ伝え、従来のDNSが抱えていた512バイトという上限を、実質的に引き上げるための拡張仕様です。"

  - question: "EDNS0がDNSSECにとって必須の土台になっている理由として正しいのはどれか。"
    choices:
      - "DNSSECの署名(RRSIG)やDNSKEYレコードは、512バイトの制約を容易に超えるサイズを持つから"
      - "DNSSECは、EDNS0がなければ暗号化アルゴリズムを選択できないから"
      - "EDNS0は、DNSSECの署名を自動的に生成する機能を持つから"
      - "EDNS0とDNSSECは、技術的に完全に無関係である"
    answerIndex: 0
    explanation: "DNSSECの署名(RRSIG)やDNSKEYレコードは、従来の512バイトの制約を容易に超えるため、EDNS0によってより大きなバッファサイズを宣言できるようになったことが、DNSSECを実用的に運用するための前提条件になっています。"

  - question: "EDNS0が、DNS増幅攻撃に与える影響として正しいのはどれか。"
    choices:
      - "EDNS0は、増幅攻撃を完全に無効化する"
      - "サーバーがより大きな応答を返せるようになった結果、同じ手法での増幅率が大幅に引き上げられる"
      - "EDNS0は、増幅攻撃とは一切関係がない"
      - "EDNS0によって、送信元IPアドレスの詐称自体が不可能になる"
    answerIndex: 1
    explanation: "EDNS0登場以前は応答サイズが制限され増幅率は8倍程度でしたが、EDNS0によってサーバーがより大きな応答を返せるようになった結果、同じ手法での増幅率が大幅に引き上げられてしまいました。"

  - question: "EDNS0のバッファサイズを小さく宣言する緩和策の限界として正しいのはどれか。"
    choices:
      - "この対策だけで、増幅攻撃を完全に防止できる"
      - "送信元IPアドレスの詐称自体は防げないため、この対策だけでは不十分である"
      - "この対策は、DNSSECの運用を完全に不可能にする"
      - "この対策には、技術的な限界が一切存在しない"
    answerIndex: 1
    explanation: "EDNS0のバッファサイズを小さく宣言しても、送信元IPアドレスを詐称するクエリ自体を止めることはできないため、この対策だけでは不十分です。根本的な対策にはBCP 38のような送信元詐称対策が必要です。"

  - question: "DNS増幅攻撃への根本的な対策として、正しいものはどれか。"
    choices:
      - "EDNS0のバッファサイズ制限だけで十分である"
      - "BCP 38(Ingress Filtering)のような、送信元IPアドレスの詐称自体を防ぐ仕組みのインターネット全体での普及"
      - "DNSSECを完全に無効化すること"
      - "すべての権威DNSサーバーを停止すること"
    answerIndex: 1
    explanation: "DNS増幅攻撃への根本的な対策は、送信元IPアドレスの詐称自体を防ぐBCP 38(Ingress Filtering)のような仕組みが、インターネット全体で普及することです。"
