questions:
  - question: "重み付けラウンドロビンが、カナリアデプロイに転用される際の使い方として正しいのはどれか。"
    choices:
      - "すべてのサーバーの重みを常に同じ値に固定する"
      - "新バージョンへの重みを段階的に増やし(例: 5%→25%→50%→100%)、各段階でエラー率やレイテンシを監視する"
      - "重み付けの仕組みを完全に無効化する"
      - "旧バージョンのサーバーをすべて即座に停止する"
    answerIndex: 1
    explanation: "カナリアデプロイでは、新バージョンへの重みを5%→25%→50%→100%のように段階的に増やし、各段階でエラー率やレイテンシを監視しながら、問題がなければ次の段階へ進みます。"

  - question: "ブルーグリーンデプロイとカナリアデプロイの違いとして正しいのはどれか。"
    choices:
      - "両者は完全に同じ手法である"
      - "ブルーグリーンデプロイは2つの独立した環境間の瞬時の全面切り替え、カナリアデプロイは1つの環境を共有した段階的な重みの変更である"
      - "ブルーグリーンデプロイには、ロードバランサーが一切不要である"
      - "カナリアデプロイは、常にインフラコストを2倍にする"
    answerIndex: 1
    explanation: "ブルーグリーンデプロイは、新旧2つの完全に独立した環境を用意し全トラフィックを一瞬で切り替える手法、カナリアデプロイは1つの環境を共有しながら重みの比率だけを段階的に変えていく手法です。"

  - question: "スティッキーセッションが、カナリアデプロイに与える影響として正しいのはどれか。"
    choices:
      - "スティッキーセッションは、カナリアデプロイの精度を必ず向上させる"
      - "すでに旧バージョンへ固定されたクライアントは、重みの比率を変更しても旧バージョンへの接続を継続するため、観測される比率が歪むことがある"
      - "スティッキーセッションは、カナリアデプロイとは無関係の、別のレイヤーの機能である"
      - "スティッキーセッションを有効にすると、新バージョンへの移行が自動的に完了する"
    answerIndex: 1
    explanation: "セッション永続化が有効になっていると、すでに旧バージョンへ固定されているクライアントは、重みの比率を変更しても旧バージョンへの接続を継続してしまい、観測される比率が設定した重みと一致しなくなることがあります。"

  - question: "ブルーグリーンデプロイの、インフラコストに関するトレードオフとして正しいのはどれか。"
    choices:
      - "インフラコストが、実質的にゼロになる"
      - "2つの環境を同時に維持する必要があるため、インフラコストが実質的に倍になる"
      - "インフラコストは、カナリアデプロイよりも常に低い"
      - "インフラコストという概念自体が存在しない"
    answerIndex: 1
    explanation: "ブルーグリーンデプロイは、新旧2つの完全に独立した環境を同時に維持する必要があるため、インフラコストが実質的に倍になるというトレードオフがあります。"

  - question: "実務でのカナリアデプロイに、推奨されている組み合わせとして正しいのはどれか。"
    choices:
      - "人間による24時間の目視監視だけに頼る"
      - "各段階でのメトリクス監視と、基準を超えた場合に重みを自動的に0%へ戻す自動ロールバックの仕組み"
      - "監視を一切行わず、常に100%まで一気に昇格させる"
      - "ロードバランサー自体を使わない"
    answerIndex: 1
    explanation: "実務でのカナリアデプロイは、各段階でのメトリクス監視と、あらかじめ定めた基準を超えた場合に重みを自動的に0%へ戻す自動ロールバックの仕組みを組み合わせることが推奨されています。"
