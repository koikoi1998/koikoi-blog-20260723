questions:
  - question: "ALBが、最低2つの異なるアベイラビリティーゾーン(AZ)を必須とする理由として正しいのはどれか。"
    choices:
      - "AWSの課金方式の都合によるものである"
      - "ALB自身が複数のAZにまたがる分散リソースであり、高可用性を設計レベルで保証するため"
      - "EC2インスタンスの台数を増やすための仕様である"
      - "セキュリティグループの設定を簡略化するための仕様である"
    answerIndex: 1
    explanation: "ALBは、1つのAZが障害になってもサービスを継続できるよう、高可用性を設計レベルで保証するために、最低2つの異なるAZにあるサブネットを必須としています。"

  - question: "ALBを経由する構成において、EC2インスタンス用のセキュリティグループの、適切なインバウンドルールとして正しいのはどれか。"
    choices:
      - "0.0.0.0/0から80番ポートを許可する"
      - "ALB用セキュリティグループからの通信のみ、80番ポートを許可する"
      - "インバウンドルールは一切設定しない"
      - "すべてのポートを0.0.0.0/0から許可する"
    answerIndex: 1
    explanation: "ALBを経由する構成では、EC2インスタンスは、ALB用セキュリティグループからの通信のみを許可し、直接のインターネットアクセスを遮断すべきです。"

  - question: "ALB作成時に「At least two subnets in two different Availability Zones must be specified」というエラーが出た場合、確認すべきこととして正しいのはどれか。"
    choices:
      - "EC2インスタンスの台数を増やす"
      - "選択しているサブネットが、実際に2つの異なるAZに属しているかを確認する"
      - "セキュリティグループを削除する"
      - "VPCそのものを削除して再作成する"
    answerIndex: 1
    explanation: "このエラーは、選択したサブネットが2つの異なるAZに属していない場合に表示されるため、サブネットの所属AZを確認する必要があります。"

  - question: "ALBの「登録解除の遅延(Deregistration Delay)」の正体として正しいのはどれか。"
    choices:
      - "ALBの起動自体を遅延させる機能"
      - "ターゲット登録解除時に、既存の接続への応答だけを設定秒数の間継続させる、コネクションドレインの具体的な実装"
      - "ヘルスチェックの間隔を変更する機能"
      - "DNSの伝播を早める機能"
    answerIndex: 1
    explanation: "登録解除の遅延は、ターゲットを登録解除する際、既存の接続への応答だけを設定した秒数の間継続させる設定であり、コネクションドレインという設計思想のAWSにおける具体的な実装です。"

  - question: "ターゲットグループのヘルスチェックが、ずっとunhealthyのままになる場合、まず確認すべきこととして正しいのはどれか。"
    choices:
      - "EC2インスタンスのOSを再インストールする"
      - "EC2用セキュリティグループが、ALB用セキュリティグループからのヘルスチェック通信を許可しているかを確認する"
      - "ALBのDNS名を変更する"
      - "VPCのCIDRブロックを変更する"
    answerIndex: 1
    explanation: "ヘルスチェックがunhealthyのままになる典型的な原因は、EC2用セキュリティグループが、ALB用セキュリティグループからのヘルスチェック通信を許可していないことです。"
