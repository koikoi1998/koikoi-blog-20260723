questions:
  - question: "コネクションプーリングが解決する問題として正しいのはどれか。"
    choices:
      - "クライアント側のブラウザのキャッシュ容量不足"
      - "個々のクライアントのリクエストごとに新しいTCP接続を開くことで発生する、ハンドシェイクのオーバーヘッド"
      - "ディスクの空き容量不足"
      - "DNSの名前解決の遅延"
    answerIndex: 1
    explanation: "ロードバランサーが個々のクライアントのリクエストごとに、バックエンドへ新しいTCP接続を開いていたら、そのたびにTCPハンドシェイクのオーバーヘッドが発生します。コネクションプーリングは、持続的な接続を再利用することで、このオーバーヘッドを削減します。"

  - question: "Nginxで、バックエンドとの接続を再利用するために必要な設定として正しいのはどれか。"
    choices:
      - "upstreamブロックにkeepaliveを設定するだけで十分である"
      - "keepaliveの設定に加え、proxy_http_version 1.1の設定とConnectionヘッダーのクリアが必要である"
      - "SSL証明書を無効化する必要がある"
      - "何も設定しなくても、既定で自動的に再利用される"
    answerIndex: 1
    explanation: "Nginxは既定でバックエンドとHTTP/1.0で通信するため、keepaliveの設定だけでは不十分で、proxy_http_version 1.1の設定と、クライアントから転送されたConnectionヘッダーを明示的にクリアすることが、追加で必要です。"

  - question: "Nginxのkeepalive設定の数値が意味するものとして正しいのはどれか。"
    choices:
      - "ロードバランサー全体での、バックエンドへの接続数の絶対的な上限"
      - "ワーカープロセスごとの上限であり、複数のワーカープロセスがあれば合計の接続数はそれより多くなる"
      - "クライアント側で許可される、最大の同時接続数"
      - "DNSのTTL値"
    answerIndex: 1
    explanation: "keepaliveで指定する数値は、ワーカープロセスごとの上限であるため、複数のワーカープロセスを持つ構成では、想定より多くの接続がバックエンドに対して保持されることになります。"

  - question: "コネクションプーリングが、HTTPリクエストスマグリングの前提条件になる理由として正しいのはどれか。"
    choices:
      - "コネクションプーリングと、HTTPリクエストスマグリングは、完全に無関係である"
      - "持続的な接続が複数のクライアントのリクエストにわたって再利用されるからこそ、1つのリクエストが別の無関係なクライアントへ影響を与えてしまう"
      - "コネクションプーリングを有効にすると、暗号化が完全に無効化されるから"
      - "コネクションプーリングは、常にリクエストスマグリングを自動的に防止するから"
    answerIndex: 1
    explanation: "HTTPリクエストスマグリングという攻撃が、別の無関係なクライアントのリクエストに影響を与えてしまうのは、まさに、持続的な接続が複数のクライアントのリクエストにわたって再利用されているからです。"

  - question: "接続が実際に再利用されているかどうかを確認するための、正しい診断手がかりはどれか。"
    choices:
      - "$upstream_connect_timeがゼロであれば再利用、ゼロでなければ新しいハンドシェイクが発生したことを意味する"
      - "サーバーのCPU使用率を確認すればよい"
      - "ディスクの空き容量を確認すればよい"
      - "この値は、技術的に確認する方法が存在しない"
    answerIndex: 1
    explanation: "$upstream_connect_timeという変数の値がゼロであれば、既存の接続が再利用されたことを意味し、ゼロでない値であれば、新しいハンドシェイクが発生したことを意味します。"
