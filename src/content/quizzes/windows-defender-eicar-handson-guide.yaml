questions:
  - question: "この記事が、本物のマルウェアを自作する代わりにEICARテストファイルを使う理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "EICARの方が本物のマルウェアより検知が難しく、より高度なテストになるため"
      - "本物のマルウェアの作成・実行には意図しない感染拡大や法的な問題などのリスクが伴うため、業界標準の安全な代替手段としてEICARを使う"
      - "EICARは実在するマルウェアの一種を無害化したものであり、本物のマルウェアと同じコードを含んでいるため"
      - "Windows Defenderは、EICAR以外のファイル形式を一切検知できないため"
    answerIndex: 1
    explanation: "実際に動作する既知のマルウェアを自分で作成・入手して実行することには、意図しない感染拡大・データ破壊・法的な問題などのリスクが伴います。そこでセキュリティ業界で数十年使われてきた標準的な代替手段であるEICARテストファイルを使います。"

  - question: "EICARテストファイルの実体について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ウイルスのコードを無害化した、実在するマルウェアの亜種である"
      - "特定の68バイトの文字列を含むだけの、ウイルスのコードや不正な処理を一切含まない無害なテキストファイルである"
      - "実行すると自己増殖するが、データ破壊機能だけを取り除いたプログラムである"
      - "Microsoft社が独自に開発した、Defender専用の検知テストプログラムである"
    answerIndex: 1
    explanation: "EICARテストファイルは、欧州のセキュリティ研究機関によって策定された、特定の68バイトの文字列を含むだけの無害なテキストファイルです。ウイルスのコードや不正な処理は一切含まれていません。"

  - question: "リアルタイム保護とオンデマンドスキャンによるEICARの検知タイミングの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "リアルタイム保護とオンデマンドスキャンは、常に同時にしか動作しない"
      - "リアルタイム保護はファイルの書き込み時に即座に、オンデマンドスキャンは明示的に実行したタイミングで、それぞれ独立してEICARを検知する"
      - "オンデマンドスキャンは、リアルタイム保護が有効な環境では絶対に実行できない"
      - "リアルタイム保護はEICARを検知できず、オンデマンドスキャンだけが検知できる"
    answerIndex: 1
    explanation: "リアルタイム保護はファイルの書き込み(I/O)をフックしてその場でスキャンするため、保存しようとした瞬間に反応します。オンデマンドスキャンは、除外設定などでリアルタイム保護から見えない状態でも、明示的に実行すればその時点で検査され検知します。"

  - question: "EICARテストファイルで確認できることの範囲について、記事の説明に最も合致するものはどれか。"
    choices:
      - "EICARで検知できれば、そのPCはあらゆる高度な脅威に対しても安全であることが証明される"
      - "EICARが確認できるのは、シグネチャベース検知という最も基本的な仕組みが機能しているかどうかであり、クラウド保護や振る舞い検知といったより高度な防御層の実効性までは確認できない"
      - "EICARは、Defenderのクラウド保護(MAPS)の性能を正確に測定するための専用テストである"
      - "EICARで検知されなければ、Defender自体がインストールされていないことを意味する"
    answerIndex: 1
    explanation: "EICARテストファイルで確認できるのは、あくまで「シグネチャベース検知という、最も基本的な仕組みが正しく機能しているか」という一点です。クラウド保護や振る舞い検知、ASRといったより高度な防御層の実効性までは、このテストでは確認できません。"

  - question: "検証用に追加したリアルタイム保護の除外設定の扱いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "除外設定は、検証が終わればDefenderが自動的に元に戻してくれる"
      - "除外設定は手動で追加した設定であり自動的には解除されないため、検証後に必ず明示的に削除する必要がある"
      - "除外設定は、一度追加すると二度と削除できない"
      - "除外設定を追加すると、Windows全体のセキュリティ機能がすべて無効化される"
    answerIndex: 1
    explanation: "除外設定は手動で追加した設定であり、自動的には解除されません。除外設定を残したままにするとそのフォルダーが実質的にDefenderの保護対象外になってしまうため、検証後に必ず明示的に削除する必要があります。"
