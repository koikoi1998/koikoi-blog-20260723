questions:
  - question: "ドメインアカウントでの初回ログインに社内ネットワーク接続が必要な理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "初回ログイン時にだけ、Windows Updateを強制的に実行する必要があるため"
      - "認証情報の検証にDCへの問い合わせが必須であり、かつそのPC上にまだそのユーザーのローカルプロファイルが存在しないため新規作成が必要だから"
      - "初回ログイン時だけ、ライセンス認証サーバーへの接続が必要だから"
      - "初回ログイン時は、必ずBIOS/UEFIの設定を更新する必要があるため"
    answerIndex: 1
    explanation: "初回ログインでは、ユーザー名・パスワードが正しいかを判定できる情報をクライアントPCが一切持っていないためDCへの問い合わせが必須であり、加えてそのユーザー専用のローカルプロファイルがまだ存在しないため新規作成が発生します。"

  - question: "キャッシュされた資格情報(Cached Credentials)でできることについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "ネットワーク上のファイルサーバーなど他のリソースへのアクセスも含め、通常のログオンと全く同じことができる"
      - "そのPC自身へのローカルログオンの可否を判定できるだけで、ネットワークリソースへのアクセスに必要なKerberosチケットは取得できない"
      - "ユーザーのパスワードそのものを平文で保存しており、いつでも復元できる"
      - "他のPCへのログオンにもそのまま使い回すことができる"
    answerIndex: 1
    explanation: "キャッシュされた資格情報はパスワードそのものを保存しているわけではなく、そのPCへのローカルログオンの可否を判定するためだけに使われます。ネットワークリソースへのアクセスに必要な正規のKerberosチケットは、DCへ到達できなければ取得できません。"

  - question: "既定のWindowsドメインログオンにおけるローカルユーザープロファイルの性質について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ユーザーがどのPCにログインしても、常に同じ内容が自動的に引き継がれる"
      - "プロファイルはそのPCのローカルディスク上に作成されるため、別のPCにログインすると全く新しい空のプロファイルが作成される"
      - "プロファイルは常にADサーバー上にのみ保存され、PC上には一切保存されない"
      - "プロファイルは一度作成されると、削除する方法が存在しない"
    answerIndex: 1
    explanation: "ローカルユーザープロファイルはそのPCのローカルディスク上に作成されるため、既定では同じユーザーが別のPCにログインしても、そのPC上にはまだプロファイルが存在せず、まったく新しい空のプロファイルが新規に作成されます。"

  - question: "ローミングプロファイルの仕組みと実務上の課題について、記事の説明に最も合致するものはどれか。"
    choices:
      - "プロファイルはログオン時にネットワーク共有からダウンロードされ、ログオフ時にアップロードされる仕組みであり、複数PCへの同時ログオンでは後からログオフした側の内容で上書きされる問題が起こりえる"
      - "ローミングプロファイルはプロファイルサイズに関わらず常に一定の速度でログオンできる"
      - "ローミングプロファイルは複数PCへの同時ログオンを想定して設計されており、矛盾なく自動的にマージされる"
      - "ローミングプロファイルは仮想ディスクファイル(VHD/VHDX)としてネットワーク越しに直接マウントされる"
    answerIndex: 0
    explanation: "ローミングプロファイルはログオン時にネットワーク共有からのダウンロード、ログオフ時のアップロードという単純な仕組みであり、複数PCへの同時ログオンでは後からログオフした側の内容で上書きされる「後勝ち」の問題が起こりえます。また、プロファイルサイズが大きくなるとログオン・ログオフの速度が悪化します。VHD/VHDXとして直接マウントするのはFSLogixの方式です。"

  - question: "FSLogix(プロファイルコンテナ)がローミングプロファイルと異なる点について、記事の説明に最も合致するものはどれか。"
    choices:
      - "FSLogixはプロファイルを1つずつファイル単位でコピーする方式であり、ローミングプロファイルより低速である"
      - "FSLogixはユーザーごとのプロファイル全体を1つの仮想ディスクファイルとしてネットワーク越しに直接マウントするため、プロファイルサイズが大きくてもログオン時間がほぼ一定に保たれる"
      - "FSLogixは永続型VDIでのみ利用可能な機能であり、非永続型VDIでは利用できない"
      - "FSLogixはローミングプロファイルの後継ではなく、全く無関係の別の暗号化技術である"
    answerIndex: 1
    explanation: "FSLogixはユーザーごとのプロファイル全体を1つの仮想ディスクファイル(VHD/VHDX)としてネットワーク共有上に保持し、ログオン時にそのままマウントする方式です。ファイルを1つずつコピーするローミングプロファイルと異なり、プロファイルサイズが大きくてもログオン時間がほぼ一定に保たれ、VDI環境のログオンストーム対策として広く採用されています。"

  - question: "永続型VDIと非永続型VDIにおけるプロファイル管理の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "永続型VDIでは通常の物理PCと同様にプロファイルが専用の仮想マシンのローカルディスクにそのまま存在し続けるが、非永続型VDIではセッションごとに仮想マシンが破棄されるため、プロファイルを外部で管理する仕組みが必要になる"
      - "永続型VDIも非永続型VDIも、常にFSLogixによるプロファイル管理が必須である"
      - "非永続型VDIでは、ユーザーごとに専用の仮想マシンが常に割り当てられ続ける"
      - "永続型VDIと非永続型VDIの違いは、画面解像度の設定方法だけである"
    answerIndex: 0
    explanation: "永続型VDIではユーザーごとに専用の仮想マシンが割り当てられ、プロファイルはそのローカルディスクにそのまま維持されます。非永続型VDIでは共通のマスターイメージから都度仮想マシンが生成され、セッション終了後に破棄されるため、プロファイルを仮想マシンの外部(ネットワーク上)で管理する仕組み(ローミングプロファイルやFSLogix)が必要になります。"
