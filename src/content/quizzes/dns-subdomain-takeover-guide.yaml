questions:
  - question: "サブドメインテイクオーバーが成立する直接の原因として正しいのはどれか。"
    choices:
      - "DNSサーバー自体への不正アクセスが成功したこと"
      - "クラウドリソースが削除された後、それを指し示すCNAMEレコードの削除を忘れ、ダングリング状態のまま残っていたこと"
      - "ドメインの有効期限が切れたこと"
      - "SSL証明書が期限切れになったこと"
    answerIndex: 1
    explanation: "クラウドリソースを削除した際に、それを指し示すCNAMEレコードを削除し忘れると、そのCNAMEはダングリング状態のまま残り、攻撃者が同じ名前でリソースを再登録することで、サブドメインを乗っ取られてしまいます。"

  - question: "攻撃者が、ダングリング状態のCNAMEを乗っ取る方法として正しいのはどれか。"
    choices:
      - "DNSサーバーの設定ファイルを直接書き換える"
      - "クラウドサービス側で、同じリソース名(バケット名やアプリ名)を自分のアカウントで再登録する"
      - "被害者の会社のドメインレジストラのアカウントに不正ログインする"
      - "SSL証明書の秘密鍵を盗み出す"
    answerIndex: 1
    explanation: "攻撃者は、DNSサーバーへの不正アクセスを一切必要とせず、クラウドサービス側で、まだDNSにCNAMEとして残っている名前と同じリソース名を、自分のアカウントで再登録するだけで、乗っ取りが成立します。"

  - question: "クラウドサービスの名前空間に関する、サブドメインテイクオーバーの前提として正しいのはどれか。"
    choices:
      - "リソース名は、各ユーザーごとに完全に独立した名前空間で管理されている"
      - "リソース名は、多くの場合、全ユーザー共有の1つの名前空間で管理されており、削除された名前は再び誰でも登録できる状態に戻る"
      - "リソース名は、一度登録すると、誰も再登録できない"
      - "リソース名には、文字数の上限が設定されていない"
    answerIndex: 1
    explanation: "S3やHeroku、Azure App Serviceのようなクラウドサービスは、多くの場合、リソース名を全ユーザー共有の名前空間で管理しており、削除された名前は再び誰でも登録できる状態に戻ります。"

  - question: "乗っ取られたサブドメインに関する記述として正しいのはどれか。"
    choices:
      - "乗っ取られたサブドメインは、見た目が明らかに怪しくなるため、利用者はすぐに気づく"
      - "乗っ取られたサブドメインは、正規ドメインの一部として表示されるため、利用者が見た目だけで異常に気づくことは一般的に困難である"
      - "乗っ取られたサブドメインは、自動的にブラウザからブロックされる"
      - "乗っ取られたサブドメインは、DNSから完全に削除される"
    answerIndex: 1
    explanation: "乗っ取られたサブドメインは、あなたの会社が正規に保有するドメインの一部として扱われるため、利用者が見た目だけで異常に気づくことは、一般的に困難です。"

  - question: "サブドメインテイクオーバーを予防するための基本的な対策として正しいのはどれか。"
    choices:
      - "クラウドリソースを削除した後、しばらく時間を置いてからDNSレコードを削除する"
      - "クラウドリソースを削除する前に、それを指し示すDNSレコードを先に、または同時に削除する"
      - "すべてのサブドメインに、常に同じCNAMEを設定する"
      - "DNSレコードは、一度設定したら絶対に変更しない"
    answerIndex: 1
    explanation: "予防の基本は、クラウドリソースを削除する前に、それを指し示すDNSレコードを先に、または同時に削除することです。これにより、ダングリング状態になる時間的な窓を作らずに済みます。"
