questions:
  - question: "MAINT状態とDRAIN状態の違いとして正しいのはどれか。"
    choices:
      - "両者は同じ挙動を表す、別の呼び方に過ぎない"
      - "MAINTは既存の接続も即座に遮断するが、DRAINは既存の接続を自然に終わるまで継続させる"
      - "DRAINは既存の接続を即座に遮断するが、MAINTは自然に終わるまで継続させる"
      - "MAINTもDRAINも、新しい接続は送り続ける"
    answerIndex: 1
    explanation: "MAINTは新しい接続も既存の接続も即座に遮断しますが、DRAINは新しい接続だけを止め、既存の接続は自然に終わるまで継続させます。"

  - question: "バックエンドサーバーを計画的なメンテナンスへ入れる際、設定ファイルを削除してリロードするだけでは不十分な理由として正しいのはどれか。"
    choices:
      - "設定ファイルのリロードには時間がかかりすぎるため"
      - "処理中の、まだ応答を返していないリクエストが、強制的に切断される可能性があるため"
      - "設定ファイルのリロードは、セキュリティ上の脆弱性を生むため"
      - "設定ファイルの削除は、他のサーバーにも影響を与えるため"
    answerIndex: 1
    explanation: "設定ファイルを削除してリロードする方法では、そのサーバーが処理中のリクエストが、問答無用で強制的に切断される可能性があります。"

  - question: "HAProxyでDRAIN状態へ変更する際に使う、正しい方法はどれか。"
    choices:
      - "設定ファイルを書き換えて、プロセスを再起動する"
      - "Runtime API(統計ソケット)経由で、サーバーの状態をdrainに設定する"
      - "サーバーの電源を直接切る"
      - "DNSのTTLを0に設定する"
    answerIndex: 1
    explanation: "HAProxyでは、Runtime API(統計ソケット)経由で`set server backend_name/server_name state drain`を実行することで、DRAIN状態へ変更します。"

  - question: "AWSのELB/ALBにおいて、コネクションドレインに相当する機能の名称として正しいのはどれか。"
    choices:
      - "セキュリティグループ"
      - "登録解除の遅延(Deregistration Delay)"
      - "オートスケーリンググループ"
      - "ヘルスチェックグレースピリオド"
    answerIndex: 1
    explanation: "AWSのELB/ALBでは、コネクションドレインに相当する仕組みを「登録解除の遅延(Deregistration Delay)」と呼びます。"

  - question: "「新規流入の停止」と「既存処理の完了待ち」を分離するという設計思想について、正しい記述はどれか。"
    choices:
      - "この設計思想は、HAProxyにしか存在しない"
      - "この設計思想は、HAProxy・AWS・GCP・Kubernetesなど、実装ごとに名前は異なるものの広く共通している"
      - "この設計思想は、L4ロードバランサーにのみ適用される"
      - "この設計思想は、クラウドサービスでは使われていない"
    answerIndex: 1
    explanation: "「新規流入の停止」と「既存処理の完了待ち」を分離する設計思想は、名前は実装ごとに異なるものの、HAProxy・AWS・GCP・Kubernetesなど広く共通しています。"
