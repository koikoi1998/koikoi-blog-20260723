questions:
  - question: "NTLM認証のチャレンジレスポンスにおいて、実際にネットワーク上を流れるものとして正しいのはどれか。"
    choices:
      - "ユーザーが入力したパスワードそのもの"
      - "パスワードから導出したNTLMハッシュそのもの"
      - "NTLMハッシュを鍵として、サーバーが出したチャレンジに対して計算した応答値"
      - "サーバーの秘密鍵"
    answerIndex: 2
    explanation: "ネットワーク上を流れるのは、NTLMハッシュを鍵として計算した応答値だけであり、パスワードやハッシュそのものは流れません。"

  - question: "検証者が、クライアントからの応答値が正しいかどうかを判断する方法として正しいのはどれか。"
    choices:
      - "応答値を復号して、中身のパスワードを直接確認する"
      - "自分も同じNTLMハッシュを使って同じ計算を行い、結果が一致するかどうかで判断する"
      - "応答値の長さだけを確認する"
      - "クライアントのIPアドレスだけで判断する"
    answerIndex: 1
    explanation: "検証者は、自分が保持しているNTLMハッシュを使って同じ計算を行い、クライアントからの応答値と一致するかどうかで正当性を判断します。"

  - question: "サーバー自身がDCでない場合、NTLM認証の応答値の検証は誰が行うか、正しいのはどれか。"
    choices:
      - "サーバー自身が、ローカルに保持している情報だけで検証する"
      - "クライアント自身が、自己検証する"
      - "パススルー認証によって、Netlogon経由でDCへ検証が委ねられる"
      - "検証は一切行われず、常に許可される"
    answerIndex: 2
    explanation: "サーバー自身がDCでない場合、応答値の検証はパススルー認証によってDCへ委ねられます。"

  - question: "非ドメイン参加端末が、Kerberosではなく NTLMに依存している構造的な理由として正しいのはどれか。"
    choices:
      - "NTLMの方が、常に通信速度が速いため"
      - "非ドメイン参加端末には、Kerberosが前提とするKDCがそもそも存在しないため"
      - "NTLMの方が、暗号強度が常に高いため"
      - "Windowsの設定上、NTLMしか選択できないよう固定されているため"
    answerIndex: 1
    explanation: "Kerberosが成立するにはKDCとの信頼関係が必要ですが、非ドメイン参加端末やワークグループ環境には、そもそも対応するKDCが存在しません。"

  - question: "非ドメイン参加端末からでもKerberosを利用するための、既存の仕組みとして正しいのはどれか。"
    choices:
      - "そのような仕組みは一切存在しない"
      - "KDCプロキシ"
      - "WPAD"
      - "DNSラウンドロビン"
    answerIndex: 1
    explanation: "KDCプロキシは、クライアントの代わりにKDCプロキシサーバーがDCへのやり取りを中継し、HTTPS経由でKerberosチケットを取得できるようにする既存の仕組みです。"
