questions:
  - question: "repadmin /showreplとnet shareがそれぞれ確認している対象の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "両者はまったく同じ内容を確認しており、片方だけ実行すれば十分である"
      - "repadmin /showreplはAD DSのデータそのものの複製状況を、net shareはSYSVOLなどのファイル共有としての提供状況を確認しており、両者は異なるレイヤーの正常性を見ている"
      - "repadmin /showreplはハードウェアの温度を、net shareはCPU使用率を確認するコマンドである"
      - "net shareはAD DSのデータの複製状況を確認する唯一の方法である"
    answerIndex: 1
    explanation: "repadmin /showreplはAD DSのデータそのものがDC間で正しく複製されているかを確認するコマンドであり、net shareはSYSVOLなどが実際にファイル共有として正しく提供されているかを確認するコマンドです。両者は異なるレイヤーの正常性を確認しています。"

  - question: "repadmin /showreplで確認できる5つのパーティションについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "ドメイン・設定・スキーマという3つの基本パーティションに、DomainDnsZones・ForestDnsZonesというDNS特有の2つを加えたものである"
      - "5つのパーティションはすべて、フォレスト内の全DC間で同じ範囲でレプリケーションされる"
      - "5つのパーティションは、DCの台数が増えるたびに新しく追加される"
      - "5つのパーティションはすべて、ドメイン内のDC間だけでレプリケーションされ、フォレスト全体には一切広がらない"
    answerIndex: 0
    explanation: "単一ドメインのフォレストで一般的に表示される5つのパーティションは、ドメイン・設定・スキーマという3つの基本パーティションに、AD統合DNSゾーン特有のDomainDnsZones・ForestDnsZonesという2つを加えたものです。それぞれレプリケーション範囲(ドメイン内かフォレスト全体か)が異なります。"

  - question: "repadmin /showreplの出力で「successful(成功)」と表示されることの意味について、記事の説明に最も合致するものはどれか。"
    choices:
      - "そのパートナーとのレプリケーションが、これまで一度も失敗したことがないことを保証している"
      - "最後に試みたレプリケーションが正常に完了したことだけを意味しており、それ以前に長期間レプリケーションが停止していた可能性までは否定しない"
      - "AD DS全体が完全に正常であることを保証している"
      - "SYSVOLの共有も同時に正常であることを保証している"
    answerIndex: 1
    explanation: "「成功」という表示は、あるパートナーとの間で直近のレプリケーション試行が正常に完了したことだけを意味しています。それ以前に長期間レプリケーションが停止していた可能性までは否定しないため、失敗回数や最終成功時刻もあわせて確認する必要があります。"

  - question: "net shareで表示されるC$・IPC$・ADMIN$と、NETLOGON・SYSVOLの性質の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "5つすべてがAD DS固有の共有であり、DC以外のWindows Serverには存在しない"
      - "C$・IPC$・ADMIN$はAD DSやDC固有のものではなくWindows Server全般で既定で作成される管理共有だが、NETLOGONとSYSVOLはそのサーバーがDCとして正しく機能していることの証となる"
      - "NETLOGONとSYSVOLは、Windows Server全般で既定で作成される管理共有であり、DCであるかどうかとは無関係である"
      - "IPC$は実体のあるファイルフォルダーであり、C$やADMIN$と同様にドライブ全体を共有している"
    answerIndex: 1
    explanation: "C$・IPC$・ADMIN$はAD DSやDC固有のものではなく、通常のWindows Serverであれば既定で必ず作成される管理共有です。一方NETLOGONとSYSVOLは、SYSVOLレプリケーションが正常に完了した場合にのみ作成される共有であり、そのサーバーがDCとして正しく機能していることの証です。"

  - question: "SysvolReadyレジストリ値について、記事の説明に最も合致するものはどれか。"
    choices:
      - "そのDCのIPアドレスが正しく設定されているかどうかを示す値である"
      - "Netlogonサービスが、SYSVOLの複製が完了し共有を開始してよいと判断した時点で1に設定される値であり、net shareでの目視確認より確実にSYSVOLの準備状況を判断できる"
      - "ドメイン内のユーザー数の上限を示す値である"
      - "FSMOの現在の保持者を示す値である"
    answerIndex: 1
    explanation: "SysvolReadyは、Netlogonサービスがサービスがsysvolの複製完了を確認し共有を開始してよいと判断した時点で1に設定されるレジストリ値です。net shareでの目視確認だけでなくこの値を確認することで、共有が一時的に見えていないだけなのか本当に複製が完了していないのかをより確実に切り分けられます。"

  - question: "AD移行で降格させたDCの情報が残っていないことをrepadminで確認する方法について、記事の説明に最も合致するものはどれか。"
    choices:
      - "repadmin /replsummaryやrepadmin /showrepl *の出力に、既に撤去したはずの旧DCの名前がレプリケーションパートナーとして依然として登場する場合、降格処理が完全ではなく古い参照が残っていることを意味する"
      - "repadminでは旧DCの情報の残存を確認することは技術的に不可能である"
      - "旧DCの名前が消えたかどうかは、net shareの出力だけで判断できる"
      - "旧DCの情報は、降格後30日間は必ずrepadminの出力に表示され続ける仕様である"
    answerIndex: 0
    explanation: "repadmin /replsummaryやrepadmin /showrepl *の出力に、既に撤去したはずの旧DCの名前が依然としてレプリケーションパートナーとして登場する場合、その降格処理が完全ではなく、AD DS上に古い参照(メタデータ)が残っていることを意味します。これはAD移行完了の判定基準として扱うべきポイントです。"
