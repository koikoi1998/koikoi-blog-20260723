questions:
  - question: "WSFCにおけるクォーラムの役割として正しいのはどれか。"
    choices:
      - "どちらのノードが技術的に正常かを判断する"
      - "過半数の票を得たノード群だけに、サービス提供を許可する"
      - "ノード間の通信速度を向上させる"
      - "すべてのノードを同時に停止させる"
    answerIndex: 1
    explanation: "クォーラムは、過半数の票を得たノード群だけが、クラスタとして動作を続けることを許可する仕組みです。"

  - question: "2ノードクラスタで、ノード間の通信が切断されたときに起こる問題として正しいのはどれか。"
    choices:
      - "どちらのノードも2票を獲得し、両方が動作を続ける"
      - "1対1で過半数が成立せず、WSFCは安全側に倒れ、両方のノードが機能停止する"
      - "自動的に新しいノードが追加される"
      - "問題は発生せず、通常通り動作を続ける"
    answerIndex: 1
    explanation: "ノードが2台しかない場合、通信が切断されると、どちらも1票しか持たず、1対1では過半数が成立しないため、WSFCは安全側に倒れ、両方のノードが機能停止します。"

  - question: "Witness(目撃者)の役割として正しいのはどれか。"
    choices:
      - "クラスタのリソースそのものを提供する"
      - "クラスタのリソースを提供せず、1票だけを持つ、第三の投票者として機能する"
      - "すべてのノードのデータを複製する"
      - "ネットワークの帯域幅を増やす"
    answerIndex: 1
    explanation: "Witnessは、クラスタのリソースを一切提供しないものの、1票だけを持つ、第三の投票者です。"

  - question: "Dynamic Quorumが対応できない状況として正しいのはどれか。"
    choices:
      - "ノードが1台ずつ、順番に失われていく状況"
      - "サイト全体が一度に失われるような、同時多発的な障害"
      - "ノードが一切故障しない状況"
      - "Witnessが正常に動作している状況"
    answerIndex: 1
    explanation: "Dynamic Quorumは、ノードが1台ずつ順番に失われていく状況には対応できますが、サイト全体が一度に失われるような同時多発的な障害には対応できません。"

  - question: "2ノードクラスタにおける、Microsoftの現在の推奨として正しいのはどれか。"
    choices:
      - "Witnessは不要であり、Dynamic Quorumだけで十分である"
      - "常にWitnessを使用すべきである"
      - "3ノード以上に増設しない限り、クラスタリング自体を行うべきではない"
      - "Witnessは、3ノード以上のクラスタでのみ使用すべきである"
    answerIndex: 1
    explanation: "Microsoftの現在の推奨は、2ノードクラスタには、常にWitnessを使用することです。"
