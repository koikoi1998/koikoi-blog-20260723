questions:
  - question: "動的更新で登録されたAレコードは、その端末が廃棄された後、どうなるか。"
    choices:
      - "自動的にすぐ削除される"
      - "スキャベンジングを設定しない限り、いつまでも残り続ける"
      - "24時間後に自動的に削除される"
      - "DNSサーバーが自動的に静的レコードへ変換する"
    answerIndex: 1
    explanation: "そのPCが自分でDNSサーバーに削除を伝える手段は存在しないため、スキャベンジングを設定しない限り、レコードはいつまでも残り続けます。"

  - question: "ノーリフレッシュ間隔とリフレッシュ間隔の両方を通じて、どのようなレコードがスキャベンジングの対象になるか。"
    choices:
      - "一度でもタイムスタンプが更新されたレコード"
      - "両方の期間を通じて一度もタイムスタンプが更新されなかったレコード"
      - "静的に登録されたすべてのレコード"
      - "作成されてから24時間が経過したすべてのレコード"
    answerIndex: 1
    explanation: "両方の期間(既定で合計14日間)を通じて一度もタイムスタンプが更新されなかったレコードだけが、削除の対象になります。"

  - question: "ゾーンで「エージングを有効化」しただけでは、なぜ実際の削除処理が走らないのか。"
    choices:
      - "ゾーン側の設定だけでは不十分で、サーバー側でスキャベンジングの実行スケジュールを別途設定する必要があるため"
      - "エージングの有効化には、再起動が必要なため"
      - "ゾーン側の設定は表示専用であり、実際には何も変更されないため"
      - "サーバーのライセンス認証が必要なため"
    answerIndex: 1
    explanation: "ゾーン側の「エージングの有効化」と、サーバー側の「スキャベンジングの実行スケジュール」は別々のオン・オフであり、両方を設定する必要があります。"

  - question: "静的に(手動で)登録されたDNSレコードは、スキャベンジングの対象になるか。"
    choices:
      - "対象になる。他のレコードと同様に削除される可能性がある"
      - "既定では対象外。タイムスタンプが存在しないため"
      - "静的レコードという概念自体が存在しない"
      - "対象になるが、削除されるまでの猶予期間が2倍になる"
    answerIndex: 1
    explanation: "静的レコードにはタイムスタンプが存在しないため、既定ではスキャベンジングの対象から除外されます。"

  - question: "スキャベンジングが既定で無効になっている理由は何か。"
    choices:
      - "スキャベンジングという機能自体がまだ実験的なものであるため"
      - "設定を誤ると、まだ現役で使われているレコードまで誤って削除してしまうリスクがあるため"
      - "スキャベンジングには追加のライセンス費用が必要なため"
      - "スキャベンジングはWindows Server 2025で廃止予定の機能であるため"
    answerIndex: 1
    explanation: "設定を誤ると、まだ現役で使われているレコードまで誤って削除してしまうリスクがあるため、スキャベンジングは既定で無効になっています。"
