questions:
  - question: "イレージャーコーディングが、RAID5/6のパリティの発想をどのように一般化したものか、正しいものはどれか。"
    choices:
      - "パリティという考え方そのものを完全に廃止した"
      - "データとパリティの比率を、k個のデータチャンクとm個のパリティチャンクという、任意の比率に一般化した"
      - "パリティディスクの数を、常に1個に固定した"
      - "ディスク故障そのものを、技術的に発生しなくした"
    answerIndex: 1
    explanation: "イレージャーコーディングは、RAID5/6の固定されたパリティ比率を、k個のデータチャンクとm個のパリティチャンクという、任意の比率に一般化したものです。"

  - question: "RAIDとイレージャーコーディングの、配置に関する違いとして正しいのはどれか。"
    choices:
      - "両者は、まったく同じ配置方法を使う"
      - "RAIDは単一のディスクアレイ内で完結するが、イレージャーコーディングは分散クラスタの複数ノードへチャンクを分散配置する"
      - "RAIDは、常にクラウド上にのみ配置される"
      - "イレージャーコーディングは、単一のディスク内にのみ配置される"
    answerIndex: 1
    explanation: "RAIDは単一のディスクアレイの中で完結する仕組みですが、イレージャーコーディングは、分散クラスタの複数ノードへチャンクを分散配置することが一般的です。"

  - question: "イレージャーコーディングが、複製方式より容量効率が良い理由として正しいのはどれか。"
    choices:
      - "同等の耐久性を得るために必要な容量が、複製方式より少なくて済む(例: 3倍ではなく1.4〜1.6倍程度)"
      - "イレージャーコーディングは、データを一切保存しないから"
      - "複製方式は、常にディスクを1台しか使わないから"
      - "イレージャーコーディングは、圧縮を必ず併用するから"
    answerIndex: 1
    explanation: "3重複製は2台分の故障に耐えるために元データの3倍の容量が必要ですが、同等の耐久性を持つイレージャーコーディングの構成であれば、必要な容量は1.4倍から1.6倍程度に収まることが多いです。"

  - question: "イレージャーコーディングの実装で、最も広く使われているアルゴリズムとして正しいのはどれか。"
    choices:
      - "AES暗号化アルゴリズム"
      - "Reed-Solomon符号"
      - "SHA-256ハッシュアルゴリズム"
      - "RSA公開鍵暗号"
    answerIndex: 1
    explanation: "イレージャーコーディングの実装で最も広く使われているのは、Reed-Solomon符号です。Cephのデフォルトのイレージャープラグインも、このアルゴリズムを使用しています。"

  - question: "イレージャーコーディングのトレードオフとして正しいのはどれか。"
    choices:
      - "容量効率が悪く、復旧処理が速い"
      - "容量効率に優れるが、復旧処理が遅くCPU負荷も高い"
      - "容量効率も復旧速度も、常に複製方式より劣る"
      - "トレードオフは一切存在しない"
    answerIndex: 1
    explanation: "イレージャーコーディングは容量効率に優れる一方で、故障からの復旧(リビルド)処理が、より多くの計算を必要とし、遅く、CPU負荷も高くなるというトレードオフがあります。"
