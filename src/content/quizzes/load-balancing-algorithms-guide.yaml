questions:
  - question: "最小接続数(Least Connections)アルゴリズムが、処理時間に差があるワークロードでラウンドロビンより好まれる理由として正しいのはどれか。"
    choices:
      - "常にDNSラウンドロビンより高速に動作するため"
      - "その時点で処理中の接続数という、実際の負荷を動的に見て判断するため"
      - "L4ロードバランサーでしか使用できないため"
      - "ヘルスチェックの機能を内包しているため"
    answerIndex: 1
    explanation: "最小接続数アルゴリズムは、今まさに処理中の負荷を動的に見て判断するため、処理時間に差があるワークロードに向いています。"

  - question: "セッション永続化(スティッキーセッション)が必要になる典型的な理由として正しいのはどれか。"
    choices:
      - "ロードバランサーの処理速度を上げるため"
      - "バックエンドサーバーがセッション情報を自身のメモリに保持している場合に、同じクライアントを同じサーバーに固定する必要があるため"
      - "ヘルスチェックの精度を上げるため"
      - "DNSラウンドロビンの代替として使うため"
    answerIndex: 1
    explanation: "バックエンドがセッション情報をメモリに保持している場合、同じクライアントを同じサーバーへ固定しないとログイン状態などが失われます。"

  - question: "Cookie方式によるセッション永続化がIPハッシュ方式より確実とされる理由として正しいのはどれか。"
    choices:
      - "暗号化された通信にしか対応していないため"
      - "IPアドレスに依存せず、ロードバランサーが発行する専用Cookieを基準にするため"
      - "L4ロードバランサーでのみ使用できるため"
      - "ヘルスチェックと統合されているため"
    answerIndex: 1
    explanation: "Cookie方式は、複数クライアントが同じIPアドレスに見える環境でも偏りが生じず、IPアドレスに依存しないため確実です。"

  - question: "ヘルスチェックのFallスレッショルドを1に設定した場合に起こりうる問題として正しいのはどれか。"
    choices:
      - "ヘルスチェック自体が無効化される"
      - "一時的なネットワークの揺れだけでサーバーが不要に切り離されてしまう"
      - "ラウンドロビンアルゴリズムが自動的に最小接続数に切り替わる"
      - "セッション永続化が強制的に有効になる"
    answerIndex: 1
    explanation: "Fallスレッショルドが小さすぎると、一時的な揺れだけで異常判定されてしまい、不要な切り離しが頻発します。"

  - question: "ヘルスチェックとロードバランシングアルゴリズムの関係について、正しい理解はどれか。"
    choices:
      - "両者は同じ1つの仕組みであり、区別する必要はない"
      - "ヘルスチェックは振り分け候補の集合を決め、アルゴリズムはその集合の中からどのサーバーを選ぶかを決める、別々のレイヤーの仕組みである"
      - "アルゴリズムの設定を変えれば、ヘルスチェックの設定は不要になる"
      - "ヘルスチェックは、L7ロードバランサーでしか使用できない"
    answerIndex: 1
    explanation: "ヘルスチェックとアルゴリズムは別々のレイヤーの仕組みであり、この2つを混同すると、障害調査で誤った箇所を調べてしまいます。"
