questions:
  - question: "IAKerbが解決する課題として正しいのはどれか。"
    choices:
      - "そもそもドメインアカウントではない、ローカルアカウント同士の認証"
      - "クライアントが、DCへ直接到達できない状況でもKerberosを使えるようにすること"
      - "パスワードそのものをネットワーク上で暗号化すること"
      - "DNSの名前解決を高速化すること"
    answerIndex: 1
    explanation: "IAKerbは、クライアントがDCへ直接到達できない場合に、アクセス先のサーバーがKerberosのやり取りを中継する仕組みです。"

  - question: "ローカルKDCが解決する課題として正しいのはどれか。"
    choices:
      - "クライアントが、DCへ直接到達できない状況"
      - "そもそもドメインアカウントではない、ローカルアカウント同士の認証にKerberosを使えるようにすること"
      - "複数のフォレスト間の信頼関係を構築すること"
      - "グループポリシーの適用順序を制御すること"
    answerIndex: 1
    explanation: "ローカルKDCは、各端末自身に、その端末のローカルアカウント専用の小さなKDC機能を持たせることで、ローカルアカウント同士の認証にもKerberosを使えるようにします。"

  - question: "IAKerbとKDCプロキシの違いとして正しいのはどれか。"
    choices:
      - "両者はまったく同じ仕組みであり、違いはない"
      - "KDCプロキシは専用サーバーの構築を前提とするが、IAKerbはOS自身に組み込まれた標準機能として、専用サーバーを必要としない"
      - "IAKerbは、NTLMのみに対応している"
      - "KDCプロキシの方が、新しい仕組みである"
    answerIndex: 1
    explanation: "KDCプロキシは専用サーバーの構築が前提ですが、IAKerbはOSに組み込まれた標準機能として、専用サーバー構築を必要とせずに中継を実現します。"

  - question: "WindowsServer 2025のNTLMに関する、正確な記述として正しいのはどれか。"
    choices:
      - "WindowsServer 2025では、NTLMがデフォルトで無効化されている"
      - "WindowsServer 2025は、NTLMを引き続きデフォルトで有効にしたまま提供しており、デフォルト無効化はさらに次の世代のOSで予定されている"
      - "WindowsServer 2025では、NTLMという仕組み自体が完全に削除されている"
      - "WindowsServer 2025は、Kerberosのみに対応し、NTLMには一切対応していない"
    answerIndex: 1
    explanation: "WindowsServer 2025自体は、NTLMを引き続きデフォルトで有効にしたまま提供しており、NTLMのデフォルト無効化は、さらに次の世代のOSで予定されている変更です。"

  - question: "「AWSのAMI(WindowsServer2025)ではNTLMが無効化されている」という説についての、適切な評価として正しいのはどれか。"
    choices:
      - "Microsoftの公式ドキュメントで明確に裏付けられている、確定した事実である"
      - "現時点では裏付けが確認できない、不正確な情報として扱うべきである"
      - "AWSのすべてのWindowsAMIに共通する、既知の仕様である"
      - "WindowsServer 2016以降のすべてのバージョンに当てはまる、古くからの仕様である"
    answerIndex: 1
    explanation: "Microsoft自身がAMIのデフォルト動作を変更しているという公式な記述は見当たらず、この説は現時点では裏付けのない、不正確な情報として扱うべきです。"
