questions:
  - question: "KMSのカスタマー管理キーに関して、IAMポリシーとキーポリシーの関係として正しいのはどれか。"
    choices:
      - "IAMポリシーが許可していれば、キーポリシーの内容に関わらず常に操作が実行できる"
      - "キーポリシーが、その操作を許可(またはIAMへの判断委任を宣言)していない限り、IAMポリシーの許可だけでは復号できない"
      - "キーポリシーは、IAMポリシーより常に優先度が低い"
      - "KMSには、キーポリシーという概念自体が存在しない"
    answerIndex: 1
    explanation: "KMSのカスタマー管理キーには、IAMポリシーとは別に、キーポリシーという絶対的な関所が存在し、キーポリシー側がその操作を許可(またはIAMへの判断委任を宣言)していない限り、IAMポリシーの許可だけでは復号できません。"

  - question: "新しいカスタマー管理キーの既定のキーポリシーに、自動的に含まれている文はどれか。"
    choices:
      - "すべてのIAMユーザーへの無条件のフルアクセス許可"
      - "そのAWSアカウントのルートアカウントへのフルアクセスを許可する文"
      - "すべての操作を拒否する文"
      - "他のAWSアカウントへの無条件のフルアクセス許可"
    answerIndex: 1
    explanation: "新しいカスタマー管理キーを作成すると、既定のキーポリシーには、そのAWSアカウントのルートアカウントへフルアクセスを許可する文が自動的に含まれており、これによって同じアカウント内のIAMポリシーが実質的な判断を担えるようになります。"

  - question: "エンベロープ暗号化において、KMSが直接生成・保護しているものはどれか。"
    choices:
      - "暗号化対象のデータ全体"
      - "データキーという、小さな対称鍵"
      - "AWSアカウントのルート認証情報"
      - "VPCのルーティングテーブル"
    answerIndex: 1
    explanation: "KMSは、S3オブジェクトやRDSのデータベース全体を直接暗号化しているわけではなく、データキーという小さな対称鍵を生成・保護するだけです。実際のデータ本体は、このデータキーを使って各AWSサービスでローカルに暗号化されます。"

  - question: "データを復号するために必要な権限として正しいのはどれか。"
    choices:
      - "暗号化されたデータそのものへのアクセス権限だけで十分である"
      - "暗号化されたデータキーを、KMSへ送り復号してもらう権限(kms:Decrypt)が必要である"
      - "権限は一切不要で、誰でも復号できる"
      - "VPCエンドポイントへのアクセス権限だけで十分である"
    answerIndex: 1
    explanation: "データを復号するには、暗号化されたデータキーをKMSへ送り、復号してもらう権限(kms:Decrypt)が必要です。データそのものへのアクセス権限だけでは不十分です。"

  - question: "KMS Grantsの特徴として正しいのはどれか。"
    choices:
      - "JSON形式のキーポリシーを直接編集しない限り、一切使えない"
      - "JSON形式のキーポリシーそのものを編集することなく、動的かつきめ細かい権限委任を行える"
      - "IAMポリシーを完全に不要にする仕組みである"
      - "EBSのような内部サービスでは、一切利用されていない"
    answerIndex: 1
    explanation: "KMS Grantsは、JSON形式のキーポリシーそのものを編集することなく、動的かつきめ細かい権限委任を行うための仕組みで、EBSのような内部サービスがこれを利用しています。"
