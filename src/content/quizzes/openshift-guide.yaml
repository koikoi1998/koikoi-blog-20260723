questions:
  - question: "OpenShiftとKubernetesの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "OpenShiftはKubernetesを置き換える競合製品であり、どちらか一方しか選べない"
      - "OpenShiftはKubernetesをベースにした派生製品(ディストリビューション)であり、Kubernetesという核の上に企業運用に必要な機能を標準搭載している"
      - "OpenShiftとKubernetesはまったく無関係の、別々の会社が独立して開発した技術である"
      - "KubernetesはOpenShiftの内部で使われる、非公開の専用モジュールの名称である"
    answerIndex: 1
    explanation: "OpenShiftはRed Hatが提供する、Kubernetesをベースにしたコンテナプラットフォームです。Kubernetesを置き換える競合製品ではなく、Kubernetesという核の上に、実際の企業運用に必要な多くの機能を標準搭載して積み増した派生製品(ディストリビューション)です。"

  - question: "仮想マシンとコンテナの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "仮想マシンはハードウェアごとゲストOSを再現する技術であり、コンテナはOSカーネルを共有しつつプロセス単位で環境を隔離する技術である"
      - "仮想マシンとコンテナは、まったく同じ仕組みを別の名前で呼んでいるだけである"
      - "コンテナは常に仮想マシンより低速で、リソース効率も悪い"
      - "仮想マシンは、コンテナの内部で動作する下位互換の技術である"
    answerIndex: 0
    explanation: "仮想マシンはハードウェアそのものをソフトウェアで再現し、その上でゲストOSをまるごと動かす技術です。コンテナはこれとは異なるアプローチで、OSのカーネル自体は1つだけ共有しつつ、プロセス単位で実行環境を隔離する技術であり、起動が高速でリソースのオーバーヘッドも小さいという特徴があります。"

  - question: "Kubernetes単体が提供する範囲について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Kubernetes単体は、コンテナをどう配置・管理するかという核の部分だけを提供し、レジストリ・CI/CD・監視・セキュリティポリシーなどの周辺機能は別途組み合わせる必要がある"
      - "Kubernetes単体だけで、企業運用に必要なすべての機能(レジストリ・CI/CD・監視など)が完全に標準搭載されている"
      - "Kubernetes単体は、Webサーバー機能を提供するためだけのソフトウェアである"
      - "Kubernetes単体は、仮想マシンの作成のみを目的としたソフトウェアである"
    answerIndex: 0
    explanation: "Kubernetes単体は、コンテナをどう配置・管理するかという「核」の部分だけを提供するソフトウェアです。実際に企業でコンテナ基盤を運用するには、レジストリ・CI/CD・監視・セキュリティポリシーなど、数多くの周辺機能を自分たちで個別に選定・統合する必要があります。"

  - question: "OpenShiftのRouteが対応するKubernetesの概念について、記事の説明に最も合致するものはどれか。"
    choices:
      - "RouteはKubernetesのIngress(クラスタ外部からのアクセスをServiceへ振り分ける仕組み)に相当する、OpenShift独自の実装である"
      - "RouteはKubernetesのPod(コンテナの実行単位)に相当する概念である"
      - "RouteはKubernetesには存在しない、完全に無関係な独自の概念である"
      - "RouteはKubernetesのNode(実行するマシン)に相当する概念である"
    answerIndex: 0
    explanation: "RouteはKubernetesのIngress(クラスタ外部からのアクセスをServiceへ振り分ける仕組み)に相当する、OpenShift独自の実装です。TLS終端を標準でサポートしており、ホスト名ごとに異なるアプリケーションへ振り分けられます。"

  - question: "企業がKubernetes単体ではなくOpenShiftを選ぶ理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "OpenShiftの方が、Kubernetes単体より常に無料で利用できるため"
      - "Kubernetes単体では個別に組み合わせる必要がある周辺機能(レジストリ・CI/CD・監視・セキュリティポリシーなど)を、OpenShiftがあらかじめ統合し、Red Hatのサポート契約とあわせて提供しているため"
      - "OpenShiftを使えば、コンテナという技術自体を一切使わずに済むため"
      - "Kubernetes単体は、企業での利用が法律上禁止されているため"
    answerIndex: 1
    explanation: "Kubernetes単体を使う場合、周辺機能をそれぞれ個別に選定し互換性を確認しながら組み合わせる必要があり、高い専門知識と工数を要求します。OpenShiftはこの組み合わせ作業をあらかじめ済ませ、Red Hatによるサポート契約とあわせて提供することで、「完成車を購入してすぐに使い始める」という選択肢を企業に提供しています。"
