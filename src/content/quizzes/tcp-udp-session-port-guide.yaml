questions:
  - question: "TCPの「コネクション」の実体についての説明として、最も正確なものはどれか。"
    choices:
      - "5-タプル(プロトコル+送信元IP:ポート+宛先IP:ポート)で識別される、送受信双方のOSカーネルが状態機械として管理する実在の状態"
      - "アプリケーション層がCookieを使って独自に管理している論理的な状態であり、OSは関与しない"
      - "IPヘッダーのプロトコル番号フィールドだけで一意に識別される状態"
      - "NAT機器やファイアウォールが便宜的にタイムアウト管理している疑似的な状態"
    answerIndex: 0
    explanation: "TCPコネクションは5-タプルで一意に識別され、送受信双方のOSカーネルがESTABLISHEDなどの状態を状態機械として正式に保持・管理する、プロトコル自身が持つ本物の状態です。"

  - question: "実務で使われる「UDPセッション」という言葉が指しているものとして、最も適切な説明はどれか。"
    choices:
      - "UDPプロトコル自体がRFCで定義しているコネクション確立手順によって管理される状態"
      - "UDP自体にはプロトコルレベルの状態が一切なく、NAT機器やステートフルファイアウォールが送信元/宛先の組の反復を観測して便宜的にタイムアウト管理している疑似的な状態"
      - "UDPヘッダー内のセッションIDフィールドによって識別される状態"
      - "TCPと同じ3ウェイハンドシェイクによって確立される状態"
    answerIndex: 1
    explanation: "UDPはコネクションレスでプロトコル自体に状態を持ちません。「UDPセッション」は、NAT機器やファイアウォールが通信の往復を観測し、便宜上1つのやり取りとみなしてタイムアウト管理している疑似的な状態に過ぎません。"

  - question: "TCPのTIME_WAIT状態が必要な理由として、記事内で説明されているものはどれか。"
    choices:
      - "サーバー側の負荷を減らすため、接続をできるだけ早く終了させる目的で設けられている"
      - "最後のACKが相手に届かなかった場合に備え、また同じ5-タプルの新しいコネクションが古い遅延パケットを誤って受信しないようにするため"
      - "TCPの輻輳制御アルゴリズムがこの状態を利用して送信量を調整するため"
      - "IPアドレスとポート番号の対応をARPテーブルに反映させるため"
    answerIndex: 1
    explanation: "TIME_WAITは、最後のACKが届かず相手がFINを再送してきた場合に対応するため、また同じ5-タプルを使う新しいコネクションが前のコネクションの遅延パケットを誤受信しないようにするために、2MSL程度の時間維持されます。"

  - question: "プロトコル番号とポート番号の関係についての説明として、最も正確なものはどれか。"
    choices:
      - "プロトコル番号とポート番号は同じヘッダー内の同じフィールドであり、実質的に同じものである"
      - "プロトコル番号はIPヘッダーが持つ8ビットのフィールド、ポート番号はTCP/UDPヘッダーがそれぞれ独自に持つ16ビットのフィールドであり、階層も名前空間も異なる別の情報である"
      - "ポート番号はIPプロトコル全体で共有される単一の名前空間であり、TCPとUDPで同じ番号は必ず同じ意味を持つ"
      - "プロトコル番号はアプリケーション層が、ポート番号はネットワーク層がそれぞれ管理している"
    answerIndex: 1
    explanation: "プロトコル番号はIPヘッダーの8ビットフィールド(TCP=6、UDP=17など)、ポート番号はTCP/UDPそれぞれのヘッダーが独自に持つ16ビットフィールドです。TCPの80番とUDPの80番は独立した別の名前空間に属する数字です。"

  - question: "「プロトコルとポート番号が1対1でないなら、ESPにも任意のポート番号を割り当てればよいのでは」という疑問への、記事内での回答として最も適切なものはどれか。"
    choices:
      - "その通りであり、実際にESPには任意のポート番号を割り当てる運用が広く行われている"
      - "ポート番号はTCP/UDPヘッダーというフォーマットの中にあらかじめ定義されたフィールドに過ぎず、ESPのヘッダーフォーマット(RFC 4303)にはそのようなフィールド自体が存在しないため、割り当てるにはESPの仕様自体を変更する必要がある"
      - "ESPはIPv6でのみ使用されるため、ポート番号の概念自体が不要である"
      - "ポート番号はMACアドレスと1対1で対応しているため、ESPにはそもそも割り当てる余地がない"
    answerIndex: 1
    explanation: "ポート番号はTCP/UDPというヘッダー構造の中に定義されたフィールドであり、IPプロトコル全体で共有される外付け可能な識別子ではありません。ESPのヘッダー(RFC 4303)にはポート番号フィールドが存在しないため、任意に割り当てることはできません。"

  - question: "NAT-TがESPをNAT環境で通すために採用しているアプローチとして正しいものはどれか。"
    choices:
      - "ESPのヘッダーフォーマット自体にポート番号フィールドを新たに追加する"
      - "ESPパケット全体を、もともとポート番号フィールドを持つUDPヘッダーでカプセル化することで、既存のNAPT変換テーブルにポートベースで乗せられるようにする"
      - "ESPの通信をすべてICMPに変換して送信する"
      - "NAT機器のファームウェアを更新し、プロトコル番号50を特別扱いさせる"
    answerIndex: 1
    explanation: "NAT-Tは、ESP自身の仕様を変更するのではなく、ESPパケット全体をUDPヘッダーで包む(カプセル化する)ことで、既存のポートベースのNAPT変換の仕組みにそのまま乗せられるようにしています。"

  - question: "TCP/UDPそれぞれのポート番号0〜1023の範囲についての説明として正しいものはどれか。"
    choices:
      - "動的・プライベートポート(エフェメラルポート)と呼ばれ、クライアントが通信のたびに一時的に使う"
      - "ウェルノウンポートと呼ばれ、HTTP(80)やSSH(22)など広く合意された標準サービス用に予約されている"
      - "IANAに登録されていない、自由に使ってよい番号帯である"
      - "TCPでのみ使用され、UDPでは0〜1023番は予約されていない"
    answerIndex: 1
    explanation: "0〜1023はウェルノウンポートと呼ばれ、HTTP・HTTPS・SSH・DNSなど広く合意された標準サービス用に予約されています。多くのOSでは1024未満のポートの使用に管理者権限が必要です。"

  - question: "「セッション」という言葉が複数のレイヤーで異なる意味に使われる例として、記事内で挙げられていないものはどれか。"
    choices:
      - "TCPコネクション(5-タプルで識別される、OSカーネルが管理する状態機械)"
      - "NAT機器・ファイアウォールが便宜的に管理する疑似セッション"
      - "アプリケーションがCookieやトークンで管理するログインセッション"
      - "MACアドレステーブルがスイッチのポートごとに保持する学習エントリ"
    answerIndex: 3
    explanation: "記事ではTCPコネクション・NAT/FWの疑似セッション・OSI参照モデルのセッション層・アプリケーションのログインセッションの4つを挙げています。MACアドレステーブルの学習エントリは「セッション」の文脈では扱っていません。"

  - question: "QUIC(HTTP/3が使うトランスポートプロトコル)の設計上の特徴として、記事内で説明されているものはどれか。"
    choices:
      - "TCPの5-タプルによるコネクション識別をそのまま踏襲しており、IPアドレスが変わるとコネクションは必ず切断される"
      - "UDPの上に実装されているが、独自のコネクションIDによってコネクションを管理するため、クライアントのIPアドレスが変化してもコネクションを継続できる"
      - "ポート番号という概念を廃止し、プロトコル番号のみで通信相手を識別する"
      - "TCPを置き換える新しいトランスポート層のプロトコル番号として、IANAに新規登録されている"
    answerIndex: 1
    explanation: "QUICはUDPの上に実装されつつ、TCPの5-タプル依存とは異なる独自のコネクションIDでコネクションを管理しており、Wi-Fiからモバイル回線への切り替えのようなIPアドレス変化があってもコネクションを継続できます。"
