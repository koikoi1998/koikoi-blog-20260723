questions:
  - question: "AD DS(Active Directory Domain Services)とDC(ドメインコントローラー)の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "AD DSとDCはまったく同じものを指す別名であり、使い分ける意味はない"
      - "AD DSは組織の情報を管理する仕組み・データ構造そのものであり、DCはそれを実際に実行し複製を保持するサーバーである"
      - "DCはソフトウェアの仕組みを指し、AD DSはそれを動かすハードウェアを指す"
      - "AD DSは1台のDCにしか存在できず、複数のDCで共有することはできない"
    answerIndex: 1
    explanation: "AD DSは組織のユーザー・コンピューター・グループなどの情報を一元管理する仕組み・データ構造そのものであり、DCはそのAD DSの複製を実際に保持し、問い合わせや認証要求に応答するサーバーです。この2つは明確に異なるレイヤーの概念です。"

  - question: "AD DSのドメインパーティション・設定パーティション・スキーマパーティションの複製範囲について、記事の説明に最も合致するものはどれか。"
    choices:
      - "すべてのパーティションが、フォレスト内の全DCへ複製される"
      - "ドメインパーティションは同一ドメイン内のDC間のみ、設定パーティションとスキーマパーティションはフォレスト内の全DC間で複製される"
      - "すべてのパーティションが、同一ドメイン内のDC間だけで複製される"
      - "スキーマパーティションだけがフォレスト全体に複製され、設定パーティションはドメイン内に閉じる"
    answerIndex: 1
    explanation: "ドメインパーティションはそのドメインに属するオブジェクトを保持し、同一ドメイン内のDC間だけで複製されます。一方、設定パーティションとスキーマパーティションはフォレスト全体の構成情報・型定義であり、フォレスト内の全DC間で複製されます。"

  - question: "ドメイン・ツリー・フォレストの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "フォレスト内のすべてのツリーは、連続したDNS名前空間を共有しなければならない"
      - "ツリーは連続したDNS名前空間を共有するドメインの集合であり、フォレストは名前空間が連続しないツリーも内包できる、AD DSにおける最上位のセキュリティ境界である"
      - "ドメインを分割すれば、フォレスト全体に影響する権限からも完全に隔離される"
      - "1つのフォレストには、ツリーもドメインも必ず1つずつしか存在できない"
    answerIndex: 1
    explanation: "ツリーは`example.com`と`child.example.com`のように連続したDNS名前空間を共有するドメインの集合です。フォレストは複数のツリー(名前空間が連続しないものも含む)を内包でき、スキーマ管理者・企業管理者といったフォレスト全体に影響する権限が区切られる、AD DSにおける最上位のセキュリティ境界です。"

  - question: "機能レベル(Domain/Forest Functional Level)が存在する理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "DCの台数を制限するための仕組みである"
      - "フォレスト・ドメイン内に異なるOSバージョンのDCが混在しうるため、すべてのDCが安全に処理できる機能の範囲を、最も古いDCのバージョンに合わせて制限する仕組みである"
      - "DCのCPU使用率を制御するための仕組みである"
      - "グローバルカタログの台数を決定するための仕組みである"
    answerIndex: 1
    explanation: "機能レベルは、フォレスト・ドメイン内に存在する最も古いDCのOSバージョンによって上限が決まる、ドメイン/フォレスト単位の機能制御です。すべてのDCが安全に理解・処理できるバージョン以上でなければ、新しい機能を安全に有効化できないためこの仕組みが存在します。"

  - question: "機能レベルの引き上げに関する実務上の注意点について、記事の説明に最も合致するものはどれか。"
    choices:
      - "機能レベルはいつでも自由に上げ下げでき、実務上の注意点は特にない"
      - "引き上げた後に有効化された機能の一部は引き下げても復元されないことがあるため、実務上は一方向の操作として計画するのが安全である"
      - "機能レベルを引き上げると、それ以降どのバージョンのDCでも自由に新規参加できるようになる"
      - "機能レベルの引き上げは、DCの再起動なしには絶対に反映されない"
    answerIndex: 1
    explanation: "多くのバージョンで機能レベルを技術的に引き下げることは可能ですが、引き上げ後に有効化された機能の一部は引き下げても復元されないなどの理由から、実務上は一方向の操作として計画するのが安全とされています。また引き上げ後は、それより古いOSのDCは新規に参加できなくなります。"

  - question: "サーバーマネージャーでAD DSの役割を追加すると自動的に追加候補として表示される項目について、記事の説明に最も合致するものはどれか。"
    choices:
      - "表示される項目はすべて、AD DS固有の新規機能であり、AD DSを入れなければ一切有効にならない"
      - "ファイルサービスとストレージサービスや.NET Framework 4.8のように、AD DS固有の依存ではなくWindows Serverが最初から持つベース機能も含まれており、実際に新規で有効化されるのは主にグループポリシー管理コンソールとAD DS向け管理ツール(RSAT)である"
      - "DNSサーバーの機能も、この段階で必ず選択しなければDCへの昇格ができない"
      - "表示される項目はすべて任意であり、何も追加しなくてもAD DSの役割は正常に機能する"
    answerIndex: 1
    explanation: "ファイルサービスとストレージサービスや.NET Framework 4.8などは、AD DS固有の依存関係ではなくWindows Serverが最初から持つベース機能です。AD DSの役割追加によって実際に新規で有効化されるのは、主にグループポリシー管理コンソール(GPMC)とAD DS向けの管理ツール一式(RSAT)です。"

  - question: "「サーバーの役割の選択」画面でDNSサーバーを選択する必要がない理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "DNSサーバーの機能はWindows Serverには存在しないため"
      - "このサーバーをドメインコントローラーに昇格させるウィザード自体に、独立した「DNSサーバーをインストールする」チェックボックスが用意されているため"
      - "AD DSはDNSサーバー機能を絶対に必要としないため"
      - "DNSサーバーの機能は、Windows Updateから別途手動でダウンロードする必要があるため"
    answerIndex: 1
    explanation: "このDCを実際にドメインコントローラーへ昇格させる操作自体に、独立した「DNSサーバーをインストールする」チェックボックスが用意されているため、役割選択画面で先にDNSサーバーを選ばなくても、昇格が完了した時点でDNSサーバーの役割もインストールされた状態にできます。"

  - question: "複数ドメインへの分割が実務で検討されるケースについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "単に部署ごとに管理を分けたいという程度の要件でも、必ずドメインを分割すべきである"
      - "合併・買収での既存AD環境の共存や、パスワードポリシー・監査要件が大きく異なる部門の分離など、コストの高い意思決定に見合う明確な要件がある場合に検討される"
      - "ドメインを分割してもフォレスト全体の複雑性は変わらないため、気軽に分割してよい"
      - "ドメインは1つのフォレストにつき必ず複数用意しなければならない"
    answerIndex: 1
    explanation: "ドメインの追加はフォレスト全体の複雑性(信頼関係の管理、GCのレプリケーション対象、DC台数)を確実に増やすコストの高い意思決定であり、合併・買収や、パスワードポリシー・監査要件が大きく異なる部門の分離など、明確な要件がある場合に検討されます。単に管理を分けたい程度であれば、OUとグループポリシー、権限移譲で十分なケースが大半です。"
