questions:
  - question: "CPUのオーバーコミットが広く受け入れられている理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "CPUは時間分割で共有されるリソースであり、すべての仮想マシンが同時に100%を要求することは実務上稀であるため、不足しても速度低下で済む"
      - "CPUは物理的に無限に増やせるリソースであり、不足するという状況自体が発生しないため"
      - "CPUのオーバーコミットは、メモリと同様に不足すると即座にスワップが発生するため"
      - "CPUのオーバーコミットは、法律上義務付けられている設計手法であるため"
    answerIndex: 0
    explanation: "CPUは複数の仮想マシンのvCPUが物理コアの実行時間を極めて短い時間単位で交互に使う(タイムスライス)ことで共有されるリソースです。すべての仮想マシンが同時に100%のCPUを要求することは実務上稀であるという前提のもと、不足しても速度低下で済むため、オーバーコミットが広く受け入れられています。"

  - question: "メモリのオーバーコミットがCPUより慎重な設計を必要とする理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "メモリはCPUより物理的な価格が常に高いため"
      - "メモリが不足すると、OSが使用頻度の低いデータをディスク上のページファイルへ退避させる(スワップ)処理を行い、ディスクアクセスの低速さからシステム全体の応答性が劇的に悪化するため"
      - "メモリは時間分割で共有されるリソースであり、CPUより複雑な仕組みを持つため"
      - "メモリのオーバーコミットは、Hyper-Vでは技術的に一切サポートされていないため"
    answerIndex: 1
    explanation: "メモリが不足すると、OSは使用頻度の低いデータをディスク上のページファイルへ退避させるスワップという処理を行います。ディスクへのアクセスはメモリへのアクセスと比べて桁違いに低速であるため、メモリのスワップが発生するとシステム全体の応答性が劇的に悪化します。この非対称性が、メモリのオーバーコミットがCPUより慎重な設計を必要とする理由です。"

  - question: "Hyper-Vの動的メモリ(Dynamic Memory)の仕組みについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "動的メモリは、Startup RAM・Minimum RAM・Maximum RAMという3つの値の範囲内で、仮想マシンの実際のメモリ使用状況を継続的に監視し、割り当てを動的に増減させる仕組みである"
      - "動的メモリは、仮想マシンの起動時に割り当てたメモリ量を、稼働中に一切変更できない固定的な仕組みである"
      - "動的メモリは、物理メモリの総量そのものを、稼働中に自動的に増設する機能である"
      - "動的メモリは、CPUの動作周波数を動的に変更するための機能である"
    answerIndex: 0
    explanation: "動的メモリは、Startup RAM(起動時の初期割り当て)・Minimum RAM(縮小できる最小量)・Maximum RAM(拡張できる最大量)という3つの値を設定し、仮想マシン内で実際にどれだけメモリが使われているかを継続的に監視して、その範囲内で必要に応じてメモリの割り当てを動的に増減させる仕組みです。"

  - question: "Minimum RAMを低く設定しすぎることのリスクについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "Minimum RAMを低く設定しても、性能への影響は一切ない"
      - "仮想マシンが本当に必要とするメモリ量が確保されず、スワップの発生につながるリスクがある"
      - "Minimum RAMを低く設定すると、そのホストのCPU使用率が自動的に上昇する"
      - "Minimum RAMは、仮想マシンの起動速度にのみ影響し、稼働中の性能には無関係である"
    answerIndex: 1
    explanation: "Minimum RAMを低く設定しすぎると、仮想マシンが本当に必要とするメモリ量が確保されず、スワップの発生につながるリスクがあります。動的メモリを使う場合でも、各仮想マシンが実際に必要とする最低限のメモリ量を正しく見積もっておくことが重要です。"

  - question: "NUMA(Non-Uniform Memory Access)を意識した設計が重要な理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "仮想マシンに割り当てるvCPU・メモリの量が1つのNUMAノードの境界を越えると、別のCPUソケットに属するメモリ領域へアクセスする必要が生じ、余分な遅延が発生して性能が低下することがあるため"
      - "NUMAは、仮想マシンのライセンス数を制限するための仕組みであるため"
      - "NUMAを意識しなくても、性能には一切影響しないため、無視してよい"
      - "NUMAは、ネットワーク帯域幅を制御するための仕組みであるため"
    answerIndex: 0
    explanation: "大規模な物理サーバーでは、CPUソケットごとに専用のメモリ領域が割り当てられるNUMAというアーキテクチャが使われています。仮想マシンに割り当てるvCPU・メモリの量が1つのNUMAノードの境界を越える構成では、別のCPUソケットに属するメモリ領域へアクセスする必要が生じ、余分な遅延が発生して性能が低下することがあります。"
