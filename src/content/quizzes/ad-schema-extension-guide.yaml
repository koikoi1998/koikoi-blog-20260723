questions:
  - question: "スキーマ拡張とは何かについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "AD DSのデータベースエンジン自体を、より高性能な別の製品に置き換える操作である"
      - "AD DSが標準で持っているオブジェクトクラス・属性のセットに、新しいオブジェクトクラスや属性を追加する操作である"
      - "ドメインコントローラーのハードウェアリソース(CPU・メモリ)を増設する操作である"
      - "既存のユーザーアカウントのパスワードポリシーを変更する操作である"
    answerIndex: 1
    explanation: "スキーマ拡張は、AD DSが標準で持っているオブジェクトクラス・属性のセットに、新しいオブジェクトクラスや属性を追加する操作です。ExchangeやSkype for Businessのような、AD DSをデータストアとして間借りする製品の導入時に発生します。"

  - question: "スキーマ拡張がフォレスト全体に影響する理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "スキーマは特定のドメインだけに保存され、他のドメインには一切影響しない"
      - "スキーマはスキーマパーティションの一部として、特定のドメインではなくフォレスト全体の全DCに複製されるデータだから"
      - "スキーマ拡張を行うと、自動的にフォレスト内の全ドメインにその製品がインストールされるから"
      - "スキーマ拡張は、フォレスト機能レベルを自動的に引き上げる操作だから"
    answerIndex: 1
    explanation: "スキーマはスキーマパーティションの一部として、特定のドメインではなくフォレスト全体の全DCに複製されるデータです。そのため、1つのドメインでの拡張内容が、フォレスト内の他のすべてのドメインのDCにも複製されます。"

  - question: "一度追加したスキーマのオブジェクトクラス・属性の定義について、記事の説明に最も合致するものはどれか。"
    choices:
      - "いつでも自由に削除でき、元の状態に完全に戻すことができる"
      - "削除することはできず、無効化(defunct)とマークして以後新たに使われないようにすることしかできない"
      - "自動的に30日後に期限切れとなり、削除される"
      - "スキーママスターを再起動すれば、自動的に取り消される"
    answerIndex: 1
    explanation: "一度追加したオブジェクトクラス・属性の定義は後から削除できません。その属性やクラスが既にフォレスト内のどこかのオブジェクトで使われてしまっている可能性を否定できないためで、削除の代わりにできるのは無効化(defunct)とマークすることだけです。"

  - question: "Schema Adminsグループの扱いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "日常的な管理業務のために、管理者アカウントへ常時メンバーシップを付与しておくべきである"
      - "フォレスト全体に影響する破壊的な操作が可能な強力な権限のため、スキーマ拡張が必要な作業の前後だけ一時的に付与・削除するのが定石である"
      - "Schema Adminsグループは、ユーザーアカウントのパスワードリセットのためだけに使われる権限グループである"
      - "Schema Adminsグループへのメンバーシップは、ドメイン単位ではなく端末単位で付与される"
    answerIndex: 1
    explanation: "スキーマへの変更は、Schema AdminsとEnterprise Adminsの権限を持つアカウントでなければ実行できません。これはフォレスト全体に影響する破壊的な操作が可能な強力な権限のため、日常的に付与し続けるべきではなく、作業の前後だけ一時的に付与・削除するのが推奨されます。"

  - question: "実務でスキーマ拡張を安全に進めるための段取りについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "本番環境で直接試し、問題が起きたらその都度対応すればよい"
      - "隔離された検証用フォレストで先に拡張を試し、全DCが正常にオンライン・複製可能な状態であることを確認した上で、業務影響の少ない時間帯に実施する"
      - "スキーマ拡張は影響が小さいため、事前の検証は特に必要ない"
      - "スキーマ拡張はスキーママスター以外のDCでは一切影響がないため、他のDCの状態を確認する必要はない"
    answerIndex: 1
    explanation: "上位1%のエンジニアは、隔離された検証用フォレストで先に拡張を試し、全DCが正常にオンライン・複製可能な状態であることを事前に確認した上で、レプリケーションが速やかに完了することが期待できる、業務影響の少ない時間帯に実施します。"
