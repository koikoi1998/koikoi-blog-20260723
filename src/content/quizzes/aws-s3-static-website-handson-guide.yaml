questions:
  - question: "現在のS3バケットは、既定でどのような状態か。"
    choices:
      - "既定ですべてのパブリックアクセスが許可されている"
      - "既定ですべてのパブリックアクセスがブロックされている"
      - "既定でファイルのアップロードそのものができない"
      - "既定で暗号化なしにはファイルを保存できない"
    answerIndex: 1
    explanation: "現在のS3バケットは、既定ですべてのパブリックアクセスがブロックされています。公開するには明示的な解除が必要です。"

  - question: "パブリックアクセスブロックを解除しただけで、バケット内のファイルは公開されるか。"
    choices:
      - "される。それだけで誰でもアクセスできるようになる"
      - "されない。別途バケットポリシーなどで明示的に許可を与える必要がある"
      - "される。ただしファイルのダウンロードだけができない"
      - "パブリックアクセスブロックという設定自体が存在しない"
    answerIndex: 1
    explanation: "パブリックアクセスブロックの解除は、バケットポリシーやACLによる公開設定を「許可する」だけであり、実際に公開するには別途明示的な許可設定が必要です。"

  - question: "パブリックアクセスブロックという仕組みが存在する背景にある考え方は何か。"
    choices:
      - "S3の処理速度を向上させるため"
      - "意図しない公開設定への多層防御(Defense in Depth)として、最後の砦を用意するため"
      - "AWSの利用料金を削減するため"
      - "ファイルの暗号化を自動化するため"
    answerIndex: 1
    explanation: "誤って公開設定をしてしまっても、パブリックアクセスブロックが有効であれば実際には公開されない、という多層防御の考え方に基づいています。"

  - question: "S3のバージョニングを有効化した状態でファイルを削除すると、実際には何が起こるか。"
    choices:
      - "ファイルが完全に消去され、二度と復元できない"
      - "ファイルは実際には削除されず、削除マーカーという特殊なバージョンが追加される"
      - "バケット全体が自動的に削除される"
      - "削除操作自体が拒否され、実行できない"
    answerIndex: 1
    explanation: "バージョニングが有効な状態では、削除操作は実際にファイルを消すのではなく、削除マーカーという特殊なバージョンを追加するだけの操作になります。"

  - question: "バケットポリシーで`s3:GetObject`だけを許可した場合、誰でもできるようになる操作はどれか。"
    choices:
      - "ファイルのアップロード・削除・上書きも含め、すべての操作ができるようになる"
      - "ファイルの読み取りだけができるようになり、アップロードや削除はできない"
      - "バケット自体の削除ができるようになる"
      - "他のバケットへのアクセスもできるようになる"
    answerIndex: 1
    explanation: "s3:GetObjectはオブジェクトの読み取り権限のみを付与するアクションであり、アップロードや削除といった他の操作はこのポリシーだけでは許可されません。"
