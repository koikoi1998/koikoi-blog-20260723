questions:
  - question: "このハンズオンで、1回目と2回目のアクセスでX-Cacheヘッダーが示した結果として正しいのはどれか。"
    choices:
      - "両方ともMISSだった"
      - "1回目はMISS、2回目はHITだった"
      - "両方ともHITだった"
      - "1回目はHIT、2回目はMISSだった"
    answerIndex: 1
    explanation: "1回目はキャッシュに存在せずオリジンへ問い合わせが発生するMISS、2回目はキャッシュから即座に返されるHITでした。"

  - question: "max-age=10を設定した後、10秒以上待ってから再アクセスした結果として正しいのはどれか。"
    choices:
      - "常にHITのままだった"
      - "再びMISSに戻り、オリジンサーバーへの問い合わせが発生した"
      - "エラーが返された"
      - "キャッシュが完全に削除され、サーバーが停止した"
    answerIndex: 1
    explanation: "max-ageで設定した期限を過ぎると、次回のアクセスで再びMISSとなり、オリジンへの問い合わせが発生します。"

  - question: "異なるAccept-Languageヘッダーでアクセスした際に、Varyヘッダーが正しく設定されている場合の挙動として正しいのはどれか。"
    choices:
      - "常に同じキャッシュが返される"
      - "それぞれ別々のキャッシュとして扱われ、両方ともMISSになる"
      - "2回目のアクセスはエラーになる"
      - "言語設定に関わらず、常に同じ内容が返される"
    answerIndex: 1
    explanation: "Varyヘッダーが正しく設定されていれば、異なるAccept-Languageの値は別々のキャッシュとして扱われます。"

  - question: "X-Cacheヘッダーの正体として正しいのはどれか。"
    choices:
      - "オリジンサーバーが生成する、HTTPの標準仕様で定められたヘッダー"
      - "Squid自身が、デバッグ・運用調査のためにレスポンスへ追加するヘッダー"
      - "クライアントのブラウザが生成するヘッダー"
      - "DNSサーバーが生成するヘッダー"
    answerIndex: 1
    explanation: "X-Cacheは、オリジンサーバーが生成するものではなく、Squid自身がデバッグ用に付与するヘッダーです。"

  - question: "Varyで指定する条件を増やしすぎることの弊害として正しいのはどれか。"
    choices:
      - "キャッシュの容量が無限に増える"
      - "キャッシュが細かく分割され、ヒット率が下がる"
      - "サーバーが必ずクラッシュする"
      - "HTTPSが使用できなくなる"
    answerIndex: 1
    explanation: "Varyの条件を増やすほどキャッシュが細かく分割され、同じ内容がキャッシュに乗る確率(ヒット率)が下がります。"
