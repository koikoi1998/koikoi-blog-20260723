questions:
  - question: "TLSセッション再開(Session Resumption)が実現していることとして正しいのはどれか。"
    choices:
      - "暗号化通信を完全に無効化する"
      - "以前確立したセッション情報を再利用し、重いフルハンドシェイクを省略する"
      - "証明書の有効期限を自動的に延長する"
      - "ロードバランサーの冗長化そのものを実現する"
    answerIndex: 1
    explanation: "TLSセッション再開は、以前確立したセッションの情報(セッションIDまたはセッションチケット)を再利用することで、重いフルハンドシェイクを省略し、短縮されたアブリビエイテッド・ハンドシェイクで再接続を完了させる仕組みです。"

  - question: "ロードバランサーが複数台構成の場合、TLSセッション再開が失敗する典型的な理由として正しいのはどれか。"
    choices:
      - "TLSという技術自体が、複数台構成に対応していないから"
      - "セッション情報が、既定ではノード間で共有されず、別のノードへ振り分けられると再開できないから"
      - "複数台構成では、証明書を発行できないから"
      - "複数台構成では、暗号化通信自体が禁止されているから"
    answerIndex: 1
    explanation: "ロードバランサーが複数台構成の場合、あるノードで確立したセッション情報は、既定では他のノードと共有されないため、クライアントが別のノードへ振り分けられると、再開は失敗し、フルハンドシェイクが発生します。"

  - question: "セッションID方式とセッションチケット方式の、それぞれの『共有』の違いとして正しいのはどれか。"
    choices:
      - "両方式とも、共有すべきものは何も存在しない"
      - "セッションID方式はサーバー側のキャッシュの共有、チケット方式は暗号化・復号用の鍵の共有が必要"
      - "セッションID方式だけが、複数台構成で使用できる"
      - "チケット方式だけが、複数台構成で使用できる"
    answerIndex: 1
    explanation: "セッションID方式は、サーバー側が保持するセッション情報のキャッシュ自体をノード間で共有する必要があり、チケット方式は、チケットを暗号化・復号するための鍵を、すべてのノードで一致させる必要があります。"

  - question: "セッションキャッシュが満杯になった場合の、典型的な現れ方として正しいのはどれか。"
    choices:
      - "常に明示的なエラーメッセージが表示される"
      - "明確なエラーは出ず、再開の成功率が徐々に下がり、CPU使用率が上昇するという、見えにくい形で現れる"
      - "サーバー自体が即座に完全停止する"
      - "この問題は、技術的に発生し得ない"
    answerIndex: 1
    explanation: "セッションキャッシュが満杯になると、古いセッションから静かに退避され、再開の成功率が徐々に下がり、CPU使用率だけが上昇していくという、見えにくい劣化が発生します。"

  - question: "TLS 1.3におけるセッション再開の仕組みとして正しいのはどれか。"
    choices:
      - "従来のセッションID方式のみが使用され、チケット方式は廃止された"
      - "従来のセッションID方式が廃止され、セッション再開はチケット方式のみで行われる"
      - "TLS 1.3では、セッション再開という機能自体が技術的に存在しない"
      - "セッションID方式とチケット方式が、常に同時に併用される"
    answerIndex: 1
    explanation: "TLS 1.3では、従来のセッションID方式が廃止され、セッション再開はチケット方式のみで行われるようになりました。そのため、チケット機能を無効化すると、セッション再開という機能そのものが完全に失われます。"
