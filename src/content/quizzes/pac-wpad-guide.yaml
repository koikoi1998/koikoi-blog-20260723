questions:
  - question: "PACファイルの実体として正しいのはどれか。"
    choices:
      - "プロキシサーバーのIPアドレスだけを列挙した、単純なテキストファイル"
      - "FindProxyForURLという関数を持つ、JavaScriptで書かれたファイル"
      - "暗号化されたバイナリファイル"
      - "DNSサーバーが自動的に生成するレコード"
    answerIndex: 1
    explanation: "PACファイルの実体は、FindProxyForURLという1つの関数を持つ、JavaScriptのテキストファイルです。"

  - question: "PACファイルの戻り値「DIRECT」が指示している動作として正しいのはどれか。"
    choices:
      - "すべての通信を暗号化する"
      - "プロキシを一切使わず、直接接続する"
      - "通信を完全に拒否する"
      - "別のDNSサーバーへ問い合わせを転送する"
    answerIndex: 1
    explanation: "DIRECTは、プロキシを経由せず、直接接続することを指示する特別な戻り値です。"

  - question: "WPADが、PACファイルの場所を見つけるために使う方法として正しいのはどれか。"
    choices:
      - "常にDHCP経由の方法だけを使う"
      - "DHCP経由とDNS経由という、複数の方法を組み合わせて使う"
      - "常に手動設定でのみ動作する"
      - "TLS証明書の情報から場所を推測する"
    answerIndex: 1
    explanation: "WPADは、DHCPオプション252経由と、wpad.<ドメイン>という命名規則のDNS経由という、複数の方法を組み合わせます。"

  - question: "WPADの名前の仕組みが、歴史的に悪用の対象になってきた理由として正しいのはどれか。"
    choices:
      - "WPADが常に暗号化されていないため"
      - "推測可能なホスト名(wpad.<ドメイン>)を、攻撃者が先に登録することで、偽のPACファイルを読み込ませられるため"
      - "WPADがTCPではなくUDPを使用するため"
      - "WPADがIPv6に対応していないため"
    answerIndex: 1
    explanation: "推測可能なホスト名を攻撃者が先に登録し、偽のPACファイルを読み込ませることで、通信を傍受されるリスクがあります。"

  - question: "PACファイルとWPADの役割分担についての正しい理解はどれか。"
    choices:
      - "両者はまったく同じ役割を持つ、同義語である"
      - "PACファイルは判断ロジックであり、WPADはそのファイルの場所を見つける仕組みである"
      - "WPADがあれば、PACファイルは不要である"
      - "PACファイルがあれば、WPADは常に不要である"
    answerIndex: 1
    explanation: "PACファイルは「どのプロキシを使うか」の判断ロジックを持ち、WPADはそのファイルの場所そのものを自動的に見つける、別々の役割を持ちます。"
