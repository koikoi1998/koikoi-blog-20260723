questions:
  - question: "カーネル空間とユーザー空間を分離する目的として、記事内で説明されている最も本質的な理由はどれか。"
    choices:
      - "一般のアプリケーションのバグやクラッシュが、OS全体やハードウェアを直接壊すことを防ぐため"
      - "アプリケーションの起動速度を向上させるため"
      - "ディスク容量を節約するため"
      - "複数のユーザーが同時にログインできるようにするため"
    answerIndex: 0
    explanation: "カーネル空間とユーザー空間の分離は、一般のアプリケーションのバグやクラッシュがOS全体やハードウェアを直接壊してしまうことを防ぐことが本質的な目的だと説明されています。"

  - question: "ユーザー空間のプログラムが特権命令を実行しようとした場合、CPUはどう振る舞うと記事内で説明されているか。"
    choices:
      - "特に何も起こらず、そのまま実行が継続される"
      - "例外(fault)を発生させ、処理を強制的に中断させる"
      - "自動的にカーネルモードに昇格させ、処理を継続する"
      - "該当のプロセスを自動的に別のCPUコアに移動させる"
    answerIndex: 1
    explanation: "ユーザーモードで特権命令を実行しようとすると、CPUは例外(fault)を発生させて処理を強制的に中断させると説明されています。これは取り決めではなくハードウェアレベルの制約です。"

  - question: "TUN/TAPデバイスの仕組みとして、記事内の説明として正しいものはどれか。"
    choices:
      - "ユーザー空間のプログラムが物理NICのレジスタを直接書き換えることを許可する仕組み"
      - "カーネルのネットワークスタックとユーザー空間のプログラムとの間に、read()/write()で双方向にパケットをやり取りできる仮想的なネットワークインターフェースを作る仕組み"
      - "カーネル空間同士でパケットを転送するための専用ハードウェアの名称"
      - "ユーザー空間のプログラムがシステムコールを一切使わずにネットワーク通信を行える仕組み"
    answerIndex: 1
    explanation: "TUN/TAPは、カーネルのネットワークスタックとユーザー空間のプログラムとの間に双方向のパケットのやり取り口を作る仮想的なネットワークインターフェースの仕組みです。"

  - question: "TUNデバイスとTAPデバイスの違いとして、記事内の説明はどれか。"
    choices:
      - "TUNはIPパケット(レイヤー3)を扱い、TAPはEthernetフレーム(レイヤー2、MACアドレスを含む)を扱う"
      - "TUNは物理ハードウェアを必要とし、TAPは必要としない"
      - "TUNはTCP専用、TAPはUDP専用のデバイスである"
      - "TUNはWindows専用、TAPはLinux専用の仕組みである"
    answerIndex: 0
    explanation: "TUNはIPパケットをそのまま扱うのに対し、TAPはMACアドレスを含むEthernetフレームを扱うという違いが説明されています。"

  - question: "カーネル空間で処理が完結する実装(WireGuardなど)が、ユーザー空間実装(TUN/TAP経由のOpenVPNなど)よりも高速になりやすい理由として、記事内の説明はどれか。"
    choices:
      - "カーネル空間の実装は暗号アルゴリズムを一切使用しないため"
      - "ユーザー空間との間のコピー・コンテキストスイッチという往復が発生しないため"
      - "カーネル空間の実装は常に複数のCPUコアを同時に使用するため"
      - "ユーザー空間実装は常にTCPを使い、カーネル空間実装は常にUDPを使うため"
    answerIndex: 1
    explanation: "TUN/TAPを介した通信はカーネルとユーザー空間の間でコピーとコンテキストスイッチの往復が発生しますが、カーネル空間で完結する実装はこの往復自体が発生しないため高速になりやすいと説明されています。"
