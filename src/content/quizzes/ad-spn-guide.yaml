questions:
  - question: "SPN(サービスプリンシパル名)が実際に指し示しているものは何か。記事の説明に最も合致するものを選べ。"
    choices:
      - "そのサービスが動いているサーバーのIPアドレス"
      - "そのサービスを実行しているアカウント(サーバーの名前ではなく、そのサービスのセキュリティコンテキストとなるアカウント)"
      - "そのサービスへ接続できるユーザーの一覧"
      - "そのサービスが使用するポート番号だけ"
    answerIndex: 1
    explanation: "SPNが指しているのはサーバーそのものではなく、そのサービスを実行しているアカウントです。KDCはクライアントが提示したSPNをservicePrincipalName属性に持つアカウントを検索し、そのアカウントの鍵でサービスチケットを暗号化します。"

  - question: "コンピューターアカウントに既定で登録されている`HOST/コンピューター名`というSPNについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "そのコンピューター上で動く多くの基本的なサービス(ファイル共有、印刷、リモート管理など)が、共通してこのSPNに相乗りする形で認証を受けられるようにするためのもの"
      - "そのコンピューターがドメインコントローラーであることを示すための特殊なフラグ"
      - "そのコンピューターのIPアドレスをDNSへ登録するためのSPN"
      - "ユーザーがそのコンピューターにログオンできる時間帯を制限するための設定"
    answerIndex: 0
    explanation: "HOST/コンピューター名というSPNは、そのコンピューター上で動く多くの基本的なサービスが共通してこのSPNに相乗りする形で認証を受けられるようにするために、コンピューターアカウントへ既定で登録されています。"

  - question: "サービスの実行アカウントを、専用のサービスアカウントに変更した場合、SPNについて何をする必要があるか。"
    choices:
      - "何もする必要はない。SPNは自動的に新しいアカウントへ移行される"
      - "新しいアカウントへSPNを追加するだけでよく、旧アカウントのSPNは自動的に無効化される"
      - "新しいアカウントへSPNを追加するとともに、旧アカウントに残っているSPNを明示的に削除する必要がある(忘れるとSPN重複エラーの原因になる)"
      - "SPNの変更にはドメインの機能レベルを引き上げる必要がある"
    answerIndex: 2
    explanation: "SPNの追加と削除は完全に独立した操作です。サービスの実行アカウントを変更した際、旧アカウントに登録されていたSPNを削除せずに新アカウントへSPNを追加してしまうと、同じSPNが両方のアカウントに残ってしまい、KDC_ERR_PRINCIPAL_NOT_UNIQUEエラーの原因になります。"

  - question: "`setspn -A`と`setspn -S`の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "-Aと-Sはまったく同じ動作をする、単なる別名のオプションである"
      - "-Aは指定したSPNをそのまま追加するだけで重複チェックを行わないが、-Sは追加前にフォレスト全体で重複がないことを確認してから追加する、より安全なオプションである"
      - "-Aはユーザーアカウント用、-Sはコンピューターアカウント用のオプションである"
      - "-AはSPNを削除するオプション、-SはSPNを追加するオプションである"
    answerIndex: 1
    explanation: "-Aは指定したSPNをそのまま追加するだけで、フォレスト内の他のアカウントに同じSPNが既に登録されていないかを確認しません。一方-Sは、追加前にフォレスト全体を検索して重複がないことを確認したうえで追加してくれる、より安全なオプションです。"

  - question: "SPNが正しく登録されていない、あるいは重複して解決できない場合に起こりうる現象について、記事の説明に最も合致するものはどれか。"
    choices:
      - "常に明確なエラーメッセージが表示され、ユーザーはすぐに問題に気づける"
      - "Windowsが(構成によっては)Kerberos認証を諦めてNTLM認証に静かにフォールバックすることがあり、認証自体は成功しているように見えるため気づきにくい"
      - "そのコンピューター自体がドメインから自動的に脱退させられる"
      - "AD DS全体のレプリケーションが停止する"
    answerIndex: 1
    explanation: "SPNが正しく登録されていない、あるいは重複していて解決できない場合、Windowsは構成によってはKerberos認証を諦めてNTLM認証にフォールバックすることがあります。これは明確なエラーとして現れず、「認証は通るが、なぜかNTLMが使われている」という一見動いているように見える状態になるため、実務で気づきにくく厄介です。"
