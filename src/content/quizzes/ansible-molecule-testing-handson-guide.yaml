questions:
  - question: "Moleculeの冪等性テストが検証する内容として正しいのはどれか。"
    choices:
      - "プレイブックが1回目の実行でエラーなく完了するかどうか"
      - "同じプレイブックを2回実行し、2回目の実行で`changed`なタスクが報告されないかどうか"
      - "プレイブックの実行速度が一定以下であるかどうか"
      - "コンテナのディスク使用量が一定以下であるかどうか"
    answerIndex: 1
    explanation: "冪等性テストは、同じプレイブックを2回実行し、2回目の実行でたった1つでも`changed`なタスクが報告されれば、テスト自体を失敗させる仕組みです。"

  - question: "冪等性テストが失敗する典型的な原因として正しいのはどれか。"
    choices:
      - "すべてのタスクに`name`を指定していること"
      - "`command`/`shell`モジュールに`changed_when`を設定していないこと"
      - "すべてのタスクをロールの中に書いていること"
      - "インベントリファイルをYAML形式で書いていること"
    answerIndex: 1
    explanation: "`command`/`shell`モジュールを使ったタスクに`changed_when`を設定していないと、実際には変更がなくても常に`changed`として報告されてしまい、冪等性テストが失敗する典型的な原因になります。"

  - question: "Molecule 6.0以降における、ロール作成とテストシナリオ追加の正しい手順はどれか。"
    choices:
      - "`molecule init role`だけで、ロールとテストシナリオの両方が作成できる"
      - "`ansible-galaxy role init`でロールを作成し、`molecule init scenario`でテストシナリオを別途追加する"
      - "Molecule 6.0以降では、ロールのテストはサポートされていない"
      - "Dockerを使わずに、テストシナリオを作成することは一切不可能である"
    answerIndex: 1
    explanation: "Molecule 6.0以降では`molecule init role`は廃止されており、ロール自体は`ansible-galaxy role init`で作成し、テストシナリオは`molecule init scenario`で別途追加します。"

  - question: "`verify`ステージの役割として正しいのはどれか。"
    choices:
      - "コンテナを作成する"
      - "Testinfraを使って、実際にサービスが意図した状態になっているかを検証する"
      - "プレイブックの構文エラーだけをチェックする"
      - "コンテナを破棄する"
    answerIndex: 1
    explanation: "`verify`ステージでは、Testinfraを使って、実際にサービスが起動しているか、ポートがリスニングしているかといった、意図した状態になっているかまで検証します。"

  - question: "「プレイブックが成功した」ことと「ロールが正しい」ことの関係として正しいのはどれか。"
    choices:
      - "両者は完全に同じ意味であり、区別する必要はない"
      - "プレイブックがエラーなく実行できたことは、意図した状態への到達や再実行時の冪等性を何も保証しない"
      - "プレイブックが成功すれば、冪等性は自動的に保証される"
      - "ロールが正しければ、プレイブックは常に高速に実行される"
    answerIndex: 1
    explanation: "プレイブックがエラーなく実行できたという事実は、意図した状態に到達したことも、再実行しても同じ結果になることも、何も保証していません。これらはそれぞれ別の保証であり、Moleculeは別々のステージで検証します。"
