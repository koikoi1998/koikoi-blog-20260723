questions:
  - question: "GoogleとYahooが2024年に一括送信者へ義務化した要件として、SPF/DKIM/DMARC認証以外に含まれるものはどれか。"
    choices:
      - "送信ドメインを、毎月変更すること"
      - "RFC 8058に準拠したワンクリック解除機能の実装と、0.3%以下のスパム報告率の維持"
      - "すべてのメールを、暗号化せずに送信すること"
      - "送信者のIPアドレスを、毎回ランダムに変更すること"
    answerIndex: 1
    explanation: "GoogleとYahooの一括送信者要件は、SPF/DKIM/DMARC認証に加え、RFC 8058準拠のワンクリック解除機能の実装と、0.3%以下のスパム報告率の維持という、複数の要件をセットで義務化しています。"

  - question: "RFC 8058が定めるワンクリック解除の実現方法として正しいのはどれか。"
    choices:
      - "List-Unsubscribeヘッダー単体だけで実現される"
      - "List-UnsubscribeヘッダーとList-Unsubscribe-Postヘッダーを組み合わせることで実現される"
      - "メール本文の末尾に、解除用のURLを記載するだけでよい"
      - "送信者のドメインを、DNSから削除することで実現される"
    answerIndex: 1
    explanation: "RFC 8058が定めるワンクリック解除は、List-UnsubscribeヘッダーとList-Unsubscribe-Post: List-Unsubscribe=One-Clickというヘッダーを組み合わせることで、ログインページへの誘導なしに即座に配信停止を完了させます。"

  - question: "トランザクションメールが、ワンクリック解除要件の対象外である理由として正しいのはどれか。"
    choices:
      - "トランザクションメールは、技術的にヘッダーを追加できないから"
      - "トランザクションメールは、利用者からのアクションに対する直接の応答であり、広告・マーケティングメールとは異なる位置づけだから"
      - "トランザクションメールは、GoogleとYahooのサーバーを経由しないから"
      - "トランザクションメールには、送信者のドメインが含まれていないから"
    answerIndex: 1
    explanation: "パスワードリセットや注文確認のような、利用者からのアクションに対する直接の応答であるトランザクションメールは、ワンクリック解除要件の対象外ですが、この分類の判断責任は送信者自身にあります。"

  - question: "「一括送信者」という分類に関する記述として正しいのはどれか。"
    choices:
      - "送信量を減らせば、分類は自動的に解除される"
      - "一度分類されると、その後の送信量にかかわらず、永続的に残るとされている"
      - "この分類は、1年ごとに再評価され、自動的にリセットされる"
      - "この分類は、送信者が自分で申請しない限り、付与されない"
    answerIndex: 1
    explanation: "GoogleやYahooに、いったん「一括送信者」として分類されると、その後、送信量を減らしたとしても、この分類は永続的に残るとされています。"

  - question: "SPF/DKIM/DMARCの位置づけの変化として、この記事が指摘していることとして正しいのはどれか。"
    choices:
      - "SPF/DKIM/DMARCは、今も昔も変わらず、完全にオプションの設定である"
      - "SPF/DKIM/DMARCは、なりすまし対策という元々の役割から、受信ボックスへ到達するための必須の前提条件へと、位置づけが変化している"
      - "SPF/DKIM/DMARCは、2024年に完全に廃止された"
      - "SPF/DKIM/DMARCは、トランザクションメールにのみ適用される"
    answerIndex: 1
    explanation: "SPF/DKIM/DMARCは、もともとなりすまし対策として理解されることが多かったものの、現在では、大手プロバイダーへのメール到達そのものを許可されるための、必須の前提条件に変わっています。"
