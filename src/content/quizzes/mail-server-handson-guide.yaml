questions:
  - question: "このハンズオンで使用するメールボックスの保存形式について、記事の説明に最も合致するものはどれか。"
    choices:
      - "mbox形式を使用し、1つの巨大なファイルにすべてのメールを保存する"
      - "Maildir形式を使用し、`home_mailbox = Maildir/`の設定によって1つのメールが1つの独立したファイルとして保存される"
      - "メールボックスの保存形式は、このハンズオンでは一切設定しない"
      - "データベース(SQL)にすべてのメールを保存する形式を使用する"
    answerIndex: 1
    explanation: "このハンズオンでは`postconf -e 'home_mailbox = Maildir/'`によってMaildir形式を設定し、Dovecot側も同じ形式を参照するよう構成します。Maildir形式では、1つのメールが1つの独立したファイルとして保存されます。"

  - question: "telnetでSMTPコマンドを手打ちする際、メール本文の終わりを示す方法について、記事の説明に最も合致するものはどれか。"
    choices:
      - "本文はいつまでも自由に入力を続けられ、特別な終了記号は不要である"
      - "本文の最後を、単独の`.`(ピリオドのみの行)で明示的に示す必要がある"
      - "`QUIT`というコマンドを入力した瞬間に、自動的に本文が確定する"
      - "本文の終わりは、Enterキーを3回連続で押すことで示される"
    answerIndex: 1
    explanation: "`DATA`コマンドの後に入力する本文は、単独の`.`(ピリオドのみの行)で終える必要があります。これがSMTPにおける「メール本文の終わり」を示す区切りです。"

  - question: "Step3でMaildirディレクトリを確認する目的について、記事の説明に最も合致するものはどれか。"
    choices:
      - "メールサーバーのCPU使用率を確認するため"
      - "送信したメールが、1つの独立したファイルとしてディレクトリ内に増えていることを目で見て確認し、Maildir形式の仕組みを実感するため"
      - "Dovecotのライセンスキーを確認するため"
      - "ファイアウォールの設定を確認するため"
    answerIndex: 1
    explanation: "Step2で送信したメールが`/home/bob/Maildir/new/`に1つのファイルとして存在していることを確認することで、Maildir形式が「1つのメールが1つの独立したファイル」として保存される仕組みを、目で見て体感できます。"

  - question: "SMTPとIMAPのコマンドの書き方の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "SMTPとIMAPのコマンドは、まったく同じ書式で区別がつかない"
      - "IMAPのコマンドには、`a`のような任意のタグ(識別子)を先頭に付けるという、SMTPにはない作法がある"
      - "SMTPのコマンドにのみ、先頭にタグを付ける必要がある(記事の説明と逆)"
      - "IMAPのコマンドは、すべて日本語で入力する必要がある"
    answerIndex: 1
    explanation: "IMAPのコマンドには、SMTPとは異なり、`a`のような任意のタグ(識別子)を先頭に付けるという作法があります。"

  - question: "このハンズオンの価値について、記事の説明に最も合致するものはどれか。"
    choices:
      - "単に「メールが送受信できた」という結果だけが重要であり、各コマンドの意味を理解する必要はない"
      - "HELO・MAIL FROM・RCPT TO・DATAなどのSMTPコマンド、LOGIN・SELECT・FETCHなどのIMAPコマンドが、それぞれ何を宣言・要求しているのかを1つずつ振り返ることに価値がある"
      - "このハンズオンは、実務でのトラブルシューティングには一切役立たない、学習専用の内容である"
      - "メールクライアント(Outlookなど)を使わずにメールサーバーを検証することは、技術的に不可能である"
    answerIndex: 1
    explanation: "このハンズオンの価値は、結果だけでなく、各SMTP/IMAPコマンドが何を宣言・要求しているのかを1つずつ振り返ることにあります。telnetやopenssl s_clientでこれらのコマンドを手打ちして反応を確認する手法は、メールクライアントというブラックボックスを介さずに、プロトコルレベルで問題を切り分ける実務上有効な診断手法です。"
