questions:
  - question: "DNSの応答が抱える構造的な弱点として正しいのはどれか。"
    choices:
      - "応答のサイズが常に大きすぎる"
      - "応答が本当に正規の権威サーバーから来たものかを、プロトコル自体が証明する手段を持たない"
      - "UDPではなくTCPしか使えない"
      - "応答に必ずTTLが含まれてしまう"
    answerIndex: 1
    explanation: "DNSプロトコル自体には送信元を証明する仕組みがなく、これがDNSキャッシュポイズニングを成立させる原因になっています。"

  - question: "DNSSECを構成する3種類のレコードの役割として正しい組み合わせはどれか。"
    choices:
      - "RRSIGは公開鍵、DNSKEYは署名、DSはハッシュ値"
      - "RRSIGは署名、DNSKEYは公開鍵、DSは親ゾーンに登録されるハッシュ値"
      - "RRSIGはハッシュ値、DNSKEYは署名、DSは公開鍵"
      - "3つとも同じ役割を持つ冗長なレコードである"
    answerIndex: 1
    explanation: "RRSIGは個々のレコードへの署名、DNSKEYはその検証用の公開鍵、DSは親ゾーンに登録される子ゾーンのDNSKEYのハッシュ値です。"

  - question: "DNSSECが提供する保証として正しいのはどれか。"
    choices:
      - "DNSの通信内容の暗号化(機密性)"
      - "応答が改ざんされていないこと(完全性)と正規の発行元であること(真正性)の証明"
      - "DNSサーバーの応答速度の向上"
      - "ゾーン転送の自動化"
    answerIndex: 1
    explanation: "DNSSECが提供するのは完全性と真正性の証明であり、暗号化(機密性)は別の仕組み(DoH/DoT)が担います。"

  - question: "信頼の連鎖(Chain of Trust)の説明として正しいのはどれか。"
    choices:
      - "各ゾーンが独立して自分の公開鍵を保証する仕組み"
      - "親ゾーンが子ゾーンの公開鍵を、ルートゾーンまで階層を辿って保証する仕組み"
      - "クライアントが直接すべての権威サーバーと鍵を交換する仕組み"
      - "TTLの値によって信頼度が決まる仕組み"
    answerIndex: 1
    explanation: "信頼の連鎖は、親ゾーンが子ゾーンのDNSKEYをDSレコードで保証し、それをルートゾーンまで階層的に繰り返すことで成立します。"

  - question: "DNSSEC対応ドメインが鍵のローテーション後に突然名前解決できなくなる典型的な原因はどれか。"
    choices:
      - "TTLの値を変更し忘れたため"
      - "親ゾーンへのDSレコードの更新を忘れたため"
      - "ゾーンファイルのシリアル番号を上げ忘れたため"
      - "digコマンドのバージョンが古いため"
    answerIndex: 1
    explanation: "鍵をローテーションした際に親ゾーンのDSレコードを更新し忘れると、信頼の連鎖が途切れ、検証全体が失敗して名前解決ができなくなります。"
