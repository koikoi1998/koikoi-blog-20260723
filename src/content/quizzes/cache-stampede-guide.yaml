questions:
  - question: "キャッシュスタンピードの正しい説明はどれか。"
    choices:
      - "キャッシュが故障して、データが失われる現象"
      - "人気のあるキャッシュエントリのTTLが切れた瞬間、同時多発的なリクエストが一斉にキャッシュミスとなり、オリジンサーバーへ押し寄せる現象"
      - "キャッシュの保存期間を無限にする設定"
      - "複数のプロキシが互いに通信できなくなる現象"
    answerIndex: 1
    explanation: "キャッシュスタンピードは、人気のあるキャッシュエントリのTTLが切れた瞬間、そのキーへの同時多発的なリクエストすべてが一斉にキャッシュミスとなり、オリジンサーバーへ押し寄せる現象です。"

  - question: "リクエストの集約(single-flight)の仕組みとして正しいのはどれか。"
    choices:
      - "すべてのリクエストを、個別にオリジンサーバーへ転送する"
      - "最初の1本だけを実際にオリジンサーバーへ転送し、残りのリクエストは結果が返ってくるまで待機させる"
      - "リクエストをランダムに拒否する"
      - "キャッシュそのものを無効化する"
    answerIndex: 1
    explanation: "リクエストの集約は、同じキーに対する複数の同時リクエストがあった場合、最初の1本だけを実際にオリジンサーバーへ転送し、残りのリクエストは結果が返ってくるまで待機させる仕組みです。"

  - question: "stale-while-revalidateの仕組みとして正しいのはどれか。"
    choices:
      - "TTLが切れたら、即座にエラーを返す"
      - "TTLが切れた直後の一定期間、古いデータをそのまま即座に返しつつ、裏側で1本だけ再検証リクエストを送る"
      - "キャッシュを完全に無効化する"
      - "すべてのリクエストを拒否する"
    answerIndex: 1
    explanation: "stale-while-revalidateは、TTLが切れた直後の一定期間、古い(stale)データをそのままクライアントへ即座に返しつつ、裏側で1本だけオリジンサーバーへの再検証リクエストを送る仕組みです。"

  - question: "TTLジッターの役割として正しいのはどれか。"
    choices:
      - "TTLの値を常に無限に設定する"
      - "設定したTTLの値に小さなランダムな揺らぎを加えることで、複数のキャッシュエントリの期限切れのタイミングをずらす"
      - "キャッシュの保存場所をランダムに変更する"
      - "すべてのリクエストをランダムな順序で処理する"
    answerIndex: 1
    explanation: "TTLジッターは、設定したTTLの値に小さなランダムな揺らぎを加えることで、複数のキャッシュエントリの期限切れのタイミングをわずかにずらし、一斉期限切れを防ぎます。"

  - question: "キャッシュスタンピードという現象の、本質的な特徴として正しいのはどれか。"
    choices:
      - "個々のコンポーネントのバグが原因で発生する"
      - "個々のリクエスト・個々のキャッシュの挙動は正しいにもかかわらず、それが大量に同時発生したときに障害となる"
      - "常にネットワーク障害が原因である"
      - "キャッシュを導入していない環境でのみ発生する"
    answerIndex: 1
    explanation: "キャッシュスタンピードの恐ろしさは、個々のリクエスト・個々のキャッシュの挙動を見ると何も間違っていないにもかかわらず、その『正しい挙動』が大量に同時発生したときにだけ障害として現れる点にあります。"
