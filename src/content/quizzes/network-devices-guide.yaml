questions:
  - question: "あるオフィスで、5台のPCをリピーターハブ1台に接続してLANを構成している。この構成に関する記述のうち、最も適切なものはどれか。"
    choices:
      - "各ポートが独立したコリジョンドメインを持つため、全二重通信が可能である"
      - "全ポートが1つのコリジョンドメインを共有するため、CSMA/CDによる半二重動作が必要になる"
      - "各ポートが独立したブロードキャストドメインを持つため、VLANを設定しなくてもセグメントが分離される"
      - "宛先MACアドレスを見て転送先ポートを絞り込むため、フラッディングは発生しない"
    answerIndex: 1
    explanation: "リピーターハブは電気信号をそのまま増幅・再送するだけのL1装置で、全ポートが1つのコリジョンドメインを共有します。宛先の判断を一切行わないため、CSMA/CDによる半二重動作が前提になります。"

  - question: "「スイッチングハブ」という呼び方についての説明として、最も正確なものはどれか。"
    choices:
      - "リピーターハブに信号増幅機能を追加した、L1で完結する上位互換の装置である"
      - "L2スイッチと呼ばれる装置と内部動作(MACアドレス表に基づく転送)は同一で、物理的な見た目がリピーターハブと共通していたため日本市場で区別用に定着した通称である"
      - "L3スイッチの略称であり、VLAN間ルーティング機能を持つことを示す名称である"
      - "STPを実装していない、ループ検知機能を持たない安価なスイッチのみを指す名称である"
    answerIndex: 1
    explanation: "スイッチングハブ・SWハブ・L2SWは実務上ほぼ同じ装置(MACアドレス学習に基づき転送するL2スイッチ)を指します。呼び方の違いは、日本の家庭用市場での通称か技術用語かという文脈の違いによるものです。"

  - question: "MACアドレス表が空の状態のL2スイッチにおいて、PC-AからPC-B宛にフレームが送信された直後の挙動として正しいものはどれか。ただしPC-Bはこれ以前に一度も送信していないものとする。"
    choices:
      - "宛先MACアドレス(PC-B)が未学習のため、受信ポート以外の全ポートにフラッディングされる"
      - "宛先MACアドレスが不明な場合、スイッチはそのフレームを即座に破棄する"
      - "スイッチは送信元MACアドレス(PC-A)を学習せず、宛先MACアドレスのみを学習の対象にする"
      - "未学習の宛先MACアドレス宛のフレームは、自動的にデフォルトVLANにのみ転送される"
    answerIndex: 0
    explanation: "スイッチはまず送信元MACアドレスと受信ポートの組を学習します。宛先MACアドレスが未学習(または宛先がブロードキャスト)の場合は、受信ポート以外の全ポートへフラッディングされます。"

  - question: "「L2スイッチ配下であれば、コリジョンは絶対に発生しない」という主張について、最も適切な指摘はどれか。"
    choices:
      - "正しい。スイッチは各ポートを独立したコリジョンドメインにするため、コリジョンは構造上発生し得ない"
      - "誤り。ポート間でデュプレックス設定(全二重/半二重)が食い違うデュプレックスミスマッチが起きると、半二重側でレイトコリジョンが発生しうる"
      - "誤り。VLANを設定していないポート同士では常にコリジョンが発生する"
      - "正しい。ただしカットスルー方式を採用している場合に限り、コリジョンが発生することがある"
    answerIndex: 1
    explanation: "全二重通信が正しく成立している限りコリジョンは発生しませんが、デュプレックスミスマッチが起きると半二重側は依然CSMA/CD的な挙動の影響を受け、レイトコリジョンが発生しえます。「スイッチ配下=無条件にコリジョンフリー」ではありません。"

  - question: "802.1QタグのVID(VLAN Identifier)フィールドのビット数と、それによって識別可能なVLANの理論上の最大数の組み合わせとして正しいものはどれか。"
    choices:
      - "8ビット、256個"
      - "12ビット、4094個"
      - "16ビット、65536個"
      - "3ビット、8個"
    answerIndex: 1
    explanation: "VIDは12ビットのフィールドで、0〜4094が有効な値として使われ、理論上4094個のVLANを識別できます(TPIDは16ビットの固定値0x8100、PCPは3ビット、DEIは1ビットです)。"

  - question: "2台のスイッチ間をトランクポートで接続する際、片方のネイティブVLANが10、もう片方が20に設定されていた場合に起きる問題として最も適切なものはどれか。"
    choices:
      - "トランクポート自体が確立できず、リンク自体がダウンする"
      - "タグなしフレームが送信側の意図と異なるVLANとして受信側で解釈され、意図しないVLAN間でフレームが混線する"
      - "STPが自動的に検知し、該当ポートをブロック状態にするため通信への影響は生じない"
      - "802.1Qタグ付きフレームの転送そのものが完全に停止する"
    answerIndex: 1
    explanation: "ネイティブVLANは、トランクポート上のタグなしフレームをどのVLANとして扱うかを決める設定です。両端で不一致があると、タグなしフレームが意図しないVLANに割り当てられ、混線の原因になります。"

  - question: "IEEE 802.1D規格のデフォルトタイマー(Hello 2秒、Forward Delay 15秒、Max Age 20秒)に基づくと、ポートがBlocking状態からForwarding状態に遷移するまでにかかるおおよその時間として最も近いものはどれか。"
    choices:
      - "2〜4秒程度"
      - "15秒程度"
      - "30〜50秒程度"
      - "20秒程度(Max Ageの時間のみに依存する)"
    answerIndex: 2
    explanation: "Blocking→Listening→Learning→Forwardingの遷移のうち、Listening・LearningそれぞれでForward Delay(15秒)を要するため、合計で理論上30〜50秒程度のコンバージェンス時間がかかります。これがRSTPで改善される課題です。"

  - question: "「ルーターオンアスティック」構成と比較した、L3スイッチによるインターVLANルーティングの利点として、最も適切なものはどれか。"
    choices:
      - "L2スイッチと外部ルーターを結ぶ1本のトランクリンクの帯域がボトルネックにならず、ワイヤースピードでのルーティングが可能になる"
      - "NATやVPN終端など、WAN側の高度な機能を新たに利用できるようになる"
      - "インターネットのBGPフルルートを収容できるようになる"
      - "STPが不要になり、冗長構成を組む必要がなくなる"
    answerIndex: 0
    explanation: "ルーターオンアスティックでは、VLAN間通信のたびに1本のトランクリンクを往復する必要があり帯域がボトルネックになりやすい構成でした。L3スイッチはルーティング機能を筐体内部に組み込むことでこの制約を解消します。"

  - question: "L3スイッチ・ルーターのハードウェア転送(TCAMベースのファストパス)に関する記述のうち、最も正確なものはどれか。"
    choices:
      - "すべてのパケットは例外なくTCAM参照のみで転送が完結し、CPUが関与することは一切ない"
      - "TTLが0になったパケットやIPオプション付きパケットなど、ファストパスで処理しきれない一部のパケットは、CPU(コントロールプレーン)にパント(Punt)されてソフトウェアで処理される"
      - "パント処理は存在するが、通常のハードウェア転送と処理速度に有意な差はない"
      - "パント処理はACLが設定されている機器でのみ発生し、経路情報のみを扱う場合は発生しない"
    answerIndex: 1
    explanation: "ファストパスで処理できない一部のパケット(TTL超過、IPオプション付き、ARP要求など)はCPUにパントされ、ソフトウェアで処理されます。この処理は通常のハードウェア転送より桁違いに低速です。"

  - question: "あるデータセンターで、キャンパスネットワーク内の複数VLAN間を高速に相互接続しつつ、同時にインターネットのフルルート(90万経路超)を保持してISPと直接BGPピアリングする必要がある。機器選定として最も適切なものはどれか。"
    choices:
      - "L3スイッチ1台のみで両方の要件を満たすのが一般的である"
      - "VLAN間ルーティングにはL3スイッチを使いつつ、フルルート収容とBGPピアリングには相応の規模のルーティングテーブルを収容できるルーターを用いるのが一般的である"
      - "リピーターハブとL2スイッチの組み合わせだけで両方の要件を満たせる"
      - "STPを無効化すれば、L3スイッチでもフルルートを問題なく収容できる"
    answerIndex: 1
    explanation: "L3スイッチはTCAM容量の制約からインターネットのフルルートを収容できない機種が多く、ISPエッジには不向きです。VLAN間ルーティングはL3スイッチ、WAN境界・フルルート収容はルーターという住み分けが実務上の基本です。"

  - question: "CAMテーブルオーバーフロー攻撃(MACフラッディング攻撃)が成立する根本的な理由として、最も適切なものはどれか。"
    choices:
      - "L2スイッチは送信元MACアドレスを無条件に(名乗ったもの勝ちで)学習するため、大量の偽の送信元MACアドレスでMACアドレス表の容量を枯渇させられるから"
      - "VLANタグが暗号化されずに送信されるため、第三者が容易に読み取れるから"
      - "STPのBPDUに認証機能がないため、偽のルートブリッジを名乗れるから"
      - "802.1QタグのVIDフィールドが12ビットしかなく、値の推測が容易だから"
    answerIndex: 0
    explanation: "L2スイッチのMACアドレス学習は送信元MACアドレスを無条件に信頼して学習する前提の上に成り立っています。この性質を悪用し大量の偽MACアドレスでテーブルを枯渇させ、以降のフレームをフラッディングさせるのがCAMテーブルオーバーフロー攻撃です。"
