questions:
  - question: "iSCSIとNFSの、動作するレイヤーの違いとして正しいのはどれか。"
    choices:
      - "iSCSIはファイルレベル、NFSはブロックレベルで動作する"
      - "iSCSIはブロックレベル、NFSはファイルレベルで動作する"
      - "両者は完全に同じレイヤーで動作する"
      - "どちらも、レイヤーという概念とは無関係である"
    answerIndex: 1
    explanation: "iSCSIはディスクそのもの(ブロックデバイス)を渡すブロックレベル、NFSはすでに整理されたディレクトリツリーを渡すファイルレベルで動作します。"

  - question: "iSCSIで、同じLUNへ複数のクライアントが無秩序に同時アクセスした場合のリスクとして正しいのはどれか。"
    choices:
      - "リスクは一切発生しない"
      - "クラスタ対応のファイルシステムを使っていない限り、データが破損する危険性がある"
      - "自動的にデータが暗号化される"
      - "通信速度が自動的に向上する"
    answerIndex: 1
    explanation: "iSCSIで、同じLUNへ複数のクライアントが無秩序に同時アクセスすると、クラスタ対応のファイルシステムを使っていない限り、データが破損する危険性があります。"

  - question: "NFSv3とNFSv4の、設計思想における決定的な違いとして正しいのはどれか。"
    choices:
      - "NFSv3はステートフル、NFSv4はステートレスである"
      - "NFSv3はステートレスでロックを別の補助プロトコルに任せ、NFSv4はロックの仕組みをプロトコル自体に統合してステートフルになった"
      - "両者に設計上の違いはまったくない"
      - "NFSv4は、ファイルの読み書き自体をサポートしていない"
    answerIndex: 1
    explanation: "NFSv3はステートレスでファイルロックをNLMという別の補助プロトコルに任せていましたが、NFSv4はロックの仕組みをプロトコル自体に統合し、ステートフルな設計へと変わりました。"

  - question: "NFSv4が、ファイアウォール越しの運用を大幅に容易にした理由として正しいのはどれか。"
    choices:
      - "暗号化を完全に廃止したため"
      - "通信がTCPポート2049番、1つだけに集約されたため"
      - "すべてのポートを常に開放する必要があるため"
      - "NFSv4では、ネットワーク通信自体が不要になったため"
    answerIndex: 1
    explanation: "NFSv4は、ロックの仕組みをプロトコル自体に統合し、通信がTCPポート2049番、1つだけに集約されたため、ファイアウォール越しの運用が大幅に容易になりました。"

  - question: "『ブロックか、ファイルか』という選択の、正しい捉え方として正しいのはどれか。"
    choices:
      - "常にブロックレベルの方が技術的に優れている"
      - "技術的な優劣ではなく、要件に対する適合性の問題である"
      - "常にファイルレベルの方が技術的に優れている"
      - "どちらを選んでも、結果はまったく同じである"
    answerIndex: 1
    explanation: "iSCSIとNFSは優劣の関係にはなく、クライアント側でファイルシステムを自分で決めたいか、複数クライアントから同じデータへ安全に同時アクセスしたいかという、要件の違いが、どちらを選ぶべきかを決定します。"
