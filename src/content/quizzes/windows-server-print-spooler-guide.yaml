questions:
  - question: "スプーラー(Print Spooler)の役割として正しいのはどれか。"
    choices:
      - "印刷データを受信した瞬間、直接プリンターへ流し込む"
      - "印刷ジョブを一時的なファイルとして保存し、キューとして順番に管理する"
      - "プリンタードライバーを自動的に更新する"
      - "ネットワーク越しのファイル共有を管理する"
    answerIndex: 1
    explanation: "スプーラーは、印刷ジョブを実際にプリンターへ送信する前に、一時的なファイルとして保存し、キューとして順番に管理します。"

  - question: "印刷ジョブを一時ファイルとして保存する設計の利点として正しいのはどれか。"
    choices:
      - "プリンターの印字品質が向上する"
      - "クライアントがプリンターの処理速度を待たずに、すぐ次の作業へ戻れる"
      - "印刷データが自動的に暗号化される"
      - "プリンターのインク消費量が削減される"
    answerIndex: 1
    explanation: "一時ファイルとしてスプールすることで、クライアントは送信さえ完了すればよく、プリンター側の処理速度を待つ必要がなくなります。"

  - question: "印刷ジョブが詰まる現象の、多くの場合の原因として正しいのはどれか。"
    choices:
      - "スプーラーサービス自体のバグ"
      - "特定の印刷ジョブを処理する過程での、プリンタードライバーの異常(ハングアップ)"
      - "ネットワークケーブルの物理的な断線"
      - "Windows Updateの適用漏れ"
    answerIndex: 1
    explanation: "印刷ジョブの詰まりの多くは、スプーラーサービス自体ではなく、プリンタードライバーがハングアップすることが原因です。"

  - question: "「スプーラーサービスを再起動する」という対処法が効果を持つ理由として正しいのはどれか。"
    choices:
      - "プリンターのファームウェアが自動的に更新されるため"
      - "spoolsv.exeプロセス全体を再起動することで、ハングアップしたドライバーの状態を強制的にリセットするため"
      - "印刷データがすべて暗号化し直されるため"
      - "ネットワーク接続が再確立されるため"
    answerIndex: 1
    explanation: "スプーラーサービスの再起動は、spoolsv.exeプロセス全体を再起動し、ハングアップしたドライバーの異常な状態を強制的にリセットします。"

  - question: "ドライバーの隔離(Printer Driver Isolation)の効果として正しいのはどれか。"
    choices:
      - "すべてのプリンタードライバーを1つのプロセスに統合する"
      - "特定のドライバーがハングアップしても、影響を隔離された個別のプロセス内に留める"
      - "印刷ジョブの処理速度を2倍にする"
      - "スプーラーサービス自体を不要にする"
    answerIndex: 1
    explanation: "ドライバーの隔離を有効にすると、特定のドライバーの異常が、他のプリンターへの印刷ジョブやスプーラー本体に影響しなくなります。"
