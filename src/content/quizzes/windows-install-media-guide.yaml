questions:
  - question: "x64とx86の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "x64はx86と完全に同じ命令セットであり、単にクロック周波数が高いだけの製品名の違いである"
      - "x64はレジスタ幅・アドレス空間・命令のエンコード方式が異なる別の動作モードであり、単純な速度差ではない"
      - "x64とx86は、それぞれ異なる会社(IntelとAMD)が独占的に販売している、互換性のない全く無関係な製品である"
      - "x64は主にモバイル端末専用、x86は主にサーバー専用のアーキテクチャである"
    answerIndex: 1
    explanation: "x64はx86の命令セットを拡張した、レジスタ幅・アドレス空間・命令のエンコード方式が異なる別の動作モードです。単純な「高速版」ではなく、CPUが読み取る機械語のバイト列そのものが異なります。"

  - question: "x86版のドライバをx64版OSにインストールしようとした場合の挙動について、記事の説明に最も合致するものはどれか。"
    choices:
      - "通常のアプリケーションと同様に、WoW64という互換レイヤーによって問題なく動作する"
      - "カーネルモードで動くドライバにはWoW64のような互換レイヤーが存在しないため、原則としてインストール自体が拒否されるか読み込みに失敗する"
      - "ドライバは常にアーキテクチャに関係なく動作するよう設計されている"
      - "x86版のドライバは、x64版OSにインストールした瞬間に自動的にx64版へ変換される"
    answerIndex: 1
    explanation: "通常のユーザーモードアプリケーションはWoW64という互換レイヤーにより多くの場合そのまま動作しますが、カーネルモードで動くドライバにはこの互換レイヤーが存在せず、OSのビット幅とドライバのビット幅が一致していない場合、原則としてインストール自体が拒否されるか読み込みに失敗します。"

  - question: "x64/x86が今も統一されずに配布され続けている理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "技術的に統一する方法が存在しないため、原理的に不可能である"
      - "1つのインストーラに両方のアーキテクチャ用のプログラムをまとめる技術自体は存在するが、配布側がその手間とファイルサイズ増加のコストをかけているかどうかの違いである"
      - "各国の法律で、x64とx86のインストーラを別々に配布することが義務付けられているため"
      - "x64とx86は互いに競合する別会社の商標であり、同じファイルに含めることが法律で禁止されているため"
    answerIndex: 1
    explanation: "1つのインストーラファイルに両方のアーキテクチャ用のプログラムをまとめる(ユニバーサルインストーラ)ことは技術的に可能ですが、ファイルサイズが増加するため、配布側がその手間とコストをかけていないケースが多くあります。近年の多くの消費者向けアプリはブートストラッパー形式でこれを吸収していますが、古い配布慣習を引き継いでいるツールでは明示的な選択が残っています。"

  - question: "ISOファイルを右クリックして「マウント」する操作が実際に行っていることについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "ISOファイルの内容を、ディスク上の別の場所へ実際に展開・コピーする"
      - "ISOファイルの内容を、実際に物理的な光学ドライブへディスクを挿入したのと同じ状態として、仮想的な読み取り専用ドライブとして認識させる"
      - "ISOファイル自体を完全に削除し、新しい実行可能ファイルへ変換する"
      - "ISOファイルの内容を、インターネット経由でクラウドサーバーへ自動的にアップロードする"
    answerIndex: 1
    explanation: "マウントは、ISOファイルの内容を実際に物理的な光学ドライブへディスクを挿入したのと同じ状態として、仮想的な読み取り専用のドライブとして認識させる操作です。内容を別の場所へ実際に展開・コピーする操作ではなく、マウントを解除すれば仮想ドライブは消え、元のISOファイル自体はそのまま残ります。"

  - question: "アップデートユーティリティがISO形式で配布されることが多い理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ISO形式は、実行可能ファイルより常にファイルサイズが小さくなるため"
      - "元々物理的なCD/DVDメディアで配布・起動することを前提に作られていた慣習が引き継がれており、物理メディアへ書き込んでサーバーを起動用のメディアとしてブートさせることも可能なため"
      - "ISO形式でなければ、Windowsのライセンス認証が正常に機能しないため"
      - "ISO形式は、ウイルス対策ソフトの検知を回避するために採用されている"
    answerIndex: 1
    explanation: "サーバーのファームウェア・ドライバのアップデートユーティリティがISO形式で配布される背景には、元々物理的なCD/DVDメディアで配布・起動することを前提に作られていた慣習が引き継がれている事情があります。ISO形式であれば物理メディアへ書き込んで起動用のメディアとしてブートさせることもでき、OSが起動できない状態のサーバーでも単体でアップデート作業を行えるという運用上の利点があります。"
