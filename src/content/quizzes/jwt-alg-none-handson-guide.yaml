questions:
  - question: "「alg: none」脆弱性が発生する直接的な原因として正しいのはどれか。"
    choices:
      - "JWTのペイロードが暗号化されていないため"
      - "サーバー側の検証処理が、トークンのヘッダーに書かれたalgの値を無条件に信用し、noneが指定されていれば署名検証をスキップしてしまうため"
      - "JWTのヘッダーがBase64でエンコードされていないため"
      - "トークンの有効期限が設定されていないため"
    answerIndex: 1
    explanation: "サーバー側が、トークン自身のヘッダーに書かれたalgの値を無条件に信用し、noneの場合に署名検証をスキップしてしまうことで、この脆弱性が発生します。"

  - question: "このハンズオンで、脆弱な検証エンドポイントに偽造トークンを送信した結果として正しいのはどれか。"
    choices:
      - "署名がないため、即座に拒否された"
      - "署名を一切付けていないにもかかわらず、role: adminという偽装した権限がそのまま受理された"
      - "サーバーがクラッシュした"
      - "トークンの内容が自動的に修正された"
    answerIndex: 1
    explanation: "脆弱な実装では、alg: noneが指定されると署名検証自体がスキップされ、偽装したペイロードの内容がそのまま受理されてしまいました。"

  - question: "「alg: none」脆弱性に対する、正しい防御方法はどれか。"
    choices:
      - "ペイロードのサイズを制限する"
      - "サーバー側があらかじめ許可するアルゴリズムのリストを持ち、トークンのヘッダーのalgがそれに一致しない場合は無条件に拒否する"
      - "トークンの有効期限を短くする"
      - "HTTPSを使用する"
    answerIndex: 1
    explanation: "正しい防御は、トークンのヘッダーに書かれたalgを信用せず、サーバー側があらかじめ固定した許可リストと照合することです。"

  - question: "このハンズオンが示す、最も重要な設計原則として正しいのはどれか。"
    choices:
      - "すべての入力を暗号化すれば安全である"
      - "信頼できない入力の中身を、その入力自体をどう検証するかという、検証方法そのものの決定に使ってはならない"
      - "署名アルゴリズムは、常に最新のものを使えばよい"
      - "JWTの代わりに、セッションベースの認証を常に使うべきである"
    answerIndex: 1
    explanation: "トークンのヘッダーという信頼できない入力に、検証方法そのものを決めさせてはならない、という原則が、このハンズオンの核心です。"

  - question: "「alg: none」脆弱性と、HTTPリクエストスマグリングの根底にある共通点として正しいのはどれか。"
    choices:
      - "両方とも、TLSの実装に起因する問題である"
      - "どちらも、信頼できない入力(あるいは矛盾した入力)を、無条件に解釈・信用してしまうことから生まれる問題である"
      - "両方とも、DNSの設定ミスが原因である"
      - "両方とも、同じソフトウェアでのみ発生する問題である"
    answerIndex: 1
    explanation: "どちらも、信頼できない、あるいは矛盾した入力を、無条件に解釈・信用してしまうという、共通の構造から生まれる問題です。"
