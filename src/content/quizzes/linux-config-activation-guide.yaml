questions:
  - question: "設定ファイルが「効く」ようになる仕組みとして、記事内で説明されている内容はどれか。"
    choices:
      - "設定ファイル自体がOSによって常に監視されており、保存すると自動的にすべてのプログラムへ通知される"
      - "設定ファイルには実行力がなく、それを読み込んでパースし内部データ構造に変換して使う「デーモン」が存在して初めて効くようになる"
      - "設定ファイルはカーネルによって直接コンパイルされ、実行可能な形式に変換される"
      - "設定ファイルは常にroot権限を持つ特別なプロセスとして実行される"
    answerIndex: 1
    explanation: "設定ファイルそのものには何かを実行する力はなく、それを読み込み(open()/read())、パースして内部データ構造に変換し、実際の処理で参照するデーモンがあって初めて「効いた」ことになります。"

  - question: "稼働中のデーモンに設定変更を反映させる「reload」操作について、正しい説明はどれか。"
    choices:
      - "プロセスを一度完全に終了させ、新しいプロセスとして起動し直す操作である"
      - "プロセスを終了させずにシグナル(SIGHUPなど)で「設定を読み直せ」と指示する操作で、稼働中の接続を維持したまま新しい設定を反映できることが多い"
      - "OS全体を再起動する操作である"
      - "設定ファイルを自動的にバックアップする操作である"
    answerIndex: 1
    explanation: "reloadはプロセスを終了させず、SIGHUPのようなシグナルで設定の再読み込みを指示する操作です。稼働中の接続を切らずに新しい設定を反映できる利点がありますが、すべての設定項目がreloadで反映できるとは限りません。"

  - question: "ユーザー空間デーモンの設定(ipsec.confなど)と、カーネルパラメータ(sysctl)の設定の、反映経路の違いとして正しいものはどれか。"
    choices:
      - "両者はまったく同じ経路で反映される"
      - "ユーザー空間デーモンの設定はデーモン自身が自プロセスのメモリ上のデータ構造を更新するのに対し、sysctlはコマンドが/proc/sysへの書き込みを通じてカーネル内部の変数を直接更新する"
      - "sysctlは常にデーモンの再起動が必要だが、ipsec.confは保存するだけで自動的に反映される"
      - "ユーザー空間デーモンの設定はネットワーク経由でしか反映できない"
    answerIndex: 1
    explanation: "ipsec.confのようなユーザー空間デーモンの設定は、デーモン自身がパースして自プロセスのメモリ上のデータ構造を更新するのに対し、sysctlはコマンドが/proc/sysへの書き込みを通じてカーネル内部の変数を直接更新するという、まったく異なる反映経路を持ちます。"

  - question: "設定ファイルに構文エラーがある場合、多くのデーモンで何が起きるか。"
    choices:
      - "エラーのある行だけを自動的に無視し、残りの設定で正常に起動する"
      - "起動処理の途中で読み込み・解釈に失敗し、多くの場合そこで起動自体を中止する"
      - "構文エラーは無視され、デフォルト値がすべての項目に自動的に適用される"
      - "OS全体がクラッシュする"
    answerIndex: 1
    explanation: "設定ファイルに構文エラーがあると、デーモンは起動処理の途中でパースに失敗し、多くの場合そこで起動自体を中止します。設定ファイルは文法として正しく解釈できて初めて効く候補になります。"

  - question: "多くの伝統的なLinuxデーモンが、YAMLやJSONのような汎用フォーマットではなく独自の設定ファイル形式を採用している理由として、記事内で説明されているものはどれか。"
    choices:
      - "汎用フォーマットはLinuxカーネルが技術的にサポートしていないため"
      - "設定ファイルのパーサーがそのデーモンの実装の一部であり、開発者が自由に形式を選べ、外部ライブラリへの依存を減らし起動を高速化できるという実務上の利点があるため"
      - "独自形式の方が人間にとって必ず読みにくく、意図的に難読化するため"
      - "汎用フォーマットは1つのファイルに1つの設定項目しか書けない制限があるため"
    answerIndex: 1
    explanation: "設定ファイルのパーサーはそのデーモン自身の実装の一部であるため、開発者は自分たちの都合に合わせて形式を自由に選べます。外部ライブラリへの依存を減らし起動を高速化できるという実務上の利点もあります。"
