questions:
  - question: "旧DCの降格が完了した後、ドメイン機能レベルはどうなるか。"
    choices:
      - "自動的に最新のレベルまで引き上げられる"
      - "明示的にコマンドを実行しない限り、自動的には引き上げられない"
      - "降格と同時に強制的にリセットされる"
      - "旧DCのOSバージョンに応じて自動計算される"
    answerIndex: 1
    explanation: "機能レベルは、旧DCが降格されたからといって自動的に引き上げられるわけではなく、明示的にコマンドを実行する必要があります。"

  - question: "機能レベルの引き上げについて、正しい説明はどれか。"
    choices:
      - "いつでも元のレベルに引き下げられる、可逆的な操作である"
      - "不可逆な操作であり、一度引き上げると古いOSバージョンのDCを追加できなくなる"
      - "引き上げても、DCの機能には一切影響がない"
      - "ドメイン管理者権限がなくても実行できる"
    answerIndex: 1
    explanation: "機能レベルの引き上げは不可逆な操作です。一度引き上げると、それより古いOSバージョンのDCを、そのドメインに追加できなくなります。"

  - question: "フォレスト機能レベルを引き上げるために必要な前提条件は何か。"
    choices:
      - "フォレスト内のいずれか1つのドメインだけが目的のレベルに達していればよい"
      - "フォレスト内のすべてのドメインが、少なくとも同じレベルのドメイン機能レベルに達している必要がある"
      - "特に前提条件はなく、いつでも自由に引き上げられる"
      - "フォレスト内のDC台数が偶数である必要がある"
    answerIndex: 1
    explanation: "フォレスト機能レベルを引き上げるには、フォレスト内のすべてのドメインが、少なくとも引き上げ後と同じレベルのドメイン機能レベルに達している必要があります。"

  - question: "機能レベルの引き上げが不可逆である根本的な理由は何か。"
    choices:
      - "Microsoftのライセンス規約でそう定められているため"
      - "新機能を使い始めると、古いバージョンのDCにはそれを正しく処理する能力自体がないため"
      - "機能レベルの値がハードウェアに直接書き込まれるため"
      - "不可逆にすることで、ライセンス費用を削減できるため"
    answerIndex: 1
    explanation: "新しい機能レベルが前提とする新機能を使い始めると、古いバージョンのDCにはそれを正しく処理する能力自体が存在しないため、後方互換性を壊さないよう、引き下げの道が閉ざされています。"

  - question: "マルチドメインのフォレストで、フォレスト機能レベルは実質的にどのように定まるか。"
    choices:
      - "最も新しいドメイン機能レベルに自動的に合わせられる"
      - "その時点でのドメイン機能レベルの最低値が、事実上の上限になる"
      - "各ドメインのフォレスト機能レベルは互いに独立しており、影響し合わない"
      - "フォレストルートドメインの機能レベルだけが基準になる"
    answerIndex: 1
    explanation: "フォレスト機能レベルは、事実上、その時点でのドメイン機能レベルの最低値を上限として定められます。"
