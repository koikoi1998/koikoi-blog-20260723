questions:
  - question: "見た目が同じファイル名なのに、PowerShellで確認した文字数が異なる現象について、記事の説明に最も合致するものはどれか。"
    choices:
      - "PowerShellの.Lengthプロパティにはバグがあり、常に不正確な値を返す"
      - "濁点やアクセント記号を含む文字には、1つのコードポイントで表現する合成済み形式(NFC)と、複数のコードポイントの組み合わせで表現する分解形式(NFD)という2つの表現方法があり、見た目は同一だがコードポイント数が異なるため"
      - "Windowsのバージョンによって、同じ文字でも文字数の数え方が完全にランダムに変化する"
      - "ファイル名の文字数は、ファイルの実際のデータサイズ(バイト数)と常に一致する"
    answerIndex: 1
    explanation: "濁点やアクセント記号を含む文字には、1つのコードポイントで表現する合成済み形式(NFC)と、ベースの文字と結合文字の組み合わせで表現する分解形式(NFD)という2つの表現方法が存在します。画面上の見た目(グリフ)は完全に同一ですが、内部的なコードポイントの数が異なるため、.Lengthプロパティが返す文字数も異なります。"

  - question: "Windows(NTFS)上で、合成済み形式と分解形式の同名ファイルが別々のファイルとして共存できる理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "NTFSはファイル名の大文字・小文字を区別しない比較は行うが、Unicode正規化(合成済み形式と分解形式の統一)は行わないため"
      - "NTFSは、そもそも日本語のファイル名を一切保存できない仕様になっているため"
      - "Windowsは、1つのフォルダーに2つ以上のファイルを絶対に保存できない仕様になっているため"
      - "NTFSはファイル名の比較を一切行わず、常にすべてのファイルを異なるものとして扱う"
    answerIndex: 0
    explanation: "NTFSは大文字・小文字を区別しない比較は行いますが、合成済み形式と分解形式という異なるコードポイント列を「同じ名前」として扱うUnicode正規化は行いません。そのため見た目が完全に同一のファイル名でも、別々のファイルとして同じフォルダー内に共存できます。"

  - question: "BOXなどのクラウドストレージへの移行時に「同名ファイルが既に存在する」というエラーが発生する理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "BOXのサーバーが、アップロードされたファイルの内容を一切保存できない容量制限に達しているため"
      - "BOXなどのクラウドストレージは、多くの場合ファイル名をUnicode正規化した上で比較するため、Windows上では別々のファイルとして共存していたものが、正規化後は同一の文字列として判定されるため"
      - "BOXは、日本語のファイル名のアップロードを技術的に一切サポートしていないため"
      - "Windows側のファイルがすべて自動的に削除され、BOX側だけにファイルが残るため"
    answerIndex: 1
    explanation: "BOXなどのクラウドストレージは、ファイルのアップロード・同期処理においてファイル名をUnicode正規化した上で比較する実装が一般的です。正規化処理により、合成済み形式・分解形式のどちらでエンコードされていたファイル名も同じ形式(多くはNFC)に変換されるため、Windows上で別々のファイルとして共存していたものが「同じ名前」と判定され、衝突・失敗します。"

  - question: "分解形式のファイル名が生まれやすい典型的な原因について、記事の説明に最も合致するものはどれか。"
    choices:
      - "分解形式のファイル名は、Windows Updateを実行するたびにランダムに生成される"
      - "macOSが伝統的に採用してきたファイルシステム(HFS+など)がファイル名を分解形式で正規化して保存する仕様を持っていた歴史的経緯があり、Mac由来のファイルでこの形式に遭遇することが多い"
      - "分解形式のファイル名は、常にウイルス感染の直接的な証拠である"
      - "分解形式のファイル名は、ファイルのアクセス権限設定によって決定される"
    answerIndex: 1
    explanation: "macOSが伝統的に採用しているファイルシステム(HFS+など)は、ファイル名を分解形式(NFD)で正規化して保存する仕様を持っていた歴史的経緯があり、その名残が現在でも一部の運用で残っています。Mac環境とWindows環境の間でファイルをコピー・共有する機会が多い組織では、この問題に遭遇するリスクが特に高くなります。"

  - question: "移行前にこの種のトラブルを未然に防ぐための実務的な対策について、記事の説明に最も合致するものはどれか。"
    choices:
      - "対策は存在せず、移行が失敗するたびに個別に手動で対応するしかない"
      - "PowerShellの.Normalize()メソッドを使い、対象フォルダー全体をスキャンして正規化形式が統一されていないファイルを事前に検出・修正するスクリプトを移行前のチェックリストに組み込む"
      - "すべてのファイルを一度物理的に印刷し、スキャンして読み込み直すことで正規化形式を統一する"
      - "ファイル名を英数字のみに強制的に変更するアプリケーションをインストールする以外に方法はない"
    answerIndex: 1
    explanation: "PowerShellの.Normalize()メソッドを使い、対象フォルダー全体をスキャンして正規化形式が統一されていないファイルを事前に検出・修正するスクリプトを移行前のチェックリストに組み込むことで、移行失敗のリスクを大きく減らせます。目視での確認では気づけないため、スクリプトによる機械的な検出が実務上不可欠です。"
