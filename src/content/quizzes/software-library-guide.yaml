questions:
  - question: "静的リンクと動的リンク(共有ライブラリ)の違いとして、記事内の説明として正しいものはどれか。"
    choices:
      - "静的リンクはライブラリのコードを実行ファイルにコピーして自己完結させ、動的リンクは実行時に別ファイルとしてライブラリを読み込む"
      - "静的リンクは実行時にライブラリを読み込み、動的リンクはコンパイル時にコードをコピーする"
      - "動的リンクされたプログラムは、ライブラリなしでは一切コンパイルできない"
      - "静的リンクと動的リンクは、生成される実行ファイルのサイズが常に同じになる"
    answerIndex: 0
    explanation: "静的リンクはコードを実行ファイルにコピーして自己完結させる方式、動的リンクは実行時に別ファイル(共有ライブラリ)を読み込む方式です。"

  - question: "動的リンクされた実行ファイルが起動する際、共有ライブラリの関数を実際に呼び出せるようにする処理は何と呼ばれるか。"
    choices:
      - "コンパイル"
      - "デーモン化"
      - "シンボル解決"
      - "パッケージング"
    answerIndex: 2
    explanation: "動的リンカが、実行ファイル内の関数呼び出しを共有ライブラリ内の実際のコードのアドレスに結びつける処理をシンボル解決と呼びます。"

  - question: "「ライブラリはインストールされているのに、特定のアプリケーションだけが起動時にエラーになる」という障害について、記事内で挙げられている主な原因はどれか。"
    choices:
      - "そのアプリケーションが要求するメジャーバージョンのライブラリが存在しないABI非互換"
      - "そのアプリケーションがデーモンとして実装されていないこと"
      - "ライブラリのファイルサイズが大きすぎること"
      - "そのアプリケーションがコンテナ内で実行されていないこと"
    answerIndex: 0
    explanation: "ライブラリのメジャーバージョンが変わるとABI非互換が生じることがあり、要求されているメジャーバージョンのライブラリが存在しないことが典型的な原因として説明されています。"

  - question: "パッケージ管理システムにおける「本体パッケージ」と「開発用パッケージ(-dev/-devel)」の違いとして、記事内の説明はどれか。"
    choices:
      - "本体パッケージは共有ライブラリ本体のみを含み、開発用パッケージはヘッダファイルや静的リンク用ファイルを追加で含む"
      - "本体パッケージはソースコードを含み、開発用パッケージはバイナリのみを含む"
      - "開発用パッケージをインストールすると、既存の本体パッケージは自動的に削除される"
      - "本体パッケージと開発用パッケージに機能的な違いはなく、単なる呼び方の違いにすぎない"
    answerIndex: 0
    explanation: "本体パッケージは実行に必要な共有ライブラリのみ、開発用パッケージはヘッダファイルや静的リンク用ファイルなどビルドに必要なものを追加で含みます。"

  - question: "遅延バインディング(lazy binding)について、記事内の説明として正しいものはどれか。"
    choices:
      - "プログラム起動時にすべてのシンボルを一括解決する代わりに、関数が実際に初めて呼び出されたタイミングで解決する仕組み"
      - "ライブラリの読み込みを完全に無効化し、静的リンクと同等の速度を実現する仕組み"
      - "複数のライブラリのバージョンを同時にインストールできるようにする仕組み"
      - "デーモンの起動を遅らせて、依存関係の解決を待つ仕組み"
    answerIndex: 0
    explanation: "遅延バインディングは、起動時にすべてのシンボルを解決するのではなく、実際に呼び出されたタイミングで解決することで起動時間への影響を抑える仕組みです。"
