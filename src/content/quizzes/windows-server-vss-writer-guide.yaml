questions:
  - question: "VSSライターの役割として正しいのはどれか。"
    choices:
      - "ディスクの物理的な故障を自動的に修復する"
      - "スナップショットの直前に、アプリケーションへフリーズを依頼し、整合性のある状態でスナップショットを取れるようにする"
      - "ネットワーク通信の暗号化を担当する"
      - "ユーザーのログイン認証を行う"
    answerIndex: 1
    explanation: "VSSライターは、スナップショットを取る直前に、登録されている各アプリケーションへ「フリーズ」を依頼し、整合性のある状態になったその一瞬の間にスナップショットを取得する、アプリケーション側の協調の仕組みです。"

  - question: "VSSライターの状態を確認するための、正しいコマンドとして正しいのはどれか。"
    choices:
      - "ping コマンド"
      - "vssadmin list writers"
      - "ipconfig /all"
      - "netstat -an"
    answerIndex: 1
    explanation: "各VSSライターの現在の状態を確認するには、管理者権限でvssadmin list writersを実行します。"

  - question: "ブロック単位のスナップショットの成功と、バックアップの信頼性の関係として正しいのはどれか。"
    choices:
      - "ブロック単位のスナップショットが成功すれば、バックアップは必ず正常に復元できる"
      - "ブロック単位のスナップショットの成功と、アプリケーション整合性のあるバックアップであることは、別々の保証である"
      - "ブロック単位のスナップショットという概念自体が、存在しない"
      - "バックアップの信頼性は、スナップショットとは無関係である"
    answerIndex: 1
    explanation: "ブロック単位のコピーオンライトという技術が完璧に機能していても、その瞬間にアプリケーションが整合性のある状態になっていなければ、復元後に使えないデータになってしまう可能性があり、これらは別々の保証です。"

  - question: "SQL Serverのライターが一覧に表示されない場合、確認すべきこととして正しいのはどれか。"
    choices:
      - "ディスクの空き容量だけを確認すればよい"
      - "データベース名に末尾の空白が含まれていないか、サービスアカウントがsysadmin権限を持っているかを確認する"
      - "CPUの使用率だけを確認すればよい"
      - "ネットワークケーブルの接続状態だけを確認すればよい"
    answerIndex: 1
    explanation: "SQL Serverのライターが一覧に表示されない場合、データベース名に末尾の空白を含むスペースが含まれていないか、そしてSQL Server VSS Writerサービスのアカウントがsysadmin権限を持っているかを確認します。"

  - question: "VSSライターのサービス再起動でも問題が解決しない場合の、正しい対応として正しいのはどれか。"
    choices:
      - "問題を無視して、バックアップをそのまま続行する"
      - "サーバー自体の再起動が必要になることがあり、同じ失敗が繰り返されるなら根本原因を調査する"
      - "VSSという仕組み自体を、完全に無効化する"
      - "すべてのデータを削除して、最初からやり直す"
    answerIndex: 1
    explanation: "サービスの再起動で解決しない場合は、サーバー自体の再起動が必要になることもあり、同じ失敗が繰り返されるのであれば、その根本原因を別途調査する必要があります。"
