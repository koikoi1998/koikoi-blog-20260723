questions:
  - question: "NTFSにおける「ファイル」と「フォルダー」の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ファイルとフォルダーはまったく別の仕組みで管理されており、フォルダーはMFTとは無関係な特別な領域に存在する"
      - "ファイルもフォルダーも、実はどちらもMFTの中の1つのレコードに過ぎず、違いはレコードが自分のデータを持つか、他のレコードへの索引を持つかという点だけである"
      - "フォルダーは常にファイルより先にディスク上の連続した領域に作成される"
      - "ファイルはMFTに記録されるが、フォルダーはレジストリに記録される"
    answerIndex: 1
    explanation: "NTFSでは、ファイルもフォルダーも、実はどちらも同じ土俵の上にあるMFTの中の1つのレコードに過ぎません。違いは、そのレコードが自分のデータそのものを持っているか(ファイル)、それとも他のレコードへの索引を持っているか(フォルダー)という点だけです。"

  - question: "「レジデント属性」について、記事の説明に最も合致するものはどれか。"
    choices:
      - "すべてのファイルのデータは、サイズにかかわらず常にレジデント属性として扱われる"
      - "$DATA属性のサイズがMFTレコードの残り容量に収まるほど小さい場合、そのデータがMFTレコードの中へ直接格納される属性のことである"
      - "レジデント属性とは、ディスク上の特定の固定された場所に常駐するプログラムのことである"
      - "レジデント属性は、非レジデント属性よりも常に多くのディスクアクセスを必要とする"
    answerIndex: 1
    explanation: "$DATA属性のサイズがそのレコードの残り容量に収まるほど小さい場合、NTFSはそのデータをMFTレコードの中へ直接格納します。これがレジデント属性で、小さなファイルを読む操作は実質的にMFTレコード1件を読む操作とほぼ同じになります。"

  - question: "フラグメンテーション(断片化)について、記事の説明に最も合致するものはどれか。"
    choices:
      - "MFTレコード自体が複数のバージョンに分裂してしまう現象である"
      - "非レジデント属性のファイルにおいて、実データを参照する「ラン」(開始クラスタと長さのペア)の数が増えていく現象である"
      - "フォルダーの索引データが破損して検索できなくなる現象である"
      - "レジデント属性のファイルにのみ発生する現象である"
    answerIndex: 1
    explanation: "ファイルサイズがMFTレコードに収まりきらない場合、$DATA属性は非レジデント属性になり、データはボリューム上の複数のクラスタに「ラン」という対応表で参照されます。ファイルが複数の不連続な領域に分かれて配置される、いわゆるフラグメンテーションは、このランの数が増えていく現象を指します。"

  - question: "NTFSにおけるフォルダーの実体について、記事の説明に最も合致するものはどれか。"
    choices:
      - "フォルダーは、ファイルの実データを物理的に格納する入れ物そのものである"
      - "フォルダーは、直下のファイル・サブフォルダーの名前とMFTレコード番号を記録した、B-tree構造による索引(インデックス)を持つ特殊なMFTレコードである"
      - "フォルダーはMFTには一切記録されず、レジストリで別途管理されている"
      - "フォルダーの中のファイル数が増えても、索引データのサイズは常に一定である"
    answerIndex: 1
    explanation: "NTFSにおけるフォルダーとは、直下のファイル・サブフォルダーの名前とそれぞれに対応するMFTレコード番号を記録した、B-tree構造による索引データを持つ特殊なMFTレコードです。ファイルの実体は、あくまで各ファイル自身の独立したMFTレコードに存在します。"

  - question: "MFTが果たしている役割の重大さについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "MFTは単なる補助的な情報であり、破損してもファイル・フォルダーへのアクセスには影響しない"
      - "MFTはボリューム全体の「目次」そのものであり、その一部が破損すると対応するファイル・フォルダーの情報が丸ごと参照不能になるリスクがあるため、chkdskはMFTの構造検証に重点を置いている"
      - "MFTは1つのファイルにつき1回だけ作成され、その後は二度と更新されない"
      - "MFTの破損は、$LogFileというジャーナリング機構によって完全に発生しなくなる"
    answerIndex: 1
    explanation: "MFTはボリューム全体の目次そのものであり、その一部が破損すると対応するファイル・フォルダーの情報が丸ごと参照不能になるリスクがあります。chkdskコマンドがMFTの構造そのものの検証に重点を置いているのは、MFTがボリューム全体のデータへの入り口を担っているためです。"
