questions:
  - question: "DFS名前空間の役割として正しいのはどれか。"
    choices:
      - "フォルダの中身をサーバー間で複製する"
      - "複数サーバーの共有フォルダを、1つの統一されたパスに見せる"
      - "ファイルの暗号化を行う"
      - "ディスクの空き容量を自動的に拡張する"
    answerIndex: 1
    explanation: "DFS名前空間は、実際には複数のサーバーに分散しているデータを、利用者から見て1つの統一されたパスとして見せる機能です。"

  - question: "DFSレプリケーションの役割として正しいのはどれか。"
    choices:
      - "複数サーバーの共有フォルダを1つのパスに見せる"
      - "指定したフォルダの中身を、サーバー間で双方向に同期・複製する"
      - "ユーザー認証を一元管理する"
      - "DNSレコードを自動生成する"
    answerIndex: 1
    explanation: "DFSレプリケーションは、DFS名前空間とは独立した機能であり、フォルダの中身をサーバー間で複製します。"

  - question: "DFS名前空間とDFSレプリケーションの関係として正しいのはどれか。"
    choices:
      - "必ずセットで使わなければならない、不可分な1つの機能である"
      - "それぞれ独立した機能であり、どちらか一方だけを単独で使う構成も一般的である"
      - "DFSレプリケーションを使うと、DFS名前空間は自動的に不要になる"
      - "DFS名前空間はLinuxサーバー専用の機能である"
    answerIndex: 1
    explanation: "DFS名前空間とDFSレプリケーションはそれぞれ独立した機能であり、どちらか一方だけを使う構成も実務では一般的です。"

  - question: "複数拠点で同じファイルがほぼ同時に更新された場合の、DFSレプリケーションの挙動として正しいのはどれか。"
    choices:
      - "両方の変更内容を自動的にマージする"
      - "最後に更新されたバージョンを正とし、競合した側を隠しフォルダへ自動的に退避させる"
      - "両方の変更を破棄し、更新前の状態に戻す"
      - "レプリケーション自体を完全に停止する"
    answerIndex: 1
    explanation: "DFSレプリケーションは内容をマージせず、最後の更新を正として残し、競合したファイルをDfsrPrivate\\ConflictAndDeletedへ退避させます。"

  - question: "「DFSを導入した」という会話で気をつけるべき点として正しいのはどれか。"
    choices:
      - "DFSは常に1つの機能のみを指すため、確認は不要である"
      - "名前空間の話か、レプリケーションの話か、あるいは両方かを明確に区別する必要がある"
      - "DFSという言葉自体が非推奨であるため、使うべきではない"
      - "DFSの導入には必ずAD DSが必須である"
    answerIndex: 1
    explanation: "DFSという1つの名前が2つの独立した機能を指すため、どちらの話をしているのかを常に明確にする必要があります。"
