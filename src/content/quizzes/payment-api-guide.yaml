questions:
  - question: "Stripeの決済APIが、単純な「1回のAPI呼び出しで決済完了」という設計になっていないのはなぜか。"
    choices:
      - "セキュリティ上の理由で意図的に処理を複雑にしているだけである"
      - "3Dセキュアのような追加認証が挟まる可能性があり、状態遷移を持つ設計が必要なため"
      - "サーバーの処理能力の制約上、複数回に分ける必要があるため"
      - "複数のAPI呼び出しにすることで、料金を多く請求できるため"
    answerIndex: 1
    explanation: "3Dセキュアなどの追加認証が挟まる可能性があるため、PaymentIntentという状態遷移を持つオブジェクトを介した、複数ステップの設計になっています。"

  - question: "カード番号が自社サーバーを経由せず、ブラウザから直接決済事業者へ送信される設計の主な目的は何か。"
    choices:
      - "通信速度を向上させるため"
      - "PCI DSSの準拠範囲(スコープ)を小さく保つため"
      - "決済手数料を安くするため"
      - "サーバーの負荷を軽減するため"
    answerIndex: 1
    explanation: "自社サーバーがカード番号に一度も触れないようにすることで、PCI DSSという厳格なセキュリティ基準の準拠義務の対象範囲を大幅に小さく保てます。"

  - question: "フロントエンドのリダイレクトが完了したことを、決済成功の確定的な証拠として使うべきではない理由は何か。"
    choices:
      - "リダイレクトは常に失敗するものだから"
      - "決済の成功とリダイレクトの到達は、別々に失敗しうる独立した事象であるため"
      - "リダイレクトにはセキュリティ上の脆弱性があるため"
      - "リダイレクトは決済APIの仕様に含まれていないため"
    answerIndex: 1
    explanation: "決済自体が成功したかどうかと、その結果がフロントエンドに伝わったかどうかは、別々に失敗しうる独立した事象であるため、実際の注文確定処理はWebhookをトリガーに行う必要があります。"

  - question: "Webhookを受信した際に、なりすましを防ぐために必ず行うべき処理は何か。"
    choices:
      - "受信したデータをそのままデータベースに保存する"
      - "HMAC署名を検証し、正当な送信元からのリクエストであることを確認する"
      - "受信したIPアドレスがStripeのものかを目視で確認する"
      - "特に何もする必要はない"
    answerIndex: 1
    explanation: "Webhookは外部からの通常のHTTPリクエストとして届くため、署名を検証して初めて、正当なリクエストとして処理すべきです。"

  - question: "決済APIにおいて冪等性キー(Idempotency-Key)が特に重要になる理由は何か。"
    choices:
      - "決済APIには冪等性キーという概念自体が存在しないため"
      - "リクエストのタイムアウトによる単純なリトライで、決済が二重に実行されることを防ぐため"
      - "冪等性キーを使うと決済処理の速度が上がるため"
      - "冪等性キーは3Dセキュア認証にのみ使われるものであるため"
    answerIndex: 1
    explanation: "リクエストがタイムアウトしてクライアントがリトライした場合、冪等性キーがなければ同じ内容の決済が二重に作られてしまう可能性があります。"
