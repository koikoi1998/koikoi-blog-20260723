questions:
  - question: "委任(Delegation)を宣言するために親ゾーンに追加するレコードとして正しいのはどれか。"
    choices:
      - "MXレコード"
      - "NSレコード"
      - "TXTレコード"
      - "CNAMEレコード"
    answerIndex: 1
    explanation: "委任は、親ゾーンに委任先の権威サーバーを示すNSレコードを追加することで宣言されます。"

  - question: "グルーレコードが必要になる条件として正しいのはどれか。"
    choices:
      - "常にすべての委任で必要になる"
      - "委任先のサーバー名が、委任するゾーン自身に含まれる場合"
      - "委任先のサーバーがLinux上で動いている場合"
      - "委任元のゾーンにMXレコードが存在する場合"
    answerIndex: 1
    explanation: "委任先のサーバー名が委任するゾーンに含まれる場合、循環依存が発生するため、グルーレコードが構造的に必須になります。"

  - question: "Lame Delegationの説明として正しいのはどれか。"
    choices:
      - "委任先のサーバーが、実際には応答しない、壊れた委任の状態"
      - "複数のサーバーへ同時に委任すること"
      - "委任情報を暗号化する仕組み"
      - "ゾーン転送が高速化される状態"
    answerIndex: 1
    explanation: "Lame Delegationは、グルーレコードの誤りなどにより、委任先のサーバーが実際には応答しなくなる、壊れた委任の状態です。"

  - question: "Lame Delegationの原因として、実務で最も多いのはどれか。"
    choices:
      - "子ゾーンの管理者の設定ミス"
      - "親ゾーン側のNSレコードやグルーレコードの誤り"
      - "クライアント側のDNSキャッシュの破損"
      - "TTLの値が大きすぎること"
    answerIndex: 1
    explanation: "Lame Delegationの多くは、親ゾーン側のNSレコードやグルーレコードの誤りが原因であり、子ゾーン自体の設定は正しいことがほとんどです。"

  - question: "サブドメインの名前解決だけが失敗する障害に遭遇した際、まず確認すべきこととして正しいのはどれか。"
    choices:
      - "子ゾーンのゾーンファイルの構文だけを確認する"
      - "親ゾーンのNSレコードとグルーレコードが、委任先の実際のIPアドレスと一致しているかを確認する"
      - "クライアント端末を再起動する"
      - "DNSSECの鍵をローテーションする"
    answerIndex: 1
    explanation: "サブドメインだけが解決できない場合、まず親ゾーンの委任情報(NSレコード・グルーレコード)が正しいかを確認するのが定石です。"
