questions:
  - question: "「TLSでIPパケットを暗号化する」ことと「VPN接続が成立する」ことの間に必要な仕組みとして、記事内で説明されていないものはどれか。"
    choices:
      - "TUNデバイスによる、運ぶべきIPパケットの捕捉"
      - "制御チャネルとデータチャネルの分離"
      - "Push機構による仮想IP・ルート情報の配布"
      - "IPsecのSPDと同等の専用ルーティングプロトコルの実装"
    answerIndex: 3
    explanation: "記事ではTUNデバイス・制御チャネルとデータチャネルの分離・Push機構の3つが挙げられており、IPsecのSPDのような専用ルーティングプロトコルの実装は登場しません。"

  - question: "OpenVPNの制御チャネルとデータチャネルの役割分担として、記事内の説明はどれか。"
    choices:
      - "制御チャネルはTLSハンドシェイクとPush機構によるオプション配布を担い、データチャネルは実際のIPパケットの暗号化・転送を担う"
      - "制御チャネルは暗号化されたデータのみを扱い、データチャネルは認証情報のみを扱う"
      - "制御チャネルとデータチャネルは常に別々のTCP/UDPコネクションとして確立される"
      - "制御チャネルはサーバー側にのみ存在し、クライアント側には存在しない"
    answerIndex: 0
    explanation: "制御チャネルがTLSハンドシェイクとPush機構によるオプション配布を担い、データチャネルが実際のIPパケットの暗号化・転送を担うという役割分担が説明されています。"

  - question: "UDPモードのOpenVPNが制御チャネル専用に独自の信頼性レイヤーを実装している理由として、記事内の説明はどれか。"
    choices:
      - "UDPには到達確認・再送・順序保証の仕組みがなく、TLSハンドシェイクは本来信頼性のあるトランスポートを前提に設計されているため"
      - "UDPはTCPよりもパケットサイズの上限が小さいため、分割して送る必要があるから"
      - "サーバー側の負荷を減らすため、制御チャネルの通信を暗号化しないようにするため"
      - "UDPモードではTLSハンドシェイク自体を省略できるようにするため"
    answerIndex: 0
    explanation: "TLSハンドシェイクは信頼性のあるトランスポートを前提とするため、到達確認や順序保証を持たないUDPの上で動かすには、制御チャネル専用の独自の信頼性レイヤーが必要になると説明されています。"

  - question: "Push機構が担う役割として、記事内の説明はどれか。"
    choices:
      - "クライアントの証明書認証そのものを行う"
      - "認証成功後のクライアントに、仮想IPアドレス・ルート情報・DNSサーバーなどの接続設定情報を配布する"
      - "サーバーとクライアントの間の暗号鍵をゼロから生成する"
      - "クライアントのTUNデバイスそのものを遠隔から作成する"
    answerIndex: 1
    explanation: "Push機構は認証成功後のクライアントに対し、仮想IPアドレス・ルート情報・DNSサーバーなどの接続設定情報を配布する役割を担うと説明されています。認証自体は制御チャネルのTLSハンドシェイクが担います。"

  - question: "フルトンネルとスプリットトンネルの切り替えについて、記事内の説明として正しいものはどれか。"
    choices:
      - "クライアント側の設定ファイルを書き換えることでのみ切り替えられる"
      - "Push機構により、サーバー側が何をPushするかを変えるだけで基本的に制御でき、クライアント側の設定ファイルの書き換えを必要としない"
      - "フルトンネルとスプリットトンネルは、OpenVPNでは技術的に区別できない"
      - "この切り替えには、TLS証明書の再発行が毎回必要になる"
    answerIndex: 1
    explanation: "Push機構により、クライアントが何をVPN経由で送信するかはサーバー側のPush設定で動的に決定でき、クライアント側の設定ファイルを書き換える必要がないと説明されています。"
