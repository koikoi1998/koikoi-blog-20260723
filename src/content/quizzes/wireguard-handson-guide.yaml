questions:
  - question: "このハンズオンでAllowedIPsを書き換えたときに確認できたこととして正しいのはどれか。"
    choices:
      - "ip routeコマンドで明示的にルーティングテーブルを操作する必要があった"
      - "AllowedIPsを書き換えるだけで、ルーティングテーブルを操作せずに転送範囲が変わった"
      - "AllowedIPsを変更しても、転送される範囲には一切影響しなかった"
      - "AllowedIPsの変更には、鍵ペアの再生成が必要だった"
    answerIndex: 1
    explanation: "AllowedIPsは、その範囲宛のパケットをどの公開鍵の相手へ送るかを決める実体であり、書き換えるだけでルーティングテーブルを操作せずに転送範囲を変更できます。"

  - question: "PersistentKeepaliveの本来の目的として正しいのはどれか。"
    choices:
      - "WireGuard自体の接続が切れないようにするため"
      - "NATルーターが保持しているUDPポートの通信中状態(NATバインディング)を維持するため"
      - "ハンドシェイクの頻度を減らすため"
      - "暗号化アルゴリズムを固定するため"
    answerIndex: 1
    explanation: "PersistentKeepaliveは、NAT配下にある側からの再到達性を維持するために、NATバインディングを保ち続けるための設定です。"

  - question: "WireGuardのハンドシェイクの挙動として正しいのはどれか。"
    choices:
      - "最初の接続時に1回だけ行われ、以降は再確立されない"
      - "約2分ごとに、通信を継続しながらバックグラウンドで自動的に再確立される"
      - "手動でwg-quick downしない限り、一切発生しない"
      - "ハンドシェイクという概念はWireGuardには存在しない"
    answerIndex: 1
    explanation: "WireGuardは約2分ごとにセッション鍵をバックグラウンドで自動的に再確立し続けます。"

  - question: "AllowedIPsの設定ミスによって起きやすい障害として正しいのはどれか。"
    choices:
      - "すべての通信が完全に不通になる、分かりやすい障害になる"
      - "特定のホストにだけ繋がらないという、原因が分かりにくい障害になる"
      - "WireGuardのプロセス自体がクラッシュする"
      - "鍵ペアが自動的に無効化される"
    answerIndex: 1
    explanation: "AllowedIPsは実質的なルーティングポリシーであり、範囲設定を誤ると特定のホストにだけ繋がらないという、原因の分かりにくい障害になります。"

  - question: "wg showコマンドで確認できる情報として、このハンズオンで扱ったものはどれか。"
    choices:
      - "IPsecのSA(セキュリティアソシエーション)の一覧"
      - "ハンドシェイクの完了状況と直近の送受信量"
      - "ファイアウォールのルール一覧"
      - "DNSの名前解決結果"
    answerIndex: 1
    explanation: "wg showは、ハンドシェイクが完了しているか、直近の送受信量やlatest handshakeの時刻などを確認できるコマンドです。"
