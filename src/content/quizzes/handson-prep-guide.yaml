questions:
  - question: "Proxmox VEでVMを作成する際、Networkタブで「vmbr0」を選ぶことの意味として、記事内で説明されている内容はどれか。"
    choices:
      - "VMを完全にネットワークから切り離す設定である"
      - "家庭内LANに直結するブリッジに接続する設定であり、VMがルーターから直接IPアドレスを取得できるようになる"
      - "vmbr0は常にNATモードのネットワークを意味する"
      - "vmbr0はディスクの保存先ストレージを指定する項目である"
    answerIndex: 1
    explanation: "vmbr0は多くの環境で家庭内LANに直結するブリッジとして使われ、これに接続したVMはルーターから直接IPアドレスを取得できます。"

  - question: "OSのインストールメディア(ISO)をProxmoxで使うための正しい手順として、記事内で説明されているものはどれか。"
    choices:
      - "ISOファイルを直接VMのディスクとして割り当てる"
      - "配布元サイトからISOをダウンロードし、Proxmoxの「ISO Images」ストレージにアップロード(または「Download from URL」で直接取得)してから、VM作成時に選択する"
      - "ISOは自動的にインターネットから取得されるため、事前準備は不要である"
      - "ISOファイルはVMを作成した後には一切使わない"
    answerIndex: 1
    explanation: "配布元サイトからダウンロードしたISOをProxmoxのストレージにアップロード(または直接URL指定でダウンロード)し、VM作成時にOSタブでそのISOを選択します。"

  - question: "Ubuntu Serverのインストール中に「Install OpenSSH server」にチェックを入れることが強く推奨される理由として、記事内で説明されているものはどれか。"
    choices:
      - "チェックしないとOSのインストール自体が失敗するため"
      - "インストール完了後にSSH経由でVMへ接続できるようになり、以降のハンズオン記事の手順もSSH接続を前提に書かれているため"
      - "チェックを入れるとOSの起動速度が大幅に向上するため"
      - "SSHサーバーをインストールしないとネットワーク設定自体ができないため"
    answerIndex: 1
    explanation: "OpenSSH Serverをインストールしておくと、Console画面よりコピー&ペーストがしやすいSSH接続が使えるようになります。以降のハンズオン記事の手順はSSH接続を前提に書かれています。"

  - question: "Ubuntu Serverのインストール完了後、再起動の前に行うべき操作として、記事内で説明されているものはどれか。"
    choices:
      - "何もする必要はなく、そのまま再起動してよい"
      - "ISOイメージをVMの光学ドライブから取り出す(またはブート順序を変更する)。忘れると再起動のたびにインストーラーが再度起動してしまう"
      - "VMのメモリ容量を再起動前に増やす必要がある"
      - "ネットワークケーブルを一度抜く必要がある"
    answerIndex: 1
    explanation: "ISOイメージを取り外し忘れると、再起動のたびに光学ドライブからインストーラーが再度起動してしまいます。ProxmoxのVMの「Hardware」タブからISOのマウントを解除できます。"
