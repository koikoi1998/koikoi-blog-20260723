questions:
  - question: "Tailscaleの設計思想として、記事内で説明されている本質はどれか。"
    choices:
      - "WireGuardを独自の暗号化プロトコルに置き換え、より高速化している"
      - "WireGuardというデータプレーンの実装は変更せず、鍵配布・ACL管理を担うコントロールプレーンを別レイヤーとして新設している"
      - "IPsecとWireGuardの両方を状況に応じて自動的に切り替えている"
      - "すべての通信を常にTailscale社のサーバー経由で中継している"
    answerIndex: 1
    explanation: "TailscaleはWireGuardのデータプレーン実装を変更せず、その手前に鍵配布・ACL管理・IdP連携を担うコントロールプレーンを新設することで、運用上の弱点だけを解決していると説明されています。"

  - question: "TailscaleのNATホールパンチングの仕組みとして、記事内の説明はどれか。"
    choices:
      - "coordination serverが全トラフィックを常に中継することでNATを迂回する"
      - "双方のノードがSTUNに類する仕組みで自分のNAT変換後のアドレスを調べ、その情報を交換した上で同時に相手宛にパケットを送り合うことで、NATに穴を開ける"
      - "NAT機器のファームウェアを自動的に書き換えて穴を開ける"
      - "TCP443ポートを使うことで、NATの存在自体を無効化する"
    answerIndex: 1
    explanation: "各ノードが自分のNAT変換後のアドレスを調べて交換し、双方が同時に相手宛にパケットを送ることで、多くのNATが持つ「送信したことのある宛先からの応答を通す」挙動を利用して穴を開けると説明されています。"

  - question: "DERPリレーが「ゼロ知識リレー」と呼ばれる理由として、記事内の説明はどれか。"
    choices:
      - "DERPサーバーは通信のメタデータ(誰と誰がいつ通信したか)も一切記録しないため"
      - "DERPサーバーはWireGuardの秘密鍵を持たず、すでに暗号化されたパケットをそのまま転送するだけで中身を復号できないため"
      - "DERPサーバーはユーザーの身元情報を一切保持しない匿名サービスだから"
      - "DERPサーバーは常に複数の国に分散して配置され、単一の運営者が特定できないため"
    answerIndex: 1
    explanation: "DERPサーバーは秘密鍵を持たないため通信内容を復号できませんが、通信メタデータ(いつ・誰と誰が)は観測できる立場にあると説明されており、完全な匿名性を提供するものではないと明記されています。"

  - question: "Tailscaleが素のWireGuardと比べてエンタープライズ導入で優位とされる理由として、記事内の説明はどれか。"
    choices:
      - "WireGuardより暗号強度が高いアルゴリズムを使っているため"
      - "IdP連携により、ユーザーの入退社に応じたアクセス権の付与・失効が自動化され、手動でのconfig管理が不要になるため"
      - "WireGuardと異なり、UDPだけでなくTCPでも常に高速に動作するため"
      - "1つのtailnetに参加できるノード数に上限がないため"
    answerIndex: 1
    explanation: "IdP側でユーザーを無効化するだけでそのユーザーに紐づくノードのアクセス権がtailnet全体から自動的に失効する点が、素のWireGuardの手動config管理と比べた優位性として説明されています。"

  - question: "Tailscaleの接続が遅いと感じたときに、記事内で最初に確認すべきとされている手順はどれか。"
    choices:
      - "WireGuardの鍵ペアを再生成する"
      - "`tailscale status`などでその接続がdirect(直接)かrelay(DERP経由)かを確認する"
      - "ACL設定をすべて一度削除して再作成する"
      - "coordination serverを別のリージョンに移設する"
    answerIndex: 1
    explanation: "速度低下の際はまず`tailscale status`や`tailscale ping`で接続がDERP経由(relay)になっていないかを確認する習慣が推奨されています。"
