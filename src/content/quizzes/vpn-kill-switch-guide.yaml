questions:
  - question: "VPNのキルスイッチの正体として正しいのはどれか。"
    choices:
      - "VPNプロトコル自体に組み込まれた、特別な暗号機能"
      - "トンネル経由以外のすべての通信を既定で拒否する、ごく普通のファイアウォールポリシー"
      - "VPNサーバー側だけで動作する、専用のハードウェア機能"
      - "DNSサーバーの設定を自動的に書き換える機能"
    answerIndex: 1
    explanation: "キルスイッチは、VPNプロトコル自体が持つ特別な機能ではなく、「VPNトンネル経由以外のすべての通信を、既定で拒否する」という、ごく普通のファイアウォールポリシーにすぎません。"

  - question: "キルスイッチを自分で構築する際の、典型的なルールの組み合わせとして正しいのはどれか。"
    choices:
      - "すべての通信を、常に無条件で許可する1つのルールだけ"
      - "VPNサーバーへの通信を許可、トンネル経由の通信を許可、それ以外すべてを拒否、という3つのルール"
      - "VPNサーバーへの通信だけを拒否する1つのルール"
      - "ファイアウォールのルールは、キルスイッチには一切関係しない"
    answerIndex: 1
    explanation: "典型的には、(1)VPNサーバー自身への通信を許可、(2)トンネルインターフェース経由の通信を許可、(3)それ以外のすべてを拒否、という3つのルールの組み合わせでキルスイッチが実現されます。"

  - question: "キルスイッチの拒否ルールが機能しなくなる、典型的な原因として正しいのはどれか。"
    choices:
      - "拒否ルールが、他の緩い許可ルールよりも後(下)に配置されている"
      - "拒否ルールの文字数が多すぎる"
      - "VPNサーバーのIPアドレスが変更された"
      - "ファイアウォール自体が存在しない"
    answerIndex: 1
    explanation: "ファイアウォールのルールは上から順に評価され、最初にマッチしたルールが適用されるため、最終的な拒否ルールが他の緩い許可ルールより後に配置されていると、拒否ルールが一切機能しないことがあります。"

  - question: "キルスイッチの動作を正しく検証するための、推奨されるテスト方法として正しいのはどれか。"
    choices:
      - "VPN接続を正常に切断して、挙動を確認する"
      - "VPNプロセスを強制終了させ、パブリックIPアドレスを継続的に確認する"
      - "VPNサーバーのパスワードを変更して、挙動を確認する"
      - "ファイアウォールを完全に無効化して、挙動を確認する"
    answerIndex: 1
    explanation: "正常な切断では、クライアントが適切な後処理を行ってしまうため、実際のクラッシュを想定した、プロセスの強制終了によるテストと、パブリックIPアドレスの継続的な確認が推奨されています。"

  - question: "実際のテストで確認された、キルスイッチの典型的な失敗パターンとして正しいのはどれか。"
    choices:
      - "キルスイッチは、どんな状況でも100%確実に機能する"
      - "OSのネットワークインターフェースが起動してからVPNトンネルが確立するまでの、起動時の時間差の間にリークが発生する"
      - "キルスイッチは、VPNが接続されている間だけ機能しなくなる"
      - "キルスイッチは、有線接続でのみ機能する"
    answerIndex: 1
    explanation: "テストでは、OSのネットワークインターフェースが起動してからVPNトンネルが確立するまでの、起動時の時間差の間にリークが発生するという、典型的な失敗パターンが確認されています。"
