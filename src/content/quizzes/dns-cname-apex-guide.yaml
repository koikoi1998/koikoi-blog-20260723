questions:
  - question: "CNAMEレコードが、DNSの仕様上持っている制約として正しいのはどれか。"
    choices:
      - "他のレコードと自由に共存できる"
      - "同じ名前には、他のどんなレコード種別も共存できない"
      - "ゾーンに1つだけしか存在できない"
      - "サブドメインにのみ設定できる"
    answerIndex: 1
    explanation: "CNAMEレコードは、DNSの仕様(RFC 1034)により、同じ名前に他のどんなレコード種別も共存できないという制約を持っています。"

  - question: "ゾーンの頂点(ゾーンApex)に、ゾーンが機能するために必ず存在していなければならないレコードとして正しいのはどれか。"
    choices:
      - "CNAMEレコードとTXTレコード"
      - "SOAレコードとNSレコード"
      - "MXレコードのみ"
      - "PTRレコードのみ"
    answerIndex: 1
    explanation: "ゾーンの頂点には、そのゾーンが機能するために、SOAレコードとNSレコードが必ず存在していなければなりません。"

  - question: "ゾーンの頂点にCNAMEを置くことができない理由として正しいのはどれか。"
    choices:
      - "ゾーンの頂点はDNSサーバーが物理的に認識できないため"
      - "CNAMEが他のレコードと共存できないという制約と、ゾーンの頂点にSOA・NSが必須という要件が衝突するため"
      - "CNAMEは暗号化された通信にしか対応していないため"
      - "ゾーンの頂点では文字数制限があるため"
    answerIndex: 1
    explanation: "CNAMEが他のレコードと共存できないという制約と、ゾーンの頂点にSOA・NSが必須という要件が衝突するため、構造的にCNAMEを置くことができません。"

  - question: "ALIAS/ANAMEレコードの正体として正しいのはどれか。"
    choices:
      - "CNAMEレコードの単なる別名である"
      - "標準のDNSプロトコルには存在しない、プロバイダー独自の仕組みで、プロトコルレベルでは実際にはAレコードとして応答する"
      - "ゾーンの頂点には設定できない、特殊なTXTレコードである"
      - "DNSSECの検証にのみ使われるレコードである"
    answerIndex: 1
    explanation: "ALIAS/ANAMEは標準のDNSプロトコルには存在しない、プロバイダー独自の仕組みであり、DNSプロトコルのレベルでは実際にはAレコードとして応答します。"

  - question: "一部のプロバイダーがルートドメインへのCNAME設定を誤って許可してしまった場合に起きうる障害として正しいのはどれか。"
    choices:
      - "何も問題は起きない"
      - "ゾーンの頂点にあった他の必須レコード(MXなど)が暗黙的に失われ、後から分かりにくい障害(メール配送停止など)につながる"
      - "DNSサーバー自体が即座にクラッシュする"
      - "ドメイン名が自動的に失効する"
    answerIndex: 1
    explanation: "許可されていても、ゾーンの頂点にある他の必須レコードが暗黙的に失われ、後から分かりにくい障害につながる危険があります。"
