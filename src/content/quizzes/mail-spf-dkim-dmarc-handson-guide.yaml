questions:
  - question: "policyd-spfをPostfixに組み込むことで実現できることとして正しいのはどれか。"
    choices:
      - "送信メールにDKIM署名を自動付与する"
      - "受信時にMAIL FROMのドメインのSPFレコードを検証し、送信元IPアドレスと照合する"
      - "メールを自動的に暗号化する"
      - "メールキューの上限を自動調整する"
    answerIndex: 1
    explanation: "policyd-spfは、受信時にSPFレコードを検証し、実際の接続元IPアドレスと照合するポリシーデーモンです。"

  - question: "このハンズオンで、SPFレコードの範囲外のIPアドレスから送信を試みた際の結果として正しいのはどれか。"
    choices:
      - "警告ログが出力されるだけで、メールは正常に配送される"
      - "550番台のエラーが返り、Postfixがメールの受け取り自体を拒否する"
      - "メールが自動的に別のドメインへ転送される"
      - "SPFレコードが自動的に修正される"
    answerIndex: 1
    explanation: "SPFレコードを厳格な拒否設定にした場合、範囲外のIPアドレスからの送信はRCPT TOの段階で550番台のエラーとして拒否されます。"

  - question: "OpenDKIMを組み込んだ後、送信メールに自動的に付与されるものとして正しいのはどれか。"
    choices:
      - "Received-SPFヘッダー"
      - "DKIM-Signatureヘッダー"
      - "X-Spam-Statusヘッダー"
      - "Content-Typeヘッダー"
    answerIndex: 1
    explanation: "OpenDKIMは、送信メールの本文と一部のヘッダーに対して秘密鍵で署名を作成し、DKIM-Signatureヘッダーとして自動的に挿入します。"

  - question: "SPFチェックとDKIM署名の役割の非対称性として正しいのはどれか。"
    choices:
      - "両方とも受信側の設定である"
      - "SPFは受信側(他社から自社への通信の検証)、DKIMは送信側(自社から他社への通信の保護)という役割を持つ"
      - "両方とも送信側の設定である"
      - "SPFとDKIMは同じ設定ファイルの中で同じ役割を持つ"
    answerIndex: 1
    explanation: "SPFは受信側の機能として他社から自社への通信を検証し、DKIMは送信側の機能として自社から他社への通信を保護するという、非対称な役割分担があります。"

  - question: "SPFのFail判定への対応として、実務でよく取られる段階的なアプローチとして正しいのはどれか。"
    choices:
      - "SPFを導入した初日から、すべてのFailを即座に拒否する"
      - "まずヘッダーへの記録に留め、正規の送信元をすべて洗い出してから段階的に拒否へ移行する"
      - "SPFのFail判定は常に無視してよい"
      - "SPFを導入する場合、DKIMは併用してはいけない"
    answerIndex: 1
    explanation: "いきなり拒否にするのではなく、まず記録のみに留めて正規の送信元を把握してから、段階的に拒否へ移行するのが実務上の定石です。"
