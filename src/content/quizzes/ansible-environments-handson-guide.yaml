questions:
  - question: "`group_vars/prod.yml`が正しく読み込まれるための条件は何か。"
    choices:
      - "Playbook側でこのファイルを明示的にincludeする必要がある"
      - "ファイル名がインベントリのグループ名と一致していれば、Ansibleが自動的に読み込む"
      - "ansible.cfgに読み込むファイルを列挙する必要がある"
      - "コマンドライン引数で明示的に指定する必要がある"
    answerIndex: 1
    explanation: "インベントリのグループ名とgroup_vars配下のファイル名が一致していれば、明示的な読み込み指定なしでAnsibleが自動的に適用します。"

  - question: "`--limit`オプションを指定しなかった場合、実行対象になるのはどこか。"
    choices:
      - "常にdevグループだけ"
      - "Playbookのhosts:に書かれているグループ全体"
      - "インベントリの一番上に書かれているホスト1台だけ"
      - "何も実行されない"
    answerIndex: 1
    explanation: "--limitを指定しない場合、Playbookのhosts:に書かれているグループ(たとえばall)全体が対象になります。"

  - question: "`--check --diff`について正しい説明はどれか。"
    choices:
      - "--checkは実際に変更を加えるが、--diffは変更を加えない"
      - "--checkは実際には変更を加えず、--diffと組み合わせることで変更予定の差分を確認できる"
      - "--diffを付けると自動的に本番環境が対象になる"
      - "--checkと--diffは同時には使用できない"
    answerIndex: 1
    explanation: "--checkは実際にはどのホストにも変更を加えず、--diffと組み合わせることでファイル内容の変更予定を目視確認できます。"

  - question: "「本番環境に間違えて適用してしまう」事故への実務上の対策として最も適切なのはどれか。"
    choices:
      - "作業者が気をつけることに任せる"
      - "--limitを必須にするラッパースクリプトや、人間の確認を挟むCI/CDパイプラインなど、仕組みで防ぐ"
      - "本番環境のインベントリファイルを削除しておく"
      - "Ansibleの利用自体をやめる"
    answerIndex: 1
    explanation: "精神論ではなく、うっかりミスをしても最後の砦が止めてくれる仕組みを作ることが実務上の対策です。"

  - question: "group_varsの優先順位について正しい説明はどれか。"
    choices:
      - "all.ymlの値が常に最優先される"
      - "より具体的な範囲(ホスト単体のhost_vars)の値が、より広い範囲(全ホスト共通)の値を上書きする"
      - "優先順位は存在せず、後から読み込んだファイルが常に勝つ"
      - "グループごとの優先順位はアルファベット順で決まる"
    answerIndex: 1
    explanation: "all/グループ/ホスト単体という階層のうち、より具体的な範囲(ホスト単体)の値が、より広い範囲の値を上書きします。"
