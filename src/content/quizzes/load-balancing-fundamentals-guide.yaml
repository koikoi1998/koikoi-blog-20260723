questions:
  - question: "L4ロードバランサーが振り分けの判断に使う情報として正しいのはどれか。"
    choices:
      - "HTTPリクエストのURLパスとCookie"
      - "TCP/UDPヘッダーの送信元・宛先IPアドレスとポート番号"
      - "HTTPレスポンスボディの内容"
      - "DNSレコードのTTL値"
    answerIndex: 1
    explanation: "L4ロードバランサーは、トランスポート層のヘッダー情報(IPアドレスとポート番号)だけを見て振り分けます。"

  - question: "L7ロードバランサーが、L4ロードバランサーに比べて処理コストが高くなる理由として正しいのはどれか。"
    choices:
      - "常に暗号化通信しか扱えないため"
      - "HTTPリクエストの内容を実際に解釈する必要があるため"
      - "DNSラウンドロビンを内部で使用しているため"
      - "バックエンドサーバーの台数が常に多くなるため"
    answerIndex: 1
    explanation: "L7ロードバランサーは、URLパスやヘッダーなどHTTPの内容を実際に解釈する必要があるため、L4より処理コストが高くなります。"

  - question: "VIP(Virtual IP)についての正しい説明はどれか。"
    choices:
      - "バックエンドサーバーの中の1台が持つ実際のIPアドレスである"
      - "ロードバランサー自身が公開する、実体を持たない仮想的なIPアドレスである"
      - "DNSサーバーが自動的に生成するIPアドレスである"
      - "クライアント側の端末に割り当てられるIPアドレスである"
    answerIndex: 1
    explanation: "VIPは、ロードバランサー自身が公開する仮想的なIPアドレスであり、バックエンドサーバーの実体はクライアントから隠されています。"

  - question: "DNSラウンドロビンが『本物の』ロードバランサーとは呼ばれない理由として正しいのはどれか。"
    choices:
      - "DNSの応答順序を変えているだけで、ヘルスチェックも細かい振り分けロジックも持たないため"
      - "DNSプロトコル自体がTCPを使用していないため"
      - "DNSラウンドロビンはL7の機能しか提供しないため"
      - "DNSラウンドロビンは暗号化通信にしか対応していないため"
    answerIndex: 0
    explanation: "DNSラウンドロビンは、単にDNSの応答順序を変えるだけの単純な分散方式で、ヘルスチェックや柔軟な振り分けロジックを持ちません。"

  - question: "AWSのNLBとALBの位置づけについて正しい組み合わせはどれか。"
    choices:
      - "NLBはL7、ALBはL4のロードバランサーである"
      - "NLBはL4、ALBはL7のロードバランサーである"
      - "NLBとALBはどちらもL4のロードバランサーである"
      - "NLBとALBはどちらもL7のロードバランサーである"
    answerIndex: 1
    explanation: "AWSのNLB(Network Load Balancer)はL4、ALB(Application Load Balancer)はL7のロードバランサーです。"
