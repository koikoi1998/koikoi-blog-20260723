questions:
  - question: "LDAPとAD DSの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "LDAPはAD DS専用に開発された、AD DSだけが使うプロトコルである"
      - "LDAPはAD DS専用ではなく、OpenLDAPなど他のディレクトリサービスでも使われる汎用的な標準プロトコルであり、AD DSはこの共通言語で問い合わせを受け付けている実装の1つである"
      - "LDAPはAD DSの内部データベースエンジン(ESE/Jet)そのものの名称である"
      - "LDAPはKerberos認証を置き換える、より新しい認証プロトコルである"
    answerIndex: 1
    explanation: "LDAPは、階層構造を持つディレクトリに対して検索・追加・変更・削除を行うための標準プロトコルであり、AD DS専用の技術ではありません。AD DSは、このLDAPという共通言語で問い合わせを受け付けている実装の1つです。"

  - question: "DN(Distinguished Name、識別名)の読み方について、記事の説明に最も合致するものはどれか。"
    choices:
      - "左側がディレクトリの根(ルート)に近く、右側がそのオブジェクト自身に近い"
      - "右側がディレクトリの根(ルート)に近く、左側がそのオブジェクト自身(葉)に近い"
      - "DNの要素の並び順に意味はなく、どちらから読んでも同じ結果になる"
      - "DNは常にアルファベット順にソートされて表示される"
    answerIndex: 1
    explanation: "DNはカンマ区切りで複数の要素(RDN)が並んでいますが、右側がディレクトリの根に近く、左側がそのオブジェクト自身(葉)に近いという順序で並んでいます。"

  - question: "ポート389とポート3268の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "389番はそのDCが担当するドメインパーティション内のみが対象だが、3268番はフォレスト内の全ドメインを横断してグローバルカタログに複製されている属性を検索できる"
      - "389番は暗号化通信専用、3268番は平文通信専用という違いである"
      - "389番と3268番は完全に同じ機能を持つ、単なる予備ポートの関係である"
      - "3268番は特定のドメインコントローラー1台だけがサポートする特殊なポートである"
    answerIndex: 0
    explanation: "389番ポートへの問い合わせは、そのDCが担当するドメインパーティション内のオブジェクトだけが対象ですが、3268番ポート(グローバルカタログ)への問い合わせは、フォレスト内の全ドメインを横断して、グローバルカタログに複製されている属性だけを対象に検索できます。"

  - question: "Microsoftのセキュリティ勧告ADV190023とその後の経緯について、記事の説明に最も合致するものはどれか。"
    choices:
      - "2019年の勧告後、すぐにすべての既存ドメインコントローラーでLDAP署名・チャネルバインディングが強制的に有効化された"
      - "2019年にLDAP署名を必須にすることなどが推奨されたが、2020年3月に既存環境への強制的な有効化は行わない方針に転換され、Windows Server 2025では新規構築ドメインコントローラーについてのみ既定値が強化された"
      - "ADV190023はLDAP署名とは無関係の、まったく別のセキュリティ問題に関する勧告である"
      - "LDAPチャネルバインディングは、Windows Server 2025以降、既存環境も含めてすべて自動的に有効化されている"
    answerIndex: 1
    explanation: "2019年8月のADV190023では、LDAP署名を必須にすることなどが推奨されましたが、2020年3月に互換性への影響を考慮し、既存環境への強制的な有効化は行わない方針に転換されました。Windows Server 2025では、新規構築されたドメインコントローラーについてのみ既定値が強化されています。"

  - question: "LDAP署名とLDAPチャネルバインディングの役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "どちらも同じ機能であり、片方だけ設定すれば十分である"
      - "LDAP署名は通信内容の改ざん検知が主目的であり、中継攻撃(リレー)そのものを防ぐには、TLS層と紐付けるLDAPチャネルバインディングも合わせて有効にする必要がある"
      - "LDAP署名とLDAPチャネルバインディングは、いずれもKerberos認証にのみ関係する設定である"
      - "LDAP署名は暗号化そのものを行う機能であり、平文通信を暗号化通信に変換する"
    answerIndex: 1
    explanation: "LDAP署名は通信内容の改ざん検知が主目的です。NTLMリレー攻撃のような中継攻撃そのものを防ぐには、TLS層の情報とLDAPの認証情報を紐付けるLDAPチャネルバインディングも合わせて有効にする必要があり、この2つはセットで検討すべき設定です。"
