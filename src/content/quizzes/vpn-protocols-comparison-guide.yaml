questions:
  - question: "L2TP/IPsecが「レガシー」と評される根本的な理由として、記事内で説明されている設計思想の違いはどれか。"
    choices:
      - "L2TP/IPsecはTCPベースであり、現代的なプロトコルはすべてUDPベースであるという違い"
      - "L2TP/IPsecは暗号化を持たないトンネリング技術とユーザー認証を持たなかった暗号化技術を後から組み合わせた「寄せ集め」であるのに対し、現代的なプロトコルは最初から一貫した設計で作られているという違い"
      - "L2TP/IPsecはIPv6に対応していないが、現代的なプロトコルはすべてIPv6専用であるという違い"
      - "L2TP/IPsecはオープンソースで実装できないが、現代的なプロトコルはすべてオープンソースであるという違い"
    answerIndex: 1
    explanation: "L2TP/IPsecは、暗号化を持たないL2TPとユーザー認証の仕組みを持たなかったIKEv1ベースのIPsecという、別々の目的で設計された2つの規格を後から組み合わせたものです。現代的なプロトコルは最初から1つの目的のために一貫して設計されています。"

  - question: "IKEv2/IPsecがL2TPを介さずにリモートアクセスVPNを完結できる理由として、記事内で挙げられていないものはどれか。"
    choices:
      - "EAP認証を標準サポートし、ユーザー単位の認証をIKEv2自身が担えるようになった"
      - "Configuration Payloadという仕組みで仮想IPアドレス・DNSサーバーの払い出しを標準サポートしている"
      - "MOBIKE拡張により、クライアントのIPアドレスが変化してもSAを保持したまま新しいIPアドレスに付け替えられる"
      - "IKEv2は常にTCPポート443を使用するため、ファイアウォールを迂回できる"
    answerIndex: 3
    explanation: "IKEv2/IPsecが完結できる理由はEAP認証・Configuration Payload・MOBIKEです。TCPポート443を使ってファイアウォールを迂回しやすいのはOpenVPNの特徴として記事内で説明されています。"

  - question: "WireGuardの設計思想として、記事内で説明されている内容はどれか。"
    choices:
      - "選べる暗号アルゴリズムの種類を増やし、環境ごとに最適なアルゴリズムを選択できるようにしている"
      - "暗号アルゴリズムを1種類にあらかじめ固定することで、設定ミスやダウングレード攻撃の余地そのものをなくしている"
      - "IKEのネゴシエーション手順をそのまま踏襲しつつ、認証方式のみを刷新している"
      - "L2TPのトンネリング機構を流用し、暗号化部分だけを独自実装に置き換えている"
    answerIndex: 1
    explanation: "WireGuardはCurve25519・ChaCha20・Poly1305・BLAKE2sという暗号スイートをあらかじめ1種類に固定しており、ネゴシエーションでアルゴリズムを選ぶ手順自体が存在しないため、弱いアルゴリズムを選んでしまうリスクを構造的に排除しています。"

  - question: "OpenVPNの実務上の大きな特徴として記事内で説明されているものはどれか。"
    choices:
      - "UDPだけでなくTCPの上でも動作でき、TCP443番ポートを使うよう設定すれば一般的なHTTPS通信に偽装しやすい"
      - "カーネル空間に直接組み込まれているため、VPNプロトコルの中で最も高いスループットを発揮する"
      - "暗号アルゴリズムを1種類に固定しており、設定変更の余地が一切ない"
      - "ユーザー認証機能を一切持たず、公開鍵ペアのみで端末認証を行う"
    answerIndex: 0
    explanation: "OpenVPNはUDPとTCPのどちらでも動作でき、ポート番号も自由に設定できます。TCP443を使えば経路上から一般的なHTTPS通信に見えるため、UDP/ESPが遮断される制限の厳しい環境でも接続しやすくなります。"

  - question: "「複雑さが攻撃対象領域(アタックサーフェス)を広げる」という考え方について、記事内の説明として最も適切なものはどれか。"
    choices:
      - "この考え方はVPNプロトコルの設計には当てはまらず、機能の多さは常にセキュリティ向上に直結する"
      - "IKEのネゴシエーションで対応すべきメッセージ種類・拡張仕様が多いほど実装のバグが潜むリスクが高まるため、WireGuardは暗号アルゴリズムの選択肢を排除しコードベースを最小化する設計を選んでいる"
      - "この考え方はOpenVPNのみに当てはまり、IPsec系プロトコルには無関係である"
      - "複雑さとセキュリティリスクの間には記事内で明確な関連性が示されていない"
    answerIndex: 1
    explanation: "記事では、実装・仕様の複雑さが攻撃対象領域を広げるという考え方を紹介し、WireGuardが暗号アルゴリズムの選択肢を排除しコードベースを最小限に絞り込んでいることをこの教訓を踏まえた設計判断として説明しています。"

  - question: "ユーザー空間実装とカーネル空間実装のパフォーマンス特性の違いについて、記事内の説明として正しいものはどれか。"
    choices:
      - "ユーザー空間実装のOpenVPNは、パケット処理のたびにカーネルとユーザー空間の間でコンテキストスイッチが発生し、カーネル空間実装のWireGuardと比べてスループット面で不利になりやすい"
      - "カーネル空間実装は常にセキュリティリスクが高く、ユーザー空間実装の方が安全とされている"
      - "OpenVPNとWireGuardはどちらもカーネル空間実装であり、パフォーマンス特性に差はない"
      - "IPsec系プロトコルはすべてユーザー空間で処理されるため、WireGuardより低速になる"
    answerIndex: 0
    explanation: "OpenVPNはユーザー空間実装であり、パケット処理のたびにカーネルとの間でコンテキストスイッチとメモリコピーが発生します。カーネル空間に直接組み込まれたWireGuardはこのオーバーヘッドが小さく、スループット・レイテンシで有利になりやすいとされています。"

  - question: "「新しいプロトコルなら常に選ぶべきだ」という考え方に対する記事内の反論として最も適切なものはどれか。"
    choices:
      - "その通りであり、常に最新のプロトコルを選択すべきである"
      - "WireGuardは技術的に洗練されている一方、標準ユーザー認証や集中管理機能を仕様として持たないため、大規模組織のアクセス管理要件をそのままでは満たせないことがあり、要件への適合性で選ぶべきである"
      - "新しいプロトコルは常に実装が巨大化するため、古いプロトコルの方が望ましい"
      - "プロトコルの新旧はセキュリティに一切影響しないため、どちらを選んでも同じである"
    answerIndex: 1
    explanation: "記事は、WireGuardのようなプロトコルが技術的に優れていても、ユーザー認証やエンタープライズ向け集中管理機能を仕様として持たない場合があり、要件に対する適合性で選定すべきだと説明しています。"

  - question: "「L2TP/IPsecはもう危険で使うべきではない」という考え方について、記事内での位置づけとして最も適切なものはどれか。"
    choices:
      - "正しい。L2TP/IPsecはいかなる設定を行っても安全に運用することはできない"
      - "極端な結論であり、証明書ベースの認証やMain Modeの徹底など適切な設定を行えば実務上十分な安全性を確保できるとされている"
      - "L2TP/IPsecは暗号化機能自体を持たないため、この主張は正しい"
      - "この主張は現代的なプロトコル全般にも当てはまり、VPNというカテゴリ自体が危険とされている"
    answerIndex: 1
    explanation: "記事では、L2TP/IPsecは「設計上、安全でない構成を選べてしまう余地が大きい」のであって「必ず安全でない」わけではなく、適切な設定を行えば実務上十分な安全性を確保できると説明しています。"

  - question: "「動作するトランスポート」がVPNの選定において重要とされる理由として、記事内で説明されている「TCP over TCP」問題とはどのようなものか。"
    choices:
      - "VPNトンネル自体をTCPの上で運ぶと、トンネル内の利用者通信(その多くもTCP)と、トンネル自体のTCPがそれぞれ独立に再送・輻輳制御を行い、再送が競合してスループットが大きく低下する現象"
      - "TCPはUDPより暗号化強度が低いため、TCP上で動作するVPNは常に脆弱になるという問題"
      - "TCPポート番号が443番に固定されてしまい、他のサービスと競合してしまう問題"
      - "TCPでは暗号鍵の交換ができないため、VPNのトンネル自体をTCP上に構築すること自体が不可能であるという問題"
    answerIndex: 0
    explanation: "TCPの中にTCPが入れ子になると、内側と外側それぞれが独立に再送タイマー・輻輳制御を働かせるため再送が競合し、RTTの見積もりが乱れてスループットが大きく低下します。OpenVPNが標準でUDPを推奨するのはこの問題を避けるためです。"

  - question: "TLSでVPNを実装できる(OpenVPNが行っていること)という点について、記事内の説明として正しいものはどれか。"
    choices:
      - "TLSはIPパケットを扱えないため、OpenVPNは独自にTLSを拡張した専用プロトコルを新たに定義している"
      - "TUN仮想ネットワークインターフェース経由で受け取ったIPパケットを、中身を区別しないTLSコネクションにそのまま流し込むことでトンネルを実現しており、L2TP/IPsecがTLSでなくIPsecベースで設計されたのは主に世代の違い・L2透過性を目指した設計範囲の違い・TCP over TCP問題が理由である"
      - "TLSはUDPの上でしか動作しないため、OpenVPNは必ずUDPモードでのみ動作する"
      - "L2TP/IPsecの設計者たちはTLSの存在を知らなかったため、代わりにIPsecを採用した"
    answerIndex: 1
    explanation: "TLSは中身を関知しないバイト列としてIPパケットも運べます。L2TP/IPsecがTLSでなくIPsecベースになった理由は、TLS標準化がIPsecとほぼ同時期かそれ以降だったこと、L2フレームまで含む透過的なトンネリングを目指していたこと、TLS(TCP)の上に構築するとTCP over TCP問題が生じることの3点です。"

  - question: "現代のVPNプロトコルの実際の使い分けについて、記事内の説明として最も適切なものはどれか。"
    choices:
      - "WireGuardが技術的に最も優れているため、企業のリモートアクセスVPNではすでにIKEv2/IPsecやOpenVPNは使われなくなっている"
      - "IKEv2/IPsecはOS標準クライアントで運用できる点、OpenVPNはTCP443フォールバックによる接続性の高さ、WireGuardはシンプルさ・速さゆえに自己ホストやTailscaleのようなラッパー製品での採用が進んでいる点が、それぞれの実務での使われ方を左右している"
      - "WireGuardは標準仕様でユーザー単位のアクセス管理機能を完備しているため、そのまま大規模企業に導入されている"
      - "OpenVPNはUDPにしか対応していないため、ファイアウォールが厳しい環境では利用できない"
    answerIndex: 1
    explanation: "記事では、OS標準クライアントで完結できるか、制限の厳しいネットワークからの接続性、ユーザー単位のアクセス管理をどこで担わせるかという運用要件によって、プロトコルの実際の使われ方が分かれると説明しています。WireGuard自体は標準でユーザー管理機能を持たないため、TailscaleなどのラッパーがIdP連携などを補っています。"
