questions:
  - question: "手動で実行すれば動くスクリプトが、crontabに登録すると静かに失敗する理由として正しいのはどれか。"
    choices:
      - "crontabには、スクリプトを実行する機能自体がない"
      - "cronが、ログインシェルが読み込む.bashrcなどを一切経由せず、最小限の環境変数だけでジョブを実行するため"
      - "crontabは、root権限を持つスクリプトしか実行できないため"
      - "crontabは、1日に1回しか実行できないため"
    answerIndex: 1
    explanation: "cronは、ログインシェルが起動する際に読み込まれる/etc/profileや~/.bashrcを一切経由せずにジョブを実行するため、最小限の環境変数しか持っていません。"

  - question: "cronが実際に持っている、典型的なPATHの特徴として正しいのはどれか。"
    choices:
      - "対話シェルのPATHよりも、大幅に長く拡張されている"
      - "対話シェルのPATHよりも、大幅に短い、最小限のものに限られている"
      - "PATHという環境変数自体が存在しない"
      - "対話シェルとまったく同じPATHが、自動的に引き継がれる"
    answerIndex: 1
    explanation: "cronが実際に持っている環境変数のPATHは、PATH=/usr/bin:/bin程度の、対話シェルよりも大幅に短い、最小限のものに限られています。"

  - question: "cronジョブが失敗したときの、既定の挙動として正しいのはどれか。"
    choices:
      - "必ずシステムログにエラーメッセージが記録される"
      - "標準出力・標準エラー出力がどこにも表示されず、明示的なリダイレクト設定がない限り、エラーが静かに失われる"
      - "自動的に管理者へメールで通知される"
      - "ジョブが自動的に再試行される"
    answerIndex: 1
    explanation: "cronは既定では、ジョブの標準出力・標準エラー出力をどこにも表示しないため、明示的なリダイレクト設定がない限り、エラーは静かに失われます。"

  - question: "cronの環境と、対話シェルの環境の違いを、自分の目で確認する方法として正しいのはどれか。"
    choices:
      - "crontabのマニュアルを読む"
      - "env > ファイルという一時的なcronジョブを登録し、対話シェルで取得したenvの出力と比較する"
      - "システムを再起動する"
      - "cronデーモンのバージョンを確認する"
    answerIndex: 1
    explanation: "cronジョブとしてenvコマンドの出力をファイルへ書き出し、対話シェルで取得したenvの出力と比較することで、2つの環境の違いを自分の目で確認できます。"

  - question: "cronジョブで、PATHに依存する問題を防ぐための、有効な対策として正しいのはどれか。"
    choices:
      - "何もせず、cronが自動的に対話シェルの環境を引き継ぐのを待つ"
      - "スクリプト内でコマンドをフルパスで指定するか、スクリプトの先頭で明示的にPATHを設定する"
      - "crontabファイル自体を削除する"
      - "ジョブの実行頻度を減らす"
    answerIndex: 1
    explanation: "スクリプト内でコマンドをフルパスで指定するか、スクリプトの先頭で明示的にPATHを設定することが、cronでのPATH依存の問題を防ぐ有効な対策です。"
