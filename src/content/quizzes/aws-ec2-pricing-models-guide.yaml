questions:
  - question: "3つの料金モデルのうち、最も単価が高いが、いつでも起動・停止できるのはどれか。"
    choices:
      - "リザーブドインスタンス"
      - "オンデマンドインスタンス"
      - "スポットインスタンス"
      - "3つとも単価は同じである"
    answerIndex: 1
    explanation: "オンデマンドインスタンスは、長期的な利用の約束が不要な代わりに、3つのモデルの中で最も単価が高いモデルです。"

  - question: "リザーブドインスタンスが大幅な割引を受けられる理由として正しいのはどれか。"
    choices:
      - "AWSが慈善事業として提供しているため"
      - "特定のインスタンスタイプ・リージョンでの長期的な利用を事前に約束することで、AWS側が需要を確実に見込めるため"
      - "性能が他のモデルより劣るため"
      - "リザーブドインスタンスには広告が表示されるため"
    answerIndex: 1
    explanation: "AWS側から見れば、そのリソースの需要を長期的に確実に見込めるため、価格を下げてでも確保してもらう方が合理的だからです。"

  - question: "スポットインスタンスが中断される理由として正しいのはどれか。"
    choices:
      - "ランダムなタイミングで、理由なく中断される"
      - "AWS側が、別の需要(オンデマンドやリザーブドの利用者)のためにそのリソースを回収する必要が生じた場合に中断される"
      - "毎日決まった時刻に必ず中断される"
      - "料金を払い忘れた場合にのみ中断される"
    answerIndex: 1
    explanation: "スポットインスタンスは、AWS側が別の需要のためにそのリソースを回収する必要が生じた場合、短い猶予通知の後に強制的に中断されます。"

  - question: "スポットインスタンスと相性が良いワークロードの性質はどれか。"
    choices:
      - "状態を常に保持し続ける必要があるデータベースサーバー"
      - "中断されても、後で再実行すればよいバッチ処理やデータ分析"
      - "1秒でも停止すると致命的な問題になる決済処理"
      - "スポットインスタンスに適したワークロードは存在しない"
    answerIndex: 1
    explanation: "バッチ処理やデータ分析のような、中断されても後で再実行すればよい性質のワークロードは、スポットインスタンスと非常に相性が良いです。"

  - question: "実務における料金モデルの使い分けとして最も適切な考え方はどれか。"
    choices:
      - "システム全体で必ず1つのモデルに統一する"
      - "ワークロードの性質ごとに、複数の料金モデルを組み合わせて使う"
      - "常に最も安いスポットインスタンスだけを使う"
      - "常に最も高いオンデマンドインスタンスだけを使う"
    answerIndex: 1
    explanation: "実務では、常時稼働する部分はリザーブド、一時的な増加分はオンデマンド、中断耐性のあるworkloadはスポット、というように組み合わせて使うのが基本です。"
