questions:
  - question: "ファイアウォールとプロキシが制御している対象の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "ファイアウォールとプロキシは完全に同一の機能を提供しており、区別する意味はない"
      - "ファイアウォールは主にIPアドレス・ポート番号を基準に通信の通過可否を判定し、プロキシはHTTPなどのアプリケーション層の内容自体を理解して中継・制御する"
      - "ファイアウォールはアプリケーション層の内容を理解し、プロキシはIPアドレス・ポート番号だけを見る(記事の説明と逆)"
      - "ファイアウォールとプロキシは、どちらも物理層のケーブル自体を制御する機器である"
    answerIndex: 1
    explanation: "ファイアウォールは主にIPアドレス・ポート番号を基準に通信を「通す/通さない」で制御する仕組みであり、プロキシはHTTPなどのアプリケーション層のプロトコルの内容自体を実際に理解し、その内容に基づいて中継・加工・制御を行う仕組みです。"

  - question: "明示的プロキシと透過型プロキシの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "明示的プロキシはクライアントの設定にプロキシサーバーのアドレスを明示的に指定する方式、透過型プロキシはネットワーク機器が通信を自動的にプロキシへ転送しクライアントがプロキシの存在を意識しない方式である"
      - "明示的プロキシと透過型プロキシは、暗号化の強度だけが異なる"
      - "透過型プロキシは、必ず物理的に透明な(見た目が透明な)筐体を使用しなければならない"
      - "明示的プロキシは無料、透過型プロキシは有料のライセンスが必要である"
    answerIndex: 0
    explanation: "明示的プロキシはクライアント(ブラウザなど)の設定にプロキシサーバーのアドレスを明示的に指定する方式で、クライアントは自分がプロキシを経由していることを認識します。透過型プロキシはクライアント側に設定変更を行わず、ネットワーク機器が通信を自動的にプロキシへ転送する方式で、クライアントはプロキシの存在を意識しません。"

  - question: "プロキシが通信の中身を検査できるにもかかわらず、ファイアウォールも必要である理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "プロキシが対応できるプロトコルは限られ経路上の通信しか見えないこと、処理コストの分業、多層防御という観点から、両者は代替関係ではなく補完関係にある"
      - "ファイアウォールのほうが常にプロキシより高性能であり、プロキシは実質的に不要である"
      - "プロキシとファイアウォールは、法律で両方の設置が義務付けられているためだけに併用されている"
      - "ファイアウォールは見た目の複雑さを演出するためだけに設置されている、実質的な機能のない機器である"
    answerIndex: 0
    explanation: "プロキシはHTTPなど自分が対応するプロトコルしか中継・検査できず、経路上に置かれた通信しか見えません。ファイアウォールはプロトコルを問わずあらゆる通信を軽量に判定できる汎用的な制御レイヤーであり、処理コストの分業や多層防御の観点からも、両者は代替ではなく補完関係にあります。"

  - question: "クラウドプロキシ(SWG)が重要になった背景について、記事の説明に最も合致するものはどれか。"
    choices:
      - "従業員がオフィス以外の場所から直接インターネットへアクセスする機会が増えたため、場所を問わず一貫したセキュリティポリシーを適用する必要が生じたため"
      - "オンプレミスのプロキシサーバーが、技術的に完全に製造中止になったため"
      - "クラウドプロキシは、従来のプロキシより常に処理速度が遅いため、あえて選ばれるようになった"
      - "クラウドプロキシは、ファイアウォールを完全に代替する目的で開発された"
    answerIndex: 0
    explanation: "従業員がオフィス以外の場所(自宅、外出先)から直接インターネットへアクセスする機会が増えたことが背景にあります。クラウドプロキシは、従業員のデバイスがどこにいても、まずクラウド上のプロキシを経由させることで、場所を問わず一貫したセキュリティポリシーを適用できるようにします。"

  - question: "クラウドプロキシ(SWG)とZTNA・SASEの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "SWGはインターネットへのアウトバウンド通信の保護を担い、ZTNAは主に社内アプリケーションへのアクセス(インバウンド寄り)を扱い、両方を統合したより広い概念がSASEである"
      - "SWG・ZTNA・SASEはすべて同一の技術を指す、単なる呼び方の違いである"
      - "SWGはZTNAの旧称であり、現在ではSWGという用語は使われていない"
      - "SASEは、SWGやZTNAとは無関係の、まったく別の分野の技術である"
    answerIndex: 0
    explanation: "SWG(クラウドプロキシ)はインターネット上のリソースへアクセスする際の保護(アウトバウンド寄り)を担い、ZTNAは主に社内アプリケーションへのアクセス(インバウンド寄り)を扱います。この両方を統合したより広い概念がSASE(Secure Access Service Edge)です。"

  - question: "プロキシがHTTPS通信の内容を検査する際に必要となる技術について、記事の説明に最も合致するものはどれか。"
    choices:
      - "HTTPS通信は暗号化されていないため、追加の技術は一切不要である"
      - "SSLインスペクション(通信を一度復号し検査した上で再暗号化する技術)が必要であり、実現のためにはクライアント側にプロキシが使用する証明書を信頼させる設定が必要になる"
      - "HTTPS通信の内容は、ファイアウォールの設定を変更するだけで自動的に検査できるようになる"
      - "HTTPS通信の検査には、クライアント側のCPUを物理的に交換する必要がある"
    answerIndex: 1
    explanation: "現在の通信の多くがHTTPS(暗号化された通信)であるため、プロキシが通信の中身を検査したい場合、SSLインスペクション(通信を一度復号し、検査した上で再暗号化する)という技術が必要になります。これには、クライアント側にプロキシが使用する証明書を信頼させる設定(証明書のインストール)が必要です。"
