questions:
  - question: "UEFIブートマネージャーが、POST完了後に最初に実行するプログラムをどのように決定しているか、本文の説明として最も適切なものはどれか。"
    choices:
      - "ディスクの先頭512バイトにあるMBR内の446バイトのブートストラップコードを常に無条件で実行する"
      - "マザーボード上のNVRAMに保存された`BootOrder`と、対応する`Boot0000`等のエントリ情報を読み取り、EFIシステムパーティション(ESP)上の`.efi`実行ファイルを特定して実行する"
      - "ハードディスクのパーティションテーブルを全走査し、最も先頭にあるパーティションを機械的に起動対象とする"
      - "OSカーネルのバージョン情報を直接読み取り、最新のカーネルを自動的に選択する"
    answerIndex: 1
    explanation: "本文の説明の通り、UEFIブートマネージャーはNVRAM上の`BootOrder`と個々の`Boot####`エントリを読み取り、ESP上の`.efi`実行ファイル(多くの場合GRUB2やshim)を特定して実行します。MBRの446バイトのブートストラップコードはレガシーBIOS方式の話であり、UEFIとは異なる仕組みです。"

  - question: "Secure Bootが有効な環境で、GRUB2がブートマネージャーから直接ではなく「shim」経由で呼ばれる理由として、本文の説明に最も合致するものはどれか。"
    choices:
      - "shimはGRUB2よりも高速に起動できるため、単なる性能上の理由でGRUB2の前段に置かれている"
      - "shimはMicrosoftの署名を持つ仲介プログラムであり、埋め込まれたディストリビューションの証明書やMOKを使ってGRUB2の署名を検証し、検証に成功した場合のみGRUB2を実行するため"
      - "shimはNVRAM上のPK・KEK・db・dbxそのものであり、これらの鍵情報を直接書き換えるために必要だから"
      - "GRUB2単体では`.efi`形式のファイルを読み込めない構造上の制約があり、shimがファイル形式を変換する役割を担っているから"
    answerIndex: 1
    explanation: "本文では、shimはMicrosoftの署名を持つ仲介プログラムであり、自身に埋め込まれた証明書またはMOK(Machine Owner Key)を使ってGRUB2の署名を検証し、成功した場合のみGRUB2を実行すると説明されています。PK・KEK・db・dbxはファームウェア自体が持つ別のNVRAM上の鍵情報であり、shimが個別に扱うMOKとは別の仕組みです。"

  - question: "initramfsが必要とされる「鶏と卵」問題として、本文の説明に最も合致するものはどれか。"
    choices:
      - "カーネル本体のサイズが大きすぎてブートローダーが一度に読み込めないため、initramfsで分割して読み込む必要がある"
      - "実ルートファイルシステムがRAID/LVM/暗号化などの上に構成されている場合、それらを扱うためのドライバ・ツール自体が実ルートファイルシステムの中に置かれており、実ルートに到達する前にそれらへアクセスできないという堂々巡りが生じるため"
      - "initramfsがなければPOSTそのものが完了しないという、ハードウェア診断上の制約があるため"
      - "initramfsはユーザーがログインパスワードを入力するための専用の画面であり、認証情報を保存する場所として必須であるため"
    answerIndex: 1
    explanation: "本文で説明されている「鶏と卵」問題は、実ルートFSを扱うために必要なドライバやツールが、まさにこれから読み込もうとしている実ルートFSの中にある、という堂々巡りです。initramfsは、この問題を解決するために最低限必要なドライバ・ツールをあらかじめメモリ上に用意しておく仕組みです。"

  - question: "現代のinitramfs実装が、実ルートファイルシステムへの切り替えに`pivot_root`ではなく`switch_root`を使う理由として、本文の説明に最も合致するものはどれか。"
    choices:
      - "`switch_root`の方が`pivot_root`より高速に動作するというベンチマーク上の理由だけで採用されている"
      - "現代のinitramfsはtmpfs上に直接展開されたルートファイルシステムであり、退避すべき親マウントが存在しないため`pivot_root`が使えず、`/proc`等を新しいルートへ`mount --move`したうえでchroot・execする`switch_root`が使われる"
      - "`pivot_root`はUEFI環境专用のシステムコールであり、レガシーBIOS環境では動作しないため`switch_root`に置き換えられた"
      - "`switch_root`はGRUB2が提供する機能であり、カーネルの機能である`pivot_root`より新しい規格に準拠しているため"
    answerIndex: 1
    explanation: "本文では、tmpfs上のinitramfsには退避対象となる親マウントが存在しないため`pivot_root`が使えず、`/proc`・`/dev`・`/sys`・`/run`を新しいルートへ`mount --move`し、chroot・execする`switch_root`が使われると説明されています。"

  - question: "systemdがPID1として起動処理を行う際の特徴として、旧来のSysV init方式と対比したときに本文の説明に最も合致するものはどれか。"
    choices:
      - "systemdはランレベルごとに定義されたスクリプトを番号順に逐次実行する点でSysV initと同じ挙動をする"
      - "systemdはunitファイルの`Before=`/`After=`や`Wants=`/`Requires=`から依存関係グラフを構築し、依存関係が許す範囲でunitを並列に起動するのに対し、SysV initはランレベルのスクリプトを逐次実行する"
      - "systemdはカーネルの一部としてコンパイルされており、initramfsを経由せず直接実行される"
      - "systemdは常に単一のunitのみを起動し、複数サービスの管理はできない"
    answerIndex: 1
    explanation: "本文の表にある通り、SysV initはランレベルごとのスクリプトを番号順に逐次実行するのに対し、systemdはunit間の依存関係グラフを構築し、依存関係のないunit同士を並列に起動します。これが起動時間短縮の大きな理由の1つとして説明されています。"

  - question: "Secure Bootと測定起動(Measured Boot)の違いについて、本文の説明に最も合致するものはどれか。"
    choices:
      - "Secure Bootは実行を止める仕組み、測定起動は何が実行されたかをTPMのPCRに改ざん不可能な形で記録する仕組みであり、測定起動自体は未署名のプログラムの実行を止めない"
      - "Secure Bootと測定起動は同じ仕組みの別名であり、片方を有効にすればもう片方も自動的に有効になる"
      - "測定起動はSecure Bootより厳格な仕組みであり、未署名のプログラムを検出した時点で必ず起動を停止させる"
      - "Secure BootはTPMのPCRにハッシュ値を記録する仕組みであり、測定起動は署名検証によって実行を止める仕組みである(本文とは逆の説明)"
    answerIndex: 0
    explanation: "本文では、Secure Bootは署名検証によって未署名・改ざんされたプログラムの実行を止める仕組みであり、測定起動は実行を止めず、各段階のハッシュ値をTPMのPCRに改ざん不可能な形で記録するリモート・アテステーションや鍵封印のための仕組みだと説明されています。選択肢4は両者の役割が逆になっています。"

  - question: "サーバーが`grub rescue>`プロンプトで停止した場合と、`(initramfs)`の緊急シェルに落ちた場合の違いについて、本文の説明に最も合致するものはどれか。"
    choices:
      - "両者は原因・対応ともに同一であり、区別する実務的な意味はない"
      - "`grub rescue>`はカーネルが起動した後に実ルートFSを見つけられない状態、`(initramfs)`はブートローダー自身が設定ファイルを見つけられない状態を指す(本文とは逆)"
      - "`grub rescue>`はブートローダー自身が設定ファイル・モジュールを見つけられていない、カーネルが動き出す前の段階のトラブルであり、`(initramfs)`はカーネルは正常に起動しているが実ルートFSを特定・マウントできない、カーネル起動後の段階のトラブルである"
      - "`grub rescue>`はハードウェア故障時にのみ表示され、`(initramfs)`はソフトウェア起因の場合にのみ表示される"
    answerIndex: 2
    explanation: "本文の障害・トラブルシューティングの節で説明されている通り、`grub rescue>`はカーネルが動き出す前、ブートローダー自身が設定ファイルやモジュールを見つけられない段階のトラブルであり、`(initramfs)`の緊急シェルはカーネルは正常に起動しているものの実ルートFSを特定・マウントできない、カーネル起動後・実OS起動前の段階のトラブルです。"

  - question: "本文で説明されているPCR(Platform Configuration Register)への測定値の記録方法として、最も適切なものはどれか。"
    choices:
      - "新しい測定値で常に上書きされるため、直近の1回分の記録しか保持されない"
      - "既存の値と新しい測定値を連結して再度ハッシュ化する「extend」という操作で積み上げ式に記録され、途中の記録を後から改ざんすることができない"
      - "PCRは記録専用ではなく、記録した値を使って未署名プログラムの実行を直接ブロックする機能を持つ"
      - "PCRの値はOS起動後に管理者が自由に書き換えられる、通常のログファイルと同様の可変領域である"
    answerIndex: 1
    explanation: "本文では、PCRは上書きではなく「extend」という、既存の値と新しい値を連結して再度ハッシュ化する操作によって積み上げ式に記録され、途中の記録を後から改ざんできない点が説明されています。実行のブロックは測定起動ではなくSecure Bootの役割です。"
