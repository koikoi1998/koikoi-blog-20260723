questions:
  - question: "NTFSのACLが、「誰に」権限を与えるかを記録している方法として正しいのはどれか。"
    choices:
      - "ユーザー名やグループ名という読みやすい文字列で記録している"
      - "SID(セキュリティ識別子)という内部的な識別子で記録している"
      - "メールアドレスで記録している"
      - "IPアドレスで記録している"
    answerIndex: 1
    explanation: "NTFSのACLは、ユーザー名やグループ名ではなく、SIDという内部的な識別子で「誰に」権限を与えるかを記録しています。"

  - question: "新ファイルサーバーがドメインに参加していない状態でRobocopy /COPYALLを実行した場合に起きることとして正しいのはどれか。"
    choices:
      - "すべてのACLが正しくコピーされる"
      - "ドメインSIDを解決できないため、ドメインユーザー・グループに関する権限が正しく設定されない"
      - "ファイル自体もコピーされなくなる"
      - "共有アクセス許可だけが自動的にコピーされる"
    answerIndex: 1
    explanation: "ドメインに参加していないコピー先では、ドメインSIDの解決に必要なDCへの問い合わせができず、ドメインユーザー・グループに関する権限が正しく設定されません。"

  - question: "旧ファイルサーバーのACLに、そのサーバー自身のローカルグループが使われていた場合に起きることとして正しいのはどれか。"
    choices:
      - "新サーバーがドメインに参加していれば、問題なく解決できる"
      - "ローカルグループのSIDは別のコンピューターからは解決できず、デッドSIDとして残る"
      - "ローカルグループは自動的にドメイングループへ変換される"
      - "この場合は、Robocopy自体が実行できなくなる"
    answerIndex: 1
    explanation: "ローカルグループのSIDは、そのグループが作成されたコンピューター自身に固有であり、別のコンピューターからは、ドメインに参加していても解決できず、デッドSIDとして残ります。"

  - question: "共有アクセス許可として設定した読み取り専用設定が、Robocopyでコピーされるかどうかについて正しいのはどれか。"
    choices:
      - "共有アクセス許可もNTFS ACLの一部としてコピーされる"
      - "共有アクセス許可はファイルシステム上に記録されておらず、Robocopyのコピー対象に含まれない"
      - "共有アクセス許可は常にNTFSアクセス許可より優先してコピーされる"
      - "共有アクセス許可は新サーバーで自動的に最も厳しい設定になる"
    answerIndex: 1
    explanation: "共有アクセス許可は、共有フォルダーそのものに紐づく情報であり、ファイルシステム上には記録されていないため、Robocopyがコピーするファイル・フォルダーのNTFS ACLには含まれません。"

  - question: "正しいファイルサーバー移行の順序として適切なのはどれか。"
    choices:
      - "まずRobocopyでファイルをコピーし、その後で新サーバーをドメインへ参加させる"
      - "新サーバーをドメインへ参加させ、DCへの問い合わせが可能な状態を確認した後にRobocopyでコピーする"
      - "ドメイン参加とRobocopyのコピーは、順序を気にする必要がない"
      - "旧サーバーをドメインから脱退させてからRobocopyを実行する"
    answerIndex: 1
    explanation: "新ファイルサーバーをまずドメインへ参加させ、DCへの問い合わせが可能な状態を確認した後にRobocopyでコピーすることで、ドメインSIDが正しく解決され、ACLが正確に引き継がれます。"
