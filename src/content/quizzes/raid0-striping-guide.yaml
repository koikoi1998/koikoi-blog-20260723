questions:
  - question: "RAID0とRAID1の、設計思想の違いとして正しいのはどれか。"
    choices:
      - "両者は同じ目的を持つ、ほぼ同一の仕組みである"
      - "RAID1は同じデータを複製して冗長性を確保し、RAID0はデータを分散して速度を高めるだけで冗長性を持たない"
      - "RAID0の方が、RAID1より常に安全である"
      - "RAID1には冗長性がなく、RAID0には冗長性がある"
    answerIndex: 1
    explanation: "RAID1はデータを複製して冗長性を確保する仕組みであり、RAID0はデータを分散して速度を高めるだけで、冗長性を一切持ちません。"

  - question: "RAID0で、アレイを構成するディスクのうち1台が故障した場合に起きることとして正しいのはどれか。"
    choices:
      - "その故障したディスクに保存されていた分だけが失われ、他のディスクのデータは読み取れる"
      - "1つのファイルの内容が複数のディスクへ分割されているため、アレイ上のすべてのファイルが実用的には復元不可能になる"
      - "何も起こらず、通常通り動作を継続する"
      - "自動的にRAID1へ切り替わる"
    answerIndex: 1
    explanation: "RAID0では、1つのファイルの内容が複数のディスクへ分割されているため、1台の故障は、アレイ上のすべてのファイルの損失を意味します。"

  - question: "RAID0において、ディスクの台数を増やした場合に起きる、直感に反する現象として正しいのはどれか。"
    choices:
      - "アレイ全体としての故障確率が、むしろ上昇する"
      - "アレイ全体としての故障確率が、常にゼロになる"
      - "ディスクの台数とは無関係に、故障確率は常に一定である"
      - "ディスクの台数を増やすと、自動的に冗長性が生まれる"
    answerIndex: 1
    explanation: "RAID0では、どれか1台でも故障すればアレイ全体がデータを失うため、ディスクの台数が増えるほど、アレイ全体としての故障確率が上昇します。"

  - question: "RAID0が実務で採用される、適切な前提として正しいのはどれか。"
    choices:
      - "最も重要な、失ってはならないデータを保存する場合"
      - "速度を最優先し、そのデータが失われても業務上致命的ではない場合"
      - "冗長性を最優先する必要がある場合"
      - "容量効率を一切考慮しない場合"
    answerIndex: 1
    explanation: "RAID0は、速度を最優先し、そのデータが失われても業務上致命的ではないという前提がある場合に限って、実務で採用されるべき方式です。"

  - question: "速度と冗長性の両方が必要な場合に、検討すべき構成として正しいのはどれか。"
    choices:
      - "RAID0単体を、そのまま使い続ける"
      - "RAID0とRAID1を組み合わせたRAID10(1+0)のような、より複雑な構成"
      - "RAIDを一切使わない、単一ディスク構成"
      - "ディスクの台数を、可能な限り減らす"
    answerIndex: 1
    explanation: "速度と冗長性の両方が必要な場合は、RAID0とRAID1を組み合わせたRAID10のような、より複雑な構成を検討する必要があります。"
