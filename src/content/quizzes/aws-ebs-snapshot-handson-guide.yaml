questions:
  - question: "2回目以降のEBSスナップショットが、1回目に比べて短時間・低コストで作成できる理由は何か。"
    choices:
      - "2回目以降はデータを圧縮して保存するため"
      - "2回目以降は直前のスナップショットからの差分だけを保存する増分バックアップであるため"
      - "2回目以降はキャッシュから直接コピーされるため"
      - "AWSが2回目以降を無料で提供しているため"
    answerIndex: 1
    explanation: "EBSスナップショットは、2回目以降が直前のスナップショットからの差分だけを保存する増分バックアップであるため、時間とコストが大幅に小さくなります。"

  - question: "1回目のスナップショットを削除すると、2回目のスナップショットはどうなるか。"
    choices:
      - "2回目のスナップショットも一緒に壊れて復元できなくなる"
      - "AWSが内部でブロックの参照関係を管理しているため、2回目は単独で正常に復元できる状態が保たれる"
      - "2回目のスナップショットが自動的に1回目相当のフルバックアップに変換される"
      - "2回目のスナップショットのサイズが2倍になる"
    answerIndex: 1
    explanation: "AWSが内部でブロックの参照関係を管理しているため、1回目にしか存在しないブロックのデータは2回目に引き継がれ、2回目は単独で正常に復元できます。"

  - question: "AMIとは何か。"
    choices:
      - "EBSボリュームそのものの別名"
      - "スナップショットに加えて、OS・インスタンスタイプ・起動時の設定などのメタデータをまとめたもの"
      - "EC2インスタンスのネットワーク設定だけを保存したファイル"
      - "IAMロールの権限一覧"
    answerIndex: 1
    explanation: "AMIは、スナップショットに加えてOSやインスタンスタイプなどのメタデータをまとめたもので、このAMIから同じ状態のインスタンスをいつでも起動できます。"

  - question: "gp3ボリュームの特徴として正しいのはどれか。"
    choices:
      - "ストレージ容量とIOPS・スループットをそれぞれ独立して指定でき、多くのワークロードにコストパフォーマンスが良い"
      - "極めて高いIOPSが必要なデータベース専用のボリュームタイプである"
      - "io2よりも常に高価である"
      - "スナップショットを取得できないボリュームタイプである"
    answerIndex: 0
    explanation: "gp3は容量とIOPS・スループットを独立して指定でき、多くのワークロードに対してコストパフォーマンスに優れた汎用ボリュームです。"

  - question: "AMIを登録抹消(deregister)した後の挙動として正しいのはどれか。"
    choices:
      - "紐づくスナップショットも自動的に削除される"
      - "紐づくスナップショットは自動的には削除されず、不要なら個別に削除する必要がある"
      - "元のEC2インスタンスも自動的に終了する"
      - "登録抹消は取り消すことができない操作である"
    answerIndex: 1
    explanation: "AMIは内部的にスナップショットを参照しているだけであり、登録抹消してもスナップショットは自動的には削除されません。"
