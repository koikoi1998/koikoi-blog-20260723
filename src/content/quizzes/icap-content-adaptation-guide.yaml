questions:
  - question: "企業のプロキシが提供するウイルススキャン機能の、実際の実装として正しいのはどれか。"
    choices:
      - "Squidのようなプロキシソフトウェア自身が、スキャン処理を行っている"
      - "プロキシは、ICAPという中継プロトコルを使い、専用のICAPサーバーへ処理を委ねている"
      - "ウイルススキャンは、クライアント側のブラウザが行っている"
      - "ウイルススキャンは、DNSサーバーが行っている"
    answerIndex: 1
    explanation: "多くの場合、プロキシは検査処理そのものを行わず、ICAPという中継プロトコルを使って、専用のICAPサーバーへ処理を委ねています。"

  - question: "REQMODとRESPMODの違いとして正しいのはどれか。"
    choices:
      - "REQMODはレスポンスを、RESPMODはリクエストを検査する"
      - "REQMODはクライアントからのリクエスト(アップロードなど)を、RESPMODはサーバーからのレスポンス(ダウンロードなど)を検査する"
      - "両者はまったく同じタイミングで、同じ内容を検査する"
      - "REQMODはキャッシュのみ、RESPMODは暗号化のみを行う"
    answerIndex: 1
    explanation: "REQMODはクライアントからのリクエスト(アップロード内容など)を、RESPMODはサーバーからのレスポンス(ダウンロードするファイルなど)を、別々のタイミングで検査します。"

  - question: "ICAPサーバーが返す『204 No Content』応答の意味として正しいのはどれか。"
    choices:
      - "検査対象に問題があり、通信を拒否する"
      - "検査対象に問題がなく、元のリクエスト・レスポンスをそのまま変更せずに使い続ける"
      - "ICAPサーバー自体が故障している"
      - "検査処理がタイムアウトした"
    answerIndex: 1
    explanation: "ICAPサーバーが検査対象の内容に問題がないと判断した場合、204 No Contentという応答を返し、プロキシは元のリクエスト・レスポンスをそのまま変更せずに使い続けます。"

  - question: "204応答が使えなくなる可能性がある状況として正しいのはどれか。"
    choices:
      - "ペイロードが一定の大きさを超える、またはサイズを事前に判断しづらい場合"
      - "通信が暗号化されている場合"
      - "クライアントがモバイル端末である場合"
      - "ICAPサーバーのバージョンが新しい場合"
    answerIndex: 0
    explanation: "ペイロードが一定の大きさ(Squidの実装では64KB)を超える場合や、サイズを事前に判断しづらい場合には、204を受け入れられないことがあります。"

  - question: "ICAPという仕組みが示している、プロキシの構造上の特徴として正しいのはどれか。"
    choices:
      - "プロキシという1つの製品の中に、中継とコンテンツ検査という独立した専門性が、ICAPという薄いプロトコルで接続されている"
      - "プロキシは、常に単一の専門性だけで構成されている"
      - "ICAPは、プロキシの性能を低下させるだけの、不要な仕組みである"
      - "ICAPサーバーは、プロキシソフトウェアの一部として必ず内蔵されている"
    answerIndex: 0
    explanation: "プロキシ自身が持つHTTP中継・キャッシュという専門性と、ICAPサーバーが持つコンテンツ検査という、まったく別の専門性が、ICAPという薄いプロトコルで接続されています。"
