questions:
  - question: "記事内での「デーモン」の説明として最も適切なものはどれか。"
    choices:
      - "特殊な言語機能でコンパイルされた、通常のプロセスとは異なる実行形式のプログラム"
      - "端末から切り離され、バックグラウンドで常駐し続け、外部からのリクエストをきっかけに処理を行うプロセス"
      - "必ずroot権限で動作することが仕様上定められているプロセス"
      - "OSの起動時にのみ一度だけ実行され、その後は終了するプロセス"
    answerIndex: 1
    explanation: "デーモンは特別な実行形式ではなく、端末から切り離してバックグラウンドで常駐するという起動のされ方によって通常のプロセスと区別されます。"

  - question: "IKEデーモンやL2TPデーモンのようなプロトコル処理が、常駐するデーモンとして実装される理由として記事が挙げているものはどれか。"
    choices:
      - "デーモンとして実装しないとOSがそのプログラムをセキュリティ上信用しないため"
      - "プロトコルのネゴシエーションが複数メッセージにまたがり、途中経過の状態を保持し続ける必要があるため"
      - "デーモンとして実装すると自動的に暗号化が有効になるため"
      - "1回のリクエストに応答して終了する短命なプログラムの方が高速だから、あえて逆の設計を選んでいる"
    answerIndex: 1
    explanation: "プロトコルのネゴシエーションは暗号鍵やシーケンス番号などの状態を保持しながら複数のメッセージをやり取りする必要があり、常駐するデーモンとして実装するのが自然だと説明されています。"

  - question: "現代のLinuxでsystemdがデーモンの管理において肩代わりしている役割として、記事内で説明されていないものはどれか。"
    choices:
      - "起動時のデーモン化(fork/setsid/標準入出力のリダイレクトなど)の代行"
      - "クラッシュ時の自動再起動(Restart=on-failureなど)の制御"
      - "起動順序・依存関係の解決"
      - "デーモンが処理するプロトコルの暗号アルゴリズムを自動的に最新のものへ置き換える機能"
    answerIndex: 3
    explanation: "systemdはデーモン化・起動順序・依存関係・クラッシュ時の自動再起動・ログの一元管理を肩代わりしますが、プロトコルの暗号アルゴリズムを置き換える機能は持ちません。"

  - question: "複数のデーモンが連携する構成(L2TP/IPsecのIKEデーモン・L2TPデーモン・PPPデーモンなど)について、記事内で説明されているトレードオフはどれか。"
    choices:
      - "障害の局所化という利点がある一方、接続シーケンス全体を追うには複数デーモンのログを横断的に確認する必要があり切り分けコストが上がる"
      - "1つのデーモンがクラッシュすると必ず他のすべてのデーモンも連鎖的にクラッシュする"
      - "複数デーモンを連携させる構成は理論上不可能であり、実際には1つの巨大なデーモンとして実装されている"
      - "デーモンの数が増えるほど、システムコールのオーバーヘッドが直線的に増加し続ける"
    answerIndex: 0
    explanation: "1つのデーモンのクラッシュが他に直接影響しない障害の局所化という利点と、複数デーモンのログを横断的に追う必要がある切り分けコストの増加というトレードオフが説明されています。"

  - question: "「systemctl statusがactive (running)と表示されている」ことについて、記事内の誤解の説明として最も適切なものはどれか。"
    choices:
      - "これはプロセスが生きていることを示すだけで、デーモンが正しく設定・接続を処理できているとは限らない"
      - "これはそのデーモンが提供するすべての機能が正常に動作していることを保証する"
      - "これはそのデーモンが今後クラッシュしないことを保証する"
      - "これはそのデーモンがroot権限で動作していることを意味する"
    answerIndex: 0
    explanation: "「動いていれば必ず正常」というのは誤解であり、実際の疎通確認やログの内容確認まで行って初めて正常と判断できると説明されています。"
