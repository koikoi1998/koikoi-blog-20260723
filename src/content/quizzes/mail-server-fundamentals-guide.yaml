questions:
  - question: "メールシステムを構成するMTA・MDA・MUAという役割分担について、記事の説明に最も合致するものはどれか。"
    choices:
      - "MTA・MDA・MUAはすべて同じソフトウェアの別名であり、区別する意味はない"
      - "MUAはユーザーが操作するメールソフト、MTAはサーバー間の転送、MDAはメールボックスへの格納をそれぞれ担う、異なる役割である"
      - "MTAはメールボックスへの格納、MDAはサーバー間の転送を担う(記事の説明と逆)"
      - "MUAは、メールサーバーのハードウェアそのものを指す用語である"
    answerIndex: 1
    explanation: "MUAはユーザーが実際に操作するメールの作成・閲覧ソフト、MTAはメールサーバー間でSMTPを使ってメールを転送する役割、MDAは転送されてきたメールを実際にユーザーのメールボックスへ格納する役割です。"

  - question: "SMTPとIMAP/POP3の役割の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "SMTPはメールの転送までを担い、ユーザーがメールボックスの中身を取得する部分はIMAPまたはPOP3という別のプロトコルの仕事である"
      - "SMTPとIMAPは、まったく同じことを行う、単なる呼び方の違いである"
      - "IMAP/POP3は、メールの送信(投稿)を担うプロトコルである(記事の説明と逆)"
      - "SMTPは、メールボックスの取得・同期にのみ使われるプロトコルである"
    answerIndex: 0
    explanation: "SMTPはメールを送信者から受信側のメールサーバーまで転送するためのプロトコルであり、メールボックスの取得にはIMAPまたはPOP3という別のプロトコルが使われます。"

  - question: "PostfixとDovecotの役割分担、および両者の連携について、記事の説明に最も合致するものはどれか。"
    choices:
      - "PostfixとDovecotは競合するソフトウェアであり、どちらか一方だけを選んで使うのが一般的である"
      - "Postfix(MTA)が受信・配送ルール判定を、Dovecotがメールボックスへの格納とIMAP/POP3での取得を担い、両者はLMTPという軽量なプロトコルで連携する"
      - "PostfixはIMAP/POP3を独自に実装しており、Dovecotを必要としない"
      - "Dovecotは、メールの送受信(SMTP)を担うソフトウェアである(記事の説明と逆)"
    answerIndex: 1
    explanation: "Postfixは外部から届いたメールをSMTPで受け取り配送ルールを判定するMTAで、あて先ユーザーのメールボックスへの格納とIMAP/POP3での取得はDovecotが担います。両者はLMTPという軽量なプロトコルで内部的に連携します。"

  - question: "メールボックスの保存形式であるMaildirとmboxの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "mboxは1つのメール=1つの独立したファイルで堅牢、Maildirは1つの巨大なファイルでロック制御が必要(記事の説明と逆)"
      - "Maildirは1つのメール=1つの独立したファイルでロック不要、mboxは1つの巨大なテキストファイルでロック制御が必要という違いがあり、堅牢性の観点からMaildirが広く採用されている"
      - "MaildirとmboxはSMTPのバージョン違いを表す用語であり、保存形式とは無関係である"
      - "mboxはDovecot専用、MaildirはPostfix専用の保存形式である"
    answerIndex: 1
    explanation: "mboxは1つのメールボックス=1つの巨大なテキストファイルでロック制御が必要な古い形式、Maildirは1つのメール=1つの独立したファイルでロック不要な現在の主流形式です。堅牢性の観点からMaildirが広く採用されています。"

  - question: "メール送信時のSASL認証と、PostfixとDovecotの関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "PostfixはSASL認証の機能を自分自身では持たず、一般的な構成ではDovecotが提供する「Dovecot SASL」を借りて使い、ユーザーデータベースをDovecot側に一元化する"
      - "SASL認証は、Postfixが完全に独自に実装しており、Dovecotとは一切関係がない"
      - "SASL認証は、メールの送信には一切関係のない、Webサイトのログイン専用の仕組みである"
      - "Dovecotは、SASL認証機能を持たないソフトウェアである"
    answerIndex: 0
    explanation: "オープンリレー防止のためSASL認証が使われますが、一般的な構成ではPostfixは自分自身でSASL機能を持たず、Dovecotが提供する「Dovecot SASL」を借りて使います。IMAP/POP3の認証を担うDovecotのユーザーデータベースを、SMTP投稿時の認証にも再利用することで、ユーザー管理を一元化しています。"
