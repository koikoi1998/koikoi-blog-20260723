questions:
  - question: "Playbookが、既定でインベントリ内のホストに対して行う処理として正しいのはどれか。"
    choices:
      - "1台ずつ、順番に処理する"
      - "すべてのホストへ、ほぼ同時に(フォークの上限まで並行して)処理を適用する"
      - "ランダムに選んだ1台だけに処理を適用する"
      - "処理対象のホストを、実行時に毎回ユーザーに確認する"
    answerIndex: 1
    explanation: "Playbookは、既定では対象となるすべてのホストに対して、各タスクを並行して(フォークの上限まで同時に)実行します。"

  - question: "serialキーワードが実現することとして正しいのはどれか。"
    choices:
      - "ロードバランサーからの自動的な切り離し"
      - "Playbookの実行を、指定した台数ずつのバッチに分割し、逐次的な実行を強制する"
      - "Ansible Vaultによる機密情報の暗号化"
      - "Jinja2テンプレートのレンダリング"
    answerIndex: 1
    explanation: "serialは、1回のPlaybook実行を指定した台数ずつのバッチに分割し、1つのバッチが完全に終わってから次のバッチへ進むという、逐次的な実行を強制します。"

  - question: "serialだけでは、ゼロダウンタイムが実現できない理由として正しいのはどれか。"
    choices:
      - "serialは、台数の制限しか行わず、処理中のホストがロードバランサーからのトラフィックを受け続けてしまうため"
      - "serialは、Ansibleの古いバージョンにしか存在しないため"
      - "serialを使うと、処理速度が極端に遅くなるため"
      - "serialは、1台のサーバーにしか適用できないため"
    answerIndex: 0
    explanation: "serialは処理する台数を制限するだけであり、ロードバランサーからの明示的な切り離しを別途組み込まなければ、処理中のリクエストが失われる可能性があります。"

  - question: "delegate_toの役割として正しいのはどれか。"
    choices:
      - "Playbook全体の対象ホストを変更する"
      - "特定のタスクだけを、処理対象のホストとは別の、指定したホスト上で実行する"
      - "すべてのタスクを、ローカルホストでのみ実行する"
      - "インベントリファイルの内容を書き換える"
    answerIndex: 1
    explanation: "delegate_toは、特定のタスクを、Ansibleが現在ループしているホストではなく、指定した別のホスト上で実行するという指示です。"

  - question: "max_fail_percentageを設定しない場合に起きるリスクとして正しいのはどれか。"
    choices:
      - "Playbookの実行速度が向上する"
      - "最初のバッチで問題が発生しても、Ansibleが気づかずに残りのバッチの処理を続け、全台を同じ不具合のある状態にしてしまう"
      - "serialの設定が自動的に無効化される"
      - "ロードバランサーへの接続が自動的に切断される"
    answerIndex: 1
    explanation: "max_fail_percentageがない場合、1台目のバッチで問題が発生していてもAnsibleはそれに気づかず、残りのバッチの処理を続けてしまう危険があります。"
