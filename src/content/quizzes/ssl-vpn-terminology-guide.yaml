questions:
  - question: "『SSL VPN』という言葉の実態として正しいのはどれか。"
    choices:
      - "L2TP/IPsecやOpenVPNと並ぶ、1つの明確なVPNプロトコル"
      - "クライアントレスモードとトンネルモードという、構造的にまったく異なる2つの機能の総称"
      - "暗号化を一切行わない、古いVPN方式"
      - "拠点間VPN専用の方式"
    answerIndex: 1
    explanation: "SSL VPNは、1つの明確なプロトコル仕様を指す言葉ではなく、クライアントレスモードとトンネルモードという、構造的にまったく異なる2つの機能の総称として使われています。"

  - question: "クライアントレスモードの、動作の実態として正しいのはどれか。"
    choices:
      - "本格的なネットワーク層のトンネルを確立する"
      - "ネットワーク層のトンネルを一切確立せず、リバースプロキシに近い仕組みである"
      - "DNSサーバーとして動作する"
      - "ファイアウォールとして動作する"
    answerIndex: 1
    explanation: "クライアントレスモードは、ゲートウェイがURLを書き換えて中継するという、リバースプロキシに近い構造であり、ネットワーク層のトンネルを確立しません。"

  - question: "トンネルモードが、構造的に同じ系譜に属するものとして正しいのはどれか。"
    choices:
      - "OpenVPN"
      - "DNSキャッシュサーバー"
      - "リバースプロキシ"
      - "WPAD"
    answerIndex: 0
    explanation: "トンネルモードは、TLSでIPパケットを暗号化して送るという発想で、OpenVPNとほぼ同じ系譜に属する、本格的なネットワーク層のトンネリングです。"

  - question: "SSL VPN製品の実務でよくある混乱の原因として正しいのはどれか。"
    choices:
      - "すべての製品が、必ずトンネルモードのみを提供している"
      - "同じ製品名の中に、クライアントレスモードとトンネルモードの両方が、選択可能な機能として同居していること"
      - "SSL VPNが、暗号化に対応していないこと"
      - "SSL VPNが、Linuxでしか動作しないこと"
    answerIndex: 1
    explanation: "Ciscoの旧AnyConnectのような製品名の中に、両方のモードが選択可能な機能として同居しているため、どちらが有効化されているかを明確に区別する必要があります。"

  - question: "『SSL』という名前が指しているものとして正しいのはどれか。"
    choices:
      - "動作モード(クライアントレスかトンネルか)"
      - "暗号化方式(TLS)の部分だけ"
      - "VPNを提供するベンダー名"
      - "ネットワーク層のアドレス体系"
    answerIndex: 1
    explanation: "『SSL VPN』という名前は、暗号化方式(TLS、歴史的な名称としてSSL)の部分だけを指しており、動作モードそのものを決めている言葉ではありません。"
