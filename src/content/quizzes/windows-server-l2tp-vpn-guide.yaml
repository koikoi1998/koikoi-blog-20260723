questions:
  - question: "RRASでVPNクライアントにIPアドレスを払い出す「静的アドレスプール」方式の説明として、記事の内容に最も合致するものはどれか。"
    choices:
      - "社内LANの実DHCPサーバーへ要求を中継し、そこから払い出されたアドレスをクライアントに渡す方式"
      - "RRASの設定画面であらかじめ指定したIPアドレスの範囲から、接続順に払い出す方式"
      - "クライアントが自分で任意のIPアドレスを申告し、RRASがそれをそのまま許可する方式"
      - "常に社内LANのDNSサーバーと同じIPアドレスを払い出す方式"
    answerIndex: 1
    explanation: "静的アドレスプールは、RRASの設定画面であらかじめ指定したIPアドレスの範囲から接続順に払い出す方式です。DHCPサーバーへの中継を行うのは別方式であるDHCPリレーエージェントです。"

  - question: "静的アドレスプールを使う一般的な構成で、プールの先頭アドレスがどう使われるか。記事の説明として最も適切なものはどれか。"
    choices:
      - "常に未使用のまま予約され、どの用途にも使われない"
      - "RRASサーバー自身の内部インターフェース用に予約され、接続してくるすべてのVPNクライアントに共通の相手役として使われる"
      - "最初に接続したクライアント専用に固定で割り当てられ、以後そのクライアントだけが使い続ける"
      - "社内LANのデフォルトゲートウェイ(物理ルーター)のIPアドレスと必ず一致する"
    answerIndex: 1
    explanation: "多くの実装で、静的アドレスプールの先頭アドレスはRRASサーバー自身の内部インターフェース用に予約され、すべてのVPNクライアントに共通の点対点リンクの相手として使われます。"

  - question: "複数のVPNクライアントが同じ「サーバー側の相手アドレス」を持っても矛盾しない理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "実際には1台のクライアントしか同時に接続できないから"
      - "L2TPのTunnel ID/Session IDによって、各クライアントとのリンクがそれぞれ独立した別個の仮想リンクとして扱われているから"
      - "IPアドレスは重複してもTCP層で自動的に区別されるから"
      - "Windowsのファイアウォールが自動的にクライアントごとにアドレスを再割り当てするから"
    answerIndex: 1
    explanation: "L2TPのTunnel ID/Session IDによって各クライアントとのリンクは独立して扱われるため、RRASサーバーは同じ内部アドレスを使いながら、クライアントごとに別々の専用リンクを同時に維持できます。"

  - question: "VPNクライアントに払い出されたIPアドレスが社内LANと数字上同じサブネットに見えても、ゲートウェイの指定が必要な理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "VPNクライアントの仮想アダプタは社内LANのイーサネットセグメントに参加しておらず、ARPによるL2到達が成立しないため、通信は必ずRRASサーバーを経由したL3ルーティングで成立するから"
      - "IPv6アドレスとIPv4アドレスが混在しているため、変換のためにゲートウェイが必要だから"
      - "VPNクライアントは常に異なるサブネットのIPアドレスを持つため、実際には同一セグメントではないから"
      - "ゲートウェイの指定はセキュリティ上の慣習であり、技術的な必然性はないから"
    answerIndex: 0
    explanation: "VPNクライアントの仮想PPPアダプタは社内LANのイーサネットセグメントに物理的にも論理的にも参加していません。点対点リンクの上ではARPによるL2到達という概念自体が存在せず、通信は必ずRRASサーバーを経由したL3ルーティングによって成立します。"

  - question: "RRASサーバーが接続中の各VPNクライアントをどう管理しているか。記事の説明として最も適切なものはどれか。"
    choices:
      - "全クライアントの通信を1つの共有インターフェースで無差別に処理する"
      - "クライアントごとに専用の仮想インターフェースを動的に生成し、払い出しIPアドレスごとのホストルートをルーティングテーブルに追加する"
      - "クライアントのIPアドレスをすべて同一のものに統一して管理を簡略化する"
      - "接続のたびに社内LANの物理NICを再構成する"
    answerIndex: 1
    explanation: "RRASはクライアントが接続してくるたびに専用の仮想PPPインターフェースを生成し、ルーティングテーブルには各クライアントの払い出しIPアドレスごとにホストルートが自動的に追加されます。"

  - question: "「VPN接続はできるが社内LANの端末と一切通信できない」という典型的なつまずきの原因として、記事が挙げているものはどれか。"
    choices:
      - "静的アドレスプールの範囲を広く設定しすぎたこと"
      - "RRASでIPv4ルーティングが有効化されておらず、LAN側への中継自体が機能していないこと"
      - "L2TPのポート番号を1701以外に変更していること"
      - "クライアントのOSがPPPに対応していないこと"
    answerIndex: 1
    explanation: "IPv4ルーティングを有効化し忘れると、VPN接続自体は成立してもルーティングテーブルによる社内LANへの中継が機能せず、通信できなくなります。VPNの接続確立とルーティングの有効化は別の設定項目です。"

  - question: "この記事で扱った「VPNクライアント用の内部アドレス」と、冗長化構成における「代表IP(VIP)」の関係として、記事の説明に最も合致するものはどれか。"
    choices:
      - "両者はまったく同じ仕組みであり、常に同一のIPアドレスとして構成される"
      - "前者はVPNの点対点リンクの相手、後者はどちらの実サーバーが稼働中かをクライアントから意識させないための抽象化であり、目的の異なる別々のIPアドレスである"
      - "代表IPが設定されている場合、VPNクライアント用の内部アドレスは不要になる"
      - "VPNクライアント用の内部アドレスは、常に代表IPと同じ値を自動的に引き継ぐ"
    answerIndex: 1
    explanation: "VPNクライアント用の内部アドレスは点対点リンクの相手役、代表IPは冗長化構成における抽象化という、まったく別の目的を持つ独立したIPアドレスです。両方が同時に1台のサーバーに共存していても、それぞれ独立した役割を果たします。"

  - question: "DHCPリレーエージェントを使う構成での「ゲートウェイ」の扱いとして、記事の説明に最も合致するものはどれか。"
    choices:
      - "DHCPスコープで配布されたゲートウェイ設定がそのまま常に有効に機能する"
      - "DHCPスコープの設定内容にかかわらず、PPPリンクである以上、実際に機能するのはRRASサーバーの内部アドレスだけである"
      - "DHCPリレーを使う場合はゲートウェイの概念自体が不要になる"
      - "DHCPリレーを使う場合、ゲートウェイは常に社内LANの物理ルーターになる"
    answerIndex: 1
    explanation: "DHCPリレーでIPアドレスの払い出し自体は実DHCPサーバーが行いますが、RRAS経由のPPPリンクである以上、実際に機能するのはRRASサーバーの内部アドレスだけであり、DHCPスコープ側のゲートウェイ設定がそのまま素直に使われるわけではありません。"
