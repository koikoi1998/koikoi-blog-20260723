questions:
  - question: "HTTPリクエストスマグリングが成立する直接的な原因として正しいのはどれか。"
    choices:
      - "TLS証明書の有効期限が切れているため"
      - "Content-LengthとTransfer-Encodingという、リクエストの境界を決める2つの方法を、フロントエンドとバックエンドが異なって解釈するため"
      - "DNSの応答が改ざんされているため"
      - "ヘルスチェックの間隔が長すぎるため"
    answerIndex: 1
    explanation: "フロントエンドとバックエンドが、Content-LengthとTransfer-Encodingのどちらを基準に境界を判断するかが異なることで、リクエストスマグリングが成立します。"

  - question: "密輸されたリクエストが、無関係な別のクライアントのリクエストと結合してしまう根本的な理由として正しいのはどれか。"
    choices:
      - "ロードバランサーが毎回新しい接続をバックエンドと確立しているため"
      - "バックエンドとの接続(Keep-Alive)が、複数の異なるクライアントからのリクエストに対して再利用されるため"
      - "DNSのTTLが短すぎるため"
      - "SSLターミネーションが有効になっているため"
    answerIndex: 1
    explanation: "バックエンドとの接続が再利用される(Keep-Alive)ことが、密輸されたリクエストが次のリクエストに混入する土台になっています。"

  - question: "RFC 7230が、Content-LengthとTransfer-Encodingの両方が1つのリクエストに含まれている場合に規定している対処として正しいのはどれか。"
    choices:
      - "Content-Lengthを常に優先して解釈するべきである"
      - "そのリクエストを拒否するべきである"
      - "Transfer-Encodingを常に優先して解釈するべきである"
      - "両方のヘッダーの値を足し合わせて解釈するべきである"
    answerIndex: 1
    explanation: "RFC 7230は、両方のヘッダーが矛盾した形で存在する場合、そのリクエストを拒否するべきと明確に規定しています。"

  - question: "このハンズオンで、HAProxyを経由した場合に確認された挙動として正しいのはどれか。"
    choices:
      - "バックエンドへ正常に転送され、200 OKが返された"
      - "400 Bad Requestとして拒否され、バックエンドへは転送されなかった"
      - "ロードバランサー自体が停止した"
      - "リクエストが自動的に修正されて転送された"
    answerIndex: 1
    explanation: "HAProxyは、矛盾したヘッダーを持つリクエストを検知し、バックエンドへ転送する前に400 Bad Requestとして拒否しました。"

  - question: "HTTPリクエストスマグリングへの、本質的に正しい対処方針として正しいのはどれか。"
    choices:
      - "フロントエンドとバックエンドの解釈方法を、常に手動で一致させておく"
      - "どちらの解釈が正しいかを決めるのではなく、矛盾した入力自体を拒否する"
      - "Transfer-Encodingヘッダーの使用を、全面的に禁止する"
      - "Content-Lengthヘッダーの使用を、全面的に禁止する"
    answerIndex: 1
    explanation: "本質的な対処は、どちらの解釈を信じるかという問いそのものを発生させず、矛盾した入力自体を仕様違反として拒否することです。"
