questions:
  - question: "ICMPがポート番号を持たない根本的な理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ICMPはアプリケーションへデータを届けるための仕組みではなく、IPネットワーク自体の状態を報告するための仕組みであるため、宛先アプリを振り分ける必要がないから"
      - "ICMPは開発された時代が古すぎて、ポート番号という概念自体がまだ存在していなかったから"
      - "ICMPはポート番号を65536個すべて自動的に使用する仕様になっているから"
      - "ICMPはTCPの一部として実装されており、TCPのポート番号をそのまま流用しているから"
    answerIndex: 0
    explanation: "ICMPはアプリケーションデータを運ぶTCP/UDPとは異なり、IPネットワーク自体の配送状況を報告するための仕組みです。宛先アプリケーションへ振り分けるという概念自体が不要であるため、ポート番号というフィールドがそもそも存在しません。"

  - question: "tracerouteがICMPをどのように利用して経路を可視化しているかについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "traceroute専用の暗号化されたプロトコルを使い、経路上のルーターと直接通信して情報を取得している"
      - "IPパケットのTTLを1から順に増やしながら送信し、TTLが尽きて破棄した各ルーターが返すTime ExceededメッセージのIPアドレスを記録することで経路を可視化している"
      - "traceroute は経路上のすべてのルーターに事前にインストールされた専用ソフトウェアと通信している"
      - "traceroute はDNSサーバーに直接問い合わせて、経路上のルーターの一覧を取得している"
    answerIndex: 1
    explanation: "tracerouteは、TTLを1から順に1ずつ増やしながら同じ宛先へパケットを送り続けます。TTLが尽きて破棄した経路上の各ルーターはそれぞれTime Exceededメッセージを送信元へ返すため、このメッセージの送信元IPアドレスを記録していくことで経路上のルーターを可視化できます。"

  - question: "Destination UnreachableのFragmentation Needed通知が担っている役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Path MTU Discovery(PMTUD)の根幹を担っており、パケットが経路上のMTUを超えている場合に送信元へサイズを小さくするよう伝える"
      - "この通知は、pingコマンドの応答速度を測定するためだけに使われる"
      - "この通知は、DNSサーバーのIPアドレスが変更されたことを伝えるために使われる"
      - "この通知は、Windows Updateの適用が必要であることを伝えるために使われる"
    answerIndex: 0
    explanation: "Destination UnreachableのCode 4(Fragmentation Needed)は、パケットが経路上のMTUを超えており、フラグメント化禁止のフラグが立っているため送信元でパケットサイズを小さくして送り直してほしい、という通知です。この仕組みはPath MTU Discovery(PMTUD)と呼ばれます。"

  - question: "ファイアウォールでICMPを「すべて遮断」した場合に起こりうる問題について、記事の説明に最も合致するものはどれか。"
    choices:
      - "Fragmentation Needed通知が届かなくなりPMTUDが機能しなくなるため、小さなパケットは通るのに特定サイズを超えるデータの通信だけが原因不明にハングする、という診断の難しい障害につながる"
      - "ICMPを遮断すると、TCP通信自体が完全に不可能になる"
      - "ICMPを遮断しても、ネットワークの動作には一切影響がない"
      - "ICMPを遮断すると、DNSサーバーへの問い合わせがすべて失敗するようになる"
    answerIndex: 0
    explanation: "ICMPを一律遮断すると、Destination UnreachableのFragmentation Needed通知も届かなくなり、Path MTU Discoveryが機能しなくなります。その結果、小さなパケットは問題なく通るのに、ある程度の大きさを超えるデータを送ろうとした通信だけが原因不明のままハングするという、診断の難しい障害につながります。"

  - question: "IPv6におけるICMPv6の役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ICMPv6は、IPv4時代には別のプロトコルだったARPに相当する機能(NDP)まで統合しており、ICMPが担う役割はIPv4の時代よりも大きくなっている"
      - "ICMPv6は、IPv6では完全に廃止され、代わりにARPが単独で使われるようになった"
      - "ICMPv6は、pingコマンドの機能だけを提供し、それ以外の役割は一切持たない"
      - "ICMPv6は、IPv4のICMPとまったく同じ仕様であり、名前が変わっただけである"
    answerIndex: 0
    explanation: "IPv6では、IPv4におけるARP(IPアドレスからMACアドレスを解決する別のプロトコル)に相当する機能がNDP(Neighbor Discovery Protocol)としてICMPv6のメッセージタイプの1つに統合されています。ルーター広告・ルーター要請などもICMPv6に統合されており、ICMPが担う役割はIPv4の時代よりも大きくなっています。"
