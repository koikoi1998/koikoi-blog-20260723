questions:
  - question: "ISOファイルとは何かについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "ISOファイルは、実行可能なプログラムそのものであり、ダブルクリックすると直接インストールが始まる"
      - "ISOファイルは、CD/DVDなどの光学メディアの内容を、そっくりそのまま1つのファイルとして保存したディスクイメージである"
      - "ISOファイルは、インターネット経由でのみ再生できる動画ファイルの一種である"
      - "ISOファイルは、Windowsのレジストリ設定だけを保存した特殊なファイルである"
    answerIndex: 1
    explanation: "ISOファイルは、CD/DVDなどの光学メディアの内容を、そっくりそのまま1つのファイルとして保存した「ディスクイメージ」です。"

  - question: "ISOファイルを右クリックして「マウント」する操作が実際に行っていることについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "ISOファイルの内容を、ディスク上の別の場所へ実際に展開・コピーする"
      - "ISOファイルの内容を、実際に物理的な光学ドライブへディスクを挿入したのと同じ状態として、仮想的な読み取り専用ドライブとして認識させる"
      - "ISOファイル自体を完全に削除し、新しい実行可能ファイルへ変換する"
      - "ISOファイルの内容を、インターネット経由でクラウドサーバーへ自動的にアップロードする"
    answerIndex: 1
    explanation: "マウントは、ISOファイルの内容を実際に物理的な光学ドライブへディスクを挿入したのと同じ状態として、仮想的な読み取り専用のドライブとして認識させる操作です。内容を別の場所へ実際に展開・コピーする操作ではなく、マウントを解除すれば仮想ドライブは消え、元のISOファイル自体はそのまま残ります。"

  - question: "アップデートユーティリティが今もISO形式で配布されることが多い理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ISO形式は、実行可能ファイルより常にファイルサイズが小さくなるため"
      - "元々物理的なCD/DVDメディアで配布・起動することを前提に作られていた慣習が引き継がれており、物理メディアへ書き込んでサーバーを起動用のメディアとしてブートさせることも可能なため"
      - "ISO形式でなければ、Windowsのライセンス認証が正常に機能しないため"
      - "ISO形式は、ウイルス対策ソフトの検知を回避するために採用されている"
    answerIndex: 1
    explanation: "サーバーのファームウェア・ドライバのアップデートユーティリティがISO形式で配布される背景には、元々物理的なCD/DVDメディアで配布・起動することを前提に作られていた慣習が引き継がれている事情があります。ISO形式であれば物理メディアへ書き込んで起動用のメディアとしてブートさせることもでき、OSが起動できない状態のサーバーでも単体でアップデート作業を行えるという運用上の利点があります。"

  - question: "ISOファイルからブート可能なUSBメモリを作成する場合について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ISOファイルの中身を単純にUSBメモリへコピーするだけで、ブート可能なメディアになる"
      - "専用のツールが、ISOファイルの中身をコピーするだけでなく、USBメモリ自体のパーティション構成やブートセクターを対象のファームウェアが認識できる形式に書き換えるという、追加の処理を行っている"
      - "ブート可能なUSBメモリの作成は、マウントという操作とまったく同じ処理である"
      - "USBメモリは、ISOファイルからブート可能なメディアを作成する用途には一切使用できない"
    answerIndex: 1
    explanation: "ブート可能なUSBメモリを作成するツールは、ISOファイルの中身をコピーするだけでなく、USBメモリ自体のパーティション構成やブートセクターを、対象のファームウェア(BIOS/UEFI)が正しく認識できる形式に書き換えるという、追加の処理を行っています。単純なファイルコピーだけでは、実際にはブート可能なメディアにはなりません。"
