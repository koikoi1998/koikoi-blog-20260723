questions:
  - question: "DNS増幅攻撃の基本的な仕組みとして正しいのはどれか。"
    choices:
      - "大きな問い合わせを送り、小さな応答を受け取る"
      - "送信元IPアドレスを標的に偽装した小さな問い合わせを送り、標的へより大きな応答トラフィックを送りつける"
      - "DNSサーバーのCPU使用率を直接操作する"
      - "ゾーン転送を無限に繰り返す"
    answerIndex: 1
    explanation: "DNS増幅攻撃は、送信元を標的に偽装した小さな問い合わせによって、標的へ、より大きな応答トラフィックを送りつける攻撃です。"

  - question: "レスポンスレートリミティング(RRL)が制限しているものとして正しいのはどれか。"
    choices:
      - "DNSサーバーが受け付ける問い合わせの内容"
      - "同一の問い合わせパターンに対して、同一の送信元へ応答する頻度"
      - "ゾーンファイルのサイズ"
      - "DNSSECの署名の有効期限"
    answerIndex: 1
    explanation: "RRLは、同一パターンの問い合わせに対する、同一送信元への応答頻度を、設定した閾値までに制限します。"

  - question: "RRLの本質的な狙いとして正しいのはどれか。"
    choices:
      - "自分のDNSサーバーの応答速度を向上させること"
      - "自分のサーバーが踏み台にされた場合に、標的へ送りつけてしまうトラフィック量を減らすこと"
      - "DNSSECの検証を高速化すること"
      - "ゾーン転送のセキュリティを強化すること"
    answerIndex: 1
    explanation: "RRLの本質的な狙いは、自分のサーバーが増幅攻撃の踏み台にされた場合の、標的への加害トラフィック量を抑制することです。"

  - question: "RRLの「Slip」の説明として正しいのはどれか。"
    choices:
      - "応答を完全に破棄し、一切返さない"
      - "UDPでの応答を意図的に破損させ、クライアントにTCPでの再試行を促す"
      - "問い合わせ自体を完全にブロックする"
      - "DNSSECの署名を自動的に無効化する"
    answerIndex: 1
    explanation: "Slipは、UDP応答を意図的に破損させることで、クライアントにより信頼性の高いTCPでの再試行を促す仕組みです。"

  - question: "TCPでの再試行が、送信元を偽装した攻撃者にとって実質的に不可能である理由として正しいのはどれか。"
    choices:
      - "TCPは暗号化が必須であるため"
      - "TCPには3ウェイハンドシェイクが必要であり、偽装した送信元では正しく完了できないため"
      - "TCPはDNSでは使用できないプロトコルであるため"
      - "TCPは常にファイアウォールでブロックされているため"
    answerIndex: 1
    explanation: "TCPの3ウェイハンドシェイクは、送信元を偽装した状態では正しく完了できないため、Slipは攻撃者への応答を実質的に無効化します。"
