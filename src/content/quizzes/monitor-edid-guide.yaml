questions:
  - question: "モニターの配置設定が復元される仕組みについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "設定は何もせずに魔法のように復元されており、裏側で特別なデータのやり取りは行われていない"
      - "モニターは接続された瞬間にEDIDという識別情報をPCへ送り、Windowsがその内容を過去にレジストリへ保存した情報と照合することで復元している"
      - "モニターの配置設定は、HDMIケーブル自体に物理的に記憶されている"
      - "モニターの配置設定は、モニターの電源を入れた回数に応じて自動的に変化する"
    answerIndex: 1
    explanation: "モニターは接続された瞬間にPCへ向けて、EDIDという自分自身の身元を証明する情報を送り出しています。Windowsはこの情報をもとに以前接続したモニターかどうかを識別し、レジストリに保存済みの設定を復元します。"

  - question: "EDIDが運んでいる情報について、記事の説明に最も合致するものはどれか。"
    choices:
      - "EDIDは、現在表示中の映像データそのものを圧縮して運んでいる"
      - "EDIDには、製造元名・製品(型番)情報・シリアル番号・対応している解像度やリフレッシュレートの一覧・物理的な画面サイズ・色特性データなどが含まれている"
      - "EDIDは、モニターの購入日時と価格だけを記録している"
      - "EDIDは、Windowsのライセンスキーを保存するための領域である"
    answerIndex: 1
    explanation: "EDIDには、製造元名、製品(型番)情報、シリアル番号、対応している解像度・リフレッシュレートの一覧、物理的な画面サイズ、色特性(クロマティシティ)データなどが含まれています。"

  - question: "Windowsが「同じモニターかどうか」を判断する基準について、記事の説明に最も合致するものはどれか。"
    choices:
      - "モニターの物理的な画面サイズだけを基準に判断している"
      - "EDIDに含まれる、特に製造元・型番・シリアル番号の組み合わせを基準に判断しており、同じ型番でもシリアル番号が異なれば別のモニターとして扱われる"
      - "接続に使われているケーブルの種類(HDMIかDisplayPortか)だけを基準に判断している"
      - "モニターが接続された時刻だけを基準に判断している"
    answerIndex: 1
    explanation: "Windowsは、EDIDに含まれる情報の中でも特に製造元・型番・シリアル番号の組み合わせを基準に、接続されたモニターを識別します。同じ型番のモニターでも、シリアル番号が異なれば明確に別々のモニターとして扱われます。"

  - question: "KVMスイッチ経由の接続で、モニターの設定復元がうまく機能しなくなることがある理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "KVMスイッチは、接続されたすべてのPCへ常に正しくEDIDを中継する"
      - "KVMスイッチは、現在選択されているPC(ポート)にしかモニターのEDID情報を正しく中継しないことが多く、選択されていない側のPCからはモニターの状態を正しく認識できないことがある"
      - "KVMスイッチを使うと、モニターのEDID情報自体が完全に消去される"
      - "KVMスイッチは、EDIDとは無関係な機器であり、この問題とは一切関係がない"
    answerIndex: 1
    explanation: "KVMスイッチは、現在選択されているPC(ポート)にしか、モニターのEDID情報を正しく中継しないことが多いため、選択されていない側のPCから見るとモニターが接続されているかどうかすら正しく認識できない状態になることがあります。"

  - question: "モニターが認識されない・解像度がおかしいという問題の原因について、記事の説明に最も合致するものはどれか。"
    choices:
      - "この種の問題は、常にモニター本体の故障が唯一の原因である"
      - "安価なケーブル・変換アダプタの品質や、KVMスイッチのような中継機器がEDIDの正しい伝達を妨げているケースも少なくない"
      - "この種の問題は、Windowsのバージョンが古い場合にのみ発生する"
      - "この種の問題は、モニターの電源ケーブルの長さによってのみ決まる"
    answerIndex: 1
    explanation: "品質の低いケーブルや、一部の安価な変換アダプタでは、EDID用の信号線が正しく結線されていない、あるいはノイズの影響を受けやすいことがあり、EDIDの読み取りに失敗することがあります。KVMスイッチのような中継機器も、同様の問題を引き起こすことがあります。"
