questions:
  - question: "DNSの名前空間の設計について、記事の説明に最も合致するものはどれか。"
    choices:
      - "1台の巨大なサーバーがすべてのドメイン名を一元管理している"
      - "名前空間が階層構造(ツリー構造)になっており、階層ごとに異なる管理主体へ委任されている"
      - "各国政府がそれぞれ独立してすべてのドメイン名を管理している"
      - "権威サーバーと再帰リゾルバは同一のサーバーでなければならない"
    answerIndex: 1
    explanation: "DNSは名前空間そのものが階層構造になっており、ルート・TLD・権威サーバーというように、階層ごとに異なる管理主体へ委任(delegation)する設計になっています。これにより単一障害点を作らずに世界中のドメイン名を管理できています。"

  - question: "権威サーバーと再帰リゾルバの役割の違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "権威サーバーは自分が管理するゾーンについて正式に答え、再帰リゾルバはクライアントの代わりにルートから権威サーバーまで辿って答えを探す"
      - "権威サーバーとは再帰リゾルバの別名であり、機能的な違いはない"
      - "再帰リゾルバは常にキャッシュを持たず、毎回ルートサーバーに直接問い合わせる"
      - "権威サーバーはクライアントから直接問い合わせを受け付けない"
    answerIndex: 0
    explanation: "権威サーバーは特定のゾーンについて正式なデータを保持し正確に答える役割、再帰リゾルバはクライアントに代わってルート→TLD→権威サーバーの順に問い合わせを重ねて答えを探す役割であり、両者の役割は明確に異なります。"

  - question: "再帰リゾルバがルートサーバー・TLDサーバーから受け取る応答について、記事の説明に最も合致するものはどれか。"
    choices:
      - "常に最終的な正式回答(Authoritative Answer)を返す"
      - "次にどこへ聞きに行けばよいかという委任先の情報(リファラル)を返す"
      - "問い合わせを拒否し、エラーだけを返す"
      - "クライアントのIPアドレスをそのまま折り返す"
    answerIndex: 1
    explanation: "ルートサーバーもTLDサーバーも正確な答えを返しているわけではなく、次にどこへ聞きに行けばよいかという委任先の情報(リファラル)を返しています。最終的な正式回答を返せるのは、そのゾーンを実際に管理する権威サーバーだけです。"

  - question: "TTL(Time To Live)の役割とトレードオフについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "TTLは常に長くするほど良く、デメリットは存在しない"
      - "TTLはキャッシュの有効期間を定め、長くすればキャッシュヒット率は上がるが、レコード変更時に古い情報が世界中に残る期間も伸びるというトレードオフがある"
      - "TTLは権威サーバーの台数を決めるパラメータである"
      - "TTLはDNSSECの署名の有効期間を指す言葉である"
    answerIndex: 1
    explanation: "TTLは権威サーバー側が指定するキャッシュの有効期間で、長くすればキャッシュヒット率が上がり負荷や応答遅延が減る一方、レコードを変更した際に世界中の古いキャッシュが残り続ける期間も長くなるというトレードオフがあります。"

  - question: "スタブリゾルバとフルサービスリゾルバの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "スタブリゾルバは設定された1台の再帰リゾルバに問い合わせを丸投げするだけの簡易な実装であり、実際にルート・TLD・権威サーバーを辿るのはフルサービスリゾルバ(再帰リゾルバ)側である"
      - "スタブリゾルバとフルサービスリゾルバは完全に同じ機能を持つ"
      - "スタブリゾルバは権威サーバー内部に実装される機能である"
      - "フルサービスリゾルバは常にクライアント端末上で動作する"
    answerIndex: 0
    explanation: "クライアントのOSに内蔵されているのは多くの場合スタブリゾルバであり、設定された再帰リゾルバに問い合わせを丸投げするだけです。実際にルート→TLD→権威サーバーと辿る仕事は、ISPやパブリックDNSが提供するフルサービスリゾルバ(再帰リゾルバ)側が担っています。"

  - question: "Windowsで複数のネットワークアダプターに異なるDNSサーバーが設定されている場合について、記事の説明に最も合致するものはどれか。"
    choices:
      - "DNSサーバーの設定はPC全体で1つしか持てず、アダプターごとに異なる設定は不可能である"
      - "DNSサーバーの設定はアダプターごとに持ち、複数アダプターが有効な場合はインターフェースメトリックなどが優先順位に影響する"
      - "常に最後に接続したアダプターのDNSサーバーだけが使われる"
      - "Windowsでは有線LANのDNSサーバーが常に最優先され、他の設定は一切参照されない"
    answerIndex: 1
    explanation: "Windowsでは、DNSサーバーの設定はネットワークアダプターごとに持ちます。複数のアダプターが同時に有効な場合、インターフェースメトリックなどが名前解決に使うDNSサーバーの優先順位に影響します。"

  - question: "NRPT(Name Resolution Policy Table)について、記事の説明に最も合致するものはどれか。"
    choices:
      - "特定のドメイン名空間への問い合わせだけを、指定したDNSサーバーへ確実に振り分けるための、ドメイン単位のルーティングルールを定義する仕組み"
      - "すべてのDNSキャッシュを強制的に削除するためのコマンド"
      - "複数のDNSサーバーへ問い合わせを均等に負荷分散するための機能"
      - "TTLの値を自動的に短縮するためのポリシー"
    answerIndex: 0
    explanation: "NRPTは「特定の名前空間(例: corp.example.com)への問い合わせだけは指定したDNSサーバーへ送る」というドメイン単位のルーティングルールを明示的に定義する仕組みです。もともとDirectAccess向けに設計されましたが、通常のVPNのスプリットトンネル環境でも利用できます。"

  - question: "Linuxのsystemd-resolvedにおける「ルーティングドメイン」について、記事の説明に最も合致するものはどれか。"
    choices:
      - "先頭にチルダ(~)を付けたドメインをリンクに割り当てることで、そのドメイン宛の問い合わせだけを特定のリンクのDNSサーバーへ送る、NRPTに相当する仕組み"
      - "/etc/resolv.conf内のnameserverの並び順を自動的に並べ替える機能"
      - "DNSサーバー同士がゾーン情報を同期するための転送プロトコル"
      - "ルーティングドメインはWindows専用の概念であり、Linuxには存在しない"
    answerIndex: 0
    explanation: "systemd-resolvedのルーティングドメインは、あるリンクに「~corp.example.com」のように先頭にチルダを付けたドメインを割り当てることで、そのドメイン宛の問い合わせだけを特定のリンクのDNSサーバーへ送る仕組みで、Windows のNRPTに相当します。"

  - question: "スプリットトンネルVPN接続時に、NRPT(Windows)やルーティングドメイン(Linux)が構成されていない場合について、記事の説明に最も合致するものはどれか。"
    choices:
      - "常に社内ドメインの名前解決が最優先され、問題は一切発生しない"
      - "社内ドメイン以外の名前解決までVPN側DNSサーバーに送られたり、逆に社内ドメインの問い合わせが通常のDNSサーバーに送られて失敗したりと、挙動にブレが生じうる"
      - "VPN接続自体が確立できなくなる"
      - "DNSサーバーへの問い合わせがすべてTCPに切り替わる"
    answerIndex: 1
    explanation: "NRPTやルーティングドメインが構成されていないスプリットトンネル環境では、インターフェースメトリックなどの状況次第で、社内ドメイン以外の問い合わせがVPN側に送られたり、逆に社内ドメインの問い合わせが失敗したりと、挙動にブレが生じることがあります。"

  - question: "「複数のDNSサーバーを登録すれば負荷分散される」という理解について、記事の説明に照らして最も適切な評価はどれか。"
    choices:
      - "正しい。登録したDNSサーバーには常に均等に問い合わせが振り分けられる"
      - "誤り。一般的なOSのDNSクライアント実装は、複数のDNSサーバーを優先/代替のフェイルオーバーとして扱うのが基本であり、常に均等に振り分けるロードバランサーではない"
      - "正しい。ただしIPv6の場合のみ負荷分散される"
      - "誤り。複数のDNSサーバーを登録すると常にエラーになる"
    answerIndex: 1
    explanation: "一般的なOSのDNSクライアントの実装は、複数登録されたDNSサーバーを優先/代替として扱い、優先サーバーが応答しない場合に次を試すフェイルオーバーの仕組みが基本です。常に均等に振り分けるロードバランサーではありません。"
