questions:
  - question: "journalctlの-uオプションと-tオプションの使い分けとして正しいものはどれか。"
    choices:
      - "-uは常に-tより多くの情報を表示するため、-uだけを使えば十分である"
      - "-uはsystemdユニットとして管理されているプロセスのログを絞り込み、-tはsystemdユニットではない(syslog経由でログを出す)プロセスをタグ名で絞り込む"
      - "-uは過去のログ、-tは未来のログを表示する"
      - "-uとーtはまったく同じ意味で、どちらを使っても結果は変わらない"
    answerIndex: 1
    explanation: "xl2tpdのようにsystemdユニットとして管理されるプロセスは-uで絞り込めますが、xl2tpdが内部的に起動するpppdのようにsystemdユニットではないプロセスは、syslogの識別子(タグ)で絞り込む-tを使う必要があります。"

  - question: "サービス起動失敗時に案内される journalctl -xeu <ユニット名> の -x と -e の意味として正しいものはどれか。"
    choices:
      - "-xはログを暗号化し、-eはログを消去する"
      - "-eは末尾(最新のログ)へジャンプし、-xはsystemdが持つ補足説明をあわせて表示する"
      - "-xは実行速度を上げ、-eはエラーのみを非表示にする"
      - "-xとーeはどちらも出力件数を制限するオプションである"
    answerIndex: 1
    explanation: "-eは最新のログへジャンプする表示位置のオプション、-xはログ内容に応じてsystemd自身が持つ補足的な説明を付け加えるオプションです。"

  - question: "L2TP/IPsecハンズオンのようにIKE→L2TP→PPPの順に接続が確立する構成で、接続できないときの効率的な調査順序として記事が推奨しているものはどれか。"
    choices:
      - "常にpppdのログから確認し、問題なければipsecのログを確認する"
      - "接続確立の順序(IKE→L2TP→PPP)に沿って、ipsec statusall→journalctl -u xl2tpd→journalctl -t pppdの順に確認する"
      - "どのログから見ても結果は同じなので、順序を意識する必要はない"
      - "サーバー側のログだけを見れば、クライアント側の状態も必ず分かる"
    answerIndex: 1
    explanation: "接続はIKE→L2TP→PPPの順に確立するため、どこで止まっているかをこの順番で切り分けるのが効率的です。サーバー側だけでなく、クライアント側のログも突き合わせる必要があります。"

  - question: "「エラーメッセージが出ないまま静かに失敗する」ケース(lockオプションの例など)について、記事が挙げている対処のヒントはどれか。"
    choices:
      - "journalctlをより長い時間実行し続ければ、いずれ必ずエラーメッセージが出力される"
      - "疑わしい設定項目を1つずつコメントアウトして再起動し、どの項目を外すと動くようになるかを絞り込む実験的なアプローチが必要になることがある"
      - "静かな失敗は必ずカーネルパニックを意味するため、OSの再インストールが唯一の対処法である"
      - "静かな失敗はjournalctlでは原理的に一切検知できないため、無視してよい"
    answerIndex: 1
    explanation: "明確なエラーメッセージが出ない失敗は、ログの検索だけでは限界があるため、疑わしい設定を1つずつ外して再起動する、といった切り分けの実験を組み合わせる必要があります。"

  - question: "-n 30 --no-pagerというオプションの組み合わせの意味として正しいものはどれか。"
    choices:
      - "直近30件のログを、対話的なページャを使わずそのまま出力する"
      - "30秒間だけログを収集し、ページ単位で表示する"
      - "30個のユニットのログをまとめてページ表示する"
      - "ログを30倍の速度で再生する"
    answerIndex: 0
    explanation: "-n 30は直近30件への絞り込み、--no-pagerはlessのような対話的ページャを使わずそのまま標準出力に流すオプションです。出力をコピーしたりパイプで渡したりする際によく使います。"
