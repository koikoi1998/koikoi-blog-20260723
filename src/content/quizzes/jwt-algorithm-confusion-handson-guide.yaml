questions:
  - question: "RS256とHS256の、署名方式の違いとして正しいのはどれか。"
    choices:
      - "RS256は対称方式、HS256は非対称方式である"
      - "RS256は秘密鍵で署名し公開鍵で検証する非対称方式、HS256は同じ共有秘密で署名・検証する対称方式である"
      - "両者は完全に同じ署名方式である"
      - "RS256もHS256も、暗号化を一切行わない"
    answerIndex: 1
    explanation: "RS256は秘密鍵で署名し公開鍵で検証する非対称方式、HS256は同じ1つの共有秘密を署名と検証の両方に使う対称方式です。"

  - question: "アルゴリズム混同攻撃の根本的な原因として正しいのはどれか。"
    choices:
      - "RSA鍵のビット長が短すぎること"
      - "検証処理が、どの鍵がどのアルゴリズムのために用意されたものかを区別せず、トークン自身が主張するalgの値に従って鍵の使い方を変えてしまうこと"
      - "HTTPSが使われていないこと"
      - "JWTのペイロードが暗号化されていないこと"
    answerIndex: 1
    explanation: "この脆弱性の根本原因は、検証処理が鍵とアルゴリズムの対応を区別せず、トークン自身が主張するalgの値に従って鍵の使い方を変えてしまうことです。"

  - question: "攻撃者が偽造トークンの署名に悪用するものとして正しいのはどれか。"
    choices:
      - "サーバーの秘密鍵"
      - "サーバーのRS256公開鍵を、HMACの秘密鍵として悪用する"
      - "データベースの接続文字列"
      - "TLS証明書の秘密鍵"
    answerIndex: 1
    explanation: "攻撃者は、公開されているRS256の公開鍵を、HS256のHMAC秘密鍵として使い、偽造トークンに署名します。"

  - question: "この攻撃に対する、唯一の確実な防御として正しいのはどれか。"
    choices:
      - "RSA鍵のビット長を増やす"
      - "検証時に許可するアルゴリズムを、トークンのヘッダーに依存せず、明示的に固定する"
      - "JWTのペイロードを暗号化する"
      - "トークンの有効期限を極端に短くする"
    answerIndex: 1
    explanation: "唯一の確実な防御は、検証時に許可するアルゴリズムを、トークンのヘッダーに依存せず、明示的に固定することです。"

  - question: "ライブラリが修正された後でも、同様の問題が再発する可能性がある理由として正しいのはどれか。"
    choices:
      - "ライブラリの修正が、常に不完全であるため"
      - "検証時にalgorithmsパラメータを明示的に指定せず、ライブラリの既定値に依存した呼び出し方をしている場合があるため"
      - "JWTという規格自体が、根本的に安全ではないため"
      - "RSA鍵のペアが、一度しか使えないため"
    answerIndex: 1
    explanation: "ライブラリが修正された後でも、検証時にalgorithmsパラメータを明示的に指定しない呼び出し方をしていると、別の形で同様の問題が再発することがあります。"
