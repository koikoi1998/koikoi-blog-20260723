questions:
  - question: "`git add`が実際に行っていることは何か。"
    choices:
      - "変更内容をリモートリポジトリへ直接送信する"
      - "作業ディレクトリでの変更を、ステージングエリアへ移す"
      - "コミット履歴を完全に削除する"
      - "ファイルを暗号化する"
    answerIndex: 1
    explanation: "git addは、作業ディレクトリでの変更をステージングエリアへ移すコマンドです。この時点ではまだ履歴には残りません。"

  - question: "コミットの実態について正しい説明はどれか。"
    choices:
      - "前回からの変更点(差分)だけを記録している"
      - "その時点でのすべてのファイルの状態(スナップショット)を記録しており、変更のないファイルは参照を再利用している"
      - "コミットのたびにリポジトリ全体を複製している"
      - "コミットは一切データを保存しない"
    answerIndex: 1
    explanation: "コミットは、変更のないファイルへの参照を再利用しつつ、その時点でのすべてのファイルのスナップショットを記録しています。"

  - question: "`git push`で実際にリモートリポジトリへ送られるものは何か。"
    choices:
      - "ファイルの最新の中身そのもの"
      - "リモート側にまだ存在していない、コミットの履歴一式"
      - "ステージングエリアの内容のみ"
      - "作業ディレクトリ全体のバックアップ"
    answerIndex: 1
    explanation: "git pushで送られるのは、まだリモート側に存在していないコミットの履歴であり、ファイルの中身はそのコミット履歴を辿った結果として再現されます。"

  - question: "addとcommitが2段階に分かれている理由として最も適切なのはどれか。"
    choices:
      - "処理を高速化するため"
      - "複数のファイルを編集していても、その一部だけを選んで意味のあるまとまりとしてコミットできるようにするため"
      - "ファイルサイズを圧縮するため"
      - "Gitの仕様上、必ず2段階にする必要があるが特に理由はない"
    answerIndex: 1
    explanation: "複数のファイルを編集していても、その中の一部だけを選んで、1つの意味のあるまとまり(コミット)として記録できるようにするために、addとcommitが分かれています。"

  - question: ".gitignoreの役割として正しい説明はどれか。"
    choices:
      - "指定したファイルを自動的に暗号化する"
      - "指定したパターンに一致するファイルを、Gitの追跡対象から外し、git add .などでもステージングされないようにする"
      - "コミット履歴を自動的に圧縮する"
      - "リモートリポジトリへのpushを禁止する"
    answerIndex: 1
    explanation: ".gitignoreに書かれたパターンに一致するファイルは、一括追加コマンドを実行してもステージングエリアに含まれず、Gitの追跡対象から外れます。"
