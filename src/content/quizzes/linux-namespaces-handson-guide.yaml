questions:
  - question: "コンテナの中のプロセスが、実際に動いているカーネルとして正しいのはどれか。"
    choices:
      - "ホストとは別の、専用の軽量カーネル"
      - "ホストとまったく同じ、1つのLinuxカーネル"
      - "コンテナイメージに同梱された、独自のカーネル"
      - "カーネルを一切使わず、ユーザー空間だけで動作する"
    answerIndex: 1
    explanation: "コンテナの中のプロセスも、ホストとまったく同じ1つのLinuxカーネルの上で動いています。"

  - question: "PID namespaceを分離した際に、実際に起きていることとして正しいのはどれか。"
    choices:
      - "ホストの他のプロセスが、実際に終了する"
      - "ホストの他のプロセスは何も変化せず、新しいnamespace内のプロセスから、それらが見えなくなるだけである"
      - "ホストのメモリ使用量が、半分に削減される"
      - "新しいnamespace内のプロセスが、自動的に高速化される"
    answerIndex: 1
    explanation: "namespaceは、リソースを複製するのではなく、特定のプロセスから特定の情報を見せない、視点を制限する仕組みです。"

  - question: "新しいPID namespaceの中でbashを起動した際、そのbash自身のPIDとして正しいのはどれか。"
    choices:
      - "ホストでのPIDと、常に同じ値になる"
      - "1になる(そのnamespace内の最初のプロセスとして)"
      - "0になる"
      - "ランダムな値が割り振られる"
    answerIndex: 1
    explanation: "新しいPID namespaceの中では、そのnamespace内の最初のプロセスとして、PIDが1になります。"

  - question: "mount namespaceを分離したプロセスが、その中で行ったマウント操作について正しいのはどれか。"
    choices:
      - "ホスト側にも、即座に反映される"
      - "そのプロセス専用の、独立したマウントテーブル内だけで有効であり、ホスト側には反映されない"
      - "マウント操作自体が、常に失敗する"
      - "ホストのディスク容量が、自動的に拡張される"
    answerIndex: 1
    explanation: "mount namespaceが分離されたプロセスは、自分専用の独立したマウントテーブルを持ち、そこでの変更はホスト側に反映されません。"

  - question: "DockerやPodmanのようなコンテナツールの、本質的な位置づけとして正しいのはどれか。"
    choices:
      - "Linuxカーネルとは独立した、専用の仮想化エンジンである"
      - "namespaceやcgroupsといった、Linuxカーネルが元々持つ機能を、自動的かつ便利に組み合わせるオーケストレーションレイヤーである"
      - "ハードウェアを直接エミュレートする、完全仮想化ソフトウェアである"
      - "ネットワーク機能のみを提供する、専用ツールである"
    answerIndex: 1
    explanation: "DockerやPodmanは、namespaceとcgroupsという、Linuxカーネルが以前から持つ機能を組み合わせて自動化する、オーケストレーションレイヤーです。"
