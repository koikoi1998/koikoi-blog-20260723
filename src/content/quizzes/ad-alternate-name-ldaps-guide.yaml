questions:
  - question: "`netdom computername`で`/add`だけを使い`/makeprimary`を行わない運用の特徴として正しいのはどれか。"
    choices:
      - "新DCの名前が旧DCの名前へ完全に入れ替わる"
      - "新DCは固有の新しい名前のままで、旧DC名はSPNとDNS上でだけ機能する代替名になる"
      - "この運用では、SPNもDNSも一切書き換わらない"
      - "この運用は、必ず`/makeprimary`より先に実行しなければならない"
    answerIndex: 1
    explanation: "`/add`だけで止める運用では、新DCの主たる名前はそのままで、旧DC名はSPNとDNSレコードの上でだけ機能する、従属的な代替名にとどまります。"

  - question: "代替名の追加(`/add`)が、具体的に書き換える対象として正しいのはどれか。"
    choices:
      - "新DCにインストールされているサーバー証明書のSAN"
      - "新DCのコンピューターオブジェクトのSPNと、DNSのAレコード"
      - "ファイアウォールのルールだけ"
      - "クライアント側のhostsファイルだけ"
    answerIndex: 1
    explanation: "代替名の追加は、新DCのコンピューターオブジェクトにSPNを追加書き込みし、DNSに旧DC名が新DCのIPを指すAレコードを追加するという、2つの対応表の書き換えによって実現されています。"

  - question: "LDAPS(636番ポート)が、代替名の追加だけでは解決しない理由として正しいのはどれか。"
    choices:
      - "LDAPSはSPNもDNSも一切使わないため"
      - "LDAPSは証明書のSANを検証するという、SPN・DNSとは独立した3つ目の対応表を通過する必要があるため"
      - "LDAPSはIPアドレスでしか接続できない仕組みだから"
      - "LDAPSは代替名という概念そのものをサポートしていないため"
    answerIndex: 1
    explanation: "LDAPSは、TLSハンドシェイクの際に証明書のCN/SANを検証する、SPN・DNSとは独立した3つ目の名前の対応表を持っており、代替名の追加では証明書は書き換わりません。"

  - question: "LDAPSを利用する連携システムへの対処として、正しい組み合わせはどれか。"
    choices:
      - "ファイアウォールの設定変更だけで十分である"
      - "新DCへの証明書インストール、証明書SANへの旧DC名追加、連携システムへのルートCA証明書登録の3点"
      - "DNSのAレコードを追加するだけで十分である"
      - "netdom computernameコマンドをもう一度実行するだけで十分である"
    answerIndex: 1
    explanation: "LDAPSを利用する連携システムには、新DCへの証明書インストール、証明書のSANへの旧DC名追加、連携システム側へのルートCA証明書登録という3つの対応が必要です。"

  - question: "IPアドレスを直接指定している設定が、代替名の追加では解決しない理由として正しいのはどれか。"
    choices:
      - "IPアドレス直打ちの設定は、そもそも名前解決を経由しないため"
      - "IPアドレス直打ちの設定は、SPNを必ず使うため"
      - "代替名の追加は、IPアドレスの設定を自動的に書き換えるが、反映に時間がかかるだけだから"
      - "IPアドレス直打ちの設定は、LDAPSでしか使われないため"
    answerIndex: 0
    explanation: "IPアドレスを直接指定している設定は、そもそも名前解決(DNS)を経由しないため、代替名を追加しても影響を受けず、設定値そのものを個別に変更する必要があります。"
