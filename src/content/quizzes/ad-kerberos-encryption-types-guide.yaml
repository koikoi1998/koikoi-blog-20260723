questions:
  - question: "Kerberosの標準的なAES256暗号方式(aes256-cts-hmac-sha1-96)が、整合性確認に使っているハッシュ関数として正しいのはどれか。"
    choices:
      - "SHA-256"
      - "SHA-1"
      - "MD5"
      - "SHA-3"
    answerIndex: 1
    explanation: "Kerberosの標準的なAES256暗号方式は、整合性確認にHMAC-SHA1-96、つまりSHA-1を使っています。AESの鍵長とハッシュ関数の種類は別々の設定です。"

  - question: "AES128とAES256の、Kerberosにおける実際の違いとして正しいのはどれか。"
    choices:
      - "整合性確認に使うハッシュ関数が異なる(SHA-1とSHA-256)"
      - "暗号化に使う鍵の長さ(128ビットか256ビットか)が異なるだけで、整合性確認はどちらもSHA-1を使う"
      - "AES128は暗号化を行わず、AES256だけが暗号化を行う"
      - "AES128はKerberosでは使用できない"
    answerIndex: 1
    explanation: "AES128とAES256は、暗号化に使う鍵の長さが異なるだけで、整合性確認(HMAC-SHA1-96)はどちらも同じSHA-1を使っています。"

  - question: "HMAC-SHA1の安全性についての、正しい理解はどれか。"
    choices:
      - "SHA-1そのものへの衝突攻撃により、HMAC-SHA1も直接的に危険になる"
      - "HMAC-SHA1は鍵を使ったまったく別の構成であり、SHA-1そのものへの衝突攻撃から直接的な影響を受けるものではない"
      - "HMAC-SHA1は、デジタル証明書の署名と、まったく同じ安全性の根拠を持っている"
      - "HMAC-SHA1は、暗号化そのものを行う方式である"
    answerIndex: 1
    explanation: "HMAC-SHA1は鍵を使ったハッシュ化を行う別の構成であり、SHA-1そのものへの衝突攻撃から直接的な影響を受けるものではありません。"

  - question: "`msDS-SupportedEncryptionTypes`属性の値が`28`である場合、そのアカウントが対応している暗号方式として正しいのはどれか。"
    choices:
      - "RC4だけ"
      - "RC4・AES128・AES256のすべて"
      - "AES256だけ"
      - "暗号化に一切対応していない"
    answerIndex: 1
    explanation: "28は、4(RC4)+8(AES128)+16(AES256)の合計であり、RC4・AES128・AES256のすべてに対応していることを意味します。"

  - question: "クライアントとKDCが、認証に使う暗号方式を実際にどう決めているか、正しいのはどれか。"
    choices:
      - "常にクライアントが指定した、最初の1つの方式だけを使う"
      - "クライアントが提示した優先順位付きの一覧と、アカウントの対応状況を照合し、共通して対応する最も優先順位の高い方式を選ぶ"
      - "常にKDCが、最も弱い暗号方式を自動的に選ぶ"
      - "暗号方式は、ドメイン全体で固定されており、変更できない"
    answerIndex: 1
    explanation: "KDCは、クライアントが提示した優先順位付きの一覧と、対象アカウントのmsDS-SupportedEncryptionTypesを照合し、共通して対応する最も優先順位の高い暗号方式を選びます。"
