questions:
  - question: "EC2上のアプリケーションに、アクセスキーをハードコードすることの主な問題点は何か。"
    choices:
      - "アクセスキーは技術的にEC2では使用できないため"
      - "静的なアクセスキーには有効期限がなく、インスタンスが侵害された場合、盗まれた後もずっと有効なままであるため"
      - "アクセスキーをハードコードすると、アプリケーションの起動速度が低下するため"
      - "アクセスキーはS3以外のサービスでは動作しないため"
    answerIndex: 1
    explanation: "静的なアクセスキーには有効期限がなく、管理者が意識的にローテーションしない限り、インスタンスが侵害されて盗まれた後もずっと有効なままです。"

  - question: "IAMロールをアタッチしたEC2インスタンスが、実際にAWSサービスへアクセスする際に使う認証情報はどのようなものか。"
    choices:
      - "IAMユーザーと同じ、永久に有効な静的なアクセスキー"
      - "STSが自動的に発行する、有効期限付きの一時的な認証情報"
      - "認証情報を一切使わず、無条件でアクセスが許可される"
      - "管理者が手動で入力したパスワード"
    answerIndex: 1
    explanation: "IAMロールがアタッチされたインスタンスは、STS(Security Token Service)が自動的に発行する、有効期限付きの一時的な認証情報を使用します。"

  - question: "IAMロールがアタッチされたEC2インスタンス上で、AWS CLIを使うために追加で必要な設定は何か。"
    choices:
      - "`aws configure`でアクセスキーとシークレットキーを設定する必要がある"
      - "特に追加の設定は不要で、AWS CLIが自動的に認証情報を取得する"
      - "毎回パスワードを入力する必要がある"
      - "インターネット接続を手動で有効化する必要がある"
    answerIndex: 1
    explanation: "IAMロールがアタッチされていれば、AWS CLIは自動的にインスタンスメタデータサービスから認証情報を取得するため、aws configureの実行は不要です。"

  - question: "IMDSv1と比べて、IMDSv2が防いでいる攻撃はどのようなものか。"
    choices:
      - "パスワードの総当たり攻撃"
      - "SSRF(サーバーサイドリクエストフォージェリ)を経由した、間接的な認証情報の窃取"
      - "DDoS攻撃"
      - "SQLインジェクション攻撃"
    answerIndex: 1
    explanation: "IMDSv1は単純なHTTP GETリクエストだけで認証情報を取得できてしまうため、SSRF脆弱性を経由して間接的に認証情報が盗まれるリスクがありました。IMDSv2は、事前のトークン取得を必須にすることでこれを防いでいます。"

  - question: "IAMロールとIAMユーザーの違いについて、正しい説明はどれか。"
    choices:
      - "両者はまったく同じ概念であり、名前が違うだけである"
      - "IAMユーザーは長期的な認証情報を持つ永続的なアイデンティティだが、IAMロールはその都度引き受けるものであり、静的な認証情報を持たない"
      - "IAMロールの方がIAMユーザーよりも常に強い権限を持つ"
      - "IAMユーザーはEC2でのみ使用でき、IAMロールはS3でのみ使用できる"
    answerIndex: 1
    explanation: "IAMユーザーは長期的な認証情報を持つ永続的なアイデンティティですが、IAMロールは必要なときにその都度引き受けるものであり、それ自体は静的な認証情報を持ちません。"
