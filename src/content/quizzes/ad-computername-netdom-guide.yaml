questions:
  - question: "sysdm.cplによる改名とnetdom computernameによる改名の仕組みの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "両者はまったく同じ仕組みで動作しており、UIが違うだけである"
      - "sysdm.cplは旧名を新名へその場で置き換える単純な改名であるのに対し、netdom computernameは1台に複数の名前(プライマリ+代替名)を持たせる仕組みを利用している"
      - "sysdm.cplはコマンドラインからのみ実行でき、netdom computernameはGUIからのみ実行できる"
      - "netdom computernameは、常に旧名と新名の両方を同時にプライマリ名として扱う"
    answerIndex: 1
    explanation: "sysdm.cplは旧名を新名へその場で置き換える単純な改名操作です。一方netdom computernameは、1台のコンピューターに複数の名前(プライマリ名+代替名)を持たせるための管理コマンドであり、/makeprimaryはそのうちどれをプライマリとして扱うかを切り替えているに過ぎません。"

  - question: "netdom computernameで既存のホスト名を新しいサーバーに引き継がせる際、なぜ/addで代替名として追加してから/makeprimaryでプライマリ化するという2段階が必要なのか。記事の説明に最も合致するものはどれか。"
    choices:
      - "Windowsのバグであり、本来は1段階で済むはずである"
      - "プライマリに昇格できるのは既に登録済みの名前だけという制約があり、これによりSPN・DNS登録の整合性を事前に確保してから主たる名前として機能させられるようにしている"
      - "セキュリティ上、必ず2回同じコマンドを実行させることでタイプミスを防ぐための仕様である"
      - "/addを実行しないと、そもそもコンピューターの再起動ができなくなるため"
    answerIndex: 1
    explanation: "プライマリに昇格できるのは、あらかじめ/addで代替名として登録済みの名前だけという制約があります。これは、SPN・DNS登録の整合性が事前に確保された状態を確認してから、認証の要となる主たる名前として機能させるための安全策です。"

  - question: "「プライマリホスト名」とは何を指すか。記事の説明に最も合致するものはどれか。"
    choices:
      - "そのコンピューターに登録されているすべての名前を合わせた総称"
      - "既定のSPNの生成元となり、DNSレコードを能動的に登録・更新する対象となる、OSが「自分の名前」として管理する主たる名前"
      - "ネットワーク管理者が手動でDNSサーバーに個別登録する必要がある、特別な種類の名前"
      - "コンピューターが起動するたびにランダムに変わる一時的な名前"
    answerIndex: 1
    explanation: "プライマリホスト名とは、既定のSPN(HOST/<プライマリ名>など)の生成元となり、DNSの正引きレコードを能動的に登録・更新する対象となる、OS自身が「自分の名前」として管理する主たる名前です。代替名もSPN・DNSレコードとして機能しますが、OSが積極的に管理するのはプライマリ名だけです。"

  - question: "記事で診断されたAD移行のトラブル事例において、DC①をドメインへ参加させようとした際に「同じホスト名のままドメイン参加できてしまった」ことの正体は何か。記事の説明に最も合致するものはどれか。"
    choices:
      - "Windowsのドメイン参加処理には、名前の重複を検知する機能がそもそも存在しないため"
      - "同名の既存コンピューターアカウント(DC②自身のアカウント)を「再利用」する形で参加が成立し、そのアカウントのパスワード(セキュアチャネルの共有シークレット)がDC①側の値で上書きされてしまったため"
      - "DC①とDC②が物理的に同じネットワークセグメントにいたため、名前の重複が問題にならなかったため"
      - "DNSサーバーがDC①とDC②のどちらのIPアドレスも正しく認識できなかったため"
    answerIndex: 1
    explanation: "ドメイン参加処理は同名の既存コンピューターアカウントを検知すると「再利用しますか」という確認を出すことがあり、これを許可すると既存アカウント(この場合はDC②自身のアカウント)のパスワードがDC①側の新しい値で上書きされてしまいます。これがエラーにならずに参加できてしまった理由であり、同時にDC②の認証基盤が破損した原因でもあります。"

  - question: "上記の事例で、ログオンできなくなった直接の原因について、記事の説明に最も合致するものはどれか。"
    choices:
      - "DC①のDNS設定がDC②のIPアドレスを誤って指定していたため"
      - "DC②自身のコンピューターアカウントのパスワードが書き換えられ、DC②が正常なセキュアチャネルを維持できずNetlogon処理が不安定になったため"
      - "新しく作成したドメインアカウントのパスワードに誤りがあったため"
      - "DC①のホスト名が15文字を超えていたため、NetBIOS名として登録できなかったため"
    answerIndex: 1
    explanation: "DC②自身のコンピューターアカウントのパスワードがDC①側の値で上書きされたことで、DC②は自分自身の認証情報とAD DS上の記録が食い違った状態になり、正常なセキュアチャネルを維持できなくなりました。これによりNetlogonサービスが不安定になり、ログオン要求を処理できなくなりました。DNS設定自体は正しく指定されていた点に注意が必要です。"

  - question: "DCの名前を新しいサーバーへ引き継ぐ移行を計画する際、記事が推奨する正しい手順の順序はどれか。"
    choices:
      - "新DCを旧DCの名前へ改名してから、旧DCを降格・改名する"
      - "旧DCを降格し、旧DCの端末を再利用する場合はまずその端末を新しい一意な名前へ改名してから、新DCを旧DCの名前へ改名し、最後に改名済みの旧端末を新しい名前でドメインへ再参加させる"
      - "旧DCと新DCを同時に同じ名前に変更し、その後どちらか一方を削除する"
      - "名前の引き継ぎ自体を避け、常に新DCには全く新しい名前を使うべきである"
    answerIndex: 1
    explanation: "旧DCを正式な手順で降格・除去したあと、旧DCの端末を再利用する場合はまずその端末のコンピューター名を新しい一意な名前へ変更し、その後に新DCを旧DCの名前へ改名し、改名済みの旧端末を新しい名前で改めてドメインへ参加させる、という順序を徹底することで、名前が重複する瞬間自体をなくせます。"
