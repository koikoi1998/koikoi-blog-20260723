questions:
  - question: "セキュリティグループとNACLの適用単位の違いとして正しいのはどれか。"
    choices:
      - "両方ともインスタンス単位で適用される"
      - "セキュリティグループはインスタンス単位、NACLはサブネット単位で適用される"
      - "セキュリティグループはサブネット単位、NACLはインスタンス単位で適用される"
      - "両方ともリージョン単位で適用される"
    answerIndex: 1
    explanation: "セキュリティグループはEC2インスタンス(ネットワークインターフェイス)単位、NACLはサブネット単位で適用されます。"

  - question: "NACLがステートレスであることの意味として正しいのはどれか。"
    choices:
      - "インバウンドを許可すれば、対応するアウトバウンドの戻り通信も自動的に許可される"
      - "インバウンドとアウトバウンドを、それぞれ独立した別々のルールとして設定する必要がある"
      - "NACLには通信を拒否する機能が存在しない"
      - "ステートレスとステートフルは同じ意味である"
    answerIndex: 1
    explanation: "NACLはステートレスであり、インバウンドとアウトバウンドを、完全に独立した別々のルールとして設定する必要があります。"

  - question: "NACLでインバウンドを許可したのに通信が失敗する、よくある原因は何か。"
    choices:
      - "NACLには常にバグがあるため"
      - "応答用のエフェメラルポート範囲へのアウトバウンドを許可し忘れているため"
      - "インバウンドルールの数が多すぎるため"
      - "セキュリティグループを設定していないため必ず失敗する"
    answerIndex: 1
    explanation: "NACLはステートレスなため、応答パケットも独立した通信として扱われ、エフェメラルポート範囲へのアウトバウンドを許可していないと通信が成立しません。"

  - question: "NACLのルール評価順序として正しいのはどれか。"
    choices:
      - "明示的なDenyが常にAllowより優先される"
      - "番号の小さい順にルールが評価され、最初にマッチしたルールが適用される"
      - "ルールはランダムな順序で評価される"
      - "Allowルールは常にDenyルールより後に評価される"
    answerIndex: 1
    explanation: "NACLは番号の小さい順にルールを評価し、最初にマッチしたルールが適用されます。IAMポリシーの評価ロジックとは異なります。"

  - question: "セキュリティグループとNACLの関係として正しい説明はどれか。"
    choices:
      - "どちらか一方だけを設定すればよい"
      - "両方が同時に評価対象になり、どちらか一方でブロックされれば通信は成立しない"
      - "セキュリティグループがNACLの設定を上書きする"
      - "NACLはセキュリティグループの設定を無視する"
    answerIndex: 1
    explanation: "セキュリティグループとNACLは両方が同時に評価対象になり、どちらか一方でブロックされれば通信は成立しません。"
