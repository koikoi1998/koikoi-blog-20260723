questions:
  - question: "MTA-STSとDANEの、信頼の土台の違いとして正しいのはどれか。"
    choices:
      - "MTA-STSはDNSSECを、DANEはCAシステムを信頼する"
      - "MTA-STSは既存のCA(認証局)システムを、DANEはDNSSECを信頼する"
      - "両者は完全に同じ信頼モデルを持つ"
      - "どちらも、暗号化そのものを行わない"
    answerIndex: 1
    explanation: "MTA-STSは既存のCA(認証局)システムを信頼の土台にし、DANEはDNSSECを信頼の土台にする、まったく異なる仕組みです。"

  - question: "TLSAレコードの役割として正しいのはどれか。"
    choices:
      - "SMTPサーバーが提示すべき証明書(または公開鍵)のハッシュ値を、DNS上に直接記載する"
      - "メールの配送経路を決定する"
      - "SPFの代わりに送信元を認証する"
      - "DKIMの署名鍵を生成する"
    answerIndex: 0
    explanation: "TLSAレコードは、SMTPサーバーが提示すべき証明書(または公開鍵)のハッシュ値を、DNS上に直接記載する仕組みです。"

  - question: "DANEが機能するための、絶対的な前提条件として正しいのはどれか。"
    choices:
      - "送信元がHTTPSサーバーを運用していること"
      - "TLSAレコード自体がDNSSECで署名されており、受信側がその署名を検証できること"
      - "送信元と受信先が、同じメールサーバーソフトウェアを使っていること"
      - "SPFレコードが設定されていないこと"
    answerIndex: 1
    explanation: "DANEが機能するには、TLSAレコード自体がDNSSECで署名されており、受信側がその署名を検証できることが、絶対的な前提条件です。"

  - question: "MTA-STSの弱点として正しいのはどれか。"
    choices:
      - "DNSSECへの完全な依存"
      - "ポリシーファイルをまだキャッシュしていない、最初の接続(初回接触)時には、保護が効いていないこと"
      - "暗号化アルゴリズムが古いこと"
      - "HTTPSを一切使用できないこと"
    answerIndex: 1
    explanation: "MTA-STSの弱点は、ポリシーファイルをまだキャッシュしていない最初の接続(初回接触、TOFU)の際には、まだ保護が効いていないことです。"

  - question: "DANEとMTA-STSの両方を導入している場合の、推奨されるルールとして正しいのはどれか。"
    choices:
      - "MTA-STSのポリシー検証が、DANEの検証結果が失敗していても、それを上書きして通信を許可してよい"
      - "MTA-STSのポリシー検証は、DANEの検証結果が失敗していても、それを上書きして通信を許可してはならない"
      - "DANEを無効化し、MTA-STSだけを使うべきだ"
      - "MTA-STSを無効化し、DANEだけを使うべきだ"
    answerIndex: 1
    explanation: "両方が導入されている場合、MTA-STSのポリシー検証は、DANEの検証結果が失敗していても、それを上書きして通信を許可してはならない、というルールがあります。"
