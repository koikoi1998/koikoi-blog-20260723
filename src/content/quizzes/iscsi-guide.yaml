questions:
  - question: "iSCSIが、FCとは異なる発想でSANを実現している方法として正しいのはどれか。"
    choices:
      - "専用の光ケーブルを新たに敷設する"
      - "SCSIコマンドを、TCP/IPのパケットの中に包んで送ることで、既存のIPネットワーク上でSANを実現する"
      - "IPアドレスを一切使用しない"
      - "WWNという識別子を使用する"
    answerIndex: 1
    explanation: "iSCSIは、SCSIコマンドをTCP/IPのパケットに包むことで、既存のIPネットワークインフラの上にSANを実現します。"

  - question: "「イニシエーター」と「ターゲット」という用語の由来として正しいのはどれか。"
    choices:
      - "iSCSIの仕様策定時に、新たに作られた専用の用語である"
      - "もともとSCSIという、古くからのコマンドセットの用語を、そのまま引き継いだものである"
      - "FCのWWNを言い換えたものである"
      - "TCP/IPの標準的な用語である"
    answerIndex: 1
    explanation: "イニシエーターとターゲットという用語は、SCSIという古い規格から、そのまま引き継がれています。"

  - question: "IQNが、IPアドレスとは別に用意されている理由として正しいのはどれか。"
    choices:
      - "IQNの方が、常に短い文字列であるため"
      - "IPアドレスが変化しても、常に同じ名前で、イニシエーターとターゲットを一意に識別し続けられるようにするため"
      - "IQNは、暗号化された値であるため"
      - "IPアドレスだけでは、通信速度が低下するため"
    answerIndex: 1
    explanation: "IQNは、IPアドレスの変化(DHCPによる再割り当てなど)に関わらず、常に同じ名前で識別を続けられるようにするための識別子です。"

  - question: "iSCSIが、FCと比べて犠牲にしているものとして正しいのはどれか。"
    choices:
      - "導入コストの低さ"
      - "FCが持っていた、専用インフラによる低遅延と、トラフィックの物理的な分離"
      - "既存インフラとの互換性"
      - "SCSIコマンドセットとの互換性"
    answerIndex: 1
    explanation: "iSCSIは、導入コストの低さを得る一方、FCが持っていた低遅延とトラフィックの物理的分離を、ある程度犠牲にしています。"

  - question: "FCとiSCSIの関係を理解する、最も適切な視点として正しいのはどれか。"
    choices:
      - "iSCSIは、FCの完全な上位互換であり、常に優れている"
      - "同じ目的(SAN)を、まったく異なるレイヤー(専用インフラか、既存のIPネットワークか)で実現する、設計パターンの違いである"
      - "FCとiSCSIは、まったく同じ技術の別名である"
      - "iSCSIは、FCより古い技術である"
    answerIndex: 1
    explanation: "FCとiSCSIは、同じSANという目的を、新しい専用レイヤーか、既存レイヤーの上に乗せるかという、異なる設計パターンで実現しています。"
