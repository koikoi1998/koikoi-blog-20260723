questions:
  - question: "GSLBが実際に操作している対象として正しいのはどれか。"
    choices:
      - "クライアントとサーバーの間の通信経路そのもの"
      - "権威DNSサーバーが返す応答の内容"
      - "バックエンドサーバーのTCP接続数"
      - "TLS証明書の配置場所"
    answerIndex: 1
    explanation: "GSLBが実際に操作しているのは、常に権威DNSサーバーが返す応答の内容だけであり、通信経路そのものには介在しません。"

  - question: "EDNS Client Subnet(ECS)が必要になる理由として正しいのはどれか。"
    choices:
      - "DNSの応答を暗号化するため"
      - "リゾルバの場所と実際のユーザーの場所が一致しない場合があるため"
      - "ゾーン転送を高速化するため"
      - "ヘルスチェックの頻度を上げるため"
    answerIndex: 1
    explanation: "パブリックDNSリゾルバを使うユーザーでは、リゾルバの場所と実際のユーザーの場所が異なる場合があり、ECSはこの問題に対応します。"

  - question: "EDNS Client Subnetが、ユーザーの完全なIPアドレスではなく一部だけを送る理由として正しいのはどれか。"
    choices:
      - "完全なIPアドレスを送るとDNSパケットのサイズ上限を超えるため"
      - "GSLBが知りたいのは粗い位置情報だけであり、プライバシー上の配慮から必要な精度だけを渡すため"
      - "暗号化アルゴリズムの仕様上、一部のビットしか送信できないため"
      - "権威DNSサーバーが一部のビットしか受信できない仕様になっているため"
    answerIndex: 1
    explanation: "GSLBが必要とするのは粗い位置情報だけであり、個々のユーザーを特定できる完全なIPアドレスまで渡す必要はないため、プライバシー上の配慮から一部だけが送られます。"

  - question: "GSLBによるデータセンター障害時のフェイルオーバーに、常に伴う制約として正しいのはどれか。"
    choices:
      - "フェイルオーバーは即座に全ユーザーに反映される"
      - "DNSのTTLに起因し、全ユーザーが切り替わるまでにタイムラグが生じる"
      - "フェイルオーバー中はすべてのデータセンターが利用不可になる"
      - "フェイルオーバーには必ず手動の介入が必要になる"
    answerIndex: 1
    explanation: "以前の応答がTTLの間キャッシュされ続けるため、データセンター障害発生から全ユーザーの切り替わりまでにタイムラグが生じます。"

  - question: "GSLBと、単一のロードバランサー(HAProxyなど)の違いについての正しい理解はどれか。"
    choices:
      - "GSLBは、単一のロードバランサーの機能を拡張したものである"
      - "GSLBはDNSの応答を操作する仕組みであり、単一のロードバランサーのように通信経路には介在しない"
      - "両者はまったく同じ仕組みであり、呼び方が異なるだけである"
      - "GSLBは、L4ロードバランサーの別名である"
    answerIndex: 1
    explanation: "GSLBが操作するのは常にDNSの応答内容だけであり、クライアントとサーバーの間の実際の通信経路には一切介在しません。"
