questions:
  - question: "このハンズオンで棚卸しの対象とする、特権アカウントの範囲として正しいのはどれか。"
    choices:
      - "すべての一般ユーザーアカウント"
      - "Administrators・Domain Admins・Enterprise Adminsなど、主要な特権グループに所属するアカウント"
      - "コンピューターアカウントのみ"
      - "無効化されたアカウントのみ"
    answerIndex: 1
    explanation: "このハンズオンでは、Administrators・Domain Admins・Enterprise Adminsという、主要な特権グループに所属するアカウントを棚卸しの対象とします。"

  - question: "`whenCreated`と`PasswordLastSet`がほぼ同じ時刻であるアカウントが意味することとして正しいのはどれか。"
    choices:
      - "そのアカウントは、まだ一度もログインされたことがない"
      - "作成時に設定されたパスワードが、一度も変更されていない"
      - "そのアカウントは、まもなく自動的に削除される"
      - "そのアカウントは、無効化されている"
    answerIndex: 1
    explanation: "whenCreatedとPasswordLastSetがほぼ同じ時刻であることは、作成時に設定されたパスワードが一度も変更されていないことを意味します。"

  - question: "重要なアカウントについて、1回だけでなく2回のパスワード再設定が推奨される場合がある理由として正しいのはどれか。"
    choices:
      - "1回目の再設定は、常に失敗するため"
      - "AD内部の実装の都合により、新しいキー情報がいったん予備領域に書き込まれ、現在有効な領域への反映は次の変更時に行われることがあるため"
      - "パスワードの文字数制限を回避するため"
      - "ネットワーク帯域を節約するため"
    answerIndex: 1
    explanation: "AD内部の実装の都合により、新しいキー情報がいったん予備領域(KerberosNew)に書き込まれ、現在有効な領域への反映は、次にもう一度パスワードが変更されたタイミングで行われることがあります。"

  - question: "パスワード再設定後に、確認すべき内容として正しいのはどれか。"
    choices:
      - "パスワードの文字数が、規定の範囲内であることだけ"
      - "そのアカウントの変更が、すべてのDC(新DCを含む)へ正しくレプリケーションされたこと"
      - "そのアカウントが、無効化されていないことだけ"
      - "何も確認する必要はない"
    answerIndex: 1
    explanation: "パスワード再設定後は、repadmin /showreplなどを使い、すべてのDCへ正しくレプリケーションされたことを確認する必要があります。"

  - question: "このハンズオンで示された、特権アカウントの棚卸しの位置づけとして正しいのはどれか。"
    choices:
      - "DCリプレースのときだけ実施すればよい、一回限りの特別な作業"
      - "定期的なセキュリティ運用の一部として、繰り返し実施すべき作業"
      - "セキュリティ専門家だけが実施すべき、専門的すぎる作業"
      - "一度実施すれば、二度と必要にならない作業"
    answerIndex: 1
    explanation: "パスワードの古さに関するリスクは常に蓄積し続けるため、この棚卸しは、DCリプレースのためだけでなく、定期的なセキュリティ運用の一部として繰り返し実施すべきです。"
