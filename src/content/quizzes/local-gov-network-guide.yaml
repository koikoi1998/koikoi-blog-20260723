questions:
  - question: "地方公共団体(自治体)における「三層の対策」が導入されるきっかけとなった出来事として、最も適切なものはどれか。"
    choices:
      - "2015年に発生した日本年金機構における個人情報流出事件"
      - "2020年の新型コロナウイルス感染症拡大に伴うテレワーク需要の急増"
      - "マイナンバー制度そのものの開始"
      - "LGWANの初期構築プロジェクトの遅延"
    answerIndex: 0
    explanation: "2015年の日本年金機構における情報流出事案を受け、総務省が地方公共団体へ「三層の対策」の実施を要請し、平成30年9月のガイドライン改定でその内容が反映されました。"

  - question: "「マイナンバー利用事務系」の説明として、最も正確なものはどれか。"
    choices:
      - "マイナンバーカードの発行・電子証明書の利用そのものを指す名称である"
      - "個人番号(マイナンバー)を利用する税・社会保障等の事務処理が動くネットワーク区分の名称であり、情報の持ち出し不可設定等の厳格な対策が講じられる"
      - "LGWANの別名であり、自治体間の文書交換を担う系統である"
      - "インターネット接続系のうち、住民向けの電子申請機能だけを切り出した系統である"
    answerIndex: 1
    explanation: "マイナンバー利用事務系は、個人番号と紐づいた住民情報を扱う内部事務処理のためのネットワーク区分で、端末からの情報持ち出し不可設定等、三層の対策の中でも最も厳格な水準の対策が求められます。"

  - question: "LGWAN(総合行政ネットワーク)についての説明として、最も適切なものはどれか。"
    choices:
      - "インターネット上に暗号化トンネルを構築するVPNの一種である"
      - "都道府県・市区町村・国の行政機関を相互接続する、インターネットとは独立した専用の閉域IP網である"
      - "自治体情報セキュリティクラウドの別名である"
      - "マイナンバー利用事務系の端末のみが接続を許可されるネットワークである"
    answerIndex: 1
    explanation: "LGWANはインターネットとは物理的・論理的に独立した専用のIP網であり、インターネット経由のVPNとは仕組みが異なります。自治体間の文書交換や電子申請、グループウェア等の内部事務処理に使われます。"

  - question: "令和2年度のガイドライン改定で導入されたβモデル・β'モデルに関する記述のうち、最も適切なものはどれか。"
    choices:
      - "業務端末をすべてマイナンバー利用事務系に配置するモデルである"
      - "主たる業務端末をインターネット接続系に配置しつつ、EDR等の技術的対策や組織的・人的対策を確実に実施することを条件とするモデルである"
      - "LGWAN接続系を廃止し、インターネット接続系のみで運用するモデルである"
      - "自治体情報セキュリティクラウドの利用をやめ、各自治体が個別に対策を行うモデルである"
    answerIndex: 1
    explanation: "βモデルは主たる業務端末をインターネット接続系に配置するモデルで、EDR等の技術的対策や緊急時即応体制の整備が条件です。β'モデルはこれに加え、文書管理・財務会計等の業務システムもインターネット接続系に配置し、より高度な対策が条件になります。"

  - question: "多くの自治体でマイナンバー利用事務系とLGWAN接続系の分離に「VLANによる論理分離だけでなく、専用の物理スイッチ・専用回線」も併用される理由として、最も適切なものはどれか。"
    choices:
      - "VLANという技術自体がマイナンバー利用事務系では利用できないと法律で定められているため"
      - "L3スイッチのACL設定ミス1つが住民情報流出という重大インシデントに直結しかねず、より確実な分離が求められるため"
      - "物理的に分離したほうがネットワーク機器のコストを削減できるため"
      - "LGWANの帯域をマイナンバー利用事務系専用に確保する必要があるため"
    answerIndex: 1
    explanation: "マイナンバー利用事務系は住民の個人情報を扱う最も重要度の高い層であり、論理分離の設定ミス1つが重大な情報流出につながりかねないため、物理的な分離を併用して二重に分離するケースが多くなっています。"

  - question: "自治体情報セキュリティクラウドの仕組みとして、最も適切なものはどれか。"
    choices:
      - "各市区町村が個別にWebサーバー等のセキュリティ対策を実施する仕組みである"
      - "都道府県と管内の市区町村が協力してWebサーバー等を集約し、監視・ログ分析・解析をはじめとする高度なセキュリティ対策を共同で実施する仕組みである"
      - "マイナンバー利用事務系の端末のみを対象にした監視サービスである"
      - "国が全国一元的に運営する単一のセキュリティ監視センターである"
    answerIndex: 1
    explanation: "自治体情報セキュリティクラウドは、都道府県と市区町村が協力してWebサーバー等を集約し、IDS/IPS・WAF・SOC監視等の高度なセキュリティ対策を共同で実施する仕組みで、47都道府県すべてに構築されています。"

  - question: "自治体情報セキュリティクラウドのオプション要件のうち、令和6年時点で94%の団体が実施しており、政府機関等の統一基準との整合の観点から必須要件への格上げが検討されている機能はどれか。"
    choices:
      - "コンテンツ改竄検知"
      - "通信の復号対応(暗号化通信の中身を検査する機能)"
      - "構成団体ADサーバの監視"
      - "リモートデスクトップ(インターネット接続系VDI接続)"
    answerIndex: 1
    explanation: "「通信の復号対応」は94%の団体が実施しているオプション要件で、政府機関等の統一基準にも監視時のデータ復号の記載があることから、必須要件への格上げが検討されています。"

  - question: "自治体情報セキュリティ向上プラットフォーム事業が解決している課題として、最も適切なものはどれか。"
    choices:
      - "住民がマイナンバーカードをオンラインで申請できない問題"
      - "LGWAN接続系・マイナンバー利用事務系の端末はインターネットへの直接アクセスが制限されているため、OSやウイルス対策ソフトのセキュリティパッチ・パターンファイルの更新が届きにくいという構造的なジレンマ"
      - "自治体情報セキュリティクラウドの契約更新手続きが煩雑である問題"
      - "LGWANの回線速度が遅く、大容量ファイルの送受信ができない問題"
    answerIndex: 1
    explanation: "セキュリティ確保のためにインターネットアクセスを制限した結果、かえってセキュリティパッチが最新化されにくくなるという矛盾を、J-LISが運営する本プラットフォームがLGWAN経由で安全に更新プログラムを配信することで解決しています。"

  - question: "自治体情報セキュリティクラウドとゼロトラストアーキテクチャの関係についての記述として、最も適切なものはどれか。"
    choices:
      - "両者はまったく無関係な独立した仕組みである"
      - "セキュリティクラウドはネットワーク外部の脅威を検知・対処している点で、デジタル庁のゼロトラストアーキテクチャ適用方針が定める『リソースとアクセスを観測する』要素の一部をすでに実現しているものと位置づけられている"
      - "ゼロトラストアーキテクチャが導入されると、セキュリティクラウドは即座に廃止される"
      - "ゼロトラストアーキテクチャはマイナンバー利用事務系にのみ適用される概念である"
    answerIndex: 1
    explanation: "セキュリティクラウドは、デジタル庁が2022年に示したゼロトラストアーキテクチャ適用方針のうち「リソースとアクセスを観測する」要素の一部をすでに実現しているものと位置づけられており、三層分離モデル自体も将来的なゼロトラストモデルへの移行過程にある経過的な仕組みとされています。"

  - question: "自治体情報セキュリティクラウドが抱える構造的な課題として、資料で指摘されていないものはどれか。"
    choices:
      - "都道府県・市区町村の費用負担額が年々増加している財政負担の課題"
      - "共同のデータセンターで障害が発生した場合の影響範囲が大きいという課題"
      - "通信の復号化処理がオンライン会議等のリアルタイム通信に遅延や不具合を引き起こしうるという課題"
      - "サイバー攻撃に対する効果が乏しく、47都道府県のほとんどが効果を実感していないという課題"
    answerIndex: 3
    explanation: "47都道府県すべてが現行のセキュリティクラウドをサイバー攻撃に対して効果的だと回答しており、効果が乏しいという課題は指摘されていません。財政負担、共同利用に伴う構造的リスク、通信復号化の副作用、契約終了時期の集中が実際の課題として挙げられています。"

  - question: "令和5年3月のガイドライン改定で示された、ガバメントクラウド及び同等水準のクラウドサービスに関するインターネット接続の方針として、最も適切なものはどれか。"
    choices:
      - "いかなる場合もインターネット接続を完全に禁止する"
      - "原則としてインターネット接続を禁止しつつ、修正プログラムの適用・ソフトウェアのアクティベーション・管理コンソールへの接続という3つのケースに限り例外的に接続を認める"
      - "常時インターネット接続を許可し、監視のみを強化する"
      - "マイナンバー利用事務系の標準準拠システムに限り、無制限にインターネット接続を許可する"
    answerIndex: 1
    explanation: "令和5年3月改定では、ガバメントクラウド等について原則インターネット接続禁止としつつ、修正プログラムの適用・ソフトウェアのアクティベーション・管理コンソール接続の3ケースに限り例外的な接続を認める方針が示されました。"

  - question: "「三層分離すれば構造的に絶対安全である」という主張について、最も適切な指摘はどれか。"
    choices:
      - "正しい。三層分離が構築されて以降、自治体において情報セキュリティインシデントは一切発生していない"
      - "誤り。Emotet等のメール経由のマルウェアはLGWAN接続系の端末にも届き得るため、三層分離は侵入そのものをゼロにする仕組みではなく、侵入後の拡散範囲や到達可能な情報範囲を限定する対策である"
      - "誤り。三層分離はマイナンバー利用事務系にのみ適用され、LGWAN接続系やインターネット接続系には一切効果がない"
      - "正しい。ただし自治体情報セキュリティクラウドを導入していない自治体に限り例外が生じる"
    answerIndex: 1
    explanation: "三層分離は攻撃の侵入経路や侵入後にアクセスできる情報の範囲を限定する対策であり、メール経由の攻撃などはLGWAN接続系にも届き得ます。「三層分離=侵入を完全に防ぐ」という理解は誤りです。"
