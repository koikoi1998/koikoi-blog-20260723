questions:
  - question: "OSI参照モデルとTCP/IPモデルの対応関係について、正しい記述はどれか。"
    choices:
      - "OSIのセッション層・プレゼンテーション層は、TCP/IPモデルではトランスポート層に対応する"
      - "OSIのアプリケーション層・プレゼンテーション層・セッション層の3層は、TCP/IPモデルではまとめてアプリケーション層として扱われる"
      - "OSIの物理層は、TCP/IPモデルには対応する層が存在しない"
      - "OSIのネットワーク層は、TCP/IPモデルのトランスポート層に対応する"
    answerIndex: 1
    explanation: "TCP/IPモデルはOSIの7層を実務向けに4層へ整理したもので、OSIのL5〜L7(セッション・プレゼンテーション・アプリケーション)はTCP/IPモデルのアプリケーション層にまとめて対応します。"

  - question: "カプセル化の過程で、送信元・宛先IPアドレスが格納されるヘッダーが付与されるのはどの層か。"
    choices:
      - "アプリケーション層"
      - "トランスポート層(TCP/UDPヘッダー)"
      - "インターネット層(IPヘッダー)"
      - "ネットワークインターフェース層(イーサネットヘッダー)"
    answerIndex: 2
    explanation: "送信元・宛先IPアドレスはインターネット層で付与されるIPヘッダーに格納されます。トランスポート層のヘッダーにはポート番号、ネットワークインターフェース層のヘッダーにはMACアドレスが格納されます。"

  - question: "異なるサブネット宛の通信で、ARPで直接解決せずデフォルトゲートウェイにまず送られる理由として正しいものはどれか。"
    choices:
      - "ARPは同一LAN内でしか使えず、異なるネットワーク宛の通信はルーティングテーブルに基づいて次ホップへ転送する必要があるため"
      - "ARPはTCP接続が確立した後でなければ動作しない仕組みになっているため"
      - "異なるサブネット宛のMACアドレスは常に固定のブロードキャストアドレスになるため"
      - "デフォルトゲートウェイだけが例外的にARPテーブルを保持できる仕様になっているため"
    answerIndex: 0
    explanation: "ARPは同一LAN内でIPアドレスとMACアドレスを対応づける仕組みです。異なるネットワーク宛の通信は、まずデフォルトゲートウェイ(ルーター)に送られ、そこからルーティングテーブルに基づいて次ホップへ転送されます。"

  - question: "TCPとUDPの違いに関する記述のうち、誤っているものはどれか。"
    choices:
      - "TCPは3ウェイハンドシェイクで事前に接続を確立するが、UDPは事前準備なしに送信できる"
      - "TCPには輻輳制御があるが、UDPにはない"
      - "TCPは常にUDPより優れているため、速度が求められる用途でもTCPを使うべきである"
      - "UDPは到達確認や順序保証を提供しない"
    answerIndex: 2
    explanation: "TCPとUDPは優劣ではなく用途による使い分けの関係です。信頼性より低遅延・高速性を優先する用途(リアルタイム動画・音声、DNSなど)ではUDPが適切な選択であり、「常にTCPが優れている」というのは誤りです。"

  - question: "「pingが通れば通信は正常だ」という主張に対する最も適切な指摘はどれか。"
    choices:
      - "正しい。ICMPが通れば、TCP/UDPの通信も必ず成功する"
      - "誤り。pingはICMPというプロトコルを使った疎通確認であり、TCP/UDPの特定ポートでの通信可否までは保証しない"
      - "誤り。pingはTCPの3ウェイハンドシェイクを内部的に行っているため、UDP通信の確認には使えない"
      - "正しい。ただしIPv6の場合に限り、ICMPとTCP/UDPの結果が食い違うことがある"
    answerIndex: 1
    explanation: "pingはICMPによる疎通確認に過ぎず、TCP/UDPの特定ポートでの通信可否は別に確認する必要があります。ICMPは通るがTCPの特定ポートは閉じている、というケースは実務で頻繁に発生します。"

  - question: "OSがカーネルパニックに陥った状態の説明として、最も正確なものはどれか。"
    choices:
      - "デッドロックにより処理が進まなくなる状態で、キーボード入力やディスプレイ表示は生きていることが多い"
      - "カーネルが「これ以上安全に処理を続けられない」と自ら判断し、意図的に全処理を停止する自己防衛的な状態である"
      - "NICドライバとは無関係に、常にディスクI/Oの輻輳によってのみ発生する"
      - "OSがフリーズしても、ネットワークスタックの処理だけは独立して継続される"
    answerIndex: 1
    explanation: "カーネルパニックは、カーネルが不正なメモリアクセスや内部データ構造の矛盾などを検知し、被害拡大を防ぐために意図的に全処理を停止する自己防衛的な停止です。選択肢Aの説明はハングアップ(デッドロック)の特徴です。"

  - question: "PMTUDブラックホールが発生する仕組みとして正しいものはどれか。"
    choices:
      - "送信元がDFフラグを立てて大きなパケットを送るが、経路上のルーターは分割せずICMP「Fragmentation Needed」を返そうとするものの、そのICMPメッセージが経路上のどこかで遮断され送信元にフィードバックが届かず、パケットが無言で破棄され続ける"
      - "送信元がDFフラグを立てないため、経路上のすべてのルーターが自動的にパケットを分割してしまう"
      - "MTUが大きすぎるルーターが経路上に存在すると、TCPの輻輳制御アルゴリズムが誤作動してスループットが低下する"
      - "PMTUDはUDP通信にのみ影響する仕組みであり、TCP通信では発生しない"
    answerIndex: 0
    explanation: "DFフラグ付きの大きなパケットに対し、経路上のルーターが送り返すはずのICMP「Fragmentation Needed」がファイアウォール等で遮断されると、送信元はサイズ超過を知る手段を失い、パケットが黙って失われ続けます。これがPMTUDブラックホールです。"

  - question: "BBR輻輳制御アルゴリズムがCUBICと比べて有利とされる典型的な環境として、最も適切なものはどれか。"
    choices:
      - "有線LANで、パケットロスがほぼ発生しない安定した低遅延回線"
      - "パケットロスが輻輳と無関係に発生しやすいWi-Fi環境や、高遅延・高帯域の大陸間通信のような経路"
      - "輻輳制御自体を無効化してもよい、閉域網内のみの通信"
      - "IPv6のみを使用するネットワーク"
    answerIndex: 1
    explanation: "CUBICはロスが起きるまで送信量を増やす手探り型のため、ロスと輻輳が一致しない環境や、フィードバックに時間がかかる高遅延環境で本来の実力を発揮しにくい弱点があります。BBRは実測の帯域・RTTからモデルベースで送信量を決めるため、こうした環境で有利とされます。"

  - question: "NICのオフロード機能・カーネルバイパスに関する記述のうち、正しいものはどれか。"
    choices:
      - "TSO(TCP Segmentation Offload)は、TCPのセグメント化処理をCPUではなくNICハードウェア自身に肩代わりさせる機能である"
      - "カーネルバイパス(DPDKなど)は、OSのネットワークスタック内部の処理を並列化することで高速化する技術である"
      - "オフロード機能を有効にすると、必ずTCPの暗号化機能が無効になる"
      - "カーネルバイパスは、NICドライバの割り込み処理を高頻度化することで実現されている"
    answerIndex: 0
    explanation: "TSOはTCPのセグメンテーション処理をNICハードウェアに肩代わりさせるオフロード機能です。カーネルバイパスはOSのネットワークスタックそのものを経由せず、ユーザー空間から直接NICを操作してレイテンシを削る技術であり、内部処理の並列化とは異なります。"
