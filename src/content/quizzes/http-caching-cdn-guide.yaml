questions:
  - question: "HTTP時代にプロキシキャッシュがどのように機能していたかについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "プロキシは通過するHTTPレスポンスの中身を読み取り、複数の異なるユーザーからの同じURLへのリクエストに対して、1度取得したコンテンツを使い回すことができた"
      - "プロキシは常にすべてのコンテンツをローカルディスクではなく、必ずクラウドサーバーにのみ保存していた"
      - "プロキシキャッシュは、HTTP時代であっても一切機能しなかった"
      - "プロキシキャッシュは、1人のユーザーの端末上でのみ完結する仕組みだった"
    answerIndex: 0
    explanation: "HTTP(暗号化されていない通信)の時代、プロキシは通過するHTTPレスポンスの中身(URL、レスポンスボディ、Cache-Controlヘッダーなど)をそのまま読み取ることができ、複数の異なるユーザーからの同じURLへのリクエストに対して、1度取得したコンテンツを使い回す、共有キャッシュとして機能していました。"

  - question: "HTTPSの普及によってプロキシキャッシュが機能しなくなった理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "HTTPSでは通信全体が暗号化されるため、SSLインスペクションを行わない一般的なプロキシは、レスポンスの中身を読み取ることができずキャッシュ可能かどうかも判別できなくなったため"
      - "HTTPSの通信速度が、HTTPより物理的に極端に遅くなったため"
      - "HTTPSでは、そもそもプロキシサーバーを経由すること自体が技術的に不可能になったため"
      - "HTTPSの普及により、ブラウザキャッシュの機能自体が完全に廃止されたため"
    answerIndex: 0
    explanation: "HTTPSでは通信全体が暗号化されるため、SSLインスペクションを行わない一般的なプロキシの構成では、暗号化された通信の中身を一切読み取ることができません。そのレスポンスがキャッシュ可能かどうか、どのURLに対する応答かさえ判別できないため、共有キャッシュとしての役割が実質的に機能しなくなりました。"

  - question: "ブラウザキャッシュがHTTPS化の影響を受けない理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ブラウザキャッシュは、そもそもインターネットに接続されていない環境でのみ動作するため"
      - "ブラウザ自身がHTTPS通信の終端(復号する側)そのものであるため、サーバーから返ってきたレスポンスを復号した後の平文の状態で内容を読み取ることができる"
      - "ブラウザキャッシュは、プロキシとは異なり暗号化されたデータをそのまま保存する仕組みであるため"
      - "ブラウザキャッシュは、常にサーバー側で一元管理されており、クライアント側には一切保存されないため"
    answerIndex: 1
    explanation: "ブラウザ自身は、HTTPS通信の終端(復号する側)そのものであるため、サーバーから返ってきたレスポンスを復号した後の、平文の状態で内容を読み取れます。したがってCache-Controlヘッダーなどを解釈してローカルディスクにキャッシュを保存する動作は、HTTPSであっても変わらず機能し続けます。"

  - question: "CDNがHTTPS環境でも問題なくキャッシュ・配信できる理由について、記事の説明に最も合致するものはどれか。"
    choices:
      - "CDNは、SSLインスペクションを常に強制的に実施しているため"
      - "CDNはコンテンツ提供者自身が契約・管理する仕組みであり、提供者側がコンテンツとTLS証明書を管理する主体として、正規のTLS終端そのものを担うため"
      - "CDNは、HTTPS通信を自動的にHTTPへダウングレードして処理しているため"
      - "CDNは、法律上プロキシとは異なる特別な暗号化免除が適用されているため"
    answerIndex: 1
    explanation: "CDNは、コンテンツを提供する側(Webサイトの運営者)自身が契約し、自社のコンテンツをエッジサーバーへあらかじめキャッシュさせておく仕組みです。提供者側がコンテンツとTLS証明書を管理する主体として正規のTLS終端そのものを担うため、HTTPS環境でも技術的な障害なくキャッシュ・配信できます。"

  - question: "プロキシキャッシュの終焉とCDNの普及の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "プロキシキャッシュの終焉とCDNの普及は、まったく無関係の偶然の出来事である"
      - "利用者側が構築する共有キャッシュ(プロキシ)から、提供者側が構築する共有キャッシュ(CDN)へと、キャッシュによる高速化・帯域節約という役割そのものが、HTTPS化を境に主体を変えて引き継がれていった歴史的な変化として理解できる"
      - "CDNが普及したことが原因で、プロキシキャッシュが機能しなくなった"
      - "プロキシキャッシュとCDNは、常に同時に併用しなければ機能しない、相互依存の関係にある"
    answerIndex: 1
    explanation: "プロキシキャッシュの終焉とCDNの普及は表裏一体の関係にあります。HTTPS化によって利用者側のプロキシキャッシュが機能しなくなった一方、提供者側のCDNが同様の高速化・帯域節約の役割を代替するようになった、という歴史的な遷移として整理できます。"
