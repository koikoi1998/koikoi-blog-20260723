questions:
  - question: "「Active Directory」を名乗る5つの役割(AD DS/AD CS/AD FS/AD LDS/AD RMS)の関係について、記事の説明に最も合致するものはどれか。"
    choices:
      - "AD DSの機能を段階的に拡張したバージョン違いであり、上位互換の関係にある"
      - "ディレクトリサービスという共通の設計思想・ブランドを共有しているだけで、目的も実装もまったく異なる独立した製品である"
      - "5つとも同じLDAPディレクトリの実体であり、名前が違うだけで中身は同一である"
      - "AD DSをインストールすると、残り4つも自動的に有効化される"
    answerIndex: 1
    explanation: "これらは1つの技術の派生形ではなく、ディレクトリサービスという共通の設計思想・ブランド名を共有しているだけの、目的も実装もまったく異なる5つの独立した製品です。AD DS上の情報を「信頼の起点」として利用する、という共通パターンで結びついています。"

  - question: "AD LDSがAD DSと決定的に異なる点について、記事の説明に最も合致するものはどれか。"
    choices:
      - "AD LDSはAD DSの機能を削減した劣化版であり、用途は完全に重複している"
      - "AD LDSはドメイン・フォレストへの参加を一切必要とせず、独自スキーマを持つ複数インスタンスを1台に同居させられる"
      - "AD LDSはLDAPプロトコルを使わない、まったく別のディレクトリ技術である"
      - "AD LDSはAD DSよりも大規模な組織向けに設計された上位版である"
    answerIndex: 1
    explanation: "AD LDSは、ドメインやフォレストへの参加を一切必要としない独立したディレクトリのインスタンスです。1台のサーバー上に、アプリケーションごとに複数の独立したインスタンスを同時に稼働させることができ、それぞれが独自のスキーマを持てます。"

  - question: "AD FSと、AD DSのフォレスト間トラストの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "両者はまったく同じ仕組みであり、呼び方が違うだけである"
      - "フォレスト間トラストはKerberos/NTLMという同じ認証プロトコルの世界の中で信頼範囲を広げる仕組みだが、AD FSはSAMLやOAuth/OIDCといった別の標準に変換して組織の外へ引き渡す"
      - "AD FSはオンプレミス限定の技術であり、外部のSaaSアプリケーションとは連携できない"
      - "フォレスト間トラストの方が、AD FSよりも新しく高機能な技術である"
    answerIndex: 1
    explanation: "フォレスト間トラストは、あくまで同じKerberos/NTLMという認証プロトコルの世界の中で信頼するフォレストの範囲を広げる仕組みです。一方AD FSは、SAMLやOAuth/OIDCといった別の標準に変換して社外へ引き渡すため、相手が同じActive Directoryを使っている必要すらありません。"

  - question: "AD FSとAD RMSの、現在の製品戦略上の位置づけについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "どちらも今後さらに機能強化が予定されている、Microsoftの主力製品である"
      - "AD FSは新機能投資がMicrosoft Entra IDに移っており、AD RMSは非推奨でMicrosoft Purview Information Protectionへの移行が推奨されている"
      - "AD FSは既に完全に廃止されており、現在は利用できない"
      - "AD RMSはAD FSよりも新しい技術であり、AD FSの後継として開発された"
    answerIndex: 1
    explanation: "AD FSはサポートが継続されているものの新機能の投資はMicrosoft Entra ID側に集中しており、AD RMSは非推奨(legacy)の位置づけで、新機能の追加は計画されておらず、クラウド版のMicrosoft Purview Information Protectionへの移行が推奨されています。"

  - question: "AD RMSが解決しようとしている課題について、記事の説明に最も合致するものはどれか。"
    choices:
      - "誰がADにログインできるかを制御する、認証そのものの仕組みである"
      - "ファイルへのアクセスが許可された後に、そのファイルで何をしていいか(印刷・転送・コピーの可否など)を制御し、そのルールをファイル自体に埋め込んで持ち出し後も有効にし続ける"
      - "証明書を発行して、通信の暗号化に使う仕組みである"
      - "複数のディレクトリインスタンスを1台のサーバーに同居させる仕組みである"
    answerIndex: 1
    explanation: "AD RMSは「誰がアクセスできるか」ではなく「アクセスできた後に何をしていいか」を制御する役割です。ファイルを暗号化し、印刷・転送・コピーの可否といったルールをファイル自体に埋め込むことで、ファイルが社内ネットワークの外に持ち出された後もルールが有効であり続けます。"
