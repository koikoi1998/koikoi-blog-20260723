questions:
  - question: "DNSSECとTSIGが、それぞれ証明する対象の違いとして正しいのはどれか。"
    choices:
      - "両者は完全に同じものを証明しており、違いはない"
      - "DNSSECはデータの真正性を、TSIGは特定の2者間の通信そのものを証明する"
      - "DNSSECは通信を、TSIGはデータを証明する"
      - "両者とも、証明という概念自体を持たない"
    answerIndex: 1
    explanation: "DNSSECは「このデータは、ゾーンの所有者が署名した正当なデータである」ことを証明し、TSIGは「この特定の2者間でやり取りされた通信が改ざんされていない」ことを証明する、証明する対象そのものが異なる仕組みです。"

  - question: "TSIGの鍵配布に関する記述として正しいのはどれか。"
    choices:
      - "DNSプロトコル自体が、鍵配布を自動的に行ってくれる"
      - "鍵配布はプロトコルの対象外であり、管理者が帯外で、両方のサーバーへ同じ共有シークレットを配布する必要がある"
      - "鍵配布は、DNSSECの署名プロセスに組み込まれている"
      - "TSIGには、そもそも鍵という概念が存在しない"
    answerIndex: 1
    explanation: "TSIGの鍵配布そのものはプロトコルの仕様の対象外であり、管理者がプライマリとセカンダリの両方へ、同じ共有シークレットを、あらかじめ帯外で配布しておく必要があります。"

  - question: "DNSSECだけではゾーン転送を保護できない理由として正しいのはどれか。"
    choices:
      - "DNSSECは、ゾーン転送という概念自体をサポートしていないから"
      - "DNSSECは署名されたデータを保護するが、グルーレコードの保護対象外であり、転送そのものへのアクセス制御も行わないから"
      - "DNSSECは、常にゾーン転送を完全に無効化してしまうから"
      - "DNSSECは、TSIGよりも処理速度が遅いから"
    answerIndex: 1
    explanation: "DNSSECが保護しているのは署名されたレコードのデータそのものであり、グルーレコードや署名されていないレコードは保護対象外です。そしてDNSSECは、誰がゾーン転送を要求してよいかというアクセス制御の仕組みでもありません。"

  - question: "DNSSECとTSIGの、実務における正しい関係として正しいのはどれか。"
    choices:
      - "どちらか一方だけを選ぶべきであり、両方を使うことは無意味である"
      - "競合する選択肢ではなく、組み合わせて使うことで、それぞれの保護できない範囲を補い合う"
      - "TSIGが完全に不要になった、古い技術である"
      - "両者は、技術的に同一のプロトコルである"
    answerIndex: 1
    explanation: "DNSSECとTSIGは、どちらか一方を選ぶものではなく、組み合わせて使うことで、それぞれが保護できない範囲を補い合う、補完的な役割を持つ仕組みです。"

  - question: "TSIGが、不特定多数との認証に向いていない理由として正しいのはどれか。"
    choices:
      - "TSIGは、暗号化アルゴリズムとして弱すぎるから"
      - "共有シークレットを事前に帯外で配布する必要があり、相手の数が増えるほど鍵の組み合わせ数が急増してしまうから"
      - "TSIGは、1台のサーバーにしか対応していないから"
      - "TSIGは、インターネット経由の通信に対応していないから"
    answerIndex: 1
    explanation: "TSIGは共有シークレットを事前に帯外で配布する必要があり、特定の少数のサーバー間での認証には向いていますが、不特定多数との認証には鍵の組み合わせ数が急増してしまい、現実的ではありません。"
