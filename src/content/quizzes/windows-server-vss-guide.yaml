questions:
  - question: "シャドウコピーが、実際にどう動作しているか、正しいのはどれか。"
    choices:
      - "スケジュールのたびに、ボリューム全体を丸ごと複製している"
      - "作成直後は複製を一切持たず、元のボリュームへの書き込みが発生するたびに、変更される直前のブロックだけを退避する"
      - "ファイルを常時、別のサーバーへ転送している"
      - "ファイルを暗号化して、別の領域へ保存している"
    answerIndex: 1
    explanation: "シャドウコピーは、作成直後はほぼ何もデータを保持せず、元のボリュームへの書き込みが発生するたびに、変更される直前のブロックだけが、コピーオンライトによって退避されます。"

  - question: "ユーザーが「以前のバージョン」タブで過去の状態を選んだとき、Windowsが行っていることとして正しいのはどれか。"
    choices:
      - "そのファイルの、完全に独立した複製を、あらかじめ保存しておいたものを、そのまま表示する"
      - "現在のファイルの内容と、退避されている変更前のブロックを組み合わせて、その時点の完全な内容を、その場で再構成する"
      - "ファイルサーバーを、過去の時点の状態へ完全にロールバックする"
      - "何も処理せず、常に最新の内容だけを表示する"
    answerIndex: 1
    explanation: "Windowsは、現在のファイルの内容と、シャドウコピー専用領域に退避されている変更前のブロックを組み合わせて、その時点でのファイルの完全な内容を、その場で再構成しています。"

  - question: "シャドウコピーのスナップショットが作成されるタイミングとして正しいのはどれか。"
    choices:
      - "ファイルが変更されるたびに、常時リアルタイムで作成される"
      - "既定では、1日2回のような、決まったスケジュールで作成される"
      - "ユーザーがファイルを開くたびに作成される"
      - "一度だけ作成され、二度と更新されない"
    answerIndex: 1
    explanation: "シャドウコピーは、ファイルへの変更を常時記録しているのではなく、既定では1日2回のような、決まったスケジュールでスナップショットが作成されます。"

  - question: "シャドウコピーが、本来のバックアップの代わりにならない理由として正しいのはどれか。"
    choices:
      - "シャドウコピーは、容量を一切消費しないため"
      - "シャドウコピーは、元のボリュームと同じ物理ディスク上に保存されており、ディスクそのものの故障には対応できないため"
      - "シャドウコピーは、ユーザーが操作できないため"
      - "シャドウコピーは、ファイルサーバーにしか存在しない機能であるため"
    answerIndex: 1
    explanation: "シャドウコピーは元のボリュームと同じ物理ディスク上に保存されているため、ディスクそのものの故障には対応できず、本来のバックアップの代わりにはなりません。"

  - question: "シャドウコピーの仕組みと、発想として共通する、別の記事で扱った仕組みとして正しいのはどれか。"
    choices:
      - "DNS増幅攻撃への防御(RRL)"
      - "LVMスナップショットのコピーオンライト"
      - "Kerberos認証のチケット発行"
      - "GPOの優先順位の評価"
    answerIndex: 1
    explanation: "シャドウコピーは、LVMスナップショットと同じ、コピーオンライトという発想(変更前のブロックだけを、必要になった時点で退避する)で動作しています。"
