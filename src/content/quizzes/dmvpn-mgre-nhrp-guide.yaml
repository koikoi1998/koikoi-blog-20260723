questions:
  - question: "従来の拠点間VPNが抱える、拠点数が増えたときの運用上の重荷として正しいのはどれか。"
    choices:
      - "暗号化アルゴリズムを、拠点ごとに変更する必要がある"
      - "拠点ごとに、ハブ側で個別のトンネル設定を追加する必要がある"
      - "拠点ごとに、異なるIPsecのバージョンを使う必要がある"
      - "拠点数が増えても、運用上の重荷は一切発生しない"
    answerIndex: 1
    explanation: "従来のIPsec拠点間VPNでは、新しい拠点を1つ追加するたびに、ハブ側でその拠点専用のトンネル設定を個別に追加する必要があり、これがスケーラビリティの壁になります。"

  - question: "mGRE(multipoint GRE)の役割として正しいのはどれか。"
    choices:
      - "拠点ごとに、個別のトンネルインターフェースを用意する"
      - "ハブ側に、たった1つのトンネルインターフェースだけを用意し、複数の拠点からの接続をまとめて受け付ける"
      - "暗号化そのものを行う"
      - "DNSによる名前解決を行う"
    answerIndex: 1
    explanation: "mGREは、ハブ側に1つだけのトンネルインターフェースを用意し、そのインターフェースが複数の拠点からの接続をまとめて受け付ける仕組みです。"

  - question: "NHRP(Next Hop Resolution Protocol)の役割として正しいのはどれか。"
    choices:
      - "仮想的なトンネルIPアドレスと、各拠点の実際の公開IPアドレスとの対応関係を、動的に管理する"
      - "パケットの暗号化アルゴリズムを決定する"
      - "拠点間の帯域幅を自動的に調整する"
      - "VLANのタグ付けを行う"
    answerIndex: 0
    explanation: "NHRPは、DMVPNの仮想的なトンネルIPアドレスと、各拠点の実際の公開IPアドレスとの対応関係を、動的に管理する仕組みです。"

  - question: "DMVPNのPhase 1の挙動として正しいのはどれか。"
    choices:
      - "スポーク間の直接トンネルが、常に自動的に成立する"
      - "すべての通信が必ずハブを経由し、スポーク間の直接トンネルは成立しない"
      - "暗号化が一切行われない"
      - "NHRPが使われない"
    answerIndex: 1
    explanation: "Phase 1では、すべての通信が必ずハブを経由し、スポーク間の直接トンネルは成立しません。"

  - question: "Phase 2とPhase 3の、経路集約における決定的な違いとして正しいのはどれか。"
    choices:
      - "Phase 2もPhase 3も、経路の集約ができない"
      - "Phase 2はネクストホップの情報を保持するため経路の集約ができないが、Phase 3はNHRPリダイレクトにより経路の集約が可能"
      - "Phase 2もPhase 3も、経路の集約が常に可能"
      - "Phase 3では、ハブ自体が不要になる"
    answerIndex: 1
    explanation: "Phase 2はネクストホップの情報を保持するため経路の集約ができませんが、Phase 3はNHRPリダイレクトの仕組みにより、経路の集約が可能になります。"
