questions:
  - question: "Viaヘッダーに関する正しい記述はどれか。"
    choices:
      - "クライアントの本当のIPアドレスを記録する、非標準のヘッダーである"
      - "リクエストやレスポンスが経由したプロキシの情報を記録する、HTTP仕様自身が定義した標準ヘッダーである"
      - "プロキシの認証情報を暗号化して格納するヘッダーである"
      - "キャッシュの有効期限だけを記録するヘッダーである"
    answerIndex: 1
    explanation: "Viaヘッダーは、リクエストやレスポンスが実際にどのプロキシを経由したかを記録する、HTTP仕様(RFC 7230/9110)自身が定義している標準のヘッダーです。"

  - question: "複数のプロキシを経由した場合、Viaヘッダーがどう変化するかとして正しいのはどれか。"
    choices:
      - "最後に経由したプロキシの情報だけが残り、それ以前の情報は上書きされる"
      - "各プロキシが自分自身の情報を追記していき、カンマ区切りで経路の履歴が積み重なる"
      - "Viaヘッダー自体が、2つ目のプロキシを経由した時点で削除される"
      - "複数のプロキシを経由すると、Viaヘッダーは常に空になる"
    answerIndex: 1
    explanation: "各プロキシは、メッセージを転送する際、自分自身の情報をViaヘッダーへ追記していくため、複数のプロキシを経由すると、カンマ区切りで経路の履歴が積み重なっていきます。"

  - question: "Viaヘッダーが転送ループの検出に使える理由として正しいのはどれか。"
    choices:
      - "Viaヘッダーには、ループを自動的に切断する暗号鍵が含まれているから"
      - "プロキシが、受け取ったリクエストのViaヘッダーに自分自身の識別子が既に含まれているかを確認できるから"
      - "Viaヘッダーは、常に一定の長さに固定されているから"
      - "ループが発生すると、Viaヘッダー自体が自動的に消去されるから"
    answerIndex: 1
    explanation: "プロキシは、受け取ったリクエストのViaヘッダーに、自分自身の識別子がすでに含まれているかどうかを確認することで、意図しない転送ループを検出できます。"

  - question: "ViaヘッダーとX-Forwarded-Forの、目的の違いとして正しいのはどれか。"
    choices:
      - "両者は、まったく同じ情報を記録する、単なる別名である"
      - "X-Forwarded-Forはクライアントの身元を、Viaヘッダーは経由した経路を記録する、別々のヘッダーである"
      - "Viaヘッダーの方が、常にX-Forwarded-Forより新しい技術である"
      - "X-Forwarded-Forは、HTTP仕様自身が定義した標準ヘッダーである"
    answerIndex: 1
    explanation: "X-Forwarded-Forはクライアントの本当のIPアドレスを記録するために使われ、Viaヘッダーはメッセージが経由したプロキシ自身の情報とプロトコルバージョンを記録する、目的の異なる別々のヘッダーです。"

  - question: "一部の実装でViaヘッダーだけに基づくループ検出が不十分になり得る理由として正しいのはどれか。"
    choices:
      - "Viaヘッダーという仕組み自体が、技術的にまったく機能していないから"
      - "一部の実装がViaヘッダーを別の目的にも利用しているため、ループ検出専用のCDN-Loopのような別ヘッダーの定義が進んでいるから"
      - "Viaヘッダーは、1つのプロキシしか経由できない制約を持つから"
      - "ループ検出には、常にDNSの設定変更が必要だから"
    answerIndex: 1
    explanation: "一部の実装はViaヘッダーを本来のループ検出以外の目的にも利用しているため、CDN事業者間では、ループ検出専用のCDN-Loopという別の新しいヘッダーを定義する動きが進んでいます。"
