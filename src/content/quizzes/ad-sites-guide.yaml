questions:
  - question: "AD DSにおける「サイト」の実体について、記事の説明に最も合致するものはどれか。"
    choices:
      - "ドメインやフォレストと同じ、認証・セキュリティの境界を表す仕組みである"
      - "IPサブネットの集まりと、そのサブネットに紐づくDCの一覧という、帯域の細い回線で区切られた拠点の境界を表す対応表である"
      - "DCのハードウェア性能をグループ分けするための仕組みである"
      - "ユーザーアカウントの所属部署を表すための仕組みである"
    answerIndex: 1
    explanation: "サイトは、帯域が細い・低速な回線を挟んだ拠点の境界をAD DSに教えるための論理的なグループ分けであり、実体はIPサブネットの集まりとそのサブネットに紐づくDCの一覧という対応表です。ドメインやフォレストのような認証・セキュリティの境界とは無関係です。"

  - question: "あるサブネットがどのサイトにも登録されていない場合、そのサブネットに属するクライアントやDCはどう扱われるか。"
    choices:
      - "AD DSへの接続自体ができなくなる"
      - "既定のサイトである Default-First-Site-Name に所属しているとみなされる"
      - "自動的に最も近いサイトが新規作成され、そこに割り当てられる"
      - "エラーになり、手動で修正するまでログオンできなくなる"
    answerIndex: 1
    explanation: "サブネットがどのサイトにも登録されていない場合、そのサブネットのクライアント・DCは既定のサイトであるDefault-First-Site-Nameに所属しているとみなされます。これにより、本来最も近いはずの拠点DCではなく、遠隔地のDCへ優先的に問い合わせてしまう実務上のトラブルにつながります。"

  - question: "サイト内レプリケーションとサイト間レプリケーションの違いについて、記事の説明に最も合致するものはどれか。"
    choices:
      - "両方とも同じ変更通知ベースで動作し、速度に違いはない"
      - "サイト内は変更通知ベースでほぼ即時、サイト間は既定でスケジュールベース(最短15分間隔)という設計上の違いがある"
      - "サイト間レプリケーションの方がサイト内より高速に動作するよう設計されている"
      - "サイト内・サイト間ともに、管理者が毎回手動で同期を実行しない限り複製されない"
    answerIndex: 1
    explanation: "サイト内レプリケーションは変更通知ベースで、最初の相手には約15秒後、以降3秒間隔で通知される、ほぼ即時の仕組みです。一方サイト間レプリケーションは既定ではスケジュールベースで、最短でも15分間隔という、帯域を圧迫しないための意図的に間引かれた設計になっています。"

  - question: "KCC・ISTG・ブリッジヘッドサーバーの役割について、記事の説明に最も合致するものはどれか。"
    choices:
      - "これらはすべて管理者が手動で設定しなければならない項目であり、自動化される部分は一切ない"
      - "KCCがレプリケーショントポロジーを自動計算し、サイト間ではISTGが選出したブリッジヘッドサーバーが拠点の代表として複製を担うことで、拠点間の回線負荷を抑えている"
      - "ISTGはユーザーアカウントのパスワードポリシーを管理する役割である"
      - "ブリッジヘッドサーバーは、フォレスト内で唯一FSMOを保持できるDCのことである"
    answerIndex: 1
    explanation: "KCCが複製トポロジーを自動計算し、サイト間ではISTGがサイトリンクコストをもとに複製経路を計算し、ブリッジヘッドサーバーを自動選出します。拠点内の全DCが個別に他拠点と通信するのではなく、ブリッジヘッドサーバーだけが代表として複製することで、拠点間の回線負荷を抑えています。"

  - question: "複数の経路で拠点間が接続されている場合の「サイトリンクコスト」の使い方について、記事の説明に最も合致するものはどれか。"
    choices:
      - "コストの数値が大きいほど優先され、複製経路として選ばれる"
      - "コストの数値が小さいほど優先され、回線速度が速く安定している経路ほど低いコスト値を設定するのが基本方針である"
      - "サイトリンクコストは表示専用の情報であり、実際の複製経路の決定には使われない"
      - "サイトリンクコストは1つのサイトにつき1つしか設定できない"
    answerIndex: 1
    explanation: "サイトリンクコストは数値が小さいほど優先され、ISTGはこの値をもとに最小コストで全サイトへ到達できる経路を計算します。回線速度が速く安定している経路ほど低いコスト値を設定するのが基本方針で、専用線に低いコスト、バックアップ用VPN経路に高いコストを設定することで、障害時のみ自動的にバックアップ経路が使われる構成が実現できます。"
