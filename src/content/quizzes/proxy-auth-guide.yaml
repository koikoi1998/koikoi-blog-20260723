questions:
  - question: "407 Proxy Authentication Requiredというステータスコードが、401とは別に用意されている理由として正しいのはどれか。"
    choices:
      - "407は404と同じ意味を持つため"
      - "認証を要求しているのが、最終的なWebサーバーなのか、経路上のプロキシ自身なのかを、クライアントが区別できるようにするため"
      - "407はHTTPSでのみ使用できるステータスコードであるため"
      - "407は、サーバーが過負荷であることを示すため"
    answerIndex: 1
    explanation: "407は、認証を要求しているのがプロキシ自身であることを示す、401とは別のステータスコードです。"

  - question: "Basic認証がHTTPS経由でなければ安全ではない理由として正しいのはどれか。"
    choices:
      - "Base64エンコードは暗号化ではなく、単なる符号化であり、簡単に元に戻せるため"
      - "Basic認証はパスワードを一切送信しないため"
      - "Basic認証はTCP接続単位でしか機能しないため"
      - "Basic認証はKerberosより新しい方式であるため"
    answerIndex: 1
    explanation: "Base64は暗号化ではなく符号化であるため、暗号化されていない経路では実質的に平文と同じです。"

  - question: "NTLM認証が「TCP接続単位」で認証状態を維持することが、ロードバランサー環境で問題を引き起こす理由として正しいのはどれか。"
    choices:
      - "NTLM認証は、常にUDPを使用するため"
      - "ロードバランサーがリクエストごとに異なるバックエンドプロキシへ振り分けると、接続単位での状態維持という前提と衝突するため"
      - "NTLM認証は、HTTPSを使用できないため"
      - "NTLM認証は、1つのクライアントからの接続を二重にカウントしてしまうため"
    answerIndex: 1
    explanation: "リクエストごとに異なるバックエンドへ振り分けられると、接続単位で認証状態を維持するNTLMの前提が崩れます。"

  - question: "Kerberos認証の最大の特徴として正しいのはどれか。"
    choices:
      - "パスワードを暗号化して毎回送信する"
      - "パスワードそのものも、そこから導出された値も、ネットワーク上に一切流さない"
      - "Basic認証よりも設定が簡単である"
      - "HTTPSなしでは一切使用できない"
    answerIndex: 1
    explanation: "Kerberos認証は、チケットを提示する方式であり、パスワードに関する情報を一切ネットワーク上に流しません。"

  - question: "Basic・NTLM・Kerberosの違いを理解する上で、最も適切な視点はどれか。"
    choices:
      - "どの方式が最も処理速度が速いか"
      - "パスワードという機密情報を、ネットワーク上にどこまで出すことを許容するかという、段階的な設計判断の違い"
      - "どの方式が最も新しく開発されたか"
      - "どの方式が最も多くのCPUリソースを消費するか"
    answerIndex: 1
    explanation: "3つの方式は、パスワードをどこまでネットワーク上に露出させるかという、段階的な設計判断の違いとして理解できます。"
