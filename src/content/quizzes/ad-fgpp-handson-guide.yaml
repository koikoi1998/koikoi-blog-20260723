questions:
  - question: "Default Domain Policyのパスワードポリシーは、ドメイン内でどのように適用されるか。"
    choices:
      - "OUごとに異なる設定を適用できる"
      - "ドメイン全体にただ1つだけ適用され、通常のGPOのようにOU単位で使い分けられない"
      - "ユーザーごとに個別に設定できる"
      - "グループごとに自動的に異なる設定が割り当てられる"
    answerIndex: 1
    explanation: "Default Domain Policyのパスワードポリシー関連の設定は、通常のGPOの継承・優先順位のルールに従わず、ドメイン全体にただ1つだけ適用されます。"

  - question: "PSO(きめ細かいパスワードポリシー)を直接適用できる対象はどれか。"
    choices:
      - "OU(組織単位)"
      - "ユーザーまたはグローバルセキュリティグループ"
      - "サイト"
      - "フォレスト全体"
    answerIndex: 1
    explanation: "PSOはユーザーまたはグローバルセキュリティグループにのみ適用できます。OUに直接リンクすることはできません。"

  - question: "OU単位でPSOを管理したい場合、実務上どのような方法が使われるか。"
    choices:
      - "PSOを直接OUにリンクする"
      - "そのOU配下のユーザーを含む、PSO適用専用のシャドーグループを用意する"
      - "OUごとに別のドメインを作成する"
      - "PSOではなくGPOを使うしかない"
    answerIndex: 1
    explanation: "PSOはOUに直接リンクできないため、そのOU配下のユーザーを含むシャドーグループと呼ばれる専用のグローバルグループを用意して、そこにPSOを適用します。"

  - question: "同じユーザーに複数のPSOが適用可能な場合、最終的にどのPSOが適用されるか。"
    choices:
      - "すべてのPSOの設定がマージされて適用される"
      - "最も厳しい設定を持つPSOが自動的に選ばれる"
      - "Precedenceの数値が最も小さい、たった1つのPSOだけが適用される"
      - "最後に作成されたPSOが適用される"
    answerIndex: 2
    explanation: "複数のPSOが適用可能な場合でもマージは行われず、Precedenceの数値が最も小さい、たった1つのPSOだけが適用されます。"

  - question: "PSOのPrecedenceの数値と優先順位の関係について、正しいものはどれか。"
    choices:
      - "数値が大きいほど優先順位が高い"
      - "数値が小さいほど優先順位が高い"
      - "数値の大小は優先順位に関係しない"
      - "数値が同じ場合は両方とも適用される"
    answerIndex: 1
    explanation: "PSOのPrecedenceは、数値が小さいほど優先順位が高いというルールになっています。これは通常のGPOのリンク順の直感とは異なるルールです。"
