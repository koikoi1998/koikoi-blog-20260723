questions:
  - question: "`gather_facts`が裏側で実際に行っている処理はどれか。"
    choices:
      - "ローカルマシン上でのみ情報を計算する"
      - "対象ホストへSSH接続し、Pythonスクリプト(setupモジュール)を実行して情報を収集する"
      - "AWSのAPIに問い合わせて情報を取得する"
      - "インベントリファイルの内容をそのまま読み込むだけ"
    answerIndex: 1
    explanation: "gather_factsは対象ホストへSSH接続したうえで、setupモジュールというPythonスクリプトを実際に実行し、数百項目の情報を収集しています。"

  - question: "`gathering = smart`を設定する目的は何か。"
    choices:
      - "すべてのホストのfacts収集を常にスキップするため"
      - "キャッシュが有効かつ新しい場合には、facts収集そのものをスキップするため"
      - "facts収集の速度を強制的に遅くするため"
      - "インベントリの読み込み順序を変更するため"
    answerIndex: 1
    explanation: "gathering = smartにすることで、有効なキャッシュが存在する場合はfacts収集をスキップし、実行時間を短縮できます。"

  - question: "`fact_caching_timeout`が指定する秒数を過ぎるとどうなるか。"
    choices:
      - "Playbook全体の実行がエラーになる"
      - "キャッシュが自動的に無効化され、facts収集が再度実行される"
      - "キャッシュファイルが自動的に削除され、二度と使えなくなる"
      - "何も起こらず、古い情報がそのまま使われ続ける"
    answerIndex: 1
    explanation: "設定した秒数を過ぎると、キャッシュは自動的に無効とみなされ、facts収集が再度実行されて内容が更新されます。"

  - question: "ファクトキャッシュに伴うリスクとして正しい説明はどれか。"
    choices:
      - "リスクは一切存在しない"
      - "キャッシュされた情報が対象ホストの実際の最新状態と異なってしまう可能性がある"
      - "キャッシュを使うとPlaybookの実行が必ず失敗する"
      - "キャッシュを使うとSSH接続自体ができなくなる"
    answerIndex: 1
    explanation: "TTLの期間中に対象ホストの構成が変わった場合、キャッシュされた古い情報を参照するタスクが誤った判断をする可能性があります。"

  - question: "TTLの値を決める際の実務上の考え方として最も適切なのはどれか。"
    choices:
      - "常に最短の値に設定する"
      - "対象システムの構成変更の頻度に応じて、コストとリスクのバランスを取って調整する"
      - "常に最長の値に設定する"
      - "TTLはAnsibleが自動的に最適な値を計算するため、手動設定は不要"
    answerIndex: 1
    explanation: "facts収集の重いコストと、キャッシュが古くなるリスクを天秤にかけ、構成変更の頻度に応じてTTLを調整することが実務上のポイントです。"
