questions:
  - question: "IAMの評価ロジックにおける大原則として正しいのはどれか。"
    choices:
      - "明示的に拒否されていない操作は、すべて許可される"
      - "明示的に許可されていない操作は、すべて拒否される(既定拒否)"
      - "ポリシーを1つも設定していないユーザーは、すべての操作ができる"
      - "許可と拒否は、常にランダムに決定される"
    answerIndex: 1
    explanation: "IAMの評価ロジックの大原則は、既定拒否(Implicit Deny)であり、明示的に許可されていない操作はすべて拒否されます。"

  - question: "アイデンティティベースポリシーとリソースベースポリシーの関係として正しいのはどれか。"
    choices:
      - "どちらか一方だけが評価され、もう一方は無視される"
      - "両方が同時に評価対象になり、どちらかで許可されていなければアクセスできない"
      - "リソースベースポリシーはS3にしか存在しない"
      - "アイデンティティベースポリシーの方が常に優先される"
    answerIndex: 1
    explanation: "アイデンティティベースポリシーとリソースベースポリシーは、両方が同時に評価対象になります。"

  - question: "パーミッションバウンダリの役割として正しいのはどれか。"
    choices:
      - "通常のポリシーと同じように、権限を追加するものである"
      - "IAMエンティティが持てる権限の上限を定義するものである"
      - "リソースベースポリシーの別名である"
      - "SCPと完全に同じ仕組みである"
    answerIndex: 1
    explanation: "パーミッションバウンダリは、IAMユーザーやロールが持てる権限の上限を定義する仕組みであり、それ自体が権限を付与するものではありません。"

  - question: "明示的なDenyについて正しい説明はどれか。"
    choices:
      - "他のAllowポリシーの数が多ければ、Denyより優先される"
      - "どのポリシーの種類に存在していても、他のすべてのAllowに優先して、その操作を拒否する"
      - "Denyはアイデンティティベースポリシーにしか設定できない"
      - "Denyは実務上ほとんど使われることがない"
    answerIndex: 1
    explanation: "明示的なDenyは、アイデンティティベースポリシー・リソースベースポリシー・パーミッションバウンダリ・SCPのどこに存在していても、他のすべてのAllowに優先します。"

  - question: "SCP(サービスコントロールポリシー)について正しい説明はどれか。"
    choices:
      - "個々のIAMユーザーにのみ適用される、パーミッションバウンダリの別名である"
      - "AWS Organizationsでアカウント全体に対する上限を設定する仕組みである"
      - "IAMポリシーとは無関係の、課金に関する設定である"
      - "SCPは常にすべての操作を許可する"
    answerIndex: 1
    explanation: "SCPは、複数のAWSアカウントを組織で管理している場合に、アカウント全体に対する上限を設定する仕組みです。"
