questions:
  - question: "アクセス制限を一切設定せずに構築したプロキシが、どのような状態になるかについて正しいのはどれか。"
    choices:
      - "自動的にキャッシュ機能だけが無効化される"
      - "送信元を問わず、誰からでも中継を依頼できる「オープンプロキシ」になる"
      - "インターネットから、一切アクセスできなくなる"
      - "HTTPS通信だけを拒否するようになる"
    answerIndex: 1
    explanation: "アクセス制限を設定しないと、送信元を問わず誰でも中継を依頼できる、オープンプロキシになってしまいます。"

  - question: "オープンプロキシの、本当の危険性として正しいのはどれか。"
    choices:
      - "プロキシサーバー自身のディスク容量が増加すること"
      - "第三者が、このプロキシを踏み台として、身元(IPアドレス)を隠しながら別のサーバーへ不正アクセスすること"
      - "プロキシの応答速度が、常に遅くなること"
      - "プロキシの設定ファイルが、自動的に削除されること"
    answerIndex: 1
    explanation: "オープンプロキシの本当の危険性は、第三者が身元を隠しながら別のサーバーへ不正アクセスする踏み台として悪用されることです。"

  - question: "Squidの`acl allowed_network src 192.168.1.0/24`という設定が行っていることとして正しいのはどれか。"
    choices:
      - "そのIPアドレス範囲からの通信を、暗号化する"
      - "そのIPアドレス範囲からの通信を、allowed_networkという名前で識別するよう定義する"
      - "そのIPアドレス範囲を、インターネットから隔離する"
      - "そのIPアドレス範囲のキャッシュ容量を、拡張する"
    answerIndex: 1
    explanation: "aclは、指定したIPアドレス範囲からの通信を、指定した名前で識別するための定義です。"

  - question: "アクセス制御のルールにおいて、「最後に明示的な拒否ルールが必要」とされる理由として正しいのはどれか。"
    choices:
      - "拒否ルールがないと、サーバーが起動しないため"
      - "ルールは上から順に評価されるため、想定した許可ルールにどの送信元もマッチしなかった場合の挙動を、明示的に定義しておく必要があるため"
      - "拒否ルールは、ログの出力量を減らすためだけに使われるため"
      - "拒否ルールがないと、常にすべての通信が自動的に拒否されるため"
    answerIndex: 1
    explanation: "許可ルールにマッチしなかった場合の最終的な挙動を、明示的な拒否ルールで定義しておく必要があります。"

  - question: "オープンプロキシのリスク構造が、他のどの技術と共通しているか、正しいのはどれか。"
    choices:
      - "RAID5のパリティ計算"
      - "DNS増幅攻撃への防御(RRL)や、メールのオープンリレー対策"
      - "Gitのコミットの仕組み"
      - "NTFSのレジデント属性"
    answerIndex: 1
    explanation: "「サービスを第三者に無制限に開放してしまう構成が容易に生まれる」という構造は、プロキシ・DNS・メールといった中継型サービスに共通しています。"
