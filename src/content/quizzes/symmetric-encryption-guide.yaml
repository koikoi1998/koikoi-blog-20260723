questions:
  - question: "共通鍵暗号(AES)の特徴として、記事の内容に最も合致するものはどれか。"
    choices:
      - "暗号化と復号に別々の鍵(公開鍵・秘密鍵)を使い、計算コストは公開鍵暗号より低い"
      - "暗号化と復号に同じ1つの鍵を使い、公開鍵暗号に比べて計算コストが低いため大量データの高速暗号化に向く"
      - "暗号化と復号に同じ鍵を使うが、計算コストは公開鍵暗号より高い"
      - "AESはブロック単位ではなく、データ全体を一度に暗号化する"
    answerIndex: 1
    explanation: "共通鍵暗号は暗号化・復号に同じ鍵を使い、公開鍵暗号より計算コストが低いため、TLSの実データやVPNのトンネル内容など大量データの高速暗号化に使われます。AESはブロック単位(128ビット)で処理するブロック暗号です。"

  - question: "AESの雪崩効果(Avalanche Effect)が指すものとして、記事の説明に最も合致するものはどれか。"
    choices:
      - "鍵長が長いほど暗号化速度が速くなる性質"
      - "1ビットの入力の違いが出力全体に無関係に波及する性質"
      - "同じ平文を暗号化すると常に同じ暗号文になる性質"
      - "パディングが不要になる性質"
    answerIndex: 1
    explanation: "雪崩効果とは、1ビットの入力の違いが出力全体に無関係に波及する性質で、置換(SubBytes)と拡散(ShiftRows/MixColumns)を繰り返すことで実現されます。これにより暗号文から平文や鍵を統計的に推測することが困難になります。"

  - question: "ECBモードが実務でほぼ使われない理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "処理速度が他のモードより極端に遅いから"
      - "同じ平文ブロックが常に同じ暗号文ブロックになり、元データの繰り返しパターンが暗号文に透けて見えてしまうから"
      - "IVを必要とするため実装が複雑になるから"
      - "ブロック長が可変で標準化されていないから"
    answerIndex: 1
    explanation: "ECBモードは各ブロックを独立して同じ鍵で暗号化するため、同じ平文ブロックは常に同じ暗号文ブロックになります。これにより元データのパターンが暗号文に透けて見える弱点があり、「ECBペンギン」の例で知られています。"

  - question: "CBCモードでIV(初期化ベクトル)が果たす役割として、記事の説明に最も合致するものはどれか。"
    choices:
      - "受信者を認証するための秘密の鍵として使われる"
      - "最初のブロックに「前のブロックの代わり」としてXORされ、同じ平文でも毎回異なる暗号文になるようにする"
      - "パディングの長さを示す数値として使われる"
      - "暗号化アルゴリズムそのもの(AESかどうか)を識別するための値"
    answerIndex: 1
    explanation: "CBCモードでは最初のブロックに「前のブロックの結果」が存在しないため、代わりにIVをXORします。IVを毎回変えることで、同じ平文・同じ鍵でも毎回異なる暗号文になり、ECBのパターン漏洩問題が解消されます。"

  - question: "CTRモードにおいて「絶対に守らなければならない条件」として記事が挙げているものはどれか。"
    choices:
      - "平文の長さを必ずブロックサイズの倍数にすること"
      - "同じ鍵で「nonce+カウンタ」の組み合わせを二度と使い回さないこと"
      - "IVを毎回秘密にして送らないこと"
      - "必ずCBCモードと組み合わせて使うこと"
    answerIndex: 1
    explanation: "CTRモードは鍵ストリームを平文とXORする方式のため、同じ鍵で同じ「nonce+カウンタ」を再利用すると、2つの暗号文のXORから両方の平文の関係が漏れてしまい、安全性が完全に崩壊します。"

  - question: "HMACが「単純なハッシュ値」と異なり改ざん検知に使える理由として、記事の説明に最も合致するものはどれか。"
    choices:
      - "HMACは常にAESで暗号化されているから"
      - "共有鍵を計算に組み込むことで、その鍵を知らない攻撃者には改ざん後の正しいHMAC値を計算し直せないから"
      - "HMACはハッシュ関数を使わず、公開鍵暗号だけで計算されるから"
      - "HMAC値は毎回ランダムに変化し、再現できないから"
    answerIndex: 1
    explanation: "単純なハッシュ値は誰でも計算し直せるため、攻撃者が改ざん後にハッシュ値を付け替えれば検知できません。HMACは送受信者だけが知る共有鍵を計算に組み込むことで、鍵を知らない攻撃者が正しいHMAC値を偽造できないようにしています。"

  - question: "AEAD(認証付き暗号、AES-GCMなど)の特徴として、記事の説明に最も合致するものはどれか。"
    choices:
      - "暗号化と改ざん検知(認証)を1つのアルゴリズムの中で同時に行い、暗号化しない付加データも含めて認証タグに組み込める"
      - "暗号化のみを行い、改ざん検知は別途HMACを組み合わせなければ実現できない"
      - "常にECBモードをベースに構成されている"
      - "nonceの再利用があっても安全性に影響しない設計になっている"
    answerIndex: 0
    explanation: "AEADは暗号化(GCMの場合はCTRモード相当)と認証タグの生成(GHASH)を1つのアルゴリズムで行い、暗号化しないヘッダーなどの付加データも含めて完全性を保証できます。nonceの再利用はGCMでも致命的です。"

  - question: "Encrypt-then-MAC・MAC-then-Encrypt・Encrypt-and-MACの3方式のうち、記事が「現在最も安全とされる方式」としているものはどれか。"
    choices:
      - "MAC-then-Encrypt"
      - "Encrypt-and-MAC"
      - "Encrypt-then-MAC"
      - "3方式とも安全性に優劣はない"
    answerIndex: 2
    explanation: "Encrypt-then-MACは、受信側が復号する前に暗号文に対するMAC検証で改ざんの有無を確認でき、改ざんされたデータを復号処理に渡さずに済むため、パディングオラクル攻撃のような復号処理の挙動差を突く攻撃への根本的な対策になります。"

  - question: "IV/nonceの取り扱いに関する誤解として、記事が明確に否定しているものはどれか。"
    choices:
      - "IV/nonceは秘密にする必要がある"
      - "CTR/GCMではnonceを同じ鍵の下で重複させてはならない"
      - "CBCのIVには予測不可能性が求められる場面がある"
      - "IV/nonceは暗号文と一緒に平文で送られるのが一般的である"
    answerIndex: 0
    explanation: "IV/nonceの多くは秘密にする必要はなく、暗号文と一緒に平文で送られるのが一般的です。重要なのは予測不可能性(CBC)や重複しないこと(CTR/GCM)であり、秘匿性そのものではありません。"
