items:
  - question: "sudo journalctl -u bind9 | grep transferを実行しても、何も表示されません。dig自体は正しい結果を返しています"
    answer: "digの結果が正しければ、ゾーン転送自体は成功しています。journalctlに何も表示されない主な原因は、(1) grepの検索語がログの実際の表記(大文字小文字)と一致していない、(2) 最小構成のUbuntuサーバーではrsyslogが入っておらず、named独自のsyslog経由のログがjournalctlへ完全には転記されていない、(3) Ubuntuのnamedパッケージに付属するAppArmorプロファイルが、ログ出力先へのアクセスを一部制限している、の3つです。まずはgrepの大文字小文字を無視するsudo journalctl -u bind9 | grep -i transferを試し、それでも出ない場合はsudo journalctl -u bind9 --no-pager | tail -50でログ全体を確認してください。いずれにせよ、digで正しいレコードが返ってきていれば、ゾーン転送は機能しており、心配する必要はありません。"

  - question: "named-checkzoneを実行すると、unexpected end of lineやunexpected end of inputというエラーが出ます"
    answer: "多くの場合、ゾーンファイルの1行目の先頭に、意図しない記号(]など)が紛れ込んでいることが原因です。ターミナルの出力をコピー&ペーストする際に、プロンプトの一部やコピー範囲がずれた文字が一緒に入り込んでしまうことがよくあります。cat -A <ゾーンファイル名>を実行すると、通常は見えない制御文字も含めてファイルの中身を確認できるので、1行目に余計な文字が入っていないかをまず疑ってください。エラーメッセージの<ファイル名>:<行番号>:という部分は、実際にエラーが起きている場所を正確に示しているので、そこを重点的に確認するのが近道です。"

  - question: "シリアル番号を正しく上げたのに、リフレッシュ間隔(3600秒)を待たずにすぐスレーブへ反映されました。なぜですか"
    answer: "これは正常な挙動です。BINDには、マスターの更新をスレーブへ能動的に知らせるNOTIFYという仕組みが既定で有効になっており、リフレッシュ間隔を待たずにほぼ即座にゾーン転送が発生します。リフレッシュ間隔は、あくまでNOTIFYが何らかの理由で届かなかった場合の、保険としてのポーリング間隔です。"
    link:
      url: "/articles/dns-server-handson-guide"
      label: "NOTIFYの仕組みを本文の「プロが見ている視点」で詳しく見る"

  - question: "dig以外に、nslookupというコマンドもあると聞きました。何が違うのでしょうか"
    answer: "digとnslookupは、どちらもDNSへ問い合わせるコマンドですが、digの方がより詳細な情報(TTLやフラグなど)を表示でき、スクリプトでの利用にも向いています。nslookupは対話モードを持ち、Windows環境にも標準で入っているため、Windows/Linux両方で共通のコマンドとして使える利点があります。それぞれの使い方の違いは、別記事で詳しく扱っています。"
    link:
      url: "/articles/dig-nslookup-guide"
      label: "digとnslookupの使い方・使い分けを見る"
