items:
  - question: "chmod 600の「600」という数字はどういう意味ですか?"
    answer: "所有者(通常root)のみ読み書き可、それ以外のユーザーは読み取りすら不可、という意味です。read=4・write=2・execute=1の合計を所有者/グループ/その他の3区分ぶん並べた数値表記です。"
    link:
      url: "/articles/linux-file-permissions-guide"
      label: "パーミッション(chmod)の仕組みを詳しく見る"

  - question: "Proxmox VEでVMがなかなか起動しない・動作が重いときはどうすればいいですか?"
    answer: "多くの場合、ホストCPUの仮想化支援機能(Intel VT-x/AMD-V)がBIOS/UEFIで無効化されており、QEMUがソフトウェアエミュレーション(低速)にフォールバックしていることが原因です。BIOS/UEFI設定で該当機能が有効になっているか確認してください。"
    link:
      url: "/articles/proxmox-internals-guide"
      label: "KVM/QEMUの仕組みを詳しく見る"

  - question: "iptablesで許可したルールは、サーバーを再起動しても保持されますか?"
    answer: "いいえ、netfilterへ登録されたルールはカーネルのメモリ上の状態であり、デフォルトでは再起動すると消えます。iptables-persistentパッケージやiptables-save/iptables-restoreで明示的に永続化する必要があります。"
    link:
      url: "/articles/linux-iptables-guide"
      label: "iptables(netfilter)の仕組みを詳しく見る"

  - question: "net.ipv4.ip_forward = 1を/etc/sysctl.confに書いたのに反映されません"
    answer: "/etc/sysctl.confはカーネルが直接読むファイルではなく、sysctl -pを実行するか再起動して初めて/proc/sysへ反映されます。ファイルを保存しただけでは稼働中のカーネルには反映されません。"
    link:
      url: "/articles/linux-sysctl-guide"
      label: "sysctlとprocfsの仕組みを詳しく見る"

  - question: "IKEフェーズ1(6往復)・フェーズ2(3往復)という回数は必ず固定ですか?"
    answer: "理論上の基本的な回数です。実装やリトライ、ネットワーク状況によって前後することがあります。本文の検証1では、実際のキャプチャで理論値通りになっているかを確認する手順を扱っています。"

  - question: "WAN側のインターフェース名(eth0など)がわからないときはどうすればいいですか?"
    answer: "ip route show defaultを実行すると、default via <ゲートウェイ> dev <インターフェース名>という形式で表示されます。このdevの後ろの値が、iptablesコマンドで置き換えるべきインターフェース名です。"

  - question: "このハンズオンを始める前に何を準備すればいいですか?"
    answer: "Proxmox VEでのVM作成、OSインストール、sudo apt update・sudo su -・nanoの基本操作に不慣れな場合は、先に準備マニュアルを読んでおくとスムーズです。"
    link:
      url: "/articles/handson-prep-guide"
      label: "ハンズオン準備マニュアルを見る"

  - question: "エラーが起きたとき、strongSwan(ipsec)・xl2tpd(l2tp)・pppdのどのログをどの順番で見ればいいですか?"
    answer: "接続はIKE(ipsec)→L2TPトンネル/セッション(xl2tpd)→PPP認証(pppd)の順に確立するので、切り分けもこの順番で進めるのが効率的です。まず sudo ipsec statusall でIKE/IPsec SAが上がっているかを確認し、上がっていなければ journalctl -u strongswan-starter を見ます。SAは上がっているのに ppp0 が出てこない場合は journalctl -u xl2tpd、それでも原因が分からなければ journalctl -t pppd(pppdはsystemdユニットではなくsyslogの識別子でログを出すため -t で絞り込みます)を確認します。サーバー側・クライアント側どちらも同じ考え方で追えるので、両方のホストで同じ時刻帯のログを突き合わせると原因を特定しやすくなります。"
    link:
      url: "/articles/linux-journalctl-guide"
      label: "journalctlでエラーログを調査する方法を見る"

  - question: "ipsec upでNO_PROPOSAL_CHOSENが出て、ike=の値からスペースを消してクライアントを再起動しても直らないのはなぜですか?"
    answer: "strongSwanの暗号スイート一覧(ike=/esp=)はカンマ区切りで厳密にパースされるため、カンマの後に空白が入っていると「不正なアルゴリズム名」として扱われ、その提案(プロポーザル)全体が拒否されNO_PROPOSAL_CHOSENになります。厄介なのは、設定ファイルを直接編集しても稼働中のcharonデーモンには即座に反映されない点と、失敗したネゴシエーションの状態がデーモン内に残ってしまう場合がある点です。クライアント側だけ設定を直して再起動しても、サーバー側が古い状態(あるいは以前の失敗したネゴシエーションの痕跡)を持ったままだと再度失敗することがあり、結局サーバー側も含めて両方を再起動して初めて、双方が新しい設定でクリーンな状態から鍵交換をやり直す形になり解消します。設定ファイルを編集したら、片側だけでなく両側を sudo ipsec restart(または systemctl restart strongswan-starter)しておくと、この種の問題を避けやすくなります。"

  - question: "Windows Serverで接続すると「リモート コンピューターへの接続を確立できなかったので、この接続に使われたポートは閉じています」と表示されます"
    answer: "サーバー側のpppdログに couldn't find any suitable secret (password) が出ている場合、原因は/etc/ppp/chap-secretsに該当ユーザーの認証情報が見つからないことです。本記事のchap-secretsはサーバー名フィールドを*にしているため、クライアント名(ユーザー名)とパスワードさえ正しいエントリを追加すれば、Linuxクライアントと同じファイルでWindowsクライアントも認証できます。Windowsの接続設定画面で入力したユーザー名・パスワードと、chap-secretsのエントリが一致しているか確認してください。"
