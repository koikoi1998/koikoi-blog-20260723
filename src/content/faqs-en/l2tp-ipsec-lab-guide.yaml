items:
  - question: "What does the \"600\" in chmod 600 actually mean?"
    answer: "It means only the owner (usually root) can read or write the file — everyone else gets no access, not even read. It's a numeric notation: the sum of read=4/write=2/execute=1, one digit each for owner/group/other."
    link:
      url: "/en/articles/linux-file-permissions-guide"
      label: "Learn more about how permissions (chmod) work"

  - question: "A VM in Proxmox VE is slow to boot or feels sluggish — what should I check?"
    answer: "In most cases, the host CPU's virtualization support (Intel VT-x/AMD-V) is disabled in BIOS/UEFI, and QEMU has fallen back to slow software emulation. Check whether that setting is enabled in your BIOS/UEFI."
    link:
      url: "/en/articles/proxmox-internals-guide"
      label: "Learn more about how KVM/QEMU works"

  - question: "Do the iptables rules I allowed survive a server reboot?"
    answer: "No — rules registered with netfilter live in the kernel's memory, and by default they're gone after a reboot. You need to explicitly persist them with the iptables-persistent package, or iptables-save/iptables-restore."
    link:
      url: "/en/articles/linux-iptables-guide"
      label: "Learn more about how iptables (netfilter) works"

  - question: "I wrote net.ipv4.ip_forward = 1 into /etc/sysctl.conf, but it's not taking effect"
    answer: "The kernel doesn't read /etc/sysctl.conf directly — it only applies to /proc/sys once you run sysctl -p or reboot. Saving the file alone doesn't affect the running kernel."
    link:
      url: "/en/articles/linux-sysctl-guide"
      label: "Learn more about sysctl and procfs"

  - question: "Is IKE Phase 1 (6 round trips) and Phase 2 (3 round trips) always exactly that number?"
    answer: "That's the theoretical baseline. It can vary slightly based on the implementation, retries, and network conditions. Verification 1 in the main article walks through confirming this against an actual packet capture."

  - question: "How do I find the WAN-side interface name (like eth0) if I don't know it?"
    answer: "Run ip route show default. It prints something like default via <gateway> dev <interface name> — the value after dev is the interface name to substitute in your iptables commands."

  - question: "What should I prepare before starting this hands-on lab?"
    answer: "If you're not yet comfortable creating a VM in Proxmox VE, installing an OS, or the basics of sudo apt update / sudo su - / nano, reading the prep manual first will make this lab much smoother."
    link:
      url: "/en/articles/handson-prep-guide"
      label: "Read the hands-on prep manual"

  - question: "When something breaks, which logs should I check — strongSwan (ipsec), xl2tpd (l2tp), or pppd — and in what order?"
    answer: "A connection comes up in the order IKE (ipsec) → L2TP tunnel/session (xl2tpd) → PPP authentication (pppd), so troubleshoot in that same order. First run sudo ipsec statusall to see if the IKE/IPsec SA is up; if not, check journalctl -u strongswan-starter. If the SA is up but ppp0 never appears, check journalctl -u xl2tpd next, and if that still doesn't explain it, check journalctl -t pppd (pppd isn't a systemd unit — it logs under a syslog identifier, so filter with -t). The same logic applies on both the server and the client, and lining up logs from both hosts around the same timestamp makes it much easier to pin down the actual cause."
    link:
      url: "/en/articles/linux-journalctl-guide"
      label: "See how to investigate error logs with journalctl"

  - question: "ipsec up gives NO_PROPOSAL_CHOSEN, and removing the spaces from ike= plus restarting the client alone doesn't fix it — why?"
    answer: "strongSwan's cipher-suite lists (ike=/esp=) are parsed strictly on commas, so a space after a comma gets treated as part of an invalid algorithm name, and that whole proposal gets rejected — hence NO_PROPOSAL_CHOSEN. Two things make this confusing: editing the config file doesn't instantly take effect on the already-running charon daemon, and state from a previously failed negotiation can linger inside the daemon. If you only fix and restart the client, the server may still be holding onto stale state (or an old config), so it fails again — restarting strongSwan on both sides, so both start a clean negotiation from the new config, is what actually resolves it. As a habit, restart strongSwan (sudo ipsec restart, or systemctl restart strongswan-starter) on both ends whenever you edit ipsec.conf, not just the side you changed."

  - question: "Connecting from Windows Server fails with \"The remote computer could not be reached... the port used for this connection is closed\""
    answer: "If the server's pppd log shows couldn't find any suitable secret (password), the cause is that /etc/ppp/chap-secrets has no matching entry for that user. Since this article's chap-secrets uses * for the server-name field, adding an entry with the correct client name (username) and password lets a Windows client authenticate through the exact same file as the Linux client. Double-check that the username/password you entered in Windows' connection settings matches an entry in chap-secrets."
